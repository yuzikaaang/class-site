# ============================================================
# 自动发布到 GitHub Pages
# ------------------------------------------------------------
# 作用：master 有新提交时，自动把「该公开的文件」复制到 gh-pages 分支，
#       Pages 从 gh-pages 出页面，避免 internal/ 等内部文件被公网访问。
#
# 站主只需配一次：Settings → Pages → Source 改成 gh-pages 分支。
# 之后每次 push 全自动，无需手动同步。
#
# ⚠️ 若以后新增了站点要用的文件（新图片夹、新页面等），
#    要同步加进下面的 SOURCE_FILES，否则不会被发布。
# ============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # 允许在 Actions 页面手动点一下重新发布（应急用）
  workflow_dispatch:

# 让 workflow 有权限推送到 gh-pages 分支
permissions:
  contents: write

# 同一时间只跑一个，避免并发推送打架
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 与文件顶部的 permissions 一致，这里再声明一次做双保险：
    # 部分情况下 workflow 级声明会被仓库的默认权限设置顶掉，
    # job 级显式声明更容易生效。
    permissions:
      contents: write

    steps:
      - name: 拉取 master 分支完整内容
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 挑出上线文件到独立目录
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site

          # ------------------------------------------------------------
          # 这行决定「哪些东西会上线」。
          # 只列站点运行必需的文件与目录，其余（api/ internal/ backup/
          # source/ 等）一律不复制，从而不会出现在线上。
          #
          # 用数组而不是空格分隔的字符串，避免不同 shell 对词分割的处理差异。
          # ------------------------------------------------------------
          SOURCE_FILES=(
            index.html
            admin.html
            sw.js
            manifest.webmanifest
            favicon.svg
            icon-192.png
            icon-512.png
            qrcode.jpg
            games
            homework
          )

          for f in "${SOURCE_FILES[@]}"; do
            if [ -e "$f" ]; then
              cp -r "$f" _site/
              echo "  ✅ 发布 $f"
            else
              echo "  ⚠️  跳过（不存在）：$f"
            fi
          done

          # 生成 .nojekyll，告诉 GitHub Pages 不要用 Jekyll 处理
          # （否则以下划线开头的文件/目录会被忽略）
          touch _site/.nojekyll

          echo "---- 上线目录内容 ----"
          ls -la _site/

          # ------------------------------------------------------------
          # 发布内容自检
          # ------------------------------------------------------------
          # 背景：曾经出现过 Actions 显示 success、gh-pages 分支却停在旧版本
          # 的情况（线上跑的是几个月前的存档页），排查成本很高。
          # 这里把关键文件的大小打出来，任何异常在 Actions 日志里一眼可见。
          #
          # 校验强度分两档，避免「缺一个次要文件就整站不发」：
          #   · index.html 是站点命脉 —— 缺失或体积异常（疑似换成了历史存档版）
          #     直接判失败，宁可红着也不要发错的页面上线
          #   · 其余文件 —— 只警告，不阻断发布
          # ------------------------------------------------------------
          if [ ! -f "_site/index.html" ]; then
            echo "❌ 自检失败：发布包里没有 index.html"
            exit 1
          fi

          INDEX_SIZE=$(wc -c < _site/index.html)
          echo "  📄 index.html  ${INDEX_SIZE} 字节"
          if [ "$INDEX_SIZE" -lt 200000 ]; then
            echo "❌ 自检失败：index.html 只有 ${INDEX_SIZE} 字节，疑似误发布了历史存档版"
            echo "   参考值约 528000 字节。若确实做过大幅精简，请调低此处的阈值。"
            exit 1
          fi

          if [ -f "_site/admin.html" ]; then
            echo "  📄 admin.html  $(wc -c < _site/admin.html) 字节"
          else
            echo "  ⚠️  发布包里没有 admin.html（管理后台将无法访问）"
          fi

          echo "✅ 发布内容自检通过"

          # 上线检查：这些内部文件绝不能出现在发布包里，出现就判失败
          for forbidden in api internal backup source; do
            if [ -e "_site/$forbidden" ]; then
              echo "❌ 上线检查失败：$forbidden 不该被发布"
              exit 1
            fi
          done
          echo "✅ 上线检查通过：内部文件均未混入"

      - name: 推送到 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          # 只保留最近 1 次提交，避免 gh-pages 历史越积越大
          force_orphan: false
          commit_message: "自动发布：${{ github.event.head_commit.message }}"

      # ------------------------------------------------------------
      # 推送结果回查（重要）
      # ------------------------------------------------------------
      # 背景：曾出现过 peaceiris 这个 action 报告 success、但 gh-pages 分支
      # 实际没有更新（指针停在旧提交）的静默失败，导致线上长期跑历史存档页，
      # 排查花了很久。这里推送完直接拉一次远端 gh-pages，确认它确实动了。
      #
      # 常见失败原因：仓库 Settings → Actions → General → Workflow permissions
      # 被设为只读，此时 GITHUB_TOKEN 无写权限，推送会被丢弃。
      # ------------------------------------------------------------
      - name: 回查 gh-pages 是否真的更新了
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SHA=$(git ls-remote \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            refs/heads/gh-pages | awk '{print $1}')

          echo "  远端 gh-pages 当前 head : $REMOTE_SHA"
          echo "  本次构建的提交          : ${{ github.sha }}"

          if [ -z "$REMOTE_SHA" ]; then
            echo "❌ 回查失败：读不到 gh-pages 分支"
            exit 1
          fi

          # 取回远端内容，核对线上那份 index.html 到底是不是本次构建的产物
          git fetch --depth=1 origin gh-pages
          REMOTE_SIZE=$(git show FETCH_HEAD:index.html | wc -c)
          LOCAL_SIZE=$(wc -c < _site/index.html)
          echo "  远端 index.html 大小    : $REMOTE_SIZE 字节"
          echo "  本次发布 index.html 大小: $LOCAL_SIZE 字节"

          if [ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]; then
            echo ""
            echo "❌ 回查失败：gh-pages 上的 index.html 与本次发布的不是同一份。"
            echo "   这说明推送被静默丢弃了，线上仍会显示旧版页面。"
            echo ""
            echo "   👉 请检查：仓库 Settings → Actions → General → Workflow permissions"
            echo "      必须选 'Read and write permissions'，然后重跑本 workflow。"
            exit 1
          fi

          echo "✅ 回查通过：gh-pages 已更新为本次构建的内容"
