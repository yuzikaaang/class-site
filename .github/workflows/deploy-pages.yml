# ============================================================
# 站点发布：把白名单文件发布到 GitHub Pages
# ------------------------------------------------------------
# 2026-10-05 重写。
#
# 【为什么重写】
# 旧版用 peaceiris/actions-gh-pages 往 gh-pages 分支推，再回查、
# 失败时走「git 强推」备用通道、再回查一次，一共 286 行、6 个步骤。
# 结果：推送步骤报告 success，回查却说不一致，备用通道又报成功，
# 但 gh-pages 分支实际停在 2026-08-25 从未更新。
#
# 根因是 GITHUB_TOKEN 没有写权限时，push 会被静默丢弃，
# 脚本却察觉不到 —— 越多的「自愈」步骤，只会产出越多的误导性绿灯。
#
# 【现在的做法】
# 改用 GitHub 官方推荐的 Pages 部署链路：
#   1. 把要上线的文件收集到 _site/
#   2. upload-pages-artifact 打包成 artifact（不推送任何分支）
#   3. deploy-pages 直接发布到 Pages
#
# 好处：全程不写分支，不需要 contents: write，
#       也就不存在「没权限导致静默失败」这类问题。
#
# 【以后要加文件上线】
# 改下面的 SOURCE_FILES 数组即可，别再改别处。
# ============================================================

name: 发布站点到 GitHub Pages

on:
  push:
    branches: [master]
  # 允许在 Actions 页面手动点一下重新发布（应急用）
  workflow_dispatch:

# 发布 Pages 需要的权限：读代码 + 写 Pages + 用 OIDC 换取部署凭据
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布，避免两个部署互相覆盖
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 把本次上线内容的 sha256 传给 deploy 做回查判据（见下方「记录指纹」）
    outputs:
      index_sha: ${{ steps.fingerprint.outputs.index_sha }}
      admin_sha: ${{ steps.fingerprint.outputs.admin_sha }}
      sw_sha:    ${{ steps.fingerprint.outputs.sw_sha }}
    steps:
      - name: 拉取仓库内容
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 这步决定「哪些东西会上线」。
      #
      # 只列站点运行必需的文件与目录，其余（api/ internal/ backup/
      # source/ 等）一律不复制，从而不会出现在线上。
      # 用数组而不是空格分隔的字符串，避免不同 shell 对词分割的处理差异。
      # ------------------------------------------------------------
      - name: 收集上线文件
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site

          SOURCE_FILES=(
            index.html
            app.js
            basic.html
            share-card.js
            admin.html
            share.html
            sw.js
            manifest.webmanifest
            favicon.svg
            icon-192.png
            icon-512.png
            badge.png
            qrcode.jpg
            fonts
            games
            homework
            vendor
          )

          for f in "${SOURCE_FILES[@]}"; do
            if [ -e "$f" ]; then
              cp -r "$f" _site/
              echo "  ✅ $f"
            else
              echo "  ⚠️  跳过（不存在）：$f"
            fi
          done

          # Jekyll 会吃掉下划线开头的文件/目录，必须关掉
          touch _site/.nojekyll

          # 防呆：内部目录绝不能出现在线上
          for bad in api internal backup source node_modules .git; do
            if [ -e "_site/$bad" ]; then
              echo "❌ 内部内容混入上线目录：$bad"
              exit 1
            fi
          done

          echo ""
          echo "即将上线的文件："
          ls -la _site/

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      # ------------------------------------------------------------
      # 记录本次上线内容的指纹（sha256），供 deploy 阶段回查比对。
      #
      # 🔴 为什么用内容哈希，而不是写死的字符串：
      #    2026-10-17 排查「部署总是失败」。原来的回查是在线上 admin.html 里
      #    `grep renderProfiles` —— 而 renderProfiles 这个函数在 v2.10.0
      #    合并后台「用户管理」「资料管理」两页时已经被删掉了。于是从那一次
      #    提交起，回查**永远匹配不到**，白等 120 秒后判失败：
      #    job 是红的，线上内容其实每次都发布成功了（实测同一提交下
      #    本地与线上 admin.html 的 sha256 完全一致）。
      #    写死的判据会随代码演进腐烂，而且腐烂后表现为**假红灯**，
      #    与当年 peaceiris 那版「假绿灯」是同一类病。
      #    内容哈希不会腐烂：线上只要真的换了文件，哈希必然相等。
      # ------------------------------------------------------------
      - name: 记录本次上线内容的指纹
        id: fingerprint
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html admin.html sw.js; do
            [ -e "_site/$f" ] || { echo "❌ 上线目录里没有 $f，无法生成指纹"; exit 1; }
          done
          echo "index_sha=$(sha256sum _site/index.html | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "admin_sha=$(sha256sum _site/admin.html | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sw_sha=$(sha256sum _site/sw.js      | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "本次上线内容指纹："
          sha256sum _site/index.html _site/admin.html _site/sw.js

      - name: 打包为 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 发布完立刻回查线上真实内容，避免再次出现「job 绿了但线上没变」
      - name: 回查线上是否真的更新
        shell: bash
        env:
          WANT_INDEX: ${{ needs.build.outputs.index_sha }}
          WANT_ADMIN: ${{ needs.build.outputs.admin_sha }}
          WANT_SW:    ${{ needs.build.outputs.sw_sha }}
        run: |
          set -euo pipefail
          BASE="https://yuzikaaang.github.io/class-site"

          # 取线上文件的 sha256（取不到给个明显的错值，好让比较失败、进入重试）
          #
          # 🔴 2026-10-17 修「部署总是失败（假红灯）」的另一半原因：
          #    Pages 的响应头是 `cache-control: max-age=600`（10 分钟），
          #    部署刚完成时 CDN 边缘很可能还端着旧副本。原来直接 GET 同一个 URL，
          #    12 次 ×10 秒 = 120 秒 < 600 秒，**必然**等不到新内容 → 判失败。
          #    线上其实早就是新的（实测同一提交下本地与线上 sha256 完全一致）。
          #    解法：加随机查询串做缓存穿透 + 显式 no-cache，让边缘回源取最新的。
          live_sha() {
            local cb="cb=$(date +%s%N)-$RANDOM"
            curl -s --max-time 25 \
                 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                 "$BASE/$1?$cb" 2>/dev/null | sha256sum | cut -d' ' -f1
          }

          echo "本次发布的内容指纹："
          echo "  index.html  $WANT_INDEX"
          echo "  admin.html  $WANT_ADMIN"
          echo "  sw.js       $WANT_SW"
          echo ""
          echo "等待 Pages 生效（最多重试 18 次，每次 10 秒；已做缓存穿透）…"

          for i in $(seq 1 18); do
            GOT_INDEX=$(live_sha index.html)
            GOT_ADMIN=$(live_sha admin.html)
            GOT_SW=$(live_sha sw.js)
            MISS=""
            [ "$GOT_INDEX" = "$WANT_INDEX" ] || MISS="$MISS index.html"
            [ "$GOT_ADMIN" = "$WANT_ADMIN" ] || MISS="$MISS admin.html"
            [ "$GOT_SW"    = "$WANT_SW"    ] || MISS="$MISS sw.js"

            if [ -z "$MISS" ]; then
              echo "  第 $i 次：三个文件都与本次发布内容一致"
              echo ""
              echo "✅ 回查通过：线上跑的就是本次提交"
              exit 0
            fi
            echo "  第 $i 次：尚未更新（$MISS ）"
            sleep 10
          done

          echo ""
          echo "❌ 回查失败：等了 180 秒（已做缓存穿透），线上仍有文件与本次发布内容不一致。"
          echo "   先到 https://github.com/yuzikaaang/class-site/deployments 看『发布到 GitHub Pages』"
          echo "   这一步是成功还是失败："
          echo "   · 部署那步是绿的 → 只是回查没等到，过几分钟手动重跑一次即可（内容是新的）"
          echo "   · 部署那步是红的 → 才是真失败，看那一步的报错"
          exit 1
