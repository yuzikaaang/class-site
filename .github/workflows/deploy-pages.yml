# ============================================================
# 站点发布：把白名单文件发布到 GitHub Pages
# ------------------------------------------------------------
# 2026-10-05 重写。
#
# 【为什么重写】
# 旧版用 peaceiris/actions-gh-pages 往 gh-pages 分支推，再回查、
# 失败时走「git 强推」备用通道、再回查一次，一共 286 行、6 个步骤。
# 结果：推送步骤报告 success，回查却说不一致，备用通道又报成功，
# 但 gh-pages 分支实际停在 2026-08-25 从未更新。
#
# 根因是 GITHUB_TOKEN 没有写权限时，push 会被静默丢弃，
# 脚本却察觉不到 —— 越多的「自愈」步骤，只会产出越多的误导性绿灯。
#
# 【现在的做法】
# 改用 GitHub 官方推荐的 Pages 部署链路：
#   1. 把要上线的文件收集到 _site/
#   2. upload-pages-artifact 打包成 artifact（不推送任何分支）
#   3. deploy-pages 直接发布到 Pages
#
# 好处：全程不写分支，不需要 contents: write，
#       也就不存在「没权限导致静默失败」这类问题。
#
# 【以后要加文件上线】
# 改下面的 SOURCE_FILES 数组即可，别再改别处。
# ============================================================

name: 发布站点到 GitHub Pages

on:
  push:
    branches: [master]
  # 允许在 Actions 页面手动点一下重新发布（应急用）
  workflow_dispatch:

# 发布 Pages 需要的权限：读代码 + 写 Pages + 用 OIDC 换取部署凭据
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布，避免两个部署互相覆盖
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库内容
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 这步决定「哪些东西会上线」。
      #
      # 只列站点运行必需的文件与目录，其余（api/ internal/ backup/
      # source/ 等）一律不复制，从而不会出现在线上。
      # 用数组而不是空格分隔的字符串，避免不同 shell 对词分割的处理差异。
      # ------------------------------------------------------------
      - name: 收集上线文件
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site

          SOURCE_FILES=(
            index.html
            admin.html
            sw.js
            manifest.webmanifest
            favicon.svg
            icon-192.png
            icon-512.png
            qrcode.jpg
            games
            homework
          )

          for f in "${SOURCE_FILES[@]}"; do
            if [ -e "$f" ]; then
              cp -r "$f" _site/
              echo "  ✅ $f"
            else
              echo "  ⚠️  跳过（不存在）：$f"
            fi
          done

          # Jekyll 会吃掉下划线开头的文件/目录，必须关掉
          touch _site/.nojekyll

          # 防呆：内部目录绝不能出现在线上
          for bad in api internal backup source node_modules .git; do
            if [ -e "_site/$bad" ]; then
              echo "❌ 内部内容混入上线目录：$bad"
              exit 1
            fi
          done

          echo ""
          echo "即将上线的文件："
          ls -la _site/

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包为 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 发布完立刻回查线上真实内容，避免再次出现「job 绿了但线上没变」
      - name: 回查线上是否真的更新
        shell: bash
        run: |
          set -euo pipefail
          URL="https://yuzikaaang.github.io/class-site/admin.html"
          echo "等待 Pages 生效（最多重试 12 次，每次 10 秒）…"

          for i in $(seq 1 12); do
            CODE=$(curl -s -o /tmp/live_admin.html -w '%{http_code}' "$URL" || echo 000)
            if [ "$CODE" = "200" ]; then
              LIVE_SIZE=$(wc -c < /tmp/live_admin.html)
              echo "  第 $i 次：HTTP $CODE，线上 $LIVE_SIZE 字节"
              if grep -q "renderProfiles" /tmp/live_admin.html; then
                echo ""
                echo "✅ 回查通过：线上 admin.html 已包含本次发布的内容"
                exit 0
              fi
            else
              echo "  第 $i 次：HTTP $CODE（还没生效）"
            fi
            sleep 10
          done

          echo ""
          echo "❌ 回查失败：等了 120 秒，线上仍未出现新内容。"
          echo "   请到 https://github.com/yuzikaaang/class-site/deployments 查看部署状态。"
          exit 1
