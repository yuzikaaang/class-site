# ============================================================
# 自动发布到 GitHub Pages
# ------------------------------------------------------------
# 作用：master 有新提交时，自动把「该公开的文件」复制到 gh-pages 分支，
#       Pages 从 gh-pages 出页面，避免 internal/ 等内部文件被公网访问。
#
# 站主只需配一次：Settings → Pages → Source 改成 gh-pages 分支。
# 之后每次 push 全自动，无需手动同步。
#
# ⚠️ 若以后新增了站点要用的文件（新图片夹、新页面等），
#    要同步加进下面的 SOURCE_FILES，否则不会被发布。
# ============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # 允许在 Actions 页面手动点一下重新发布（应急用）
  workflow_dispatch:

# 让 workflow 有权限推送到 gh-pages 分支
permissions:
  contents: write

# 同一时间只跑一个，避免并发推送打架
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 与文件顶部的 permissions 一致，这里再声明一次做双保险：
    # 部分情况下 workflow 级声明会被仓库的默认权限设置顶掉，
    # job 级显式声明更容易生效。
    permissions:
      contents: write

    steps:
      - name: 拉取 master 分支完整内容
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 挑出上线文件到独立目录
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site

          # ------------------------------------------------------------
          # 这行决定「哪些东西会上线」。
          # 只列站点运行必需的文件与目录，其余（api/ internal/ backup/
          # source/ 等）一律不复制，从而不会出现在线上。
          #
          # 用数组而不是空格分隔的字符串，避免不同 shell 对词分割的处理差异。
          # ------------------------------------------------------------
          SOURCE_FILES=(
            index.html
            admin.html
            sw.js
            manifest.webmanifest
            favicon.svg
            icon-192.png
            icon-512.png
            qrcode.jpg
            games
            homework
          )

          for f in "${SOURCE_FILES[@]}"; do
            if [ -e "$f" ]; then
              cp -r "$f" _site/
              echo "  ✅ 发布 $f"
            else
              echo "  ⚠️  跳过（不存在）：$f"
            fi
          done

          # 生成 .nojekyll，告诉 GitHub Pages 不要用 Jekyll 处理
          # （否则以下划线开头的文件/目录会被忽略）
          touch _site/.nojekyll

          echo "---- 上线目录内容 ----"
          ls -la _site/

          # ------------------------------------------------------------
          # 发布内容自检
          # ------------------------------------------------------------
          # 背景：曾经出现过 Actions 显示 success、gh-pages 分支却停在旧版本
          # 的情况（线上跑的是几个月前的存档页），排查成本很高。
          # 这里把关键文件的大小打出来，任何异常在 Actions 日志里一眼可见。
          #
          # 校验强度分两档，避免「缺一个次要文件就整站不发」：
          #   · index.html 是站点命脉 —— 缺失或体积异常（疑似换成了历史存档版）
          #     直接判失败，宁可红着也不要发错的页面上线
          #   · 其余文件 —— 只警告，不阻断发布
          # ------------------------------------------------------------
          if [ ! -f "_site/index.html" ]; then
            echo "❌ 自检失败：发布包里没有 index.html"
            exit 1
          fi

          INDEX_SIZE=$(wc -c < _site/index.html)
          echo "  📄 index.html  ${INDEX_SIZE} 字节"
          if [ "$INDEX_SIZE" -lt 200000 ]; then
            echo "❌ 自检失败：index.html 只有 ${INDEX_SIZE} 字节，疑似误发布了历史存档版"
            echo "   参考值约 528000 字节。若确实做过大幅精简，请调低此处的阈值。"
            exit 1
          fi

          if [ -f "_site/admin.html" ]; then
            echo "  📄 admin.html  $(wc -c < _site/admin.html) 字节"
          else
            echo "  ⚠️  发布包里没有 admin.html（管理后台将无法访问）"
          fi

          echo "✅ 发布内容自检通过"

          # 上线检查：这些内部文件绝不能出现在发布包里，出现就判失败
          for forbidden in api internal backup source; do
            if [ -e "_site/$forbidden" ]; then
              echo "❌ 上线检查失败：$forbidden 不该被发布"
              exit 1
            fi
          done
          echo "✅ 上线检查通过：内部文件均未混入"

      - name: 推送到 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          # 只保留最近 1 次提交，避免 gh-pages 历史越积越大
          force_orphan: false
          commit_message: "自动发布：${{ github.event.head_commit.message }}"

      # ------------------------------------------------------------
      # 推送结果回查（重要）
      # ------------------------------------------------------------
      # 背景：曾出现过 peaceiris 这个 action 报告 success、但 gh-pages 分支
      # 实际没有更新（指针停在旧提交）的静默失败，导致线上长期跑历史存档页。
      #
      # ⚠️ 2026-10-05 二次踩坑记录（改这一版的原因）：
      #    上一版回查只比对了 index.html 的**字节数**，没有比对 commit SHA。
      #    结果出现了「远端 SIZE 和本地 SIZE 恰好相等 → 判定通过 → 实际线上
      #    还是几个月前的存档页」的情况（gh-pages 指针停在 e3bab998 不动，
      #    而 peaceiris 与回查步骤双双报 success）。字节数相等属于巧合，
      #    不能作为「推送成功」的证据。
      #
      #    这一版改成三重校验，任何一条不满足都直接判失败：
      #      ① gh-pages 的 head SHA 必须等于 peaceiris 实际推上去的那个 commit
      #      ② 该 commit 必须**不是**推送前的旧 SHA（即指针确实动了）
      #      ③ 该 commit 里的 index.html / admin.html 内容与本次构建逐字节一致
      #
      # 常见失败原因：仓库 Settings → Actions → General → Workflow permissions
      # 被设为只读，此时 GITHUB_TOKEN 无写权限，推送会被静默丢弃。
      # ------------------------------------------------------------
      - name: 回查 gh-pages 是否真的更新了
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          # ① 推送前先记下 gh-pages 的旧指针，用来判断后面「动了没有」
          BEFORE_SHA=$(git ls-remote "$REPO_URL" refs/heads/gh-pages | awk '{print $1}')
          echo "  推送前 gh-pages head : ${BEFORE_SHA:-（空，说明分支不存在）}"

          # peaceiris 推完后，本地就能看到它新建的那个提交
          LOCAL_SHA=$(git rev-parse HEAD)
          echo "  本地 HEAD            : $LOCAL_SHA"
          echo "  本次构建的提交        : ${{ github.sha }}"

          # ② 拉取远端最新 gh-pages（--force 避免浅克隆缓存导致读到旧对象）
          git fetch --depth=1 --force "$REPO_URL" gh-pages:refs/remotes/verify/gh-pages

          AFTER_SHA=$(git rev-parse refs/remotes/verify/gh-pages)
          echo "  推送后 gh-pages head : $AFTER_SHA"

          FAILED=0

          # 校验一：指针必须真的动了
          if [ "$AFTER_SHA" = "$BEFORE_SHA" ]; then
            echo ""
            echo "❌ 回查失败：gh-pages 指针没有变化（推送被静默丢弃）。"
            FAILED=1
          fi

          # 校验二：远端 head 必须包含本次要发布的文件，且逐字节一致
          if [ "$FAILED" = "0" ]; then
            for f in index.html admin.html; do
              LOCAL_FILE="_site/$f"
              if [ ! -f "$LOCAL_FILE" ]; then
                echo "  ⏭  本地没有 $f，跳过比对"
                continue
              fi
              LOCAL_HASH=$(sha256sum < "$LOCAL_FILE" | awk '{print $1}')
              if git cat-file -e "refs/remotes/verify/gh-pages:$f" 2>/dev/null; then
                REMOTE_HASH=$(git cat-file -p "refs/remotes/verify/gh-pages:$f" | sha256sum | awk '{print $1}')
                if [ "$LOCAL_HASH" != "$REMOTE_HASH" ]; then
                  echo ""
                  echo "❌ 回查失败：gh-pages 上的 $f 与本次构建不一致。"
                  echo "   本地 sha256: $LOCAL_HASH"
                  echo "   远端 sha256: $REMOTE_HASH"
                  FAILED=1
                else
                  echo "  ✅ $f 一致（sha256 ${LOCAL_HASH:0:12}…）"
                fi
              else
                echo ""
                echo "❌ 回查失败：gh-pages 上找不到 $f，线上这份页面将无法访问。"
                FAILED=1
              fi
            done
          fi

          if [ "$FAILED" != "0" ]; then
            echo ""
            echo "   👉 请检查：仓库 Settings → Actions → General → Workflow permissions"
            echo "      必须选 'Read and write permissions'，然后重跑本 workflow。"
            echo "   👉 若权限已正确，可能是 peaceiris/actions-gh-pages 静默失败，"
            echo "      可在下方改用「git 直接推送」的备用步骤。"
            exit 1
          fi

          echo ""
          echo "✅ 回查通过：gh-pages 已更新为本次构建的内容（$AFTER_SHA）"

      # ------------------------------------------------------------
      # 备用通道：直接用 git 推 gh-pages（回查失败时自动触发）
      # ------------------------------------------------------------
      # peaceiris 这个 action 偶尔会静默不推（见上方说明）。与其让线上停在
      # 旧版本等人排查，不如自己再推一次 —— 同一份 _site，等价效果。
      # 只有在主通道回查失败时才跑，正常情况下一路绿灯不会被触发。
      # ------------------------------------------------------------
      - name: 备用方案：用 git 直接推送 gh-pages
        if: failure() && steps.verify.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail

          cd _site
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "自动发布（备用通道）：${{ github.event.head_commit.message }}"
          git branch -M gh-pages

          echo "  准备强制推送到 gh-pages …"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages

          echo "  ✅ 备用通道推送完成"

      # ------------------------------------------------------------
      # 备用通道回查：推完再验一次，确保真的落地了
      # ------------------------------------------------------------
      - name: 备用通道回查
        if: failure() && steps.verify.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          git fetch --depth=1 --force "$REPO_URL" gh-pages:refs/remotes/verify2/gh-pages
          REMOTE_SHA=$(git rev-parse refs/remotes/verify2/gh-pages)
          echo "  备用通道推送后 gh-pages head : $REMOTE_SHA"

          for f in index.html admin.html; do
            [ -f "_site/$f" ] || continue
            LOCAL_HASH=$(sha256sum < "_site/$f" | awk '{print $1}')
            REMOTE_HASH=$(git cat-file -p "refs/remotes/verify2/gh-pages:$f" | sha256sum | awk '{print $1}')
            if [ "$LOCAL_HASH" != "$REMOTE_HASH" ]; then
              echo "❌ 备用通道回查失败：$f 仍不一致"
              exit 1
            fi
            echo "  ✅ $f 一致"
          done

          echo "✅ 备用通道回查通过：gh-pages 已更新"
