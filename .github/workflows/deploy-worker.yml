# ============================================================
# 后端部署：自动发布到 Cloudflare Workers
# ------------------------------------------------------------
# 2026-10-06 新增。
#
# 【为什么需要它】
# Workers 默认**不会**跟着 Git 仓库自动部署（那是 Pages 的能力）。
# 之前的流程是改完代码手动跑 `npx wrangler deploy`，
# 忘一次线上就一直是旧代码 —— 而本地测试全绿，看不出任何异常。
# 本轮就出过这事：`api/content.js` 的读取 bug 修好了、测试也过了，
# 但因为没 deploy，云端读取依然返回空。
#
# 【触发条件】
# 只在后端相关文件变化时跑：
#   api/**        业务代码
#   wrangler.toml 部署配置
#   package.json  依赖变化（比如换了 Neon 驱动版本）
# 前端改 index.html / admin.html 时**不会**触发 —— 后端没变，没必要重部。
# 也可以在 Actions 页面手动点「Run workflow」应急。
#
# 【前置配置（一次性，做一次就行）】
# GitHub 仓库 → Settings → Secrets and variables → Actions → New repository secret
#   CLOUDFLARE_API_TOKEN   你的 Cloudflare API Token
#   CLOUDFLARE_ACCOUNT_ID  你的 Cloudflare 账户 ID（可选，见下）
#
# 关于 ACCOUNT_ID：如果你的 Token 只在一个账号下有权限，wrangler 能自己推断，
# 可以不配；配了更稳。**两个都不配会部署失败**，工作流会给出明确提示而不是静默跳过。
# ============================================================

name: 部署后端到 Cloudflare Workers

on:
  push:
    branches: [master]
    paths:
      - 'api/**'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-worker.yml'
  # 手动触发（应急重部、或改了 secret 之后想重跑一次）
  workflow_dispatch:

# 同时只跑一个部署，避免两份代码互相覆盖
concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库内容
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 先检查必备的 secret 在不在。
      # 这一步是刻意加的：缺 secret 时 wrangler 的报错很含糊
      #（"Authentication error" 之类的），看不出到底是没配还是配错了。
      # 提前说清楚，省得对着一行报错猜半天。
      # ------------------------------------------------------------
      - name: 检查部署凭据是否齐全
        shell: bash
        # ⚠️ secret 一律走 env 传入，不在 run 里直接 ${{ }} 插值。
        #    插值的写法一旦值里含引号就会破坏 shell 语法，
        #    而且展开后的值有机会被 echo 出去、绕过 GitHub 的掩码。
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CF_TOKEN" ]; then
            echo "❌ 缺少 CLOUDFLARE_API_TOKEN"
            echo ""
            echo "去配一下（只需一次）："
            echo "  GitHub 仓库 → Settings → Secrets and variables → Actions"
            echo "  → New repository secret"
            echo ""
            echo "Token 在 Cloudflare 后台拿："
            echo "  My Profile → API Tokens → Create Token"
            echo "  模板选「Edit Cloudflare Workers」，权限范围够用且不过大"
            exit 1
          fi
          echo "✅ CLOUDFLARE_API_TOKEN 已配置"

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # wrangler 打包时要解析 @neondatabase/serverless / bcryptjs，
      # 没有 node_modules 会直接失败。
      - name: 安装依赖
        run: npm ci

      # ------------------------------------------------------------
      # 把当前 commit 写进 wrangler.toml，部署后据此核对线上版本。
      #
      # ⚠️ 这里改的是 CI 工作区里的临时副本，**不会回写仓库**
      #（本 job 没有任何 git commit / push 步骤）。
      # ------------------------------------------------------------
      - name: 写入构建标记
        shell: bash
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA:0:7}"
          echo "本次构建的 commit：$SHA"
          # 用 sed 替换而不是追加：wrangler.toml 的 [vars] 里已有 BUILD_SHA = "local"，
          # 同表追加重复键是非法 TOML，实测旧值会赢（2026-10-06 首跑踩坑：部署成功但
          # x-build-sha 停在 local）。替换 49 行那处定义，保持键唯一。
          # 用宽松匹配（行首 BUILD_SHA、任意空格、替换整行），
          # 免得哪天 wrangler.toml 那行被改动（多一个空格、换个默认值）
          # 就静默匹配不上 —— 那种情况下部署会「成功」但 build 标记停在旧值，
          # 回查步骤报失败，看日志还得猜半天（2026-10-14 踩过）。
          sed -i -E "s|^BUILD_SHA[[:space:]]*=.*$|BUILD_SHA = \"$SHA\"|" wrangler.toml
          echo "$SHA" > /tmp/build_sha.txt
          grep -n 'BUILD_SHA' wrangler.toml

      # ------------------------------------------------------------
      # 正式部署。
      # ACCOUNT_ID 用 secret 传（如果没配就是空字符串，让 wrangler 自己推断）。
      # ------------------------------------------------------------
      - name: 部署到 Cloudflare Workers
        id: deploy
        # ⚠️ 2026-10-17 v3.2.1：这一步允许失败，**由下面的回查决定 job 红不红**。
        #    原因：实测这个项目真正把 Worker 发上去的是 Cloudflare 自己的 Git 集成
        #    （线上 x-build-sha 一直是 local，且推送后 45 秒新代码就生效），
        #    而 Actions 里这步可能因 Token 权限/账户 ID 报错 —— 那种情况下
        #    线上其实已经是新代码，却因为这一步红而让整个 job 变红，白折腾。
        #    所以改成「部署失败不直接判死，回查发现线上确实是本次代码就算通过」，
        #    同时在日志与小结里把失败原因明明白白写出来（不藏）。
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # 不加 --minify：Worker 代码不多，压缩后线上日志难以阅读，
          # 排查问题时吃亏。真要优化体积再加。

      # ------------------------------------------------------------
      # 部署完立刻回查线上。
      #
      # 为什么必须有这一步：本项目在 Pages 上踩过「job 全绿、线上没变」的坑
      #（GITHUB_TOKEN 没写权限，push 被静默丢弃，脚本察觉不到）。
      # 部署这一步报成功，不等于线上真的换了代码。
      #
      # 做法：打一个不需要登录的接口，读响应头 X-Build-Sha，
      # 和本次 commit 的前 7 位比对。对得上才算真的部署成功。
      # ------------------------------------------------------------
      - name: 回查线上是否真的更新
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_OUTCOME='${{ steps.deploy.outcome }}'
          if [ "$DEPLOY_OUTCOME" != "success" ]; then
            echo "⚠️  『部署到 Cloudflare Workers』这一步没成功（outcome=$DEPLOY_OUTCOME）。"
            echo "    不急着判死：先看下面回查 —— 线上若是本次代码，说明是 Cloudflare 的 Git 集成发的，"
            echo "    那这步的失败只影响 CI 自己（建议顺手检查 CLOUDFLARE_API_TOKEN 的权限 / ACCOUNT_ID）。"
            echo ""
          fi
          WANT=$(cat /tmp/build_sha.txt)
          # 代码里带的版本号（与前台 SITE_VERSION 同步）—— 见 api/worker.mjs 的 API_VER
          WANT_VER=$(grep -oE "const API_VER = '[^']+'" api/worker.mjs | head -1 | sed -E "s/.*'([^']+)'.*/\1/")
          URL="https://api.classsite.dpdns.org/api/content"
          echo ""
          echo "期望构建标记（CI 注入）：$WANT"
          echo "期望代码版本（代码自带）：$WANT_VER"
          echo "回查地址：$URL"
          echo ""
          echo "说明：这个项目实际生效的部署有时是 Cloudflare 自己的 Git 集成跑的，"
          echo "      它不会注入我们的 BUILD_SHA（线上一直是 local），所以两个信号有一个对上就算成功。"
          echo ""

          # Workers 全球生效需要一点时间，多试几次
          for i in $(seq 1 15); do
            HDRS=$(curl -sS -D - -o /dev/null "$URL" 2>/dev/null || echo "")
            GOT_SHA=$(echo "$HDRS" | tr -d '\r' \
                      | awk -F': ' 'tolower($1)=="x-build-sha" {print $2}' | tail -1)
            GOT_VER=$(echo "$HDRS" | tr -d '\r' \
                      | awk -F': ' 'tolower($1)=="x-api-ver" {print $2}' | tail -1)

            echo "  第 $i 次：x-build-sha=${GOT_SHA:-（空）}  x-api-ver=${GOT_VER:-（空）}"

            if [ -n "$WANT" ] && [ "$GOT_SHA" = "$WANT" ]; then
              echo ""
              echo "✅ 回查通过：线上构建标记就是本次提交（$WANT），CI 部署生效"
              exit 0
            fi
            if [ -n "$WANT_VER" ] && [ -n "$GOT_VER" ] && [ "$GOT_VER" = "$WANT_VER" ]; then
              echo ""
              echo "✅ 回查通过：线上代码版本 = $WANT_VER（由 Cloudflare Git 集成部署，代码已是本次的）"
              exit 0
            fi
            sleep 8
          done

          echo ""
          echo "❌ 回查失败：等了 120 秒，线上既不是本次提交、也不是本次的代码版本。"
          echo ""
          echo "  线上实际：x-build-sha=${GOT_SHA:-（空）}  x-api-ver=${GOT_VER:-（空）}"
          echo "  本次期望：x-build-sha=$WANT  x-api-ver=$WANT_VER"
          echo ""
          echo "  排查顺序："
          echo "   1. 往上看『部署到 Cloudflare Workers』这一步是否报错（多半是 API Token 权限/账户 ID）"
          echo "   2. api.classsite.dpdns.org 这个自定义域是否指向了别的 Worker"
          echo "   3. 如果代码版本号没变，先确认这轮是不是忘了同步 API_VER（前台 SITE_VERSION 要一起改）"
          echo "   4. 只是等不及的话，过几分钟重跑这个 workflow 即可，别急着改代码"
          exit 1

      - name: 部署小结
        if: always()
        shell: bash
        run: |
          echo "## 后端部署结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 提交：\`$(cat /tmp/build_sha.txt 2>/dev/null || echo '未知')\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- wrangler 部署步骤：\`${{ steps.deploy.outcome }}\`（不等于 success 时看回查结论：线上是本次代码就不算失败）" >> "$GITHUB_STEP_SUMMARY"
          echo "- 接口：<https://api.classsite.dpdns.org/api/content>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "核对方式（终端里跑，看 X-Build-Sha 是否等于上面的提交号）：" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo 'curl -sI https://api.classsite.dpdns.org/api/content | grep -i x-build-sha' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
