# ============================================================
# 每次推送后自动备份一次云端数据
# ------------------------------------------------------------
# 站主原话（2026-10-22）：
#   「我说过了要在部署前有几个门禁的，可是你数据管理的备份没有做，
#     这个你可以放到 cloudflare 部署内容或 githubaction，
#     确保每次更新能自动备份一次数据」。
#
# 三道保险：
#   ① scripts/predeploy.mjs 第 ④ 步（部署前，在本机跑，backup kind=predeploy）
#   ② Cloudflare Cron（每天 02:00，kind=auto，见 api/worker.mjs scheduled）
#   ③ 本工作流（每次 push 到 master，kind=auto，版本号取 index.html 的 SITE_VERSION）
#
# 需要仓库 Secrets（可选，不配就用默认的维护账号）：
#   CLS_AI_USER / CLS_AI_PASS
# ============================================================

name: 自动备份云端数据

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: backup-data
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取当前版本号
        id: ver
        run: |
          V=$(grep -o "SITE_VERSION = '[0-9.]*'" index.html | head -1 | grep -o "[0-9.]*")
          echo "value=${V:-unknown}" >> "$GITHUB_OUTPUT"
          echo "版本：${V:-unknown}"

      - name: 调备份接口
        env:
          API: https://api.classsite.dpdns.org
          CLS_USER: ${{ secrets.CLS_AI_USER }}
          CLS_PASS: ${{ secrets.CLS_AI_PASS }}
          VERSION: ${{ steps.ver.outputs.value }}
        run: |
          set -euo pipefail
          USER_NAME="${CLS_USER:-aibot}"
          USER_PASS="${CLS_PASS:-ai202505}"

          TOKEN=$(curl -sS -X POST "$API/api/auth?action=login" \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"${USER_NAME}\",\"password\":\"${USER_PASS}\"}" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))")

          if [ -z "$TOKEN" ]; then
            echo "::error::登录失败，无法备份（检查 CLS_AI_USER / CLS_AI_PASS）"
            exit 1
          fi

          RES=$(curl -sS -X POST "$API/api/admin?action=backup" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"version\":\"${VERSION}\",\"kind\":\"auto\",\"note\":\"push 自动备份 ${GITHUB_SHA:0:7}\"}")

          echo "$RES" | head -c 400
          echo
          echo "$RES" | python3 -c "import sys,json;d=json.load(sys.stdin);sys.exit(0 if d.get('ok') else 1)" \
            || { echo "::error::备份接口返回失败"; exit 1; }
