ist \"%LocalAppData%\\Google\\Chrome\\Application\\chrome.exe\" echo    Chrome 用户级 有 >> \"%OUT%\"\nif not exist \"%LocalAppData%\\Google\\Chrome\\Application\\chrome.exe\" echo    Chrome 用户级 无 >> \"%OUT%\"\nif exist \"%ProgramFiles%\\Microsoft\\Edge\\Application\\msedge.exe\" echo    Edge 64位     有 >> \"%OUT%\"\nif not exist \"%ProgramFiles%\\Microsoft\\Edge\\Application\\msedge.exe\" echo    Edge 64位     无 >> \"%OUT%\"\nif exist \"%ProgramFiles(x86)%\\Microsoft\\Edge\\Application\\msedge.exe\" echo    Edge 32位     有 >> \"%OUT%\"\nif not exist \"%ProgramFiles(x86)%\\Microsoft\\Edge\\Application\\msedge.exe\" echo    Edge 32位     无 >> \"%OUT%\"\nif exist \"%LocalAppData%\\Microsoft\\Edge\\Application\\msedge.exe\" echo    Edge 用户级   有 >> \"%OUT%\"\nif not exist \"%LocalAppData%\\Microsoft\\Edge\\Application\\msedge.exe\" echo    Edge 用户级   无 >> \"%OUT%\"\nif exist \"%ProgramFiles(x86)%\\360Chrome\\Chrome\\Application\\360chrome.exe\" echo    360极速       有 >> \"%OUT%\"\nif not exist \"%ProgramFiles(x86)%\\360Chrome\\Chrome\\Application\\360chrome.exe\" echo    360极速       无 >> \"%OUT%\"\necho. >> \"%OUT%\"\n\necho [4] profile 目录 >> \"%OUT%\"\nif exist \"%DIR%profile\\\" echo    已存在 = %DIR%profile >> \"%OUT%\"\nif not exist \"%DIR%profile\\\" echo    还没有（第一次运行才会创建） >> \"%OUT%\"\nif exist \"%DIR%profile\\Default\\\" echo    里面有 Default 子目录（说明成功用过） >> \"%OUT%\"\nif not exist \"%DIR%profile\\Default\\\" echo    里面没有 Default（说明还没成功启动过） >> \"%OUT%\"\necho. >> \"%OUT%\"\n\necho [5] 正在运行的浏览器进程 >> \"%OUT%\"\ntasklist /fi \"imagename eq chrome.exe\" 2>nul | find /i \"chrome.exe\" >> \"%OUT%\"\ntasklist /fi \"imagename eq msedge.exe\" 2>nul | find /i \"msedge.exe\" >> \"%OUT%\"\necho. >> \"%OUT%\"\n\necho [6] 网络（能否连到站点） >> \"%OUT%\"\nping -n 1 yuzikaaang.github.io >> \"%OUT%\" 2>&1\necho. >> \"%OUT%\"\n\necho [7] 安全策略（是否禁用了命令提示符） >> \"%OUT%\"\nreg query \"HKCU\\Software\\Policies\\Microsoft\\Windows\\System\" /v DisableCMD >> \"%OUT%\" 2>&1\nreg query \"HKLM\\Software\\Policies\\Microsoft\\Windows\\System\" /v DisableCMD >> \"%OUT%\" 2>&1\necho   （如果上面出现了 0x1，就是被策略禁用了） >> \"%OUT%\"\necho. >> \"%OUT%\"\n\necho.\necho   诊断完成，结果如下（也存成了文件）。\necho   --------------------------------------------\ntype \"%OUT%\"\necho   --------------------------------------------\necho.\necho   结果文件：%OUT%\necho   请把窗口截图发给站长，或者把这个文件发过去。\necho.\npause\nendlocal\nexit /b 0\n"}]},{"dir":"资料_散落文件归档","ver":"","date":"","title":"散落文件归档","theme":true,"count":7,"files":[{"p":"资料_散落文件归档/资料_2026-09-30_班级网站-代码审查报告.md","n":"资料_2026-09-30_班级网站-代码审查报告.md","d":"","sz":9615,"t":"# 班级服务站 · 代码审查报告\n\n审查时间：2026-09-30\n审查范围：`index.html`（8856 行）、`api/`（后端 4 个文件）、`sw.js`、部署配置、Git 历史、线上备用链接\n\n---\n\n## 一句话结论\n\n**功能是真做出来的，代码质量在高中生项目里属于上游水平；但有一个必须立刻处理的问题：站点里\"加密\"的个人信息，用同一份文件里自带的密钥 5 分钟就能还原，而线上链接是公开可访问的。**\n\n---\n\n## P0 · 必须马上处理\n\n### 1. 个人信息可被完整还原（最严重）\n\n`index.html` 里存了一份全班名单，字段用 XOR + Base64 混淆。但密钥就在同一个文件的第 2138 行：\n\n```javascript\nvar XOR_KEY = 'cls2505-xor-key-2026';   // index.html:2138\nfunction xorDecrypt(cipher){ ... }       // index.html:2206\n```\n\n我用这个密钥实测还原，一次成功：\n\n| 字段 | 还原结果示例 |\n|---|---|\n| `studentId` | `250501` `250502` …（全班 60 人学号） |\n| `examNo` | `11389409`（8 位考号，全班） |\n| `politics` | 共青团员 / 普通学生 / 中共党员 |\n| `role` | 学生 / 管理员 / 老师 / 团支书 |\n| `wechat` | 你本人的微信号、老师的微信号 |\n| `phone` | **你本人的手机号、老师的手机号** |\n| `qq` | 你本人的 QQ 号 |\n| `name` | SHA-256 哈希，解不出明文（这点做对了） |\n\n**为什么这是真的暴露，不是理论风险：**\n\n- 仓库 `yuzikaaang/class-site` 和 Gitee 镜像都是公开的\n- 我实测拉了线上备用链接（`https://a5048c773a210b3d4-25579.app.workbuddy.link/`），返回 530216 字节，与仓库 `index.html` **字节级完全一致**（`cmp` 比对通过），里面同时含有密钥和全部密文\n- 也就是说：任何人打开那个链接 → Ctrl+U → 复制两行 → 还原全班学号、考号、你和你老师的手机号微信\n\n另外，`internal/notes.md` 里你自己定的红线写着：\n\n> 铁律 · 敏感信息安全（红线）：仓库零泄露面；提交前 `git grep` 搜索口令、token、key、hint、password 等关键词必须为空\n\n这条实际没落实。XOR 混淆不叫加密——**密钥和密文放一起，等价于明文**。代码注释里其实也承认了这点（第 6514 行写了\"这是混淆不是加密\"），但名单这部分似乎没按同一标准处理。\n\n**建议处置：**\n\n1. 立刻把 `phone` / `wechat` / `qq` 三个字段从 `index.html` 删掉。前端公开页面无论怎么藏都藏不住，\"联系方式查询\"改成\"找班主任当面问\"或只保留办公室位置。\n2. `examNo`（考号）也建议删——考号 + 学号能定位到人，且是查成绩的凭据。\n3. 老师的手机号已经公开过一段时间了，**如实告知老师**一声，让他有心理准备（可能接到陌生电话/微信）。\n4. 你自己的手机号/微信/QQ 如果接到异常联系，考虑换号或加强隐私设置。\n5. 认识上要接受一点：**改 Git 历史只能降低以后被发现的概率，公开仓库里出现过的内容要当作已经泄露处理**。要彻底清历史得用 `git filter-repo` 重写 50 个提交并 force-push，GitHub 上还可能已被 fork / 被爬虫缓存。\n\n### 2. 点歌平台 API Key 可被还原，必须轮换\n\n```javascript\nvar DJ_KEY_ENC = 'FQQGUGoJAxsbC0oVCVBNTwRWAQYHChAEAAEGSRoNFxwJUhgaBA==';  // 用同一个 XOR_KEY\nfunction djApiKey(){ return xorDecrypt(DJ_KEY_ENC); }                      // index.html:8020\n```\n\n还原结果：`vhub_966cd88b54b6f30dfc6513dbbe1b7a76`\n\n拿到这个 key 就能直接调 `https://xsyzc2505.dpdns.org/api/open`，点歌、删歌、改排期都能做。**去点歌平台后台重新生成一个 key，旧的作废。**\n\n### 3. 门禁全关，云盘链接等于公开\n\n`index.html:6527` 附近：\n\n```javascript\nvar GATE_ENABLED = false;\n```\n\n这是站主自己拍板的（notes.md 有记录），不算 bug。但要清楚后果：所谓\"答对班级小问题解锁云盘链接\"现在不设防，链接和访问码任何人点开就能拿。README 里写\"因网络问题暂停开放中\"——如果资料其实还在云盘里，建议直接把入口下架，别挂着。\n\n---\n\n## P1 · 重要，尽快处理\n\n### 4. 账号系统 / 云同步 / 管理后台，目前完全不能用\n\n```javascript\nvar API_BASE_DEFAULT = '';   // index.html:4537\n```\n\n前端判定逻辑（`apiReady()`）要求：要么填了后端地址，要么当前域名是 `vercel.app`。而线上域名是 `github.io` 和 `app.workbuddy.link`，两条都不满足 → 所有 API 调用直接抛\"后端还没配置好\"。\n\n**但 README 用了整整两节（账号与云同步、管理员后台）+ 多条 FAQ 宣传这些功能，站内公告也发过。** 同学点了会报错。\n\n两条路选一条：\n- 想用：按 `api/README.md` 把 Vercel + Neon 部署好，把 `API_BASE_DEFAULT` 填上\n- 不想折腾：把 README 和站内公告里关于账号/云同步/后台的描述先撤掉，等部署好再宣传\n\n### 5. 后端登录接口没有任何频率限制\n\n`api/auth.js` 的 `login` 可以无限次试密码，6 位密码（你设的下限）暴力破解成本很低。建议加一层：同一 IP / 同一用户名连续失败 N 次后锁一段时间（可以在 `users` 表加 `failed_count` + `locked_until` 两列，改动不大）。\n\n### 6. 号称的\"时序攻击防护\"实际是失效的\n\n`api/auth.js:113`：\n\n```javascript\nconst hash = u ? u.password_hash : '$2a$10$invalidinvalid...inv';\n```\n\n注释说\"用户不存在时也走一次 bcrypt 比对，避免通过响应时间探测用户名\"。但这段假 hash **长度是 66，bcrypt 标准是 60**。bcryptjs 遇到长度不对的 hash 会直接返回 `false`，根本不做计算——响应时间依然比真实用户短，防护没生效。\n\n修法：换成一个真的 60 位 bcrypt hash（随便找个固定密码生成一次，把结果粘过来当\"陪跑\"用）。\n\n### 7. `ALLOW_ORIGINS` 默认值太宽松\n\n`api/_lib/db.js:55`：\n\n```javascript\nallowOrigins: (process.env.ALLOW_ORIGINS || '*')\n```\n\n部署时万一漏配这个环境变量，等于对全世界网站开放 API。建议默认值改成空（不填就不放行），让部署失败暴露出来，而不是静默放行。\n\n### 8. 第一个注册的人自动成为管理员\n\n`api/auth.js:76`：`isFirst` 为真 → `role = 'admin'`。加上 `ALLOW_REGISTER` 默认是 `1`，意味着链接一旦流出班外，**第一个注册的外人就是管理员**，能看到全班所有人的云端数据、能删号。\n\n而且 `isFirst` 用 `count(*)` 判断，并发注册有竞态，理论上能冒出多个管理员。\n\n建议：`ALLOW_ORIGINS` 之外，把 `ALLOW_REGISTER` 默认改成 `0`（管理员开号），或者去掉 `isFirst` 自动提权，只认 `ADMIN_USERS` 名单。\n\n### 9. sendBeacon 通道：token 走 URL，且不校验请求方法\n\n`api/data.js` 的 `?action=beacon` 分支从 query 里取 token。两个问题：\n\n- token 出现在 URL 里 → 会进服务器日志、浏览器历史、`Referer` 头\n- `writeData` 不检查 `req.method`，**GET 请求也能写入数据**\n\n建议：至少在该分支加 `if (req.method !== 'POST') return fail(res, 405, ...)`。\n\n---\n\n## P2 · 有空再改\n\n| # | 问题 | 说明 |\n|---|---|---|\n| 10 | 仓库 85MB | `backup/` 占 80MB（40+ 个历史 zip），`.git` 58MB。clone 很慢。建议清理旧备份或移出仓库 |\n| 11 | `sw.js` 注释过时 | 第 2 行还写\"内容随 Gitee 实时更新\"，实际已迁到 GitHub Pages，且 Gitee Pages 2024 年就下线了 |\n| 12 | `secrets.json.enc` 遗留 | 已在 notes.md 说明\"不再作为令牌来源\"，但文件还在仓库根目录，容易误导后来的维护者。建议删掉 |\n| 13 | 前后端键白名单手工同步 | `api/data.js` 的 `ALLOW_KEYS`（15 项）和前端 `CLOUD_KEYS`（11 项 + 4 前缀）要手工保持一致，改一处忘另一处会导致同步静默失败 |\n| 14 | README 自相矛盾 | 开头写\"无需注册登录\"，后面又有完整账号系统章节 |\n| 15 | 没有 `.env` 兜底校验 | `getSql()` 在缺 `DATABASE_URL` 时才报错，建议部署后先手动打一次 `/api/auth?action=me` 确认 |\n\n---\n\n## 做得好的地方（不是客套）\n\n- **令牌管理是对的**：我把 50 个提交的完整 Git 历史扫了一遍，没有任何 Gitee/GitHub token 入库。方案③（令牌自己存、不入库）执行得很干净\n- **SQL 全部参数化**：`api/` 里没有一处字符串拼接 SQL，注入风险为零\n- **密码用 bcrypt**，且管理接口只返回 token 前 8 位、管理员不能禁用/删除自己——这些细节考虑到了\n- **前端有 `esc()` / `jsq()` 转义函数**，XSS 有基本防护\n- **管理员后台有服务端身份核实**（v39），不是只看 localStorage 里的 role\n- **GitHub Actions 的上线白名单机制**（v44）设计正确，能挡住 `internal/`、`backup/` 被托管到公网\n\n---\n\n## 建议的修复顺序\n\n1. **今天**：删 `phone` / `wechat` / `qq` / `examNo` 字段 → 轮换点歌 API Key → 把改动推上线\n2. **今天**：告知老师手机号可能已泄露\n3. **本周**：决定后端部署与否，同步修正 README/公告口径\n4. **本周**：修后端 4 个问题（限流、假 hash 长度、ALLOW_ORIGINS 默认值、beacon 方法校验）\n5. **有空**：`ALLOW_REGISTER` 改默认关闭、清理 backup/、改 sw.js 注释\n\n---\n\n*审查时线上主链接（GitHub Pages）从沙箱访问不通（HTTP 000），`internal/notes.md` 里也记录了\"本环境无法直连 GitHub\"，因此主链状态需你自己在浏览器确认。备用链接实测可访问（HTTP 200）。*\n"},{"p":"资料_散落文件归档/资料_2026-10-05_fc-deploy-api.zip","n":"资料_2026-10-05_fc-deploy-api.zip","d":"","sz":899414,"x":1},{"p":"资料_散落文件归档/资料_2026-10-05_后端部署指南-Workers+Neon.md","n":"资料_2026-10-05_后端部署指南-Workers+Neon.md","d":"","sz":6453,"t":"# 后端部署指南 · Cloudflare Workers + Neon\n\n> 目标：给班级服务站接上云端账号系统（注册 / 登录 / 个人数据云同步 / 管理员后台），\n> 让同学在任何设备上打开站点，收藏和设置都能跟着走。\n>\n> 为什么选这个组合：**不需要实名认证，完全免费**（腾讯云/阿里云都要满 18 岁实名，Workers 不要）。\n\n---\n\n## 一、整体结构\n\n```\n同学手机\n   │\n   ├─ 打开站点 ──→ GitHub Pages（yuzikaaang.github.io/class-site）\n   │                 └─ 静态页面，已在微信内可直接打开\n   │\n   └─ 登录/同步 ──→ Cloudflare Workers（class-site-api.xxx.workers.dev）\n                      └─ /api/auth、/api/data、/api/admin\n                           │\n                           └──→ Neon Postgres（免费版，存用户和数据）\n```\n\n**前端不用动。** 只要把 `index.html` 里的 `API_BASE_DEFAULT` 改成 Worker 地址即可。\n\n---\n\n## 二、准备工作\n\n| 需要的东西 | 在哪拿 | 要实名吗 |\n|---|---|---|\n| Cloudflare 账号 | [dash.cloudflare.com](https://dash.cloudflare.com/sign-up) | ❌ 不要 |\n| Neon 账号 | [neon.com](https://neon.com)（可用 GitHub 登录） | ❌ 不要 |\n| Node.js 20+ | 本机已装即可 | — |\n\n---\n\n## 三、第一步：建数据库（Neon）\n\n1. 登录 Neon → **Create project**\n   - Name：`class-site`\n   - **Region 选 `Singapore (ap-southeast-1)`** ← 离国内最近，延迟最低\n   - Postgres 版本用默认\n2. 创建后进入项目，点 **Connection string**\n   - 类型选 **Pooled connection**（带 `-pooler` 的那个）\n   - 复制整串，形如：\n     ```\n     postgresql://neondb_owner:xxxx@ep-xxx-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require\n     ```\n3. 打开左侧 **SQL Editor**，把仓库里 `api/schema.sql` **整段粘贴执行**\n   - 这个脚本是幂等的，重复执行也不会出错\n\n执行完应该有 4 张表：`users`、`sessions`、`user_data`、`audit_log`。\n\n---\n\n## 四、第二步：部署 Worker\n\n在本机仓库目录下执行：\n\n```bash\n# 1. 装依赖\nnpm install\n\n# 2. 登录 Cloudflare（会弹浏览器授权）\nnpx wrangler login\n\n# 3. 配置密钥（三个都要，照着提示粘贴）\nnpx wrangler secret put DATABASE_URL\n#    ↑ 粘贴 Neon 那串连接串\n\nnpx wrangler secret put ADMIN_USERS\n#    ↑ 输入：yuzikang\n\nnpx wrangler secret put ALLOW_ORIGINS\n#    ↑ 输入：https://yuzikaaang.github.io\n\n# 4. 部署\nnpx wrangler deploy\n```\n\n部署成功后会打印地址，形如：\n\n```\nhttps://class-site-api.你的用户名.workers.dev\n```\n\n**把这个地址记下来**，下一步要用。\n\n> 💡 `SESSION_DAYS`、`ALLOW_REGISTER` 已经写在 `wrangler.toml` 的 `[vars]` 里，\n> 不是敏感信息，不用单独配。\n\n---\n\n## 五、第三步：接通前端\n\n打开 `index.html`，找到这一行（约 4537 行）：\n\n```javascript\nvar API_BASE_DEFAULT = '';\n```\n\n改成你的 Worker 地址（**结尾不要带斜杠**）：\n\n```javascript\nvar API_BASE_DEFAULT = 'https://class-site-api.你的用户名.workers.dev';\n```\n\n改完提交推送，GitHub Actions 会自动发布到 Pages。\n\n---\n\n## 六、第四步：验证\n\n### 1. 接口连通性\n\n```bash\n# 应该返回 401（说明路由通了，只是没带 token）\ncurl -i https://你的worker地址/api/data\n\n# 应该返回 404 且带 CORS 头\ncurl -i https://你的worker地址/api/nope\n```\n\n### 2. 注册第一个账号\n\n打开站点 → 登录 → 注册，用户名填 **`yuzikang`**。\n第一个注册的用户会自动成为管理员，且这个名字在 `ADMIN_USERS` 里，双保险。\n\n### 3. 检查跨域\n\n浏览器控制台如果报 `blocked by CORS policy`，说明 `ALLOW_ORIGINS` 没配对。\n确认它**不带结尾斜杠**、**是 https**、和浏览器地址栏的域名完全一致。\n\n---\n\n## 七、本地开发\n\n```bash\nnpx wrangler dev\n```\n\n会起在 `http://localhost:8787`，行为和生产一致。\n\n跑测试：\n\n```bash\nnpm test\n```\n\n这个测试用 SQLite 桩跑完整的请求链路（路由 / 注册 / 登录 / 限流 / 数据同步 / 权限），\n共 46 项断言，改代码后跑一遍能挡住大部分回归。\n\n---\n\n## 八、费用\n\n**全部在免费额度内，不用花钱。**\n\n| 项目 | 免费额度 | 班级站预期用量 | 占比 |\n|---|---|---|---|\n| Workers 请求 | 10 万次/天 | 几百次/天 | <1% |\n| Workers CPU | 10ms/请求 | 约 5–10ms | 达标 |\n| Neon 存储 | 0.5 GB | 几十 MB | <10% |\n| Neon 计算 | 100 CU-小时/月 | 远低于此 | — |\n| 出站流量 | 不限 | — | — |\n\n---\n\n## 九、已知限制与注意事项\n\n### 1. CPU 时间上限 10ms（免费版）\n\n这是**唯一需要留意的硬限制**。密码哈希按 PBKDF2 50000 次配置，实测约 5–10ms，\n刚好在限内。\n\n如果线上频繁出现 `Error 1102`，把 `api/_lib/password.js` 里的\n`ITERATIONS` 从 `50000` 改成 `25000`（约省一半 CPU）。\n\n> 迭代次数是写在每条哈希串里的，**调低不会影响已注册用户登录**——\n> 他们仍按注册时的次数校验。\n\n### 2. 密码算法与旧账号\n\n系统已从 bcrypt 换成 PBKDF2-SHA256（原因见上一条）。\n`verifyPassword()` 会自动识别 `$2b$` 开头的旧 bcrypt 哈希，\n**老账号能正常登录**，并在登录成功后自动升级成新格式。\n\n### 3. GitHub Pages 不部署后端\n\n`api/` 目录**不要**放进 Pages 的发布产物。\n仓库里的 `.github/workflows/deploy-pages.yml` 已经做了白名单，\n只发布必要文件，不会把后端代码推上去。\n\n### 4. 环境变量泄漏风险\n\n`DATABASE_URL` 只存在 Cloudflare 的 secret 里，**不在仓库中**。\nWorker 的运行时代码也不会把它返回给前端。\n\n---\n\n## 十、常见问题\n\n**Q：`wrangler login` 打不开浏览器？**\nA：复制终端打印的 URL 手动打开，授权后把 code 粘回去。\n\n**Q：部署报 `Missing script: deploy`？**\nA：在仓库根目录执行（`package.json` 所在处），不是 `api/` 里。\n\n**Q：登录一直失败？**\nA：按顺序查 —— ① `ALLOW_ORIGINS` 是否精确匹配前端域名 ② `DATABASE_URL` 是否填了 pooled 串\n③ Neon 里 `schema.sql` 是否执行过。\n\n**Q：能换回阿里云 FC / Vercel 吗？**\nA：可以。`api/auth.js`、`data.js`、`admin.js` 是平台无关的标准写法，\n`api/index.mjs`（FC）和 `api/worker.mjs`（Workers）是两个入口适配层，业务代码共用。\n"},{"p":"资料_散落文件归档/资料_2026-10-05_后端部署方案-阿里云FC.md","n":"资料_2026-10-05_后端部署方案-阿里云FC.md","d":"","sz":13613,"t":"# 后端部署方案：阿里云函数计算 FC\n\n> 目标：前端继续用 GitHub Pages，**国内访问快 + 微信内可直接打开**。\n> 前端代码：`index.html`（不变）　后端：`api/`（已改造完成）\n> 编制时间：2026-10-05\n\n---\n\n## 一、先说三个硬约束（已查证，不是猜的）\n\n| # | 约束 | 依据 | 影响 |\n|---|---|---|---|\n| 1 | **你未满 18 周岁，办不了个人 ICP 备案** | 广西管局规则\"个人未满 18 周岁不允许进行 ICP 备案\"；华为云备案文档\"需年满十八周岁才能备案\"；贵州省通管局答复引用《民法典》第十七条，明确\"建议你符合完全民事行为能力人的年龄及条件后再申请\" | 大陆地域 + 自定义域名这条路走不通 |\n| 2 | **FC 默认域名 `*.fcapp.run` 禁止用于生产** | 阿里云官方公告（2026-04 更新）：\"禁止在生产环境中使用函数计算的默认公网域名，出现的安全攻击等事件不在产品安全责任范围内\"；且该域名由社区提供、备案主体不一致，**已知河南等部分地区会被拦截** | 不能指望用默认域名长期对外服务 |\n| 3 | **FC 香港 / 海外地域绑定自定义域名不需要备案** | 阿里云《配置自定义域名》文档：\"中国香港和海外区域的函数绑定的自定义域名不需要备案\" | **这条路可行，是本方案的基础** |\n\n### 结论\n\n> **FC 建在「中国香港」地域 + 绑一个你自己的域名 → 免备案、国内访问快、无需等 1 个月的备案审核。**\n\n前提只有一个：**你得有一个域名**。域名注册需要实名认证（实名 ≠ 备案），按各大注册商规则未成年人可能受限，**建议用父母的身份注册和实名**（香港地域不需要 ICP 备案，所以只需要实名这一步）。\n\n---\n\n## 二、方案对比\n\n| 方案 | 国内速度 | 微信内 | 需要域名 | 需要备案 | 成本 | 评价 |\n|---|---|---|---|---|---|---|\n| **A. FC 香港 + 自定义域名** ⭐ | 快（40–80ms） | 需实测，预期正常 | ✅ 要 | ❌ 不要 | 域名约 ¥10–50/年 | **推荐** |\n| B. FC 大陆 + 自定义域名 | 最快（<30ms） | 最好 | ✅ 要 | ✅ 要 | 同上 | 你办不了备案，排除 |\n| C. FC 香港 + 默认域名 | 快 | 有被拦截风险 | ❌ 不要 | ❌ 不要 | ¥0 | 只适合**测试连通性**，别长期用 |\n| D. 腾讯云 CloudBase | 快 | 最好（腾讯自家） | 可用默认子域名 | ❌ 不要 | 2026 年起免费版限制变多，静态托管需付费/兑换码 | 备选，微信生态更友好但免费额度收紧 |\n| E. 维持现状（不部署） | — | — | — | — | ¥0 | 账号/云同步功能完全不可用，README 需撤掉宣传 |\n\n---\n\n## 三、推荐架构（方案 A）\n\n```\n┌─────────────────────────┐          ┌──────────────────────────┐\n│ 前端 GitHub Pages        │  HTTPS   │ 阿里云 FC（香港）         │\n│ yuzikaaang.github.io    │ ───────▶ │ 单函数 /api/*            │\n│ · 微信内可直接打开        │  CORS    │ · auth / data / admin    │\n│ · 备用链接 workbuddy     │          │ · 运行时 Node.js 20       │\n└─────────────────────────┘          └────────────┬─────────────┘\n                                                  │ HTTPS（约 35ms）\n                                                  ▼\n                                        ┌──────────────────────────┐\n                                        │ Neon Postgres（新加坡）    │\n                                        │ users / sessions          │\n                                        │ user_data / audit_log     │\n                                        └──────────────────────────┘\n```\n\n### 关于 sqlpub.com（2026-10-05 站主问到，评估如下）\n\n| 项目 | 情况 |\n|---|---|\n| 类型 | **MySQL 8.0**（不是 PostgreSQL） |\n| 机房 | **国内** |\n| 免费额度 | 500MB 存储、36,000 次请求/小时、30 并发连接 |\n| 付费 | ¥9.9/年（1G 存储、72,000 次/小时、50 并发） |\n| 申请 | 免注册，邮箱直申，**密码只显示一次** |\n\n**能用，但在这个架构下不划算，三个原因：**\n\n1. **要重写数据层**。现有后端是 PostgreSQL 写的，换 MySQL 得改：`bigserial`→`AUTO_INCREMENT`、`timestamptz`→`DATETIME`、`jsonb`→`JSON`、`count(*) filter (where …)`→`SUM(CASE WHEN …)`（前者是 Postgres 专有语法）、`unnest` 批量 upsert 整个换写法、驱动从 `@neondatabase/serverless`（模板标签参数化）换成 `mysql2`（`?` 占位符）。3 个文件，能做，但纯粹是额外工作量。\n2. **没有速度优势**。FC 在香港（免备案的前提），香港→新加坡约 35ms，香港→国内也要 40–60ms 且跨境。**数据库放国内并不会更快**，除非 FC 也放国内——那就要备案，你办不了。\n3. **可靠性存疑**。多家测评明确写\"建议避免处理敏感数据，仅用于非生产环境\"\"生产环境慎用第三方的数据库\"；密码只显示一次、无 SLA、无备份保障。\n\n> **建议：先用 Neon 把链路跑通（零改动，今天就能验证微信能不能打开）。确认可用后，如果你仍想换国内 MySQL，我再重写数据层。别在还没验证微信能否访问之前就把力气花在迁库上。**\n\n**为什么数据库选 Neon（新加坡）而不是阿里云的数据库：**\n\n- 现有 `api/schema.sql` 和全部代码就是为 Postgres 写的，**换 Neon 零改动**；换阿里云表格存储要重写全部 SQL\n- 香港 → 新加坡约 35ms，比连回大陆还快\n- 免费额度：0.5GB 存储 + 100 CU-小时/月，60 人班级绰绰有余\n- 5 分钟无访问自动缩容（首次唤醒约 1 秒），空转不烧额度\n\n---\n\n## 四、我已经改好的代码（本次一并完成）\n\n| 文件 | 改动 |\n|---|---|\n| `api/index.mjs` | **新增** — FC 统一入口。一个函数接管 `/api/auth`、`/api/data`、`/api/admin`，并做了 req/res 兼容层（FC 是 Express 风格，原代码是 Node 原生风格） |\n| `api/_lib/http.js` | `body()` 支持 Buffer（FC 传来的请求体可能是 Buffer，原代码只处理 string，会导致登录拿不到参数） |\n| `api/_lib/db.js` | `ALLOW_ORIGINS` 默认值由 `'*'` 改为**空**（漏配 = 跨域拒绝，问题立刻暴露，而不是静默对全网开放） |\n| `api/auth.js` | ① 加**登录限流**：连续失败 5 次锁 15 分钟（基于数据库，跨实例生效）<br>② 修复**时序防护失效**：原来那个陪跑 hash 是 66 位，bcryptjs 遇到长度不对会直接返回 false、根本不做计算，等时比对形同虚设。已换成实测生成的合法 60 位串 |\n| `api/schema.sql` | 新增 `failed_count` / `locked_until` 两列（`add column if not exists`，老库直接执行即可补上，不用重建表） |\n| `api/data.js` | `beacon` 通道改为**只接受 POST**（原来 GET 也能写入，且 token 在 URL 里会被日志/Referer 记下） |\n\n`auth.js` / `data.js` / `admin.js` 的 `export default handler` 原样保留，**Vercel 部署方式不受影响**，两套并存。\n\n---\n\n## 五、部署步骤\n\n### 第 0 步：准备域名（唯一可能卡住的一步）\n\n1. 在阿里云万网或腾讯云注册一个域名（`.top` / `.xyz` 首年通常 ¥10 以内）\n2. 完成**域名实名认证**（用父母的身份，需身份证 + 人脸识别）\n3. 不需要做 ICP 备案（香港地域免备案）\n\n> 如果这一步搞不定，先跳到第 3 步用默认域名把链路跑通，域名后补。\n\n### 第 1 步：建 Neon 数据库\n\n1. 打开 <https://neon.tech> 注册（免费，无需信用卡）\n2. 新建项目，**区域选 AWS Singapore（ap-southeast-1）**——离香港最近\n3. 复制连接串，优先用带 `-pooler` 的那个：\n   ```\n   postgresql://user:pass@ep-xxx-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require\n   ```\n4. 打开 Neon 左侧 **SQL Editor**，把 `api/schema.sql` 整段粘贴执行（幂等，可重复执行）\n\n### 第 2 步：创建 FC 函数\n\n1. 打开阿里云函数计算控制台，**地域选「中国香港」**\n2. 创建函数：\n   - 创建方式：**Web 函数** 或 **事件函数**（HTTP 触发器）均可，推荐后者\n   - 运行环境：**Node.js 20**\n   - 代码上传方式：本地上传 zip（把 `api/` 目录 + `package.json` 打包，注意 `node_modules` 不用传，FC 会自动安装依赖；保险起见可本地 `npm install` 后一起打包）\n   - 请求处理程序：`index.handler`\n3. 配置环境变量（**必填，否则接口全部不可用**）：\n\n   | 变量 | 值 | 说明 |\n   |---|---|---|\n   | `DATABASE_URL` | Neon 连接串 | 必填，缺了会报\"缺少 DATABASE_URL\" |\n   | `ALLOW_ORIGINS` | `https://yuzikaaang.github.io,https://a5048c773a210b3d4-25579.app.workbuddy.link` | **必须填**，默认已改为不放行。多个用英文逗号分隔，结尾不要带 `/` |\n   | `ADMIN_USERS` | `zikang` | 名单内的用户名注册后成为管理员 |\n   | `ALLOW_REGISTER` | `0` | **建议先设 0 关闭自助注册**，你自己在后台开号。原因见第六节风险提示 |\n   | `SESSION_DAYS` | `30` | 登录保持天数 |\n\n4. 内存建议 512MB、超时 30s（bcrypt 计算稍慢，别设太短）\n\n### 第 3 步：先验证链路（用默认域名）\n\n在浏览器直接访问：\n```\nhttps://<你的函数>.cn-hongkong.fcapp.run/api/auth?action=me\n```\n应返回 `{\"ok\":false,\"error\":\"未登录或登录已过期...\"}`——**能返回 JSON 就说明函数跑通了**。\n\n同时打开浏览器控制台看有没有 CORS 报错，验证 `ALLOW_ORIGINS` 是否填对。\n\n### 第 4 步：绑定自定义域名\n\n1. FC 控制台 → **域名管理** → 添加自定义域名\n2. 域名填你的域名（如 `api.yourdomain.top`），地域选香港\n3. HTTPS：勾选启用，**证书用免费的（阿里云 SSL 证书服务有 3 个月免费 DV 证书，或用 Let's Encrypt）**\n4. 按提示拿到 CNAME 值，去域名解析控制台添加一条 CNAME 记录：\n   ```\n   记录类型：CNAME\n   主机记录：api\n   记录值：<控制台给你的 CNAME>\n   ```\n5. 等解析生效（通常 1–10 分钟）\n\n### 第 5 步：前端填后端地址\n\n改 `index.html` 第 4537 行附近：\n\n```javascript\nvar API_BASE_DEFAULT = '';\n```\n改成：\n```javascript\nvar API_BASE_DEFAULT = 'https://api.yourdomain.top';\n```\n\n保存 → 推仓库 → Actions 自动发布。\n\n### 第 6 步：验证微信内可用（关键）\n\n**这一步必须实测，不能靠推理。** 三条都试：\n\n1. 用**手机微信**打开主链接 `https://yuzikaaang.github.io/class-site/`（复制备用链接到系统浏览器也试一次）\n2. 点侧边栏「👤 登录 / 注册」，尝试注册一个账号\n3. 打开手机浏览器开发者工具或看页面是否报\"后端还没配置好\"\n\n如果出现 CORS 报错 → 检查 `ALLOW_ORIGINS` 是否带 `https://`、结尾是否多带了 `/`、改完环境变量是否重新部署。\n如果微信内打不开但系统浏览器能开 → 说明域名被微信拦截，需要考虑换方案 D（腾讯云 CloudBase）。\n\n### 第 7 步：开第一个管理员账号\n\n因为第 2 步把 `ALLOW_REGISTER` 设成了 0，自助注册关闭。你需要：\n\n1. 临时把 `ALLOW_REGISTER` 改成 `1` 并重新部署\n2. 自己第一个注册（用户名 `zikang`）→ 自动成为管理员\n3. 注册完立刻把 `ALLOW_REGISTER` 改回 `0`，重新部署\n\n---\n\n## 六、风险提示（部署后仍然存在，要心里有数）\n\n1. **第一个注册者自动成为管理员**：`api/auth.js` 里 `isFirst` 为真就给 admin。如果开着自助注册、链接又流出班外，第一个外人注册就是管理员，能看到全班云端数据、能删号。**所以第 2 步建议 `ALLOW_REGISTER=0`。**\n2. **登录限流只防暴力破解，不防社工**：15 分钟锁定的阈值可以按需要调。\n3. **Neon 免费版 5 分钟闲置会缩容**，第一次请求约 1 秒唤醒，同学登录时可能感觉轻微卡顿，正常现象。\n4. **老师的手机号此前已泄露过**，改号或提醒他留意陌生来电——部署后端解决不了已发生的泄露。\n5. **FC 香港地域不受大陆备案约束，但仍需遵守阿里云服务条款**，别拿来跑违规内容。\n\n---\n\n## 七、费用估算\n\n| 项目 | 费用 |\n|---|---|\n| 阿里云 FC（香港） | 班级日活几十人，用量远在免费额度内，**¥0** |\n| Neon Postgres | 免费额度够用，**¥0** |\n| 域名 | 首年约 ¥10，续费约 ¥30–60/年 |\n| SSL 证书 | 免费 DV 证书，**¥0** |\n| **合计** | **约 ¥10–60/年**（就是个域名钱） |\n\n---\n\n## 八、需要你拍板的事\n\n1. **有没有域名？** 有 → 直接走第 4 步；没有 → 要不要注册一个（可能要请父母帮忙实名）\n2. **数据库就用 Neon 吗？** 还是你有别的偏好（比如想用阿里云的数据库，那要重写 SQL）\n3. **要不要顺手把敏感数据搬到后端？** 现在 `phone`/`wechat`/`qq`/`examNo` 已删除，但学号、职务、政治面貌还在前端。搬后端能彻底解决，代价是后端没好之前这个查询功能要暂时下线\n4. **Gitee 令牌**：本次改动（清备份 + 隐私加固 + FC 适配）需要推仓库，等你给令牌\n"},{"p":"资料_散落文件归档/资料_2026-10-06_README-更新版预览.md","n":"资料_2026-10-06_README-更新版预览.md","d":"","sz":9755,"t":"# 25级05班班级服务站\n\n一个为 25级05班 打造的**一站式班级服务网站**：公告、作业、资料、课表、点歌、倒计时、小游戏……打开即用，也能「安装」到手机桌面像 App 一样使用，支持离线访问。\n\n- 打开链接就能用，**无需注册登录**；注册账号仅为云同步个人数据（可选）\n- 手机 / 平板 / 电脑自适应，暗色模式自动跟随\n- 可添加到主屏幕（PWA），断网也能打开\n\n---\n\n## 在线地址\n\n| 入口 | 链接 | 说明 |\n|------|------|------|\n| **主链接** | https://yuzikaaang.github.io/class-site/ | 平时用这个。**微信内可以直接打开** |\n| **备用链接** | https://a5048c773a210b3d4-25579.app.workbuddy.link/ | 主链接打不开时的应急入口，内容与主链接一致。<br>⚠️ **微信内无法打开**，需复制链接后用系统浏览器（Safari / Chrome / Edge / 手机自带浏览器）打开 |\n\n站内侧边栏「🔗 复制链接」里两条地址都有，点右侧按钮即可复制。\n\n---\n\n## 功能一览\n\n### 📢 首页\n- **班级公告**：按「网站内部 / 🔔 重要更新 / 班级事务 / 站主杂谈」分类，支持搜索、按时间范围筛选；重要消息会置顶，班级活动还会进站弹窗提醒 + 右下角悬浮球随时回看\n- **每日日报**：当日热点聚合\n- **今日班级签**：每天抽一张，次日 0 点刷新\n- **倒计时**：学期进度、法定节假日，精确到秒。节日日期**由站内自动推算**（农历节日用内置万年历数据换算，清明按节气表），随年份滚动生成、**不用手动维护**；已经过去的节日当天起就不再显示\n\n### 🧰 各板块\n| 板块 | 内容 |\n|------|------|\n| **常用服务** | 点歌平台、作业查看（Classworks） |\n| **大屏服务** | 班级课表（ClassIsland）、听歌平台（EchoMusic） |\n| **学习资料** | 课堂笔记、教学课件（答对班级小问题解锁云盘链接；因网络问题暂停开放中） |\n| **成绩查询** | 考试成绩查询入口（易查分） |\n| **班级事务** | 意见反馈（匿名提建议 / 反映问题）、班级活动 |\n| **其他工具** | 番茄时钟、联系方式查询等实用小工具 |\n| **📲 安装为应用** | Windows / iPhone / 安卓各品牌一键安装到桌面教程 |\n\n> **卡片堆叠（试验功能，默认关闭）**：同一板块下有两个以上入口时，卡片会层叠成一沓只露出最上面一张（右上角标着共几个入口）。点 **↑ ↓** 可以上下轮换着看，也可以用鼠标滚轮或在手机上直接上下滑动切换；想看全部就点 **展开全部**，按钮点完再点 **收起** 回到堆叠。只有一个入口的板块不堆叠。\n>\n> 这个效果**还在测试中、观感不太稳定**，所以默认是关的（板块里的卡片按传统方式平铺罗列）。想试试就去「自定义设置 → 动效」里手动打开，打开时会提示一次；觉得不好用随时关掉即可，不习惯的建议保持关闭。\n\n### 🎮 隐藏娱乐天地\n站内藏了小游戏（贪吃蛇、俄罗斯方块、2048、扫雷、涂鸦跳跃、五子棋、中国象棋等）和外站小游戏入口，还有隐藏空间彩蛋——线索藏在日常交互里，自己去探索才有意思。\n\n> 部分游戏达标可领**点歌券**：从全班名单中选自己的名字，每款游戏每人每周一张，下周一 0 点刷新。\n\n### 🎨 自定义设置\n侧边栏「⚙️ 自定义设置」，想把界面调成自己的样子就用它：\n\n- **排序**：首页四大板块、侧栏导航、板块内卡片、小游戏列表、公告分类标签都能拖着排（长按把手拖动，或点 ▲▼ 微调）。**站主以后新加的卡片会自动排在你排好的后面，不会丢**\n- **字号**：六档可调（85% ~ 135%），**只放大文字，卡片和间距不变**\n- **背景**：跟随主题 / 纯色 / 预设渐变 / 上传本地图片，还能调蒙层深浅；选到深色背景会自动切成夜间模式，保证文字看得清\n- **动效**：一键开关全部动效（跟随系统的「减少动态效果」设置也会自动生效）；另可单独开关**卡片堆叠**（试验功能，默认关闭）——打开后板块里的卡片层叠成一沓，关掉则恢复平铺罗列\n- **导出 / 导入**：配置可导出成文件，换设备时用「数据管理」或直接在这里导入即可，本机已有的内容不会被冲掉\n\n> 所有设置只保存在你自己的设备上，不影响别人看到的界面。\n\n### 👤 账号与云同步\n侧边栏「👤 登录 / 注册」，登录后可以：\n\n- **云同步**：把主题、界面设置、作业打勾、签到记录等**个人数据**同步到云端，换手机登录同一账号点「从云端恢复」就都回来了\n- **改密码**：原密码验证后修改，改完其他设备会自动退出登录\n- **不登录也完全不影响使用**——数据照样存在你自己手机上，只是换设备不会自动跟着走\n\n> 🔒 密码用 bcrypt 加密后存储，**站主也看不到明文**。云端只存你自己的个人数据，公告/资料这类站内容不会同步。\n\n### 🛠 管理员后台\n站主（管理员）在个人中心可进入后台：\n\n- **用户管理**：查看所有注册同学、重置密码、启用/禁用、调整角色、强制下线、删除账号\n- **数据统计**：注册人数、7 天内活跃、云端占用、同学们最常同步哪些数据\n- **数据管理**：查看/修改/删除任意用户的云端数据\n- **操作日志**：所有管理操作留有记录，可追溯\n\n> 后端部署请见 [`api/README.md`](api/README.md)。\n\n---\n\n## 使用方式\n\n### 添加到手机桌面（推荐）\n1. 用**手机浏览器**打开主链接（iPhone 用 Safari，安卓用 Chrome / 自带浏览器）\n2. 点浏览器菜单 → 「添加到主屏幕」\n3. 桌面出现图标，之后一点即开，和 App 一样\n\nWindows / Mac 电脑也可以在浏览器地址栏右侧点「安装」按钮。不会装的话，站内「📲 安装为应用」有分品牌图文教程。\n\n### 微信里怎么用\n主链接在微信内可直接打开；备用链接不行，需要复制到系统浏览器。部分外站（点歌平台、Classworks 等）在微信内会引导你用浏览器打开，按提示走就行。\n\n### 数据管理\n侧边栏「💾 数据管理」可以：\n- **导出 / 复制**本站保存在本设备的全部数据（游戏记录、班级签等），换设备或清缓存前导出一份，之后一键导入即可恢复。导出时用自己设置的密码加密，**密码请务必记住**（没有找回机制）\n- **重置游戏数据**：清空所有游戏记录\n- **全部清理**：清空本机站点数据（保留班级签、点歌券记录）\n\n---\n\n## 常见问题\n\n**Q：作业怎么查？怎么标记已完成？**\nA：假期作业发布后，打开网站的进站弹窗点「查看作业」即可直达到位；也可从「常用服务 → 作业查看 → 📝 查看当前作业」进入，或用「📅 历史作业（日期）」按日历回看。每条作业**点一下即可勾选「已完成」**（再点取消），进度显示在科目右上角，记录保存在本机。简化版教程见仓库 [`作业查看教程.md`](作业查看教程.md)。\n\n**Q：作业显示不全 / 同步不及时？**\nA：因校园网限制，班级电脑端的 Classworks 连不上服务器，站内作业由站主手动同步，实际以老师线下布置为准。\n\n**Q：点歌券怎么用？**\nA：游戏达标后按提示选名字领券 → 复制券码 → 到点歌平台点歌时输入券码即可核销。每款游戏每人每周一张。\n\n**Q：换了手机 / 清了缓存，游戏记录没了？**\nA：**推荐注册登录后用「云同步」**——登录账号 → 点「立即同步」，换设备登录同一账号 → 点「从云端恢复」即可。不想注册的话，也可以走老办法：「数据管理」导出 → 新设备导入；界面设置（排序 / 字号 / 背景）用「自定义设置」里的「导出配置」同样能带走。\n\n**Q：必须注册才能用吗？**\nA：**不必**。不登录时站点功能和以前完全一样，数据都存在你自己手机上。注册只是为了换设备时方便，以及让站主在需要时能帮你处理数据问题。\n\n**Q：云端会存我的什么？**\nA：只存**你自己的个人数据**（主题、界面设置、作业打勾、签到、点歌备注等），公告和资料这类站内容不存。管理接口里也看不到你的密码——密码只有加密后的哈希。\n\n**Q：链接打不开？**\nA：先换主链接试试；主链接也不行就用备用链接（**备用链接微信内打不开**，要用系统浏览器）。\n\n**Q：网站会一直更新吗？**\nA：会。内容随仓库实时更新，打开即是最新版；装到桌面后无需重新安装。\n\n---\n\n## 技术说明\n\n- 前端：纯静态 PWA —— 单文件 `index.html` + `games/` 小游戏 + Service Worker 离线缓存\n- 后端：Serverless 云函数（当前部署在 Cloudflare Workers）+ 云数据库，支撑账号登录、个人数据云同步、云端内容（公告 / 作业 / 重要日期 / 每日一言）与管理员后台；后端说明见 [`api/README.md`](api/README.md)\n- **不登录也完全可用**：不注册时个人数据只保存在你自己的设备（localStorage）里，不上传服务器\n- 仓库开源：Gitee `zikang0529/class-site`（唯一内容源，自动镜像至 GitHub 并发布到 Pages）\n- 站内「导出备份」可下载完整站点备份包（需备份密码）\n\n---\n\n*本站由班级自主搭建与维护，内容如有错漏欢迎通过站内「意见反馈」告诉我们。*\n"},{"p":"资料_散落文件归档/资料_2026-10-06_【必做】数据库迁移-三条SQL.sql","n":"资料_2026-10-06_【必做】数据库迁移-三条SQL.sql","d":"","sz":2189,"t":"-- ============================================================\n-- 班级服务站 · 本轮上线必做的数据库迁移\n-- ------------------------------------------------------------\n-- 在哪跑：Neon 控制台 → 左侧 SQL Editor → 粘贴 → Run\n-- 顺序：必须在「代码已上线」之后立刻执行（代码已上线，所以现在就跑）\n-- 重复执行安全：三条都是幂等的，跑两遍不会出错\n--\n-- 为什么非跑不可：\n--   本轮新功能（公告上云、头衔任命、AI 助手账号）依赖下面两列。\n--   代码里 currentUser 会 select 这两列，库里没有 → 每条 SQL 直接报错\n--   → 表现为「登录失败 / 所有接口 500」。这是唯一会让线上出故障的点。\n-- ============================================================\n\n\n-- ① 头衔列：存「班长」「团支书」「化学课代表」等，多职用英文逗号分隔\nalter table profiles add column if not exists title text;\n\n\n-- ② AI 标记列：true 表示这是 AI 助手账号（可编辑云端公告/作业，且不随管理员毕业而失效）\nalter table users add column if not exists is_ai boolean not null default false;\n\n\n-- ③ 把 aibot 提为管理员 + 打上 AI 标记\n--    前提：aibot 这个账号要先注册过（用户名 aibot，密码你之前设的 ai202505）\n--    如果还没注册，先跑①②，注册完 aibot 再回来单独跑③\nupdate users\n   set role = 'admin',\n       is_ai = true,\n       display_name = coalesce(nullif(display_name, ''), 'ai助手')\n where lower(username) = 'aibot';\n\n\n-- ============================================================\n-- 跑完自检：应当返回 2 行（title 和 is_ai 两列都在）\n-- ============================================================\n-- select table_name, column_name, data_type\n--   from information_schema.columns\n--  where (table_name = 'profiles' and column_name = 'title')\n--     or (table_name = 'users'    and column_name = 'is_ai')\n--  order by table_name;\n\n-- 再自检一次 aibot 是否已提权：role 应为 admin，is_ai 应为 true\n-- select id, username, display_name, role, is_ai from users where lower(username) = 'aibot';\n"},{"p":"资料_散落文件归档/资料_2026-10-06_本轮交付说明.md","n":"资料_2026-10-06_本轮交付说明.md","d":"","sz":6096,"t":"# 后台改版交付说明（2026-10-06 晚）\n\n> 本轮完成你点名的三件事：**① 后台适配移动端；② 公告/内容合并成一个「班级内容」；③ 列表只留标题+时间，正文点「查看」看详情**。\n> 已推送到 Gitee（`adaa4cf`），等镜像自动同步后 GitHub Pages 就会生效。\n\n---\n\n## 一、改了什么\n\n### 1. 「公告管理」+「内容管理」→ 合并为「班级内容」\n\n以前两个面板长得几乎一样，你分不清哪个该用哪个——现在只有一个入口：\n\n| 原来 | 现在 |\n|---|---|\n| 公告管理（发布公告） | **班级内容**，类型选「公告」 |\n| 内容管理（作业/活动/课程表…） | **班级内容**，类型选其它 |\n\n- 一个列表、一个「新增内容」按钮，类型下拉里**公告排第一**（默认就是它）\n- 选「公告」时才出现「发布对象」（可定向给某几位同学），选其它类型自动隐藏\n- 列表里用**彩色徽章**区分类型：公告=红、作业=蓝、活动=绿、课程表/值日=橙\n\n### 2. 列表瘦身：只放「类型 + 标题 + 时间」\n\n你说的「移动端塞不下、电脑端不好看」就是正文塞表格导致的：\n\n- 列表行只显示：**类型徽章 · 标题 · 时间 · 定向人数 · 正文字数**\n- 点 **「查看」** → 弹出只读详情：元信息 + 完整正文（保留换行，可滚动）\n- 点 **「编辑」** → 才进入编辑弹窗\n- 点 **「删除」** → 确认框里还会带正文预览，防止删错\n\n### 3. 作业终于能看了（修复「作业显示不出来」）\n\n排查结论：数据一直是通的，坏在**后台作业表格根本没画正文**——只有标题/科目/截止，具体内容当然「看不见」。现在：\n\n- 列表行显示：**标题 · 时间区间（如 2026-10-01 ~ 2026-10-07）· 「6 个科目 · 8 条任务」摘要**\n- 点 **「查看」** → 按科目分组列出全部任务全文，图片/听力音频附件都有标注\n- 兼容两种数据形态：主站在用的科目分组结构、后台手动新增的扁平结构（后者以前后台完全认不出，看着就像作业丢了）\n\n### 4. 移动端适配（真机宽度实测）\n\n用真实 Chromium 按 **390px（iPhone）/ 360px（窄安卓）/ 768px（平板）/ 1440px（电脑）** 四档实测：\n\n- 所有列表从表格改为自适应记录行，**手机上零横向滚动**\n- 手机上每行的「查看/编辑/删除」按钮**铺满整行**，高度加大到 36px，好点不错\n- 弹窗正文限高滚动，不会把整屏撑爆\n- 四档全部通过：无横向滚动条、按钮不越界、布局自动切换\n\n### 5. 顺手抓出 3 个「会丢数据」的真 bug（都已修 + 加了回归护栏）\n\n1. **公告会翻倍**：旧代码把云端所有数组字段都摊平，公告被算了两遍——列表里每条公告出现两次，那个多出来的「幽灵副本」一编辑就会写进别的字段，永远删不掉。\n2. **选「活动」保存必失败**：前端把「活动」映射到 `activities` 字段，但后端白名单里根本没这个键，选了就 400。已统一落到 `site_config`，并加了「前端映射 × 后端白名单」交叉校验测试，以后再错会直接被测试抓住。\n3. **改公告可能清空每日一言**：本面板是全量提交，旧代码会把隔壁「每日一言」「重要日期」面板的字段铺成空数组一起传——改一条值日安排就会顺手清空 20 句一言和所有考试日期。现在明确划定边界，隔壁面板的数据碰都不碰。\n\n---\n\n## 二、测试与发布状态\n\n| 测试套件 | 结果 |\n|---|---|\n| 后端 E2E（含 3 条新护栏） | **274 / 274 ✓** |\n| 后台渲染（含 40 条新用例） | **437 / 437 ✓** |\n| 主站云端内容 | 57 / 57 ✓ |\n| 每日一言 / 班徽 | 9 ✓ / 17 ✓ |\n| 真实浏览器四档视口 | 零 ❌ |\n\n- 已推送 Gitee：`2c31e02..adaa4cf`\n- 本轮**只改了前端**（admin.html），后端 API 一个字没动，Workers 不需要重新部署\n- GitHub Pages 生效路径：Gitee 镜像自动同步（几分钟~几十分钟）→ Actions 发布 → 刷新即见\n\n---\n\n## 三、你要做的两件事\n\n### ① 等 Pages 同步后验收（约 10~30 分钟）\n\n打开后台 → 侧栏「班级内容」：\n\n- [ ] 列表只有标题+时间，点「查看」能看到正文\n- [ ] 作业列表点「查看」能看到按科目分组的全部作业\n- [ ] 手机上打开不出现横向滚动条\n\n### ② 在后台「令牌管理」里存两个令牌（等 Pages 生效后操作）\n\n侧栏「系统令牌」→「添加令牌」：\n\n| 名称 | 值 |\n|---|---|\n| `CLOUDFLARE_API_TOKEN` | 你发我的那个 `cfut_` 开头的 Worker 令牌 |\n| `GITEE_TOKEN` | 你的 Gitee 私人令牌 |\n\n只有管理员登录才能看到明文。\n\n### ③ 给 GitHub 仓库配 Secrets（你之前问的「怎么在 GitHub 里添加 Cloudflare 令牌」）\n\n这一步是为了让 `deploy-worker.yml` 能自动部署后端：\n\n1. 浏览器打开 `https://github.com/yuzikaaang/class-site` → **Settings** → 左栏 **Secrets and variables** → **Actions**\n2. 点 **New repository secret**，第一条：\n   - Name：`CLOUDFLARE_API_TOKEN`\n   - Secret：粘贴你 `cfut_` 开头的那个令牌\n   - Add secret\n3. 再点 **New repository secret**，第二条：\n   - Name：`CLOUDFLARE_ACCOUNT_ID`\n   - Secret：`81776bd68ddd69f93b9bf4959ca12a1e`（这个不是秘密，但 Actions 要用）\n4. 配完后到 **Actions** 标签页，随便选一次「部署后端到 Cloudflare Workers」运行，绿灯即通。以后只要 `api/` 下的文件有改动并推送，就会自动部署，不用再手动跑 wrangler。\n\n---\n\n## 四、遗留待办（下轮继续）\n\n- 导入 62 条班级名单\n- 删除临时测试账号 `__probe_diag_9527`\n- 修改 aibot 密码（`ai202505` 曾以明文出现，建议改掉）\n- 本环境到 workers.dev 的网络探测本轮后半段超时（HTTP 000），是沙箱出口网络抖动；后端零改动、且本会话早些时候已验证过 API 返回正常（count=5），如线上有异常刷新即可\n"}]},{"dir":"资料_效果预览","ver":"","date":"","title":"效果预览","theme":true,"count":4,"files":[{"p":"资料_效果预览/效果预览_2026-11-07_大屏作业页-顶栏变矮.png","n":"效果预览_2026-11-07_大屏作业页-顶栏变矮.png","d":"","sz":499144,"u":"a/b8f4bdb86ef500e7.jpg"},{"p":"资料_效果预览/效果预览_2026-11-07_大屏首页-标题居中.png","n":"效果预览_2026-11-07_大屏首页-标题居中.png","d":"","sz":607758,"u":"a/f23542c8ef2b4683.jpg"},{"p":"资料_效果预览/效果预览_2026-11-07_随机点名-学号2505前缀.png","n":"效果预览_2026-11-07_随机点名-学号2505前缀.png","d":"","sz":307727,"u":"a/f33c1a8c18ef4967.jpg"},{"p":"资料_效果预览/效果预览_2026-11-07_随机点名-配额权重面板.png","n":"效果预览_2026-11-07_随机点名-配额权重面板.png","d":"","sz":292561,"u":"a/62252c5505294f54.jpg"}]},{"dir":"资料_成绩分析参考","ver":"","date":"","title":"成绩分析参考","theme":true,"count":8,"files":[{"p":"资料_成绩分析参考/成绩分析参考_2026-10-14_分层教学四象限图.jpg","n":"成绩分析参考_2026-10-14_分层教学四象限图.jpg","d":"","sz":47208,"u":"a/bdc900ea8a2f8f8a.jpg"},{"p":"资料_成绩分析参考/成绩分析参考_2026-10-14_单次考试分析_总览与自动诊断.jpg","n":"成绩分析参考_2026-10-14_单次考试分析_总览与自动诊断.jpg","d":"","sz":47979,"u":"a/4ea71d27ba02859f.jpg"},{"p":"资料_成绩分析参考/成绩分析参考_2026-10-14_多次考试对比_班级趋势网格.jpg","n":"成绩分析参考_2026-10-14_多次考试对比_班级趋势网格.jpg","d":"","sz":45203,"u":"a/2bf229cbcc00930c.jpg"},{"p":"资料_成绩分析参考/成绩分析参考_2026-10-14_学生画像_各科趋势卡片.jpg","n":"成绩分析参考_2026-10-14_学生画像_各科趋势卡片.jpg","d":"","sz":48404,"u":"a/ef54d5fa0d33601c.jpg"},{"p":"资料_成绩分析参考/成绩分析参考_2026-10-14_总分分布直方图与四色分数段.jpg","n":"成绩分析参考_2026-10-14_总分分布直方图与四色分数段.jpg","d":"","sz":53724,"u":"a/97eb25b425c48293.jpg"},{"p":"资料_成绩分析参考/成绩分析参考_2026-10-14_班主任视角_各科在班的位置.jpg","n":"成绩分析参考_2026-10-14_班主任视角_各科在班的位置.jpg","d":"","sz":47783,"u":"a/585edd6b9bebdbd5.jpg"},{"p":"资料_成绩分析参考/成绩分析参考_2026-10-14_进退步分布散点图.jpg","n":"成绩分析参考_2026-10-14_进退步分布散点图.jpg","d":"","sz":59850,"u":"a/e5188a800f567d8b.jpg"},{"p":"资料_成绩分析参考/成绩分析参考_2026-10-14_需关注学生_拖后腿科目自动识别.jpg","n":"成绩分析参考_2026-10-14_需关注学生_拖后腿科目自动识别.jpg","d":"","sz":54231,"u":"a/415c4c008993ef19.jpg"}]},{"dir":"资料_成绩分析","ver":"","date":"","title":"成绩分析","theme":true,"count":42,"files":[{"p":"资料_成绩分析/成绩分析_2026-10-14_后台_导入预览.png","n":"成绩分析_2026-10-14_后台_导入预览.png","d":"","sz":696621,"u":"a/7bc61e39007f4431.jpg"},{"p":"资料_成绩分析/成绩分析_2026-10-14_后台_改分表.png","n":"成绩分析_2026-10-14_后台_改分表.png","d":"","sz":531124,"u":"a/0d40450242340570.jpg"},{"p":"资料_成绩分析/成绩分析_2026-10-14_后台_新建考试.png","n":"成绩分析_2026-10-14_后台_新建考试.png","d":"","sz":311882,"u":"a/d8b1d21b17c3e20c.jpg"},{"p":"资料_成绩分析/成绩分析_2026-10-14_后端接口自测脚本.mjs","n":"成绩分析_2026-10-14_后端接口自测脚本.mjs","d":"","sz":8235,"t":"const API = 'https://api.classsite.dpdns.org/api/scores';\nlet TOKEN = '';\nlet pass = 0, fail = 0;\nconst t = (name, cond, extra) => {\n  if (cond) { pass++; console.log('  ✓ ' + name); }\n  else { fail++; console.log('  ✗ ' + name + (extra !== undefined ? '  → ' + JSON.stringify(extra) : '')); }\n};\nconst call = async (action, opts = {}) => {\n  const url = API + '?action=' + action;\n  const r = await fetch(url, {\n    method: opts.method || 'GET',\n    headers: { 'Content-Type': 'application/json', ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}) },\n    body: opts.body ? JSON.stringify(opts.body) : undefined,\n  });\n  let j = null;\n  try { j = await r.json(); } catch { j = { _raw: 'non-json' }; }\n  return { status: r.status, j };\n};\n\n/* 登录 */\nconst login = await fetch('https://api.classsite.dpdns.org/api/auth?action=login', {\n  method: 'POST', headers: { 'Content-Type': 'application/json' },\n  body: JSON.stringify({ username: 'aibot', password: 'ai202505' }),\n}).then((r) => r.json());\nif (!login.ok) { console.log('登录失败', login); process.exit(1); }\nTOKEN = login.token;\nconsole.log('已登录：' + login.user.username + '（' + login.user.role + '）\\n');\n\n\n/* 先清理历史自测残留（上次脚本中断会留下） */\nconst pre = await call('list');\nfor (const e of (pre.j.exams || [])) {\n  if (String(e.name).indexOf('__接口自测__') === 0) {\n    const d = await call('exam-delete', { method: 'POST', body: { id: e.id } });\n    console.log('（清理残留自测考试 id=' + e.id + ' → ' + (d.j.ok ? '已删除' : '删除失败')) + '）';\n  }\n}\n\nconsole.log('【A】基础读接口');\nconst meta = await call('meta');\nt('meta 返回默认科目 6 科', Array.isArray(meta.j.defaultSubjects) && meta.j.defaultSubjects.length === 6, meta.j);\nt('化学/生物默认赋分', meta.j.defaultSubjects.filter((s) => s.graded).map((s) => s.name).join(',') === '化学,生物');\nt('默认分数线 3 条且 600 分线预填 600',\n  meta.j.defaultCutlines.length === 3 && meta.j.defaultCutlines.find((c) => c.key === 'line600').score === 600);\nt('默认分数线里特控/本科为空（学校没公布）',\n  meta.j.defaultCutlines.find((c) => c.key === 'special').score === null);\n\nconst cfg0 = await call('config');\nt('config 返回默认配置', cfg0.j.ok && cfg0.j.config.rankBasis === 'graded', cfg0.j);\n\nconst list0 = await call('list');\nt('list 可读且 isAdmin=true', list0.j.ok && list0.j.isAdmin === true, list0.j);\n\nconsole.log('\\n【B】新建考试');\nlet examId = 0;\nconst created = await call('exam-save', { method: 'POST', body: {\n  name: '__接口自测__（可删）', exam_date: '2026-10-14', exam_type: '月考',\n  subjects: meta.j.defaultSubjects,\n  cutlines: [{ key: 'special', label: '特控线', score: 512, color: '#b45309' },\n             { key: 'undergrad', label: '本科线', score: 448, color: '#c0392b' },\n             { key: 'line600', label: '600 分线', score: 600, color: '#7c3aed' }],\n  grade_ref: { students: 760, avgTotal: 480 },\n  note: '自动自测用，稍后删除',\n} });\nt('新建考试成功', created.j.ok && created.j.created === true, created.j);\nexamId = created.j.exam && created.j.exam.id;\nt('新考试默认是草稿状态', created.j.exam && created.j.exam.status === 'draft');\nt('分数线原样存回', created.j.exam && created.j.exam.cutlines[0].score === 512);\n\n/* 必填校验 */\nconst bad1 = await call('exam-save', { method: 'POST', body: { name: '', exam_date: '2026-10-14' } });\nt('缺名称被拦', bad1.status === 400, bad1.j);\nconst bad2 = await call('exam-save', { method: 'POST', body: { name: 'x', exam_date: '2026/10/14' } });\nt('日期格式不对被拦', bad2.status === 400, bad2.j);\n\nconsole.log('\\n【C】导入成绩（含缺考 / 赋分 / 并列 / 重名）');\nconst rows = [\n  { name: '测试甲', no: '250501', s: { chinese:{raw:118}, math:{raw:135}, english:{raw:126}, physics:{raw:88}, chemistry:{raw:82,assigned:91}, biology:{raw:85,assigned:93} }, schoolRank: 42, leagueRank: 310 },\n  { name: '测试乙', no: '250502', s: { chinese:{raw:132}, math:{raw:149}, english:{raw:138}, physics:{raw:97}, chemistry:{raw:93,assigned:97}, biology:{raw:91,assigned:96} }, schoolRank: 5, leagueRank: 21 },\n  { name: '测试丙', no: '250503', s: { chinese:{raw:120}, math:{raw:149}, english:{raw:130}, physics:{raw:90}, chemistry:{raw:80,assigned:89}, biology:{raw:84,assigned:92} }, schoolRank: 18, leagueRank: 120 },\n  { name: '测试丁', no: '250504', s: { chinese:{raw:105}, math:{raw:110}, english:null, physics:{raw:70}, chemistry:{raw:66,assigned:78}, biology:{raw:72,assigned:83} }, schoolRank: 210, leagueRank: 1580 },\n  { name: '测试丁', no: '250505', s: { chinese:{raw:100}, math:{raw:100}, english:{raw:100}, physics:{raw:60}, chemistry:{raw:60,assigned:70}, biology:{raw:60,assigned:75} } },\n];\nconst imp = await call('scores-import', { method: 'POST', body: { exam: examId, rows } });\nt('导入成功', imp.j.ok && imp.j.imported === 4, imp.j);\nt('同名重复被拦下（只留第一行）', imp.j.skippedCount === 1 && /同名重复/.test(imp.j.skipped[0]), imp.j.skipped);\nt('未匹配到站点账号的姓名被列出', Array.isArray(imp.j.unmatched) && imp.j.unmatchedCount >= 4, imp.j.unmatched);\n\nconst board = await call('board&exam=' + examId);\nt('board 能取回成绩', board.j.ok && board.j.rows.length === 4, board.j.rows && board.j.rows.length);\nconst r0 = board.j.rows.find((x) => x.name === '测试甲');\nt('赋分科目两个值都在（raw + assigned）', r0 && r0.s.chemistry.raw === 82 && r0.s.chemistry.assigned === 91, r0 && r0.s);\nt('校排名 / 联考排名都存下来了', r0 && r0.schoolRank === 42 && r0.leagueRank === 310);\nconst r3 = board.j.rows.find((x) => x.name === '测试丁');\nt('单科缺考（英语 null）不报错、不写进该科', r3 && r3.s.english === undefined, r3 && r3.s);\n\nconsole.log('\\n【D】发布状态');\nconst pub = await call('exam-publish', { method: 'POST', body: { id: examId, publish: true } });\nt('发布成功', pub.j.ok && pub.j.status === 'published', pub.j);\nconst unpub = await call('exam-publish', { method: 'POST', body: { id: examId, publish: false } });\nt('可撤回', unpub.j.ok && unpub.j.status === 'draft', unpub.j);\n\nconsole.log('\\n【E】增量改分（后台编辑表用）');\nconst upd = await call('scores-save', { method: 'POST', body: { exam: examId, rows: r0 ? [\n  { id: r0.id, name: '测试甲', no: '250501', s: { chinese:{raw:125}, math:{raw:140}, english:{raw:130}, physics:{raw:90}, chemistry:{raw:85,assigned:93}, biology:{raw:88,assigned:95} }, schoolRank: 30, leagueRank: 220 },\n] : [] }});\nt('改动一行成功', upd.j.ok && upd.j.updated === 1, upd.j);\nconst board2 = await call('board&exam=' + examId);\nconst r0b = board2.j.rows.find((x) => x.name === '测试甲');\nt('改动已落库', r0b.s.math.raw === 140, r0b.s.math);\n\nconst addRow = await call('scores-save', { method: 'POST', body: { exam: examId, rows: [\n  { name: '测试新同学', s: { chinese:{raw:110}, math:{raw:115}, english:{raw:112}, physics:{raw:75}, chemistry:{raw:70,assigned:82}, biology:{raw:74,assigned:86} } },\n]}});\nt('新增一行（转学生场景）成功', addRow.j.ok && addRow.j.inserted === 1, addRow.j);\n\nconsole.log('\\n【F】异常与权限');\nconst noExam = await call('board&exam=99999999');\nt('不存在的考试返回 404', noExam.status === 404, noExam.j);\nconst delBad = await call('row-delete', { method: 'POST', body: { id: 99999999, exam: examId } });\nt('删不存在的行不报 500', delBad.j.ok === true, delBad.j);\n\nconsole.log('\\n【G】清理测试数据');\nconst del = await call('exam-delete', { method: 'POST', body: { id: examId } });\nt('测试考试已删除', del.j.ok && del.j.deleted === examId, del.j);\nconst list1 = await call('list');\nt('列表里已无测试考试', list1.j.ok && !list1.j.exams.some((e) => e.name === '__接口自测__（可删）'), list1.j.exams.map((e) => e.name));\nconst board3 = await call('board&exam=' + examId);\nt('删除后 board 取不到（连带成绩一起删）', board3.status === 404, board3.j);\n\nconsole.log('\\n' + '='.repeat(50));\nconsole.log('结果: ' + pass + ' 通过, ' + fail + ' 失败（共 ' + (pass + fail) + ' 项）');\nprocess.exit(fail ? 1 : 0);\n"},{"p":"资料_成绩分析/成绩分析_2026-10-14_成绩分析入口_暂未对外开放.png","n":"成绩分析_2026-10-14_成绩分析入口_暂未对外开放.png","d":"","sz":705810,"u":"a/9d53526716016bd8.jpg"},{"p":"资料_成绩分析/成绩分析_2026-10-14_本地_成绩单.png","n":"成绩分析_2026-10-14_本地_成绩单.png","d":"","sz":243375,"u":"a/24492c85f840eff6.jpg"},{"p":"资料_成绩分析/成绩分析_2026-10-14_线上_全班成绩单.png","n":"成绩分析_2026-10-14_线上_全班成绩单.png","d":"","sz":302354,"u":"a/71ee9c09d5e69087.jpg"},{"p":"资料_成绩分析/成绩分析_2026-10-14_线上_我的画像.png","n":"成绩分析_2026-10-14_线上_我的画像.png","d":"","sz":341741,"u":"a/b545dbdc02336c0a.jpg"},{"p":"资料_成绩分析/成绩分析_2026-10-15_分享页_免登录.png","n":"成绩分析_2026-10-15_分享页_免登录.png","d":"","sz":195930,"u":"a/2ecb18ad8208563f.jpg"},{"p":"资料_成绩分析/成绩分析_2026-10-15_站主_四象限与热力图.png","n":"成绩分析_2026-10-15_站主_四象限与热力图.png","d":"","sz":334875,"u":"a/f2b2f8c0d5c774a0.jpg"},{"p":"资料_成绩分析/成绩分析_2026 "},{"p":"资料_成绩分析/v2.9.6/成绩分析_2026-10-15_未登录_登录引导.png","n":"成绩分析_2026-10-15_未登录_登录引导.png","d":"","sz":757895,"u":"a/8bd4f8cb3efa4b45.jpg"},{"p":"资料_成绩分析/v2.9.6/成绩分析_2026-10-15_点开直接展示_桌面.png","n":"成绩分析_2026-10-15_点开直接展示_桌面.png","d":"","sz":638776,"u":"a/3c1a90cd946861ac.jpg"}]},{"dir":"资料_座位表方案","ver":"","date":"","title":"座位表方案","theme":true,"count":2,"files":[{"p":"资料_座位表方案/座位表_2026-11-25_方案草案v0.1.md","n":"座位表_2026-11-25_方案草案v0.1.md","d":"","sz":6880,"t":"# 「座位表」功能方案草案 v0.1\n\n> 本轮**只出方案，不写代码、不上线**。需求细节等你找的视频和逐条答复后再定稿。\n> 拟放置位置：首页「其他工具」分类（categoryId 8），与「全屏时钟」并列一张卡片，点开独立页面 `seat.html`。\n\n## 一、定位\n\n给班级做一个**可导入、可快捷调整、可投屏**的电子座位表。主要场景：\n- 排座位 / 换座位时，在手机上拖拽或从名单里选人，快速调好一张新表；\n- 投到大屏，值日、上课点名、随机提问时对着看；\n- 每次调整后能留一版历史，需要时切回。\n\n## 二、页面形态（初想）\n\n- 顶部：班级/学期选择、工具栏（导入名单、保存、撤销、随机排、清空、投屏）。\n- 主体：一个按「行 × 列」排布的座位网格，每格显示姓名（可带学号）。\n- 底部/侧栏：未入座名单（拖进去就坐、拖出来就退回待分配）。\n- 风格：沿用站点现有配色与明暗模式，支持全屏横屏（复用大屏样式经验）。\n\n## 三、核心功能清单\n\n### A. 基础必备（建议第一版就有）\n| 功能 | 说明 |\n|------|------|\n| 导入班级名单 | 粘贴姓名（一行一个 / 逗号分隔）或上传表格列，生成待分配名单 |\n| 班级与学期切换 | 复用站点已有的班级岛配置（沿用平时成绩那套学期来源） |\n| 座位网格编辑 | 设置行数列数（如 7 列 × 8 行），格子可点选/拖拽换人 |\n| 快捷换座 | 两人对调、整行轮换、整体左移/右移/前后排平移 |\n| 保存与读取 | 本地保存 + 私有云同步（和站点其它数据一致） |\n| 历史版本 | 每次保存留一版，可命名、可回看、可恢复 |\n| 投屏/全屏 | 大屏显示当前座位表，适合点名 |\n\n### B. 进阶可选（看你视频和答复再取舍）\n- 随机排座 / 按身高或成绩规律排座；\n- 小组模式（把相邻几组合为一组，组内换座）；\n- 特殊位置标记（如靠窗、讲台旁、需照顾视力）；\n- 请假/缺席标记，临时座位与固定座位分开；\n- 权限区分：谁能改（管理员/班主任）、谁只能看；\n- 一键生成图片/链接分享给家长或同学；\n- 与「点名/提问」联动，随机抽人时高亮座位。\n\n## 四、数据结构设想（初稿）\n\n```\nseat_data_v1 = {\n  classId, term,\n  rows, cols,                      // 网格规模\n  grid: [ [studentId|null, ...] ], // 每个座位的占用\n  pool: [studentId],               // 未入座名单\n  students: { id: {name, no, note} },\n  history: [ { id, name, time, snapshot } ]\n}\n```\n- 存本地 `localStorage` 一份，同步到私有云 `user_data` 一份（沿用现有云同步通道）。\n\n## 五、待你确认的问题（请逐条答复）\n\n1. **名单来源**：你希望怎么导入？直接粘贴姓名、上传 Excel、还是从站点已有的同学名单/成绩名单里拉取？\n2. **班级规模与布局**：我们班实际几列几行？有没有男女同桌、 aisle 过道、特殊固定位（如班长坐第一排）？\n3. **换座方式**：你视频里想要的是「拖拽换位」「点两个人再对调」「整行滚动」里的哪一种或哪几种？\n4. **要不要随机排**：需不需要一键随机排座 / 按某种规则排（身高、成绩、男女搭配）？\n5. **历史与留痕**：需不需要保存多个版本、能给每版起名字、随时切回？\n6. **权限**：谁能改座位表？只有你（管理员/班主任）能改，还是课代表/同学也能改？其他人是否只读？\n7. **投屏用途**：投到大屏主要是「看」还是要「互动」（随机点名高亮）？\n8. **分享**：需不需要导成图片或生成一个链接发给别人？\n9. **和现有数据的关系**：名单要不要跟「成绩分析」里的同学名单打通（避免维护两份）？\n10. **你视频里的关键点**：等你把视频发来，我会按其功能逐条比对上面清单，补齐遗漏项再定稿。\n\n## 六、下一步\n\n- 你答复上面问题 + 发视频 → 我据此出 v0.2 详细方案（含页面草图、字段、交互流程）→ 你确认后再排期开发、升版本上线。\n- 本轮不涉及任何代码改动和版本升级。\n\n---\n\n## 七、第二轮口述需求速记（2026-11-25，持续补充中）\n\n> 本节仅按用户口述原样记录，细节以用户后续补充为准。**本轮不开工**：不写代码、不建网页、不改站点、不升版本。\n\n### 7.1 班级座位布局（据用户发的照片 + 口述）\n- 全班分 **3 个大组**；**讲台旁另有 2 个单独座位**。\n- 每个大组内：**横向相邻 3 人 = 1 个小组**；小组内部不换，换座以「小组」为单位整体移动。\n- 轮换举例：第 1 大组的第 1 小组，换到第 2 大组的第 2 小组位置。\n- 照片里姓名卡有粉 / 蓝 / 黄等颜色区分，**含义待确认**。\n\n### 7.2 开发流程约定\n- 先**单独建一个网页**，把所有功能都试用好；\n- 确认成熟后，再**嵌入班级服务站**（首页「其他工具」卡片入口）。\n\n### 7.3 页面与交互\n- 手机点进去**默认横屏**；编辑状态默认横屏。\n- 布局：**左侧座位区、右侧信息区、右下角班级成员（候选栏）**。\n- 有**候选栏**：待分配 / 临时下来的成员放这里。\n- 点击某人卡片 → 显示该人信息，**复用后台用户数据**。\n\n### 7.4 名单与数据\n- 名单**直接复用后台用户数据**（后台那些人），不另建名单。\n- 卡片点开看到的人员信息，同样复用后台。\n\n### 7.5 投屏（两版，需镜像）\n- 需要投屏，且有**两版**。\n- **给老师看**：名字**朝向讲台**（字朝讲台方向）。\n- **给同学换座时看**：名字**朝向同学**。\n- 切换方式、镜像的具体做法 —— 用户后续再讲。\n\n### 7.6 快捷小组轮换（每周换座）\n- 每周换一次座位，每次重排麻烦，希望有**快捷轮换**。\n- 换座有规律；以小组为单位，组内不动。\n- 后台可**设置轮换顺序**：先点一个小组，再点另一个小组，形成「A 组 → B 组」的轮换链。\n- 用户自述\"现在说不明白\"，后续再细讲。\n\n### 7.7 特殊情况\n- 方案草案里列出的各类特殊情况（请假 / 临时座 / 固定位等）都要能换座处理。\n\n### 7.8 待用户下次补充（不要开工，等说全）\n- [ ] 投屏两版的切换方式、镜像的具体做法\n- [ ] 快捷轮换的操作细节：点选顺序如何定义轮换链、能否循环、能否存多套方案\n- [ ] 每个大组实际几排、全班人数、讲台旁两座是什么用途\n- [ ] 姓名卡颜色（粉 / 蓝 / 黄）的含义\n- [ ] 用户承诺发的功能参考视频\n- [ ] 其他尚未说完的点（用户：\"我也没说完，等我下次再补充\"）\n"},{"p":"资料_座位表方案/座位表_2026-11-25_方案草案v0.2.md","n":"座位表_2026-11-25_方案草案v0.2.md","d":"","sz":15419,"t":"# 「座位表」参考产品解析 + 需求梳理 v0.2\n\n> 本轮**只解析、只梳理、不开工**：不写代码、不建网页、不改站点、不升版本。\n> 已完整解析：① 官网 fuckseats.577622.xyz ② 两段宣传视频（各约 3 分钟）③ GitHub 开源仓库 README。\n> 参考产品：不想排座位 FuckSeats 3.0（作者：老三，GPL-3.0）。\n\n---\n\n## 一、参考产品（不想排座位 3.0）功能全貌\n\n### 1. 核心能力\n- **导入名单**：Excel 选工作表/范围/字段（姓名、学号、成绩、自定义信息）；支持已有座位表按布局导入；支持 BSCE / SDES / .seats 格式。\n- **手动调座**：拖拽换位；双击座位输入姓名/拼音首字母/学号找人；支持 Shift/Ctrl 多选整体移动。\n- **教室布局编辑**：座位、走廊、讲台、空位四种格子；布局可平移、镜像、行列增删。\n- **约束规则**：固定座位、指定/避开区域、两人相邻或不相邻等（官网称 11 种）。\n- **自动排座策略**（8 种）：随机、成绩降序、成绩升序、优前差后、优后差前、成绩均摊、小组均衡、师徒结对（还有单科王同桌等偏好）。\n- **小组系统**：班内设学习小组、组长，支持**小组轮换**。\n- **每周轮换**（重点）：视频演示——**小组整块在各组之间循环平移**（如第1组→第2组→第3组→第1组），组长随组走，一键完成。这和你说的逻辑一致。\n- **考场模式**（重点）：① 标门的位置 ② 输人数选推荐布局/自设行列 ③ 试算最少搬运量、看搬运动画与逐桌清单 ④ 按组/排/S型编桌号、打印桌号标签/桌位图/搬运清单 ⑤ 考后一键生成搬回路线复原。原则：**能整列平移就整列平移，只单独搬必须搬的桌子**；靠门先搬出。\n- **导出**：Excel、SVG、PPTX、.seats 快照、小组登记表、CSIS；打印座次表。\n- **撤销/重做**、快照（每班 1000 步）、历史留痕。\n- **云同步**：首次全量、后续增量（一处改动只传几百字节）；冲突检测、快照可恢复。\n- **多班级/班级组**：多班一起管，布局/规则/小组可复用。\n- **AI（闻道智能）**：自然语言排座（\"把林安和陈思交换\"），姓名脱敏，工具调用需确认。\n- **大屏投放（Drop）**：把当前布局投到教室教师端大屏（Windows，默认关闭）。\n\n### 2. 界面 / 多端\n- 桌面侧边导航 + 工具栏 + 右侧可调侧栏（学生/小组/约束面板）；三档响应式（≥840px 完整 / 600–839px 精简 / ≤599px 底部标签栏触控优化）。\n- 视频里的手机端：主要是**人在外面用手机查看/排座**，画面为竖屏座位表；未强调自动横屏。\n- 两种主题：星河蓝 / 澎湃橙。\n\n### 3. 与你班需求的差异（我们做减法 + 定制）\n| 参考产品有 | 我们是否需要 | 说明 |\n|---|---|---|\n| 多班级轮换 / 班级组 | ❌ 不做 | 只在本班使用 |\n| 复杂约束（不能和谁坐等 11 种） | 📌 先记入清单，暂不做 | 你说\"目前用不到\"，但保留 |\n| AI 智能排座 | ❌ 暂不做 | — |\n| 云同步 / 多端 | ✅ 用我们自己的 | 存到咱们站点私有云 |\n| 考场模式 | ✅ 要，且定制 | 标前门/后门、靠门先打出、哪些桌子优先 |\n| 每周小组轮换 | ✅ 要，且定制 | 按我们三人小组 + 教室实际规律 |\n| 男女颜色卡片 | ✅ 要改 | 参考产品是白色卡片；我们用**蓝=男、红=女** |\n| 大屏/投屏 | ✅ 要，两版镜像 | 老师版字朝讲台 / 同学版字朝同学 |\n| 手机端自动横屏（编辑） | ✅ 要 | 参考产品没强调，我们要 |\n\n---\n\n## 二、我理解的「我们班版」需求（待你确认）\n\n### A. 数据与人员\n- 名单、姓名、学号、成绩、性别、班干部职位 → **全部复用后台用户数据**，不另建一份。\n- 可**排除不参与排座的人**（如休学、老师），排除的不出现在座位表。\n- 点某人卡片 → 弹出该人**完整信息**（后台有的数据 + 成绩 + 班干部职位；职位也可显示在卡片下方）。\n\n### B. 座位表编辑（管理员端）\n- 候选栏：把名字输入/拖入候选区；两个卡片可交换位置。\n- 教室元素以**类似 Excel 的表格**呈现：过道、讲台、黑板、饮水机、盆栽、前门、后门等可标注（这些**不参与轮换**，是固定背景）。\n- 人物卡片男女用蓝/红色区分。\n- 教室布局示意：三个大组 + 讲台旁两个单独座位（见第一轮照片）。\n\n### C. 小组与每周轮换（定制重点）\n- 三人一组为常态，但**有的小组只有两人** → 界面要预留三个位置，实际可只填两人。\n- 大组用 A/B/C 列标识（你举例\"第一组的 A 列换到第二组的 B 列\"）。\n- 轮换设置：后台点\"源小组 + 目标小组\"即定义一条轮换映射（如点第1组A → 第2组B，表示这组整体换过去）。\n- 小组内部成员不动，整组搬迁。\n\n### D. 考场模式（定制重点）\n- 标注前门/后门位置；**靠门的桌子优先打出**。\n- 设置哪些桌子优先打出、编桌号、生成搬运动画、考后复原。\n- 参考产品的\"整列平移少搬运\"逻辑可以借鉴。\n\n### E. 大屏模式（重点，两版镜像）\n- 任何人打开 → 默认是**只读座位表**，看到自己坐哪，**自己座位标红**。\n- 管理员有\"编辑\"按钮，点了自动横屏进入编辑。\n- 投屏两版：**老师版**（名字朝讲台）/ **同学版**（名字朝同学），需镜像切换。\n\n### F. 普通用户端\n- 可看当前座位、**下一次座位**（你坐哪标红）。\n- 点\"下一次\"→ 播放动画，自动排出下周所有人的位置。\n- 其他功能待定。\n\n### G. 通用\n- 保存 → 存云端（沿用站点通道）；撤销/重做；历史快照。\n- 开发路径：先单独做网页试用 → 成熟后嵌入网站 → 升**大版本**。\n\n---\n\n## 三、待你确认的问题（不懂的多问，请逐条答）\n\n**关于开发与形态**\n1. 单独网页是放在 `/workspace` 一个独立 html，还是也走本地 server + 云 API？最终嵌入时是站内新页面 `seat.html` 吗？\n2. 这个座位功能，**管理员身份怎么判定**？沿用现有后台登录（谁能进 admin 谁能编辑）？还是另设一套？\n3. 普通同学\"打开看到自己坐哪\"——他们**需要登录**吗？还是靠某个免登录链接/班级码就能看？如果需要识别\"我是谁\"，怎么判断？（这是标红自己座位的前提）\n\n**关于人员与数据**\n4. 后台用户数据里，**性别字段**是现成的吗？如果有些人没填性别，卡片显示什么颜色？\n5. \"班干部职位\"在后台是哪个字段？直接显示在卡片下方即可，还是点开才看？\n6. 排除不参与排座的人（休学/老师），是**管理员手动勾选**，还是按某个标签自动排除？\n\n**关于座位表编辑**\n7. 教室元素（过道/讲台/黑板/饮水机/门）：用**固定模板**（开局就画好三大组+讲台），还是允许管理员自由添加/拖动这些元素？\n8. 卡片交换：拖拽 + \"点两个卡片交换\" 两种都要吗？手机上拖拽不好使，是否主要靠\"点两个卡片\"？\n9. 候选栏里的人，和座位表里的人，怎么区分\"谁没入座\"？\n\n**关于每周轮换（最关键，请讲细）**\n10. 你说的\"A列/B列\"——是指**每个大组内部的三列**（左中右三列）吗？还是大组的编号？请举个例子说清\"第一组A → 第二组B\"到底是什么换到什么。\n11. 轮换是**一次性预览**（排给我看，我确认后保存），还是每周自动生效？\n12. \"下一次座位\"是**已经提前排好存着**，还是点\"下一次\"时按轮换规则**现算**？\n13. 轮换规则会不会每周变？需要能**修改/删除**已设的轮换映射吗？\n\n**关于考场模式**\n14. \"靠门先打出\"——前门和后门各打哪边？打出后剩下的桌子是**整体往中间靠拢**，还是保持原位只留空？\n15. 考场要不要也分男女/小组？还是纯按桌号排人？\n16. 考后复原：是恢复到\"上周日常座位\"，还是\"当前编辑的这一版\"？\n\n**关于大屏 / 投屏（最关键，请讲细）**\n17. \"投屏两版镜像\"具体是：同一个网页里一个开关切正/镜像？还是两个独立链接/两个页面？\n18. \"名字朝讲台 / 朝同学\"——是指**文字旋转 180°**，还是整个座位表左右/上下翻转？请描述老师坐在讲台看大屏时，希望字是什么朝向。\n19. 大屏模式投到什么设备？是**另一个浏览器窗口/另一台电脑打开同一网址**，还是要接具体投屏协议？（我们的站点是纯网页，没法直接控制教室大屏硬件，通常是\"大屏那台设备打开网址\"）\n20. 同学自己标红：如果同一时刻有多个同学看，各自看到的是**各自标红**（需要各自登录/识别身份），对吗？\n\n**关于样式**\n21. 网站现在有明暗主题。座位表是**跟随站点明暗**，还是自己一套（比如参考产品的蓝/橙主题）？\n22. 手机编辑强制横屏：如果用户在竖屏锁定的手机上打开，是**提示旋转**，还是不强求只是横屏布局更好用？\n\n---\n\n## 四、六个关键问题的答复（2026-11-25，用户口述）\n\n1. **身份识别**：同学要**登录**（跟成绩分析一样，登录后才能对应到自己的名字和数据）。自己的座位 = 小卡片**边框加粗 + 标色**表示。免登录暂不做；分享功能本次不做，以后想做再说。\n2. **管理员判定**：沿用后台用户数据——**能进后台的就是管理员**。后台不新增内容，座位功能**全部新增在前端**。\n3. **投屏两版 = 打印朝向**（重要澄清）：本质是**打印出来的朝向**两种情况——\n   - **老师版**：A4 纸贴讲台上，学生名字**正常方向**（字顶朝讲台/朝上），老师站着看是正的；\n   - **同学版**：学生名字**旋转 180°**（字顶朝同学），同学看是正的；\n   - **\"讲台\"等固定字样不旋转**，只转学生名字。\n   - 打印功能**要加**（跟视频里一样）。\n4. **大屏投到哪**（重要澄清）：不是另做投屏网页。就是**大屏模式打开后默认是全班座位表（只读）**，功能精简，让大家看着、跟作业表一起换。编辑一般在自己电脑或手机上做。\n5. **A列/B列 / 轮换记法**（重要澄清）：\n   - 三个大组：**靠前的=1组，中间的=2组，左边的=3组**；\n   - 字母 = 排号（靠讲台前往后）：**A=第1排、B=第2排、C=第3排……最多到 G（7 排），少则到 F（6 排）**；\n   - 记法：**1B = 第一组第二排，2C = 第二组第三排**；\n   - 每组每排 3 人（有时座位不满只有 2 人）；\n   - **讲台旁还有 2 个邻排座位**，每周轮换时这两个人**互相换一下**即可。\n6. **下一次座位**：点的时候**现场计算**，不提前存。但要能**保存历史座位表记录**（视频里有介绍），历史记录功能要有。\n7. 用户补充：**还要再发一张座位表图片**（更精确的布局），并提示\"还有很多问题要问\"。\n\n## 五、22 个问题的完整答复（2026-11-25，定稿口径）\n\n| # | 问题 | 答复（定稿） |\n|---|---|---|\n| 1 | 页面形态 | **单独做一个新页面**，主站里能跳转过去即可（不放主站内，避免太大） |\n| 2 | 管理员判定 | 能进后台的就是管理员（已答） |\n| 3 | 打印朝向 | 老师版字正常 / 同学版学生名转 180°（已答） |\n| 4 | 性别字段 | 后台数据**有**，直接用 |\n| 5 | 班干部职位 | 后台数据**有**，直接用；显示在卡片下方 |\n| 6 | 不参与排座的人 | 后台没完整字段，**手动勾选**哪些人不参与 |\n| 7 | 教学元素 | **允许自由拖动**，更像表格，可有单元格合并；基本布局已定：讲台、讲台左=前门、讲台右=盆栽、右上=饮水机、左上=后门，另加几个过道 |\n| 8 | 卡片交换 | **拖拽 + 点两个卡片交换，两种都要**；手机端也两种都加 |\n| 9 | 候选栏 | 候选栏 = **未落座的人**；已落座的在座位表里，不出现在候选栏 |\n| 10-12 | 每周轮换 | **手动点触发**，不是自动；按设定规则走，不用纠结\"每周\"字面 |\n| 13 | 轮换规则 | 规则**可修改**；不改就按上次的规则走 |\n| 14 | 考场桌位 | 靠前门/后门的桌子方便先打出；默认 **5 列×6 行=30 桌**，行列数**可改**；多的桌子按规则打出 |\n| 15 | 考场排人 | **只按 S 型写桌号（1..N），谁坐不用管**（全校打乱模拟） |\n| 16 | 考后复原 | 不用做复原；考试是**预览**，演示完自动回日常座位 |\n| 17-19 | 大屏/身份 | 同前：各看各的手机，不会多人同看；大屏默认只读座位表 |\n| 20 | 多人同看 | 不可能；各人用自己手机只看自己的表 |\n| 21 | 明暗主题 | 跟主站适配，一样即可 |\n| 22 | 手机横屏 | 不是强制旋转，而是**编辑模式界面按横屏布局**（手机宽度不够，横向排布方便编辑） |\n\n### 座位表精确布局（俯视方位，按用户第 3 次指正最终确定）\n- **方位：上北下南、左西右东**（俯视平面图，不是照片的老师视角）。\n- **黑板 + 讲台在北侧（顶部）**，A 排靠讲台画在最上面，往下 B→G。\n- **四角固定元素**：西北=盆栽、东北=前门、西南=饮水机、东南=后门、后门旁=垃圾桶；**西侧整条是窗户**。\n- **三大组从西到东（左→右）= 第3组 / 第2组 / 第1组**（3 组靠西窗、1 组靠东过道）。照片是老师视角（左=东=1组、右=西=3组），组内每排需反转成地图西→东。\n- **每排 3 格从西(靠窗)→东(靠过道)**；余子康在**第3组 A 排最东（靠过道）那格**，不靠窗，已橙色高亮。\n- 护法位：地图左(西)=卢拓琳、右(东)=车正楠（照片里\"右护法李玉麟\"后台查无此人，按相近名暂用卢拓琳，待用户核对）。\n- 组排数：3 组 6 排、2 组 7 排、1 组 7 排，每排 3 人（个别排不满/有空位）。\n- 卡片颜色：蓝=男 / 粉红=女，班干部显示金色小标；黄色作性别未填标记。\n- 名字与后台真实数据比对（63 人，男37/女25/1缺失；12 人有班干部头衔）。\n\n### 后台真实数据（已拉取）\n- 接口：`/api/admin?action=members`，字段：name / studentId / extra.gender / titles[].\n- 63 名学生，含学号、性别、班干部头衔；原型直接内嵌这份数据。\n\n## 六、原型已完成（2026-11-25）\n- 独立原型：`/workspace/座位表原型/index.html`，说明见同目录 `原型说明.md`，截图在 `截图/`。\n- **本阶段不嵌入主站、不升版本、未动主站任何代码**。\n- 方位二次返工：改为俯视平面图（上北下南左西右东），详见上方\"精确布局\"。\n- 视觉+动画大升级：教室底板/黑板/讲台立体质感、门窗绿植饮水机图标、西墙窗户、方位罗盘、卡片入场/交换弹跳/轮换流动/考场生成/弹层弹簧等动画。\n- 23 项方位与交互断言全过、零报错。\n- 下一步：用户评审原型 → 确认功能取舍 → 成熟后再嵌入主站（另开版本）。\n"}]},{"dir":"资料_座位表原型","ver":"","date":"","title":"座位表原型","theme":true,"count":33,"files":[{"p":"资料_座位表原型/index.html","n":"index.html","d":"","sz":58272,"t":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>座位表 · 25级05班<\/title>\n<style>\n:root{\n  --fg:#1f2937;--fg2:#4b5563;--fg3:#9ca3af;\n  --a:#2563eb;--ink:#1d4ed8;\n  --bg1:#ffffff;--bg2:#f5f6f8;--bg3:#eef1f5;\n  --card:#ffffff;--line:#e2e6ec;--line2:#cfd6e0;\n  --tint:#eff6ff;\n  --male:#1d4ed8;--male-bg:#eff6ff;--male-line:#c7dcfb;\n  --female:#e11d48;--female-bg:#fff1f2;--female-line:#fecdd3;\n  --gold:#b45309;--gold-bg:#fffbeb;\n  --mine:#2563eb;--mine-bg:#eff6ff;\n  --board1:#334155;--board2:#1e293b;--board-edge:#94a3b8;\n  --sh1:0 1px 2px rgba(15,23,42,.05);--sh2:0 4px 14px rgba(15,23,42,.10);\n}\nhtml[data-theme=dark]{\n  --fg:#f1f5f9;--fg2:#cbd5e1;--fg3:#94a3b8;\n  --bg1:#1e293b;--bg2:#0f172a;--bg3:#1e293b;--card:#1e293b;\n  --line:#334155;--line2:#475569;--tint:rgba(59,130,246,.12);\n  --male:#93c5fd;--male-bg:rgba(59,130,246,.18);--male-line:rgba(59,130,246,.4);\n  --female:#fda4af;--female-bg:rgba(225,29,72,.18);--female-line:rgba(225,29,72,.4);\n  --gold:#fcd34d;--gold-bg:rgba(180,83,9,.2);\n  --mine:#60a5fa;--mine-bg:rgba(59,130,246,.2);\n  --board1:#0f172a;--board2:#020617;--board-edge:#64748b;\n}\n*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}\nhtml,body{height:100%}\nbody{font-family:'PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;color:var(--fg);background:var(--bg2);font-size:14px;line-height:1.5;overflow-x:auto}\nbutton{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}\n.stage-wrap{width:1100px;transform-origin:top left}\n.app{width:1100px;margin:0 auto;padding:14px 16px 60px}\n\n/* 顶栏 */\n.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}\n.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.05rem;white-space:nowrap}\n.brand .lg{width:28px;height:28px;border-radius:7px;background:var(--a);display:grid;place-items:center;color:#fff;font-size:.9rem;font-weight:800}\n.brand em{font-style:normal;font-size:.6rem;font-weight:600;color:var(--a);border:1px solid var(--a);border-radius:4px;padding:1px 5px}\n.spacer{flex:1}\n.btn{padding:7px 13px;border-radius:7px;background:var(--card);border:1px solid var(--line2);font-size:.82rem;font-weight:600;box-shadow:var(--sh1);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:background .15s,border-color .15s}\n.btn:hover{background:var(--tint);border-color:var(--a)}\n.btn:active{background:var(--bg3)}\n.btn.pri{background:var(--a);color:#fff;border-color:var(--a)}\n.btn.pri:hover{background:var(--ink);color:#fff}\n.btn.sm{padding:5px 10px;font-size:.74rem;border-radius:6px}\n.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;padding:2px;gap:2px;background:var(--card)}\n.seg button{padding:6px 12px;border-radius:5px;font-size:.8rem;font-weight:600;color:var(--fg2)}\n.seg button.act{background:var(--a);color:#fff}\n\n/* 主体两栏 */\n.layout{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start}\n.room-panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--sh1)}\n.room-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px;flex-wrap:wrap}\n.room-title{font-weight:800;font-size:1rem;display:flex;align-items:center;gap:8px}\n.room-title small{font-weight:400;color:var(--fg3);font-size:.72rem}\n.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.7rem;color:var(--fg2)}\n.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid}\n.lg-male{background:var(--male-bg);border-color:var(--male-line)!important}\n.lg-female{background:var(--female-bg);border-color:var(--female-line)!important}\n.lg-mine{background:var(--mine-bg);border-color:var(--mine)!important;border-width:2px!important}\n\n/* 教室平面图 */\n.room{position:relative;min-width:700px;padding:64px 46px 56px;border:2px solid var(--line2);border-radius:12px;background:\n  radial-gradient(circle at 1px 1px,rgba(15,23,42,.05) 1px,transparent 0) 0 0/18px 18px,\n  linear-gradient(180deg,var(--bg1),var(--bg2));user-select:none}\n.fixture{position:absolute;font-size:.68rem;font-weight:600;color:var(--fg2);background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:4px 10px;white-space:nowrap;z-index:3}\n.fixture.nw{top:14px;left:16px}\n.fixture.ne{top:14px;right:16px}\n.fixture.sw{bottom:14px;left:16px}\n.fixture.se{bottom:14px;right:16px}\n.fixture.bin{bottom:14px;right:104px}\n.window-wall{position:absolute;left:14px;top:112px;bottom:74px;width:12px;border-radius:6px;\n  background:linear-gradient(180deg,#bfe0f5,#dceefc 40%,#bfe0f5 60%,#dceefc);border:1px solid #9ccbe8}\n.window-wall::before,.window-wall::after{content:'';position:absolute;left:0;right:0;height:2px;background:#9ccbe8}\n.window-wall::before{top:33%}.window-wall::after{top:66%}\n.board{height:36px;border-radius:6px;background:linear-gradient(180deg,var(--board1),var(--board2));color:#eef6f0;display:grid;place-items:center;font-weight:700;letter-spacing:.6em;font-size:.9rem;margin:0 auto 5px;position:relative;width:76%;text-indent:.6em}\n.board::after{content:'';position:absolute;bottom:-5px;left:6%;right:6%;height:4px;border-radius:0 0 4px 4px;background:linear-gradient(180deg,var(--board-edge),#7d6544)}\n.stage-row{display:flex;align-items:center;justify-content:center;gap:26px;margin:20px 0 8px}\n.stage{background:#e8c9a0;border:2px solid #b98a54;border-radius:8px;padding:10px 46px;font-weight:800;color:#6b4423;letter-spacing:.5em;font-size:1rem;text-indent:.5em;box-shadow:0 4px 0 #b0804e}\n.dais{width:64px;min-height:52px;border:1px dashed var(--line2);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.68rem;color:var(--fg3);cursor:pointer;padding:4px;gap:1px}\n.dais:hover{border-color:var(--a)}\n.dais.filled{border-style:solid}\n.dais .nm{font-size:.74rem;font-weight:700}\n.aisle-tag{text-align:center;font-size:.55rem;letter-spacing:.4em;color:var(--fg3);margin:6px 0 0;text-indent:.4em}\n.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:38px;margin-top:6px}\n.g-label{text-align:center;font-size:.74rem;font-weight:700;color:var(--fg2);margin-bottom:8px;letter-spacing:.1em}\n.g-label b{color:var(--a)}\n.rows{display:flex;flex-direction:column;gap:6px}\n.row{display:flex;align-items:center;gap:5px}\n.row-tag{width:16px;flex:none;text-align:center;font-size:.66rem;font-weight:700;color:var(--fg3)}\n.seats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;flex:1}\n\n/* 座位卡片：固定等高 */\n.seat{height:66px;border-radius:9px;border:1.5px solid var(--line2);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:6px 4px;overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s}\n.seat:hover{transform:translateY(-2px);box-shadow:var(--sh2);z-index:4}\n.seat .nm{font-size:1rem;font-weight:700;white-space:nowrap;line-height:1.2;position:relative;z-index:1}\n.seat .sb{font-size:.62rem;color:var(--gold);white-space:nowrap;max-width:100%;overflow:visible;line-height:1.25;position:absolute;bottom:4px;left:0;right:0;text-align:center;z-index:1}\n.seat.male{background:var(--male-bg);border-color:var(--male-line)}\n.seat.male .nm{color:var(--male)}\n.seat.female{background:var(--female-bg);border-color:var(--female-line)}\n.seat.female .nm{color:var(--female)}\n.seat.unknown{background:var(--gold-bg);border-color:var(--gold)}\n.seat.unknown .nm{color:var(--gold)}\n.seat.empty{background:transparent;border-style:dashed;border-color:var(--line)}\n.seat.mine{border:2.5px solid var(--mine)!important;background:var(--mine-bg)!important;box-shadow:0 0 0 3px rgba(37,99,235,.16);z-index:2}\n.seat.mine::after{content:'我';position:absolute;top:-1px;right:-1px;background:var(--mine);color:#fff;font-size:.5rem;font-weight:800;padding:1px 4px;border-radius:0 8px 0 8px;z-index:3}\n.seat.sel{outline:3px solid var(--a);outline-offset:1px;z-index:5}\n.seat.swapping{animation:swapPop .5s var(--pop)}\n.seat.flowin{animation:flowIn .5s var(--ease) both}\n.floor{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--fg3);font-size:.62rem}\n.floor::before,.floor::after{content:'';flex:1;height:1px;background:var(--line)}\n\n/* 侧栏 */\n.side{display:flex;flex-direction:column;gap:12px}\n.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh1);overflow:hidden}\n.card-h{padding:10px 13px;border-bottom:1px solid var(--line);font-weight:700;font-size:.85rem;display:flex;align-items:center;justify-content:space-between;gap:8px}\n.card-h .cnt{font-size:.68rem;font-weight:600;color:var(--fg3);background:var(--bg3);padding:1px 7px;border-radius:16px}\n.card-b{padding:11px 13px}\n.login-me{display:flex;align-items:center;gap:10px}\n.login-me .av{width:42px;height:42px;border-radius:11px;background:var(--a);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.05rem;flex:none}\n.login-me .info{flex:1;min-width:0}\n.login-me .info b{font-size:.9rem}\n.login-me .info div{font-size:.68rem;color:var(--fg3)}\n.info-empty{text-align:center;color:var(--fg3);font-size:.76rem;padding:16px 4px}\n.info-grid{display:grid;grid-template-columns:60px 1fr;gap:10px 12px;align-items:start}\n.info-av{width:60px;height:60px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:1.35rem}\n.info-kv{display:flex;flex-direction:column;gap:6px;min-width:0}\n.kv{display:flex;justify-content:space-between;gap:8px;font-size:.76rem;border-bottom:1px dashed var(--line);padding-bottom:5px}\n.kv .k{color:var(--fg3);flex:none}\n.kv .v{font-weight:600;text-align:right;word-break:break-all}\n.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}\n.tag{font-size:.64rem;padding:2px 7px;border-radius:16px;background:var(--tint);color:var(--ink);border:1px solid var(--line2);font-weight:600}\n.tag.role{background:var(--a);color:#fff;border-color:transparent}\n.hint-line{font-size:.68rem;color:var(--fg3);margin-top:9px;line-height:1.6}\n.pool{display:flex;flex-wrap:wrap;gap:6px;max-height:190px;overflow:auto}\n.chip{padding:5px 9px;border-radius:7px;border:1px solid var(--line2);background:var(--card);font-size:.74rem;font-weight:600;cursor:grab;display:inline-flex;align-items:center;gap:5px}\n.chip:active{cursor:grabbing}\n.chip.drop-in{outline:2px dashed var(--a)}\n.pool-empty{font-size:.72rem;color:var(--fg3);padding:8px 0}\n.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}\n.tool{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:11px 13px;text-align:left;transition:border-color .15s,background .15s}\n.tool:hover{border-color:var(--a);background:var(--tint)}\n.tool b{display:block;font-size:.84rem;margin-bottom:2px}\n.tool span{font-size:.68rem;color:var(--fg3)}\n\n/* 弹层 */\n.mask{position:fixed;inset:0;background:rgba(28,26,24,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}\n.mask.show{display:flex}\n.modal{background:var(--card);border:1px solid var(--line);border-radius:12px;width:min(720px,100%);max-height:88vh;overflow: ③ 第 2 组前两排 + 后两排 →\n   - ④ 第 2 组中间排 →\n   - ⑤ 第 3 组首尾各一排 →\n   - ⑥ 最后才动第 3 组中间排（**尽量不动第 3 组**，因为左边搬起来方便）。\n   - 现有桌数含右护法位共 **59** 张。走廊按 **2 个桌子间距**计入。\n3. **搬出后去掉斜纹\"反光\"**：原位变为干净空白（无 repeating-linear-gradient 斜纹、无\"已搬出\"字样），保留的桌子按考场竖 S 顺序清晰编号。\n\n## 〇·旧、v0.5 关键重做（已保留）\n\n1. **手机竖屏 → 提示转横屏**：竖屏打开显示\"请旋转手机到横屏\"（带旋转动画），横屏后显示等比缩放的完整桌面版（与电脑一致）；有\"仍要竖屏查看\"兜底按钮。\n2. **考场模式彻底重做**（之前做成空白长方形网格+挖空，完全跑偏，现已推翻）：\n   - **场景 = 真实教室座位表**：黑板、讲台、护法位（戴云聪/车正楠）、三大组、走廊、门窗、盆栽、垃圾桶、窗户全部保留，桌子按日常座位排好，不再生成长方形。\n   - **竖 S 型编号**：桌号从右上角（前门侧）起，**沿列竖向**蛇形——同列从上往下 1→2→3，换相邻列从下往上折回，而不是横着走。\n   - **搬出规则**：要搬出数 = 教室现有桌数(58) − 考场需要桌数；前门在上、后门在下，**距离只按排算，走廊（横向隔组）不计入距离**；要搬出的平均分两半——最靠前门的（前排）搬一半、最靠后门的（后排）搬一半，均匀落在三个组。\n   - **搬出的桌子不消失**：原位变斜纹\"已搬出\"空位；卡片带人名**一张接一张**飞到教室右侧延长的\"门外\"区，门外区列出人名 + 前门/后门标记。\n   - **人名显隐开关**：可勾选是否显示桌上人名。\n   - 只保留一个输入项\"考场需要的桌数（如 6×6=36）\"。\n\n## 一、v0.4 按反馈逐条改完（已保留）\n\n| # | 你的要求 | 实现 |\n|---|---|---|\n| 1 | 手机当电脑用，别做手机专门适配 | 去掉竖屏旋转提示与手机重排；固定 1100px 桌面版，手机端用 transform **整体等比缩放**（看得到全貌），双击可放大 |\n| 2 | 不要手动勾选\"不参与排座\" | 删除该功能按钮与逻辑；候选栏即候选（现有 1 人：卢拓琳） |\n| 3 | 用户不能切换 | 去掉身份下拉，固定后台登录者「余子康」，只显团支书 |\n| 4 | 轮换改成点小组编辑 | 轮换设置里点组排网格：**先点源、再点目标**即生成\"源→目标\"规则，替代原来的下拉输入 |\n| 5 | 每行等高 | 座位卡片固定 66px 高，有无职位都一样高 |\n| 6 | 手机名字显示不全 | 桌面整体缩放后名字完整；职位文字改为不截断，完整显示（如\"语文课代表\"） |\n| 7 | 讲台文字重复 | 删掉图形框内的重复字样，现在只有一个\"讲 台\" |\n| 8 | AI 味重、不要 emoji | 清除全部 emoji 与花哨图标/发光动画；纯白底、蓝男粉女、细边框、朴素按钮 |\n| 9 | 换座加撤回 | 交换/移动/复原后提示条带「撤回」，顶栏也有「撤回」，支持 Ctrl+Z；50 步操作栈 |\n| 10 | 考试号从门开始 | 右上角前门、右下角后门；桌号从右上靠前门处起按 **S 型**编号，**右上角固定为 1 号**（不再跑到左上角） |\n| 11 | 打桌动画 | 输入行列与考试人数→自动算\"多出的桌子\"→**靠门优先搬出**→带人名**一张接一张依次飞出门外**（间隔 650ms）→下方列出已搬出人名；可勾选「显示桌上人名」开关；空位不算桌子 |\n\n## 二、沿用已确认的布局与数据\n- 后台真实名单 63 人（姓名/学号/性别/职位）。\n- 俯视方位：黑板+讲台在顶部，A 排靠讲台；三大组从左到右=第3/2/1组；四角：盆栽/前门/饮水机/后门，垃圾桶在后门左边同排；左侧窗户。\n- 护法位：左=戴云聪、右=车正楠；余子康在第3组 A 排靠过道，高亮\"我\"。\n- 卡片蓝=男 / 粉=女；职位只显示\"团支书\"等真实头衔，过滤\"电教委\"。\n- 保留：点卡片看详情（含六科占位表）、拖拽换位、下一次座位、历史记录、大屏只读、打印两版、明暗主题。\n\n## 三、验证\n- Playwright 真实浏览器 **23 项断言全过，零 JS 报错**。\n- 覆盖：无竖屏提示 / 无 emoji / 讲台单一 / 无不参与 / 无身份切换 / 固定登录者 / 卡片等高 / 护法位 / 余子康位置 / 职位完整 / 手机等比缩放 / 交换与撤回 / 点选轮换 / 考场前门1号 / 靠门搬出 / 人名显隐 / 依次飞出动画。\n- 截图见 `截图/v4-*.png`（编辑 / 考场动画 / 大屏 / 手机缩放）。\n\n## 四、仍需你评审 / 待定\n1. 考场\"靠门先搬出\"的**顺序规则**：当前按\"离门曼哈顿距离由近到远，同距前门优先\"。若你们实际是从某一侧整列搬，告诉我改。\n2. 搬出人名来自名单顺序（演示用）；嵌入主站后应接真实考场名单。\n3. 手机等比缩放后字较小（这是\"当电脑看\"的必然结果）；若你更想要\"字大但要看全\"，可折中做一个\"只看座位表、隐藏侧栏\"的大屏式手机视图。\n4. 座位表方案成熟后再嵌入主站（届时另开大版本）。\n"},{"p":"资料_座位表原型/截图/01-编辑模式.png","n":"01-编辑模式.png","d":"","sz":524274,"u":"a/b9a89f1da08b17c3.jpg"},{"p":"资料_座位表原型/截图/02-成员信息.png","n":"02-成员信息.png","d":"","sz":232675,"u":"a/002d4819578a0321.jpg"},{"p":"资料_座位表原型/截图/03-轮换规则.png","n":"03-轮换规则.png","d":"","sz":209640,"u":"a/350bf55a23547254.jpg"},{"p":"资料_座位表原型/截图/04-考场预览.png","n":"04-考场预览.png","d":"","sz":400992,"u":"a/e4158c6f98104ff7.jpg"},{"p":"资料_座位表原型/截图/05-大屏模式.png","n":"05-大屏模式.png","d":"","sz":491320,"u":"a/d82dff524cacedef.jpg"},{"p":"资料_座位表原型/截图/v3-01-编辑模式-白底.png","n":"v3-01-编辑模式-白底.png","d":"","sz":574263,"u":"a/4945ab4092be65b7.jpg"},{"p":"资料_座位表原型/截图/v3-02-成员信息-六科.png","n":"v3-02-成员信息-六科.png","d":"","sz":547673,"u":"a/6bc7b7a8dae2ee01.jpg"},{"p":"资料_座位表原型/截图/v3-03-大屏模式.png","n":"v3-03-大屏模式.png","d":"","sz":371989,"u":"a/d05b6eb82cf98727.jpg"},{"p":"资料_座位表原型/截图/v3-04-暗色模式.png","n":"v3-04-暗色模式.png","d":"","sz":566659,"u":"a/e11d04e44ff80e60.jpg"},{"p":"资料_座位表原型/截图/v3-05-手机竖屏提示.png","n":"v3-05-手机竖屏提示.png","d":"","sz":44253,"u":"a/15faa5c6621db9ac.jpg"},{"p":"资料_座位表原型/截图/v4-01-编辑模式.png","n":"v4-01-编辑模式.png","d":"","sz":231418,"u":"a/970b46a1fabb6cf0.jpg"},{"p":"资料_座位表原型/截图/v4-02-考场搬运动画.png","n":"v4-02-考场搬运动画.png","d":"","sz":207901,"u":"a/84500535ad80580d.jpg"},{"p":"资料_座位表原型/截图/v4-03-大屏模式.png","n":"v4-03-大屏模式.png","d":"","sz":215664,"u":"a/83293bac1ec2c1ac.jpg"},{"p":"资料_座位表原型/截图/v4-04-手机整体缩放.png","n":"v4-04-手机整体缩放.png","d":"","sz":172045,"u":"a/3ce1eeb6b3d3a760.jpg"},{"p":"资料_座位表原型/截图/v4-05-线上验证.png","n":"v4-05-线上验证.png","d":"","sz":202596,"u":"a/c075f5f921dba00f.jpg"},{"p":"资料_座位表原型/截图/v5-01-编辑模式.png","n":"v5-01-编辑模式.png","d":"","sz":230815,"u":"a/3826877d82155
