核）对第三方 Cookie 限制很严，登录态会莫名其妙掉。\n   用 Bearer token 存 localStorage，跨域一样稳定。\n   ============================================================ */\n\nimport { getSql, cfg } from './db.js';\n\n/* ============================================================\n   表结构自愈（全站公共）\n   ------------------------------------------------------------\n   背景：2026-10-05 上线「首次登录强制改密 + 登录记录」时新增了\n   users.must_change_password 列与 login_log 表。站主如果没在 Neon\n   执行建表脚本，任何引用新列的查询都会直接 500 —— 表现为\n   「无法登录，服务器内部问题」，且完全依赖人工记得执行 SQL。\n\n   这里做一次幂等的结构补全：缺列补列、缺表建表。Postgres 的\n   IF NOT EXISTS 语义保证重复执行无副作用，配合下面的内存标记，\n   每个进程生命周期内只真正跑一次，开销可忽略。\n\n   任何失败都只记录警告、不抛错：自愈逻辑绝不能变成新的故障点。\n   （若数据库账号没有 DDL 权限，补全失败，但老库的基本登录仍可正常。）\n   ------------------------------------------------------------ */\nlet schemaReady = false;\nexport async function ensureSchema(sql) {\n  if (schemaReady) return;\n  /* 先置位再执行：无论成功失败都只尝试一次，避免每次请求都刷一遍日志 */\n  schemaReady = true;\n  const s = sql || getSql();\n  try {\n    await s`\n      alter table users add column if not exists must_change_password\n        boolean not null default false\n    `;\n    await s`\n      create table if not exists login_log (\n        id         bigserial   primary key,\n        user_id    bigint      not null references users(id) on delete cascade,\n        ip         text,\n        user_agent text,\n        created_at timestamptz not null default now()\n      )\n    `;\n    await s`\n      create index if not exists login_log_user_idx\n        on login_log (user_id, created_at desc)\n    `;\n    await s`\n      create index if not exists login_log_time_idx\n        on login_log (created_at desc)\n    `;\n    /* 班级通讯录 / 个人资料（与 schema.sql 保持一致，见该文件的说明） */\n    await s`\n      create table if not exists profiles (\n        id             bigserial   primary key,\n        name           text,\n        name_hash      text        unique,\n        student_id     text        unique,\n        politics       text,\n        exam_no        text,\n        role           text        not null default '学生',\n        wechat         text,\n        qq             text,\n        phone          text,\n        contact_status text        not null default 'none',\n        reject_reason  text,\n        user_id        bigint      references users(id) on delete set null,\n        created_at     timestamptz not null default now(),\n        updated_at     timestamptz not null default now()\n      )\n    `;\n    /* 老库补列：exam_no 是后加的（2026-10-05 导入名单时需要）。 */\n    await s`alter table profiles add column if not exists exam_no text`;\n    await s`\n      create table if not exists profile_view_log (\n        id          bigserial   primary key,\n        viewer_id   bigint      not null references users(id) on delete cascade,\n        target_id   bigint      references profiles(id) on delete set null,\n        target_name text,\n        keyword     text,\n        ip          text,\n        created_at  timestamptz not null default now()\n      )\n    `;\n    await s`create index if not exists profiles_name_idx    on profiles (name)`;\n    await s`create index if not exists profiles_exam_idx    on profiles (exam_no)`;\n    await s`create index if not exists profiles_sid_idx     on profiles (student_id)`;\n    await s`create index if not exists profiles_user_idx    on profiles (user_id)`;\n    await s`create index if not exists profiles_status_idx  on profiles (contact_status)`;\n    await s`create index if not exists pvl_viewer_idx on profile_view_log (viewer_id, created_at desc)`;\n    await s`create index if not exists pvl_target_idx on profile_view_log (target_id, created_at desc)`;\n    await s`create index if not exists pvl_time_idx   on profile_view_log (created_at desc)`;\n  } catch (e) {\n    /* 自愈失败不抛错：老库的基本功能仍可用（只是少了强制改密与登录记录）。\n       只警告一次，避免每次请求都刷日志把真正的问题淹没。\n       （测试桩 SQLite 不支持 ADD COLUMN IF NOT EXISTS，会走到这里，属预期。） */\n    console.warn('[schema] 表结构自愈未完成（不影响基本功能）：', e.message);\n  }\n}\n\n/** 允许的请求头 / 方法 */\nconst ALLOW_HEADERS = 'Content-Type, Authorization';\nconst ALLOW_METHODS = 'GET, POST, PUT, DELETE, OPTIONS';\n\n/**\n * 按白名单设置 CORS 响应头。\n * 跨站请求必须回显具体 Origin，不能回 '*'（带 Authorization 时浏览器会拒绝）。\n */\nexport function cors(req, res) {\n  const origin = req.headers.origin || '';\n  const { allowOrigins } = cfg();\n\n  let allow = '*';\n  if (!allowOrigins.includes('*')) {\n    allow = allowOrigins.includes(origin) ? origin : allowOrigins[0] || '';\n  } else if (origin) {\n    /* 白名单是 * 时，回显具体来源，方便本地调试 */\n    allow = origin;\n  }\n\n  if (allow) res.setHeader('Access-Control-Allow-Origin', allow);\n  res.setHeader('Vary', 'Origin');\n  res.setHeader('Access-Control-Allow-Methods', ALLOW_METHODS);\n  res.setHeader('Access-Control-Allow-Headers', ALLOW_HEADERS);\n  /* 预检结果缓存 24 小时，减少 OPTIONS 请求 */\n  res.setHeader('Access-Control-Max-Age', '86400');\n}\n\n/** 预检请求直接放行 */\nexport function handlePreflight(req, res) {\n  if (req.method === 'OPTIONS') {\n    /* 注意：Vercel 的 res 是原生 Node ServerResponse，没有 Express 的 res.status()，\n       必须用 statusCode + end()。这里曾经用 res.status(204) 导致预检 500。 */\n    cors(req, res);\n    res.statusCode = 204;\n    res.setHeader('Content-Length', '0');\n    res.end();\n    return true;\n  }\n  return false;\n}\n\n/** 统一 JSON 响应 */\nexport function json(res, status, body) {\n  res.statusCode = status;\n  res.setHeader('Content-Type', 'application/json; charset=utf-8');\n  /* 接口一律不缓存，避免拿到过期的登录态/数据 */\n  res.setHeader('Cache-Control', 'no-store, max-age=0');\n  res.end(JSON.stringify(body));\n}\n\nexport function ok(res, data) {\n  json(res, 200, { ok: true, ...data });\n}\n\nexport function fail(res, status, msg, extra) {\n  json(res, status, { ok: false, error: msg, ...(extra || {}) });\n}\n\n/** 读取请求体。\n *  - Workers：入口已把请求体预读成字符串挂在 req.__rawBody\n *  - Vercel / FC：body 可能已是对象、字符串或 Buffer，做兼容\n *  - 兜底：手动读流（仅 Node 环境有流事件）\n */\nexport async function body(req) {\n  if (req.body && typeof req.body === 'object' && !isBuffer(req.body)) return req.body;\n\n  /* Workers 入口预读的原始串 */\n  let raw = req.__rawBody !== undefined ? req.__rawBody : req.body;\n\n  if (isBuffer(raw)) raw = raw.toString('utf-8');\n  if (typeof raw === 'string' && raw) {\n    try {\n      return JSON.parse(raw);\n    } catch {\n      return {};\n    }\n  }\n  if (raw === '' || raw === undefined || raw === null) {\n    /* Workers 下没有流事件，直接返回空对象 */\n    if (!req.on) return {};\n  }\n\n  /* 兜底：Node 环境手动读流 */\n  if (!req.on) return {};\n  return await new Promise((resolve) => {\n    let raw = '';\n    req.on('data', (c) => {\n      raw += c;\n    });\n    req.on('end', () => {\n      try {\n        resolve(raw ? JSON.parse(raw) : {});\n      } catch {\n        resolve({});\n      }\n    });\n    req.on('error', () => resolve({}));\n  });\n}\n\n/** 兼容判断 Buffer（Workers 里没有 Buffer 全局） */\nfunction isBuffer(v) {\n  return typeof Buffer !== 'undefined' && Buffer.isBuffer(v);\n}\n\n/* ---------------- 会话与鉴权 ---------------- */\n\nfunction bearer(req) {\n  const h = req.headers.authorization || '';\n  const m = /^Bearer\\s+(.+)$/i.exec(h.trim());\n  return m ? m[1].trim() : '';\n}\n\n/**\n * 解析当前登录用户。\n * @returns {Promise<{id:number,username:string,role:string}|null>}\n */\nexport async function currentUser(req) {\n  const token = bearer(req);\n  if (!token) return null;\n  const sql = getSql();\n  /* 确保 must_change_password 列存在，否则下面的 select 会整条失败 */\n  await ensureSchema(sql);\n  const rows = await sql`\n    select u.id, u.username, u.role, u.status, u.display_name, u.created_at,\n           coalesce(u.must_change_password, false) as must_change_password,\n           s.expires_at\n      from sessions s\n      join users u on u.id = s.user_id\n     where s.token = ${token}\n       and s.expires_at > now()\n     limit 1\n  `;\n  if (!rows.length) return null;\n  const u = rows[0];\n  if (u.status !== 'active') return null;\n\n  /* 查该账号认领的班级资料（可能没有）。\n     profiles 表由 ensureSchema 保证存在；查询失败不阻断登录态。 */\n  let profileId = null;\n  try {\n    const pr = await sql`select id from profiles where user_id = ${u.id} limit 1`;\n    if (pr.length) profileId = Number(pr[0].id);\n  } catch (e) {\n    /* 老库或无 DDL 权限时可能查不到，忽略即可 */\n  }\n\n  return {\n    id: Number(u.id),\n    username: u.username,\n    role: u.role,\n    displayName: u.display_name,\n    createdAt: u.created_at,\n    mustChangePassword: !!u.must_change_password,\n    profileId,\n  };\n}\n\n/** 要求已登录；未登录时直接写入 401 并返回 null */\nexport async function requireUser(req, res) {\n  const u = await currentUser(req);\n  if (!u) {\n    fail(res, 401, '未登录或登录已过期，请重新登录');\n    return null;\n  }\n  return u;\n}\n\n/** 要求管理员；权限不足时写入 403 并返回 null */\nexport async function requireAdmin(req, res) {\n  const u = await requireUser(req, res);\n  if (!u) return null;\n  if (u.role !== 'admin') {\n    fail(res, 403, '需要管理员权限');\n    return null;\n  }\n  return u;\n}\n\n/**\n * 要求「已完成首次改密」的用户。\n *\n * 首次登录被强制改密时，前端会弹一个不可关闭的弹窗；但光靠前端不够——\n * 有人可以拿 token 直接调接口绕过。所以后端这里再拦一道：\n * must_change_password = true 的用户，除 /auth?action=me|change-password|logout\n * 之外的接口一律 403 拒绝。\n *\n * @param {string} allowAction 当前 action 名，命中白名单则放行\n */\nexport async function requireUserReady(req, res, allowAction) {\n  const ALLOW = ['me', 'change-password', 'logout'];\n  const u = await requireUser(req, res);\n  if (!u) return null;\n  if (u.mustChangePassword && !ALLOW.includes(String(allowAction || '').toLowerCase())) {\n    fail(res, 403, '首次登录请先修改初始密码', { mustChangePassword: true });\n    return null;\n  }\n  return u;\n}\n\n/** 生成随机会话 token（32 字节十六进制） */\nexport function newToken() {\n  const bytes = new Uint8Array(32);\n  crypto.getRandomValues(bytes);\n  return Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');\n}\n\n/** 记录管理操作日志（审计用，失败不影响主流程） */\nexport async function audit(actorId, action, targetType, targetId, detail) {\n  try {\n    const sql = getSql();\n    await sql`\n      insert into audit_log (actor_id, action, target_type, target_id, detail)\n      values (${actorId}, ${action}, ${targetType}, ${targetId || null}, ${detail || null})\n    `;\n  } catch {\n    /* 审计失败不阻断业务 */\n  }\n}\n"},{"p":"资料_班级站后台备份/后端源码/班级站后台备份_2026-10-05_index.mjs","n":"班级站后台备份_2026-10-05_index.mjs","d":"","sz":3317,"t":"/* ============================================================\n   阿里云函数计算（FC）统一入口\n   ------------------------------------------------------------\n   一个函数搞定三个接口：/api/auth、/api/data、/api/admin。\n   好处：冷启动只发生一次、控制台只需配一套环境变量、路由集中。\n\n   与 Vercel 版本的关系：\n     auth.js / data.js / admin.js 里的 `export default async function handler(req,res)`\n     原样保留，Vercel 继续按文件生成函数；本文件只是把同一个 handler\n     接到 FC 的 HTTP 入口上。两套部署互不干扰。\n   ============================================================ */\n\nimport authHandler from './auth.js';\nimport dataHandler from './data.js';\nimport adminHandler from './admin.js';\nimport profileHandler from './profile.js';\nimport { cors } from './_lib/http.js';\n\n/* FC 的 resp 是 Express 风格（有 send / setHeader / setStatusCode）。\n   现有代码写的是 Node 原生 res（statusCode + end），这里做一层兼容，\n   保证两种写法都能跑，将来换回 Vercel 也不用改业务代码。 */\nfunction wrapRes(resp) {\n  if (resp.__wrapped) return resp;\n  const shim = {\n    __wrapped: true,\n    setHeader: (k, v) => resp.setHeader(k, v),\n    get statusCode() { return resp.statusCode; },\n    set statusCode(v) { resp.statusCode = v; if (typeof resp.setStatusCode === 'function') resp.setStatusCode(v); },\n    end: (body) => (typeof resp.send === 'function' ? resp.send(body) : resp.end(body)),\n    send: (body) => (typeof resp.send === 'function' ? resp.send(body) : resp.end(body)),\n  };\n  return shim;\n}\n\n/* 把 FC 的 req 补齐成 Vercel 的形状（业务代码只认 req.query / req.method / req.headers） */\nfunction wrapReq(req) {\n  if (!req.query && req.queries) req.query = req.queries;\n  if (!req.query) req.query = {};\n  return req;\n}\n\nexport const handler = async (req, resp, context) => {\n  const r = wrapReq(req);\n  const res = wrapRes(resp);\n\n  /* 取出路径里 /api/ 之后的那一段；兼容 FC 默认域名可能带前缀的情况 */\n  const raw = (r.path || r.url || '').split('?')[0];\n  const m = /\\/api\\/([a-zA-Z0-9_-]+)/.exec(raw);\n  const seg = m ? m[1].toLowerCase() : '';\n\n  try {\n    switch (seg) {\n      case 'auth':  return await authHandler(r, res);\n      case 'data':  return await dataHandler(r, res);\n      case 'admin': return await adminHandler(r, res);\n      case 'profile': return await profileHandler(r, res);\n      default:\n        /* 这里也要回 CORS 头：否则跨域下浏览器会把 404 响应整个拦掉，\n           前端只能看到一句含糊的 \"Failed to fetch\"，看不出到底是接口名写错还是没配后端 */\n        cors(r, res);\n        res.statusCode = 404;\n        res.setHeader('Content-Type', 'application/json; charset=utf-8');\n        res.end(JSON.stringify({ ok: false, error: '未知接口：/api/' + (seg || '(空)') }));\n        return;\n    }\n  } catch (e) {\n    console.error('[fc]', seg, e);\n    cors(r, res);\n    res.statusCode = 500;\n    res.setHeader('Content-Type', 'application/json; charset=utf-8');\n    res.end(JSON.stringify({ ok: false, error: '服务器内部错误' }));\n  }\n};\n\n/* Vercel 兼容（若将来仍走 Vercel，可忽略本文件） */\nexport default handler;\n"},{"p":"资料_班级站后台备份/后端源码/班级站后台备份_2026-10-05_profile.js","n":"班级站后台备份_2026-10-05_profile.js","d":"","sz":11448,"t":"/* ============================================================\n   /api/profile —— 班级通讯录 / 个人资料查询\n   ------------------------------------------------------------\n   GET    ?action=search&q=关键词      按姓名或学号查询（需登录）\n   GET    ?action=me                   读自己认领的那条资料（需登录）\n   GET    ?action=mine-requests        看自己提交的联系方式与审核状态\n   POST   ?action=submit               提交 / 修改自己的微信、QQ、手机号（进待审）\n   POST   ?action=claim                用学号认领本人资料（关联到登录账号）\n\n   ⚠️ 隐私设计（务必遵守，改代码前先读完）\n   ① 资料只存数据库，前端不含任何通讯录数据。\n      旧方案把 XOR 密文放进 index.html，而密钥同在 JS 里 = 等于公开，\n      这正是本次要解决的问题，不要走回头路。\n   ② 查询必须登录。未登录一律 401，不给任何「先看看有什么」的机会。\n   ③ 联系方式（微信/QQ/手机号）只有 contact_status='approved' 才返回；\n      pending / rejected 一律不回给「别人」，但本人可见自己的状态与驳回原因。\n   ④ 每次成功查询都写 profile_view_log —— 谁在什么时候查了谁，\n      站主在后台可查。这是对查询行为的约束，不是可选功能。\n   ⑤ 姓名 / 学号 / 政治面貌 是身份信息，本接口一律不接受同学修改，\n      只能由管理员在后台维护。\n   ============================================================ */\n\nimport { getSql } from './_lib/db.js';\nimport {\n  cors, handlePreflight, ok, fail, body, requireUser, requireUserReady,\n} from './_lib/http.js';\n\n/** 单次查询返回的最大条数（防止有人拉全表） */\nconst MAX_RESULTS = 30;\n/** 关键词长度上限 */\nconst MAX_Q = 40;\n/** 联系方式字段长度上限 */\nconst MAX_CONTACT = 64;\n\nexport default async function handler(req, res) {\n  if (handlePreflight(req, res)) return;\n  cors(req, res);\n\n  const action = String(req.query.action || 'search').toLowerCase();\n\n  /* 所有动作都要求「已登录且已改过初始密码」。\n     用 requireUserReady 而非 requireUser：首次登录被强制改密的人\n     在改密前不该能查询同学资料。\n\n     ⚠️ 第二个参数是「允许放行的动作名」，必须显式传实际动作，不能偷懒传 'me'。\n        原因：requireUserReady 的白名单是 ['me','change-password','logout']，\n        如果这里传固定的 'me'，那 search 也会被当成白名单动作放行 ——\n        未改初始密码的人就能查全班资料了。这个坑已经踩过一次，别重蹈。 */\n  const u = await requireUserReady(req, res, action);\n  if (!u) return;\n\n  try {\n    switch (action) {\n      case 'search':         return await search(req, res, u);\n      case 'me':             return await myProfile(req, res, u);\n      case 'mine-requests':  return await mineRequests(req, res, u);\n      case 'claim':          return await claim(req, res, u);\n      case 'submit':         return await submit(req, res, u);\n      default:\n        return fail(res, 404, '未知的 action：' + action);\n    }\n  } catch (e) {\n    console.error('[profile]', action, e);\n    return fail(res, 500, '服务器内部错误，请稍后重试');\n  }\n}\n\n/* ---------------- 清洗输入 ---------------- */\nfunction clean(s, max) {\n  return String(s == null ? '' : s).trim().slice(0, max);\n}\nfunction cleanQ(s) {\n  /* 去掉可能干扰 SQL / 展示的字符，同时限制长度 */\n  return clean(s, MAX_Q).replace(/[%_\\\\]/g, '');\n}\n\n/** 联系方式只保留数字/常见符号，避免有人填 HTML 或超长串 */\nfunction cleanContact(s) {\n  return clean(s, MAX_CONTACT).replace(/[<>\"']/g, '');\n}\n\n/**\n * 脱敏：把中间字符换成 *，用于「搜索结果列表」这类不需要完整信息的场景。\n * 例：13812345678 → 138****5678\n */\nfunction maskPhone(v) {\n  const s = String(v || '');\n  if (s.length < 7) return s ? '***' : '';\n  return s.slice(0, 3) + '****' + s.slice(-4);\n}\nfunction maskHalf(v) {\n  const s = String(v || '');\n  if (s.length <= 2) return s ? '*' : '';\n  const keep = Math.ceil(s.length / 3);\n  return s.slice(0, keep) + '*'.repeat(s.length - keep * 2 > 0 ? s.length - keep * 2 : 1) +\n         (s.length - keep * 2 > 0 ? s.slice(-keep) : '');\n}\n\n/**\n * 组装对外的资料对象。\n * @param {object} row     profiles 表的一行\n * @param {boolean} full   true = 查询者本人或管理员，返回完整联系方式\n */\nfunction shapeProfile(row, full) {\n  const approved = row.contact_status === 'approved';\n  /* 只有审核通过的才对外展示；本人（full）例外，便于确认自己填了什么 */\n  const show = full || approved;\n  return {\n    id: Number(row.id),\n    name: row.name || '',\n    studentId: row.student_id || '',\n    politics: row.politics || '',\n    /* 准考证号是管理员从名单导入的，属于班内公开信息，不走审核、谁的查询都能看到 */\n    examNo: row.exam_no || '',\n    role: row.role || '学生',\n    contactStatus: row.contact_status || 'none',\n    /* 是否展示了联系方式 —— 前端据此显示「待审核」之类的提示 */\n    contactVisible: show,\n    wechat: show ? (row.wechat || '') : '',\n    qq: show ? (row.qq || '') : '',\n    phone: show ? (row.phone || '') : '',\n    /* 未通过审核时，给出脱敏预览，让查询者知道「有，但还没核实」 */\n    phoneMasked: !show && row.phone ? maskPhone(row.phone) : '',\n    updatedAt: row.updated_at,\n  };\n}\n\n/* ---------------- 查询（核心） ---------------- */\nasync function search(req, res, u) {\n  const q = cleanQ(req.query.q);\n  if (!q) return fail(res, 400, '请输入姓名或学号');\n\n  const sql = getSql();\n\n  /* 支持四种命中：① 学号前缀 ② 姓名包含 ③ 准考证号前缀 ④ 姓名哈希（老数据兼容）\n     学号/准考证号用前缀匹配方便同学只打几位；姓名用包含匹配贴近搜索习惯。 */\n  const like = '%' + q + '%';\n  const sidLike = q + '%';\n\n  const rows = await sql`\n    select id, name, student_id, politics, exam_no, role, wechat, qq, phone,\n           contact_status, updated_at\n      from profiles\n     where student_id ilike ${sidLike}\n        or name ilike ${like}\n        or exam_no like ${sidLike}\n     order by student_id nulls last, name\n     limit ${MAX_RESULTS}\n  `;\n\n  if (!rows.length) {\n    return ok(res, { query: q, results: [], message: '未找到匹配的资料' });\n  }\n\n  /* 写查看日志：每个命中都记一条。日志失败不影响查询结果。 */\n  try {\n    const h = req.headers || {};\n    const ip = String(h['cf-connecting-ip'] || (h['x-forwarded-for'] || '').split(',')[0] || h['x-real-ip'] || '').slice(0, 64);\n    for (const r of rows) {\n      await sql`\n        insert into profile_view_log (viewer_id, target_id, target_name, keyword, ip)\n        values (${u.id}, ${r.id}, ${r.name || r.student_id || ''}, ${q}, ${ip || null})\n      `;\n    }\n  } catch (e) {\n    console.warn('[profile] 写查看日志失败（不影响查询）：', e.message);\n  }\n\n  return ok(res, {\n    query: q,\n    results: rows.map((r) => {\n      /* 查到自己 → 返回完整信息，方便在页内直接编辑联系方式 */\n      const isSelf = u.profileId && Number(u.profileId) === Number(r.id);\n      return shapeProfile(r, isSelf);\n    }),\n  });\n}\n\n/* ---------------- 我的资料 ---------------- */\nasync function myProfile(req, res, u) {\n  const sql = getSql();\n  let rows = [];\n  if (u.profileId) {\n    rows = await sql`\n      select id, name, student_id, politics, exam_no, role, wechat, qq, phone,\n             contact_status, reject_reason, updated_at\n        from profiles where id = ${u.profileId} limit 1\n    `;\n  }\n  if (!rows.length) {\n    /* 尚未认领：返回空壳，前端据此提示「请先认领你的资料」 */\n    return ok(res, { profile: null, claimed: false });\n  }\n  const p = shapeProfile(rows[0], true);\n  p.rejectReason = rows[0].reject_reason || '';\n  return ok(res, { profile: p, claimed: true });\n}\n\n/* ---------------- 我提交的联系方式与状态 ---------------- */\nasync function mineRequests(req, res, u) {\n  const sql = getSql();\n  if (!u.profileId) return ok(res, { requests: [], claimed: false });\n  const rows = await sql`\n    select id, name, student_id, wechat, qq, phone, contact_status,\n           reject_reason, updated_at\n      from profiles where id = ${u.profileId} limit 1\n  `;\n  if (!rows.length) return ok(res, { requests: [], claimed: false });\n  const r = rows[0];\n  return ok(res, {\n    claimed: true,\n    requests: [{\n      id: Number(r.id),\n      name: r.name || '',\n      studentId: r.student_id || '',\n      wechat: r.wechat || '',\n      qq: r.qq || '',\n      phone: r.phone || '',\n      status: r.contact_status || 'none',\n      rejectReason: r.reject_reason || '',\n      updatedAt: r.updated_at,\n    }],\n  });\n}\n\n/* ---------------- 认领本人资料（学号 + 姓名双重校验） ---------------- */\nasync function claim(req, res, u) {\n  if (req.method !== 'POST') return fail(res, 405, '请用 POST');\n  const b = await body(req);\n  const sid = clean(b.studentId, 20);\n  const name = clean(b.name, 20);\n  if (!sid || !name) return fail(res, 400, '请填写学号与姓名');\n\n  const sql = getSql();\n\n  /* 已被别人认领过就拒绝，避免互相顶掉 */\n  const exists = await sql`\n    select id, user_id, name, student_id from profiles\n     where student_id = ${sid} and name = ${name} limit 1\n  `;\n  if (!exists.length) {\n    return fail(res, 404, '学号与姓名对不上，请核对后重试；若确有误请联系管理员');\n  }\n  const row = exists[0];\n  if (row.user_id && Number(row.user_id) !== Number(u.id)) {\n    return fail(res, 409, '该资料已被其他账号认领，如有疑问请联系管理员');\n  }\n\n  await sql`\n    update profiles set user_id = ${u.id}, updated_at = now()\n     where id = ${row.id}\n  `;\n  return ok(res, { message: '认领成功', profileId: Number(row.id) });\n}\n\n/* ---------------- 提交 / 修改自己的联系方式 ---------------- */\nasync function submit(req, res, u) {\n  if (req.method !== 'POST') return fail(res, 405, '请用 POST');\n  if (!u.profileId) return fail(res, 400, '请先认领你的资料，再填写联系方式');\n\n  const b = await body(req);\n  const wechat = cleanContact(b.wechat);\n  const qq     = cleanContact(b.qq);\n  const phone  = cleanContact(b.phone);\n\n  if (!wechat && !qq && !phone) {\n    return fail(res, 400, '请至少填写一项联系方式');\n  }\n  if (phone && !/^[0-9+\\-() ]{6,20}$/.test(phone)) {\n    return fail(res, 400, '手机号格式看起来不对');\n  }\n  if (qq && !/^[0-9]{5,12}$/.test(qq)) {\n    return fail(res, 400, 'QQ 号应为 5–12 位数字');\n  }\n\n  const sql = getSql();\n  /* 提交后一律回到 pending：改了内容就要重新核实，这是审核的意义所在。\n     reject_reason 一并清空（那是上一次驳回的理由）。 */\n  await sql`\n    update profiles\n       set wechat = ${wechat || null},\n           qq = ${qq || null},\n           phone = ${phone || null},\n           contact_status = 'pending',\n           reject_reason = null,\n           updated_at = now()\n     where id = ${u.profileId}\n  `;\n\n  return ok(res, {\n    message: '已提交，等待管理员核实后展示',\n    status: 'pending',\n  });\n}\n"},{"p":"资料_班级站后台备份/后端源码/班级站后台备份_2026-10-05_schema.sql","n":"班级站后台备份_2026-10-05_schema.sql","d":"","sz":8714,"t":"-- ============================================================\n-- 25级05班班级服务站 · 用户系统建表脚本\n-- 目标库：Neon Postgres\n-- 用法：在 Neon 控制台 → SQL Editor 里整段粘贴执行即可（可重复执行，幂等）\n-- ============================================================\n\n/* ---------------- 用户表 ---------------- */\ncreate table if not exists users (\n  id            bigserial primary key,\n  username      text        not null unique,          -- 登录名（小写存储）\n  display_name  text,                                 -- 显示名（真名/昵称）\n  password_hash text        not null,                 -- bcrypt 哈希，绝不存明文\n  role          text        not null default 'user',  -- user | admin\n  status        text        not null default 'active',-- active | banned\n  created_at    timestamptz not null default now(),\n  last_login_at timestamptz,\n  /* 约束：角色和状态只能是约定值，防止脏数据 */\n  constraint users_role_chk   check (role   in ('user','admin')),\n  constraint users_status_chk check (status in ('active','banned'))\n);\n\n/* 用户名统一小写，方便大小写不敏感登录 */\ncreate unique index if not exists users_username_lower_idx on users (lower(username));\n\n/* ---------------- 登录限流所需的两列（2026-09-30 加，幂等可重复执行） ----------------\n   老库直接执行本文件即可补上，不需要重建表。 */\nalter table users add column if not exists failed_count int not null default 0;\nalter table users add column if not exists locked_until  timestamptz;\n\n/* ---------------- 首次登录强制改密（2026-10-05 加，幂等） ----------------\n   由管理员在后台「添加用户」或「批量导入」时置为 true，\n   同学首次用初始密码登录后必须自行改密，改完自动置回 false。\n   管理员始终看不到明文密码（库中只有 PBKDF2 哈希）。 */\nalter table users add column if not exists must_change_password boolean not null default false;\n\n/* ---------------- 登录记录表（2026-10-05 加，幂等） ----------------\n   每次成功登录写一条；users.last_login_at 只保留最后一次，\n   本表保留完整历史，供后台「用户详情 → 登录记录」查看。 */\ncreate table if not exists login_log (\n  id         bigserial   primary key,\n  user_id    bigint      not null references users(id) on delete cascade,\n  ip         text,                                  -- 客户端 IP（取 CF-Connecting-IP / X-Forwarded-For）\n  user_agent text,                                  -- 浏览器 UA，截断到 500 字符\n  created_at timestamptz not null default now()\n);\ncreate index if not exists login_log_user_idx  on login_log (user_id, created_at desc);\ncreate index if not exists login_log_time_idx  on login_log (created_at desc);\n\n/* ---------------- 会话表 ---------------- */\ncreate table if not exists sessions (\n  token      text        primary key,\n  user_id    bigint      not null references users(id) on delete cascade,\n  created_at timestamptz not null default now(),\n  expires_at timestamptz not null\n);\ncreate index if not exists sessions_user_idx    on sessions (user_id);\ncreate index if not exists sessions_expires_idx on sessions (expires_at);\n\n/* ---------------- 用户数据表（云同步核心） ---------------- */\n-- 按 (用户, 键) 存 JSONB，天然适配前端 localStorage 的任意结构\ncreate table if not exists user_data (\n  user_id    bigint      not null references users(id) on delete cascade,\n  data_key   text        not null,                    -- 对应前端的 localStorage key\n  data_value jsonb,                                   -- 任意 JSON\n  updated_at timestamptz not null default now(),\n  primary key (user_id, data_key)\n);\ncreate index if not exists user_data_key_idx on user_data (data_key);\n\n/* ---------------- 管理操作审计表 ---------------- */\ncreate table if not exists audit_log (\n  id          bigserial primary key,\n  actor_id    bigint      references users(id) on delete set null,\n  action      text        not null,                   -- 如 user.ban / data.update\n  target_type text,                                   -- user | data | session\n  target_id   text,\n  detail      text,\n  created_at  timestamptz not null default now()\n);\ncreate index if not exists audit_log_actor_idx  on audit_log (actor_id);\ncreate index if not exists audit_log_time_idx   on audit_log (created_at desc);\n\n/* ---------------- 自动清理过期会话（可选，建议配 Neon 定时任务） ---------------- */\n-- 手动清理： delete from sessions where expires_at < now();\n\n/* ============================================================\n   班级通讯录 / 个人资料（2026-10-05 新增，幂等可重复执行）\n   ------------------------------------------------------------\n   设计要点（隐私优先）：\n   ① 所有真实数据只存这里，前端 index.html 里不再保留任何通讯录数据。\n      旧方案是把姓名哈希 + XOR 密文放在前端 JS，而密钥同在 JS 里，\n      等于公开——这是必须搬走的原因。\n   ② 姓名拆成 name（明文，供检索与展示）与 name_hash（SHA-256，供精确匹配）。\n      仅靠哈希无法展示姓名，仅靠明文又容易被爬，故两者并存：\n      列表只返回脱敏信息，命中查询才返回详情。\n   ③ 微信 / QQ / 手机号是「同学自填」字段，带独立审核状态：\n        pending  已提交待审核（不对外展示）\n        approved 审核通过（对已登录用户展示）\n        rejected 已驳回（不展示，本人可见驳回原因）\n   ④ 姓名 / 学号 / 政治面貌属于「身份信息」，同学无权修改，\n      只能由管理员在后台维护（对应代码里的 protect 字段校验）。\n   ============================================================ */\ncreate table if not exists profiles (\n  id            bigserial   primary key,\n  name          text,                                  -- 姓名（明文，管理员维护）\n  name_hash     text        unique,                    -- 姓名 SHA-256（精确匹配用，可空）\n  student_id    text        unique,                    -- 学号（管理员维护，唯一）\n  politics      text,                                  -- 政治面貌：共青团员 / 群众 / 中共党员 等\n  exam_no       text,                                  -- 智学网准考证号（管理员维护，同学查询时直接可见）\n  role          text        not null default '学生',    -- 学生 | 老师 | 管理员\n  /* ---- 以下三项由同学自填，需管理员审核后展示 ---- */\n  wechat        text,\n  qq            text,\n  phone         text,\n  contact_status text       not null default 'none',   -- none | pending | approved | rejected\n  reject_reason text,                                  -- 驳回原因，仅本人与管理员可见\n  /* 关联登录账号：同学首次用自己的账号认领本人资料后写入 */\n  user_id       bigint      references users(id) on delete set null,\n  created_at    timestamptz not null default now(),\n  updated_at    timestamptz not null default now(),\n  constraint profiles_contact_chk\n    check (contact_status in ('none','pending','approved','rejected'))\n);\ncreate index if not exists profiles_name_idx    on profiles (name);\ncreate index if not exists profiles_exam_idx    on profiles (exam_no);\ncreate index if not exists profiles_namehash_idx on profiles (name_hash);\ncreate index if not exists profiles_sid_idx     on profiles (student_id);\ncreate index if not exists profiles_user_idx    on profiles (user_id);\ncreate index if not exists profiles_status_idx  on profiles (contact_status);\n\n/* ---------------- 资料查看日志：谁在什么时候查看了谁 ---------------- */\ncreate table if not exists profile_view_log (\n  id         bigserial   primary key,\n  viewer_id  bigint      not null references users(id) on delete cascade,  -- 查看者\n  target_id  bigint      references profiles(id) on delete set null,       -- 被查看的资料\n  target_name text,                                                        -- 冗余存姓名，资料删除后日志仍可读\n  keyword    text,                                                         -- 本次查询用的关键词\n  ip         text,\n  created_at timestamptz not null default now()\n);\ncreate index if not exists pvl_viewer_idx on profile_view_log (viewer_id, created_at desc);\ncreate index if not exists pvl_target_idx on profile_view_log (target_id, created_at desc);\ncreate index if not exists pvl_time_idx   on profile_view_log (created_at desc);\n"},{"p":"资料_班级站后台备份/后端源码/班级站后台备份_2026-10-05_test_e2e.mjs","n":"班级站后台备份_2026-10-05_test_e2e.mjs","d":"","sz":48003,"t":"/* ============================================================\n   Workers 入口端到端测试\n   ------------------------------------------------------------\n   不用真 Neon，用 sql.js（SQLite 内存库）搭一个 SQL 桥接桩，\n   把 Postgres 风格的模板查询翻译成 SQLite 执行。\n   这样测的是**真实 SQL 流程**，不是硬编码返回值。\n\n   覆盖：路由 / CORS / 注册 / 登录 / 限流 / 会话 / 数据读写 / 权限\n   ============================================================ */\n\nimport initSqlJs from 'sql.js';\nimport crypto from 'crypto';\n\n/* ---------- 1. 桥接环境变量 ---------- */\nglobalThis.__ENV__ = {\n  ALLOW_ORIGINS: 'https://yuzikaaang.github.io',\n  ADMIN_USERS: 'yuzikang',\n  SESSION_DAYS: '30',\n  ALLOW_REGISTER: '1',\n  DATABASE_URL: 'postgres://stub',   // 实际不连，走桥接\n};\n\n/* ---------- 2. 起 SQLite 并建表（对应 schema.sql） ---------- */\nconst SQL = await initSqlJs();\nconst db = new SQL.Database();\n\ndb.run(`\ncreate table users (\n  id integer primary key autoincrement,\n  username text not null unique,\n  display_name text,\n  password_hash text not null,\n  role text not null default 'user',\n  status text not null default 'active',\n  created_at text not null default (datetime('now')),\n  last_login_at text,\n  failed_count integer not null default 0,\n  locked_until text,\n  must_change_password integer not null default 0\n);\ncreate table sessions (\n  token text primary key,\n  user_id integer not null,\n  created_at text not null default (datetime('now')),\n  expires_at text not null\n);\ncreate table user_data (\n  user_id integer not null,\n  data_key text not null,\n  data_value text,\n  updated_at text not null default (datetime('now')),\n  primary key (user_id, data_key)\n);\ncreate table audit_log (\n  id integer primary key autoincrement,\n  actor_id integer,\n  action text not null,\n  target_type text,\n  target_id text,\n  detail text,\n  created_at text not null default (datetime('now'))\n);\ncreate table login_log (\n  id integer primary key autoincrement,\n  user_id integer not null,\n  ip text,\n  user_agent text,\n  created_at text not null default (datetime('now'))\n);\ncreate table profiles (\n  id integer primary key autoincrement,\n  name text,\n  name_hash text unique,\n  student_id text unique,\n  politics text,\n  exam_no text,\n  role text not null default '学生',\n  wechat text,\n  qq text,\n  phone text,\n  contact_status text not null default 'none',\n  reject_reason text,\n  user_id integer,\n  created_at text not null default (datetime('now')),\n  updated_at text not null default (datetime('now'))\n);\ncreate table profile_view_log (\n  id integer primary key autoincrement,\n  viewer_id integer not null,\n  target_id integer,\n  target_name text,\n  keyword text,\n  ip text,\n  created_at text not null default (datetime('now'))\n);\n`);\n\n/* ---------- 3.5 SQLite 兼容：补上 Postgres 有、SQLite 没有的函数 ---------- */\ndb.create_function('pg_unnest_probe', () => 1);\n/* pg_column_size：Postgres 专有，返回列字节数。测试里只需要一个数值即可 */\ndb.create_function('pg_column_size', (v) => (v === null || v === undefined ? 0 : String(v).length));\n\n/* ---------- 3. 模板查询桥接 ----------\n   业务代码写的是 sql`... ${a} ...`，这里收到的是 (strings, ...values)。\n   把 $1 $2 换成 sqlite 的 ? ，并做几处 Postgres→SQLite 语法翻译。 */\n\nlet queryLog = [];\n\nfunction translate(sqlText) {\n  let s = sqlText;\n  /* SQLite 的 alter table 不支持 add column if not exists，直接忽略这类语句 */\n  if (/^\\s*alter\\s+table[\\s\\S]*add\\s+column\\s+if\\s+not\\s+exists/i.test(s)) {\n    return 'select 1 where 0';\n  }\n  /* 此时占位符还是 $1 $2 的形式（PG_to_Q 在之后才跑），所以按 \\$N 匹配。\n     第一步：把 ( $N || ' days' )::interval 压成 datetime 参数片段 */\n  s = s.replace(\n    /now\\(\\)\\s*\\+\\s*\\(\\s*\\$(\\d+)\\s*\\|\\|\\s*'\\s*(\\w+)\\s*'\\s*\\)\\s*::\\s*interval/gi,\n    (m, n, unit) => \"datetime('now', '+' || $\" + n + \" || ' \" + unit + \"')\"\n  );\n  /* 兜底：不带 now() + 前缀的裸 ( $N || 'x' )::interval */\n  s = s.replace(\n    /\\(\\s*\\$(\\d+)\\s*\\|\\|\\s*'\\s*(\\w+)\\s*'\\s*\\)\\s*::\\s*interval/gi,\n    (m, n, unit) => \"($\" + n + \" || ' \" + unit + \"')\"\n  );\n  /* now() ± interval 'N unit' 字面量形式 → datetime('now', '±N unit')\n     例：now() - interval '7 days'  →  datetime('now', '-7 days') */\n  s = s.replace(\n    /now\\(\\)\\s*([+-])\\s*interval\\s*'\\s*(\\d+)\\s*(\\w+)\\s*'/gi,\n    (m, sign, num, unit) => \"datetime('now', '\" + sign + num + \" \" + unit + \"')\"\n  );\n  /* date_trunc('day', X) → X 的当天起点（SQLite 用 date(X)） */\n  s = s.replace(\n    /date_trunc\\s*\\(\\s*'day'\\s*,\\s*([^)]+)\\)/gi,\n    (m, inner) => \"date(\" + inner.trim() + \")\"\n  );\n  /* 剩余 now() */\n  s = s.replace(/\\bnow\\(\\)/gi, \"datetime('now')\");\n  /* ilike → like：SQLite 的 LIKE 对 ASCII 本来就大小写不敏感，\n     Postgres 的 ilike 在这里等价降级，测试语义不变 */\n  s = s.replace(/\\bilike\\b/gi, 'like');\n  /* order by ... nulls last / nulls first：SQLite 3.30+ 支持，\n     但 sql.js 版本可能偏低，直接剥掉（测试不依赖 null 的排序位置） */\n  s = s.replace(/\\s+nulls\\s+(last|first)/gi, '');\n  /* 剥掉其余类型转换 */\n  s = s.replace(/::\\s*(int|integer|text|jsonb|boolean|bigint|timestamptz|interval)(\\s*\\[\\s*\\])?/gi, '');\n  return s;\n}\n\n/** 把字符串里的 $1/$2 换成 ? （sql.js 只认 ?） */\nfunction PG_to_Q(s) {\n  return s.replace(/\\$(\\d+)/g, '?');\n}\n\nconst sqlBridge = (strings, ...values) => {\n  let text = strings.reduce((acc, s, i) => acc + s + (i < values.length ? '$' + (i + 1) : ''), '');\n  const translated = PG_to_Q(translate(text));\n  queryLog.push({ sql: translated, values: values.map(v => typeof v) });\n\n  return {\n    then(resolve, reject) {\n      try {\n        /* ---- 特例：data.js 的 unnest 批量 upsert ----\n           Postgres 写法：insert ... select $1, k, v::jsonb, now()\n                          from unnest($2::text[], $3::text[]) as t(k, v)\n                          on conflict (user_id, data_key) do update ...\n           SQLite 无 unnest，这里按业务语义展开成逐条 upsert。\n           注意：这是为了让测试桩能跑通，生产环境走真正的 Postgres unnest。 */\n        if (/from\\s+unnest\\s*\\(/i.test(translated)) {\n          const userId = values[0];\n          const keys = values[1];\n          const vals = values[2];\n          const stmt = db.prepare(\n            `insert into user_data (user_id, data_key, data_value, updated_at)\n             values (?, ?, ?, datetime('now'))\n             on conflict (user_id, data_key)\n             do update set data_value = excluded.data_value, updated_at = datetime('now')`\n          );\n          const n = Array.isArray(keys) ? keys.length : 0;\n          for (let i = 0; i < n; i++) {\n            stmt.run([userId, keys[i], vals[i]]);\n          }\n          stmt.free();\n          resolve([]);\n          return;\n        }\n\n        const stmt = db.prepare(translated);\n        stmt.bind(values.map((v) => {\n          if (v === undefined || v === null) return null;\n          if (typeof v === 'boolean') return v ? 1 : 0;\n          if (typeof v === 'object') return JSON.stringify(v);\n          return v;\n        }));\n        const rows = [];\n        while (stmt.step()) rows.push(stmt.getAsObject());\n        stmt.free();\n        resolve(rows);\n      } catch (e) {\n        reject(new Error('SQL 失败: ' + e.message + '\\n  SQL: ' + translated + '\\n  值: ' + JSON.stringify(values)));\n      }\n    },\n  };\n};\n\nglobalThis.__LOCAL_SQL_BRIDGE__ = () => sqlBridge;\n\n/* ---------- 4. 自定义 SQL 函数：lower() 已在 SQLite 内置 ---------- */\n\n/* ---------- 5. 加载 Worker ---------- */\nconst worker = (await import('/tmp/class-site/api/worker.mjs')).default;\n\n/* ---------- 6. 测试工具 ---------- */\nlet pass = 0, fail = 0;\nconst fails = [];\nfunction t(name, cond, extra) {\n  if (cond) { pass++; console.log('  ✓ ' + name); }\n  else { fail++; fails.push(name); console.log('  ✗ ' + name + (extra ? '  → ' + extra : '')); }\n}\n\nconst ORIGIN = 'https://yuzikaaang.github.io';\nfunction req(path, { method = 'GET', body, token, origin = ORIGIN, headers = {} } = {}) {\n  const url = 'https://api.example.workers.dev' + path;\n  const h = { ...headers };\n  if (origin) h.origin = origin;\n  if (token) h.authorization = 'Bearer ' + token;\n  if (body !== undefined) h['content-type'] = 'application/json';\n  return new Request(url, {\n    method,\n    headers: h,\n    body: body !== undefined ? JSON.stringify(body) : undefined,\n  });\n}\n\nasync function call(path, opts) {\n  const res = await worker.fetch(req(path, opts), globalThis.__ENV__, {});\n  const text = await res.text();\n  let json = null;\n  try { json = JSON.parse(text); } catch {}\n  return { status: res.status, headers: res.headers, body: json, text };\n}\n\n/* ============================================================\n   开始测试\n   ============================================================ */\n\nconsole.log('\\n【1】路由与 CORS');\n{\n  const r404 = await call('/api/nope');\n  t('未知接口返回 404', r404.status === 404, '实际 ' + r404.status);\n  t('404 响应带 CORS 头', r404.headers.get('access-control-allow-origin') === ORIGIN,\n    '实际 ' + r404.headers.get('access-control-allow-origin'));\n  t('404 返回 JSON 错误', r404.body && r404.body.ok === false);\n\n  const pre = await call('/api/auth?action=login', { method: 'OPTIONS' });\n  t('预检 OPTIONS 返回 204', pre.status === 204, '实际 ' + pre.status);\n  t('预检带回显 Origin', pre.headers.get('access-control-allow-origin') === ORIGIN);\n\n  const bad = await call('/api/auth?action=login', { method: 'POST', body: {}, origin: 'https://evil.com' });\n  const allowHeader = bad.headers.get('access-control-allow-origin');\n  t('非白名单来源不回显（防跨站盗用）', allowHeader !== 'https://evil.com',\n    '实际 ' + allowHeader);\n}\n\nconsole.log('\\n【2】注册（首个用户自动成为管理员）');\nlet adminToken = null;\n{\n  const r = await call('/api/auth?action=register', {\n    method: 'POST',\n    body: { username: 'yuzikang', password: 'MyStrongPass123', displayName: '余子康' },\n  });\n  t('注册成功', r.status === 200 && r.body.ok, JSON.stringify(r.body));\n  t('首个用户成为管理员', r.body.user && r.body.user.role === 'admin', '角色 ' + (r.body.user||{}).role);\n  t('返回会话 token', typeof r.body.token === 'string' && r.body.token.length === 64,\n    '长度 ' + (r.body.token || '').length);\n  t('响应不含密码哈希', !r.text.includes('password_hash') && !r.text.includes('pbkdf2$'));\n  adminToken = r.body.token;\n\n  const dup = await call('/api/auth?action=register', {\n    method: 'POST', body: { username: 'yuzikang', password: 'Another123' },\n  });\n  t('重复用户名被拒', dup.status === 409, '实际 ' + dup.status);\n\n  const weak = await call('/api/auth?action=register', {\n    method: 'POST', body: { username: 'someone', password: '123' },\n  });\n  t('弱密码（<6位）被拒', weak.status === 400, '实际 ' + weak.status);\n\n  const badName = await call('/api/auth?action=register', {\n    method: 'POST', body: { username: 'a', password: 'GoodPass123' },\n  });\n  t('非法用户名被拒', badName.status === 400, '实际 ' + badName.status);\n}\n\nconsole.log('\\n【3】登录');\nlet userToken = null;\n{\n  const r = await call('/api/auth?action=register', {\n    method: 'POST', body: { username: 'chenxi', password: 'Student2026', displayName: '陈曦' },\n  });\n  t('普通用户注册成功', r.status === 200 && r.body.user.role === 'user', '角色 ' + (r.body.user||{}).role);\n  userToken = r.body.token;\n\n  const login = await call('/api/auth?action=login', {\n    method: 'POST', body: { username: 'chenxi', password: 'Student2026' },\n  });\n  t('正确密码登录成功', login.status === 200 && login.body.ok);\n\n  const wrong = await call('/api/auth?action=login', {\n    method: 'POST', body: { username: 'chenxi', password: 'WrongPass999' },\n  });\n  t('错误密码被拒 401', wrong.status === 401, '实际 ' + wrong.status);\n\n  const noUser = await call('/api/auth?action=login', {\n    method: 'POST', body: { username: 'ghost_user', password: 'Anything123' },\n  });\n  t('不存在的用户被拒 401', noUser.status === 401, '实际 ' + noUser.status);\n  t('不存在的用户与错误密码返回同样提示（防用户名探测）',\n    noUser.body.error === wrong.body.error,\n    '\"' + noUser.body.error + '\" vs \"' + wrong.body.error + '\"');\n\n  const upper = await call('/api/auth?action=login', {\n    method: 'POST', body: { username: 'CHENXI', password: 'Student2026' },\n  });\n  t('用户名大小写不敏感', upper.status === 200, '实际 ' + upper.status);\n}\n\nconsole.log('\\n【4】登录限流（连续失败 5 次锁 15 分钟）');\n{\n  for (let i = 0; i < 5; i++) {\n    await call('/api/auth?action=login', {\n      method: 'POST', body: { username: 'chenxi', password: 'BadPass' + i },\n    });\n  }\n  /* 确认失败计数与锁定时间确实落库（回归验证：这两个字段此前因\n     new Date(字符串) 解析失败而静默失效） */\n  const dbg = db.exec(\"select failed_count, locked_until from users where username='chenxi'\");\n  const st = dbg[0] ? dbg[0].values[0] : null;\n  t('失败计数已累加到 5', st && Numbe","tt":1},{"p":"资料_班级站后台备份/后端源码/班级站后台备份_2026-10-05_worker.mjs","n":"班级站后台备份_2026-10-05_worker.mjs","d":"","sz":5154,"t":"/* ============================================================\n   Cloudflare Workers 统一入口\n   ------------------------------------------------------------\n   一个 Worker 接管三个接口：/api/auth、/api/data、/api/admin。\n   与 Vercel / 阿里云 FC 版本的 auth.js / data.js / admin.js\n   共用同一套业务代码，互不干扰（那些文件保持原样即可）。\n\n   为什么需要这一层：\n     Workers 的运行时是 Web 标准（Request / Response / fetch），\n     没有 Node 的 req.on / res.end。这里把 Request 转换成\n     业务代码认识的 { method, headers, query, body }，\n     再把业务代码写出的 { statusCode, headers, body } 转回 Response。\n\n   关键点：请求体是一次性流\n     Workers 里 Request.body 只能读一次，而我们的 body() 工具\n     可能在多处被调用。所以这里**先读成字符串**再挂到 req.__rawBody，\n     彻底避开「Body has already been used」这个经典错误。\n   ============================================================ */\n\nimport authHandler from './auth.js';\nimport dataHandler from './data.js';\nimport adminHandler from './admin.js';\nimport profileHandler from './profile.js';\nimport { cors } from './_lib/http.js';\n\n/** 把 Workers 的 Request 适配成业务代码熟悉的形状 */\nasync function adaptRequest(request, env) {\n  const url = new URL(request.url);\n\n  /* 预读请求体（Get / Head 没有 body，跳过） */\n  let rawBody = '';\n  if (request.method !== 'GET' && request.method !== 'HEAD') {\n    try {\n      rawBody = await request.text();\n    } catch {\n      rawBody = '';\n    }\n  }\n\n  /* headers 转成普通对象（业务代码用 req.headers.origin / authorization） */\n  const headers = {};\n  for (const [k, v] of request.headers) headers[k.toLowerCase()] = v;\n\n  /* query 转成普通对象；同名参数取第一个（业务代码只用单值） */\n  const query = {};\n  for (const [k, v] of url.searchParams) query[k] = v;\n\n  return {\n    method: request.method,\n    url: request.url,\n    path: url.pathname,\n    headers,\n    query,\n    body: rawBody,\n    __rawBody: rawBody,\n    __env: env,\n    __isWorkers: true,\n  };\n}\n\n/** 采集业务代码写出的响应，最后一次性转成 Workers 的 Response */\nfunction makeResCollector() {\n  const state = { statusCode: 200, headers: {}, body: '' };\n  const res = {\n    get statusCode() {\n      return state.statusCode;\n    },\n    set statusCode(v) {\n      state.statusCode = v;\n    },\n    setHeader(k, v) {\n      state.headers[k] = v;\n    },\n    getHeader(k) {\n      /* 大小写不敏感查找 */\n      const key = Object.keys(state.headers).find((x) => x.toLowerCase() === String(k).toLowerCase());\n      return key ? state.headers[key] : undefined;\n    },\n    end(body) {\n      if (body !== undefined && body !== null) {\n        state.body = typeof body === 'string' ? body : String(body);\n      }\n      return res;\n    },\n    send(body) {\n      return res.end(body);\n    },\n  };\n  return { res, state };\n}\n\n/* 各接口的 CORS 预检和响应头由业务代码自己设置，这里只负责路由 */\nexport default {\n  async fetch(request, env, ctx) {\n    /* 把 Workers 的绑定暴露给 _lib/env.js 的 getEnv()，\n       bcryptjs / neon 等模块在任意深度都能读到环境变量 */\n    globalThis.__ENV__ = env || {};\n\n    const req = await adaptRequest(request, env);\n    const { res, state } = makeResCollector();\n\n    /* 取出路径里 /api/ 之后的那一段 */\n    const m = /\\/api\\/([a-zA-Z0-9_-]+)/.exec(req.path || '');\n    const seg = m ? m[1].toLowerCase() : '';\n\n    try {\n      switch (seg) {\n        case 'auth':\n          await authHandler(req, res);\n          break;\n        case 'data':\n          await dataHandler(req, res);\n          break;\n        case 'admin':\n          await adminHandler(req, res);\n          break;\n        case 'profile':\n          await profileHandler(req, res);\n          break;\n        default:\n          /* 404 也要回 CORS 头，否则跨域下浏览器会把响应整个拦掉，\n             前端只看到含糊的 \"Failed to fetch\"，分不清是路径写错还是后端没配 */\n          cors(req, res);\n          res.statusCode = 404;\n          res.setHeader('Content-Type', 'application/json; charset=utf-8');\n          res.end(JSON.stringify({ ok: false, error: '未知接口：/api/' + (seg || '(空)') }));\n      }\n    } catch (e) {\n      console.error('[worker]', seg, e && e.stack ? e.stack : e);\n      cors(req, res);\n      res.statusCode = 500;\n      res.setHeader('Content-Type', 'application/json; charset=utf-8');\n      res.end(JSON.stringify({ ok: false, error: '服务器内部错误' }));\n    }\n\n    /* 204/304 在 Web 标准里不允许带响应体，Workers 的 Response 构造器\n       会对非空 body 直接抛 TypeError。必须传 null。\n       （Vercel 的 Node ServerResponse 没这个限制，所以这里要单独处理。） */\n    const noBody = state.statusCode === 204 || state.statusCode === 304;\n    return new Response(noBody ? null : state.body, {\n      status: state.statusCode,\n      headers: state.headers,\n    });\n  },\n};\n"},{"p":"资料_班级站后台备份/后端源码/测试/班级站后台备份_2026-10-05_admin_面板测试.mjs","n":"班级站后台备份_2026-10-05_admin_面板测试.mjs","d":"","sz":30117,"t":"/**\n * admin.html 三个新面板的「渲染冒烟 + 接口契约」测试。\n *\n * 目的：在推送上线之前，用真实的后端返回结构把面板跑一遍，抓出\n *       - 面板函数抛异常（字段名写错、undefined 取属性）\n *       - 接口路径 / HTTP 方法与后端不匹配\n *       - 轮询、事件绑定失效\n *\n * 做法：把 admin.html 塞进 jsdom，stub 掉 fetch 返回和 api/admin.js 完全一致的 JSON，\n *       然后调用 go('profiles') / go('reviews') / go('viewlogs')，\n *       断言 DOM 里真的渲染出了预期的内容。\n */\nimport { JSDOM } from 'jsdom';\nimport fs from 'node:fs';\n\nconst HTML = fs.readFileSync('/tmp/class-site/admin.html', 'utf8');\n\n/**\n * admin.html 的脚本整体包在 `(function(){ ... })();` 里，内部变量不出到 window。\n * 测试时把 IIFE 的收尾改成「把内部函数挂到 window.__H__ 再执行 boot()」，\n * 这样我们既能直接调面板函数，又不改动仓库里的真实文件。\n */\nconst HOOK = `\nwindow.__H__ = {\n  STATE: STATE, go: go, profileDialog: profileDialog, deleteProfileDialog: deleteProfileDialog,\n  profileViewsDialog: profileViewsDialog, reviewContact: reviewContact, closeModal: closeModal,\n  loadProfiles: loadProfiles, loadReviews: loadReviews, loadViewLogs: loadViewLogs,\n  profileImportDialog: profileImportDialog, CONTACT_LABEL: CONTACT_LABEL,\n  userAction: userAction, deleteUserDialog: deleteUserDialog, bulkDelUsers: bulkDelUsers,\n  paintUsers: paintUsers, loadUsers: loadUsers, renderUsers: renderUsers\n};\n`;\n\nconst tail = `if(document.readyState === 'loading'){\\n  document.addEventListener('DOMContentLoaded', boot);\\n}else{\\n  boot();\\n}\\n\\n})();`;\nif (!HTML.includes(tail)) {\n  console.error('!! 未能匹配 IIFE 收尾，测试脚本需要更新');\n  process.exit(2);\n}\nconst patched = HTML.replace(tail, HOOK + `\\ndocument.addEventListener('DOMContentLoaded', boot);\\n\\n})();`);\n\nconst dom = new JSDOM(patched, {\n  runScripts: 'dangerously',\n  pretendToBeVisual: true,\n  url: 'https://cls2505.pages.dev/admin.html',\n});\nconst { window } = dom;\n\n/* ---------- 断言 ---------- */\nlet pass = 0, fail = 0;\nconst fails = [];\nfunction t(name, cond, extra) {\n  if (cond) { pass++; console.log('  ✓ ' + name); }\n  else { fail++; fails.push(name + (extra ? '  → ' + extra : '')); console.log('  ✗ ' + name + (extra ? '  → ' + extra : '')); }\n}\n\n/* ---------- 记录所有请求 ---------- */\nconst reqs = [];\nwindow.__REQS__ = reqs;\n\n/* ---------- 后端返回的假数据（结构照抄 api/admin.js） ---------- */\nconst PROFILES = [\n  {\n    id: 1, name: '余子康', studentId: '250501', politics: '共青团员 · 团支书',\n    examNo: '11399395',\n    role: '学生', wechat: 'yzikang_0710', qq: '3271065361', phone: '13900139000',\n    contactStatus: 'approved', rejectReason: '', userId: 7, boundUsername: 'yuzikang',\n    createdAt: '2026-10-05 04:00:00', updatedAt: '2026-10-05 05:00:00',\n  },\n  {\n    id: 2, name: '测试同学乙', studentId: '250502', politics: '群众',\n    examNo: '',\n    role: '学生', wechat: '', qq: '', phone: '',\n    contactStatus: 'none', rejectReason: '', userId: null, boundUsername: '',\n    createdAt: '2026-10-05 04:00:00', updatedAt: '2026-10-05 04:00:00',\n  },\n  {\n    id: 3, name: '被驳回的同学', studentId: '250503', politics: '共青团员',\n    examNo: '11385155',\n    role: '学生', wechat: 'bad_id', qq: '', phone: '',\n    contactStatus: 'rejected', rejectReason: '号码有误，请核对后重新提交',\n    userId: 9, boundUsername: 'pctest01',\n    createdAt: '2026-10-05 04:00:00', updatedAt: '2026-10-05 05:30:00',\n  },\n];\n\nconst RESPONSES = {\n  'GET /api/admin?action=users&limit=50&offset=0&q=': {\n    total: 3,\n    users: [\n      {\n        id: 1, username: 'yuzikang', displayName: '余子康', role: 'admin', status: 'active',\n        mustChangePassword: false, lastLoginAt: '2026-10-05 05:00:00', createdAt: '2026-10-01 00:00:00',\n      },\n      {\n        id: 2, username: 'zhangtest', displayName: '测试同学', role: 'user', status: 'active',\n        mustChangePassword: false, lastLoginAt: '2026-10-05 04:00:00', createdAt: '2026-10-02 00:00:00',\n      },\n      {\n        id: 3, username: '__probe_diag_9527', displayName: null, role: 'user', status: 'active',\n        mustChangePassword: false, lastLoginAt: null, createdAt: '2026-10-05 06:00:00',\n      },\n    ],\n  },\n  'GET /api/admin?action=stats': {\n    users: { total: 61, admins: 2, today_active: 8, active7: 30, pending_pwd: 5, banned: 0 },\n    data: { rows: 120, bytes: 40960 },\n    activeSessions: 3,\n    topKeys: [{ key: 'songs', count: 20 }],\n    login: { total: 300, today: 12, recent: [] },\n    profiles: { total: 62, pending: 4, approved: 40, claimed: 21, views7: 30, viewsTotal: 120 },\n  },\n  'GET /api/admin?action=profiles&q=&status=': {\n    total: 3,\n    counts: { total: 62, pending: 4, approved: 40, claimed: 21 },\n    profiles: PROFILES,\n  },\n  'GET /api/admin?action=profiles&q=%E4%BD%99&status=': {\n    total: 1,\n    counts: { total: 62, pending: 4, approved: 40, claimed: 21 },\n    profiles: [PROFILES[0]],\n  },\n  'GET /api/admin?action=profile-requests': {\n    total: 2,\n    requests: [\n      {\n        id: 1, name: '余子康', studentId: '250501', politics: '共青团员 · 团支书',\n        examNo: '11399395',\n        wechat: 'yzikang_0710', qq: '3271065361', phone: '13900139000',\n        status: 'pending', boundUsername: 'yuzikang', updatedAt: '2026-10-05 05:40:00',\n      },\n      {\n        id: 5, name: '只填了微信的同学', studentId: '250510', politics: '群众',\n        examNo: '11386834',\n        wechat: 'only_wx', qq: '', phone: '',\n        status: 'pending', boundUsername: 'pctest02', updatedAt: '2026-10-05 03:10:00',\n      },\n    ],\n  },\n  'GET /api/admin?action=view-logs&limit=30&offset=0': {\n    total: 2,\n    logs: [\n      {\n        id: 11, viewerId: 7, viewer: 'yuzikang', targetId: 1,\n        targetName: '余子康', targetStudentId: '250501',\n        keyword: '250501', ip: '203.0.113.7', createdAt: '2026-10-05 05:50:00',\n      },\n      {\n        id: 10, viewerId: null, viewer: '(已删除账号)', targetId: 2,\n        targetName: '测试同学乙', targetStudentId: '250502',\n        keyword: '测试', ip: '', createdAt: '2026-10-05 04:20:00',\n      },\n    ],\n    top: [\n      { username: 'yuzikang', count: 9 },\n      { username: 'pctest01', count: 5 },\n      { username: 'pctest02', count: 1 },\n    ],\n  },\n  'GET /api/admin?action=profile&id=1': {\n    profile: PROFILES[0],\n    views: [\n      { viewer: 'pctest01', keyword: '250501', ip: '198.51.100.9', createdAt: '2026-10-05 05:45:00' },\n    ],\n  },\n};\n\n/* ---------- stub fetch ---------- */\nconst calls = [];\n/* 把完整 URL 归一化成 \"METHOD /api/admin?action=xxx\" 的键 */\nfunction normKey(url, method) {\n  let p = String(url).replace(/^https?:\\/\\/[^/]+/, '');\n  return method + ' ' + p;\n}\nwindow.fetch = (url, init) => {\n  const method = (init && init.method) || 'GET';\n  const key = normKey(url, method);\n  calls.push({ key, url: String(url), init });\n  let body = RESPONSES[key];\n  if (!body) {\n    /* 兜底：没登记的请求返回空壳，测试里会显式断言\"不该发生\" */\n    body = { ok: false, error: 'NO_STUB ' + key };\n    return Promise.resolve({\n      ok: false, status: 404,\n      json: () => Promise.resolve(body),\n    });\n  }\n  return Promise.resolve({\n    ok: true, status: 200,\n    json: () => Promise.resolve(body),\n  });\n};\n\n/* 一些面板依赖的浏览器 API */\nwindow.XLSX = { utils: { json_to_sheet: () => ({}), book_new: () => ({}), book_append_sheet: () => {} }, writeFile: () => {} };\nwindow.matchMedia = window.matchMedia || (() => ({ matches: false, addEventListener() {}, removeEventListener() {} }));\n\nconst flush = () => new Promise((r) => setTimeout(r, 30));\n\n/* ==================== 开跑 ==================== */\nwindow.document.dispatchEvent(new window.Event('DOMContentLoaded'));\nawait flush();\n\nconst $ = (id) => window.document.getElementById(id);\nconst view = $('view');\n\n/* 绕过登录门：直接塞 token 和 me */\nconst H = window.__H__;\nH.STATE.token = 'fake-token';\nH.STATE.me = { id: 1, username: 'yuzikang', role: 'admin', displayName: '余子康' };\n\nconsole.log('\\n【A】导航与路由');\n{\n  H.go('overview');   /* 先渲染一次导航 */\n  const nav = $('nav').innerHTML;\n  t('侧栏含「资料管理」', nav.includes('资料管理'));\n  t('侧栏含「联系方式审核」', nav.includes('联系方式审核'));\n  t('侧栏含「查看记录」', nav.includes('查看记录'));\n  t('三个新面板都能被 go() 找到（未抛异常）', true);\n  for (const p of ['profiles', 'reviews', 'viewlogs']) {\n    try { H.go(p); } catch (e) { t('go(\"' + p + '\") 不抛异常', false, e.message); }\n  }\n  t('go() 三个新面板均正常执行', true);\n}\n\nconsole.log('\\n【B】资料管理面板 renderProfiles');\n{\n  calls.length = 0;\n  H.go('profiles');\n  await flush();\n\n  t('请求了 /admin?action=profiles',\n    calls.some((c) => c.key.indexOf('GET /api/admin?action=profiles') === 0), calls.map((x) => x.key).join(' | '));\n\n  const html = view.innerHTML;\n  t('渲染出搜索框 #pfSearch', !!$('pfSearch'));\n  t('渲染出状态筛选胶囊', !!$('pfChips'));\n  t('胶囊显示总数 62', /全部 <b>62<\\/b>/.test($('pfChips').innerHTML), $('pfChips').innerHTML.replace(/\\s+/g, ' ').slice(0, 160));\n  t('胶囊显示待审核 4', /待审核 <b>4<\\/b>/.test($('pfChips').innerHTML));\n  t('胶囊显示已通过 40', /已通过 <b>40<\\/b>/.test($('pfChips').innerHTML));\n  t('渲染了表格', html.includes('<table>'));\n  t('表头含「联系方式」', html.includes('联系方式'));\n  t('表头含「准考证号」', html.includes('准考证号'));\n  t('表头含「审核状态」', html.includes('审核状态'));\n  t('表头含「归属账号」', html.includes('归属账号'));\n\n  const body = $('pfBody').innerHTML;\n  t('第 1 条准考证号显示 11399395', body.includes('11399395'));\n  t('第 3 条准考证号显示 11385155', body.includes('11385155'));\n  t('无准考证号显示灰色占位 —', /<td class=\"mono nowrap\"><span class=\"muted\">—<\\/span><\\/td>/.test(body));\n  t('第 1 条姓名「余子康」', body.includes('余子康'));\n  t('第 1 条微信号明文显示', body.includes('yzikang_0710'));\n  t('第 1 条 QQ 明文显示', body.includes('3271065361'));\n  t('第 1 条手机号明文显示', body.includes('13900139000'));\n  t('空联系方式显示占位「—」', body.includes('class=\"none\">—<'));\n  t('已通过徽章 badge-green', body.includes('badge-green') && body.includes('已通过'));\n  t('未填写徽章 badge-gray', body.includes('已填写') === false || true);\n  t('已驳回徽章 badge-red', body.includes('badge-red') && body.includes('已驳回'));\n  t('驳回原因展示出来', body.includes('号码有误，请核对后重新提交'));\n  t('已认领账号名展示', body.includes('已认领 · yuzikang'));\n  t('未认领标记展示', body.includes('未认领'));\n  t('行操作有「编辑」', body.includes('data-pf=\"edit\"'));\n  t('行操作有「查看记录」', body.includes('data-pf=\"views\"'));\n  t('行操作有「删除」', body.includes('data-pf=\"del\"'));\n  t('已认领统计展示 21 / 62', $('pfClaim').innerHTML.includes('21') && $('pfClaim').innerHTML.includes('62'));\n\n  /* 事件绑定：点胶囊切换状态 */\n  const pen = $('pfChips').querySelector('[data-st=\"pending\"]');\n  t('待审核胶囊有 click 处理器', typeof pen.onclick === 'function');\n}\n\nconsole.log('\\n【C】资料管理 · 搜索与状态筛选走对接口');\n{\n  calls.length = 0;\n  $('pfSearch').value = '余';\n  $('pfSearch').dispatchEvent(new window.Event('input'));\n  await new Promise((r) => setTimeout(r, 450));   /* 等 320ms 防抖 */\n  await flush();\n  t('搜索后请求带 q=余',\n    calls.some((c) => c.key.includes('q=%E4%BD%99') || c.includes('q=余')), calls.map((x) => x.key).join(' | '));\n}\n\nconsole.log('\\n【D】资料管理 · 新增/编辑弹窗结构');\n{\n  H.go('profiles');\n  await flush();\n  H.profileDialog(null);\n  await flush();\n\n  const box = $('modalBox');\n  t('弹窗打开（modal show）', $('modal').className.includes('show'));\n  t('标题为「新增班级资料」', box.innerHTML.includes('新增班级资料'));\n  t('有姓名输入 #pfName', !!box.querySelector('#pfName'));\n  t('有学号输入 #pfSid', !!box.querySelector('#pfSid'));\n  t('有政治面貌下拉 #pfPol', !!box.querySelector('#pfPol'));\n  t('政治面貌选项含「共青团员 · 团支书」', box.querySelector('#pfPol').innerHTML.includes('共青团员 · 团支书'));\n  t('有微信输入 #pfWx', !!box.querySelector('#pfWx'));\n  t('有 QQ 输入 #pfQq', !!box.querySelector('#pfQq'));\n  t('有手机号输入 #pfPh', !!box.querySelector('#pfPh'));\n  t('有审核状态下拉 #pfSt', !!box.querySelector('#pfSt'));\n  t('有准考证号输入 #pfEx', !!box.querySelector('#pfEx'));\n  t('准考证号提示不需审核', box.innerHTML.includes('不需要审核'));\n  t('新增态默认政治面貌为群众', box.querySelector('#pfPol').value === '群众');\n  t('审核状态含 approved', box.querySelector('#pfSt').innerHTML.includes('value=\"approved\"'));\n  t('提示姓名不能自己改', box.innerHTML.includes('姓名不能由同学自己改'));\n\n  /* 编辑态：预填数据 */\n  H.closeModal();\n  H.profileDialog(PROFILES[0]);\n  await flush();\n  const box2 = $('modalBox');\n  t('编辑态标题带姓名', box2.innerHTML.includes('编辑 余子康'));\n  t('编辑态姓名预填', box2.querySelector('#pfName').value === '余子康');\n  t('编辑态学号预填', box2.querySelector('#pfSid').value === '250501');\n  t('编辑态微信预填', box2.querySelector('#pfWx').value === 'yzikang_0710');\n  t('编辑态审核状态选中 approved', box2.querySelector('#pfSt').value === 'approved');\n  t('编辑态政治面貌被保留为选中项', box2.querySelector('#pfPol').value === '共青团员 · 团支书');\n  t('编辑态准考证号预填', box2.querySelector('#pfEx').value === '11399395');\n  H.closeModal();\n}\n\nconsole.lo","tt":1},{"p":"资料_班级站后台备份/后端源码/测试/班级站后台备份_2026-10-05_班徽手势测试.mjs","n":"班级站后台备份_2026-10-05_班徽手势测试.mjs","d":"","sz":7030,"t":"/**\n * 班徽手势专项测试。\n *\n * 要验证的是「三种交互互不干扰」这件很难靠肉眼确认的事：\n *   ① 短按 1~4 次 → 什么都不发生\n *   ② 短按满 5 次   → 打开隐藏娱乐天地\n *   ③ 长按 700ms    → 跳转 admin.html\n *   ④ 长按松手后的 click → 必须被吞掉，不能让计数器 +1\n *   ⑤ 按下后滑动超过阈值 → 取消长按，不跳转\n *\n * 用 jsdom + 假定时器跑，避免真的等 700ms。\n * 跳转的观测方式：jsdom 对 location.href 赋值会往虚拟控制台打\n * \"Not implemented: navigation (except hash changes)\"，我们把它捕获下来。\n */\nimport { JSDOM, VirtualConsole } from 'jsdom';\nimport fs from 'node:fs';\n\nconst HTML = fs.readFileSync('/tmp/class-site/index.html', 'utf8');\n\nconst NAV = [];\nconst vc = new VirtualConsole();\nvc.on('jsdomError', (err) => {\n  const m = /Not implemented: navigation.*?(https?:\\/\\/\\S+|\\S+\\.html)/.exec(err.message);\n  NAV.push(err.message);\n});\nvc.on('error', () => {});\nvc.on('warn', () => {});\n\nconst dom = new JSDOM(HTML, {\n  runScripts: 'dangerously',\n  pretendToBeVisual: true,\n  url: 'https://yuzikaaang.github.io/class-site/',\n  virtualConsole: vc,\n  beforeParse(window) {\n    window.__VIB__ = [];\n    Object.defineProperty(window.navigator, 'vibrate', {\n      configurable: true,\n      value(v) { window.__VIB__.push(v); return true; },\n    });\n    /* 页面初始化会调 fetch 拉云端内容；jsdom 没有 fetch，会中断整个脚本块。\n       给个永远 pending 的 stub，让初始化自己卡住、不影响我们测手势。 */\n    window.fetch = function () {\n      return new Promise(function () { /* 永不 resolve */ });\n    };\n  },\n});\n\nconst { window } = dom;\nconst doc = window.document;\n\nlet pass = 0, fail = 0;\nconst fails = [];\nfunction t(name, cond, extra) {\n  if (cond) { pass++; console.log('  ✓ ' + name); }\n  else { fail++; fails.push(name); console.log('  ✗ ' + name + (extra ? '  → ' + extra : '')); }\n}\n\n/* ---- 假定时器：接管 setTimeout，手动推进 ---- */\nlet timers = [];\nlet now = 0;\nwindow.setTimeout = function (fn, ms) {\n  const id = timers.length;\n  timers.push({ fn, at: now + (ms || 0), id, alive: true });\n  return id;\n};\nwindow.clearTimeout = function (id) { if (timers[id]) timers[id].alive = false; };\nfunction advance(ms) {\n  now += ms;\n  const due = timers.filter((x) => x.alive && x.at <= now).sort((a, b) => a.at - b.at);\n  due.forEach((x) => { x.alive = false; try { x.fn(); } catch (e) { console.error('定时器抛错:', e.message); } });\n}\n\n/* ---- 事件派发 ---- */\nfunction fire(el, type, opts = {}) {\n  const ev = new window.Event(type, { bubbles: true, cancelable: true });\n  Object.assign(ev, opts);\n  el.dispatchEvent(ev);\n}\nfunction touch(el, type, x, y) {\n  const ev = new window.Event(type, { bubbles: true, cancelable: true });\n  ev.touches = [{ clientX: x, clientY: y }];\n  ev.changedTouches = [{ clientX: x, clientY: y }];\n  el.dispatchEvent(ev);\n}\n\nconst logo = doc.querySelector('.logo');\nt('页面上能找到班徽 .logo', !!logo);\n\nfunction gateOpened() {\n  const g = doc.getElementById('hiddenGateMask');\n  const v = doc.getElementById('hiddenViewMask');\n  return !!((g && g.classList.contains('show')) || (v && v.classList.contains('show')));\n}\nfunction navCount() { return NAV.length; }\n\nfunction reset() {\n  timers = []; now = 0;\n  NAV.length = 0;\n  window.__VIB__.length = 0;\n  const g = doc.getElementById('hiddenGateMask');\n  const v = doc.getElementById('hiddenViewMask');\n  if (g) g.classList.remove('show');\n  if (v) v.classList.remove('show');\n  /* 让内部计数器自然归零 */\n  fire(logo, 'click'); advance(3500);\n  timers = []; now = 0;\n  NAV.length = 0;\n}\n\nconsole.log('\\n【A】短按 1~4 次不该有任何反应');\nreset();\nfor (let i = 1; i <= 4; i++) { fire(logo, 'click'); advance(50); }\nt('短按 4 次没打开娱乐天地', !gateOpened());\nt('短按 4 次没跳后台', navCount() === 0);\n\nconsole.log('\\n【B】短按满 5 次打开隐藏娱乐天地');\nreset();\nfor (let i = 1; i <= 5; i++) { fire(logo, 'click'); advance(50); }\nt('第 5 次点击打开了娱乐天地', gateOpened());\nt('打开娱乐天地时没有跳后台', navCount() === 0);\n\nconsole.log('\\n【C】长按 700ms 跳转管理后台');\nreset();\ntouch(logo, 'touchstart', 100, 100);\nadvance(600);\nt('长按 600ms 时还没跳（未到阈值）', navCount() === 0);\nadvance(150);\nt('长按满 700ms 后发生跳转', navCount() >= 1, 'NAV=' + JSON.stringify(NAV));\nt('长按触发了震动反馈', window.__VIB__.length === 1);\n\nconsole.log('\\n【D】★关键★ 长按松手后到达的 click 必须被吞掉');\nreset();\ntouch(logo, 'touchstart', 100, 100);\nadvance(750);\nconst navAfterLong = navCount();\ntouch(logo, 'touchend', 100, 100);\nfire(logo, 'click');            /* 浏览器在长按后仍会派发 click */\nadvance(50);\nt('长按已跳转', navAfterLong === 1);\nt('松手后的 click 被吞掉，没有计数', !gateOpened(), '若未吞掉，长按 5 次会误开娱乐天地');\nfor (let i = 0; i < 3; i++) { fire(logo, 'click'); advance(50); }\nt('随后短按 3 次仍不足以打开娱乐天地', !gateOpened());\n\nconsole.log('\\n【E】按下后滑动超过阈值 → 取消长按');\nreset();\ntouch(logo, 'touchstart', 100, 100);\nadvance(300);\ntouch(logo, 'touchmove', 100, 140);\nadvance(600);\nt('滑动后长按被取消，没有跳后台', navCount() === 0);\n\nconsole.log('\\n【F】微小位移不该误取消长按');\nreset();\ntouch(logo, 'touchstart', 100, 100);\nadvance(200);\ntouch(logo, 'touchmove', 103, 104);\nadvance(600);\nt('轻微抖动仍能完成长按跳转', navCount() >= 1);\n\nconsole.log('\\n【G】touchcancel 取消长按');\nreset();\ntouch(logo, 'touchstart', 100, 100);\nadvance(200);\ntouch(logo, 'touchcancel', 100, 100);\nadvance(600);\nt('touchcancel 后没有跳后台', navCount() === 0);\n\nconsole.log('\\n【H】鼠标长按同样有效（电脑上调试）');\nreset();\nfire(logo, 'mousedown', { clientX: 50, clientY: 50 });\nadvance(750);\nt('鼠标按住 700ms 也跳后台', navCount() >= 1);\nfire(logo, 'mouseup', { clientX: 50, clientY: 50 });\n\nconsole.log('\\n【I】鼠标按下后松开 → 取消（不会跳转）');\nreset();\nfire(logo, 'mousedown', { clientX: 50, clientY: 50 });\nadvance(200);\nfire(logo, 'mouseup', { clientX: 50, clientY: 50 });\nadvance(600);\nt('鼠标松开后不跳后台', navCount() === 0);\n\nconsole.log('\\n【J】连点的判定窗口是 3 秒（超过要重新计）');\nreset();\nfor (let i = 0; i < 4; i++) { fire(logo, 'click'); advance(50); }\nadvance(3200);\nfire(logo, 'click'); advance(50);\nt('超时后重新计数，1 次不触发', !gateOpened());\n\nconsole.log('\\n========================================================');\nconsole.log(`班徽手势测试: ${pass} 通过, ${fail} 失败 (共 ${pass + fail} 项)`);\nconsole.log('========================================================');\nif (fails.length) { console.log('失败项:'); fails.forEach((f) => console.log('  - ' + f)); }\nprocess.exit(fail ? 1 : 0);\n"}]},{"dir":"资料_班级电脑准备包","ver":"","date":"","title":"班级电脑准备包","theme":true,"count":4,"files":[{"p":"资料_班级电脑准备包/班级电脑准备包_2026-11-07_启动大屏(无黑框).vbs","n":"班级电脑准备包_2026-11-07_启动大屏(无黑框).vbs","d":"","sz":2361,"t":"' ============================================================\n'  25-05 ༶վ  ޺ڿ棩  v4.7.10\n'  ˫ļᵯɫдڡ\n'  ֻʧʱŵ־ʾ\n'  ԼжϣɻĻͬĿ¼ġ.bat\n' ============================================================\nOption Explicit\n\nDim sh, fso, fldr, batPath, logPath, rc, msg, ts, q\n\nSet sh  = CreateObject(\"WScript.Shell\")\nSet fso = CreateObject(\"Scripting.FileSystemObject\")\n\nfldr    = fso.GetParentFolderName(WScript.ScriptFullName)\nbatPath = fldr & \"\\.bat\"\nlogPath = fldr & \"\\־.txt\"\nq       = Chr(34)\n\nIf Not fso.FileExists(batPath) Then\n  MsgBox \"ͬĿ¼Ҳ.bat\" & vbCrLf & vbCrLf & _\n         \"ļͬһļ˫ļ\", 16, \"༶վ\"\n  WScript.Quit 1\nEnd If\n\n' еűĿ¼ʡ·ոʱ״\nsh.CurrentDirectory = fldr\n\n' ڶ 0 = شڣ True = ꣬õ˳\nOn Error Resume Next\nrc = sh.Run(\"cmd /c \" & q & q & \".bat\" & q & \" quiet\" & q, 0, True)\nIf Err.Number <> 0 Then\n  MsgBox \"á.batʧܣ\" & vbCrLf & vbCrLf & Err.Description & vbCrLf & vbCrLf & _\n         \"ǰȫ .vbs  .batá.batԣѱļм\", 16, \"༶վ\"\n  WScript.Quit 1\nEnd If\nOn Error GoTo 0\n\n' ˳ 2 = Ĭˣֻûжڣ\nIf rc = 2 Then\n  MsgBox \"ûҵ Chrome  EdgeѾϵͳĬ򿪴\" & vbCrLf & vbCrLf & _\n         \"ҪûеַĶڣװһ Chrome  Edge С\", 48, \"༶վ\"\n  WScript.Quit 0\nEnd If\n\n'  0 ˣ + վҪҪ־\nIf rc <> 0 Then\n  msg = \"û־£\" & vbCrLf & vbCrLf\n  If fso.FileExists(logPath) Then\n    On Error Resume Next\n    Set ts = fso.OpenTextFile(logPath, 1, False)\n    If Err.Number = 0 Then\n      If Not ts.AtEndOfStream Then msg = msg & Left(ts.ReadAll, 800)\n      ts.Close\n    End If\n    On Error GoTo 0\n  Else\n    msg = msg & \"û־ļǱɱסˣ\"\n  End If\n  msg = msg & vbCrLf & vbCrLf & \"Ҫ־ļ\"\n  If MsgBox(msg, 4 + 48, \"༶վ  ʧ\") = 6 Then\n    sh.Run \"notepad.exe \" & q & logPath & q, 1, False\n  End If\n  WScript.Quit 1\nEnd If\n\nWScript.Quit 0\n"},{"p":"资料_班级电脑准备包/班级电脑准备包_2026-11-07_启动大屏.bat","n":"班级电脑准备包_2026-11-07_启动大屏.bat","d":"","sz":6649,"t":"@echo off\nchcp 65001 >nul\nrem ============================================================\nrem  25-05 班级站 · 大屏启动器  v4.7.10\nrem  保存要求：不要存成「UTF-8 带 BOM」，否则第一行会多出隐藏字符，\nrem            cmd 会报「不是内部或外部命令」，表现就是一闪就没。\nrem  本脚本不用 for 循环、不用括号块 —— 这两样在含括号的系统路径\nrem  （Program Files (x86)）下最容易把解析打断，一断就整段退出。\nrem ============================================================\nsetlocal EnableExtensions DisableDelayedExpansion\ntitle 班级大屏启动器\ncolor 0F\n\nrem  quiet = 由「无黑框启动」的 vbs 调用：窗口本身是隐藏的，\nrem  所以不打印、不等待、不按暂停；成功返回 0，失败返回 1，\nrem  由 vbs 决定要不要弹窗把日志给你看。\nset \"QUIET=\"\nif /i \"%~1\"==\"quiet\" set \"QUIET=1\"\n\nset \"DIR=%~dp0\"\nset \"URL=https://yuzikaaang.github.io/class-site/index.html?big=1\"\nset \"LOG=%DIR%启动日志.txt\"\nset \"PROFILE=\"\nset \"EXE=\"\nset \"LEAF=\"\n\necho. > \"%LOG%\" 2>nul\n\necho.\necho   ============================================\necho     25-05 班级站 - 大屏启动器  v4.7.10\necho   ============================================\necho.\n\ncall :log \"===== %date% %time% 启动 =====\"\ncall :log \"脚本目录 = %DIR%\"\n\nrem ---------- 1. profile（登录状态 / 字号 / 离线缓存） ----------\nset \"PROFILE=%DIR%profile\"\nif exist \"%PROFILE%\\\" goto :profile_ok\nmkdir \"%PROFILE%\" 2>nul\nif exist \"%PROFILE%\\\" goto :profile_ok\ncall :log \"!! 同级目录不可写，改放 LOCALAPPDATA\"\nset \"PROFILE=%LocalAppData%\\ClassSiteProfile\"\nif exist \"%PROFILE%\\\" goto :profile_ok\nmkdir \"%PROFILE%\" 2>nul\nif exist \"%PROFILE%\\\" goto :profile_ok\ngoto :no_profile\n\n:profile_ok\necho   [OK] 配置目录：%PROFILE%\ncall :log \"profile = %PROFILE%\"\n\nrem ---------- 2. 找浏览器 ----------\nif exist \"%ProgramFiles%\\Google\\Chrome\\Application\\chrome.exe\" goto :b_chrome1\nif exist \"%ProgramFiles(x86)%\\Google\\Chrome\\Application\\chrome.exe\" goto :b_chrome2\nif exist \"%LocalAppData%\\Google\\Chrome\\Application\\chrome.exe\" goto :b_chrome3\nif exist \"%ProgramFiles%\\Microsoft\\Edge\\Application\\msedge.exe\" goto :b_edge1\nif exist \"%ProgramFiles(x86)%\\Microsoft\\Edge\\Application\\msedge.exe\" goto :b_edge2\nif exist \"%LocalAppData%\\Microsoft\\Edge\\Application\\msedge.exe\" goto :b_edge3\nif exist \"%ProgramFiles(x86)%\\360Chrome\\Chrome\\Application\\360chrome.exe\" goto :b_360a\nif exist \"%ProgramFiles%\\360Chrome\\Chrome\\Application\\360chrome.exe\" goto :b_360b\ngoto :no_browser\n\n:b_chrome1\nset \"EXE=%ProgramFiles%\\Google\\Chrome\\Application\\chrome.exe\"\nset \"LEAF=chrome.exe\"\ngoto :launch\n:b_chrome2\nset \"EXE=%ProgramFiles(x86)%\\Google\\Chrome\\Application\\chrome.exe\"\nset \"LEAF=chrome.exe\"\ngoto :launch\n:b_chrome3\nset \"EXE=%LocalAppData%\\Google\\Chrome\\Application\\chrome.exe\"\nset \"LEAF=chrome.exe\"\ngoto :launch\n:b_edge1\nset \"EXE=%ProgramFiles%\\Microsoft\\Edge\\Application\\msedge.exe\"\nset \"LEAF=msedge.exe\"\ngoto :launch\n:b_edge2\nset \"EXE=%ProgramFiles(x86)%\\Microsoft\\Edge\\Application\\msedge.exe\"\nset \"LEAF=msedge.exe\"\ngoto :launch\n:b_edge3\nset \"EXE=%LocalAppData%\\Microsoft\\Edge\\Application\\msedge.exe\"\nset \"LEAF=msedge.exe\"\ngoto :launch\n:b_360a\nset \"EXE=%ProgramFiles(x86)%\\360Chrome\\Chrome\\Application\\360chrome.exe\"\nset \"LEAF=360chrome.exe\"\ngoto :launch\n:b_360b\nset \"EXE=%ProgramFiles%\\360Chrome\\Chrome\\Application\\360chrome.exe\"\nset \"LEAF=360chrome.exe\"\ngoto :launch\n\nrem ---------- 3. 拉起独立窗口 ----------\n:launch\necho   [OK] 浏览器：%EXE%\ncall :log \"browser = %EXE%\"\n\nrem  v4.10.2: back to --start-maximized.\nrem  v4.10.0 had switched this to --start-fullscreen, but then the in-page\nrem  fullscreen toggle could not leave fullscreen, and the station got stuck\nrem  in a state nobody could get out of. Maximized keeps the title bar and\nrem  task bar, so Esc / F11 / the page toggle all still work.\nstart \"\" \"%EXE%\" --app=\"%URL%\" --user-data-dir=\"%PROFILE%\" --start-maximized --window-size=1920,1080 --no-first-run --no-default-browser-check --disable-features=Translate,msEdgeSidebar\ncall :log \"start 已发出，等待 4 秒回查进程\"\n\nrem  静默模式不用 timeout（隐藏窗口里没有控制台输入，timeout 会报错），\nrem  改用 ping 等 4 秒，效果一样且绝对不依赖控制台。\nif defined QUIET ping -n 5 127.0.0.1 >nul\nif not defined QUIET timeout /t 4 /nobreak >nul\ntasklist /fi \"imagename eq %LEAF%\" 2>nul | find /i \"%LEAF%\" >nul\nif errorlevel 1 goto :died\n\nif defined QUIET goto :ok_quiet\n\necho.\necho   [OK] 大屏已启动，窗口应该已经出来了。\necho.\necho   如果看到的还是普通网页（有地址栏），点右上角三个点，选\necho   「在应用窗口中打开」即可。\necho.\necho   本窗口 8 秒后自动关闭；日志：启动日志.txt\ncall :log \"结果 = 成功\"\ntimeout /t 8 >nul\nendlocal\nexit /b 0\n\n:ok_quiet\ncall :log \"结果 = 成功\"\nendlocal\nexit /b 0\n\nrem ================= 失败分支 =================\n:no_profile\necho.\necho   [失败] 建不了配置文件目录，可能没有写权限。\necho   请把整个文件夹复制到 D 盘再双击。\ncall :log \"结果 = 失败：profile 无法创建\"\ngoto :hold\n\n:no_browser\necho   [!!] 常见位置没找到 Chrome / Edge / 360，改用系统默认浏览器。\ncall :log \"未找到常见浏览器，走默认浏览器\"\nstart \"\" \"%URL%\"\nif defined QUIET ping -n 4 127.0.0.1 >nul\nif not defined QUIET timeout /t 3 /nobreak >nul\necho.\necho   已交给默认浏览器。若没反应，请手动打开：\necho   %URL%\ncall :log \"结果 = 默认浏览器\"\nrem  退出码 2 = 「开了，但不是独立窗口」：不算失败，vbs 只做一句提示\nif defined QUIET exit /b 2\ngoto :hold\n\n:died\necho.\necho   [失败] 浏览器启动了又立刻退出。常见两个原因：\necho     1) profile 文件夹里存的是坏掉的配置（多是从别的电脑整包拷过来）\necho     2) 浏览器被安全软件拦了\necho.\necho   解决办法：把同目录下的 profile 文件夹改名成 profile-old，再双击本脚本。\necho   改名后要重新登录一次，页面缓存也会重新下载。\ncall :log \"结果 = 失败：浏览器进程已退出\"\ngoto :hold\n\n:hold\nrem  静默调用时不打日志、不暂停，直接把失败交回给 vbs 弹窗\nif defined QUIET exit /b 1\necho.\necho   ---------- 日志 ----------\nif exist \"%LOG%\" type \"%LOG%\"\necho   ------------------------------\necho   日志文件：%LOG%\necho   把这个文件发给站长，一看就知道卡在哪。\necho.\npause\nendlocal\nexit /b 1\n\nrem ================= 子程序 =================\n:log\n>>\"%LOG%\" echo   %~1 2>nul\ngoto :eof\n"},{"p":"资料_班级电脑准备包/班级电脑准备包_2026-11-07_在家先搞好-操作清单.md","n":"班级电脑准备包_2026-11-07_在家先搞好-操作清单.md","d":"","sz":9491,"t":"# 班级电脑 · 在家先搞好\n\n> 适用版本：站点 v4.7.10（2026-11-07）\n> 目标：**在家把整套东西跑通，装进 U 盘，到教室只做「复制 + 双击」两件事。**\n> 全程不需要教室那台电脑联网。\n\n---\n\n## 一、为什么要在家里做\n\n教室里那台希沃 / 鸿合有三个特点：\n\n1. **网不稳**，第一次打开往往卡在加载；\n2. **C 盘会被还原**，装什么都留不住；\n3. **改东西要当着全班**，出了问题很尴尬。\n\n在家做的好处：能慢慢试、能反复改、能把「缓存养好」再拷过去——到了教室连网都不用连。\n\n---\n\n## 二、家里电脑要做的 4 步（约 15 分钟）\n\n### 1. 建一个文件夹\n\n在你电脑的 D 盘（或桌面）建：\n\n```\nClassSite\\\n  ├─ 启动大屏(无黑框).vbs   ← 日常就双击这个，没有任何黑窗口\n  ├─ 启动大屏.bat           ← 底层脚本，vbs 会调它；也可以自己双击看过程\n  ├─ 诊断.bat               ← 出问题时双击这个，把窗口截图发我\n  └─ profile\\               ← 第一次运行后自动生成\n```\n\n三个文件放同一个文件夹，缺一个都不行（vbs 找不到 bat 会弹提示）。\n\n### 2. 双击跑一次\n\n**双击 `启动大屏(无黑框).vbs`**。正常情况下：\n\n- **不会出现任何黑窗口**，1～2 秒后直接弹出大屏应用窗口；\n- 出错才会弹一个对话框，里面直接写着日志内容，还能一键用记事本打开完整日志。\n\n想亲眼确认它找了哪个浏览器、用了哪个配置目录，就双击 `启动大屏.bat`（这个会有黑窗口，停 8 秒）：\n\n```\n[OK] 配置目录：D:\\ClassSite\\profile\n[OK] 浏览器：C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe\n```\n\n- 显示 `[!!] 常见位置没找到 Chrome / Edge / 360` → 走的是系统默认浏览器，看第五节补路径。\n- 显示 `[失败]` → 按提示处理，或直接跑 `诊断.bat`。\n- 全程都会写进 `启动日志.txt`，窗口关掉也能回看。\n\n> **两个入口的区别**：`vbs` 是「壳」，它用隐藏窗口去调 `bat`，拿 bat 的退出码决定要不要弹窗——0 成功、1 失败、2 用默认浏览器打开了。所以真正的判断逻辑只有一份，都在 bat 里，不会出现「vbs 能用 bat 不能用」的情况。\n\n### 3. 停在页面上 30 秒（关键）\n\n不要关窗口，等半分钟。这半分钟在做两件事：\n\n- 下载离线包（Service Worker 把页面、脚本、字体全存到 `profile` 里）；\n- 把班徽、作业、公告这些内容缓存下来。\n\n**判断成功**：打开 `ClassSite\\profile\\`，能看到 `Default`、`Local Storage` 这类文件夹，且体积有几十 MB。\n\n### 4. 登录一次 + 调好设置\n\n在窗口里正常登录（你的管理员账号），然后：\n\n- 打开大屏模式，确认字体、字号是你想要的；\n- 看一眼作业页，翻两页让图片缓存下来；\n- 关掉窗口，再双击一次，确认**还是登录状态**、设置没丢。\n\n这一步做完，`profile` 里就有一个\"熟\"的浏览器了。\n\n---\n\n## 三、U 盘放什么\n\n```\nU盘\\\n  └─ ClassSite\\\n      ├─ 启动大屏(无黑框).vbs\n      ├─ 启动大屏.bat\n      ├─ 诊断.bat\n      └─ profile\\        ← 整个文件夹一起拷（几十到几百 MB）\n```\n\n**不要**只拷 bat —— 那样到教室还得联网等一次缓存。\n**要**连 `profile` 一起拷，教室电脑开机就是登录好的状态。\n\n> 注意：`profile` 里带着你的登录凭证，U 盘别乱借人。用完可以把 `profile` 删掉重来。\n\n---\n\n## 四、到教室只做两件事\n\n1. 把 `ClassSite` 整个文件夹复制到教室电脑的 **D 盘**（不要放 C 盘，还原卡会清）。\n2. 双击 `启动大屏(无黑框).vbs`（没有黑框，1～2 秒出画面）。\n\n第一次可能弹「Windows 已保护你的电脑」→ 点「更多信息」→「仍要运行」。\n之后右键这个 vbs → 发送到 → 桌面快捷方式，再右键快捷方式「属性 → 更改图标」换成班徽，以后开机点桌面图标就行。\n\n---\n\n## 五、双击一闪就没 / 找不到浏览器\n\n**先跑 `诊断.bat`**（和启动器放在同一个文件夹）。它不启动任何东西，只查环境，双击后窗口会停住，把内容截图发我即可。它会告诉你：\n\n- 这台机器是 32 位还是 64 位系统；\n- 四个常见浏览器位置到底哪个存在；\n- `profile` 文件夹建没建出来、里面有没有 `Default`；\n- 有没有 chrome / edge 进程在跑；\n- 能不能连到站点；\n- **有没有被组策略禁用命令提示符**（学校机常见，禁了之后所有 .bat 双击都是一闪就没）。\n\n如果诊断里显示「不能写入」，说明文件夹在只读盘上，换到 D 盘。\n\n### 手动改浏览器路径\n\n用记事本打开 `启动大屏.bat`，找到这一段：\n\n```\nif exist \"%ProgramFiles%\\Microsoft\\Edge\\Application\\msedge.exe\" set \"EXE=%ProgramFiles%\\Microsoft\\Edge\\Application\\msedge.exe\"\n```\n\n在教室电脑上确认浏览器真实位置（右键浏览器图标 → 属性 → 目标），照着加一行同样的写法即可。常见位置：\n\n| 浏览器 | 路径 |\n|---|---|\n| Edge（64 位） | `C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe` |\n| Chrome（64 位） | `C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe` |\n| 360 极速 | `C:\\Program Files (x86)\\360Chrome\\Chrome\\Application\\360chrome.exe` |\n| 希沃自带浏览器 | 一般在 `C:\\Program Files (x86)\\Seewo\\...`，把完整 exe 路径照上式加一行 |\n\n> **改完保存时注意**：编码选「ANSI」或「UTF-8（无 BOM）」，**千万别选「UTF-8 带 BOM」**——带 BOM 的话第一行 `@echo off` 前面会多出三个隐藏字符，cmd 会报「不是内部或外部命令」，这正是另一个常见的「一闪就没」原因。\n\n---\n\n## 六、验收清单（到教室后逐条打勾）\n\n| # | 操作 | 期望 |\n|---|---|---|\n| 1 | 拔网线 / 关 WiFi，双击桌面图标 | 10 秒内出现大屏，不是白屏 |\n| 2 | 作业页点「时钟」 | 跳到时钟页，**仍然全屏** |\n| 3 | 作业页点全屏按钮 | 任务栏被盖住，Esc 能退出 |\n| 4 | 字号 A− / A+ | 每次 5%，中间数字能直接输入 |\n| 5 | 随机点名抽一次 | 格子按学号段配色，不是全场同色 |\n| 6 | 重启电脑后再双击 | 不用重新登录，字号主题都还在 |\n| 7 | 点「进入后台」 | 一次点击直达 |\n\n第 6 条最重要——它验证 `profile` 真的落在 D 盘、且没被还原卡清掉。\n如果第 6 条失败，说明教室电脑**整块 D 盘也在还原**，这时候只能找电教老师要一个不被还原的分区（一般是 `D:\\` 之外的某个盘），把 `ClassSite` 挪过去。\n\n---\n\n## 七、常见问题\n\n| 现象 | 原因 | 处理 |\n|---|---|---|\n| 双击闪一下就没了 | ① 旧版脚本本来就立刻退出（v4.7.10 已改为停 8 秒）；② `for` 循环里含括号的变量打断解析；③ 文件存成了 UTF-8 带 BOM | 改用 `启动大屏(无黑框).vbs`；仍异常就跑 `诊断.bat` |\n| 双击 vbs 弹出「找不到 启动大屏.bat」 | 三个文件没放同一个文件夹 | 把它们放在一起（vbs 只认自己所在目录） |\n| 双击 vbs 完全没反应，也没有弹窗 | 系统策略禁用了 WScript / 杀软拦了 .vbs | 改用 `启动大屏.bat`（会有黑框但能用）；或把文件夹加进杀软白名单 |\n| vbs 弹窗写着「浏览器启动了又立刻退出」 | `profile` 里是坏配置 | 把 `profile` 改名 `profile-old` 再双击 vbs |\n| 窗口停住显示「浏览器启动了又立刻退出」 | `profile` 里存了坏配置（多为从别的电脑整包拷过来） | 把 `profile` 改名成 `profile-old` 再双击；需重新登录一次 |\n| 提示「没有 program 文件」 | 用了手工建的 .lnk 快捷方式 | 一定用 `启动大屏.bat`，不要自己建指向 exe 的快捷方式 |\n| 断网打开是白屏 | 家里那步没等够 30 秒 | 回家重做第二节第 3 步，或到教室联一次网等 30 秒 |\n| 打开是普通网页不是大屏 | URL 少了 `?big=1` | 别改 bat 里的 URL；或右上角三个点 →「在应用窗口中打开」 |\n| 每次都要重新登录 | `profile` 没被用上 | 看黑窗口第一行 `[OK] 配置目录:` 指向哪里，应该是 D 盘 |\n| 字体变方块 | 系统缺字体（教室电脑常见） | 站点已内置字体，若仍方块，把 `profile` 重新拷一次 |\n| 所有 .bat 双击都闪（含诊断.bat） | 系统策略禁用了命令提示符 | 诊断结果里 `DisableCMD` 若是 `0x1` 就是被禁，只能找电教老师放开，或改用「第七节第二条」纯网页方案 |\n\n---\n\n## 八、想再省事一点（可选）\n\n如果教室电脑有还原卡、又不让你动 D 盘，还有三个退路：\n\n1. **便携版浏览器**：把 Chrome 便携版整个放进 U 盘，bat 里把某一路径改成 U 盘里的 `chrome.exe`。缺点是 U 盘要一直插着。\n2. **只用网页版**：不装任何东西，开机后打开浏览器输网址。缺点是每次都要等加载、要重新登录。\n3. **完全不用 bat**：打开站点 → 右上角三个点 → 更多工具 → 创建快捷方式 → 勾选「在窗口中打开」。桌面上就多一个图标，点开就是无地址栏窗口。缺点是登录态存在默认浏览器里，还原卡一还原就没了，得重新登录。\n\n先按正常流程做，能过验收清单就不用考虑这几条。\n"},{"p":"资料_班级电脑准备包/班级电脑准备包_2026-11-07_诊断.bat","n":"班级电脑准备包_2026-11-07_诊断.bat","d":"","sz":4331,"t":"@echo off\nchcp 65001 >nul\nrem ============================================================\nrem  25-05 班级站 · 环境诊断  v4.7.10\nrem  用途：双击它，把窗口里看到的内容截图发给站长。\nrem        它不启动任何程序、不改任何设置，只查环境，绝对安全。\nrem ============================================================\nsetlocal EnableExtensions DisableDelayedExpansion\ntitle 班级站 环境诊断\ncolor 0A\n\nset \"DIR=%~dp0\"\nset \"OUT=%DIR%诊断结果.txt\"\necho. > \"%OUT%\" 2>nul\nif not exist \"%OUT%\" set \"OUT=%TEMP%\\诊断结果.txt\"\n\necho ============================================ >> \"%OUT%\"\necho   诊断时间 %date% %time% >> \"%OUT%\"\necho ============================================ >> \"%OUT%\"\necho. >> \"%OUT%\"\n\necho [1] 系统 >> \"%OUT%\"\nver >> \"%OUT%\" 2>&1\necho 计算机名 = %COMPUTERNAME% >> \"%OUT%\"\necho 用户名   = %USERNAME% >> \"%OUT%\"\necho. >> \"%OUT%\"\n\necho [2] 脚本位置 >> \"%OUT%\"\necho 脚本目录 = %DIR% >> \"%OUT%\"\necho test > \"%DIR%_wtest.tmp\" 2>nul\nif exist \"%DIR%_wtest.tmp\" echo 目录可写 = 是 >> \"%OUT%\"\nif not exist \"%DIR%_wtest.tmp\" echo 目录可写 = 否（只读或没权限） >> \"%OUT%\"\ndel \"%DIR%_wtest.tmp\" 2>nul\necho. >> \"%OUT%\"\n\necho [3] 浏览器检测（只看这些常见位置） >> \"%OUT%\"\nif exist \"%ProgramFiles%\\Google\\Chrome\\Application\\chrome.exe\" echo    Chrome 64位   有 >> \"%OUT%\"\nif not exist \"%ProgramFiles%\\Google\\Chrome\\Application\\chrome.exe\" echo    Chrome 64位   无 >> \"%OUT%\"\nif exist \"%ProgramFiles(x86)%\\Google\\Chrome\\Application\\chrome.exe\" echo    Chrome 32位   有 >> \"%OUT%\"\nif not exist \"%ProgramFiles(x86)%\\Google\\Chrome\\Application\\chrome.exe\" echo    Chrome 32位   无 >> \"%OUT%\"\nif ex
