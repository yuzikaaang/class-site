nt('   https://workbuddy.link/p/wE79VgSnppmeb15X5A5b2l')\n    else:\n        print('\\n⚠️ 节点内容已更新，但重新发布失败——分享链接可能仍显示旧内容')\n        print('   手动重试：python3 ' + SKILL + '/page/publish_page.py --node-id ' + NODE)\n        sys.exit(1)\n    shutil.rmtree(work, ignore_errors=True)\n\n\nif __name__ == '__main__':\n    main()\n"}]},{"dir":"资料_第二十五轮交付","ver":"","date":"","title":"第二十五轮交付","theme":true,"count":3,"files":[{"p":"资料_第二十五轮交付/第二十五轮交付_2026-10-07_后台-公告置顶设置.png","n":"第二十五轮交付_2026-10-07_后台-公告置顶设置.png","d":"","sz":313282,"u":"a/316629afcad03d59.jpg"},{"p":"资料_第二十五轮交付/第二十五轮交付_2026-10-07_本地-上传后URL插入.png","n":"第二十五轮交付_2026-10-07_本地-上传后URL插入.png","d":"","sz":159901,"u":"a/ff83134d9d1fc417.jpg"},{"p":"资料_第二十五轮交付/第二十五轮交付_2026-10-07_线上作业编辑器-上传按钮.png","n":"第二十五轮交付_2026-10-07_线上作业编辑器-上传按钮.png","d":"","sz":195988,"u":"a/eb12837f19bd83f2.jpg"}]},{"dir":"资料_界面预览","ver":"","date":"","title":"界面预览","theme":true,"count":6,"files":[{"p":"资料_界面预览/界面预览_2026-11-01_expand-anim.gif","n":"界面预览_2026-11-01_expand-anim.gif","d":"","sz":487532,"u":"a/ab423ffdb8c31e17.jpg"},{"p":"资料_界面预览/界面预览_2026-11-01_堆叠态-展开.png","n":"界面预览_2026-11-01_堆叠态-展开.png","d":"","sz":402029,"u":"a/550387b4c93448e7.jpg"},{"p":"资料_界面预览/界面预览_2026-11-01_堆叠态-桌面.png","n":"界面预览_2026-11-01_堆叠态-桌面.png","d":"","sz":416996,"u":"a/128227fc242628b7.jpg"},{"p":"资料_界面预览/界面预览_2026-11-01_展开态-暗色.png","n":"界面预览_2026-11-01_展开态-暗色.png","d":"","sz":359657,"u":"a/11f493e54c20ae75.jpg"},{"p":"资料_界面预览/界面预览_2026-11-01_展开态-桌面.png","n":"界面预览_2026-11-01_展开态-桌面.png","d":"","sz":423798,"u":"a/fab421918e711818.jpg"},{"p":"资料_界面预览/界面预览_2026-11-01_展开态-移动端.png","n":"界面预览_2026-11-01_展开态-移动端.png","d":"","sz":206405,"u":"a/6161f1a1749b3f3b.jpg"}]},{"dir":"资料_班级站后台备份","ver":"","date":"","title":"班级站后台备份","theme":true,"count":20,"files":[{"p":"资料_班级站后台备份/班级站后台备份_2026-10-05_README-发布说明.txt","n":"班级站后台备份_2026-10-05_README-发布说明.txt","d":"","sz":6205,"t":"================================================================\nGitHub Pages 自动发布配置说明（给站主看的备忘）\n================================================================\n\n【做什么】\n  每次 master 分支有新提交，这个 workflow 会自动把「上线需要的文件」\n  复制到 gh-pages 分支，GitHub Pages 从 gh-pages 出页面。\n\n  master（源仓库，全量） → 自动清洗 → gh-pages（线上，只放该公开的）\n\n【为什么要这样】\n  之前 Pages 直接从 master 根目录出页面，导致仓库里所有文件都会被托管 ——\n  包括 internal/（内部维护文档）、backup/（77 个历史版本 HTML）、api/（后端源码）。\n  加了这一步之后，master 里照样什么都有，但线上只剩该公开的那几个文件。\n\n【和你原定铁律的关系】\n  internal/notes.md 里写的「铁律 · 内部文档隐藏」要求「线上发布包一律排除 internal/」。\n  本 workflow 就是把这条铁律真正实现出来。\n\n【站主需要做什么（只需一次）】\n  1. 让 GitHub 上出现 gh-pages 分支（workflow 第一次跑完就有了）\n  2. 去仓库 Settings → Pages，把 Source 从\n       \"Deploy from a branch: master / (root)\"\n     改成\n       \"Deploy from a branch: gh-pages / (root)\"\n  3. 之后就不用管了，全自动\n\n【发布内容】\n  会发布：index.html、admin.html、sw.js、manifest.webmanifest、favicon.svg、\n          icon-192.png、icon-512.png、qrcode.jpg、games/、homework/\n  不发布：api/、internal/、backup/、source/、*.zip、.github/、\n          以及各种配置文件（.gitignore、package.json 等）\n\n【注意】\n  · 前端要调后端时，靠 index.html 里的 API_BASE_DEFAULT 指向 Vercel 地址，\n    不依赖 api/ 目录，所以排除 api/ 不影响功能。\n  · 若以后新增了站点要用的文件（比如新图片文件夹），记得在下面\n    SOURCE_FILES 那一行里补上，否则不会被发布。\n\n================================================================\n【故障排查】线上显示的是几个月前的旧版页面\n================================================================\n\n  症状：改了代码、提交了、Actions 也显示 success，但打开网址看到的\n        还是很久以前的存档页。\n\n  排查顺序：\n\n  1. 先看 workflow 最后一步「回查 gh-pages 是否真的更新了」。\n     这一步是专门为这个故障加的：\n       · 如果它变红，日志会直接告诉你 gh-pages 没更新 → 走第 2 条\n       · 如果它变绿，说明推送没问题，问题在 Pages 的构建源 → 走第 3 条\n\n  2. 检查 Actions 的写权限（最常见原因）\n     Settings → Actions → General → Workflow permissions\n     必须选 \"Read and write permissions\"，然后 Save。\n     如果这里是只读，GITHUB_TOKEN 没有写权限，推送会被静默丢弃，\n     但 peaceiris/actions-gh-pages 有可能仍然报告 success。\n\n     改完之后去 Actions 页面点一次 \"Run workflow\" 手动重跑。\n\n  3. 检查 Pages 的构建源\n     Settings → Pages → Build and deployment\n       Source 必须是 \"Deploy from a branch\"\n       Branch 必须是 gh-pages + / (root)\n     如果不是，Pages 就会一直拿一份旧的静态快照出页面。\n\n  4. 确认 gh-pages 分支的真实状态\n     打开仓库的 gh-pages 分支，看它的最后提交时间。\n     正常情况下，每次 master 推送后它都会立刻多一次提交，\n     提交信息形如「自动发布：<你的提交信息>」。\n\n================================================================\n【2026-10-05 二次踩坑全记录】gh-pages 卡死 41 天没更新\n================================================================\n\n  【症状】\n    gh-pages 的 head 从 2026-08-25 起就再没动过（一直停在 e3bab998），\n    但 master 每天都有新提交，Actions 每次都是绿色的 success。\n\n  【根因：上一版回查是「假阳性」】\n    上一版回查只做了这一步：\n        REMOTE_SIZE=$(git show FETCH_HEAD:index.html | wc -c)\n        [ \"$REMOTE_SIZE\" != \"$LOCAL_SIZE\" ] && exit 1\n    也就是「只比字节数」。\n\n    问题在于：它没比 commit SHA，也没比内容哈希。\n    只要远端那份 index.html 的字节数碰巧和本地相等，就会判定通过 ——\n    而实际上 gh-pages 根本停在一个完全不同的旧提交上。\n\n    更要命的是 `git fetch --depth=1 origin gh-pages` 把结果写进 FETCH_HEAD，\n    在浅克隆 + 已有 FETCH_HEAD 残留的情况下，可能读到的是**上一次**取回的\n    对象，于是「拿旧数据去验证旧数据」，必然相等。\n\n  【这一版的修复（deploy-pages.yml 里已实现）】\n    1. 推送前先记下 gh-pages 的 head SHA\n    2. 推送后再读一次，**指针没变就直接判失败**（识别静默丢弃）\n    3. 用 `sha256sum` 逐字节比对 index.html / admin.html（不再比大小）\n    4. 校验二：远端必须真的存在这些文件（git cat-file -e）\n    5. 回查失败 → 自动触发备用通道：在 _site 里 git init + 强推 gh-pages\n    6. 备用通道推完再回查一次\n\n  【实测结果（这次就是靠它救回来的）】\n    · 主通道 peaceiris/actions-gh-pages 依然静默失败 → job 变红\n    · 但回查**正确地抓到了**（以前会误报成功）\n    · 备用通道 git 强推成功，gh-pages 立刻更新到 47e6b295\n    · 线上 admin.html 恢复为 170793 字节，内容与本地逐字节一致\n\n  【结论】\n    现在这条链路是「自愈」的：peaceiris 就算继续失灵，备用通道也会把\n    内容推上去。看到 job 红色不必惊慌，先看最后一步是不是\n    「备用通道回查通过」—— 是的话线上就是好的。\n\n  【顺带记录：Gitee → GitHub 镜像有约 2 分钟延迟】\n    本次排查时一度误判为「GitHub 落后于 Gitee」，其实是查得太早。\n    推完 Gitee 后大约等 2 分钟，GitHub 才会同步到。\n    验证方法：对比两边 .github/workflows/deploy-pages.yml 的 size。\n\n================================================================\n"},{"p":"资料_班级站后台备份/班级站后台备份_2026-10-05_admin.html","n":"班级站后台备份_2026-10-05_admin.html","d":"","sz":178092,"t":"<!DOCTYPE html>\n<html lang=\"zh-CN\" data-theme=\"\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<meta name=\"robots\" content=\"noindex,nofollow\">\n<title>管理后台 · 25级05班班级服务站<\/title>\n<link rel=\"icon\" href=\"favicon.svg\">\n<style>\n/* ============================================================\n * 25级05班班级服务站 · 管理后台\n * ------------------------------------------------------------\n * 【设计 token】全部沿用主站 index.html 的「暖阳橙双轨配色」：\n *     --grad-*  鲜艳渐变 → 只做装饰（图标底、光晕、顶部条）\n *     --btn-*   深色版   → 承载白字（鲜艳橙配白字对比度不达标）\n *     --accent-ink 强调文字\n *   换主题只需改本区块，其余样式不用动。\n *\n * 【布局参照】VoiceHub 后台：\n *     固定侧栏 w-256 + 毛玻璃顶栏 h-64 + 内容区滚动\n *     SP版侧栏移出屏幕，汉堡按钮 + 遮罩唤出\n *   但配色、圆角、阴影全部走本班站的暖调语言，不套用它的黑白。\n * ============================================================ */\n\n/* ---------------- 设计 token（与主站 index.html 一致） ---------------- */\n:root{\n  /* 签名渐变（装饰用，不放白字） */\n  --grad-a:#f97316; --grad-b:#fb923c;\n  /* 按钮/承载白字的深色版（白字实测 9.37:1 / 7.31:1） */\n  --btn-a:#7c2d12; --btn-b:#9a3412;\n  /* 强调文字（四种底色实测全部 ≥4.5:1） */\n  --accent-ink:#af410f;\n  /* 暖调中性底 */\n  --bg-1:#fffbf7; --bg-2:#fff7f0; --bg-3:#fdede0;\n  --tint:#fff1e7; --tint-2:#fee2d5;\n  /* 文本 */\n  --fg:#292524; --fg-2:#57534e; --fg-3:#6e635a; --fg-muted:#6e635a;\n  /* 阴影：分层，带色调而非纯黑 */\n  --sh-sm:0 1px 3px rgba(120,53,15,.06);\n  --sh-md:0 4px 6px rgba(120,53,15,.07);\n  --sh-lg:0 10px 15px rgba(120,53,15,.08);\n  --sh-xl:0 20px 25px rgba(120,53,15,.10);\n  --sh-accent:0 4px 14px rgba(194,65,12,.25);\n  --sh-accent-lg:0 8px 24px rgba(194,65,12,.35);\n  /* 语义色 */\n  --ok:#0a7d42; --ok-bg:#e6f9f0;\n  --warn:#b45309; --warn-bg:#ffedd5;\n  --danger:#c0392b; --danger-bg:#fdeaea;\n  --info:#1d4ed8; --info-bg:#e8effd;\n  /* 面板/边框 */\n  --panel:#ffffff;\n  --border:rgba(120,53,15,.09);\n  --border-2:rgba(120,53,15,.16);\n  /* 侧栏宽 + 顶栏高 */\n  --side-w:256px; --head-h:64px;\n  /* 动效 */\n  --ease-out:cubic-bezier(.16,1,.3,1);\n  --t-fast:.15s; --t-base:.2s; --t-slow:.3s;\n  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:22px;\n}\n/* 暗色模式：近黑中性底（亮暗两套都保持暖调倾向） */\nhtml[data-theme=\"dark\"]{\n  --grad-a:#fb923c; --grad-b:#fdba74;\n  --btn-a:#7c2d12; --btn-b:#9a3412;\n  --accent-ink:#fb923c;\n  --bg-1:#1c1a18; --bg-2:#1f1d1e; --bg-3:#252324;\n  --tint:rgba(251,146,60,.12); --tint-2:rgba(251,146,60,.2);\n  --fg:#f5f5f4; --fg-2:#d6d3d1; --fg-3:#a8a29e; --fg-muted:#a8a29e;\n  --panel:#232120;\n  --border:rgba(251,146,60,.14);\n  --border-2:rgba(251,146,60,.24);\n  --ok:#4ade80; --ok-bg:rgba(74,222,128,.14);\n  --warn:#fbbf24; --warn-bg:rgba(251,191,36,.14);\n  --danger:#f87171; --danger-bg:rgba(248,113,113,.14);\n  --info:#93b4fd; --info-bg:rgba(147,180,253,.14);\n  --sh-sm:0 1px 3px rgba(0,0,0,.3);\n  --sh-md:0 4px 6px rgba(0,0,0,.35);\n  --sh-lg:0 10px 15px rgba(0,0,0,.4);\n  --sh-xl:0 20px 25px rgba(0,0,0,.45);\n  --sh-accent:0 4px 14px rgba(251,146,60,.28);\n}\n\n*{box-sizing:border-box}\nhtml,body{height:100%}\nbody{\n  margin:0;color:var(--fg);font-size:15px;line-height:1.6;\n  font-family:-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Microsoft YaHei\",\"Segoe UI\",Roboto,sans-serif;\n  background:linear-gradient(135deg,var(--bg-1) 0%,var(--bg-2) 50%,var(--bg-3) 100%);\n  -webkit-font-smoothing:antialiased;\n}\n/* 顶部径向辉光（沿用主站的氛围做法） */\nbody::before{\n  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;\n  background:radial-gradient(80% 50% at 50% -12%,rgba(249,115,22,.10),rgba(255,255,255,0) 70%);\n}\na{color:var(--accent-ink);text-decoration:none}\nbutton{font-family:inherit}\ninput,select,textarea{font-family:inherit;font-size:inherit}\n::-webkit-scrollbar{width:8px;height:8px}\n::-webkit-scrollbar-track{background:transparent}\n::-webkit-scrollbar-thumb{background:rgba(120,53,15,.18);border-radius:8px}\n::-webkit-scrollbar-thumb:hover{background:rgba(120,53,15,.3)}\n\n/* ============================================================\n * ① 登录门（未登录时全屏拦截）\n * ============================================================ */\n#gate{\n  position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;\n  padding:20px;background:linear-gradient(135deg,var(--bg-1),var(--bg-3));\n}\n#gate.hide{display:none}\n.gate-card{\n  width:100%;max-width:400px;background:var(--panel);border-radius:var(--radius-xl);\n  padding:36px 30px;box-shadow:var(--sh-xl);border:1px solid var(--border);\n  border-top:4px solid var(--grad-a);position:relative;z-index:1;\n  animation:rise-in .5s var(--ease-out) both;\n}\n.gate-logo{display:flex;align-items:center;gap:12px;margin-bottom:24px}\n.gate-logo .mark{\n  width:48px;height:48px;border-radius:14px;flex:0 0 48px;\n  background:linear-gradient(135deg,var(--grad-a),var(--grad-b));\n  box-shadow:var(--sh-accent);color:#fff;font-size:1.3rem;font-weight:800;\n  display:flex;align-items:center;justify-content:center;\n}\n.gate-logo h1{font-size:1.15rem;margin:0;color:var(--accent-ink);letter-spacing:-.01em}\n.gate-logo p{margin:2px 0 0;font-size:.75rem;color:var(--fg-3);letter-spacing:.08em;text-transform:uppercase;font-weight:700}\n.field{margin-bottom:14px}\n.field label{display:block;font-size:.8rem;font-weight:700;color:var(--fg-2);margin-bottom:6px}\n.field input,.field select,.field textarea{\n  width:100%;height:46px;padding:0 14px;border:1px solid var(--border-2);border-radius:var(--radius-md);\n  background:var(--bg-1);color:var(--fg);outline:none;transition:border-color var(--t-base),box-shadow var(--t-base);\n}\n.field textarea{height:auto;padding:12px 14px;resize:vertical;line-height:1.6}\n.field input:focus,.field select:focus,.field textarea:focus{\n  border-color:var(--btn-b);box-shadow:0 0 0 3px var(--tint);\n}\n.field .hint{font-size:.72rem;color:var(--fg-3);margin-top:5px}\n/* 独立输入框（不放在 .field 直接子级时用，如联系方式三宫格） */\n.inp{\n  width:100%;height:42px;padding:0 13px;border:1px solid var(--border-2);\n  border-radius:var(--radius-md);background:var(--panel);color:var(--fg);\n  outline:none;transition:all var(--t-base);\n}\n.inp:focus{border-color:var(--btn-b);box-shadow:0 0 0 3px var(--tint)}\n.btn{\n  display:inline-flex;align-items:center;justify-content:center;gap:7px;\n  background:linear-gradient(135deg,var(--btn-a),var(--btn-b));color:#fff;\n  padding:0 20px;height:42px;border-radius:var(--radius-md);font-size:.9rem;font-weight:600;\n  border:none;cursor:pointer;white-space:nowrap;\n  transition:transform var(--t-base) var(--ease-out),box-shadow var(--t-base) var(--ease-out),filter var(--t-base);\n  box-shadow:var(--sh-sm);\n}\n.btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:var(--sh-accent);filter:brightness(1.08)}\n.btn:active{transform:translateY(0) scale(.98)}\n.btn:disabled{opacity:.55;cursor:not-allowed;transform:none!important;box-shadow:var(--sh-sm)!important;filter:none!important}\n.btn-block{width:100%;height:48px;font-size:.95rem}\n.btn-sm{height:34px;padding:0 13px;font-size:.8rem;border-radius:var(--radius-sm)}\n.btn-secondary{background:var(--tint);color:var(--accent-ink);box-shadow:none;border:1px solid var(--border-2)}\n.btn-secondary:hover{background:var(--tint-2);box-shadow:var(--sh-sm)}\n.btn-ghost{background:transparent;color:var(--fg-2);box-shadow:none;border:1px solid var(--border-2)}\n.btn-ghost:hover{background:var(--tint);color:var(--accent-ink);box-shadow:none}\n.btn-danger{background:linear-gradient(135deg,#9b2c1f,#c0392b)}\n.btn-danger:hover{box-shadow:0 4px 14px rgba(192,57,43,.3)}\n.btn-ok{background:linear-gradient(135deg,#0a7d42,#12995a)}\n.btn-ok:hover{box-shadow:0 4px 14px rgba(10,125,66,.28)}\n.msg{margin-top:14px;padding:11px 14px;border-radius:var(--radius-md);font-size:.83rem;display:none;line-height:1.55;white-space:pre-line}\n.msg.show{display:block}\n.msg.err{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(192,57,43,.2)}\n.msg.ok{background:var(--ok-bg);color:var(--ok);border:1px solid rgba(10,125,66,.2)}\n.msg.warn{background:var(--warn-bg);color:var(--warn);border:1px solid rgba(180,83,9,.2)}\n\n@keyframes rise-in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}\n@keyframes fade-in{from{opacity:0}to{opacity:1}}\n\n/* ============================================================\n * ② 应用骨架：固定侧栏 + 顶栏 + 内容区\n * ============================================================ */\n#app{display:none}\n#app.show{display:block}\n.side{\n  position:fixed;top:0;left:0;bottom:0;width:var(--side-w);z-index:60;\n  background:var(--panel);border-right:1px solid var(--border);\n  display:flex;flex-direction:column;padding:18px 14px;\n  transition:transform var(--t-slow) var(--ease-out);\n  box-shadow:2px 0 16px rgba(120,53,15,.04);\n}\n.side-brand{display:flex;align-items:center;gap:11px;padding:6px 10px 0;margin-bottom:22px}\n.side-brand .mark{\n  width:38px;height:38px;border-radius:12px;flex:0 0 38px;\n  background:linear-gradient(135deg,var(--grad-a),var(--grad-b));\n  box-shadow:var(--sh-accent);color:#fff;font-size:1rem;font-weight:800;\n  display:flex;align-items:center;justify-content:center;transition:transform var(--t-slow) var(--ease-out);\n}\n.side-brand:hover .mark{transform:scale(1.1) rotate(-4deg)}\n.side-brand h1{margin:0;font-size:1rem;font-weight:800;color:var(--fg);letter-spacing:-.01em;line-height:1.1}\n.side-brand p{margin:3px 0 0;font-size:.62rem;color:var(--fg-3);letter-spacing:.14em;text-transform:uppercase;font-weight:800}\n\n.side-nav{flex:1;overflow-y:auto;padding-right:4px;margin:0 -4px}\n.nav-group{margin-bottom:18px}\n.nav-group>h3{\n  margin:0 0 7px;padding:0 10px;font-size:.63rem;font-weight:800;\n  color:var(--fg-3);letter-spacing:.16em;text-transform:uppercase;\n}\n.nav-item{\n  width:100%;display:flex;align-items:center;gap:10px;padding:9px 11px;\n  border-radius:var(--radius-md);font-size:.85rem;font-weight:600;\n  color:var(--fg-2);background:none;border:1px solid transparent;cursor:pointer;\n  transition:all var(--t-base) var(--ease-out);text-align:left;margin-bottom:2px;\n}\n.nav-item .ico{flex:0 0 17px;width:17px;height:17px;display:flex;align-items:center;justify-content:center;opacity:.75}\n.nav-item .ico svg{width:17px;height:17px;display:block}\n.nav-item span{flex:1;truncate:ellipsis;overflow:hidden;text-overflow:ellipsis}\n.nav-item:hover{background:var(--tint);color:var(--accent-ink)}\n.nav-item.on{background:var(--tint);color:var(--accent-ink);border-color:var(--border-2);font-weight:700}\n.nav-item.on .ico{opacity:1}\n.nav-item.on .dot{width:5px;height:5px;border-radius:50%;background:var(--grad-a);box-shadow:0 0 8px var(--grad-a);flex:0 0 5px}\n\n.side-user{\n  margin-top:14px;padding-top:14px;border-top:1px solid var(--border);\n}\n.side-user .row{\n  display:flex;align-items:center;gap:11px;padding:10px;border-radius:var(--radius-md);\n  background:var(--bg-2);border:1px solid var(--border);\n}\n.side-user .av{\n  width:38px;height:38px;border-radius:11px;flex:0 0 38px;\n  background:linear-gradient(135deg,var(--grad-a),var(--grad-b));\n  color:#fff;font-weight:800;font-size:1rem;\n  display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-accent);\n}\n.side-user .who{flex:1;min-width:0}\n.side-user .who b{display:block;font-size:.82rem;font-weight:800;color:var(--fg);truncate;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.side-user .who i{display:block;font-size:.63rem;color:var(--fg-3);letter-spacing:.1em;text-transform:uppercase;font-weight:700;font-style:normal;margin-top:2px}\n.icon-btn{\n  display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex:0 0 32px;\n  border-radius:var(--radius-sm);border:none;background:transparent;color:var(--fg-3);cursor:pointer;\n  transition:all var(--t-base);\n}\n.icon-btn:hover{background:var(--danger-bg);color:var(--danger)}\n.icon-btn svg{width:16px;height:16px}\n\n.head{\n  position:sticky;top:0;z-index:50;height:var(--head-h);\n  display:flex;align-items:center;justify-content:space-between;gap:14px;\n  padding:0 26px;border-bottom:1px solid var(--border);\n  background:color-mix(in srgb,var(--bg-1) 78%,transparent);\n  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);\n}\n.head h2{margin:0;font-size:1.2rem;font-weight:800;letter-spacing:-.01em}\n.head .head-actions{display:flex;align-","tt":1},{"p":"资料_班级站后台备份/班级站后台备份_2026-10-05_deploy-pages.yml","n":"班级站后台备份_2026-10-05_deploy-pages.yml","d":"","sz":5087,"t":"# ============================================================\n# 站点发布：把白名单文件发布到 GitHub Pages\n# ------------------------------------------------------------\n# 2026-10-05 重写。\n#\n# 【为什么重写】\n# 旧版用 peaceiris/actions-gh-pages 往 gh-pages 分支推，再回查、\n# 失败时走「git 强推」备用通道、再回查一次，一共 286 行、6 个步骤。\n# 结果：推送步骤报告 success，回查却说不一致，备用通道又报成功，\n# 但 gh-pages 分支实际停在 2026-08-25 从未更新。\n#\n# 根因是 GITHUB_TOKEN 没有写权限时，push 会被静默丢弃，\n# 脚本却察觉不到 —— 越多的「自愈」步骤，只会产出越多的误导性绿灯。\n#\n# 【现在的做法】\n# 改用 GitHub 官方推荐的 Pages 部署链路：\n#   1. 把要上线的文件收集到 _site/\n#   2. upload-pages-artifact 打包成 artifact（不推送任何分支）\n#   3. deploy-pages 直接发布到 Pages\n#\n# 好处：全程不写分支，不需要 contents: write，\n#       也就不存在「没权限导致静默失败」这类问题。\n#\n# 【以后要加文件上线】\n# 改下面的 SOURCE_FILES 数组即可，别再改别处。\n# ============================================================\n\nname: 发布站点到 GitHub Pages\n\non:\n  push:\n    branches: [master]\n  # 允许在 Actions 页面手动点一下重新发布（应急用）\n  workflow_dispatch:\n\n# 发布 Pages 需要的权限：读代码 + 写 Pages + 用 OIDC 换取部署凭据\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\n# 同一时间只跑一个发布，避免两个部署互相覆盖\nconcurrency:\n  group: pages-deploy\n  cancel-in-progress: true\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - name: 拉取仓库内容\n        uses: actions/checkout@v4\n\n      # ------------------------------------------------------------\n      # 这步决定「哪些东西会上线」。\n      #\n      # 只列站点运行必需的文件与目录，其余（api/ internal/ backup/\n      # source/ 等）一律不复制，从而不会出现在线上。\n      # 用数组而不是空格分隔的字符串，避免不同 shell 对词分割的处理差异。\n      # ------------------------------------------------------------\n      - name: 收集上线文件\n        shell: bash\n        run: |\n          set -euo pipefail\n          mkdir -p _site\n\n          SOURCE_FILES=(\n            index.html\n            admin.html\n            sw.js\n            manifest.webmanifest\n            favicon.svg\n            icon-192.png\n            icon-512.png\n            qrcode.jpg\n            games\n            homework\n          )\n\n          for f in \"${SOURCE_FILES[@]}\"; do\n            if [ -e \"$f\" ]; then\n              cp -r \"$f\" _site/\n              echo \"  ✅ $f\"\n            else\n              echo \"  ⚠️  跳过（不存在）：$f\"\n            fi\n          done\n\n          # Jekyll 会吃掉下划线开头的文件/目录，必须关掉\n          touch _site/.nojekyll\n\n          # 防呆：内部目录绝不能出现在线上\n          for bad in api internal backup source node_modules .git; do\n            if [ -e \"_site/$bad\" ]; then\n              echo \"❌ 内部内容混入上线目录：$bad\"\n              exit 1\n            fi\n          done\n\n          echo \"\"\n          echo \"即将上线的文件：\"\n          ls -la _site/\n\n      - name: 配置 Pages\n        uses: actions/configure-pages@v5\n\n      - name: 打包为 Pages artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: _site\n\n  deploy:\n    needs: build\n    runs-on: ubuntu-latest\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    steps:\n      - name: 发布到 GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n\n      # 发布完立刻回查线上真实内容，避免再次出现「job 绿了但线上没变」\n      - name: 回查线上是否真的更新\n        shell: bash\n        run: |\n          set -euo pipefail\n          URL=\"https://yuzikaaang.github.io/class-site/admin.html\"\n          echo \"等待 Pages 生效（最多重试 12 次，每次 10 秒）…\"\n\n          for i in $(seq 1 12); do\n            CODE=$(curl -s -o /tmp/live_admin.html -w '%{http_code}' \"$URL\" || echo 000)\n            if [ \"$CODE\" = \"200\" ]; then\n              LIVE_SIZE=$(wc -c < /tmp/live_admin.html)\n              echo \"  第 $i 次：HTTP $CODE，线上 $LIVE_SIZE 字节\"\n              if grep -q \"renderProfiles\" /tmp/live_admin.html; then\n                echo \"\"\n                echo \"✅ 回查通过：线上 admin.html 已包含本次发布的内容\"\n                exit 0\n              fi\n            else\n              echo \"  第 $i 次：HTTP $CODE（还没生效）\"\n            fi\n            sleep 10\n          done\n\n          echo \"\"\n          echo \"❌ 回查失败：等了 120 秒，线上仍未出现新内容。\"\n          echo \"   请到 https://github.com/yuzikaaang/class-site/deployments 查看部署状态。\"\n          exit 1\n"},{"p":"资料_班级站后台备份/班级站后台备份_2026-10-05_index.html","n":"班级站后台备份_2026-10-05_index.html","d":"","sz":533345,"t":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1.0\">\n<title>25级05班班级服务站<\/title>\n<!-- 字体：Inter（拉丁/数字）+ JetBrains Mono（标签徽章），走 Google Fonts 国内镜像。\n     ⚠️ 为什么不用 fonts.googleapis.com：国内（尤其校园网）基本访问不到，会白等几秒。\n        这里用 fonts.googleapis.cn / fonts.gstatic.cn 镜像，实测字体文件可下载（约 10KB 子集）。\n     ⚠️ 中文字体不走 CDN：思源黑体等动辄数 MB，会严重拖慢首屏；中文仍用系统字体\n        （PingFang / 鸿蒙 / 微软雅黑），这些字体在手机电脑上本就存在，零加载成本。\n     ⚠️ 兜底：font-display:swap + 系统字体栈，CDN 挂了也只影响英文数字的字形，\n        中文显示与页面功能完全不受影响。 -->\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.cn\" crossorigin>\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.cn\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.cn/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap\">\n<link rel=\"manifest\" href=\"./manifest.webmanifest\">\n<link rel=\"apple-touch-icon\" href=\"./icon-512.png\">\n<meta name=\"theme-color\" content=\"#141210\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<style>\n/* 字体栈：Inter（拉丁/数字，CDN 加载）→ 中文系统字体（零加载成本）→ 兜底。\n   ⚠️ 顺序不能颠倒：Inter 只含拉丁字形，放第一位时中文会自动落到后面的中文字体，\n      这正是「英文用 Inter、中文用系统字体」的预期效果。 */\n*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Inter','PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif}\n:root{--fg:#292524;--fg-2:#57534e;--fg-3:#6e635a;--fg-muted:#6e635a}\n.dark{--fg:#f5f5f4;--fg-2:#d6d3d1;--fg-3:#a8a29e;--fg-muted:#a8a29e}\n/* ============================================================\n * 【设计 token 体系】2026-09-27 立\n * 参照两个站点的做法重构，但色值全部按 WCAG AA 实测重算：\n * 色相：站主拍板「改回橙色」（2026-09-27）—— 主题色为暖阳橙，配暖调中性底。\n *   · newsnow.czl.net —— 顶部径向渐变光晕、中性灰阶、快速微交互\n *   · beautiful_web_template「Tech Style」—— 签名渐变、反相区块、\n *     点阵纹理、浮动/脉动/入场动画\n *\n * ⚠️ 双轨配色（重要）：参考模板的渐变终点 #4D7CFF 白字只有 3.72:1，不达标。\n *    中等明度的饱和色天生托不住白字。所以这里拆成两套：\n *      --grad-*  鲜艳渐变 → 只用于装饰（图标底、光晕、顶部条、渐变文字），不承载白字\n *      --btn-*   同色系深色版 → 用于按钮底等需要放白字的位置，全部 ≥4.5:1\n *    换配色只需改本区块的变量，其余样式不用动。\n * ============================================================ */\n:root{\n  /* —— 签名渐变（装饰用，不放白字）—— */\n  --grad-a:#f97316; --grad-b:#fb923c;\n  /* —— 按钮/承载白字的深色版（实测白字 9.37:1 / 7.31:1）—— */\n  --btn-a:#7c2d12; --btn-b:#9a3412;\n  /* —— 强调文字 —— 实测：落白 5.86 / 落 tint 5.30 / 落 tint-2 4.76 / 落 bg-3 5.12，全达标。\n     注：此处没沿用初版橙的 #C2410C——它落 tint-2 只有 4.21:1，不达标；\n     #AF410F 饱和度更高（84% vs 66%），更贴「暖阳橙」，且四种底全部达标。 —— */\n  --accent-ink:#af410f;\n  /* —— 暖调中性底 —— */\n  --bg-1:#fffbf7; --bg-2:#fff7f0; --bg-3:#fdede0;\n  --tint:#fff1e7;        /* 淡色填充（标签/徽章底） */\n  --tint-2:#fee2d5;      /* 稍深的淡色填充 */\n  /* —— 阴影：分层，带色调而非纯黑 —— */\n  --sh-sm:0 1px 3px rgba(120,53,15,.06);\n  --sh-md:0 4px 6px rgba(120,53,15,.07);\n  --sh-lg:0 10px 15px rgba(120,53,15,.08);\n  --sh-xl:0 20px 25px rgba(120,53,15,.10);\n  --sh-accent:0 4px 14px rgba(194,65,12,.25);\n  --sh-accent-lg:0 8px 24px rgba(194,65,12,.35);\n  /* —— 动效曲线与时长（统一节奏）—— */\n  --ease-out:cubic-bezier(.16,1,.3,1);\n  --t-fast:.15s; --t-base:.2s; --t-slow:.3s; --t-enter:.7s;\n}\n/* 暗色模式：newsnow 风格——近黑底 + 顶部径向光晕 + 中性灰阶\n   注：暗色底保持中性近黑不动——亮度极低时暖/冷倾向肉眼不可辨，改它只会徒增风险 */\n.dark{\n  --grad-a:#fb923c; --grad-b:#fdba74;\n  --btn-a:#7c2d12; --btn-b:#9a3412;\n  --accent-ink:#fb923c;\n  --bg-1:#1c1a18; --bg-2:#1f1d1e; --bg-3:#252324;\n  --tint:rgba(251,146,60,.12); --tint-2:rgba(251,146,60,.2);\n  --sh-sm:0 1px 3px rgba(0,0,0,.3);\n  --sh-md:0 4px 6px rgba(0,0,0,.35);\n  --sh-lg:0 10px 15px rgba(0,0,0,.4);\n  --sh-xl:0 20px 25px rgba(0,0,0,.45);\n  --sh-accent:0 4px 14px rgba(251,146,60,.28);\n  --sh-accent-lg:0 8px 24px rgba(251,146,60,.38);\n}\n\nbody{background:linear-gradient(135deg,var(--bg-1) 0%,var(--bg-2) 50%,var(--bg-3) 100%);min-height:100vh;color:var(--fg);margin:0;position:relative;overflow-x:hidden}\n/* —— 顶部径向辉光（newsnow 做法）+ 两处角落光斑 ——\n   辉光用 filter:blur 模拟参考里的 blur-[150px]，不透明度压在 3~6%，\n   只在角落制造\"氛围温暖\"，不干扰文字可读性。 */\nbody::before,body::after{content:'';position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0}\nbody::before{width:340px;height:340px;background:rgba(249,115,22,.16);top:-110px;left:-90px}\nbody::after{width:420px;height:420px;background:rgba(251,146,60,.14);bottom:-150px;right:-100px}\n/* 顶部大面积径向渐变（参照 newsnow 的 radial-gradient at 50% -30%） */\nbody::after{box-shadow:none}\n.top-glow{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;\n  background:radial-gradient(80% 50% at 50% -12%, rgba(249,115,22,.13), rgba(255,255,255,0) 70%)}\n\n/* ============================================================\n * 动画体系（参照 Tech Style 规格，全套）\n * ============================================================ */\n\n/* ① 入场：淡入上浮 28px / 0.7s / ease-out —— 元素进入视口时触发 */\n@keyframes rise-in{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}\n.rise-in{animation:rise-in var(--t-enter) var(--ease-out) both}\n/* 错峰：给列表/网格的子元素依次延迟，营造\"依次浮现\"的节奏 */\n.stagger>*{animation:rise-in var(--t-enter) var(--ease-out) both}\n.stagger>*:nth-child(1){animation-delay:.02s}\n.stagger>*:nth-child(2){animation-delay:.08s}\n.stagger>*:nth-child(3){animation-delay:.14s}\n.stagger>*:nth-child(4){animation-delay:.20s}\n.stagger>*:nth-child(5){animation-delay:.26s}\n.stagger>*:nth-child(6){animation-delay:.32s}\n.stagger>*:nth-child(n+7){animation-delay:.38s}\n\n/* ② 浮动：4~5s ease-in-out 上下起伏 ±10px（Hero 装饰卡片） */\n@keyframes float-y{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}\n@keyframes float-y-slow{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}\n.float-y{animation:float-y 4.5s ease-in-out infinite}\n.float-y-slow{animation:float-y-slow 5.5s ease-in-out infinite}\n\n/* ③ 脉动圆点：2s scale[1,1.3,1] + opacity[1,.7,1]（\"实时/新\"指示） */\n@keyframes dot-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.7}}\n.dot-pulse{animation:dot-pulse 2s ease-in-out infinite}\n\n/* ④ 旋转装饰环：60s linear 无限（冰川速度，几乎察觉不到但在动） */\n@keyframes ring-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}\n.ring-spin{animation:ring-spin 60s linear infinite}\n\n/* ⑤ 悬停抬起：卡片/按钮 -translate-y + 阴影加深 */\n.hover-lift{transition:transform var(--t-slow) var(--ease-out),box-shadow var(--t-slow) var(--ease-out)}\n.hover-lift:hover{transform:translateY(-4px);box-shadow:var(--sh-xl)}\n.hover-lift:active{transform:translateY(-1px) scale(.985)}\n\n/* ⑥ 点阵纹理（参照：深色区块上 3% 不透明度的 radial-gradient 点阵）\n      用于反相区块，避免大面积纯色显得扁平 */\n.dot-grid{position:relative}\n.dot-grid::before{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;\n  background-image:radial-gradient(currentColor 1px, transparent 1px);\n  background-size:32px 32px;opacity:.035}\n\n/* ⑦ 区块标签徽章（参照 Section Label 模式：圆点 + 等宽大写文字） */\n.sec-badge{display:inline-flex;align-items:center;gap:7px;padding:5px 13px;border-radius:999px;\n  background:var(--tint);border:1px solid rgba(194,65,12,.22);\n  font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.66rem;\n  text-transform:uppercase;letter-spacing:.15em;color:var(--accent-ink);font-weight:500}\n.sec-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--grad-a);flex:none}\n\n/* ⑧ 渐变文字（参照 gradient-text：bg-clip-text） */\n.grad-text{background:linear-gradient(135deg,var(--grad-a),var(--grad-b));\n  -webkit-background-clip:text;background-clip:text;color:transparent}\n\n/* ⚠️ 无障碍：系统开启\"减少动态效果\"时，关掉所有持续动画，只保留必要状态变化 */\n@media (prefers-reduced-motion:reduce){\n  .float-y,.float-y-slow,.dot-pulse,.ring-spin{animation:none!important}\n  .rise-in,.stagger>*{animation-duration:.01ms!important}\n  .hover-lift:hover{transform:none}\n}\n.layout{display:flex;gap:20px;max-width:1200px;margin:0 auto;padding:20px 16px;position:relative;z-index:1}\n.sidebar{flex:0 0 220px;position:sticky;top:16px;height:calc(100vh - 32px);background:rgba(255,253,251,.82);backdrop-filter:blur(12px);border:1px solid rgba(120,53,15,.055);border-radius:20px;padding:16px;box-shadow:0 1px 2px rgba(120,53,15,.05),0 8px 24px rgba(120,53,15,.07);display:flex;flex-direction:column;overflow-y:auto;transition:background var(--t-base) var(--ease-out),box-shadow var(--t-base) var(--ease-out)}\n.side-tip{background:var(--tint);color:#af410f;font-size:.75rem;line-height:1.7;padding:10px 12px;border-radius:12px;margin-bottom:12px}\n.side-btn{display:block;width:100%;text-align:left;background:#f6f1ec;color:#af410f;border:none;border-radius:12px;transition:background var(--t-base) var(--ease-out),transform var(--t-base) var(--ease-out);padding:11px 14px;font-size:.9rem;font-weight:600;cursor:pointer;margin-bottom:8px;transition:.2s}\n.side-btn:hover{background:#ede3d9}\n.side-btn.active{background:linear-gradient(135deg,var(--btn-a),var(--btn-b));color:#fff;box-shadow:var(--sh-accent)}\n.sidebar-mask{display:none}\n\n/* 悬浮按钮：移动端随时唤起侧边栏（桌面侧边栏常驻，故仅移动端显示） */\n.fab{display:none}\n\n/* 安装为应用教程 */\n.install-guide{display:block}\n.install-hero{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#f6f1ec,#f4ede6);border-radius:18px;padding:18px 20px;margin-bottom:18px}\n.install-hero-ico{font-size:2rem;flex:0 0 auto}\n.install-hero-title{font-size:1.1rem;font-weight:800;color:#af410f}\n.install-hero-sub{font-size:.82rem;line-height:1.7;color:#6e635a;margin-top:4px}\n.install-sec{background:#fff;border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:0 4px 15px rgba(0,0,0,.05);border-left:4px solid #9a3412}\n.install-sec h3{font-size:1rem;font-weight:800;color:#332d29;margin-bottom:10px}\n.install-sec ul{margin:0;padding-left:18px}\n.install-sec li{font-size:.86rem;line-height:1.8;color:#57534e;margin-bottom:6px}\n.install-sec li b{color:#af410f}\n.install-sec .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px}\n.install-sec .dot.o{background:#f97316}.install-sec .dot.g{background:#1db954}.install-sec .dot.p{background:#a78bfa}.install-sec .dot.b{background:#a8a29e}\n.install-tip{background:#fff7ed;border:1px solid #ffd8a8;color:#9a3412;border-radius:14px;padding:14px 16px;font-size:.85rem;line-height:1.8}\n.install-tip b{color:#af410f}\n.dark .install-sec{background:#262220}.dark .install-sec h3{color:#f4ede6}\n.dark .install-hero{background:linear-gradient(135deg,#2e2926,#221f1d)}\n.content{flex:1;min-width:0}\n.home-view{display:block}\n@media(max-width:900px){\n  /* 移动端内边距：卡片原先 0 边距全宽 → 整页糊成一片大色块。\n     给 10px 内边距后，卡片边界、圆角、阴影都显现出来，层次立刻清楚。 */\n  .layout{display:block;padding:10px}\n  .sidebar{position:fixed;left:0;top:0;padding:14px;background:#fffdfb;backdrop-filter:none;height:100vh;z-index:1100;border-radius:0;width:76vw;max-width:280px;transform:translateX(-100%);transition:transform .3s}\n  .sidebar.open{transform:translateX(0)}\n  .sidebar-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1050}\n  .sidebar-mask.show{display:block}\n  .content{padding:0 12px 12px}\n  .fab{position:fixed;left:14px;top:14px;z-index:1040;width:46px;height:46px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--grad-a),var(--grad-b));color:#fff;font-size:1.3rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(194,65,12,.22);backdrop-filter:blur(4px);transition:transform .2s,background .2s;animation:fabIn .3s ease}\n  .fab:hover{background:rgba(194,65,12,1);transform:scale(1.06)}\n  .fab:active{transform:scale(.95)}\n  @keyframes fabIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}\n}\n@media(min-width:901px){\n  .theme-btn{right:auto;left:16px;top:16px}\n}\n/* 站点头部 = 反相区块（参照 Tech Style 的 inverted section）：\n   用深色底 + 点阵纹理 + 顶部径向辉光，与浅色页面形成戏剧性对比。 */\nheader{background:linear-gradient(135deg,var(--btn-a),var(--btn-b));border-radius:24px;padding:40px 30px;color:#fff;box-shadow:var(--sh-accent-lg);margin-bottom:20px;text-align:center;position:relative;overflow:hidden}\n/* 点阵纹理：深色区块上 3.5% 不透明度的点阵，避免大面积纯色扁平 */\nheader::before{content:'';position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(rgba(255,255,255,.9) 1px, transparent","tt":1},{"p":"资料_班级站后台备份/班级站后台备份_2026-10-05_schema.sql","n":"班级站后台备份_2026-10-05_schema.sql","d":"","sz":8714,"t":"-- ============================================================\n-- 25级05班班级服务站 · 用户系统建表脚本\n-- 目标库：Neon Postgres\n-- 用法：在 Neon 控制台 → SQL Editor 里整段粘贴执行即可（可重复执行，幂等）\n-- ============================================================\n\n/* ---------------- 用户表 ---------------- */\ncreate table if not exists users (\n  id            bigserial primary key,\n  username      text        not null unique,          -- 登录名（小写存储）\n  display_name  text,                                 -- 显示名（真名/昵称）\n  password_hash text        not null,                 -- bcrypt 哈希，绝不存明文\n  role          text        not null default 'user',  -- user | admin\n  status        text        not null default 'active',-- active | banned\n  created_at    timestamptz not null default now(),\n  last_login_at timestamptz,\n  /* 约束：角色和状态只能是约定值，防止脏数据 */\n  constraint users_role_chk   check (role   in ('user','admin')),\n  constraint users_status_chk check (status in ('active','banned'))\n);\n\n/* 用户名统一小写，方便大小写不敏感登录 */\ncreate unique index if not exists users_username_lower_idx on users (lower(username));\n\n/* ---------------- 登录限流所需的两列（2026-09-30 加，幂等可重复执行） ----------------\n   老库直接执行本文件即可补上，不需要重建表。 */\nalter table users add column if not exists failed_count int not null default 0;\nalter table users add column if not exists locked_until  timestamptz;\n\n/* ---------------- 首次登录强制改密（2026-10-05 加，幂等） ----------------\n   由管理员在后台「添加用户」或「批量导入」时置为 true，\n   同学首次用初始密码登录后必须自行改密，改完自动置回 false。\n   管理员始终看不到明文密码（库中只有 PBKDF2 哈希）。 */\nalter table users add column if not exists must_change_password boolean not null default false;\n\n/* ---------------- 登录记录表（2026-10-05 加，幂等） ----------------\n   每次成功登录写一条；users.last_login_at 只保留最后一次，\n   本表保留完整历史，供后台「用户详情 → 登录记录」查看。 */\ncreate table if not exists login_log (\n  id         bigserial   primary key,\n  user_id    bigint      not null references users(id) on delete cascade,\n  ip         text,                                  -- 客户端 IP（取 CF-Connecting-IP / X-Forwarded-For）\n  user_agent text,                                  -- 浏览器 UA，截断到 500 字符\n  created_at timestamptz not null default now()\n);\ncreate index if not exists login_log_user_idx  on login_log (user_id, created_at desc);\ncreate index if not exists login_log_time_idx  on login_log (created_at desc);\n\n/* ---------------- 会话表 ---------------- */\ncreate table if not exists sessions (\n  token      text        primary key,\n  user_id    bigint      not null references users(id) on delete cascade,\n  created_at timestamptz not null default now(),\n  expires_at timestamptz not null\n);\ncreate index if not exists sessions_user_idx    on sessions (user_id);\ncreate index if not exists sessions_expires_idx on sessions (expires_at);\n\n/* ---------------- 用户数据表（云同步核心） ---------------- */\n-- 按 (用户, 键) 存 JSONB，天然适配前端 localStorage 的任意结构\ncreate table if not exists user_data (\n  user_id    bigint      not null references users(id) on delete cascade,\n  data_key   text        not null,                    -- 对应前端的 localStorage key\n  data_value jsonb,                                   -- 任意 JSON\n  updated_at timestamptz not null default now(),\n  primary key (user_id, data_key)\n);\ncreate index if not exists user_data_key_idx on user_data (data_key);\n\n/* ---------------- 管理操作审计表 ---------------- */\ncreate table if not exists audit_log (\n  id          bigserial primary key,\n  actor_id    bigint      references users(id) on delete set null,\n  action      text        not null,                   -- 如 user.ban / data.update\n  target_type text,                                   -- user | data | session\n  target_id   text,\n  detail      text,\n  created_at  timestamptz not null default now()\n);\ncreate index if not exists audit_log_actor_idx  on audit_log (actor_id);\ncreate index if not exists audit_log_time_idx   on audit_log (created_at desc);\n\n/* ---------------- 自动清理过期会话（可选，建议配 Neon 定时任务） ---------------- */\n-- 手动清理： delete from sessions where expires_at < now();\n\n/* ============================================================\n   班级通讯录 / 个人资料（2026-10-05 新增，幂等可重复执行）\n   ------------------------------------------------------------\n   设计要点（隐私优先）：\n   ① 所有真实数据只存这里，前端 index.html 里不再保留任何通讯录数据。\n      旧方案是把姓名哈希 + XOR 密文放在前端 JS，而密钥同在 JS 里，\n      等于公开——这是必须搬走的原因。\n   ② 姓名拆成 name（明文，供检索与展示）与 name_hash（SHA-256，供精确匹配）。\n      仅靠哈希无法展示姓名，仅靠明文又容易被爬，故两者并存：\n      列表只返回脱敏信息，命中查询才返回详情。\n   ③ 微信 / QQ / 手机号是「同学自填」字段，带独立审核状态：\n        pending  已提交待审核（不对外展示）\n        approved 审核通过（对已登录用户展示）\n        rejected 已驳回（不展示，本人可见驳回原因）\n   ④ 姓名 / 学号 / 政治面貌属于「身份信息」，同学无权修改，\n      只能由管理员在后台维护（对应代码里的 protect 字段校验）。\n   ============================================================ */\ncreate table if not exists profiles (\n  id            bigserial   primary key,\n  name          text,                                  -- 姓名（明文，管理员维护）\n  name_hash     text        unique,                    -- 姓名 SHA-256（精确匹配用，可空）\n  student_id    text        unique,                    -- 学号（管理员维护，唯一）\n  politics      text,                                  -- 政治面貌：共青团员 / 群众 / 中共党员 等\n  exam_no       text,                                  -- 智学网准考证号（管理员维护，同学查询时直接可见）\n  role          text        not null default '学生',    -- 学生 | 老师 | 管理员\n  /* ---- 以下三项由同学自填，需管理员审核后展示 ---- */\n  wechat        text,\n  qq            text,\n  phone         text,\n  contact_status text       not null default 'none',   -- none | pending | approved | rejected\n  reject_reason text,                                  -- 驳回原因，仅本人与管理员可见\n  /* 关联登录账号：同学首次用自己的账号认领本人资料后写入 */\n  user_id       bigint      references users(id) on delete set null,\n  created_at    timestamptz not null default now(),\n  updated_at    timestamptz not null default now(),\n  constraint profiles_contact_chk\n    check (contact_status in ('none','pending','approved','rejected'))\n);\ncreate index if not exists profiles_name_idx    on profiles (name);\ncreate index if not exists profiles_exam_idx    on profiles (exam_no);\ncreate index if not exists profiles_namehash_idx on profiles (name_hash);\ncreate index if not exists profiles_sid_idx     on profiles (student_id);\ncreate index if not exists profiles_user_idx    on profiles (user_id);\ncreate index if not exists profiles_status_idx  on profiles (contact_status);\n\n/* ---------------- 资料查看日志：谁在什么时候查看了谁 ---------------- */\ncreate table if not exists profile_view_log (\n  id         bigserial   primary key,\n  viewer_id  bigint      not null references users(id) on delete cascade,  -- 查看者\n  target_id  bigint      references profiles(id) on delete set null,       -- 被查看的资料\n  target_name text,                                                        -- 冗余存姓名，资料删除后日志仍可读\n  keyword    text,                                                         -- 本次查询用的关键词\n  ip         text,\n  created_at timestamptz not null default now()\n);\ncreate index if not exists pvl_viewer_idx on profile_view_log (viewer_id, created_at desc);\ncreate index if not exists pvl_target_idx on profile_view_log (target_id, created_at desc);\ncreate index if not exists pvl_time_idx   on profile_view_log (created_at desc);\n"},{"p":"资料_班级站后台备份/班级站后台备份_2026-10-05_班级资料导入.xlsx","n":"班级站后台备份_2026-10-05_班级资料导入.xlsx","d":"","sz":7980,"x":1},{"p":"资料_班级站后台备份/发布包/班级站后台备份_2026-10-05_gh-pages-内容.tar.gz","n":"班级站后台备份_2026-10-05_gh-pages-内容.tar.gz","d":"","sz":515725,"x":1},{"p":"资料_班级站后台备份/发布包/班级站后台备份_2026-10-05_改两处设置就能好.txt","n":"班级站后台备份_2026-10-05_改两处设置就能好.txt","d":"","sz":4354,"t":"================================================================\n  改两处设置，站点就能自动发布了（以后都不用手动管）\n================================================================\n\n## 你问的「为什么不能推 Gitee 就完事」\n\n因为 Gitee 那边**没有开 Pages 网页服务**：\n\n    https://zikang0529.gitee.io/class-site/   →  HTTP 404\n\n现在的分工是这样的：\n\n    存代码      →  Gitee master + GitHub master      两个都同步好了 ✅\n    出网页      →  GitHub Pages（从 gh-pages 分支）   卡住了 ❌\n    后端 API    →  Cloudflare Worker                 正常 ✅\n\n「推 Gitee」只是把代码存进仓库，**不会变成同学能打开的网址**。\n让同学访问的那个网址，是 GitHub Pages 提供的，它只认 gh-pages 分支。\n\n所以 gh-pages 不更新，前端就永远是 2026-08-25 那版。\n（如果想让 Gitee 也出网页：Gitee 免费版要手动申请 Pages 服务，\n  而且每次推代码后还要手动点一次「更新」才会重新部署，比 GitHub 更麻烦。）\n\n## 我已经把复杂的那套换掉了\n\n旧的发布流程有 286 行、6 个步骤：推 gh-pages → 回查 → 失败时 git 强推\n→ 再回查。那套东西本身就出了问题，你看到的那些自相矛盾的日志就是它：\n\n    ✓ 推送到 gh-pages 分支        ← 报成功\n    ✗ 回查 gh-pages 是否真更新     ← 说没推上去\n    ✓ 备用方案：git 直接推送        ← 又说成功\n    ✓ 备用通道回查                ← 又说成功\n    结果：分支停在 2026-08-25，从没变过\n\n根因是 GITHUB_TOKEN 没有写权限时，push 会被**静默丢弃**，\n脚本察觉不到。步骤越多，产出的误导性绿灯越多。\n\n**现在换成了 GitHub 官方推荐的方式**（286 行 → 150 行，6 步 → 2 个 job）：\n把文件打包成 artifact 直接发布，**全程不推送任何分支**，\n所以根本不需要写权限，也就不会卡在权限上。\n\n新文件已经推上去了：`.github/workflows/deploy-pages.yml` = 59611ec3e1\n\n\n================================================================\n  你要做的：改两处设置（各点一下，1 分钟）\n================================================================\n\n【第 1 处】把 Pages 的来源改成 GitHub Actions\n\n打开：https://github.com/yuzikaaang/class-site/settings/pages\n\n找到 **Build and deployment** → **Source**\n把它从 \"Deploy from a branch\" 改成 **\"GitHub Actions\"**\n\n保存。\n\n    ⚠️ 这一步必须做。不改的话，Pages 还在等 gh-pages 分支，\n       新流程发布的 artifact 不会被采用。\n\n\n【第 2 处】开启写权限（保险，改用新方式后其实不再需要）\n\n打开：https://github.com/yuzikaaang/class-site/settings/actions\n\n往下滚，找到 **Workflow permissions**（在「检查、工作流运行、\n状态、工件和日志保留」那块下面）\n\n    ○ 读取和写入权限     ← 选这个\n    ○ 只读权限\n\n点保存。\n\n    ℹ️ 你截图里那个「动作权限」不是这里。「动作权限」管的是\n       「能不能用别人写的 action」，跟推送权限无关。\n       要往下滚到「工作流权限」那一块。\n\n\n================================================================\n  改完之后\n================================================================\n\n告诉我一声，我会触发一次发布并做三重验证：\n\n    ① 查部署状态（deployments API）\n    ② 查 gh-pages / artifacts 是否落地\n    ③ 直接访问线上地址，比对字节数与关键函数\n\n确认无误后再让你去导入名单。\n\n你也可以自己手动触发：打开\nhttps://github.com/yuzikaaang/class-site/actions/workflows/deploy-pages.yml\n点右边 **Run workflow** → 选 master → 运行。\n\n\n================================================================\n  顺带一提：搜索的问题还没完\n================================================================\n\n前端修好之后，还有一件事要记得做：\n\n    后台 →「资料管理」→ Excel 导入 → 选 班级资料导入.xlsx（62 条）\n\n因为数据库里现在**一条资料都没有**，导之前搜谁都是搜不到的。\n这一步做完，搜索才真正可用。\n\n================================================================\n"},{"p":"资料_班级站后台备份/发布包/班级站后台备份_2026-10-05_重要-线上是旧版本-请先看这个.txt","n":"班级站后台备份_2026-10-05_重要-线上是旧版本-请先看这个.txt","d":"","sz":5581,"t":"================================================================\n  重要：线上站点其实是旧版本，需要手动重新发布一次\n================================================================\n\n## 一、现在到底是什么状况\n\n你访问的线上地址：\n\n    https://yuzikaaang.github.io/class-site/index.html   → HTTP 200，80380 字节\n    https://yuzikaaang.github.io/class-site/admin.html   → HTTP 404（根本不存在）\n\n而本地 master 上的真实大小：\n\n    index.html    533345 字节\n    admin.html    178092 字节\n\n也就是说，线上跑的是 **2026-08-25 那版旧代码**，你的「资料管理」\n「联系方式审核」「查看记录」三个面板，以及准考证号、Excel 导入，\n在线上**从来没出现过**。\n\n这也是你说「搜不到」的另一半原因（另一半是数据库里确实还没有数据）。\n\n## 二、为什么会这样\n\n查了 GitHub 的实际状态：\n\n    分支            最新提交        说明\n    ------------    ------------    ------------------------------\n    master          d6d8f25e32      我们的修复，已经同步好了 ✅\n    gh-pages        e3bab99859      停在 2026-08-25，没动过 ❌\n\n`gh-pages` 这个分支只有一个提交，作者是 `Genie <genie@local>`，\n提交信息「gh-pages: 纯静态站点(供GitHub Pages备用链接)」。\n\n而 GitHub Pages 正是从 `gh-pages` 分支发布的。它没更新，\n线上就永远是旧的。\n\n再看 Actions 的运行记录（2026-10-05 13:57 那次）：\n\n    ✓ 1. Set up job\n    ✓ 2. 拉取 master 分支完整内容\n    ✓ 3. 挑出上线文件到独立目录\n    ✓ 4. 推送到 gh-pages 分支          ← 显示成功\n    ✗ 5. 回查 gh-pages 是否真的更新了    ← 但回查发现没更新\n    ✓ 6. 备用方案：用 git 直接推送 gh-pages   ← 显示成功\n    ✓ 7. 备用通道回查                  ← 回查也显示成功\n\n七个步骤全部「成功」，但 `gh-pages` 到现在还是 `e3bab99`。\n\n**结论**：两次推送都报告成功，实际都没落到分支上。\n最可能的原因是仓库 Settings → Actions → General →\nWorkflow permissions 设成了 **Read-only**，\n这种情况下 `GITHUB_TOKEN` 拿不到写权限，\n`git push --force` 会被拒绝——但因为推送命令本身没报错就继续往下走了，\n加上回查用的也是同一套有问题的取数方式，就出现了「全绿但没生效」。\n\n（这一条我上轮就该查实，当时只看了「job 显示成功」就下了结论，\n线上验证的方式也有问题，导致误报了 170793 字节。这里更正。）\n\n## 三、怎么修（推荐顺序）\n\n### 方案 A：改仓库设置，让自动发布真正生效（推荐，治本）\n\n1. 打开 https://github.com/yuzikaaang/class-site/settings/actions\n2. 找到 **Workflow permissions**\n3. 选 **Read and write permissions**\n4. 点 **Save**\n5. 打开 https://github.com/yuzikaaang/class-site/actions/workflows/deploy-pages.yml\n6. 点右侧 **Run workflow** → 选 `master` 分支 → 运行\n\n跑完后再访问：\n\n    https://yuzikaaang.github.io/class-site/admin.html\n\n应该能看到后台登录页（不再是 404）。\n\n### 方案 B：手动发布一次（应急，立刻见效）\n\n如果方案 A 暂时不方便，用这个包直接覆盖 gh-pages。\n\n包里（`gh-pages-内容.tar.gz`，515KB）已经是**和 master 完全一致**的\n上线文件：\n\n    index.html                533345\n    admin.html                178092\n    sw.js                       8468\n    manifest.webmanifest         583\n    favicon.svg                 1944\n    icon-192.png                9798\n    icon-512.png               42842\n    qrcode.jpg                 42314\n    games/                  13 个文件\n    homework/                1 个文件\n    .nojekyll                    0\n\n操作方式（在你自己电脑上，需要 GitHub 账号密码或令牌）：\n\n    # 1. 拉取 gh-pages\n    git clone --depth=1 -b gh-pages \\\n      https://github.com/yuzikaaang/class-site.git gh-pages-pub\n    cd gh-pages-pub\n\n    # 2. 清掉旧内容（保留 .git）\n    find . -maxdepth 1 -not -name '.git' -not -name '.' -exec rm -rf {} +\n\n    # 3. 解开新内容\n    tar -xzf /路径/gh-pages-内容.tar.gz -C .\n\n    # 4. 提交并推送\n    git add -A\n    git commit -m \"发布：修复三处用户反馈\"\n    git push origin gh-pages\n\n推送完等 1~2 分钟，GitHub Pages 会自动重建。\n\n### 方案 C：换个发布方式（长期更稳）\n\n`peaceiris/actions-gh-pages` 这个 action 已经不可靠了。\n更稳的做法是用 GitHub 官方的 Pages 部署方式：\n\n    - 把 workflow 改成用 actions/upload-pages-artifact\n      + actions/deploy-pages\n    - 或者干脆把 Pages 的 Source 设成\n      Settings → Pages → Source = \"GitHub Actions\"\n\n这样不再需要往 gh-pages 分支推东西，从根上避开权限问题。\n\n## 四、发布完之后要做的\n\n1. 后台用 `yuzikang` 登录\n2. 「资料管理」→ Excel 导入 → 选 `班级资料导入.xlsx`（62 条）\n   - 弹窗里先点「下载模板」可以看格式\n   - 选好文件**会先预览前 8 行**，确认列没串位再点「开始导入」\n3. 导入完，首页搜索任意同学名字验证\n\n## 五、另外提醒：有个临时账号要删\n\n诊断时注册了 `__probe_diag_9527` 用来测接口。\n登录后台 →「用户管理」→ 找到这条 → 点右边的「删除」\n（这次的修复里刚把删除按钮加上，之前没有按钮，只能禁用）。\n\n================================================================\n"},{"p":"资料_班级站后台备份/后端源码/班级站后台备份_2026-10-05_admin.js","n":"班级站后台备份_2026-10-05_admin.js","d":"","sz":39537,"t":"/* ============================================================\n   /api/admin  —— 管理员后台接口\n   ------------------------------------------------------------\n   GET    /api/admin?action=users                     用户列表（含数据条数）\n   GET    /api/admin?action=user&id=1                 单个用户详情 + 其云端数据\n   GET    /api/admin?action=stats                     简单统计\n   GET    /api/admin?action=audit                     操作日志\n   POST   /api/admin?action=reset-password            重置某用户密码\n   POST   /api/admin?action=set-status                启用/禁用\n   POST   /api/admin?action=set-role                  设为管理员/普通用户\n   POST   /api/admin?action=set-data                  改某用户的某条数据\n   POST   /api/admin?action=delete-data               删某用户的某条数据\n   POST   /api/admin?action=delete-user               删号（连带其数据）\n   POST   /api/admin?action=clear-sessions            强制某用户全部设备下线\n\n   班级通讯录 / 个人资料（2026-10-05 新增）\n   GET    /api/admin?action=profiles                  资料列表（可按状态/关键词筛）\n   GET    /api/admin?action=profile&id=1              单条资料详情\n   GET    /api/admin?action=profile-requests          待审核的联系方式列表\n   GET    /api/admin?action=view-logs                 资料查看日志（谁看了谁）\n   POST   /api/admin?action=review-contact            审核联系方式：通过 / 驳回\n   POST   /api/admin?action=save-profile              新增或修改资料（姓名/学号/政治面貌）\n   POST   /api/admin?action=delete-profile            删除一条资料\n   POST   /api/admin?action=batch-profiles            批量导入资料\n   ============================================================ */\n\nimport { getSql } from './_lib/db.js';\nimport {\n  cors, handlePreflight, ok, fail, body, requireAdmin, audit,\n} from './_lib/http.js';\nimport { hashPassword } from './_lib/password.js';\n\nexport default async function handler(req, res) {\n  if (handlePreflight(req, res)) return;\n  cors(req, res);\n\n  const me = await requireAdmin(req, res);\n  if (!me) return;\n\n  const action = String(req.query.action || 'users').toLowerCase();\n\n  try {\n    /* 读操作 */\n    if (req.method === 'GET') {\n      if (action === 'users')      return await listUsers(req, res);\n      if (action === 'user')       return await userDetail(req, res);\n      if (action === 'stats')      return await stats(req, res);\n      if (action === 'audit')      return await listAudit(req, res);\n      if (action === 'login-logs') return await loginLogs(req, res);\n      if (action === 'export')     return await exportUsers(req, res);\n      if (action === 'profiles')         return await listProfiles(req, res);\n      if (action === 'profile')          return await profileDetail(req, res);\n      if (action === 'profile-requests') return await profileRequests(req, res);\n      if (action === 'view-logs')        return await viewLogs(req, res);\n      return fail(res, 404, '未知的 action：' + action);\n    }\n\n    /* 写操作 */\n    if (req.method === 'POST') {\n      const b = await body(req);\n      switch (action) {\n        case 'create-user':    return await createUser(req, res, me, b);\n        case 'batch-create':   return await batchCreate(req, res, me, b);\n        case 'reset-password': return await resetPassword(req, res, me, b);\n        case 'set-status':     return await setStatus(req, res, me, b);\n        case 'set-role':       return await setRole(req, res, me, b);\n        case 'set-data':       return await setData(req, res, me, b);\n        case 'delete-data':    return await deleteData(req, res, me, b);\n        case 'delete-user':    return await deleteUser(req, res, me, b);\n        case 'clear-sessions': return await clearSessions(req, res, me, b);\n        case 'review-contact': return await reviewContact(req, res, me, b);\n        case 'save-profile':   return await saveProfile(req, res, me, b);\n        case 'delete-profile': return await deleteProfile(req, res, me, b);\n        case 'batch-profiles': return await batchProfiles(req, res, me, b);\n        default:               return fail(res, 404, '未知的 action：' + action);\n      }\n    }\n\n    return fail(res, 405, '不支持的方法');\n  } catch (e) {\n    console.error('[admin]', action, e);\n    return fail(res, 500, '服务器内部错误，请稍后重试');\n  }\n}\n\n/* ---------------- 用户名 / 密码校验（与 auth.js 保持一致） ---------------- */\nfunction normUsername(s) {\n  return String(s || '').trim().toLowerCase();\n}\nfunction validUsername(u) {\n  return /^[a-z0-9_\\u4e00-\\u9fa5]{3,20}$/.test(u);\n}\n\n/* ---------------- 读：用户列表 ---------------- */\nasync function listUsers(req, res) {\n  const sql = getSql();\n  const q = String(req.query.q || '').trim().toLowerCase();\n  const limit = Math.min(Number(req.query.limit || 200), 500);\n  const offset = Math.max(Number(req.query.offset || 0), 0);\n\n  const rows = await sql`\n    select u.id, u.username, u.display_name, u.role, u.status,\n           u.created_at, u.last_login_at,\n           coalesce(u.must_change_password, false) as must_change_password,\n           coalesce(d.n, 0)::int as data_count\n      from users u\n      left join (\n        select user_id, count(*)::int as n from user_data group by user_id\n      ) d on d.user_id = u.id\n     where (${q} = '' or lower(u.username) like '%' || ${q} || '%'\n                         or lower(coalesce(u.display_name,'')) like '%' || ${q} || '%')\n     order by u.id\n     limit ${limit} offset ${offset}\n  `;\n  const total = (await sql`select count(*)::int as n from users`)[0].n;\n\n  return ok(res, {\n    total,\n    users: rows.map((r) => ({\n      id: Number(r.id),\n      username: r.username,\n      displayName: r.display_name,\n      role: r.role,\n      status: r.status,\n      createdAt: r.created_at,\n      lastLoginAt: r.last_login_at,\n      mustChangePassword: !!r.must_change_password,\n      dataCount: r.data_count,\n    })),\n  });\n}\n\n/* ---------------- 读：单个用户 + 其数据 ---------------- */\nasync function userDetail(req, res) {\n  const id = Number(req.query.id);\n  if (!id) return fail(res, 400, '缺少 id 参数');\n  const sql = getSql();\n\n  const rows = await sql`\n    select id, username, display_name, role, status, created_at, last_login_at\n      from users where id = ${id}\n  `;\n  if (!rows.length) return fail(res, 404, '用户不存在');\n  const u = rows[0];\n\n  const data = await sql`\n    select data_key, data_value, updated_at\n      from user_data where user_id = ${id} order by data_key\n  `;\n  const sessions = await sql`\n    select token, created_at, expires_at from sessions\n     where user_id = ${id} and expires_at > now() order by created_at desc\n  `;\n\n  return ok(res, {\n    user: {\n      id: Number(u.id),\n      username: u.username,\n      displayName: u.display_name,\n      role: u.role,\n      status: u.status,\n      createdAt: u.created_at,\n      lastLoginAt: u.last_login_at,\n    },\n    data: data.map((d) => ({\n      key: d.data_key,\n      value: d.data_value,\n      updatedAt: d.updated_at,\n    })),\n    /* token 只显示前 8 位，避免完整凭据出现在前端 */\n    sessions: sessions.map((s) => ({\n      tokenPrefix: String(s.token).slice(0, 8) + '…',\n      createdAt: s.created_at,\n      expiresAt: s.expires_at,\n    })),\n  });\n}\n\n/* ---------------- 读：统计 ---------------- */\nasync function stats(req, res) {\n  const sql = getSql();\n  const [u] = await sql`\n    select count(*)::int as total,\n           count(*) filter (where status = 'banned')::int as banned,\n           count(*) filter (where role = 'admin')::int as admins,\n           count(*) filter (where coalesce(must_change_password,false))::int as pending_pwd,\n           count(*) filter (where last_login_at > now() - interval '7 days')::int as active7,\n           count(*) filter (where last_login_at >= date_trunc('day', now()))::int as today_active\n      from users\n  `;\n  const [d] = await sql`select count(*)::int as rows, coalesce(sum(pg_column_size(data_value)),0)::bigint as bytes from user_data`;\n  const [s] = await sql`select count(*)::int as n from sessions where expires_at > now()`;\n\n  /* 哪些键用得最多（了解同学最在意什么功能） */\n  const topKeys = await sql`\n    select data_key, count(*)::int as n from user_data\n     group by data_key order by n desc limit 10\n  `;\n\n  /* 登录相关统计 + 最近登录记录。login_log 表不存在时静默降级为 0/空数组，\n     避免老库没执行建表脚本时整个概览页报错。 */\n  let loginTotal = 0;\n  let loginToday = 0;\n  let recentLogins = [];\n  try {\n    const [lt] = await sql`select count(*)::int as n from login_log`;\n    loginTotal = lt.n;\n    const [ld] = await sql`\n      select count(*)::int as n from login_log where created_at >= date_trunc('day', now())\n    `;\n    loginToday = ld.n;\n    const rl = await sql`\n      select l.user_id, l.ip, l.created_at, u.username\n        from login_log l\n        left join users u on u.id = l.user_id\n       order by l.created_at desc\n       limit 15\n    `;\n    recentLogins = rl.map((r) => ({\n      userId: Number(r.user_id),\n      username: r.username,\n      ip: r.ip,\n      createdAt: r.created_at,\n    }));\n  } catch (e) {\n    console.warn('[admin] login_log 不可用（可能未执行建表脚本）：', e.message);\n  }\n\n  /* 通讯录统计：资料总数、待审核数、已认领数、近 7 天查看量。\n     与上面同理，表不存在时静默降级，不影响概览页其他部分。 */\n  let profileStats = { total: 0, pending: 0, approved: 0, claimed: 0, views7: 0, viewsTotal: 0 };\n  try {\n    const [p] = await sql`\n      select count(*)::int as total,\n             count(*) filter (where contact_status = 'pending')::int  as pending,\n             count(*) filter (where contact_status = 'approved')::int as approved,\n             count(*) filter (where user_id is not null)::int         as claimed\n        from profiles\n    `;\n    profileStats = { ...profileStats, ...p };\n    const [v1] = await sql`select count(*)::int as n from profile_view_log`;\n    const [v2] = await sql`\n      select count(*)::int as n from profile_view_log\n       where created_at > now() - interval '7 days'\n    `;\n    profileStats.viewsTotal = v1.n;\n    profileStats.views7 = v2.n;\n  } catch (e) {\n    console.warn('[admin] profiles / profile_view_log 不可用：', e.message);\n  }\n\n  return ok(res, {\n    users: u,\n    data: { rows: d.rows, bytes: Number(d.bytes) },\n    activeSessions: s.n,\n    topKeys: topKeys.map((k) => ({ key: k.data_key, count: k.n })),\n    login: { total: loginTotal, today: loginToday, recent: recentLogins },\n    profiles: profileStats,\n  });\n}\n\n/* ---------------- 读：操作日志 ---------------- */\nasync function listAudit(req, res) {\n  const sql = getSql();\n  const limit = Math.min(Number(req.query.limit || 100), 300);\n  const rows = await sql`\n    select a.id, a.action, a.target_type, a.target_id, a.detail, a.created_at,\n           u.username as actor\n      from audit_log a\n      left join users u on u.id = a.actor_id\n     order by a.created_at desc\n     limit ${limit}\n  `;\n  return ok(res, { logs: rows });\n}\n\n/* ---------------- 写：重置密码 ---------------- */\nasync function resetPassword(req, res, me, b) {\n  const id = Number(b.id);\n  const newPwd = String(b.newPassword || '');\n  if (!id) return fail(res, 400, '缺少 id');\n  if (newPwd.length < 6 || newPwd.length > 64) return fail(res, 400, '新密码需 6–64 位');\n\n  const sql = getSql();\n  const hash = await hashPassword(newPwd);\n  /* 管理员重置的密码等同「新的初始密码」→ 把强制改密标记置回 true，\n     要求对方下次登录时再自行设置。否则管理员会一直知道对方密码。 */\n  const rows = await sql`\n    update users\n       set password_hash = ${hash},\n           must_change_password = true,\n           failed_count = 0,\n           locked_until = null\n     where id = ${id}\n    returning username\n  `;\n  if (!rows.length) return fail(res, 404, '用户不存在');\n\n  /* 重置密码后踢掉该用户所有登录 */\n  await sql`delete from sessions where user_id = ${id}`;\n  await audit(me.id, 'user.reset_password', 'user', String(id), rows[0].username);\n\n  return ok(res, {\n    message: '已重置 ' + rows[0].username + ' 的密码，该用户需用新密码登录并自行修改',\n  });\n}\n\n/* ---------------- 写：启用/禁用 ---------------- */\nasync function setStatus(req, res, me, b) {\n  const id = Number(b.id);\n  const status = String(b.status || '');\n  if (!id) return fail(res, 400, '缺少 id');\n  if (!['active', 'banned'].includes(status)) return fail(res, 400, 'status 只能是 active 或 banned');\n  if (id === me.id) return fail(res, 400, '不能禁用自己的账号');\n\n  const sql = getSql();\n  const rows = await sql`\n    update users set status = ${status} where id = ${id}\n    returning username\n  `;\n  if (!rows.length) return fail(res, 404, '用户不存在');\n\n  if (status === 'banned') await sq","tt":1},{"p":"资料_班级站后台备份/后端源码/班级站后台备份_2026-10-05_auth.js","n":"班级站后台备份_2026-10-05_auth.js","d":"","sz":12822,"t":"/* ============================================================\n   POST /api/auth?action=register|login|logout|me|change-password\n   ------------------------------------------------------------\n   用 query 参数分子动作，好处是函数数量少（Vercel 免费版有\n   函数数量限制），部署轻。\n   ============================================================ */\n\nimport { getSql, cfg } from './_lib/db.js';\nimport {\n  cors, handlePreflight, ok, fail, body,\n  requireUser, newToken, audit, ensureSchema,\n} from './_lib/http.js';\nimport {\n  hashPassword, verifyPassword, needsRehash, DECOY_HASH,\n} from './_lib/password.js';\n\n/* 用户名规则：3–20 位，字母/数字/下划线/中文 */\nfunction normUsername(s) {\n  return String(s || '').trim().toLowerCase();\n}\nfunction validUsername(u) {\n  return /^[a-z0-9_\\u4e00-\\u9fa5]{3,20}$/.test(u);\n}\n\nexport default async function handler(req, res) {\n  if (handlePreflight(req, res)) return;\n  cors(req, res);\n\n  const action = String(req.query.action || '').toLowerCase();\n\n  try {\n    switch (action) {\n      case 'register': return await register(req, res);\n      case 'login':    return await login(req, res);\n      case 'logout':   return await logout(req, res);\n      case 'me':       return await me(req, res);\n      case 'change-password': return await changePassword(req, res);\n      default:\n        return fail(res, 404, '未知的 action：' + (action || '(空)'));\n    }\n  } catch (e) {\n    console.error('[auth]', action, e);\n    return fail(res, 500, '服务器内部错误，请稍后重试');\n  }\n}\n\n/* ---------------- 注册 ---------------- */\nasync function register(req, res) {\n  if (req.method !== 'POST') return fail(res, 405, '请用 POST');\n\n  const { allowRegister } = cfg();\n  if (!allowRegister) return fail(res, 403, '本站暂未开放自助注册，请联系管理员开号');\n\n  const b = await body(req);\n  const username = normUsername(b.username);\n  const password = String(b.password || '');\n  const displayName = String(b.displayName || b.display_name || '').trim().slice(0, 30) || null;\n\n  if (!validUsername(username)) {\n    return fail(res, 400, '用户名需 3–20 位，仅限中英文、数字、下划线');\n  }\n  if (password.length < 6 || password.length > 64) {\n    return fail(res, 400, '密码长度需 6–64 位');\n  }\n\n  const sql = getSql();\n\n  /* 查重（用 lower 索引，避免 Tom/tom 重复注册） */\n  const dup = await sql`select id from users where lower(username) = ${username} limit 1`;\n  if (dup.length) return fail(res, 409, '这个用户名已经被注册了，换一个吧');\n\n  const hash = await hashPassword(password);\n\n  /* 首个注册者 / 配置里指定的用户名，自动成为管理员 */\n  const { adminUsers } = cfg();\n  const isFirst = (await sql`select count(*)::int as n from users`)[0].n === 0;\n  const role = (isFirst || adminUsers.includes(username)) ? 'admin' : 'user';\n\n  const rows = await sql`\n    insert into users (username, display_name, password_hash, role)\n    values (${username}, ${displayName}, ${hash}, ${role})\n    returning id, username, display_name, role, status, created_at\n  `;\n  const u = rows[0];\n\n  const token = await issueSession(sql, u.id);\n\n  return ok(res, {\n    message: role === 'admin' ? '注册成功，你已成为管理员' : '注册成功',\n    token,\n    user: shape(u),\n  });\n}\n\n/* ---------------- 登录 ---------------- */\nasync function login(req, res) {\n  if (req.method !== 'POST') return fail(res, 405, '请用 POST');\n\n  const b = await body(req);\n  const username = normUsername(b.username);\n  const password = String(b.password || '');\n\n  if (!username || !password) return fail(res, 400, '请填写用户名和密码');\n\n  const sql = getSql();\n\n  /* 先补全可能缺失的列/表，避免引用新列时直接 500（详见 ensureSchema 注释） */\n  await ensureSchema(sql);\n\n  /* 登录限流：同一用户名连续失败 5 次 → 锁 15 分钟（防暴力破解） */\n  const lockedMin = await lockRemain(sql, username);\n  if (lockedMin > 0) {\n    return fail(res, 429, '密码连续输错次数过多，请 ' + lockedMin + ' 分钟后再试');\n  }\n\n  const rows = await sql`\n    select id, username, display_name, role, status, password_hash, created_at,\n           coalesce(must_change_password, false) as must_change_password\n      from users where lower(username) = ${username} limit 1\n  `;\n\n  /* 用户不存在时也走一次密码比对，避免通过响应时间探测用户名是否存在。\n     ⚠️ 这个陪跑串必须是**合法且能被真正计算的**哈希，否则会提前返回、\n        防护等于没做。（历史上踩过两次坑：\n          2026-09-30 —— 假 bcrypt 串是 66 位非法长度，bcryptjs 直接返回 false；\n          2026-10-05 —— 换 PBKDF2 后，假串同步改为合法的 pbkdf2 格式。） */\n  const u = rows[0];\n  const hash = u ? u.password_hash : DECOY_HASH;\n  const good = await verifyPassword(password, hash);\n\n  if (!u || !good) {\n    await bumpFail(sql, u ? u.id : null, username);\n    return fail(res, 401, '用户名或密码不对');\n  }\n  if (u.status !== 'active') return fail(res, 403, '该账号已被禁用，请联系管理员');\n\n  await clearFail(sql, u.id);\n\n  /* 旧算法的哈希在登录成功后顺手升级（bcrypt → pbkdf2，或提高迭代次数）。\n     换算法不影响老用户：能登录就说明密码对，这里只是把它重新存成新格式。 */\n  if (needsRehash(u.password_hash)) {\n    try {\n      const upgraded = await hashPassword(password);\n      await sql`update users set password_hash = ${upgraded} where id = ${u.id}`;\n    } catch (e) {\n      console.warn('[auth] 密码哈希升级失败（不影响登录）：', e.message);\n    }\n  }\n\n  await sql`update users set last_login_at = now() where id = ${u.id}`;\n  await logLogin(sql, req, u.id);\n  const token = await issueSession(sql, u.id);\n\n  return ok(res, {\n    message: '登录成功',\n    token,\n    user: shape(u),\n    /* 首次登录（或管理员重置过密码）→ 前端强制弹改密，不给跳过 */\n    mustChangePassword: !!u.must_change_password,\n  });\n}\n\n/**\n * 记录一次登录（写入 login_log）。\n * 失败不影响登录本身 —— 老库若没执行过建表脚本，这里静默跳过。\n */\nasync function logLogin(sql, req, userId) {\n  try {\n    const h = req.headers || {};\n    /* Cloudflare 走 CF-Connecting-IP；Node/Vercel 走 x-forwarded-for（取第一段） */\n    const ip = String(\n      h['cf-connecting-ip']\n      || (h['x-forwarded-for'] ? String(h['x-forwarded-for']).split(',')[0] : '')\n      || h['x-real-ip']\n      || ''\n    ).trim().slice(0, 64);\n    const ua = String(h['user-agent'] || '').slice(0, 500);\n    await sql`\n      insert into login_log (user_id, ip, user_agent)\n      values (${userId}, ${ip || null}, ${ua || null})\n    `;\n  } catch (e) {\n    console.warn('[auth] 登录记录写入失败（可能缺少 login_log 表）：', e.message);\n  }\n}\n\n/* ---------------- 登录限流（基于 users 表，跨实例生效） ----------------\n   需要 schema.sql 里的 failed_count / locked_until 两列；\n   若老库没执行过 ALTER，这里会静默降级（不阻断登录），并在日志里提示。 */\nconst MAX_FAILS = 5;\nconst LOCK_MINUTES = 15;\n\nasync function lockRemain(sql, username) {\n  try {\n    const rows = await sql`\n      select locked_until from users where lower(username) = ${username} limit 1\n    `;\n    if (!rows.length || !rows[0].locked_until) return 0;\n    const until = toTime(rows[0].locked_until);\n    if (!until) return 0;\n    const ms = until - Date.now();\n    return ms > 0 ? Math.ceil(ms / 60000) : 0;\n  } catch (e) {\n    return 0; /* 列不存在 → 不限流 */\n  }\n}\n\n/**\n * 把数据库返回的时间值转成毫秒时间戳。\n *\n * ⚠️ 这里踩过一个坑（2026-10-05）：\n * Neon 的 HTTP 驱动返回 timestamptz 是**字符串**（形如 \"2026-10-05 05:52:28\"），\n * 不是 JS Date 对象。而带空格的这种格式在 Safari / 部分 WebView 里\n * `new Date(\"2026-10-05 05:52:28\")` 会得到 Invalid Date，\n * getTime() 返回 NaN —— NaN > 0 恒为 false，限流会**静默失效**。\n * 所以这里手动解析，并把空格换成 T、补上时区标识，确保各端一致。\n *\n * @returns {number} 毫秒时间戳；无法解析时返回 0\n */\nfunction toTime(v) {\n  if (!v) return 0;\n  if (v instanceof Date) {\n    const t = v.getTime();\n    return Number.isFinite(t) ? t : 0;\n  }\n  /* 数字（epoch 毫秒或秒） */\n  if (typeof v === 'number') return v > 1e12 ? v : v * 1000;\n  const s = String(v).trim();\n  /* 纯数字字符串 */\n  if (/^\\d+$/.test(s)) {\n    const n = Number(s);\n    return n > 1e12 ? n : n * 1000;\n  }\n  /* \"YYYY-MM-DD HH:MM:SS\"（Postgres 默认格式）→ ISO 8601 并补 UTC 标识。\n     Neon 返回的时间已是 UTC，但不带时区后缀，直接 new Date 会被当成本地时间，\n     导致误差一个时区（国内差 8 小时）。这里统一按 UTC 处理。 */\n  const iso = s.replace(' ', 'T');\n  const withZone = /[zZ]|[+-]\\d{2}:?\\d{2}$/.test(iso) ? iso : iso + 'Z';\n  const t = Date.parse(withZone);\n  return Number.isFinite(t) ? t : 0;\n}\n\nasync function bumpFail(sql, userId, username) {\n  try {\n    await sql`\n      update users\n         set failed_count = failed_count + 1,\n             locked_until = case when failed_count + 1 >= ${MAX_FAILS}\n                                 then now() + (${LOCK_MINUTES} || ' minutes')::interval\n                                 else locked_until end\n       where lower(username) = ${username}\n    `;\n  } catch (e) {\n    console.warn('[auth] 限流未生效（可能缺少 failed_count/locked_until 列）：', e.message);\n  }\n}\n\nasync function clearFail(sql, userId) {\n  try {\n    await sql`update users set failed_count = 0, locked_until = null where id = ${userId}`;\n  } catch (e) { /* 忽略 */ }\n}\n\n/* ---------------- 登出 ---------------- */\nasync function logout(req, res) {\n  if (req.method !== 'POST') return fail(res, 405, '请用 POST');\n  const h = req.headers.authorization || '';\n  const m = /^Bearer\\s+(.+)$/i.exec(h.trim());\n  if (m) {\n    const sql = getSql();\n    await sql`delete from sessions where token = ${m[1].trim()}`;\n  }\n  return ok(res, { message: '已退出登录' });\n}\n\n/* ---------------- 当前用户 ---------------- */\nasync function me(req, res) {\n  const u = await requireUser(req, res);\n  if (!u) return;\n  const sql = getSql();\n  /* 顺带返回已同步的键名列表，前端可据此判断云端有什么 */\n  const keys = await sql`select data_key, updated_at from user_data where user_id = ${u.id}`;\n  return ok(res, {\n    user: {\n      id: u.id, username: u.username, displayName: u.displayName,\n      role: u.role, createdAt: u.createdAt,\n    },\n    isAdmin: u.role === 'admin',\n    cloudKeys: keys.map((k) => ({ key: k.data_key, updatedAt: k.updated_at })),\n  });\n}\n\n/* ---------------- 修改自己的密码 ---------------- */\nasync function changePassword(req, res) {\n  if (req.method !== 'POST') return fail(res, 405, '请用 POST');\n  const u = await requireUser(req, res);\n  if (!u) return;\n\n  const b = await body(req);\n  const oldPwd = String(b.oldPassword || '');\n  const newPwd = String(b.newPassword || '');\n  if (newPwd.length < 6 || newPwd.length > 64) {\n    return fail(res, 400, '新密码长度需 6–64 位');\n  }\n\n  const sql = getSql();\n  const rows = await sql`select password_hash from users where id = ${u.id}`;\n  const good = await verifyPassword(oldPwd, rows[0].password_hash);\n  if (!good) return fail(res, 401, '原密码不对');\n\n  const hash = await hashPassword(newPwd);\n  /* must_change_password 一并清零：首次登录被强制改密后，下次不再拦 */\n  await sql`\n    update users\n       set password_hash = ${hash},\n           must_change_password = false,\n           failed_count = 0,\n           locked_until = null\n     where id = ${u.id}\n  `;\n  /* 改密码后踢掉其他设备的登录，只保留当前这台 */\n  await sql`delete from sessions where user_id = ${u.id}`;\n  const token = await issueSession(sql, u.id);\n\n  await audit(u.id, 'user.change_password', 'user', String(u.id), null);\n  return ok(res, { message: '密码已修改，其他设备已退出登录', token, mustChangePassword: false });\n}\n\n/* ---------------- 内部工具 ---------------- */\nasync function issueSession(sql, userId) {\n  const { sessionDays } = cfg();\n  const token = newToken();\n  await sql`\n    insert into sessions (token, user_id, expires_at)\n    values (${token}, ${userId}, now() + (${sessionDays} || ' days')::interval)\n  `;\n  return token;\n}\n\nfunction shape(u) {\n  return {\n    id: Number(u.id),\n    username: u.username,\n    displayName: u.display_name,\n    role: u.role,\n    status: u.status,\n  };\n}\n"},{"p":"资料_班级站后台备份/后端源码/班级站后台备份_2026-10-05_data.js","n":"班级站后台备份_2026-10-05_data.js","d":"","sz":7892,"t":"/* ============================================================\n   /api/data  —— 个人数据云同步\n   ------------------------------------------------------------\n   GET    /api/data              列出当前用户云端所有键与更新时间\n   GET    /api/data?key=xxx      取某一条\n   PUT    /api/data              写入/覆盖（body: { items: { key: value, ... } }）\n   DELETE /api/data?key=xxx      删除某一条\n\n   设计：只允许同步「个人数据」，不允许同步站内容。\n   前端传上来的 key 必须在白名单里，避免有人往里塞垃圾把库撑爆。\n   ============================================================ */\n\nimport { getSql } from './_lib/db.js';\nimport {\n  cors, handlePreflight, ok, fail, body, requireUser, requireUserReady, audit,\n} from './_lib/http.js';\n\n/* 允许云同步的键白名单。新增同步项时在这里加一行即可。\n   前缀匹配用结尾的 *，如 'cls_dj_note_*' */\nconst ALLOW_KEYS = [\n  'cls_theme',              // 主题（亮/暗）\n  'cls_theme_auto',         // 是否跟随系统\n  'cls_ui_cfg',             // 界面设置（字号/背景/排序/动效）\n  'cls_ui_bgimg',           // 自定义背景图\n  'cls_sfx',                // 音效开关\n  'cls_welcome_v1',         // 欢迎弹窗是否已看过\n  'cls_study_notice_dismissed',\n  'cls_dj_excluded',        // 点歌：自己排除的曲目\n  'cls_dj_excluded_req',    // 点歌：申请排除\n  'cls_dj_note',            // 点歌：备注\n  'cls_dj_schedule',        // 点歌：排期\n  'cls_hw_done_*',          // 作业完成标记（按作业 id 展开）\n  'cls_sign_*',             // 每日班级签（按日期展开）\n  'cls_claim_*',            // 点歌券领取台账\n  'cls_act_*',              // 每日活动记录\n];\n\n/** 单条数据体积上限（字符数），防止有人塞大文件进来 */\nconst MAX_VALUE_CHARS = 200 * 1024;   // 200KB\n/** 单用户最多同步多少条 */\nconst MAX_ITEMS_PER_USER = 2000;\n\n/** 键是否在白名单内（支持结尾 * 前缀匹配） */\nfunction keyAllowed(key) {\n  if (typeof key !== 'string' || !key || key.length > 120) return false;\n  /* 屏蔽明显危险的键名 */\n  if (/[<>\"']/.test(key)) return false;\n  return ALLOW_KEYS.some((pat) => {\n    if (pat.endsWith('*')) return key.startsWith(pat.slice(0, -1));\n    return key === pat;\n  });\n}\n\nexport default async function handler(req, res) {\n  if (handlePreflight(req, res)) return;\n  cors(req, res);\n\n  /* 特殊通道：页面关闭时用 navigator.sendBeacon 补推最后的改动。\n     sendBeacon 只能发 POST 且不能带自定义头，所以 token 走 query 参数。\n     这条通道只做「写入」，权限等同普通登录用户。 */\n  if (req.query.action === 'beacon') {\n    /* 只接受 POST：sendBeacon 本来就只发 POST，放行 GET 会让「带 token 的 URL」\n       被浏览器历史、服务器日志、Referer 头记下来，等于把凭据写进日志。 */\n    if (req.method !== 'POST') return fail(res, 405, 'beacon 通道只接受 POST');\n    const u = await requireUserFromQuery(req, res);\n    if (!u) return;\n    try {\n      return await writeData(req, res, u);\n    } catch (e) {\n      console.error('[data/beacon]', e);\n      return fail(res, 500, '服务器内部错误');\n    }\n  }\n\n  const u = await requireUserReady(req, res, 'data');\n  if (!u) return;\n\n  try {\n    switch (req.method) {\n      case 'GET':    return await readData(req, res, u);\n      case 'PUT':    return await writeData(req, res, u);\n      case 'DELETE': return await deleteData(req, res, u);\n      default:       return fail(res, 405, '不支持的方法');\n    }\n  } catch (e) {\n    console.error('[data]', req.method, e);\n    return fail(res, 500, '服务器内部错误，请稍后重试');\n  }\n}\n\n/** sendBeacon 通道专用：从 query 里取 token 鉴权 */\nasync function requireUserFromQuery(req, res) {\n  const token = String(req.query.t || '').trim();\n  if (!token) { fail(res, 401, '缺少登录凭据'); return null; }\n  const sql = getSql();\n  const rows = await sql`\n    select u.id, u.username, u.role, u.status, u.display_name, u.created_at\n      from sessions s join users u on u.id = s.user_id\n     where s.token = ${token} and s.expires_at > now() limit 1\n  `;\n  if (!rows.length || rows[0].status !== 'active') { fail(res, 401, '未登录或登录已过期'); return null; }\n  const u = rows[0];\n  return { id: Number(u.id), username: u.username, role: u.role, displayName: u.display_name };\n}\n\n/* ---------------- 读取 ---------------- */\nasync function readData(req, res, u) {\n  const sql = getSql();\n  const key = req.query.key;\n\n  if (key) {\n    const rows = await sql`\n      select data_key, data_value, updated_at\n        from user_data where user_id = ${u.id} and data_key = ${String(key)}\n    `;\n    if (!rows.length) return ok(res, { key: String(key), value: null, updatedAt: null });\n    return ok(res, {\n      key: rows[0].data_key,\n      value: rows[0].data_value,\n      updatedAt: rows[0].updated_at,\n    });\n  }\n\n  /* 不带 key：返回全部（前端做「登录后拉取云端数据」用） */\n  const rows = await sql`\n    select data_key, data_value, updated_at\n      from user_data where user_id = ${u.id}\n     order by data_key\n  `;\n  const items = {};\n  const times = {};\n  rows.forEach((r) => {\n    items[r.data_key] = r.data_value;\n    times[r.data_key] = r.updated_at;\n  });\n  return ok(res, { count: rows.length, items, times });\n}\n\n/* ---------------- 写入 ---------------- */\nasync function writeData(req, res, u) {\n  const b = await body(req);\n\n  /* 支持两种写法：\n     { key: 'x', value: ... }          单条\n     { items: { k1: v1, k2: v2 } }     批量（前端同步更省请求） */\n  let items = {};\n  if (b && b.items && typeof b.items === 'object') {\n    items = b.items;\n  } else if (b && typeof b.key === 'string') {\n    items = { [b.key]: b.value };\n  } else {\n    return fail(res, 400, '请求体格式不对，需要 { key, value } 或 { items: {...} }');\n  }\n\n  const entries = Object.entries(items);\n  if (entries.length === 0) return ok(res, { written: 0 });\n  if (entries.length > 500) return fail(res, 400, '单次最多写入 500 条');\n\n  /* 校验键白名单与体积 */\n  const bad = [];\n  for (const [k, v] of entries) {\n    if (!keyAllowed(k)) { bad.push(k + '（不在允许同步的范围内）'); continue; }\n    const len = JSON.stringify(v === undefined ? null : v).length;\n    if (len > MAX_VALUE_CHARS) bad.push(k + '（内容过大，超过 200KB）');\n  }\n  if (bad.length) return fail(res, 400, '以下数据无法同步：' + bad.slice(0, 5).join('、'));\n\n  const sql = getSql();\n\n  /* 条数上限，防止无限膨胀 */\n  const cnt = (await sql`select count(*)::int as n from user_data where user_id = ${u.id}`)[0].n;\n  if (cnt + entries.length > MAX_ITEMS_PER_USER) {\n    return fail(res, 400, '云端同步条数已达上限（' + MAX_ITEMS_PER_USER + ' 条）');\n  }\n\n  /* 先删同名的再批量插入：JSONB 批量 upsert 用 unnest 一次搞定 */\n  const keys = entries.map(([k]) => k);\n  const vals = entries.map(([, v]) => JSON.stringify(v === undefined ? null : v));\n\n  await sql`\n    insert into user_data (user_id, data_key, data_value, updated_at)\n    select ${u.id}, k, v::jsonb, now()\n      from unnest(${keys}::text[], ${vals}::text[]) as t(k, v)\n    on conflict (user_id, data_key)\n    do update set data_value = excluded.data_value, updated_at = now()\n  `;\n\n  return ok(res, { written: entries.length });\n}\n\n/* ---------------- 删除 ---------------- */\nasync function deleteData(req, res, u) {\n  const key = req.query.key;\n  if (!key) return fail(res, 400, '缺少 key 参数');\n  const sql = getSql();\n  await sql`delete from user_data where user_id = ${u.id} and data_key = ${String(key)}`;\n  return ok(res, { message: '已删除', key: String(key) });\n}\n"},{"p":"资料_班级站后台备份/后端源码/班级站后台备份_2026-10-05_http.js","n":"班级站后台备份_2026-10-05_http.js","d":"","sz":12077,"t":"/* ============================================================\n   HTTP 工具：CORS、统一响应、鉴权\n   ------------------------------------------------------------\n   鉴权用 Authorization: Bearer <token>，不依赖 Cookie。\n   原因：前端在 GitHub Pages、API 在 Vercel，属于跨站请求，\n   Cookie 需要 SameSite=None + Secure 才可能带上，而微信内置浏览器\n   （X5 内
