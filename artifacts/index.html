<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>班级站产物索引</title>
<style>
:root{
  --bg:#0f1115; --bg2:#171a21; --card:#1b1f28; --card2:#222733;
  --fg:#e8eaed; --fg2:#aab0bd; --fg3:#7c8494;
  --acc:#5b8cff; --acc2:#7aa2ff; --line:#2b3140; --ok:#3ecf8e;
  --shadow:0 8px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.5}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 18px 80px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 78%,transparent);
  padding:22px 0 14px;backdrop-filter:blur(8px)}
h1{margin:0 0 4px;font-size:23px;letter-spacing:.3px}
h1 .dot{color:var(--acc)}
.sub{color:var(--fg3);font-size:12.5px;margin-bottom:4px}
.selfnote{color:var(--ok);font-size:12px;margin-bottom:16px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--fg);
  padding:11px 14px 11px 38px;border-radius:11px;font-size:14px;outline:none;transition:.2s}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(91,140,255,.15)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--fg3)}
.chip{padding:9px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;
  color:var(--fg2);cursor:pointer;user-select:none;font-size:13px;transition:.15s;white-space:nowrap}
.chip:hover{border-color:var(--fg3)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin:18px 0 6px;color:var(--fg3);font-size:12.5px}
.stat b{color:var(--fg2);font-weight:600}
.version{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:14px 0;
  overflow:hidden;box-shadow:var(--shadow);content-visibility:auto;contain-intrinsic-size:auto 68px}
.vhead{display:flex;align-items:center;gap:12px;padding:15px 18px;cursor:pointer;
  transition:.15s;user-select:none}
.vhead:hover{background:var(--card2)}
.vbadge{font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));
  padding:4px 10px;border-radius:8px;white-space:nowrap;letter-spacing:.3px}
.vbadge.theme{background:linear-gradient(135deg,#7a5bff,#a06bff)}
.vdate{color:var(--fg3);font-size:12.5px;white-space:nowrap}
.vtitle{flex:1;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vcount{color:var(--fg3);font-size:12px;background:var(--bg2);padding:3px 9px;border-radius:20px}
.varrow{color:var(--fg3);transition:.2s;font-size:12px}
.version.open .varrow{transform:rotate(90deg)}
.vbody{display:none;padding:4px 18px 18px;border-top:1px solid var(--line)}
.version.open .vbody{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px;margin-top:14px}
.item{background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  cursor:pointer;transition:.18s}
.item:hover{border-color:var(--acc);transform:translateY(-2px)}
.thumb{width:100%;aspect-ratio:16/10;background:#0b0d11;display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;background:#0b0d11}
.thumb .zoom{position:absolute;right:6px;bottom:6px;width:24px;height:24px;border-radius:7px;
  background:rgba(0,0,0,.62);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:15px;line-height:1;pointer-events:none;opacity:.92}
.item:hover .thumb .zoom{background:var(--acc)}
.thumb .ext{color:var(--fg3);font-size:30px;font-weight:700}
.cap{padding:8px 9px;font-size:11.5px;color:var(--fg2);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.cap .fn{color:var(--fg3);font-size:10.5px;display:block;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;color:var(--fg3);padding:60px 20px;font-size:14px}
/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:100;display:none;
  align-items:center;justify-content:center;padding:16px;flex-direction:column;gap:14px;touch-action:none}
.lb.show{display:flex}
.lbimgwrap{width:100%;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.lb img{max-width:94vw;max-height:78vh;border-radius:8px;box-shadow:0 10px 50px rgba(0,0,0,.6);
  cursor:zoom-in;transition:transform .12s ease;touch-action:none;user-select:none;-webkit-user-select:none;
  transform-origin:center center}
.lb img.zoomed{cursor:zoom-out;max-width:none;max-height:none}
.lb .tip{color:#9aa1ae;font-size:11.5px}
.lb .bar{color:#cfd3dc;font-size:13px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.lb .bar button{background:#2b3140;color:#fff;border:0;border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px}
.lb .bar button:hover{background:#3a4256}
/* doc view */
.dv{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:none;
  align-items:center;justify-content:center;padding:30px;flex-direction:column;gap:14px}
.dv.show{display:flex}
.dv .box{background:var(--card);border:1px solid var(--line);border-radius:12px;width:min(960px,94vw);
  max-height:84vh;display:flex;flex-direction:column;overflow:hidden}
.dv .box .hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.dv .box .hd b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.dv .box .hd button{background:#2b3140;color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.dv pre{margin:0;padding:16px;overflow:auto;font-size:12.5px;line-height:1.6;color:#d5d9e2;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
.dv .hint{color:var(--fg3);font-size:12px}
mark{background:rgba(91,140,255,.35);color:#fff;padding:0 2px;border-radius:2px}
/* v4.16.9（站主）：手机端版本标题被省略号截断，看不到具体内容。
   窄屏改成「徽标+日期一行，标题另起一行并允许换行」，完整显示版本号后面的说明文字。
   v4.16.10：手机端页头改为不吸顶——原来 sticky 占掉近 500px，
   滚动后正文只剩一小条可视区，等于白屏。现在页头跟着内容滚走。 */
@media(max-width:600px){
  header{position:static;padding:14px 0 4px;background:none;backdrop-filter:none}
  h1{font-size:19.5px;margin-bottom:2px}
  .sub{display:none}
  .selfnote{font-size:10.5px;line-height:1.5;margin-bottom:8px}
  #warnnote{font-size:10.5px;line-height:1.45;margin:-2px 0 10px}
  .tools{gap:8px}.chip{padding:8px 12px;font-size:12.5px}
  .stat{gap:12px;margin:12px 0 2px;font-size:11.5px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}h1{font-size:20px}
  .vhead{flex-wrap:wrap;gap:8px 10px;padding:13px 14px;align-items:flex-start}
  .vbadge{font-size:11.5px;padding:3px 8px}
  .vdate{font-size:11.5px;line-height:1.7}
  .vtitle{flex:1 1 100%;order:3;white-space:normal;overflow:visible;text-overflow:clip;
    line-height:1.55;font-size:13.5px;margin-top:1px}
  .vcount{font-size:11px;padding:2px 8px}
  .lb .bar{gap:8px}.lb .bar button{padding:8px 12px;font-size:13px}
}
/* 电脑/平板大屏：缩略图更大更清晰，lightbox 占满更多空间 */
@media(min-width:1000px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .lb{padding:32px}.lb img:not(.zoomed){max-width:82vw;max-height:80vh}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>班级站产物索引 <span class="dot">·</span> 按版本归档</h1>
  <div class="sub">全部产物按「版本_日期_内容」归类 · 点击版本展开 · 点图放大 · 图片随滚动加载</div>
  <div class="selfnote" id="selfnote"></div>
  <div id="warnnote" style="color:#d9a441;font-size:11.5px;margin:-6px 0 12px;line-height:1.5">⚠️ 分享链接依托 WorkBuddy 服务：沙箱关闭时可能暂时打不开，稍后重试或联系维护方重新发布。</div>
  <div class="tools">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="q" placeholder="搜索版本号 / 日期 / 内容" autocomplete="off">
    </div>
    <div class="chip on" data-f="all">全部</div>
    <div class="chip" data-f="img">图片</div>
    <div class="chip" data-f="doc">文档/源码</div>
    <div class="chip" data-f="recent">近期版本</div>
  </div>
  <div class="stat" id="stat"></div>
</header>
<div id="list"></div>
</div>

<div class="lb" id="lb">
  <div class="lbimgwrap" id="lbimgwrap"><img id="lbimg" src="" alt="产物截图"></div>
  <div class="tip" id="lbtip">双击 / 双指缩放 · 拖动查看细节 · 点「适应窗口」还原</div>
  <div class="bar">
    <span id="lbname"></span>
    <button onclick="lbZoomToggle()">🔍 放大 / 还原</button>
    <button onclick="lbPrev()">← 上一个</button>
    <button onclick="lbNext()">下一个 →</button>
    <button onclick="lbClose()">关闭</button>
  </div>
</div>

<div class="dv" id="dv">
  <div class="box">
    <div class="hd"><b id="dvname"></b><button id="dvdl" onclick="dvDownload()">下载原文件</button><button onclick="dvClose()">关闭</button></div>
    <pre id="dvtext"></pre>
    <div class="hint" id="dvhint" style="padding:0 16px 12px"></div>
  </div>
</div>

<script>
const DATA = [{"dir":"v4.19.2_2026-11-28_定时自动开始-提前作答","ver":"v4.19.2","date":"2026-11-28","title":"定时自动开始-提前作答","theme":false,"count":3,"files":[{"p":"v4.19.2_2026-11-28_定时自动开始-提前作答/发布说明.md","n":"发布说明.md","d":"2026-11-28","sz":1793,"t":"# v4.19.2 发布说明（2026-11-28）\n\n## 本次更新：大屏时钟倒计时「定时自动开始」\n\n给大屏时钟的倒计时加了一个**定时自动开始**功能：设一个开始时刻，到本机时钟该时刻自动走表，不用再手动点「开始」。倒计时与考试模式共用这套设置。\n\n### 具体改动\n\n1. **定时入口**：倒计时子模式下方新增「⏱ 定时开始」按钮，点开设置面板。\n2. **两个参数**：\n   - **开始时刻**：计划开始的时间点（如 7:50）。\n   - **提前开始**：提前几分钟自动走表，0 = 准点开始。例：设 7:50、提前 5 分钟 → **7:45 自动开始**，方便提前作答。\n3. **到点行为**：到了「开始时刻 − 提前开始」这一刻，倒计时自动启动，同时全屏文字 + 铃声提示一次（提示里写明实际开始时刻与计划时刻）。\n4. **一次性**：设定只生效一次，触发后自动清空；晚上再用默认不提前、不定时，需重新设。跨天或错过触发窗口（超过 2 分钟）自动作废。\n5. **范围**：倒计时和普通考试模式都能用——考试模式只是先点科目套时长，再设定时。\n\n### 验收\n\n- e2e **3728 项全过**（新增 9 项定时自动开始断言）；copycheck 0 口语；predeploy 全绿。\n- 浏览器实测：面板设定 → 状态显示 → 取消 → 到点自动走表 → 一次性清空 → 重载不重复，零报错。\n- 已提交推送 Gitee，自动同步 GitHub，线上核验版本 4.19.2。\n\n### 使用提示\n\n- 提前填 0 表示准点走表；填 5 表示提前 5 分钟走表。\n- 设定后倒计时区会显示「HH:MM 自动开始（提前 N 分）」，按钮高亮表示已设定。\n- 取消定时：再点「定时开始」→「取消定时」。\n"},{"p":"v4.19.2_2026-11-28_定时自动开始-提前作答/截图/v4192-01-定时设置面板.png","n":"v4192-01-定时设置面板.png","d":"2026-11-28","sz":75315,"u":"a/7cf40dac4946c3a3.jpg"},{"p":"v4.19.2_2026-11-28_定时自动开始-提前作答/截图/v4192-02-已设定状态行.png","n":"v4192-02-已设定状态行.png","d":"2026-11-28","sz":66529,"u":"a/62ce9ac2921bd87f.jpg"}]},{"dir":"v4.19.1_2026-11-28_开屏动画-曲速菱形星空-实时进度","ver":"v4.19.1","date":"2026-11-28","title":"开屏动画-曲速菱形星空-实时进度","theme":false,"count":3,"files":[{"p":"v4.19.1_2026-11-28_开屏动画-曲速菱形星空-实时进度/发布说明.md","n":"发布说明.md","d":"2026-11-28","sz":3374,"t":"# v4.19.1 发布说明\n\n- **版本**：4.19.1（小版本升级；因 v4.19.0 发布未满 6 小时，按站规走小版本）\n- **日期**：2026-11-28\n- **标题**：开屏动画 · 曲速菱形星空 · 实时进度\n- **性质**：只改班级服务站主站的打开体验；功能数据、座位表原型均未改动\n\n## 本轮改动：打开网站先播开屏动画\n\n### 视觉与交互\n\n- **暖棕曲速星空**：深色暖棕底，Canvas 绘制菱形星从屏幕中心向外飞散（hyperdrive 效果），质感对齐点歌平台开屏，不再用刺眼的呼吸光晕。\n- **圆环进度**：金色圆环 + 中间实时百分比数字，进度走到 100% 自动渐隐进入主页，全程 3 秒内。\n- **文字常驻**：站名「25级05班班级服务站」滑入后一直显示，不再做退场消失。\n- **布局分离**：圆环在上、文字在下，完全不重叠。\n- **右上角班徽**：班徽压成 96px PNG 后以 base64 内联进页面，**零网络请求**——网络再卡也能正常显示，不用等接口。\n- **可跳过**：点击开屏任意处或按 Enter/Esc/空格即可跳过；任何异常情况下 4.6 秒强制收场，绝不会卡住进不了站。\n\n### 底部文案随实时进度切换\n\n| 进度区间 | 文案 |\n|---|---|\n| 0–15% | 正在初始化界面… |\n| 15–35% | 正在加载班级资源… |\n| 35–55% | 正在同步作业数据… |\n| 55–75% | 正在准备成绩与公告… |\n| 75–92% | 正在校验登录状态… |\n| 92–99% | 即将进入班级服务站… |\n| 100% | 准备完成 · 正在进入 |\n\n### 纯本地渲染\n\n- CSS 在 `<head>`、DOM + JS 在 `<body>` 最顶部，先于主站所有外部脚本显示。\n- 全部 `#clsSplash` 前缀 + `clsp-` 动画名，不污染主站任何样式。\n- 无图片请求、无字体请求、无接口依赖；粒子、圆环、文字全是本地绘制。\n- 进度用「时间曲线 + 页面 load 真实信号」，3 秒硬上限兜底。\n\n## 改动文件\n\n- `index.html`：开屏 CSS（head 内联）+ DOM/JS（body 顶部内联），含班徽 base64\n- `test_e2e.mjs`：新增 v4.19.1 开屏 8 项断言；修正历史写死的版本正则与 HTML 体积基线（内联班徽后上调到 640K）\n- 版本同步：`sw.js`、`admin.html`、`api/worker.mjs`、`version.json`、`admin-3.js`（REL_BUILTIN）、`README.md`、缓存参数 `?v=4192`\n\n## 发布链\n\n- `node scripts/build.mjs` —— 构建 v4.19.1\n- `node test_e2e.mjs` —— **3719 项全过**\n- `node scripts/copycheck.mjs --list` —— 15 文件 0 口语\n- `node tools/publish_release.mjs` —— 云端 release_notes（273 条）+ 发布公告\n- `node scripts/predeploy.mjs` —— 全绿，可部署\n- 推送：`node scripts/push-gitee.mjs`（Gitee → 自动同步 GitHub → GitHub Pages）\n\n## 验收\n\n浏览器实测（Playwright，390×844 手机视口）：\n\n- T0 开屏元素齐全：班徽 base64、Canvas、圆环、百分比、站名 ✅\n- 进度走动：6% → 27% → 46% → 100%，圆环 dash 值同步递减 ✅\n- 文案切换：初始化界面 → 加载班级资源 → 同步作业数据 → 准备完成，四级实时切换 ✅\n- 1.2 秒到 100% 后渐隐退场，DOM 移除，主页正常显示 ✅\n- 零 JS 报错（排除本地 localhost 访问云端 API 的 CORS 噪音）✅\n- 截图：`截图/v419-01-开屏动画-进度中.png`、`截图/v419-02-进入主页.png`\n"},{"p":"v4.19.1_2026-11-28_开屏动画-曲速菱形星空-实时进度/截图/v419-01-开屏动画-进度中.png","n":"v419-01-开屏动画-进度中.png","d":"2026-11-28","sz":181206,"u":"a/39951147d93ad9ad.jpg"},{"p":"v4.19.1_2026-11-28_开屏动画-曲速菱形星空-实时进度/截图/v419-02-进入主页.png","n":"v419-02-进入主页.png","d":"2026-11-28","sz":172516,"u":"a/6f5c73e6139c335d.jpg"}]},{"dir":"v4.19.0_2026-11-28_按科目批量录成绩-作业顺序-修改历史索引","ver":"v4.19.0","date":"2026-11-28","title":"按科目批量录成绩-作业顺序-修改历史索引","theme":false,"count":2,"files":[{"p":"v4.19.0_2026-11-28_按科目批量录成绩-作业顺序-修改历史索引/发布说明.md","n":"发布说明.md","d":"2026-11-28","sz":4193,"t":"# v4.19.0 发布说明\n\n- **版本**：4.19.0（中版本升级）\n- **日期**：2026-11-28\n- **标题**：按科目批量录成绩 · 作业顺序 · 修改历史索引\n- **性质**：只改班级服务站主站；座位表原型本轮冻结、未改动\n\n## 本轮改动（三块）\n\n### 一、平时成绩：新增「按科目批量录多场」模式\n\n**背景**：以前录入只支持「选一个日期 → 记当天多科」。用户常常忘记当天记录，攒到周末补录时，同一个科目有好几次不同日期的考试，一场场录很累。\n\n**改法**：录入弹层顶部加两个模式切换——\n\n| 模式 | 表单 | 适用 |\n|---|---|---|\n| 按日期记（原样保留） | 1 个日期 + 总名称 + 当天多科 + 整次共用班排/年排 | 一次考试考了多科 |\n| 按科目记（新增） | 选 1 个科目 + N 场，每场独立填：日期、分数、满分、**名称**、**备注**、班级排名、年级排名 | 同一科考了好几次，一次补齐 |\n\n- 每场「名称」「备注」两个字段都保留，名称如「第二单元」「周末限时训练」，备注写这一场的反思。\n- 班排/年排每场可选填，留空即可。\n- 两种模式写入同一套数据结构 `{日期,科目,分数,满分,类型,名称,班排,年排,备注}`，历史记录完全兼容，无需迁移。\n- **录入先后不限**：补录的旧日期按 `date` 字段自动归位，所有列表按日期倒序显示，不会出现「后录的排前面」。\n\n**改动文件**：`app.js`（PG 模块录入弹层、模式切换、多场行管理、`saveMulti`、接口暴露）、`pg.css`（模式 tab 与多场卡片样式）。\n\n### 二、手机端作业按标准科目顺序显示\n\n**问题**：大屏为了让左右两栏卡片长度平均，作业按 `hw.items` 的原始录入顺序排（语数英物化生被打乱）。手机端/普通模式也沿用了这个顺序，导致「第十三周周末作业」这类在手机上看科目顺序是乱的。\n\n**改法**：在普通模式渲染函数 `_renderHwItems` 里，展示前先按标准顺序 `HWA_SUBJ`（语数英物化生）排序，用的是 `items.slice().sort()`——**只排序展示副本，不改原始数据**，大屏那套物理顺序完全不受影响。\n\n**改动文件**：`app.js`（`_renderHwItems`）。\n\n### 三、后台操作日志：日期索引 + 折叠 + 定位\n\n**问题**：后台「操作日志」（含班级岛文案的每次修改记录）120 条平铺一大表，越攒越长，找某天的记录要一直滚。\n\n**改法**：\n- 按日期分组，每组可折叠，默认只展开最新一组。\n- 顶部加**日期索引条**（每个日期 + 条数），点某日期即展开该组并滚动定位，不用搜索框。\n- 加「展开全部 / 收起全部」两个按钮。\n- 展开状态跨切换/刷新记忆（`AUDIT_OPEN`）。\n- 撤回按钮逻辑原样保留。\n- 补了 `island.save` 的中文动作名「修改班级岛文案」。\n\n**改动文件**：`admin-2.js`（`loadAudit` 重写、`ACTION_LABEL`）。\n\n## 发布链\n\n- `node scripts/build.mjs` —— 重新生成 app.min.js / admin-*.js\n- 版本同步：index.html（SITE_VERSION/VER_DATE/按钮/`?v=41900`）、admin.html、sw.js（SITE_VER）、api/worker.mjs（API_VER）、version.json、admin-3.js（REL_BUILTIN）、README.md\n- `node test_e2e.mjs` —— **3711 项全过**\n- `node scripts/copycheck.mjs --list` —— 15 文件 0 口语\n- `node tools/publish_release.mjs` —— 写入云端 release_notes（272 条）+ 发布 v4.19 公告\n- `node scripts/predeploy.mjs` —— 全绿，可部署\n- 推送：`node scripts/push-gitee.mjs`（Gitee → 自动同步 GitHub → GitHub Pages）\n\n## 验收\n\n- 平时成绩按科目批量录入：浏览器实测 11 项断言全过——模式切换、两场空白行、添加/删除场次、乱序日期录入后自动倒排、名称与备注保留、编辑字段齐全。\n- 手机作业顺序：乱序输入（化/语/生/数/物/英）渲染为标准语数英物化生，原始数据未被改动。\n- 操作日志：3 天日志分组、默认展开 1 组、点索引展开定位、展开收起全部、中文动作名，浏览器 6 项断言全过。\n"},{"p":"v4.19.0_2026-11-28_按科目批量录成绩-作业顺序-修改历史索引/截图/v419-01-平时成绩按科目批量录入.png","n":"v419-01-平时成绩按科目批量录入.png","d":"2026-11-28","sz":288552,"u":"a/c8328468da5c4688.jpg"}]},{"dir":"v4.18.11_2026-11-24_专注保留信息-考试倒计时-文字提醒","ver":"v4.18.11","date":"2026-11-24","title":"专注保留信息-考试倒计时-文字提醒","theme":false,"count":4,"files":[{"p":"v4.18.11_2026-11-24_专注保留信息-考试倒计时-文字提醒/v4.18.11_2026-11-24_发布说明.md","n":"v4.18.11_2026-11-24_发布说明.md","d":"2026-11-24","sz":3046,"t":"# v4.18.11 发布说明\n\n**日期**：2026-11-24\n**标题**：专注保留信息 · 考试倒计时 · 文字提醒\n**线上地址**：https://yuzikaaang.github.io/class-site/ （大屏时钟页 https://yuzikaaang.github.io/class-site/clock.html ）\n\n## 本次更新\n\n### 一、专注（极简）模式保留信息\n- 按站主要求，开始计时 8 秒后自动收起的极简态，不再把信息全藏掉：\n  - **返回下方的当前时钟**照常显示（此前被隐藏）；\n  - **科目与事项**改成一个灰字信息行 `#bareInfo`，显示在倒计时数字上方，内容如「语文 · 考试」「数学 · 练习」，跟随所选科目/事项实时更新；考试时用橙色调强调。\n- 原来的科目按钮行、事项输入框、操作按钮在极简态仍收起，屏幕上只多这一行灰字，保持干净。\n\n### 二、倒计时新增「考试」模式\n- 切到「倒计时」子模式后，上方多出一排快捷入口：**语文 / 数学 / 英语 / 物理 / 化学 / 生物 / 退出**。\n- 点任一科目即进入考试模式并一键套用时长预设：\n  | 科目 | 时长 |\n  |------|------|\n  | 语文 | 150 分钟 |\n  | 数学 | 120 分钟 |\n  | 英语 | 120 分钟 |\n  | 物理 / 化学 / 生物 | 各 75 分钟 |\n- 事项框自动填「考试」、科目高亮；预设只是默认值，仍可点大数字用滚轮盘自定义修改，不改则按预设走。\n- 切到正计时 / 番茄钟时考试入口自动隐藏；点「退出」回到普通倒计时。考试结束的全屏提示文字为「考试结束！」。\n\n### 三、提醒增强\n- **考试专属提醒**：结束前 15 分钟（可改）触发全屏文字「距离考试还有 15 分钟」+ 铃声；提前分钟、铃声、铃声开关、文字开关都在「更多 → 考试模式提醒」里配置，默认开。\n- **通用提前提醒增加文字开关**：原来每条提醒只有「开/关」管铃声，现在每条多一个独立的「文字」按钮管全屏文字提醒，两者各自开关。\n- **文字按场景区分口径**：考试倒计时说「距离考试还有 N 分钟」；番茄钟休息阶段说「距离开始还有 N 分钟」；普通倒计时 / 专注阶段说「距离结束还有 N 分钟」。\n\n## 验收情况\n- 全量断言 **3701 项全过**（新增 16 条本版断言，修正 2 条因需求变更而过时的历史断言）；站内文案检查 0 处口语；发布门禁（版本号四处一致 / 云端版本记录 / 公告分类措辞 / 资源清单 / 归档规范等）全部通过。\n- 浏览器实测（本地 + 线上）：倒计时下考试入口显示、语文套用 2:30:00、数学套用 2:00:00、事项自动填「考试」、退出清空、切正计时入口隐藏、极简态灰字行与当前时钟都在、设置面板考试提醒 5 项与通用文字开关齐全，页面 JS 零报错。\n- 线上 `version.json`、`SITE_VERSION`、`API_VER` 均为 **4.18.11**；公告已按允许分类写入。\n\n## 提交\n- `d9a3efd` v4.18.11 专注保留信息 · 考试倒计时 · 文字提醒\n"},{"p":"v4.18.11_2026-11-24_专注保留信息-考试倒计时-文字提醒/v4.18.11_2026-11-24_极简态-科目事项灰字保留.png","n":"v4.18.11_2026-11-24_极简态-科目事项灰字保留.png","d":"2026-11-24","sz":41678,"u":"a/1f8d9d073ae12f10.jpg"},{"p":"v4.18.11_2026-11-24_专注保留信息-考试倒计时-文字提醒/v4.18.11_2026-11-24_考试提醒设置-文字开关.png","n":"v4.18.11_2026-11-24_考试提醒设置-文字开关.png","d":"2026-11-24","sz":113671,"u":"a/34ea1f17c01ac557.jpg"},{"p":"v4.18.11_2026-11-24_专注保留信息-考试倒计时-文字提醒/v4.18.11_2026-11-24_考试模式-语文150分钟.png","n":"v4.18.11_2026-11-24_考试模式-语文150分钟.png","d":"2026-11-24","sz":68371,"u":"a/20aee3a0c083cb96.jpg"}]},{"dir":"v4.18.10_2026-11-24_目标设置入口统一","ver":"v4.18.10","date":"2026-11-24","title":"目标设置入口统一","theme":false,"count":2,"files":[{"p":"v4.18.10_2026-11-24_目标设置入口统一/v4.18.10_2026-11-24_发布说明.md","n":"v4.18.10_2026-11-24_发布说明.md","d":"2026-11-24","sz":1804,"t":"# v4.18.10 发布说明\n\n**日期**：2026-11-24\n**标题**：目标设置入口统一\n**线上地址**：https://yuzikaaang.github.io/class-site/\n\n## 本次更新\n\n按站主要求，把分数目标的「设置」入口统一到个人画像，平时成绩只保留展示。\n\n### 平时成绩页移除目标设置项\n- 总览「目标进度」卡片右上角的「⚙ 设置目标」按钮移除，改为一行小字提示「在我的画像设置」。\n- 单科成绩卡里的目标输入区（原始分 / 赋分后目标 + 保存目标按钮）整体删除。\n\n### 目标展示全部保留\n- 目标进度（总分 / 目标、得分率、差距）、赋分前/后目标总分、各科达标胶囊、趋势图里的目标虚线、单科卡片上的目标与班级排名目标——这些都保持不变，还是照常对照展示。\n\n### 底部新增引导\n- 平时成绩页最底部加了一张引导卡：🎯「想调整分数目标？」+ 说明文字，并有一个「去我的画像设置 →」按钮，点一下直接切到个人画像的目标设置。\n\n### 个人画像入口不变\n- 「我的画像 → 目标进度」里的「⚙ 设置目标」按钮和统一目标弹窗（分数 / 总分排名 / 单科班级排名）保持原样，两端数据仍然同步。\n\n## 验收情况\n- 全量断言 **3687 项全过**（新增 8 条、修正 3 条历史断言），文案检查 0 处口语，发布门禁全过。\n- 浏览器实测：平时成绩页无设置按钮、无单科目标输入框；角标提示与底部引导卡都在；目标进度双口径展示保留；点引导成功跳转我的画像；统一弹窗仍可打开；无 JS 报错。\n- 线上 `version.json` / `SITE_VERSION` / API `X-Api-Ver` 均为 4.18.10。\n\n## 提交\n- `ac67c98` v4.18.10 目标设置入口统一到我的画像\n"},{"p":"v4.18.10_2026-11-24_目标设置入口统一/v4.18.10_2026-11-24_平时成绩底部引导.png","n":"v4.18.10_2026-11-24_平时成绩底部引导.png","d":"2026-11-24","sz":87553,"u":"a/10539e08b326de86.jpg"}]},{"dir":"v4.18.9_2026-11-24_悬浮按钮跟随滚动","ver":"v4.18.9","date":"2026-11-24","title":"悬浮按钮跟随滚动","theme":false,"count":2,"files":[{"p":"v4.18.9_2026-11-24_悬浮按钮跟随滚动/v4.18.9_2026-11-24_发布说明.md","n":"v4.18.9_2026-11-24_发布说明.md","d":"2026-11-24","sz":1899,"t":"# v4.18.9 发布说明\n\n**日期**：2026-11-24\n**标题**：悬浮按钮跟随滚动\n**线上地址**：https://yuzikaaang.github.io/class-site/\n\n## 本次更新\n\n### 修复：总分切换悬浮按钮真正跟随滚动\n- 现象：上一版（v4.18.8）的「总分赋分 / 总分原始」悬浮按钮看似悬浮，实际贴在成绩板块顶部，滑动页面时会跟着内容一起滚走，滑到下方就看不到。\n- 根因：按钮 DOM 嵌在成绩板块（`.tab-page`）内，而该板块切换时带有 transform 动画。CSS 规范里，祖先一旦有 transform，内部的 `position:fixed` 就会相对该祖先定位，而非相对屏幕视口，于是按钮变成「钉在板块顶部」。\n- 修法：把悬浮按钮 DOM 移出板块、挂到页面根层 `body`，脱离 transform 祖先，`position:fixed` 才真正相对视口。实测在 390px 手机视口下，页面从顶部滑到底部（滚动 0→1500→3000），按钮距顶始终为 64px 不动，真正跟随。\n\n### 调整：平时成绩标签自动收起按钮\n- 悬浮按钮显隐从「视口相交」改为「状态驱动」：只在成绩分析板块显示。\n- 平时成绩不参与赋分，切到「平时成绩」标签时按钮立即收起；切回全班成绩单 / 我的画像 / 成绩对比会重新出现。\n- 离开成绩板块、返回首页时也会收起，不会在别的页面乱飘。\n\n## 验收情况\n- 全量断言 **3679 项全过**（新增 6 条、修正 1 条旧断言），文案检查 0 处口语，发布门禁全过。\n- 浏览器实测：按钮挂 body 且只有一个实例；滚动 0→3000 距顶恒定 64px；平时成绩隐藏、其余三个标签显示、回首页隐藏；无 JS 报错。\n- 线上 `version.json` / `SITE_VERSION` / API `X-Api-Ver` 均为 4.18.9，关键功能标记已核对到位。\n\n## 提交\n- `8e64145` v4.18.9 悬浮按钮真跟随 · 平时成绩自动收起\n"},{"p":"v4.18.9_2026-11-24_悬浮按钮跟随滚动/v4.18.9_2026-11-24_悬浮器跟随视口.png","n":"v4.18.9_2026-11-24_悬浮器跟随视口.png","d":"2026-11-24","sz":142601,"u":"a/b6df1a8b559843aa.jpg"}]},{"dir":"v4.18.8_2026-11-23_口径悬浮切换-表单风格-排名目标","ver":"v4.18.8","date":"2026-11-23","title":"口径悬浮切换-表单风格-排名目标","theme":false,"count":3,"files":[{"p":"v4.18.8_2026-11-23_口径悬浮切换-表单风格-排名目标/v4.18.8_2026-11-23_发布说明.md","n":"v4.18.8_2026-11-23_发布说明.md","d":"2026-11-23","sz":2879,"t":"# v4.18.8 发布说明\n\n- **版本**：v4.18.8\n- **日期**：2026-11-23\n- **主题**：口径悬浮切换 · 表单风格 · 排名目标\n- **线上地址**：https://yuzikaaang.github.io/class-site/\n\n---\n\n## 本版改动\n\n### 一、总分口径切换改为右上角常驻悬浮器\n- 原来「总分赋分 / 总分原始」两个按钮只在「全班成绩单」标签顶部的工具条里，切到「我的画像 / 平时成绩」就看不到，想换口径得来回切标签、跑回顶部。\n- 现在把这两个按钮移到**右上角常驻悬浮胶囊**（橙色主题，标有「总分」）：\n  - 只在成绩分析板块进入视口时淡入，离开板块自动淡出，不会在整个网站乱飘；\n  - 切到任意标签（全班成绩单 / 我的画像 / 平时成绩 / 成绩对比）都能随时切换口径；\n  - **切换时记住并还原页面滚动位置**，不会跳回顶部；点当前口径不重绘，无谓跳动也去掉了；\n  - 手机端同样放右上角，尺寸自适应；明暗模式都适配。\n- 顶部工具条里原有两个口径按钮已删除，避免重复。\n\n### 二、重要日期表单输入统一成网站暖色风格\n- 「重要日期」新增 / 编辑弹窗里，名称、开始时间、结束日期、科目、考试范围等输入框原来是浏览器原生白色方框，跟橙棕色弹窗不搭。\n- 现在统一为浅暖米色圆角输入框（悬停 / 聚焦有橙色反馈），日期选择器加了明暗色彩适配，暗色模式下也不刺眼。按钮、提示文字的样式也一并理顺。\n\n### 三、修复：非赋分科在赋分口径下不显示班级排名目标\n- 语文、数学、英语、物理不参与赋分，本来就不该分「赋分前 / 赋分后」两套。此前在「赋分」口径下读取了这些科目的「赋分后排名目标」（空值），导致画像里显示不出已设置的班级排名目标。\n- 现在这四科的班级排名目标**两套口径共用同一份**（以原始分为准）；化学、生物仍按赋分前 / 赋分后分别设置。个人画像、AI 分析取数都已同步修正。\n\n---\n\n## 验收与发布\n\n| 项目 | 结果 |\n|---|---|\n| 全量断言 e2e | 3673 项全过（新增 10 条 v4.18.8 断言） |\n| 站内文案检查 | 15 个文件 0 处口语 |\n| 发布门禁 predeploy | 全部通过，版本号四处一致 4.18.8 |\n| 浏览器实测 | 悬浮器显隐 / 无感切换 / 表单新样式 / 排名目标共用，均通过，0 JS 报错 |\n| 线上生效 | 前端 `version.json`、`SITE_VERSION`、API `X-Api-Ver` 均为 4.18.8 |\n| 提交 | `209cf5d` 已推 Gitee，自动同步 GitHub Pages |\n\n## 附：验收截图\n- `v4.18.8_2026-11-23_总分口径悬浮切换器.png`：手机端成绩分析页右上角悬浮切换器。\n- `v4.18.8_2026-11-23_重要日期表单新样式.png`：手机端重要日期新增表单的暖色风格输入框。\n"},{"p":"v4.18.8_2026-11-23_口径悬浮切换-表单风格-排名目标/v4.18.8_2026-11-23_总分口径悬浮切换器.png","n":"v4.18.8_2026-11-23_总分口径悬浮切换器.png","d":"2026-11-23","sz":147876,"u":"a/0492384f812ad59c.jpg"},{"p":"v4.18.8_2026-11-23_口径悬浮切换-表单风格-排名目标/v4.18.8_2026-11-23_重要日期表单新样式.png","n":"v4.18.8_2026-11-23_重要日期表单新样式.png","d":"2026-11-23","sz":137326,"u":"a/7dd6b13d745a1b97.jpg"}]},{"dir":"v4.18.7_2026-11-23_修复首页误报与手机端排版","ver":"v4.18.7","date":"2026-11-23","title":"修复首页误报与手机端排版","theme":false,"count":2,"files":[{"p":"v4.18.7_2026-11-23_修复首页误报与手机端排版/v4.18.7_2026-11-23_发布说明.md","n":"v4.18.7_2026-11-23_发布说明.md","d":"2026-11-23","sz":3750,"t":"# v4.18.7 发布说明 · 修复首页误报与手机端排版\n\n- **版本**：4.18.7\n- **日期**：2026-11-23\n- **类型**：问题修复（小版本）\n- **线上**：https://yuzikaaang.github.io/class-site/\n\n## 这次修了两个问题\n\n### 1. 首页偶尔弹出「页面没能正常加载」（网络正常也弹、多设备都有）\n\n**这是一个纯前端 bug，跟网络无关**，所以网络正常、换设备也照样出现。\n\n- **根因**：v4.18.6 新增「卡片简介」时，渲染那行写的是 `esc(l.id)`，而卡片编号 `l.id` 是**数字**（1、2、3…）。转义函数 `esc(s)` 内部用 `(s||'').replace(...)`，数字没有 `.replace` 方法 → 抛 `TypeError` → 整个 `render()` 中断 → 首页功能卡片区（网格）卡在骨架屏，一条都没画出来。\n- **为什么弹\"加载失败\"**：页脚的看门狗 12 秒后检查「网格里有没有卡片」，发现一条都没有，误判成\"脚本没渲染、浏览器太旧或断网\"，弹出误导性的降级提示。公告、倒计时是另一条渲染路径，所以照常显示——正好造成\"公告有、卡片没、还提示加载失败\"的现象。\n- **修法**：\n  1. 渲染那行改成 `esc(String(l.id))`；\n  2. 把 `esc()` 本身加固成 `String(s==null?'':s).replace(...)`，从根上兼容数字等非字符串入参（顺带保护了其它几处 `esc(id)` 调用）；\n  3. 修完实测：首页网格渲染出 8 张卡片、看门狗不再误报。\n\n### 2. 手机端「重要日期管理」弹窗文字竖排\n\n- **现象**：窄屏打开管理弹窗，日期名称（如「高二上·第一次段考」）和日期范围被挤成竖排，编辑/删除按钮也挤在文字两侧。\n- **根因**：原来每一条是「文字块 + 编辑 + 删除」三者同一行 flex 布局，手机窄屏下中间文字块被两个按钮压到极窄，中文只能一个字一行往下排。\n- **修法**（沿用项目里 iPad 横屏那次「能换行就不硬挤」的思路）：\n  - 每条改成上下两块：**信息一行**（名称 + 日期范围，强制横排、允许换行、word-break 兜底），**按钮一行**（编辑、删除平分宽度）；\n  - 顶部「新增日期 + 共 N 项」也改成可换行；\n  - 考试范围录入框的科目输入固定窄宽、范围框 `min-width:0`，窄屏不再互相挤压；\n  - 明暗两套配色都适配。\n- **实测**：390px 窄屏下名称元素宽 312px、高 21px（单行横排），按钮独立成行，无重叠。\n\n## 验收情况\n\n- e2e：**3663 项全部通过**（新增 7 条 v4.18.7 断言：esc 加固、data-card-desc 用 String、弹窗两行结构、窄屏 CSS、录入框防挤压、版本记录与公告口径、公告长度）\n- 文案检查：15 个文件 0 处口语；发布门禁全过（版本号四处一致、云端记录、公告口径 3 条、README 同步、产物归档规范）\n- 浏览器实测（390px 手机尺寸）：\n  - 首页网格渲染 8 张卡片、`legacyFallback` 不再出现、0 个 JS 错误\n  - 弹窗名称横排（h≈line-height）、编辑/删除独立一行\n- 线上复核：`version.json` 4.18.7、`SITE_VERSION` 4.18.7、API `X-Api-Ver: 4.18.7`\n\n## 涉及文件\n\n- `app.js`：`esc()` 加固、`data-card-desc` 用 `String(l.id)`、`impEditRender()` 两行布局、`impEditForm()`/`impScopeRedraw()` 录入框窄屏保护\n- `index.html`：`.imp-edit-*` 一组 CSS（明暗适配）、版本号与缓存参数\n- `admin-3.js`：REL_BUILTIN 新增 4.18.7 条目与公告口径\n- `test_e2e.mjs`：新增 7 条 v4.18.7 断言、版本四处一致更新到 4.18.7\n- `README.md` / `sw.js` / `api/worker.mjs` / `admin.html` / `version.json`：版本与发布记录\n\n## 截图\n\n- `v4.18.7_2026-11-23_手机端弹窗文字横排.png`\n"},{"p":"v4.18.7_2026-11-23_修复首页误报与手机端排版/v4.18.7_2026-11-23_手机端弹窗文字横排.png","n":"v4.18.7_2026-11-23_手机端弹窗文字横排.png","d":"2026-11-23","sz":350656,"u":"a/cea632fa3dec48b6.jpg"}]},{"dir":"v4.18.6_2026-11-23_限流可设-面板精简-卡片简介","ver":"v4.18.6","date":"2026-11-23","title":"限流可设-面板精简-卡片简介","theme":false,"count":3,"files":[{"p":"v4.18.6_2026-11-23_限流可设-面板精简-卡片简介/v4.18.6_2026-11-23_发布说明.md","n":"v4.18.6_2026-11-23_发布说明.md","d":"2026-11-23","sz":4284,"t":"# v4.18.6 发布说明 · 限流可设 · 面板精简 · 卡片简介\n\n- **版本**：4.18.6\n- **日期**：2026-11-23\n- **类型**：功能调整 + 体验优化（小版本）\n- **线上**：https://yuzikaaang.github.io/class-site/\n\n## 这次改了什么\n\n### 1. 登录限流改成后台可配\n\n- 连续输错几次锁定、锁多少分钟，改为后台「全站设置」里可填（默认 **5 次 / 15 分钟**），不用再改代码。\n- 范围校验：次数 1–20，时长 1–1440 分钟；越界自动回退默认值。\n- **顺带修了一个真 bug**：用姓名或别名登录时，失败计数没记到账号上、退出刷新后锁定就失效。现在失败计数按账号 ID 落库，锁定状态刷新后依然有效。\n\n### 2. 重要日期 / 考试范围搬到前台\n\n- 管理员在首页「重要日期倒计时 → 管理」就能直接增、改、删日期和考试范围，功能跟原来后台面板一样。\n- 后台对应的「重要日期」面板整块删除，不再两处维护。\n- 改动即刻同步到首页倒计时，无需刷新。\n\n### 3. 后台面板合并去重\n\n- **信息分享**并入「板块管理」，后台侧栏原入口撤掉；在板块管理里可切回「个人信息分享」。\n- **点歌管理**撤销；其中「投稿统计」和「点歌券管理」并入「排歌周期」，保留原名。\n- 删除投稿上限守卫与实时歌单等冗余项。\n\n### 4. 卡片简介改为后台可编辑\n\n- 删掉用不上的「大板块简介」；真正需要自定义的是每个功能卡片的简介（如大屏服务里的 Class Island、其他工具里的个人资料）。\n- 前端现有简介照搬入库，以后在后台「板块管理 → 卡片简介」直接改。\n- 简介存本机缓存，后台改动后自动无感刷新，不每次都读云端。\n\n### 5. 公告措辞去 AI 味并固化成规则\n\n- 按站规把版本公告改成官方、简洁、同学能看懂的表述（如「成绩可逐条删除，也可一键清空某一科」→「成绩支持逐条删除与按科目清空」）。\n- 去 AI 味的用词规则固化到发布门禁（`scripts/copycheck.mjs`）和公告措辞拦截里，以后发版自动拦口语、内部词、解释性表述。\n\n## 验收情况\n\n- e2e：**3656 项全部通过**（新增 v4.18.6 断言覆盖限流配置、前台日期管理、面板合并、卡片简介、公告去味；修正旧断言导航项 14→11、板块简介→卡片简介、settings 白名单新增两键）\n- 文案检查：15 个文件 0 处口语；发布门禁全过（版本号四处一致、云端记录、公告口径 5 条、README 同步、产物归档规范）\n- 限流逻辑断言：**10/10 通过**（默认 5/15、配置读取、范围校验、按 userId 写锁、提示语读配置值、后台 UI 与保存）\n- 浏览器实测：\n  - 管理员「管理」入口出现在倒计时头部，弹窗可开，新增日期后「共 1 项 → 共 2 项」即时生效\n  - 卡片 3 简介被云端值覆盖，本机缓存写入正常\n- 线上复核：`version.json` 4.18.6、`SITE_VERSION` 4.18.6、API `X-Api-Ver: 4.18.6`；app.js 含 `openImpEdit`/`boardMetaSoftRefresh`/`data-card-desc`，admin-2.js 含 `stMaxFails`/`stLockMin`，index.html 含 `impEditMask`\n\n## 发布链路\n\n- 提交：`908499c v4.18.6 限流可设·面板精简·卡片简介`\n- 推送：Gitee `zikang0529/class-site master` → 自动同步 GitHub Pages；API Worker 已生效\n- 云端公告：v4.18 条已清理旧内部词口径，改为 5 条正式表述；release_notes 4.18.6 pub 同步更新\n\n## 涉及文件\n\n- `api/auth.js`：限流可配 + 失败计数按 userId 落库（修锁定失效）\n- `api/admin.js`：设置白名单与数字键范围校验\n- `admin-1.js` / `admin-2.js` / `admin-3.js`：后台面板合并、删重要日期面板、系统设置限流输入、卡片简介编辑、公告口径\n- `app.js` / `index.html`：前台重要日期管理弹窗、卡片简介云端覆盖与缓存\n- `api/boards.js`：卡片简介入库与元数据保存\n- `scripts/copycheck.mjs`：公告去味规则\n- `README.md` / `version.json` / `sw.js` / `api/worker.mjs` / `test_e2e.mjs`：版本与发布记录\n\n## 截图\n\n- `v4.18.6_2026-11-23_首页倒计时管理入口.png`\n- `v4.18.6_2026-11-23_重要日期前台管理.png`\n"},{"p":"v4.18.6_2026-11-23_限流可设-面板精简-卡片简介/v4.18.6_2026-11-23_重要日期前台管理.png","n":"v4.18.6_2026-11-23_重要日期前台管理.png","d":"2026-11-23","sz":536535,"u":"a/060d587e9db52524.jpg"},{"p":"v4.18.6_2026-11-23_限流可设-面板精简-卡片简介/v4.18.6_2026-11-23_首页倒计时管理入口.png","n":"v4.18.6_2026-11-23_首页倒计时管理入口.png","d":"2026-11-23","sz":649152,"u":"a/e93acb07d7aa8e67.jpg"}]},{"dir":"v4.18.5_2026-11-22_目标并入卡片与画像顺序","ver":"v4.18.5","date":"2026-11-22","title":"目标并入卡片与画像顺序","theme":false,"count":4,"files":[{"p":"v4.18.5_2026-11-22_目标并入卡片与画像顺序/v4.18.5_2026-11-22_发布说明.md","n":"v4.18.5_2026-11-22_发布说明.md","d":"2026-11-22","sz":3750,"t":"# v4.18.5 发布说明 · 目标并入卡片 · 画像顺序调整\n\n- **版本**：4.18.5\n- **日期**：2026-11-22\n- **类型**：体验优化（小版本）\n- **线上**：https://yuzikaaang.github.io/class-site/\n\n## 这次改了什么（站主验收后提的四点）\n\n### 1. 设置目标弹窗背景不再透明\n\n之前弹窗背后是一层 50% 黑，页面内容容易透出来，看着像\"背景透明\"。现在：\n\n- 遮罩改为深色半透明 `rgba(28,25,23,.66)`，另加 3px 背景模糊；\n- 弹窗本体亮色用不透明米白 `#fffdfb`，暗色用不透明深棕 `#262220`；\n- 暗色下遮罩加深到 `rgba(0,0,0,.74)`，两层不会混在一起。\n\n### 2. 目标不再单独占一张卡（个人画像）\n\n- 删掉原来独立的「我的目标」卡；\n- **总分目标**（目标总分 / 距目标多少分 / 已超多少分）与**总分排名目标**（年级前 N、班级前 N）并入顶部概览卡；\n- 「⚙ 设置目标」按钮放在概览卡右上角，跟平时成绩的位置一致，不再单独占一行。\n\n### 3. 各科目标放到各科卡片里\n\n- **个人画像 · 各科情况**：每科底部直接显示「目标 120 · ✓ 已达成（+4）」「目标 120 · 还差 2 分」，以及「班目标前 5 · ✓ 现第 1」；\n- **平时成绩 · 单科卡**：头部加「班目标前 5 · 现第 4 ✓」标签，不用进弹窗就知道离目标几名；\n- 总分目标仍放在最顶上（画像概览卡 / 平时成绩「目标进度」卡）。\n\n### 4. 个人画像卡片顺序调整\n\n旧顺序里「各科情况」和「各科折线图」中间隔着 AI 分析，读起来跳。新顺序：\n\n| 顺序 | 卡片 |\n|---|---|\n| 1 | 概览（总分 + 目标 + 排名目标） |\n| 2 | 上线情况 |\n| 3 | 你在班里的位置 |\n| 4 | 各科情况（含每科目标达成） |\n| 5 | 六科画像（雷达 + 数值表） |\n| 6 | 各科趋势折线 |\n| 7 | 各科进退步 |\n| 8 | 总分趋势与进退步 |\n| 9 | 年级进退步 |\n| 10 | AI 分析（收尾） |\n\n即「概况 → 各科现状与走势 → 总分趋势 → 结论」，同类内容连在一起。\n\n## 验收情况\n\n- e2e：**3642 项全部通过**（新增 7 条 v4.18.5 断言：遮罩不透明、独立目标卡已移除、概览卡设置入口、各科目标达成、卡片顺序、单科班目标、明暗样式）\n- 文案检查：15 个文件 0 处口语\n- 发布前门禁：版本号四处一致、云端记录、公告口径、README 同步、产物归档规范全部通过\n- 浏览器实测：\n  - 弹窗遮罩计算值 `rgba(28,25,23,0.66)` + `blur(3px)`，暗色 `rgba(0,0,0,0.74)`，卡片底 `rgb(255,253,251)` / `rgb(38,34,32)`\n  - 画像概览卡显示「647 目标总分·赋分后 / 已超 4 分 / 总分排名目标 年级前100（现110）班级前8 ✓」\n  - 六科目标行：语文 ✓ 已达成（+4）、英语 还差 2 分、化学 ✓ 已达成（+1）班目标前 8 · ✓ 现第 1\n  - 平时成绩单科卡：「124 / 满分150 目标120 班目标前 5 · 现第 4 ✓ 已达标 +4」\n- 线上复核：`version.json` 4.18.5、`SITE_VERSION` 4.18.5、`pg.css?v=4185`、app.min.js 含 `sc-ov-goal` / `sc-sub-goal` / `pg-rkg`、旧 `sc-goalcard` 已为 0 处\n\n## 涉及文件\n\n- `app.js`：概览卡集成目标、移除独立目标卡、各科卡目标行、卡片顺序、单科班目标标签\n- `index.html`：概览目标样式（明暗两套）、各科目标标签样式\n- `pg.css`：弹窗遮罩与卡片底色、单科班目标胶囊\n- `admin-3.js` / `README.md` / `version.json` / `sw.js` / `api/worker.mjs`：版本与发布记录\n\n## 截图\n\n- `v4.18.5_2026-11-22_目标弹窗深色遮罩.png`\n- `v4.18.5_2026-11-22_画像概览与各科目标.png`\n- `v4.18.5_2026-11-22_平时成绩单科班目标.png`\n"},{"p":"v4.18.5_2026-11-22_目标并入卡片与画像顺序/v4.18.5_2026-11-22_平时成绩单科班目标.png","n":"v4.18.5_2026-11-22_平时成绩单科班目标.png","d":"2026-11-22","sz":292607,"u":"a/fd0cff41bfabe48b.jpg"},{"p":"v4.18.5_2026-11-22_目标并入卡片与画像顺序/v4.18.5_2026-11-22_画像概览与各科目标.png","n":"v4.18.5_2026-11-22_画像概览与各科目标.png","d":"2026-11-22","sz":335878,"u":"a/383190ae63a2d089.jpg"},{"p":"v4.18.5_2026-11-22_目标并入卡片与画像顺序/v4.18.5_2026-11-22_目标弹窗深色遮罩.png","n":"v4.18.5_2026-11-22_目标弹窗深色遮罩.png","d":"2026-11-22","sz":150667,"u":"a/3d6194ad14609b3d.jpg"}]},{"dir":"v4.18.3_2026-11-22_平时成绩修复-能改目标能删记录","ver":"v4.18.3","date":"2026-11-22","title":"平时成绩修复-能改目标能删记录","theme":false,"count":3,"files":[{"p":"v4.18.3_2026-11-22_平时成绩修复-能改目标能删记录/v4.18.3_2026-11-22_发布说明.md","n":"v4.18.3_2026-11-22_发布说明.md","d":"2026-11-22","sz":2405,"t":"# v4.18.3 发布说明 · 平时成绩修复\n\n**日期**：2026-11-22\n**线上**：https://yuzikaaang.github.io/class-site/\n\n## 这一版修的三件事\n\n### 一、新手导览不再挡住点击\n- 病状：第一次进「成绩分析」会弹新手导览，它带一层全屏透明遮罩，把底下所有点击都吃掉了——鼠标在目标输入框上显示\"可输入\"的光标，却怎么都点不进去、输不了字；手机上点数字同样没反应。\n- 修法：遮罩改成 `pointer-events:none`。导览气泡照常显示（\"下一步 / 完成\"仍能点），但底下的输入框、下拉、按钮都能正常操作——不用先把导览看完。\n- 聚光暗底由高亮框的 box-shadow 负责，与遮罩无关，视觉效果不变。\n\n### 二、没有成绩记录也能设目标\n- 病状：新用户选「语文」，卡片显示\"暂无记录\"，只有一个不能点的\"目标 100\"文字——因为原来的代码在\"无记录\"时提前返回，目标输入框压根没渲染，默认目标改不了。\n- 修法：把目标输入区提到空状态分支也渲染。现在没有成绩时照样能看到「语文 目标分 [输入框] [保存]」，可以直接把默认目标（语数英 120/130/120、物化生各 90）改成自己的，不必先录入成绩。\n\n### 三、成绩可以删了（方便测试与清理）\n- **删单条**：每条逐次记录右侧多了一个「×」，点它删掉这一条（即某次考试某一科）。确认框会显示日期、科目、分数、考试名称，二次确认后才删。\n- **清空本科**：「逐次记录」栏右侧有「清空本科」按钮，一次删掉某一科的全部成绩，其他科目不受影响，同样二次确认。\n- 删除后立即重算趋势、目标进度与 AI 分析，并同步到云端。\n- 原有\"编辑历史\"里的单条删除仍然保留，两条路径都能用。\n\n## 验证\n- e2e **3625 项全通过**（新增 8 条 v4.18.3 断言）\n- 真实浏览器验收：\n  - 导览未完成时 `pointer-events:none`，导览中直接改语文目标 120→135 并保存成功\n  - 无记录时目标输入框出现且可编辑\n  - 删除单条：3→2 条，确认框文案正确\n  - 清空本科：2→1 条，只剩数学，确认框文案正确\n- 线上复核：版本 4.18.3、`goalBlock` 与遮罩修复均已生效\n\n## 版本说明\n按站主规矩，v4.18 系列本次仍为**小版本 v4.18.3**。\n"},{"p":"v4.18.3_2026-11-22_平时成绩修复-能改目标能删记录/v4.18.3_2026-11-22_成绩可单条删除与清空本科.png","n":"v4.18.3_2026-11-22_成绩可单条删除与清空本科.png","d":"2026-11-22","sz":191140,"u":"a/fcf08fc59994b359.jpg"},{"p":"v4.18.3_2026-11-22_平时成绩修复-能改目标能删记录/v4.18.3_2026-11-22_无记录也能设目标.png","n":"v4.18.3_2026-11-22_无记录也能设目标.png","d":"2026-11-22","sz":44145,"u":"a/b2c66b518fce53ee.jpg"}]},{"dir":"v4.18.2_2026-11-22_布局收敛与导出搜索","ver":"v4.18.2","date":"2026-11-22","title":"布局收敛与导出搜索","theme":false,"count":3,"files":[{"p":"v4.18.2_2026-11-22_布局收敛与导出搜索/v4.18.2_2026-11-22_发布说明.md","n":"v4.18.2_2026-11-22_发布说明.md","d":"2026-11-22","sz":2215,"t":"# v4.18.2 发布说明 · 布局收敛与导出搜索\n\n**日期**：2026-11-22\n**线上**：https://yuzikaaang.github.io/class-site/\n\n## 这一版做的两件事\n\n### 一、成绩分析板块布局收敛\n\n**标签与工具栏分层**\n- 四个标签（全班成绩单 / 我的画像 / 平时成绩 / 成绩对比）挪到**最顶层**\n- 「导出图片 / 打印 / 分享 / 链接 / 缓存离线」这排**大考专属按钮**只在选中「全班成绩单」时才显示\n- 平时成绩、我的画像、成绩对比这些标签下，用不上的按钮**压根不摆出来**（原来一直杵在上面）\n\n**平时成绩内部改成\"选一科看一科\"**\n- 去掉「总览 / 记录 / 分析 / 目标」四个平铺标签，也去掉六科卡片全列\n- 改成顶部一个**科目下拉**：选哪一科，下方就显示那一科的趋势大图、逐次记录、本科目标、本科一句话分析\n- 本科目标可**单独保存**，不必再进独立的目标页改全部\n- 概览（目标进度 / 最近录入 / 快速录入）和全局 AI 分析仍保留在最上、最下\n\n**学期切换改成下拉**\n- 原来一排六个学期胶囊占地方，改为「学期：高二上（本学期）▾」下拉框选一个（含\"全部三年\"）\n\n### 二、作业导出排序与搜索\n- 导出期次列表改为**最新在最上面**（原来最新的排最后，作业多了要往下翻）\n- 导出弹窗默认只勾**最新一期**\n- 导出弹窗新增**搜索框**，输入期次名称（如「第11周」「周末」）实时过滤，勾选状态按期次 id 记录，搜索过滤后不会串位\n\n## 明暗适配\n两处新 UI（下拉框、单科卡、搜索框）全部走站点 CSS 变量，`color-scheme` 跟随昼夜，浅色/深色都已截图验证。\n\n## 验证\n- e2e **3618 项全通过**（新增 10 条 v4.18.2 断言）\n- 真实浏览器验收 **18 项全通过**：标签顺序、工具栏按标签显隐、科目/学期下拉、切科只看单科、导出排序、搜索过滤、勾选不错位、明暗——无 JS 错误\n- 线上复核：版本 4.18.2、`pg.css?v=4182`、新逻辑均已生效\n\n## 版本说明\n按站主规矩，v4.18 系列首发不足 6 小时，本次仍为**小版本 v4.18.2**。\n"},{"p":"v4.18.2_2026-11-22_布局收敛与导出搜索/v4.18.2_2026-11-22_平时成绩-暗色模式.png","n":"v4.18.2_2026-11-22_平时成绩-暗色模式.png","d":"2026-11-22","sz":347987,"u":"a/f16ca0fe6ae81d86.jpg"},{"p":"v4.18.2_2026-11-22_布局收敛与导出搜索/v4.18.2_2026-11-22_平时成绩-科目学期下拉.png","n":"v4.18.2_2026-11-22_平时成绩-科目学期下拉.png","d":"2026-11-22","sz":382441,"u":"a/07e25bbcef082cac.jpg"}]},{"dir":"v4.18.1_2026-11-22_平时成绩按学期查看","ver":"v4.18.1","date":"2026-11-22","title":"平时成绩按学期查看","theme":false,"count":2,"files":[{"p":"v4.18.1_2026-11-22_平时成绩按学期查看/v4.18.1_2026-11-22_发布说明.md","n":"v4.18.1_2026-11-22_发布说明.md","d":"2026-11-22","sz":2090,"t":"# v4.18.1 发布说明 · 平时成绩按学期查看\n\n**日期**：2026-11-22\n**线上**：https://yuzikaaang.github.io/class-site/\n\n## 背景\n平时成绩功能于 v4.18.0 上线后，三年记录堆在一起太多。本次给它加上「学期」维度：默认只看本学期，可切到任意学期或全部三年。\n\n## 做了什么\n\n### 学期从哪来（零新增后台项）\n复用班级岛后台已经填好的三个字段来推算，不用再单独 set 学期范围：\n- **高一入学日** → 定「高一上」的起点年份\n- **学期名称**（如「2026 年秋季 · 高二上」）→ 定当前落在哪一期\n- **开学日 / 学期结束日** → 覆盖当前学期的实际起止（后台填了就以它为准）\n\n按秋季 9/1～次年 1/31、春季 2/1～7/31 的规律，自动推出高中三年六个学期：高一上 / 高一下 / 高二上 / 高二下 / 高三上 / 高三下。\n\n### 使用方式\n- 平时成绩面板顶部多了一条**学期切换胶囊**：六个学期 + 「全部三年」，当前学期高亮并带「本学期」小标\n- 下方提示当前范围起止日期与记录条数\n- 初始默认落在**当前学期**（由后台学期名/日期判定）\n- 切换学期后，总览、记录、趋势图、AI 分析**都只看当前学期**的数据\n\n### 几个细节\n- 每条记录按日期**自动归期**，不写死在记录里——以后改了学期配置，归属自动跟着变\n- 寒暑假的记录（如 8 月）归到相邻学期，**不会消失**\n- 切到历史学期录入时，日期默认落在该学期内，录完自动留在当前学期，**刚录的立刻能看到**\n- 明暗两套外观完整适配\n\n## 验证\n- e2e 3608 项全通过（含 7 条学期功能断言）\n- 真实浏览器验收 16 项全通过（学期推算 / 归期 / 过滤 / 切换 / 录入归期 / 明暗），无 JS 错误\n- 线上复核：版本号 4.18.1、app.min.js 学期逻辑、pg.css 学期样式均已生效\n\n## 版本说明\n按站主发版规矩，v4.18 系列首发不足 6 小时，本次作为**小版本 v4.18.1** 发布（未升中版本）。\n"},{"p":"v4.18.1_2026-11-22_平时成绩按学期查看/v4.18.1_2026-11-22_平时成绩-学期切换条.png","n":"v4.18.1_2026-11-22_平时成绩-学期切换条.png","d":"2026-11-22","sz":241429,"u":"a/675fbdc2f2fa3a87.jpg"}]},{"dir":"v4.18.0_2026-11-22_平时成绩个人趋势记录与分析","ver":"v4.18.0","date":"2026-11-22","title":"平时成绩个人趋势记录与分析","theme":false,"count":3,"files":[{"p":"v4.18.0_2026-11-22_平时成绩个人趋势记录与分析/v4.18.0_2026-11-22_发布说明.md","n":"v4.18.0_2026-11-22_发布说明.md","d":"2026-11-22","sz":1904,"t":"# v4.18.0 发布说明 · 平时成绩\n\n- 版本：v4.18.0\n- 日期：2026-11-22\n- 入口：成绩分析板块 →「我的画像」旁的「平时成绩」标签\n\n## 本次内容\n- 新增个人私有的「平时成绩」板块，紧挨「我的画像」，本人手动记录每次小测分数。\n- 按「日期 × 单科」逐条记录：考试名称、类型、得分、满分、班级/年级排名、每科反思；留空科目不保存、不计入趋势。\n- 六科各一张大趋势折线图，可左右跟手滑动看每次明细，也能一键缩小看总趋势；点圆点看当次详情；含目标虚线、进退步标注与达标对照。\n- 目标分数（生化标注原始分）、目标进度条、达标胶囊、AI 学情分析与本地规则分析。\n- 明暗双模式完整适配；数据仅保存在本人账号下、按账号隔离，换设备登录仍可查看。\n\n## 数据与安全\n- 本地键：`cls_grade_log_v1`（记录）、`cls_grade_goals_v1`（目标），已进前端 CLOUD_KEYS 与后端白名单，随个人数据通道云同步。\n- 服务端按 `user_id` 隔离，前端无「看别人」入口。\n- AI 分析只发送脱敏分数（不含姓名），可离线使用本地规则分析。\n\n## 验收\n- e2e：3601 项全部通过（含 v4.18.0 专项 10 项）。\n- 浏览器真实渲染：23 项全通过（标签位置、录入、六科趋势图、滑动、明暗配色、深链、按科编辑）。\n- 部署门禁：全部通过；线上 version.json / pg.css / app.min.js / Worker x-api-ver 均为 4.18.0。\n\n## 改动文件\n前端：`index.html`（标签+CSS 引用）、`pg.css`（新建）、`app.js`/`app.min.js`（PG 模块+接入）、`sw.js`（预缓存）、`.github/workflows/deploy-pages.yml`（发布清单）。\n后端：`api/data.js`（白名单+分类）。\n版本：`admin-3.js`、`version.json`、`README.md`、`scripts/build.mjs`、`test_e2e.mjs`。\n"},{"p":"v4.18.0_2026-11-22_平时成绩个人趋势记录与分析/v4.18.0_2026-11-22_平时成绩-明亮模式.png","n":"v4.18.0_2026-11-22_平时成绩-明亮模式.png","d":"2026-11-22","sz":409838,"u":"a/4a03b29e2bbff8a2.jpg"},{"p":"v4.18.0_2026-11-22_平时成绩个人趋势记录与分析/v4.18.0_2026-11-22_平时成绩-暗色模式.png","n":"v4.18.0_2026-11-22_平时成绩-暗色模式.png","d":"2026-11-22","sz":373282,"u":"a/f961dd9db4afef2c.jpg"}]},{"dir":"v4.17.2_2026-11-20_暗色模式作业编辑字色修复","ver":"v4.17.2","date":"2026-11-20","title":"暗色模式作业编辑字色修复","theme":false,"count":1,"files":[{"p":"v4.17.2_2026-11-20_暗色模式作业编辑字色修复/v4.17.2_2026-11-20_暗色模式作业编辑字色清晰.png","n":"v4.17.2_2026-11-20_暗色模式作业编辑字色清晰.png","d":"2026-11-20","sz":250374,"u":"a/2ec2489e941644f2.jpg"}]},{"dir":"v4.17.1_2026-11-20_作业双向自动同步-每分钟检测云端","ver":"v4.17.1","date":"2026-11-20","title":"作业双向自动同步-每分钟检测云端","theme":false,"count":2,"files":[{"p":"v4.17.1_2026-11-20_作业双向自动同步-每分钟检测云端/v4.17.1_2026-11-20_大屏模式每分钟同步.png","n":"v4.17.1_2026-11-20_大屏模式每分钟同步.png","d":"2026-11-20","sz":405886,"u":"a/c7aebf5bd947e5a6.jpg"},{"p":"v4.17.1_2026-11-20_作业双向自动同步-每分钟检测云端/v4.17. ound:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}\n  .card .n{font-size:1.55rem;font-weight:900;letter-spacing:-.02em}\n  .card .l{color:var(--fg3);font-size:.78rem;margin-top:2px}\n  .card.ok .n{color:var(--ok)} .card.warn .n{color:var(--warn)} .card.bad .n{color:var(--bad)}\n  table{width:100%;border-collapse:collapse;margin:14px 0;font-size:.9rem;background:var(--panel);\n        border:1px solid var(--line);border-radius:10px;overflow:hidden}\n  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}\n  th{background:#f7f1ea;font-size:.78rem;letter-spacing:.04em;color:var(--fg2);font-weight:800}\n  tr:last-child td{border-bottom:0}\n  td.c{white-space:nowrap}\n  .tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:.72rem;font-weight:800;white-space:nowrap}\n  .t-ok{background:var(--ok-bg);color:var(--ok)}\n  .t-fix{background:var(--accent-bg);color:var(--accent)}\n  .t-warn{background:var(--warn-bg);color:var(--warn)}\n  .t-bad{background:var(--bad-bg);color:var(--bad)}\n  .issue{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);\n         border-radius:10px;padding:16px 18px;margin:16px 0}\n  .issue h3{margin:0 0 6px;font-size:.98rem}\n  .issue .row{display:grid;grid-template-columns:64px 1fr;gap:8px;margin:7px 0;font-size:.9rem}\n  .issue .row b{color:var(--fg3);font-weight:800;font-size:.8rem;padding-top:2px}\n  .note{background:var(--accent-bg);border:1px solid #f3d5bf;border-radius:10px;padding:12px 16px;margin:16px 0;font-size:.9rem;color:#7c3b12}\n  footer{margin-top:52px;padding-top:18px;border-top:1px solid var(--line);color:var(--fg3);font-size:.8rem}\n  @media print{body{background:#fff}.issue,.card,table{break-inside:avoid}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<header>\n  <div class=\"kicker\">Quality Review<\/div>\n  <h1>班级服务站 · 全站检查报告<\/h1>\n  <div class=\"meta\">\n    检查版本 <b>v4.16.5<\/b>（2026-11-16）　·　覆盖 <b>普通模式 / 大屏模式 / 管理后台<\/b>　·　方式：逐入口实测 + 自动化断言 + 真实云端数据\n  <\/div>\n<\/header>\n\n<div class=\"cards\">\n  <div class=\"card\"><div class=\"n\">35<\/div><div class=\"l\">普通模式入口走查<\/div><\/div>\n  <div class=\"card\"><div class=\"n\">28<\/div><div class=\"l\">后台页面走查<\/div><\/div>\n  <div class=\"card\"><div class=\"n\" id=\"k-assert\">4346<\/div><div class=\"l\">自动化断言通过<\/div><\/div>\n  <div class=\"card bad\"><div class=\"n\">4<\/div><div class=\"l\">发现并修复的问题<\/div><\/div>\n  <div class=\"card ok\"><div class=\"n\">0<\/div><div class=\"l\">遗留崩溃 / 数据丢失<\/div><\/div>\n<\/div>\n\n<h2>一、结论先说<\/h2>\n<p>整站主流程可用，没有发现数据丢失、权限绕过或页面崩溃级别的问题。这一轮查出 <b>4 个真实缺陷<\/b>，都已修复并回归：<\/p>\n<ol>\n  <li><b>「截止后隐藏」填 0 时行为反了<\/b>：说明写的是「0 = 不自动收起」，实际是一过截止立刻收起。<\/li>\n  <li><b>阈值输入框清空后保存会悄悄关掉功能<\/b>：空字符串被 <code>Number()<\/code> 算成 0，原值被覆盖。<\/li>\n  <li><b>后台快速连点侧栏时个别页会空着<\/b>：异步数据回来时容器已随页面切走，<code>innerHTML<\/code> 命中 null 抛错（成绩分析、通用弹窗两处）。<\/li>\n  <li><b>大屏左下角的版本号停在上一版<\/b>：按钮里的文字是写死的，发版时没跟着改，线上一直显示 4.16.4（点它查更新又说是最新，自相矛盾）。<\/li>\n<\/ol>\n<p>另外发现 <b>3 个专项测试的日期写死<\/b>（11 月 14–15 日），跨过这两天之后断言全部扑空——看起来像产品坏了，实际是测试数据过期。已改成跟随当天，重新跑通。<\/p>\n\n<h2>二、检查范围与方法<\/h2>\n<table>\n  <thead><tr><th style=\"width:110px\">范围<\/th><th>怎么查的<\/th><th style=\"width:150px\">覆盖量<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td>普通模式<\/td><td>逐个调用入口函数（公告栏与四类筛选、全部公告弹窗的搜索/时间范围、八个板块、登录、全站设置、数据管理、导入导出、文件中转站、班级签、游戏大厅、隐藏空间、云数据），捕获 <code>pageerror<\/code> 与 <code>console.error<\/code>，并检查弹窗是否真的打开、列表条数是否随筛选变化<\/td><td>35 个入口<\/td><\/tr>\n    <tr><td>大屏模式<\/td><td>真实数据渲染作业看板：考试卡（跨整行、逐科变灰）、截止提醒与「已截止」折叠、设置面板（只读态、阈值边界 0/1440/小数/清空）、分贝仪面板、同步提示、更新弹窗三条规则<\/td><td>6 组专项<\/td><\/tr>\n    <tr><td>管理后台<\/td><td>真实管理员账号登录，桌面 1440 与手机 390 各走一遍 28 个页面：渲染字数、控制台报错、横向溢出；再叠加「快速切页」竞态扫描<\/td><td>28 页 × 2 尺寸<\/td><\/tr>\n    <tr><td>接口层<\/td><td>读 <code>hw-save<\/code> / <code>hw-prefs<\/code> 的入参校验（非数组、超大、脏 id、越界阈值），确认不会整包冲掉云端<\/td><td>2 条通道<\/td><\/tr>\n    <tr><td>回归<\/td><td>仓库内全部测试脚本（含历史专项）逐条重跑，失败项逐条定位是产品问题还是脚本过期<\/td><td id=\"k-scripts\">36 个脚本<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<div class=\"note\">\n  <b>关于测试环境<\/b>：本地预览地址不在后端白名单里，直接用浏览器打开会被 CORS 拦掉全部接口。这次巡检把 <code>/api/**<\/code> 在服务端转发到线上后端，页面拿到的是真实公告、真实作业、真实成绩，不是假数据。\n<\/div>\n\n<h2>三、问题详情与修复<\/h2>\n\n<div class=\"issue\">\n  <h3>① 「截止后隐藏」填 0，反而一过截止就收进「已截止」<span class=\"tag t-fix\">已修<\/span><\/h3>\n  <div class=\"row\"><b>现象<\/b><div>设置面板里把「截止后 n 分钟隐藏」填 0，按旁边说明是「不自动收起」，实际任何过期项立刻被折叠。<\/div><\/div>\n  <div class=\"row\"><b>根因<\/b><div>判定写成「过了多久 ≥ 阈值」：阈值 0 时不等式恒成立。<code>isDueHidden()<\/code> 少了「0 表示关闭」这一档——同一份文件里的「截止前提醒」有这档（<code>w &gt; 0<\/code>），隐藏那侧漏了。<\/div><\/div>\n  <div class=\"row\"><b>修法<\/b><div>阈值 0 直接返回「不收起」，其余按分钟比较。<\/div><\/div>\n  <div class=\"row\"><b>验证<\/b><div>四项阈值组合实测：默认（30/60）正文两项 + 折叠一项；提醒 0 不再闪；<b>收起 0 时三项都留在正文<\/b>；收起 1440 时也不收。<\/div><\/div>\n<\/div>\n\n<div class=\"issue\">\n  <h3>② 阈值输入框清空后保存，功能被悄悄关掉<span class=\"tag t-fix\">已修<\/span><\/h3>\n  <div class=\"row\"><b>现象<\/b><div>误删输入框里的数字后点保存，这一项变成 0（等于关闭），原值丢失且没有提示。<\/div><\/div>\n  <div class=\"row\"><b>根因<\/b><div><code>Number('') === 0<\/code>，归一函数把「没填」与「明确填 0」当成同一件事；前后端各有一份同样的归一逻辑。<\/div><\/div>\n  <div class=\"row\"><b>修法<\/b><div>空串 / null 按「维持原值」处理，要关掉就明确填 0；前端 <code>hwSetNum<\/code> 与后端 <code>hwPrefNum<\/code> 同步改，口径一致。<\/div><\/div>\n  <div class=\"row\"><b>验证<\/b><div>「-5 / 9999」→ 0 / 1440；「清空 / 清空」→ 保留 30 / 60；「30.6 / 59.4」→ 31 / 59；保存请求体与云端回写一致。<\/div><\/div>\n<\/div>\n\n<div class=\"issue\">\n  <h3>③ 后台快速切页，个别页面空着并报错<span class=\"tag t-fix\">已修<\/span><\/h3>\n  <div class=\"row\"><b>现象<\/b><div>在后台连点侧栏，偶尔某一页只剩空白，控制台报 <code>Cannot set properties of null (setting 'innerHTML')<\/code>。<\/div><\/div>\n  <div class=\"row\"><b>根因<\/b><div>成绩分析、通用弹窗两处的异步回调直接写 <code>$('scBody')<\/code> / <code>$('popBody')<\/code>。请求回来时页面已切走，容器被替换，取到 null。<\/div><\/div>\n  <div class=\"row\"><b>修法<\/b><div>写页面前先确认容器还在（取一次变量、判空即退出），成功与失败两个分支都覆盖；事件绑定也改用同一个变量。<\/div><\/div>\n  <div class=\"row\"><b>验证<\/b><div>28 个页面逐个「打开 → 120 毫秒后切走」的竞态扫描：修复前稳定复现 2 处，修复后 <b>0 报错<\/b>。<\/div><\/div>\n<\/div>\n\n<div class=\"issue\">\n  <h3>④ 大屏左下角版本号停在上一版<span class=\"tag t-fix\">已修<\/span><\/h3>\n  <div class=\"row\"><b>现象<\/b><div>线上已发到 4.16.5，大屏左下角仍显示 <code>v4.16.4<\/code>；点一下「检查是否为最新」却回答「已是最新」—— 两个说法对不上。<\/div><\/div>\n  <div class=\"row\"><b>根因<\/b><div>按钮里的版本文本是写死在 HTML 里的，只有「进过作业页」才会被脚本改成 <code>SITE_VERSION<\/code>；没进过就一直显示发版那天写的那串。<\/div><\/div>\n  <div class=\"row\"><b>修法<\/b><div>页面一启动就按 <code>SITE_VERSION<\/code> 把按钮文本摆正，不再依赖是否进过作业页；构建脚本顺带把按钮里的静态文本同步成当前版本，两层兜底。<\/div><\/div>\n  <div class=\"row\"><b>验证<\/b><div>本地与大屏尺寸实测：按钮显示 <code>v4.16.5<\/code>，与页脚、<code>version.json<\/code>、<code>sw.js<\/code>、后端 <code>X-Api-Ver<\/code> 五处一致。<\/div><\/div>\n<\/div>\n\n<h2>四、逐模块检查结果<\/h2>\n\n<h3>普通模式<\/h3>\n<table>\n  <thead><tr><th style=\"width:150px\">模块<\/th><th>检查内容<\/th><th style=\"width:78px\">结论<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td>班级岛<\/td><td>今日/明日切换、课程与调课、照片、天气逐小时<\/td><td class=\"c\"><span class=\"tag t-ok\">正常<\/span><\/td><\/tr>\n    <tr><td>公告栏<\/td><td>四类筛选条数与云端分类一致；全部公告弹窗的搜索（命中 1 条 / 无结果提示）、时间范围（近 7 天 7 条）、分类分组折叠<\/td><td class=\"c\"><span class=\"tag t-ok\">正常<\/span><\/td><\/tr>\n    <tr><td>常用服务 / 八个板块<\/td><td>逐个打开，卡片渲染、跳转链接、板块横幅、卡片展开/收起<\/td><td class=\"c\"><span class=\"tag t-ok\">正常<\/span><\/td><\/tr>\n    <tr><td>作业弹窗<\/td><td>本周作业渲染、打勾与本地保存、逾期标红；管理员入口对非管理员给出提示<\/td><td class=\"c\"><span class=\"tag t-ok\">正常<\/span><\/td><\/tr>\n    <tr><td>成绩分析<\/td><td>未登录给出登录引导；登录后图表、折叠、打印样式<\/td><td class=\"c\"><span class=\"tag t-ok\">正常<\/span><\/td><\/tr>\n    <tr><td>全站设置<\/td><td>六个分页、字号、背景、动效、排序、导入导出、数据管理<\/td><td class=\"c\"><span class=\"tag t-ok\">正常<\/span><\/td><\/tr>\n    <tr><td>文件中转站<\/td><td>发文件 / 发文本 / 取件 / 历史四个分页，拖拽区与期限选项<\/td><td class=\"c\"><span class=\"tag t-ok\">正常<\/span><\/td><\/tr>\n    <tr><td>全屏时钟<\/td><td>五个标签、数字与翻页、正计时 / 倒计时 / 番茄钟、记录三级折叠、导出；手机与宽屏布局<\/td><td class=\"c\"><span class=\"tag t-ok\">正常<\/span><\/td><\/tr>\n    <tr><td>隐藏娱乐天地<\/td><td>入口、游戏列表、排行榜、点歌券<\/td><td class=\"c\"><span class=\"tag t-ok\">正常<\/span><\/td><\/tr>\n    <tr><td>版本更新<\/td><td>线上版本更高时弹窗、深链不弹、同版本不弹<\/td><td class=\"c\"><span class=\"tag t-ok\">正常<\/span><\/td><\/tr>\n    <tr><td>手机端布局<\/td><td>390 宽逐板块检查横向溢出<\/td><td class=\"c\"><span class=\"tag t-ok\">0 溢出<\/span><\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h3>大屏模式<\/h3>\n<table>\n  <thead><tr><th style=\"width:150px\">模块<\/th><th>检查内容<\/th><th style=\"width:78px\">结论<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td>考试卡<\/td><td>跨整行、日期打头各科并排、1920 / 1366 / 手机三种宽度、无考试不占位；<b>按单场结束时间逐科变灰<\/b>（上午两场灰、晚上场亮、整天未结束日期不灰）<\/td><td class=\"c\"><span class=\"tag t-ok\">正常<\/span><\/td><\/tr>\n    <tr><td>截止提醒<\/td><td>剩 10 分钟出呼吸框并写「还剩 N 分钟」；刚过点留在正文标红；超过阈值才进「已截止」折叠，默认为收起<\/td><td class=\"c\"><span class=\"tag t-ok\">正常<\/span><\/td><\/tr>\n    <tr><td>看板设置<\/td><td>只读态也能改阈值、日期框置灰并说明、显示最后修改人；边界值归一<\/td><td class=\"c\"><span class=\"tag t-fix\">已修 2 处<\/span><\/td><\/tr>\n    <tr><td>分贝仪<\/td><td>底部最右侧、呼吸灯、四档说明、点数字开面板、无麦克风时显示占位<\/td><td class=\"c\"><span class=\"tag t-ok\">正常<\/span><\/td><\/tr>\n    <tr><td>同步<\/td><td>未登录也上传、按 id 合并、成功绿色 / 失败红色提示、失败保留本机改动等补传<\/td><td class=\"c\"><span class=\"tag t-ok\">正常<\/span><\/td><\/tr>\n    <tr><td>时钟<\/td><td>自校正走秒、秒数不变不写 DOM、离开页面清定时器<\/td><td class=\"c\"><span class=\"tag t-ok\">正常<\/span><\/td><\/tr>\n    <tr><td>版本号<\/td><td>左下角显示与 <code>SITE_VERSION<\/code> 一致；点击可查线上版本<\/td><td class=\"c\"><span class=\"tag t-fix\">已修<\/span><\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h3>管理后台<\/h3>\n<table>\n  <thead><tr><th style=\"width:150px\">模块<\/th><th>检查内容<\/th><th style=\"width:78px\">结论<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td>数据概览<\/td><td>注册数、今日登录、7 天活跃、待改密码、待审信息<\/td><td class=\"c\"><span class=\"tag t-ok\">正常<\/span><\/td><\/tr>\n    <tr><td>成员与档案<\/td><td>列表、筛选、字段管理、导入导出入口、加密状态<\/td><td class=\"c\"><span class=\"tag t-ok\">正常<\/span><\/td><\/tr>\n    <tr><td>班级内容<\/td><td>公告 / 资料 / 作业混排列表、分类筛选、搜索；数据量与加载耗时<\/td><td class=\"c\"><span class=\"tag t-warn\">加载偏慢<\/span><\/td><\/tr>\n    <tr><td>成绩分析<\/td><td>考试列表、成绩表、折叠、发布状态<\/td><td
