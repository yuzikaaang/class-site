_线上作业页.png","n":"v4.10.11_2026-11-08_线上作业页.png","d":"2026-11-08","sz":803982,"u":"a/101cac3eaa58fb2a.jpg"}]},{"dir":"v4.10.5_2026-11-07_放假天数两头按实际算-点名可查看名单-成绩与点名离线","ver":"v4.10.5","date":"2026-11-07","title":"放假天数两头按实际算-点名可查看名单-成绩与点名离线","theme":false,"count":1,"files":[{"p":"v4.10.5_2026-11-07_放假天数两头按实际算-点名可查看名单-成绩与点名离线/v4.10.5_2026-11-07_班级电脑部署方案-v4.8.md","n":"v4.10.5_2026-11-07_班级电脑部署方案-v4.8.md","d":"2026-11-07","sz":7557,"t":"# 班级电脑部署方案 · 实施报告\n\n> 版本依据：站点 v4.8.1（2026-11-07）\n> 适用设备：教室希沃 / 鸿合一类 Windows 一体机，长期无网、配置中等偏低\n> 阅读顺序：先看第四节「推荐方案」，再看第五节「实施步骤」照着做\n\n---\n\n## 一、现状\n\n| 项目 | 现状 |\n|---|---|\n| 系统盘 | 仍在使用 C 盘 |\n| 打开方式 | 浏览器安装 PWA（可加到桌面/任务栏） |\n| 网络 | 大多数时间无网，偶尔能连 |\n| 流畅度 | 开启轻量模式后，滑动、打字无明显卡顿；抽取动画尚未实测 |\n| 已具备 | 离线包（Service Worker）、全屏、轻量模式、横屏 |\n\n## 二、这次要解决的四件事\n\n1. **一步进站**：开机后点一下就能进大屏，不用先开浏览器再输网址。\n2. **断网可用**：没网也能打开、能看作业、能点名。\n3. **不被还原**：一体机常装冰点还原 / 还原卡，重启后 C 盘改动会消失。\n4. **全屏不丢**：从作业页跳到时钟页，全屏不应退出（v4.8 已修，见第六节）。\n\n## 三、三种方案对比\n\n| 方案 | 做法 | 抗还原 | 断网可用 | 实现难度 | 风险 |\n|---|---|---|---|---|---|\n| **A. C 盘 PWA** | 浏览器「安装应用」，桌面生成图标 | 差（重启可能丢） | 可以（离线包在浏览器 Profile 里，Profile 在 C 盘也会丢） | 低 | 还原后要重装 |\n| **B. D 盘启动器**（推荐） | D 盘放一个 `.bat`，用独立 `--user-data-dir` 启动 Chrome/Edge | **好**（Profile 在 D 盘，还原卡一般不动） | 可以 | 中 | 需要知道浏览器安装路径 |\n| **C. D 盘便携浏览器** | D 盘放整套便携版 Chrome | 最好 | 可以 | 高（要拷 200MB+，且班级电脑下载不了） | 拷贝麻烦 |\n\n结论：**优先 B**。A 作为「没有还原卡时的最简方案」保留；C 只在前两种都失败时考虑。\n\n## 四、推荐方案（B：D 盘启动器）\n\n核心思路：**让浏览器的「个人数据目录」落在 D 盘**。这样即使 C 盘被还原，缓存、离线包、登录态、字号设置都还在，打开即用。\n\n### 需要准备的东西\n\n- 一个 U 盘（把文件从家里电脑带到班级电脑）\n- 班级电脑上已装的 Chrome 或 Edge（希沃一般自带 Edge）\n\n### 文件清单\n\n| 文件 | 作用 |\n|---|---|\n| `启动大屏.bat` | 双击即可打开大屏，自动带上 `?big=1` |\n| `D:\\ClassSite\\profile\\` | 浏览器个人数据目录（脚本会自动建） |\n\n## 五、实施步骤（先在家里的电脑试一遍）\n\n### 步骤 0：在家电脑上生成启动器\n\n1. 打开站点 → 进入后台 → 「站点信息 / 站点资源」→ 点「下载大屏启动器」。\n   下载得到 `启动大屏.bat`（脚本里已经写好 6 个常见浏览器路径的探测顺序）。\n2. 双击试运行一次：应弹出独立窗口并直接进大屏。\n3. 如果没反应，用记事本打开 `.bat`，确认里面的浏览器路径与你电脑一致（见「排查」一节）。\n\n### 步骤 1：把文件带到班级电脑\n\n1. U 盘里放：`启动大屏.bat`。\n2. 在班级电脑上建目录：`D:\\ClassSite\\`，把 bat 放进去。\n\n### 步骤 2：首次运行（必须联网一次）\n\n1. 班级电脑连一次网（手机热点也可以）。\n2. 双击 `启动大屏.bat`，等待页面完全加载。\n3. **停留在页面上 30 秒以上**，让离线包下载完（右下角/控制台不需要操作，等即可）。\n4. 这一步只做一次；之后断网也能打开。\n\n### 步骤 3：确认 Profile 落位\n\n打开 `D:\\ClassSite\\profile\\`，应能看到 `Default`、`Local Storage` 等目录。\n若没有，说明启动器没带上 `--user-data-dir`，回到步骤 0 检查脚本内容。\n\n### 步骤 4：桌面快捷方式\n\n右键 `启动大屏.bat` → 发送到 → 桌面快捷方式。\n（不要直接给 `.bat` 建 `.lnk` 指向浏览器 exe —— 历史上「没有 program 文件」的报错就是这么来的。）\n\n### 步骤 5：冻结后验证\n\n重启一次电脑（触发还原），再双击桌面图标：\n\n- 能直接进大屏 → 方案生效\n- 又回到首次加载状态 → 说明 D 盘也被还原，改用方案 A 或找电教老师要一个不被还原的分区\n\n## 六、验收清单\n\n| # | 检查项 | 期望结果 |\n|---|---|---|\n| 1 | 断网双击图标 | 10 秒内出现大屏 |\n| 2 | 作业页 → 点时钟 | 跳到时钟页且**保持全屏**（v4.8 新增） |\n| 3 | 作业页全屏按钮 | 任务栏被盖住，Esc 可退出 |\n| 4 | 字号 A− / A+ | 每次变化 5%，中间数字可直接输入 |\n| 5 | 抽取一次 | 卡片颜色按学号段分段，不出现全场同色 |\n| 6 | 前台点「进入后台」 | 一次点击直达，不再需要点两次 |\n| 7 | 轻量模式开启 | 侧栏三个开关文字完整、不溢出 |\n| 8 | 重启电脑后再打开 | 免登录 / 字号 / 主题仍在 |\n\n## 七、排查\n\n| 现象 | 原因 | 处理 |\n|---|---|---|\n| 提示「没有 program 文件」 | 快捷方式指向了不存在的浏览器 exe | 用 `.bat` 启动器，不要手工建 `.lnk` |\n| 双击闪一下就没了 | 浏览器路径不对 | 记事本打开 bat，改成实际路径（`C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe` 等） |\n| 断网打开是白屏 | 首次没等离线包下完 | 联网重开一次，停留 30 秒 |\n| 全屏后跳页面退出全屏 | 旧版本 | 升级到 v4.8 及以上 |\n| 字体、字号每次都要重设 | Profile 不在 D 盘 | 检查 `--user-data-dir` 是否生效 |\n\n## 八、配额与容量（第 14 条）\n\n### 当前用量（2026-11-07 实测）\n\n| 数据表 | 行数 |\n|---|---|\n| 用户 `users` | 65 |\n| 档案 `profiles` | 65 |\n| 个人数据 `user_data` | 78 |\n| 考试 `exams` / 成绩 `exam_scores` | 5 / 301 |\n| 歌单时长 `song_durations` | 119 |\n| 投票 `class_votes` / 选票 | 0 / 0 |\n\n按现有结构估算，整库（含索引与历史版本）远小于 20 MB。\n\n### 免费额度对照\n\n| 服务 | 免费额度 | 当前占用 | 余量 |\n|---|---|---|---|\n| Neon（Postgres） | 0.5 GB 存储 | < 20 MB | 约 25 倍以上 |\n| Neon 计算时间 | 191.9 小时/月 | 仅在有请求时唤醒 | 充足（大屏白天在线会持续唤醒，按每天 8 小时估约 240 小时——**这是唯一需要盯的一项**） |\n| Cloudflare Workers | 10 万次/天 | 见下 | 充足 |\n| GitHub Pages | 100 GB/月 软限 | 页面+脚本约 2 MB/次首访 | 充足 |\n\n### 请求量估算\n\n- 大屏模式的作业同步是 **每 12 秒一次**，且只在「大屏模式开着」时轮询、断网自动跳过。\n- 每台大屏按每天 8 小时计：`8 × 3600 ÷ 12 ≈ 2400 次/天`。\n- 手机端只在打开页面时请求，量级远小于此。\n- 即使同时开 5 台大屏，约 1.2 万次/天，占 10 万额度的 12%。\n\n### 结论与建议\n\n1. **存储不是瓶颈**，三年内的作业、成绩、点歌记录都到不了 0.5 GB。\n2. **唯一要留意的是 Neon 的计算时间**：免费版按「数据库醒着的时间」算。大屏整天开着会一直唤醒，如果某月超了，两条低成本做法：\n   - 把轮询从 12 秒放宽到 30 秒（作业同步延迟仍在半分钟内，请求量降到 40%）；\n   - 或者只在「作业页打开着」时轮询（现在是整个大屏模式都在轮询）。\n3. 若将来接了图片直传到数据库（不建议），才会真正吃存储 —— 现在图片走外链，不占库。\n\n---\n\n**下一步**：先在家电脑上做完步骤 0，确认 `.bat` 能拉起独立窗口；确认后再带去班级电脑做步骤 1–5。\n"}]},{"dir":"v4.10.1_2026-11-07_后台一键返回前台-登录验证码可开关-大屏标题上移","ver":"v4.10.1","date":"2026-11-07","title":"后台一键返回前台-登录验证码可开关-大屏标题上移","theme":false,"count":1,"files":[{"p":"v4.10.1_2026-11-07_后台一键返回前台-登录验证码可开关-大屏标题上移/v4.10.1_2026-11-07_大屏首页-标题上移.png","n":"v4.10.1_2026-11-07_大屏首页-标题上移.png","d":"2026-11-07","sz":602132,"u":"a/cdf843051befde3b.jpg"}]},{"dir":"v4.9.1_2026-11-07_全量缓存-大屏顶栏-文件中转站大改","ver":"v4.9.1","date":"2026-11-07","title":"全量缓存-大屏顶栏-文件中转站大改","theme":false,"count":1,"files":[{"p":"v4.9.1_2026-11-07_全量缓存-大屏顶栏-文件中转站大改/v4.9.1_2026-11-07_公告列表排序.png","n":"v4.9.1_2026-11-07_公告列表排序.png","d":"2026-11-07","sz":118552,"u":"a/8be7e1365c1b3c41.jpg"}]},{"dir":"v4.9.0_2026-11-07_490","ver":"v4.9.0","date":"2026-11-07","title":"（该版本更新摘要未收录，截图按原始留存归档）","theme":false,"count":5,"files":[{"p":"v4.9.0_2026-11-07_490/v4.9.0_2026-11-07_交付说明.md","n":"v4.9.0_2026-11-07_交付说明.md","d":"2026-11-07","sz":2716,"t":"# v4.9.0 交付说明（2026-11-07）\n\n## 这一版做了什么\n\n| # | 需求 | 结果 |\n|---|---|---|\n| 1 | 导出图片要先预览、能调字号 / 字体 / 排列 | 作业导出改为「先预览、后保存」弹窗 |\n| 2 | 导出图要美化 | 科目分色、打勾框、A4 纸面、统一 2 倍分辨率 |\n| 3 | 班徽导出背景变黑 | 定位为黑底矢量图，载入时识别并跳过，改用透明 PNG |\n| 4 | 作业前台可加图片 / 音频 / 视频附件 | 编辑弹窗新增图形化「添加附件」面板 |\n| 5 | 导出时图片显示照片、音视频给站内播放提示 | 图片按列宽等比绘制，音视频画二维码 + 「扫码在班级网站直接播放」 |\n| 6 | 班级签加历史日历、按签等分色、点击才看 | 近 90 天月历，吉 / 凡 / 平三色，点格子展开签文 |\n\n## 导出的五个可调项\n\n- **字号** 80% – 150%，步进 5%\n- **字体** 黑体 / 宋体 / 楷体 / 等宽\n- **排列** 单列 / 双列\n- **纸张** A4 竖版（补白到 1:1.414）/ 随内容（多长算多长）\n- **选项** 打勾框 / 科目分色 / 底部二维码，各自独立开关\n\n参数存在本机（`cls_hw_ex_style`），下次打开沿用上次设置；预览只是 CSS 缩小显示，保存出来的仍是 2 倍分辨率原图。\n\n## 班徽为什么黑\n\n仓库里的 `favicon.svg` 第一条 path 就是一块 `fill=\"black\"` 的圆角矩形，本身是「黑底白图」。网页上班徽套在白色圆形容器里，只能看到图案部分，所以看不出黑底；导出时把整张图直接贴到白纸上，就是一个黑方块。\n\n现在的处理：载入班徽后先画 48×48 采样，纯黑像素占不透明像素超过 45% 就判为黑底图，跳过它换下一个候选（`icons/badge-256.png` → `badge.png` → `/api/badge`）。同时导出时班徽外圈补了一层白色圆角底，浅色图案也不会糊在纸面上。\n\n## 附件怎么用\n\n作业编辑弹窗 →「📎 添加附件」→ 选类型（图片 / 音频 / 视频）→ 选挂到哪条任务 → 填说明和链接 → 插入。会生成一行：\n\n```\n📎 [音频] Unit 2 听力 | https://example.com/u2.mp3\n```\n\n保存后前台按附件显示；导出时图片直接画成照片，音频 / 视频画成二维码。\n\n## 班级签历史\n\n数据不新增存储：每天抽签本来就写了一条 `cls_sign_YYYY-MM-DD`，历史日历直接扫这些键。只显示最近 90 天，吉签黄、凡签蓝、平签粉，点某一天才在下方展开那天的签文。\n\n## 验收\n\n- e2e：3340 项全过（新增 7 条 v4.9.0 护栏）\n- 文案门禁：13 个文件 0 处口语\n- 发布门禁：版本号四处一致、云端版本记录与公告齐全\n- 截图：本目录 01–04\n"},{"p":"v4.9.0_2026-11-07_490/v4.9.0_2026-11-07_导出成品-A4.png","n":"v4.9.0_2026-11-07_导出成品-A4.png","d":"2026-11-07","sz":172297,"u":"a/f7ed6b0586ba0a36.jpg"},{"p":"v4.9.0_2026-11-07_490/v4.9.0_2026-11-07_导出预览-单列.png","n":"v4.9.0_2026-11-07_导出预览-单列.png","d":"2026-11-07","sz":198069,"u":"a/c52c3703bce0c0ff.jpg"},{"p":"v4.9.0_2026-11-07_490/v4.9.0_2026-11-07_导出预览-双列130%.png","n":"v4.9.0_2026-11-07_导出预览-双列130%.png","d":"2026-11-07","sz":210883,"u":"a/fd0f978ed0999ee5.jpg"},{"p":"v4.9.0_2026-11-07_490/v4.9.0_2026-11-07_班级签历史日历.png","n":"v4.9.0_2026-11-07_班级签历史日历.png","d":"2026-11-07","sz":140413,"u":"a/4a3d27522b5abf10.jpg"}]},{"dir":"v4.8.1_2026-11-07_481","ver":"v4.8.1","date":"2026-11-07","title":"（该版本更新摘要未收录，截图按原始留存归档）","theme":false,"count":4,"files":[{"p":"v4.8.1_2026-11-07_481/v4.8.1_2026-11-07_侧栏三开关不再溢出.png","n":"v4.8.1_2026-11-07_侧栏三开关不再溢出.png","d":"2026-11-07","sz":12676,"u":"a/0c763b586da6485f.jpg"},{"p":"v4.8.1_2026-11-07_481/v4.8.1_2026-11-07_字号可手输137%.png","n":"v4.8.1_2026-11-07_字号可手输137%.png","d":"2026-11-07","sz":86057,"u":"a/b595243509b0afc0.jpg"},{"p":"v4.8.1_2026-11-07_481/v4.8.1_2026-11-07_展开某个大版本.png","n":"v4.8.1_2026-11-07_展开某个大版本.png","d":"2026-11-07","sz":91176,"u":"a/2259aaa395806690.jpg"},{"p":"v4.8.1_2026-11-07_481/v4.8.1_2026-11-07_版本记录分组折叠.png","n":"v4.8.1_2026-11-07_版本记录分组折叠.png","d":"2026-11-07","sz":43094,"u":"a/69b65230ebbc6c65.jpg"}]},{"dir":"v4.7.9_2026-11-07_作业图片代理-班徽黑底-假期精确到分钟","ver":"v4.7.9","date":"2026-11-07","title":"作业图片代理-班徽黑底-假期精确到分钟","theme":false,"count":4,"files":[{"p":"v4.7.9_2026-11-07_作业图片代理-班徽黑底-假期精确到分钟/v4.7.9_2026-11-07_假期-放假第1天还剩1天.png","n":"v4.7.9_2026-11-07_假期-放假第1天还剩1天.png","d":"2026-11-07","sz":296103,"u":"a/461da9f310aeaef0.jpg"},{"p":"v4.7.9_2026-11-07_作业图片代理-班徽黑底-假期精确到分钟/v4.7.9_2026-11-07_假期-明日事项.png","n":"v4.7.9_2026-11-07_假期-明日事项.png","d":"2026-11-07","sz":277633,"u":"a/dace48cb6b3f1d17.jpg"},{"p":"v4.7.9_2026-11-07_作业图片代理-班徽黑底-假期精确到分钟/v4.7.9_2026-11-07_导出图-图片附件渲染成照片.png","n":"v4.7.9_2026-11-07_导出图-图片附件渲染成照片.png","d":"2026-11-07","sz":1242080,"u":"a/09c98961f3d5d4dd.jpg"},{"p":"v4.7.9_2026-11-07_作业图片代理-班徽黑底-假期精确到分钟/v4.7.9_2026-11-07_导出图-班徽透明底.png","n":"v4.7.9_2026-11-07_导出图-班徽透明底.png","d":"2026-11-07","sz":167671,"u":"a/21faf4f13c25bb98.jpg"}]},{"dir":"v4.7.8_2026-11-07_公告时间与排序修正","ver":"v4.7.8","date":"2026-11-07","title":"公告时间与排序修正","theme":false,"count":2,"files":[{"p":"v4.7.8_2026-11-07_公告时间与排序修正/v4.7.8_2026-11-07_公告并回一条.png","n":"v4.7.8_2026-11-07_公告并回一条.png","d":"2026-11-07","sz":136489,"u":"a/4e63b1adffd5bfa9.jpg"},{"p":"v4.7.8_2026-11-07_公告时间与排序修正/v4.7.8_2026-11-07_后台版本号.png","n":"v4.7.8_2026-11-07_后台版本号.png","d":"2026-11-07","sz":313607,"u":"a/dda0f4798180e195.jpg"}]},{"dir":"v4.7.4_2026-11-06_发布同步修补","ver":"v4.7.4","date":"2026-11-06","title":"发布同步修补","theme":false,"count":9,"files":[{"p":"v4.7.4_2026-11-06_发布同步修补/v4.7.4_2026-11-06_一言分类面板.png","n":"v4.7.4_2026-11-06_一言分类面板.png","d":"2026-11-06","sz":898945,"u":"a/1b920cc18768a607.jpg"},{"p":"v4.7.4_2026-11-06_发布同步修补/v4.7.4_2026-11-06_交付说明.md","n":"v4.7.4_2026-11-06_交付说明.md","d":"2026-11-06","sz":5322,"t":"# v4.7.4 验收说明\n\n本次共 6 件事，全部已上线。线上地址：https://yuzikaaang.github.io/class-site/\n\n> 为什么要发到 4.7.4：4.7.3 上线后发现「收拾痕迹」的两处小问题（抽取动画脚本的版本参数是手写的，升级后浏览器还会用旧脚本；时钟的周次缓存绑在首页某块卡片上）。这两处不修，改了等于白改，所以补一个 4.7.4。\n\n---\n\n## 1. 抽取颜色在班级电脑上全都一样\n\n**原因**：抽取的颜色是按学号末两位分段的（01–10 青、11–20 蓝……）。班级电脑常年无网，拉不到云端名单时会退回站内那份**只有姓名、没有学号**的名单，于是所有人算出来的都是 0 → 全部中性灰。你自己电脑有网，拉到的是带学号的那份，所以正常。\n\n**改法**：\n- 每次成功拉到云端名单，就在这台电脑存一份（含学号/身份/性别），断网直接用这份；\n- 连这份都没有时，按名单顺序补一个「显示序号」，只用来上色，**不写进学号**，学号筛选仍然按真学号走，不会被假号骗到。\n\n截图 `06-抽取配色（无学号兜底）.png` 是在「接口全部失败、只能走兜底」的环境下截的：颜色照常分段，图例也对得上。\n\n## 2. 作业字号 25% – 300%\n\n- 档位：25 / 35 / 50 / 65 / 80 / 100 / 120 / 145 / 175 / 210 / 255 / 300\n- 老用户存的是旧档位索引，语义变了（旧索引 2 = 100%，新索引 2 = 50%），所以做了换算：按「实际倍率最接近」映射，不会把 100% 读成 50%。\n- 截图 03 / 04 / 05 分别是 100% / 300% / 25%，25% 时卡片仍然可用（不重叠、不溢出）。\n\n## 3. 点名：不限成绩时，后面的名次条件没清掉\n\n**原因**：把考试切回「不限成绩」后，`名次/最小/最大` 这几个值还留在配置里。屏幕上虽然把输入框藏了，但顶部「条件：」那行还写着「总分名次 1–20」；更糟的是判定逻辑也还认它 —— 考试数据已经清空，于是**谁都抽不出来**。\n\n**改法**：\n- 切成「不限成绩」时，把名次 / 科目 / 最小 / 最大一起清空；\n- 老配置（已经存了残影的）在读取时也清一遍；\n- 判定与条件文案统一改成「选了考试 **且** 选了指标才算」。\n\n截图 `07-点名条件（不限成绩）.png`：条件栏只剩「学生」，没有名次残影。\n\n## 4. 作业刷新是无感的，不会把正在打的字冲掉\n\n**原因**：原来只判断「光标是不是在输入框里」。你一点到别处（框里还是半截话、失焦事件也没触发），它就认为「没在编辑」，接着整页重绘 —— 输入框连同里面的字一起没了。\n\n**改法**：\n- 改成扫一遍所有输入框：值跟刚画上去时不一样，就算「在编辑」；\n- 在编辑时**不刷新**，先把云端那份存一边，每秒探一次，手停下来再应用（应用时照旧把改动处标黄）；\n- 就算不在编辑，重绘也会把「焦点在哪个框、光标在第几个字、滚到哪儿」抄下来再放回去，未提交的字也一并填回。\n\n截图 `08`：在第一行打完字后强制重绘，文字与光标位置（第 26 字）都还在。\n\n## 5. 时钟页：日期 / 周次放大\n\n- 日期行字号 2.4vw → 3.2vw（窄屏 3.2 → 4.2），不透明度 .55 → .68；\n- 补上「第 N 周」：首页拿到班级岛数据时把学期开始日存一份，时钟页是独立页面、不联网，自己按开始日算。\n- 线上实测：`2026年11月7日 九月廿九 星期六 · 第 10 周`，字号 61px。\n\n## 6. 每日一言：类型可选，放前台，云同步\n\n- 首页「每日一言」卡片右下角新增「类型」，点开是 12 类（动画/漫画/游戏/文学/原创/网络/其他/影视/诗词/网易云/哲学/抖机灵），勾哪类就只显示哪类，至少留一类；\n- 生效是立刻的：勾完就重新取一句；\n- **管理员**勾选会同时写进云端，别人刷新页面看到的就是同一套；非管理员只存在这台设备上（卡片右下角会写明是哪种）；\n- 顺手修了一个老 bug：云端保存「一言来源」时只落了「联网/本地」这一个开关，把**分类列表整个丢了** —— 后台从 3.9.8 起勾的分类其实一直没生效。\n\n---\n\n## 校验\n\n| 项目 | 结果 |\n|------|------|\n| 端到端测试 | 3324 项全过（含 12 条本次新增护栏） |\n| 文案门禁 | 13 个文件，0 处口语 |\n| 部署门禁 | 版本号四处一致 / 更新记录 / 云端记录 / 公告 / 文案 / 资源清单 / 无明文口令 全过 |\n| 线上回查 | `SITE_VERSION = 4.7.4`，`x-api-ver: 4.7.4`，`pickfx.js?v=474` |\n| 线上功能 | 时钟页第 10 周、字号 61px；首页班级岛缓存已写入 |\n\n## 需要你在自己电脑上确认的\n\n1. 班级电脑联网打开一次首页（停留十几秒，把离线包和名单缓存装好），之后再断网，抽取颜色应该已经分得开。\n2. 作业页按 A+ 一直按到 300%、A− 按到 25%，看看投影和排版是不是你要的效果。\n3. 一言的「类型」面板目前只在**卡片显示出来**的时候才有入口。如果你今天看到的首页没有一言卡片（后台按日期排期、今天没排），那不是这次改坏了，是本来就不显示。\n"},{"p":"v4.7.4_2026-11-06_发布同步修补/v4.7.4_2026-11-06_作业字号100%.png","n":"v4.7.4_2026-11-06_作业字号100%.png","d":"2026-11-06","sz":811985,"u":"a/1f511514a2870ebf.jpg"},{"p":"v4.7.4_2026-11-06_发布同步修补/v4.7.4_2026-11-06_作业字号25%.png","n":"v4.7.4_2026-11-06_作业字号25%.png","d":"2026-11-06","sz":918703,"u":"a/309f1a953f3df497.jpg"},{"p":"v4.7.4_2026-11-06_发布同步修补/v4.7.4_2026-11-06_作业字号300%.png","n":"v4.7.4_2026-11-06_作业字号300%.png","d":"2026-11-06","sz":924563,"u":"a/add1fba77ef58770.jpg"},{"p":"v4.7.4_2026-11-06_发布同步修补/v4.7.4_2026-11-06_作业无感刷新（重绘后光标与内容保留）.png","n":"v4.7.4_2026-11-06_作业无感刷新（重绘后光标与内容保留）.png","d":"2026-11-06","sz":664909,"u":"a/928cbf5672c3a32e.jpg"},{"p":"v4.7.4_2026-11-06_发布同步修补/v4.7.4_2026-11-06_抽取配色（无学号兜底）.png","n":"v4.7.4_2026-11-06_抽取配色（无学号兜底）.png","d":"2026-11-06","sz":467694,"u":"a/74284ab2461f9382.jpg"},{"p":"v4.7.4_2026-11-06_发布同步修补/v4.7.4_2026-11-06_时钟页周次.png","n":"v4.7.4_2026-11-06_时钟页周次.png","d":"2026-11-06","sz":69827,"u":"a/5e7683bde0775b70.jpg"},{"p":"v4.7.4_2026-11-06_发布同步修补/v4.7.4_2026-11-06_点名条件（不限成绩）.png","n":"v4.7.4_2026-11-06_点名条件（不限成绩）.png","d":"2026-11-06","sz":332423,"u":"a/ce2c6e3858c7622f.jpg"}]},{"dir":"v4.7.2_2026-11-06_断网后首次打开白屏","ver":"v4.7.2","date":"2026-11-06","title":"断网后首次打开白屏","theme":false,"count":8,"files":[{"p":"v4.7.2_2026-11-06_断网后首次打开白屏/v4.7.2_2026-11-06_交付说明.md","n":"v4.7.2_2026-11-06_交付说明.md","d":"2026-11-06","sz":4535,"t":"# v4.7.2 交付说明（2026-11-06）\n\n线上已生效：前端 `SITE_VERSION = 4.7.2`、后端 `x-api-ver = 4.7.2`（均已回查确认）。\n手机 / 一体机若还是旧样子，退出重进一次或强制刷新。\n\n---\n\n## 1. 班级电脑无网适配\n\n| 场景 | 以前 | 现在 |\n|---|---|---|\n| 断网时点作业 / 点同步 / 点登录 | 先等 DNS 超时（一体机实测 8～20 秒）才报错，像卡死 | 立刻返回，直接走本机已存内容 |\n| 断网时登录 | 一直转「登录中…」 | 直接说明「当前没有网络，无法登录」，并说明已存内容仍可用 |\n| 大屏 12 秒轮询 | 断网也照发，纯浪费 | 离线自动跳过这一轮 |\n| 断网后重新打开站点 | **白屏**（v4.7.1 实测复现） | 正常打开，顶部显示「离线 · 存本机」 |\n\n最后一条是本轮最关键的修复：Service Worker 安装时被最慢的文件（clock.html、badge.png）拖住，30 秒都没接管，而首页又不在安装清单里 —— 第一次打开后马上断网就打不开。现在每个文件独立超时（首页 20 秒、其余 9 秒），首页排进安装清单第一，接管后还会补两次。\n\n> 提醒：**新设备第一次打开时请联网停留约半分钟**，让它把离线包下完，之后断网就能直接打开。\n\n## 2. 作业界面没有新增 / 修改按钮\n\n原因是编辑能力只挂在「管理员登录」上，而班级电脑没网、不可能登录管理员，于是整块编辑界面都不渲染。\n\n现在把两件事拆开：\n\n- **能不能编辑**：顶栏新增「编辑」按钮，任何设备点一下就进编辑态，**不需要登录**。科目名、每条作业、添加一项、添加科目、新建一期、重命名、导入导出全部可用。\n- **能不能上传云端**：仍然只有管理员登录时才会发生（权限口径没变）。\n\n改动存本机，并且**优先显示**：没上传前，云端那一份不会把它冲掉（轮询和手动刷新都加了守卫）。顶栏会出现「本机改动 上传 / 放弃」，角标显示「未上传」。\n\n- 点「上传」：需要管理员登录 + 有网，推上去后本机标记自动清掉。\n- 点「放弃」：回到云端那一份，本机改动不可恢复（会二次确认）。\n\n## 3. 作业页真全屏\n\n顶栏右侧「⛶ 全屏」：走 Fullscreen API，任务栏一起盖掉，Esc 退出，退出后按钮变回「⛶ 全屏」。全屏切换后卡片会重新排版（可视高度变了）。\n\n## 4. 快捷方式「找不到 program 文件」的排查结论\n\n**不是希沃限制写 C 盘**，是 `.lnk` 里存的是浏览器 `.exe` 的**绝对路径**：希沃上浏览器常在别处（装在 D 盘 / 装的是 Edge 不是 Chrome / 被还原卡重定向），路径对不上就报这句。\n\n所以改成发一个启动器：后台「数据管理 → 站点资源 → 下载大屏启动器」。\n\n1. 存到 D 盘任意文件夹（不写 C 盘，不需要管理员权限）。\n2. 右键 →「发送到 → 桌面快捷方式」，再「属性 → 更改图标」选下载的 `.ico`。\n3. 双击进入，窗口是应用模式（没有地址栏、标签页），启动参数带 `?big=1`，直接是大屏。\n\n它自己按 6 个常见位置找 Chrome / Edge，都找不到就用系统默认浏览器打开 —— 不会再出现「找不到 program 文件」。若浏览器提示「不常见的文件」，选「保留」即可。\n\nPWA 侧同时修了一处：`manifest` 里原来写死 `orientation: portrait`，班级电脑是横屏，装成 PWA 会被锁成竖屏；已改为 `any`，并补了「大屏模式 / 作业看板」两个快捷方式（长按图标可用）。\n\n---\n\n## 验证\n\n- 端到端测试 **3312 项全绿**（新增 8 条针对本轮改动的护栏）\n- 文案门禁 0 处口语；部署门禁 ①～④ 全过\n- 线上实测：断网重载可打开、作业数据在、编辑 / 全屏按钮在\n- 云端已同步 `release_notes` 4.7.1 / 4.7.2 与「v4.7 更新」公告\n\n## 截图\n\n- `01-作业页-编辑与全屏按钮.png` 只读态：右上「编辑」「⛶ 全屏」\n- `02-作业页-本机编辑态.png` 编辑态：可改科目名、改每条、加一项、新建一期\n- `03-本机改动-未上传.png` 改完：「未上传」角标 + 「本机改动 放弃」\n- `04-作业页-真全屏.png` 全屏（任务栏隐藏）\n- `05-后台-大屏启动器.png` 后台站点资源与操作步骤\n- `06-线上-作业页按钮.png` 线上实际界面\n- `07-线上-断网重载可打开.png` 断网后重新打开仍然正常\n"},{"p":"v4.7.2_2026-11-06_断网后首次打开白屏/v4.7.2_2026-11-06_作业页-本机编辑态.png","n":"v4.7.2_2026-11-06_作业页-本机编辑态.png","d":"2026-11-06","sz":303857,"u":"a/e8216ac1e48f5646.jpg"},{"p":"v4.7.2_2026-11-06_断网后首次打开白屏/v4.7.2_2026-11-06_作业页-真全屏.png","n":"v4.7.2_2026-11-06_作业页-真全屏.png","d":"2026-11-06","sz":304412,"u":"a/9caa0c89c5c1404e.jpg"},{"p":"v4.7.2_2026-11-06_断网后首次打开白屏/v4.7.2_2026-11-06_作业页-编辑与全屏按钮.png","n":"v4.7.2_2026-11-06_作业页-编辑与全屏按钮.png","d":"2026-11-06","sz":290698,"u":"a/493c849da40af1d6.jpg"},{"p":"v4.7.2_2026-11-06_断网后首次打开白屏/v4.7.2_2026-11-06_后台-大屏启动器.png","n":"v4.7.2_2026-11-06_后台-大屏启动器.png","d":"2026-11-06","sz":137421,"u":"a/eeddf68b39f82998.jpg"},{"p":"v4.7.2_2026-11-06_断网后首次打开白屏/v4.7.2_2026-11-06_本机改动-未上传.png","n":"v4.7.2_2026-11-06_本机改动-未上传.png","d":"2026-11-06","sz":304182,"u":"a/44de6d7a85a87281.jpg"},{"p":"v4.7.2_2026-11-06_断网后首次打开白屏/v4.7.2_2026-11-06_线上-作业页按钮.png","n":"v4.7.2_2026-11-06_线上-作业页按钮.png","d":"2026-11-06","sz":362196,"u":"a/86f321915af1fe3c.jpg"},{"p":"v4.7.2_2026-11-06_断网后首次打开白屏/v4.7.2_2026-11-06_线上-断网重载可打开.png","n":"v4.7.2_2026-11-06_线上-断网重载可打开.png","d":"2026-11-06","sz":254809,"u":"a/78acddf9d8ad972d.jpg"}]},{"dir":"v4.7.0_2026-11-06_宝箱收尾+作业实时同步+名单-历史云同步","ver":"v4.7.0","date":"2026-11-06","title":"宝箱收尾+作业实时同步+名单-历史云同步","theme":false,"count":8,"files":[{"p":"v4.7.0_2026-11-06_宝箱收尾+作业实时同步+名单-历史云同步/v4.7.0_2026-11-06_交付说明.md","n":"v4.7.0_2026-11-06_交付说明.md","d":"2026-11-06","sz":4437,"t":"# v4.7.0 交付说明（2026-11-06）\n\n线上已更新：前端 `SITE_VERSION = 4.7.0`，后端 `x-api-ver = 4.7.0`。\n打开方式不变，**手机上如果还是旧样子，下拉刷新一次或退出重进**（Service Worker 有缓存）。\n\n---\n\n## 一、逐条对应你这次说的问题\n\n| # | 你的原话 | 这次怎么改的 | 状态 |\n|---|---------|------------|------|\n| 1 | 抽取历史里经常删不掉一些记录 | 以前删的时候只删了本机那份，云端那份还在，下一次合并又并回来 → 现在删一次会留「墓碑」标记，云端那份也同步摘掉，不会再复活 | 已修 |\n| 2 | 不参与名单要能上传云端，换设备不用重填 | 名单改存云端（新内容键 `pick_exclude`）。管理员改一次，任何设备打开都是同一份；普通同学改了只存本机（和「只有管理员能上传」的权限一致） | 已做 |\n| 3 | 手机上改作业，大屏不刷新 | 大屏每 12 秒和云端比一次，发现变化自动重画，并把改动的地方**标黄 5 秒**；点顶部「已同步」角标可以立刻强制拉一次 | 已做 |\n| 4 | 首界面加一个进后台的按钮 | 侧边栏新增「班级服务站后台」，管理员登录后才出现 | 已做 |\n| 5 | 宝箱到最后又突然加快又跳一下 | 根因是减速曲线分了两段：前一段已经减速到 0，后一段又从 0 猛加速，所以看着像「停了又冲一下」。现在改成一条从头减速到尾的曲线，落点精确居中，中奖卡只加光圈、不缩放 | 已修 |\n| 6 | 宝箱揭示还要再点一下才显示名字 | 现在停下即自动揭示，和盲盒一致；隐藏姓名时先出「学号段 01–10」色块胶囊 0.9 秒，再把姓名顶上来 | 已修 |\n| 7 | 隐藏姓名时不用跳，不隐藏时跳一下更好玩 | 不隐藏姓名：停稳后随机往前/往后偏 1 格（或原地不动），停 0.35 秒再滑回中奖卡；隐藏姓名：不做任何位移 | 已做 |\n| 8 | 大屏、横屏、轻量三个开关太难找 | 三个并排挪到侧边栏第一屏（首页按钮下面），点一次就切；自定义设置里只留一条说明，不再放重复开关 | 已做 |\n| 9 | 前台登录也卡 | 原来是「等云端数据整个拉完才关弹窗」，低配机器上像点了没反应。现在拿到登录态立刻关弹窗并提示成功，云端同步和整页重绘挪到之后执行 | 已优化（需你在希沃实机再确认） |\n\n---\n\n## 二、截图说明\n\n1. `01-首屏三个快捷开关.png`：大屏 / 横屏 / 轻量并排一行，点一次即切（截图里是默认「关」）。\n2. `02-宝箱落点居中.png`：停下时中奖卡正好落在方框正中，没有二次位移。\n3. `03-宝箱自动显示姓名.png`：不隐藏姓名时，停下就是结果，卡片上直接是「姓名 + 两位学号」。\n4. `04-隐藏姓名先显示学号段.png`：隐藏姓名时，先在下半屏打出「学号段 01–10」色块胶囊。\n5. `05-隐藏姓名自动揭示.png`：0.9 秒后姓名自动顶上来，泛色退去。\n6. `06-盲盒露学号段.png` / `07-盲盒自动显示姓名.png`：盲盒仍是「点一次 → 露色 → 自动出姓名」。\n\n---\n\n## 三、还需要你确认的两件事\n\n1. **速度**：这轮把登录弹窗的阻塞拿掉了，但你之前是在没开轻量模式的情况下测的。下一轮请先开「轻量」，再试软键盘输入和登录，对比一下还卡不卡。\n2. **作业实时同步**：大屏开着作业页时，手机改一条作业，正常 12 秒内大屏会变色标出来。如果超过 30 秒还没动，说明是网络或后端没跟上，告诉我一声，我再看是不是要把轮询改成「有改动才拉」。\n\n---\n\n## 四、技术备注（给以后排查用）\n\n- 宝箱减速：`pickfx.js` 的 `easeCase()` 由两段拼接改为 `1-(1-p)^3.4`；落点由 `centerOf(at)` 精确计算，去掉了原来的 ±0.22 格抖动。\n- 中奖高亮：`.pfx-tile.win` 只做 `box-shadow` 呼吸，**没有 transform**（缩放会被看成「跳一下」）。\n- 历史删除：`cls_pick_hist_del` 墓碑 + `phSave()` 回写 `SITE_DATA.pickHistory`。\n- 作业同步：比对基准是 `BIG.hwPrev`（屏幕上那一份），不是 `SITE_DATA`——否则 app.js 先在后台更新了数据，大屏永远比不出差异。\n- 轮询仍走原来的 `/api/content`，只是同一份响应里多解析一个 `holiday_homeworks`，没有新增请求数。\n"},{"p":"v4.7.0_2026-11-06_宝箱收尾+作业实时同步+名单-历史云同步/v4.7.0_2026-11-06_宝箱自动显示姓名.png","n":"v4.7.0_2026-11-06_宝箱自动显示姓名.png","d":"2026-11-06","sz":237123,"u":"a/847148543f2e9cf4.jpg"},{"p":"v4.7.0_2026-11-06_宝箱收尾+作业实时同步+名单-历史云同步/v4.7.0_2026-11-06_宝箱落点居中.png","n":"v4.7.0_2026-11-06_宝箱落点居中.png","d":"2026-11-06","sz":217812,"u":"a/f303d1a2f1d4036f.jpg"},{"p":"v4.7.0_2026-11-06_宝箱收尾+作业实时同步+名单-历史云同步/v4.7.0_2026-11-06_盲盒自动显示姓名.png","n":"v4.7.0_2026-11-06_盲盒自动显示姓名.png","d":"2026-11-06","sz":215908,"u":"a/2df461e23e85dc93.jpg"},{"p":"v4.7.0_2026-11-06_宝箱收尾+作业实时同步+名单-历史云同步/v4.7.0_2026-11-06_盲盒露学号段.png","n":"v4.7.0_2026-11-06_盲盒露学号段.png","d":"2026-11-06","sz":958628,"u":"a/ceb14b9dc0a17220.jpg"},{"p":"v4.7.0_2026-11-06_宝箱收尾+作业实时同步+名单-历史云同步/v4.7.0_2026-11-06_隐藏姓名先显示学号段.png","n":"v4.7.0_2026-11-06_隐藏姓名先显示学号段.png","d":"2026-11-06","sz":410429,"u":"a/77a94a95c7f0ae4d.jpg"},{"p":"v4.7.0_2026-11-06_宝箱收尾+作业实时同步+名单-历史云同步/v4.7.0_2026-11-06_隐藏姓名自动揭示.png","n":"v4.7.0_2026-11-06_隐藏姓名自动揭示.png","d":"2026-11-06","sz":232485,"u":"a/1ac6f8383dc11598.jpg"},{"p":"v4.7.0_2026-11-06_宝箱收尾+作业实时同步+名单-历史云同步/v4.7.0_2026-11-06_首屏三个快捷开关.png","n":"v4.7.0_2026-11-06_首屏三个快捷开关.png","d":"2026-11-06","sz":458317,"u":"a/00368c469b714fdf.jpg"}]},{"dir":"v4.6.0_2026-11-06_抽取动画重做+希沃性能优化+图标下载","ver":"v4.6.0","date":"2026-11-06","title":"抽取动画重做+希沃性能优化+图标下载","theme":false,"count":11,"files":[{"p":"v4.6.0_2026-11-06_抽取动画重做+希沃性能优化+图标下载/v4.6.0_2026-11-06_交付说明.md","n":"v4.6.0_2026-11-06_交付说明.md","d":"2026-11-06","sz":3935,"t":"# v4.6.0 / v4.6.1 验收交付说明\n\n## 一、盲盒逻辑已按你的要求重做\n\n| 项目 | 旧（v4.5.2） | 新（v4.6.0） |\n|------|------|------|\n| 格子数 | 固定 10 个（中奖+陪跑预分配） | **按条件人数，最多 10 个** |\n| 点开结果 | 预先定好的人 / 未中 | **点开瞬间在范围内现抽一个没抽过的人** |\n| 抽几人 | 10 个格子全都要开 | **抽 5 人就点 5 次，点满即停** |\n| 剩余格子 | 显示「未中」 | **直接变灰、不可点** |\n| 点击次数 | 点两次（先露段、再揭名） | **点一次：露色 0.45s → 自动显示姓名** |\n\n实测：条件池 14 人、抽 5 人 → 显示 **10 个盲盒**；点第 1 个直接出「周涛 08 号」；点满 5 次后剩余 5 个变灰，计数「已抽中 5/5」。\n\n## 二、宝箱按 CS 开箱重做\n\n- 中间 **固定方框** 不动，卡片在后方横向滚动；\n- 停下时计算每张卡与方框的 **重叠面积**，面积最大者中奖；\n- 隐藏姓名时卡片 **纯色块 + 微光，不写任何文字**（学号段对照看顶部图例）；\n- 停下后全屏泛色 0.8 秒 → **姓名出现的同时泛色退去**（v4.6.1 修复，否则浓色盖住名字）；\n- 卡片数从 52 降到 24（轻量下 16），全部用 transform 合成层。\n\n## 三、性能（Windows 希沃）\n\n### 根因找到了\n\n后台 `admin.html` **此前完全没有轻量模式**。主站有 `data-lite` 规则，后台却让 `backdrop-filter: blur(14px)`、顶栏辉光、`rise-in` 入场动画一直跑。软键盘弹出会触发 resize 重排，这些每帧重绘把主线程占满 → 输入 1 秒 1 个字。\n\n### 改了什么\n\n1. **后台补上轻量模式**：读同一个 `cls_lite_mode`，尽早打 `data-lite`；关模糊、关辉光、停动画、登录门改纯色、输入框聚焦不再画 3px 外环。\n2. **轻量模式改为「降质不降功能」**：抽取动画**完整播放**（已用 `:not(.pfx)` 从全局压动画规则里豁免），只减掉多层阴影、大半径渐变、电荷脉冲；宝箱卡片 24→16；动画时长缩 20%。\n3. **后台「数据管理」新增轻量模式开关**，可直接开。\n\n实测对比：\n\n| | 正常模式 | 轻量模式 |\n|---|---|---|\n| `<html data-lite>` | 无 | `1` |\n| 登录卡片阴影 | `0 20px 25px` | `none` |\n| 登录卡片动画 | 0.5s | 0.00001s |\n| 顶栏模糊 | `blur(14px)` | 无 |\n| 抽取动画 | 完整 | **完整**（仅画质降） |\n\n## 四、后台图标下载\n\n「数据管理」页顶部新增：\n\n- **下载班徽** → `badge.png`（PNG，113KB）\n- **下载站点图标** → `favicon.ico`（新生成，16/32/48/64 多尺寸，7.9KB）\n\n创建快捷方式后右键「属性 → 更改图标」即可替换。同时主站与后台都补了 ico 的 `<link>` 兜底。\n\n## 五、验证\n\n- 后端测试 **3294 项全过**，文案门禁 0 处口语，部署门禁全绿；\n- 线上前端 `SITE_VERSION=4.6.1`、后端 `x-api-ver=4.6.1`；\n- `favicon.ico` 线上 200，`image/vnd.microsoft.icon`，7946B；\n- 截图 10 张见下。\n\n## 截图\n\n| 文件 | 说明 |\n|------|------|\n| 01-盲盒-10格-抽5人 | 条件池 14 人、抽 5 人，仍显示 10 格 |\n| 02-盲盒-点击后露学号段颜色 | 全屏泛色 + 中央「学号段 01–10」 |\n| 03-盲盒-自动显示姓名 | 无需二次点击，直接出「周涛 08 号」 |\n| 04-盲盒-抽满5次-剩余置灰 | 5 亮 5 灰，计数 5/5，按钮变「已抽满」 |\n| 05-宝箱-滚动中-方框固定 | 方框居中不动，卡片纯色块 |\n| 06-宝箱-停下-方框内面积最大 | 全屏泛色 + 「学号段 11–20」+「即将揭示姓名」 |\n| 07-宝箱-自动显示姓名 | 泛色退去，方框内清晰显示「王芳 25」 |\n| 08-轻量模式-盲盒动画完整播放 | 轻量下动画照常，8 格（池 8 人） |\n| 09-后台登录-正常模式 | 有模糊、阴影、动画 |\n| 10-后台登录-轻量模式 | 纯色、无阴影、无动画 |\n"},{"p":"v4.6.0_2026-11-06_抽取动画重做+希沃性能优化+图标下载/v4.6.0_2026-11-06_后台登录-正常模式.png","n":"v4.6.0_2026-11-06_后台登录-正常模式.png","d":"2026-11-06","sz":724368,"u":"a/d802da0f32732fe0.jpg"},{"p":"v4.6.0_2026-11-06_抽取动画重做+希沃性能优化+图标下载/v4.6.0_2026-11-06_后台登录-轻量模式.png","n":"v4.6.0_2026-11-06_后台登录-轻量模式.png","d":"2026-11-06","sz":97444,"u":"a/0be64d0ef1d2d956.jpg"},{"p":"v4.6.0_2026-11-06_抽取动画重做+希沃性能优化+图标下载/v4.6.0_2026-11-06_宝箱-停下-方框内面积最大.png","n":"v4.6.0_2026-11-06_宝箱-停下-方框内面积最大.png","d":"2026-11-06","sz":2677372,"u":"a/c75b18e38448c812.jpg"},{"p":"v4.6.0_2026-11-06_抽取动画重做+希沃性能优化+图标下载/v4.6.0_2026-11-06_宝箱-滚动中-方框固定.png","n":"v4.6.0_2026-11-06_宝箱-滚动中-方框固定.png","d":"2026-11-06","sz":669444,"u":"a/a4dc663086af1650.jpg"},{"p":"v4.6.0_2026-11-06_抽取动画重做+希沃性能优化+图标下载/v4.6.0_2026-11-06_宝箱-自动显示姓名.png","n":"v4.6.0_2026-11-06_宝箱-自动显示姓名.png","d":"2026-11-06","sz":838307,"u":"a/70149c23c698925f.jpg"},{"p":"v4.6.0_2026-11-06_抽取动画重做+希沃性能优化+图标下载/v4.6.0_2026-11-06_盲盒-10格-抽5人.png","n":"v4.6.0_2026-11-06_盲盒-10格-抽5人.png","d":"2026-11-06","sz":505919,"u":"a/9bb5e57864982a56.jpg"},{"p":"v4.6.0_2026-11-06_抽取动画重做+希沃性能优化+图标下载/v4.6.0_2026-11-06_盲盒-抽满5次-剩余置灰.png","n":"v4.6.0_2026-11-06_盲盒-抽满5次-剩余置灰.png","d":"2026-11-06","sz":971949,"u":"a/355a82a0667430c3.jpg"},{"p":"v4.6.0_2026-11-06_抽取动画重做+希沃性能优化+图标下载/v4.6.0_2026-11-06_盲盒-点击后露学号段颜色.png","n":"v4.6.0_2026-11-06_盲盒-点击后露学号段颜色.png","d":"2026-11-06","sz":2782509,"u":"a/8ee38e5719ff81ed.jpg"},{"p":"v4.6.0_2026-11-06_抽取动画重做+希沃性能优化+图标下载/v4.6.0_2026-11-06_盲盒-自动显示姓名.png","n":"v4.6.0_2026-11-06_盲盒-自动显示姓名.png","d":"2026-11-06","sz":635529,"u":"a/d3386f6f37c1503f.jpg"},{"p":"v4.6.0_2026-11-06_抽取动画重做+希沃性能优化+图标下载/v4.6.0_2026-11-06_轻量模式-盲盒动画完整播放.png","n":"v4.6.0_2026-11-06_轻量模式-盲盒动画完整播放.png","d":"2026-11-06","sz":501036,"u":"a/b422e290881565c3.jpg"}]},{"dir":"v4.5.2_2026-11-06_盲盒固定10格+中奖-陪跑机制","ver":"v4.5.2","date":"2026-11-06","title":"盲盒固定10格+中奖-陪跑机制","theme":false,"count":6,"files":[{"p":"v4.5.2_2026-11-06_盲盒固定10格+中奖-陪跑机制/v4.5.2_2026-11-06_交付说明.md","n":"v4.5.2_2026-11-06_交付说明.md","d":"2026-11-06","sz":3049,"t":"# v4.5.2 验收交付说明\n\n## 本次改动\n\n### 盲盒固定 10 格 + 中奖/陪跑机制\n\n**核心变化**：不论抽几人，盲盒始终显示 10 个（条件池不足 10 才按池子人数），中奖者藏在里面、陪跑从池子补齐、打乱顺序。\n\n| 改动点 | 之前 | 之后 |\n|--------|------|------|\n| 盲盒数量 | `items.slice(0,10)` = 中奖人数 | `min(10, pool.length)` = 固定 10 格 |\n| 抽 5 人时 | 只有 5 个盲盒 | 10 个盲盒（5 中奖 + 5 陪跑） |\n| 陪跑盲盒 | 不存在 | 从条件池随机补齐，打乱混入 |\n| 开盒结果 | 每个都是中奖者 | 中奖显示姓名+清亮音效；未中显示「未中」+低沉音效+暗淡 |\n| 计数 | 无 | 底栏「已抽中 X / N」实时更新 |\n| 结束条件 | 全部开完自动结束 | 中奖全开完启用「查看结果」，可继续开陪跑或直接看结果 |\n\n### 抽取记录权限（未改，确认已满足）\n\n- 大屏模式 `?big=1` 任何人可访问、可用随机抽选\n- `phSave` 有 `adminOk()` 守卫：仅管理员自动上传云端\n- 普通用户（手机打开大屏）只落本机 localStorage，不影响云端数据\n- 提示文字区分：「已同步至云端」/「记录暂存本机，管理员登录后自动上传」\n\n## 验证结果\n\n### 数据验证（puppeteer 模拟抽 5 人、池 14 人）\n\n```\n盲盒信息: {\"cellCount\":10,\"sub\":\"共 10 个盲盒 · 抽 5 人\",\"cntBox\":\"已抽中 0 / 5\"}\n第1个盲盒结果: {\"cell0Class\":\"pfx-cell pfx-b open miss\",\"cell0Text\":\"未中\",\"cntBox\":\"已抽中 0 / 5\"}\n第2个: 已抽中=0 未中=true\n第3个: 已抽中=0 未中=true\n第4个: 已抽中=1 未中=false\n第5个: 已抽中=2 未中=false\n第6个: 已抽中=2 未中=true\n第7个: 已抽中=3 未中=false\n第8个: 已抽中=4 未中=false\n第9个: 已抽中=5 未中=false\n最终状态: {\"total\":10,\"miss\":5,\"open\":10,\"cnt\":\"已抽中 5 / 5\",\"doneReady\":true}\n```\n\n- 10 个盲盒（抽 5 人）✓\n- 5 中奖 + 5 陪跑 ✓\n- 未中显示「未中」+ miss 暗淡 ✓\n- 计数从 0/5 涨到 5/5 ✓\n- 中奖全开后「查看结果」启用 ✓\n\n### 线上版本\n\n- 前端 `SITE_VERSION = 4.5.2`\n- 后端 `x-api-ver: 4.5.2`\n- `pickfx.js` 含 gridN/hitMap/shuffle/hitsCount/missTone 全部上线\n\n### 测试与门禁\n\n- 后端测试 **3290 项全过**（新增 8 条盲盒固定 10 格断言）\n- 文案门禁 0 口语（13 文件）\n- 部署门禁全绿（版本号一致 → 源码记录 → 云端记录 → 公告 → 备份）\n\n## 截图清单\n\n| 序号 | 文件 | 说明 |\n|------|------|------|\n| 01 | 盲盒初始-10个格子 | 抽 5 人但显示 10 个盲盒，副标题「共10个盲盒·抽5人」 |\n| 02 | 盲盒-glow全屏泛色 | 点开一个盲盒的第一阶段：开缝露学号段光辉+全屏泛色 |\n| 03 | 盲盒-第一个揭示 | 第一个开出「未中」，暗淡显示，计数仍 0/5 |\n| 04 | 盲盒-多个开完后 | 逐个开盒，中奖与未中混合，计数逐步增加 |\n| 05 | 盲盒-全部开完后 | 10 个全开：5 个姓名（亮）+ 5 个未中（暗），计数 5/5 |\n"},{"p":"v4.5.2_2026-11-06_盲盒固定10格+中奖-陪跑机制/v4.5.2_2026-11-06_盲盒-glow全屏泛色.png","n":"v4.5.2_2026-11-06_盲盒-glow全屏泛色.png","d":"2026-11-06","sz":2781335,"u":"a/29d25c2f64891dbc.jpg"},{"p":"v4.5.2_2026-11-06_盲盒固定10格+中奖-陪跑机制/v4.5.2_2026-11-06_盲盒-全部开完后.png","n":"v4.5.2_2026-11-06_盲盒-全部开完后.png","d":"2026-11-06","sz":1414550,"u":"a/230afad9200b26d1.jpg"},{"p":"v4.5.2_2026-11-06_盲盒固定10格+中奖-陪跑机制/v4.5.2_2026-11-06_盲盒-多个开完后.png","n":"v4.5.2_2026-11-06_盲盒-多个开完后.png","d":"2026-11-06","sz":1392415,"u":"a/42d67134a1fdd811.jpg"},{"p":"v4.5.2_2026-11-06_盲盒固定10格+中奖-陪跑机制/v4.5.2_2026-11-06_盲盒-第一个揭示.png","n":"v4.5.2_2026-11-06_盲盒-第一个揭示.png","d":"2026-11-06","sz":615390,"u":"a/c616884818d89dde.jpg"},{"p":"v4.5.2_2026-11-06_盲盒固定10格+中奖-陪跑机制/v4.5.2_2026-11-06_盲盒初始-10个格子.png","n":"v4.5.2_2026-11-06_盲盒初始-10个格子.png","d":"2026-11-06","sz":506742,"u":"a/3cda15f1f6a7dfbe.jpg"}]},{"dir":"v4.5.1_2026-11-06_抽取动画精简为盲盒与宝箱盲盒改两段式","ver":"v4.5.1","date":"2026-11-06","title":"抽取动画精简为盲盒与宝箱盲盒改两段式","theme":false,"count":9,"files":[{"p":"v4.5.1_2026-11-06_抽取动画精简为盲盒与宝箱盲盒改两段式/v4.5.1_2026-11-06_交付说明.md","n":"v4.5.1_2026-11-06_交付说明.md","d":"2026-11-06","sz":3522,"t":"# v4.5.1 交付说明 —— 抽取动画精简为盲盒与宝箱\n\n## 本次改动（站主 2026-11-06 要求）\n\n1. **删除卡片模式**：盲盒与卡片功能相近，移除卡片，动画档位由「关闭 / 盲盒 / 抽卡 / 宝箱」改为「关闭 / 盲盒 / 宝箱」。\n2. **盲盒改两段式**（参考蛋仔派对）：\n   - 第一次点击：盒盖掀开一条缝，透出学号段光辉，**满屏泛起该段颜色**，中央显示「学号段 XX–XX」+「点击揭示姓名」。\n   - 第二次点击：揭示姓名。两次点击制造两次紧张。\n   - 「全部开盒」分两步：先把全部盲盒开缝露段（按钮变「全部揭示」），再一次性揭示姓名。单个点击才点亮全屏泛色，避免多段撞色。\n3. **宝箱改进**（CS 开箱式）：\n   - 隐藏姓名时，转盘格子上**直接显示学号段**（如 31–40），停下后再揭示姓名。\n   - 减速曲线分段：前段较快、**末段极慢**（最后 14% 时间只走 10% 路程）。\n   - **约三成概率停针卡间隙**：停针偏向中奖格与邻格之间，视觉上「差点滑过去」，但不指错人。\n   - 停下时全屏泛色 + 「学号段 XX–XX」+「即将揭示姓名」，延迟后再揭示姓名。\n\n## 验证结果\n\n| 项 | 结果 |\n|---|---|\n| 后端测试 test_e2e | 3282 项全过（含【96】段新增 5 条 v4.5.1 断言） |\n| 文案门禁 copycheck | 13 文件 0 处口语 |\n| 部署门禁 predeploy | 全过（版本号四处一致、公告自动追加、备份完成） |\n| 线上前端 SITE_VERSION | 4.5.1 |\n| 线上后端 x-api-ver | 4.5.1 |\n| 线上 pickfx.js | box/case 两模式，无 card |\n| 线上 big FX_LIST | ['off','box','case'] |\n\n## 截图说明（共 8 张）\n\n| 序号 | 文件 | 内容 |\n|---|---|---|\n| 01 | 动画选择面板-默认关闭 | 动画档位：关闭 / 盲盒 / 宝箱（无抽卡） |\n| 02 | 盲盒-两段式说明 | 盲盒选中，说明「两段式：先开缝露学号段光辉，再点击揭示姓名」+ 六色图例 |\n| 03 | 宝箱-说明与隐藏姓名 | 宝箱选中，说明减速与隐藏姓名 + 姓名开关 |\n| 04 | 盲盒舞台-初始 | 6 个盲盒排列，盒盖闭合带问号 |\n| 05 | 盲盒-glow全屏泛色与学号段 | 点击第二个盲盒，满屏蓝色泛光，中央「学号段 11–20」+「点击揭示姓名」 |\n| 06 | 盲盒-揭示姓名 | 再次点击，揭示「李华 15 号」，泛色消退 |\n| 07 | 宝箱-转盘中-格子显学号段 | 转盘滚动，格子上显示学号段（31–40/41–50/51–62/11–20/01–10），铜色指针 |\n| 08 | 宝箱-停下全屏泛色 | 停下满屏青色泛光，中央「学号段 01–10」+「即将揭示姓名」，中奖格高亮，已开启 1/3 |\n\n## 涉及文件\n\n- `pickfx.js`：重写，删 card，盲盒两段式（boxCtl），宝箱减速+卡间隙（caseCtl/easeCase/nearMiss），全屏泛色层（setFlare）\n- `big.js`：FX_LIST 去掉 card，fxPanel 选项与说明调整\n- `index.html`：删卡片 CSS，新增全屏泛色层 .pfx-flare、盲盒 glow 态、宝箱 .pfx-seg 学号段格子\n- `test_e2e.mjs`：【96】段断言更新为两模式 + 新增 5 条 v4.5.1 断言\n- `admin-3.js` / `README.md`：补 4.5.1 版本记录\n- 版本号五处：index.html / admin.html / sw.js / api/worker.mjs / README.md = 4.5.1\n\n## 离线可用\n\n盒子、光柱、指针、全屏泛色全部 CSS 绘制，音效 WebAudio 现场合成，不引用任何图片与音频文件；pickfx.js 仍在 Service Worker 预缓存，断网可完整播放。\n"},{"p":"v4.5.1_2026-11-06_抽取动画精简为盲盒与宝箱盲盒改两段式/v4.5.1_2026-11-06_动画选择面板-默认关闭.png","n":"v4.5.1_2026-11-06_动画选择面板-默认关闭.png","d":"2026-11-06","sz":367056,"u":"a/bbe606226eaebc80.jpg"},{"p":"v4.5.1_2026-11-06_抽取动画精简为盲盒与宝箱盲盒改两段式/v4.5.1_2026-11-06_宝箱-停下全屏泛色.png","n":"v4.5.1_2026-11-06_宝箱-停下全屏泛色.png","d":"2026-11-06","sz":2688062,"u":"a/eeb7bf3946f6cd87.jpg"},{"p":"v4.5.1_2026-11-06_抽取动画精简为盲盒与宝箱盲盒改两段式/v4.5.1_2026-11-06_宝箱-说明与隐藏姓名.png","n":"v4.5.1_2026-11-06_宝箱-说明与隐藏姓名.png","d":"2026-11-06","sz":398751,"u":"a/be479f9c58911991.jpg"},{"p":"v4.5.1_2026-11-06_抽取动画精简为盲盒与宝箱盲盒改两段式/v4.5.1_2026-11-06_宝箱-转盘中-格子显学号段.png","n":"v4.5.1_2026-11-06_宝箱-转盘中-格子显学号段.png","d":"2026-11-06","sz":597130,"u":"a/3be6707cb41de752.jpg"},{"p":"v4.5.1_2026-11-06_抽取动画精简为盲盒与宝箱盲盒改两段式/v4.5.1_2026-11-06_盲盒-glow全屏泛色与学号段.png","n":"v4.5.1_2026-11-06_盲盒-glow全屏泛色与学号段.png","d":"2026-11-06","sz":2716157,"u":"a/6c4177537f974ebc.jpg"},{"p":"v4.5.1_2026-11-06_抽取动画精简为盲盒与宝箱盲盒改两段式/v4.5.1_2026-11-06_盲盒-两段式说明.png","n":"v4.5.1_2026-11-06_盲盒-两段式说明.png","d":"2026-11-06","sz":385033,"u":"a/1f2ca553ecba4200.jpg"},{"p":"v4.5.1_2026-11-06_抽取动画精简为盲盒与宝箱盲盒改两段式/v4.5.1_2026-11-06_盲盒-揭示姓名.png","n":"v4.5.1_2026-11-06_盲盒-揭示姓名.png","d":"2026-11-06","sz":623005,"u":"a/5bba1b0dfd0e5206.jpg"},{"p":"v4.5.1_2026-11-06_抽取动画精简为盲盒与宝箱盲盒改两段式/v4.5.1_2026-11-06_盲盒舞台-初始.png","n":"v4.5.1_2026-11-06_盲盒舞台-初始.png","d":"2026-11-06","sz":493212,"u":"a/01269706393b4213.jpg"}]},{"dir":"v4.5.0_2026-11-05_随机点名抽取动画","ver":"v4.5.0","date":"2026-11-05","title":"随机点名抽取动画","theme":false,"count":13,"files":[{"p":"v4.5.0_2026-11-05_随机点名抽取动画/v4.5.0_2026-11-05_交付说明.md","n":"v4.5.0_2026-11-05_交付说明.md","d":"2026-11-05","sz":4504,"t":"# v4.5.0 随机点名抽取动画 · 交付说明\n\n**上线时间**：2026-11-05\n**版本**：前端 `SITE_VERSION = 4.5.0`，接口 `x-api-ver = 4.5.0`，Service Worker `class-site-4.5.0`\n\n---\n\n## 一页看懂\n\n随机点名多了三种抽取动画，可以在设置里选「关闭 / 盲盒 / 抽卡 / 宝箱」，选一次记住一次。关掉动画时点「开始抽取」直接出结果，不耽误时间；有空的时候再开着玩。\n\n颜色按学号分段，抽之前谁也不知道会是谁，只看得到光。\n\n| 学号 | 01–10 | 11–20 | 21–30 | 31–40 | 41–50 | 51–62 |\n| --- | --- | --- | --- | --- | --- | --- |\n| 颜色 | 青 | 蓝 | 紫 | 玫 | 金 | 绿 |\n\n61、62 号与 51–60 同色（按班内序号 01–62 计算，取学号后两位）。老师与管理员账号没有学号，用中性灰。\n\n---\n\n## 三种动画\n\n### 1. 盲盒\n牛皮纸礼盒 + 绶带 + 火漆印，一盒一人。\n\n- 点盒子 → 盒子轻抖、升起一束学号色光柱（约 0.5 秒）→ 盒盖掀开、光晕铺开 → 姓名牌落下\n- 多人抽取时逐盒开启，开完自动回结果页\n- 顶部有「全部开启」，一盒接一盒快速翻完，不用一个个点\n- 绶带是中性色，开盒前不泄露学号段\n\n### 2. 抽卡\n深色卡背 + 六边班徽（站内自己的纹样，不是任何游戏的卡面）。\n\n- 点卡片 → 光柱升起 → 卡面 3D 翻转 → 正面按学号段配色显示姓名与学号\n- 一次最多 10 张，桌面 5 列、手机 4 列，随人数自动排\n\n### 3. 宝箱\n横向转盘 + 铜指针，逐轮减速停在中奖格。\n\n- 可勾选「抽取时隐藏姓名」：转动时格子里只有彩色光辉，停稳后才补上姓名\n- 不勾选时姓名随光辉一同显示（白字 + 深色压底，各段颜色都测过对比度）\n- 多人抽取时逐轮开启，已抽到的人列在转盘下方\n- 停针位置做过校正（见下方「修的问题」）\n\n---\n\n## 交互细节\n\n| 场景 | 行为 |\n| --- | --- |\n| 动画关闭 | 点「开始抽取」立即显示结果，无任何等待 |\n| 单条重抽 | 点结果行右侧的刷新按钮，按「单抽」演一遍（一个盒子 / 一张牌 / 一轮转盘） |\n| 跳过 | 舞台右上角常驻「跳过」，点了立刻给结果 |\n| 抽取历史 | 与以前一致：时间、条件、人数、姓名可写备注；单条重抽会同步更新那条记录 |\n| 减少动态效果 | 系统开启「减少动态效果」时，宝箱转盘时长压到 0.6 秒 |\n\n结果页每条结果左侧保留同色光条，右侧显示班内序号，事后能对上「刚才那道光是谁」。\n\n---\n\n## 离线与性能\n\n- 盒子、卡面、光柱、指针、粒子全部 CSS 绘制，**不引用任何图片**\n- 音效由 WebAudio 现场合成，沿用站内音效开关，**不引用任何音频文件**\n- `pickfx.js` 已进 Service Worker 预缓存，断网重开仍可完整播放\n\n实测（Chromium，断网后重载）：页面正常打开、PickFX 正常加载、点名面板照常抽出 3 人。\n\n---\n\n## 修的问题\n\n**宝箱停针偏移约半个格子。** 原因：舞台入场有 0.3 秒的缩放动画，用 `getBoundingClientRect()` 量卡片宽度时拿到的是缩放后的尺寸（104 → 102.5），而 `transform` 的位移是在未缩放坐标系里生效的，两者一混，中奖格系统性偏左。改用 `offsetWidth` / `offsetLeft` 后，实测中奖格中心与指针中心偏差 0–6px（指针宽 2px、格子宽 104px，肉眼在格内）。\n\n---\n\n## 验收\n\n| 项目 | 结果 |\n| --- | --- |\n| 版本号四处一致 | 4.5.0 |\n| 后端 / 静态测试 | 3277 项全过（新增【96】段 20 项） |\n| 浏览器行为测试 | 32 项全过 |\n| 部署门禁 | 全绿（含文案检查、资源清单、备份 367KB） |\n| 线上资源 | `pickfx.js` 200，`sw.js` 4.5.0，接口 4.5.0 |\n| 断网实测 | 通过 |\n\n**新增门禁**：`pickfx.js` 纳入文案书面化检查与 Pages 发布白名单 —— 以后改动画文案，口语表述同样会挡住部署。\n\n---\n\n## 取舍说明\n\n1. **舞台跟随页面昼夜**（按你的选择）。浅底上光晕会比深底柔和一些，已用更饱和的色值补偿；深色模式是这套动画最好看的状态。\n2. **10 连宝箱约 20 秒**：首轮 3.1 秒，之后每轮 1.5 秒 + 0.9 秒停留。嫌长就点「跳过」，或直接用盲盒 / 抽卡。\n3. **颜色只表示学号段，不表示稀有度**：这是按你的要求做的「悬疑感」—— 光色一出来，台下能猜是哪一段的人。\n"},{"p":"v4.5.0_2026-11-05_随机点名抽取动画/v4.5.0_2026-11-05_宝箱-停针揭示.png","n":"v4.5.0_2026-11-05_宝箱-停针揭示.png","d":"2026-11-05","sz":248758,"u":"a/3b75b810057d170f.jpg"},{"p":"v4.5.0_2026-11-05_随机点名抽取动画/v4.5.0_2026-11-05_宝箱-隐藏姓名转动.png","n":"v4.5.0_2026-11-05_宝箱-隐藏姓名转动.png","d":"2026-11-05","sz":224568,"u":"a/d963fbab31ba307c.jpg"},{"p":"v4.5.0_2026-11-05_随机点名抽取动画/v4.5.0_2026-11-05_手机-十连抽卡.png","n":"v4.5.0_2026-11-05_手机-十连抽卡.png","d":"2026-11-05","sz":332730,"u":"a/f185297ad36ef44b.jpg"},{"p":"v4.5.0_2026-11-05_随机点名抽取动画/v4.5.0_2026-11-05_深色-抽卡光柱.png","n":"v4.5.0_2026-11-05_深色-抽卡光柱.png","d":"2026-11-05","sz":182545,"u":"a/33b7acf5e46eac1a.jpg"},{"p":"v4.5.0_2026-11-05_随机点名抽取动画/v4.5.0_2026-11-05_深色-抽卡已翻.png","n":"v4.5.0_2026-11-05_深色-抽卡已翻.png","d":"2026-11-05","sz":196734,"u":"a/77ba641c9252cdb1.jpg"},{"p":"v4.5.0_2026-11-05_随机点名抽取动画/v4.5.0_2026-11-05_深色-抽卡待翻.png","n":"v4.5.0_2026-11-05_深色-抽卡待翻.png","d":"2026-11-05","sz":152559,"u":"a/f073c8e0b9f8a1f2.jpg"},{"p":"v4.5.0_2026-11-05_随机点名抽取动画/v4.5.0_2026-11-05_盲盒-已开启.png","n":"v4.5.0_2026-11-05_盲盒-已开启.png","d":"2026-11-05","sz":208177,"u":"a/fe75619db20742e4.jpg"},{"p":"v4.5.0_2026-11-05_随机点名抽取动画/v4.5.0_2026-11-05_盲盒-彩色光柱.png","n":"v4.5.0_2026-11-05_盲盒-彩色光柱.png","d":"2026-11-05","sz":203907,"u":"a/f9ecddb652192651.jpg"},{"p":"v4.5.0_2026-11-05_随机点名抽取动画/v4.5.0_2026-11-05_盲盒-待开启.png","n":"v4.5.0_2026-11-05_盲盒-待开启.png","d":"2026-11-05","sz":170565,"u":"a/f7910a0d2ecc73ce.jpg"},{"p":"v4.5.0_2026-11-05_随机点名抽取动画/v4.5.0_2026-11-05_结果页-学号分段色.png","n":"v4.5.0_2026-11-05_结果页-学号分段色.png","d":"2026-11-05","sz":165284,"u":"a/6aa48a150d5f35cf.jpg"},{"p":"v4.5.0_2026-11-05_随机点名抽取动画/v4.5.0_2026-11-05_设置区-动画档位.png","n":"v4.5.0_2026-11-05_设置区-动画档位.png","d":"2026-11-05","sz":159956,"u":"a/14f516dc6aff013b.jpg"},{"p":"v4.5.0_2026-11-05_随机点名抽取动画/v4.5.0_2026-11-05_设置区-宝箱与隐藏姓名.png","n":"v4.5.0_2026-11-05_设置区-宝箱与隐藏姓名.png","d":"2026-11-05","sz":170375,"u":"a/1ad81262c8fc9262.jpg"}]},{"dir":"v4.4.5_2026-11-05_软件简介书面化-表头吸顶加固-视频悬浮球限域","ver":"v4.4.5","date":"2026-11-05","title":"软件简介书面化-表头吸顶加固-视频悬浮球限域","theme":false,"count":7,"files":[{"p":"v4.4.5_2026-11-05_软件简介书面化-表头吸顶加固-视频悬浮球限域/v4.4.5_2026-11-05_交付说明.md","n":"v4.4.5_2026-11-05_交付说明.md","d":"2026-11-05","sz":5367,"t":"# v4.4.5 交付说明（2026-11-05）\n\n## 一、你提的三件事\n\n### 1. 全班成绩单表头不跟着滚动（轻量模式）\n\n**原因**：表头用的是 `position: sticky`，但这个写法在老内核里不生效 —— 微信内置浏览器（X5）等只认带前缀的 `-webkit-sticky`，遇到没前缀的会直接当成普通定位，表现就是「滚上去就不动了」。轻量模式多开在低配安卓 / 微信里，所以这个症状只在轻量模式下暴露。\n\n**改法**（`index.html`）：\n\n| 项 | 改前 | 改后 |\n| --- | --- | --- |\n| 定位 | `position:sticky` | `position:-webkit-sticky;position:sticky` |\n| 顶部偏移 | `top:0` | `top:-1px`（滚动时数据行不会从 1px 缝里透出来） |\n| 下边框 | 只有 border | 补 `box-shadow` 垫底，遮住透出的半行 |\n| 暗色 | 沿用亮色底 | 单独配色 `#3d3631` |\n\n前两列（班排 / 姓名）的吸附也同步加了前缀，横拖时列不会错位。\n\n### 2. 软件简介没按官方口径改\n\n14 张卡片的 `desc` 全部重写，去掉第二人称、语气词与「点击下方按钮」这类指令句：\n\n| 卡片 | 改前 | 改后 |\n| --- | --- | --- |\n| 作业查看 | 周作业及假期作业都在站内看。点「查看当前作业」看今天这一期… | 站内查看周作业与假期作业。「查看当前作业」显示当前日期所属期次，「历史作业」按日期检索往期。 |\n| 意见反馈 | …都可以在这里匿名提交。好的点子、槽点、建议都可以畅所欲言，我们会认真查看。 | 班级事务的意见与建议提交入口，支持匿名提交，由管理员统一查阅。 |\n| 听歌平台 | …课上一起听歌更自在。 | …可安装于教室电脑使用。 |\n| 每日日报 | 点击下方按钮即可查看最新热点内容。 | 点击按钮查看当日内容。 |\n\n正文提示一并改：账号资料、成绩分享、AI 分析说明、加密导出、音频提示、「正在为您跳转」「您有 N 行未保存」等，全部改成陈述句 / 无主语句。\n\n空态与流程提示也一起收了口：\n\n| 改前 | 改后 |\n| --- | --- |\n| 还没有投票。管理员在后台发起投票后，这里就会出现。 | 暂无投票。管理员发起投票后将在此显示。 |\n| 意见反馈需要登录后才能打开。登录后回到这里打开即可进入。 | 意见反馈需登录后查看，登录完成后返回本页。 |\n| 这次考试还没有成绩。 | 本次考试暂无成绩。 |\n| 云端还没有数据。 | 云端暂无数据。 |\n| 老师还没有开放分享功能。 | 分享功能尚未开放。 |\n| 等下一次考完就能看到趋势和进退步了。 | 完成下一次考试后可查看趋势与进退步。 |\n| 到日子同学打开「作业」就能看到 | 到达起始日期后成员可在「作业」中查看 |\n| 同学刷新就能看到 | 成员刷新后可见 |\n\n内置公告：`app.js` 里 90 条早期长公告（近 10KB）清空，只留 2 条离线兜底；云端公告仍是 v4.4 批次的简洁版，并把原来单独一条的 v4.4.1 合并进来，现在一个批次只有一条。\n\n**部署前检查**：新增 `scripts/copycheck.mjs`，已接进 `scripts/predeploy.mjs` 作为硬闸门 —— 扫 12 个会显示文案的文件，命中任一条就 `exit 1`，不给部署：\n\n- 第二人称：你 / 您 / 你的 / 你看\n- 口语动词：点一下 / 点开 / 试试 / 搞定 / 弄好 / 别忘\n- 口语副词与描述：其实 / 反正 / 随便 / 挺 / 一目了然 / 一眼看清\n- 宣传腔：敬请期待 / 即将上线\n- 语气词：啦 / 呗 / 咯 / 哈哈，以及「……吧。」「……哦！」\n- 空态口语：还没有……。\n- 口语收尾：就会出现 / 就能看到 / 就会显示 / 即可进入 / 盯一下 / 勾一下\n\n内容素材（学习卡片、班级签、彩蛋语料）走区块豁免，不按界面文案管。查具体位置用 `node scripts/copycheck.mjs --list`。\n\n### 3. 视频悬浮球只在大屏服务显示\n\n`videoBubbleShow()` 现在按当前板块判定：只有在大屏服务（板块 2）且存在上次播放地址才显示。切换板块或回首页立即收起，回到大屏服务自动恢复。\n\n实测 7 个步骤：首页关闭视频 → none；进大屏服务 → flex；点球重开 → 成功；板块内关闭 → flex；切常用服务 → none；回大屏服务 → flex；回首页 → none。\n\n## 二、验收\n\n- 线上 `SITE_VERSION = 4.4.5`，接口 `x-api-ver = 4.4.5`，`app.min.js` 已更新\n- 后端测试 3256 项全过（新增【95】段 11 项，覆盖文案检查、表头前缀、悬浮球判定）\n- 浏览器行为测试 32 项全过\n- 部署门禁全绿：版本一致 / 公告合规（6 分类 160 字）/ 文案书面化 / 资源清单 / 无重复函数 / 无明文口令 / README 同步\n- 备份 365KB\n\n## 三、还没把握的一处\n\n表头这项我在 Chromium 里（含 390×844 手机视口、轻量开与关）都是正常的，所以没能复现你看到的现象。这次是**按「老内核不认无前缀 sticky」这个已知问题**做的加固，覆盖面最广。\n\n如果更新后还是不动，麻烦告诉我两点：一是用什么打开的（微信里 / 手机浏览器 / 教室电脑），二是你怎么滚的 —— 手指落在表格上滚，还是在页面上滚。这两个信息能直接定位是内核问题还是布局问题。\n"},{"p":"v4.4.5_2026-11-05_软件简介书面化-表头吸顶加固-视频悬浮球限域/v4.4.5_2026-11-05_作业简介.png","n":"v4.4.5_2026-11-05_作业简介.png","d":"2026-11-05","sz":560336,"u":"a/8ce75b4868b7cc5c.jpg"},{"p":"v4.4.5_2026-11-05_软件简介书面化-表头吸顶加固-视频悬浮球限域/v4.4.5_2026-11-05_大屏服务内显示悬浮球.png","n":"v4.4.5_2026-11-05_大屏服务内显示悬浮球.png","d":"2026-11-05","sz":546070,"u":"a/338be15cd2f403fd.jpg"},{"p":"v4.4.5_2026-11-05_软件简介书面化-表头吸顶加固-视频悬浮球限域/v4.4.5_2026-11-05_意见反馈简介.png","n":"v4.4.5_2026-11-05_意见反馈简介.png","d":"2026-11-05","sz":413802,"u":"a/13adfdbb314587cd.jpg"},{"p":"v4.4.5_2026-11-05_软件简介书面化-表头吸顶加固-视频悬浮球限域/v4.4.5_2026-11-05_成绩单表头吸顶.png","n":"v4.4.5_2026-11-05_成绩单表头吸顶.png","d":"2026-11-05","sz":271755,"u":"a/51bbff4288886510.jpg"},{"p":"v4.4.5_2026-11-05_软件简介书面化-表头吸顶加固-视频悬浮球限域/v4.4.5_2026-11-05_线上公告.png","n":"v4.4.5_2026-11-05_线上公告.png","d":"2026-11-05","sz":432738,"u":"a/5125d45092fe6835.jpg"},{"p":"v4.4.5_2026-11-05_软件简介书面化-表头吸顶加固-视频悬浮球限域/v4.4.5_2026-11-05_首页不再出现悬浮球.png","n":"v4.4.5_2026-11-05_首页不再出现悬浮球.png","d":"2026-11-05","sz":405354,"u":"a/b1dfea661662d481.jpg"}]},{"dir":"v4.4.4_2026-11-05_文案统一站内改为书面表述公告只写更新内容","ver":"v4.4.4","date":"2026-11-05","title":"文案统一站内改为书面表述公告只写更新内容","theme":false,"count":4,"files":[{"p":"v4.4.4_2026-11-05_文案统一站内改为书面表述公告只写更新内容/v4.4.4_2026-11-05_交付说明.md","n":"v4.4.4_2026-11-05_交付说明.md","d":"2026-11-05","sz":3374,"t":"# v4.4.4 交付说明 · 站内文案统一\n\n**一句话**：站内提示、说明、公告全部改成书面表述；公告只写「更新了什么」，不再写怎么操作、有什么好处。\n\n## 一、你指出的两个问题，分别怎么处理\n\n**① 抽取备注**\n\n| | 改前 | 改后 |\n| --- | --- | --- |\n| 标题 | 这次是干嘛的（写一句，以后翻得到） | 备注 |\n| 占位 | 例如：语文课抽查背诵 | 选填，填写本次抽取事由 |\n| 小字 | 暂时只记在这台电脑上（管理员登录后自动同步） | 未登录，记录暂存本机 |\n\n**② 公告**\n\n74 条历史公告全部重写。原来最长 790 字，现在最长 123 字，平均 35 字。只保留【分类】+ 一句更新内容，删掉操作步骤、使用建议、效果描述。\n\n以 v4.3 为例：\n\n改前 8 条、468 字，写满了「不用再一科一科添加」「更好点」「尽量少留空白」这类话。改后：\n\n```\nv4.3 更新\n【作业】新建期次自动预设六科\n【作业】仅显示日期范围内的作业，无作业时明确提示\n【界面】侧栏新增倒计时；随机一言支持定时更换\n【界面】新增字体切换与昼夜模式；锁定后保持清晰\n【作业】开启大屏模式后默认进入作业页\n```\n\n## 二、全站改了哪些措辞\n\n统一原则：陈述句、不用第二人称、不加语气词、动作统一「点击」、状态统一「已 / 暂无 / 无法」。\n\n| 位置 | 改前 | 改后 |\n| --- | --- | --- |\n| 大屏筛选说明 | 条件可以叠加：比如「学生 + 男 + 总分名次 1–10」 | 多个条件可叠加使用 |\n| 大屏空态 | 今天不在任何一期作业的日期里，先歇会儿 | 当前日期无作业安排 |\n| 大屏提示 | 点一下换一句 / 点一下看大图 | 换一句 / 查看大图 |\n| 首页登录引导 | 登录一下，数据跟着你走 ☁️ | 登录后数据同步至云端 |\n| 首页登录按钮 | 先不用，谢谢 | 暂不登录 |\n| 时钟页 | 按开始就往上走 · 中途点「记一笔」把这段时间记下来 | 开始后自动累计，可随时「记一笔」记录本段内容 |\n| 后台身份栏 | 同学用它登录，告诉他初始密码 | 成员使用该账号登录，请告知初始密码 |\n| 后台字段 | 已被你覆盖 | 已由字段设置覆盖 |\n| 后台列表 | 还没加载完，稍等一下 | 正在加载 |\n\n覆盖范围：大屏作业页与点名、首页、时钟页、分享页、后台（成员档案、字段管理、提醒、数据管理、回档、歌单与券码等）。装饰性 emoji 从正文中删除，功能图标保留。\n\n## 三、验收\n\n- 线上 `SITE_VERSION = 4.4.4`，接口 `x-api-ver = 4.4.4`\n- 后端与静态测试 3247 项全过（其中 5 条旧文案断言已随文案更新）\n- 浏览器行为测试 32 项全过\n- 部署门禁全绿：版本号一致 → 版本记录 → 公告措辞 → 自动备份\n- 公告已在线生效，首页 74 条均为新格式\n\n## 四、未改动的地方（有意保留）\n\n- 后台「版本更新」里的历史技术记录（release notes）：那是开发账本，不是给同学看的公告，保留原有细节\n- 代码注释：不对外显示\n- 站内学习资料正文（物理、生物等知识卡）：属于内容，不属于提示语\n\n如果还有哪一句读着不像官方说明，把这句原话发我，我按同一套标准改。\n"},{"p":"v4.4.4_2026-11-05_文案统一站内改为书面表述公告只写更新内容/v4.4.4_2026-11-05_抽取结果与备注.png","n":"v4.4.4_2026-11-05_抽取结果与备注.png","d":"2026-11-05","sz":165730,"u":"a/54a2d127eafe1574.jpg"},{"p":"v4.4.4_2026-11-05_文案统一站内改为书面表述公告只写更新内容/v4.4.4_2026-11-05_点名筛选说明.png","n":"v4.4.4_2026-11-05_点名筛选说明.png","d":"2026-11-05","sz":195279,"u":"a/58f5364f5ef3c0bb.jpg"},{"p":"v4.4.4_2026-11-05_文案统一站内改为书面表述公告只写更新内容/v4.4.4_2026-11-05_线上公告列表.png","n":"v4.4.4_2026-11-05_线上公告列表.png","d":"2026-11-05","sz":523036,"u":"a/b9dac432a06d6021.jpg"}]},{"dir":"v4.4.2_2026-11-05_身份拆细8个班干部职务+课代表","ver":"v4.4.2","date":"2026-11-05","title":"身份拆细8个班干部职务+课代表","theme":false,"count":4,"files":[{"p":"v4.4.2_2026-11-05_身份拆细8个班干部职务+课代表/v4.4.2_2026-11-05_交付说明.md","n":"v4.4.2_2026-11-05_交付说明.md","d":"2026-11-05","sz":2714,"t":"# v4.4.2 交付说明 · 点名身份拆细\n\n**一句话**：身份多了「课代表」一档，「班干部」不再要求把身份改成那三个字 —— 你班里现有的头衔数据直接就能抽，**不用再改任何人的资料**。\n\n## 一、现在的实际情况（线上真实数据）\n\n| 勾这个 | 可抽人数 | 抽到的是谁 |\n| --- | --- | --- |\n| 学生 | 65 | 全班（老师 / 管理员不算） |\n| 班干部 | 7 | 卢垚明、刘佳欣、樊筱雅、余子康、范名扬、桂祺、朱俊雅 |\n| 课代表 | 6 | 雷其桐、邹亦汐、车宇辰、范名扬、杨梓俊、杜语熙 |\n\n课代表正好 6 个，一人一科；范名扬既在班干部里也在课代表里（体育委员 + 生物课代表），两头都能抽到他。\n\n## 二、改了什么\n\n1. **新增「课代表」档**：身份筛选从 4 个按钮变 5 个 —— 学生 / 班干部 / 课代表 / 老师 / 管理员。\n2. **「班干部」改成认职务**：以前只认身份栏写死了「班干部」三个字的人，而你班里身份栏写的都是「学生」，所以上次勾上可抽 0 人。现在认这些：班长 / 副班长 / 学习委员 / 劳动委员 / 生活委员 / 团支书 / 体育委员 / 宣传委员 / 文艺委员 / 纪律委员，其它「××委员」也自动算（以后加个心理委员不用改代码）。\n3. **数据来源用的是后台「头衔任命」**：职务本来存在那里（课代表还能改本科作业，是真正在用的那套）。这次让点名读同一份数据，所以不需要你再去逐个填。\n4. **「学生」放宽**：除老师、管理员以外都算学生 —— 班干部、课代表本来就是学生，抽全班不用再叠加条件。\n5. **后台身份栏加了一句提示**：班级职务别写进「身份」，去下面「头衔（可多选）」里勾。身份栏以后就写 学生 / 走读 / 住校。\n\n## 三、验收\n\n- 线上 `SITE_VERSION = 4.4.2`，接口 `x-api-ver = 4.4.2`\n- 后端 / 静态测试 3247 项全过（新增 12 条专门测这个：班长命中班干部、语文课代表命中课代表但不进班干部、老师不进学生…）\n- 浏览器行为测试 32 项全过\n- 线上真机截图：勾班干部 7 人、勾课代表 6 人、真抽 3 人抽出余子康 / 卢垚明 / 桂祺（全是班干部）\n- 部署门禁全绿：版本号一致 → 版本记录 → 公告 → 自动备份（374KB）\n\n## 四、你还要做什么\n\n**什么都不用做。** 打开大屏点名，展开「修改」，勾「班干部」或「课代表」就能抽。\n\n如果以后班里换了职务（比如新选了宣传委员），去后台「头衔任命」勾上，点名立刻认；不用改代码，也不用动身份栏。\n"},{"p":"v4.4.2_2026-11-05_身份拆细8个班干部职务+课代表/v4.4.2_2026-11-05_抽3个班干部.png","n":"v4.4.2_2026-11-05_抽3个班干部.png","d":"2026-11-05","sz":182175,"u":"a/a7a7866c0e3bf98c.jpg"},{"p":"v4.4.2_2026-11-05_身份拆细8个班干部职务+课代表/v4.4.2_2026-11-05_班干部7人.png","n":"v4.4.2_2026-11-05_班干部7人.png","d":"2026-11-05","sz":216365,"u":"a/e047d3ddecb54b65.jpg"},{"p":"v4.4.2_2026-11-05_身份拆细8个班干部职务+课代表/v4.4.2_2026-11-05_课代表6人.png","n":"v4.4.2_2026-11-05_课代表6人.png","d":"2026-11-05","sz":216944,"u":"a/b4f7acbec85f5639.jpg"}]},{"dir":"v4.4.1_2026-11-04_画像下拉的线上修正","ver":"v4.4.1","date":"2026-11-04","title":"画像下拉的线上修正","theme":false,"count":12,"files":[{"p":"v4.4.1_2026-11-04_画像下拉的线上修正/v4.4.1_2026-11-04_交付说明.md","n":"v4.4.1_2026-11-04_交付说明.md","d":"2026-11-04","sz":6138,"t":"# v4.4.1 交付说明（2026-11-04）\n\n> 6 条要求全部上线，前端 / 后端 / Service Worker 三处版本号一致：**4.4.1**\n\n---\n\n## 一、逐条对照\n\n| # | 你的要求 | 做法 | 截图 |\n|---|---|---|---|\n| 1 | 随机抽人新增「班干部」身份 | 身份多一档，值走后台「成员档案 → 身份」那个文本框 | 04 |\n| 2 | 五种字体设了没反应，看起来一样 | **真 bug，已找到根因**：全局 `*{font-family:…}` 把每个元素钉死 | 02 |\n| 3 | 作业看板点时钟进去，返回要回作业看板 | 记住「从哪儿点的」，原路返回 | — |\n| 4 | 抽取要有历史 + 备注 + 上云 | 时间 / 条件 / 人数 / 名单 / 备注，本机记 + 云端同步 | 05 |\n| 5 | Classworks 退场，图标先写「作业」 | 不再跳外站、不挂人家 logo，图标就是「作业」两字 | 01 |\n| 6 | 管理员能看其他同学的个人画像 | 画像顶部加「查看画像」下拉，60 人随便挑 | 06 / 07 |\n\n---\n\n## 二、第 2 条：字体为什么一直没变（重点）\n\n**不是字体栈写错，是一条全局样式把整页锁死了。**\n\n```css\n/* 旧代码 */\n*{ margin:0; padding:0; …; font-family:'Inter','PingFang SC',… }\n```\n\n`*` 是「直接声明」，**优先级高过继承**。它的意思是「每个元素自己都长这样」，\n于是大屏页上换的 `--bhw-font` 只在最外层容器自己身上生效，里面所有文字纹丝不动。\n\n```css\n/* 新代码 */\n*{ margin:0; padding:0; … }          ← 不再带字体\nhtml{ font-family:'Inter','PingFang SC',… }   ← 挂到 html，靠继承往下传\n```\n\n改完实测（Playwright 读真实渲染值）：\n\n| 选项 | 浏览器实际用的字体栈 |\n|---|---|\n| 黑体（默认） | `Inter, \"PingFang SC\", \"HarmonyOS Sans SC\", …` |\n| 宋体 | `\"Songti SC\", SimSun, \"Source Han Serif SC\", …` |\n| 楷体 | `\"Kaiti SC\", KaiTi, STKaiti, 楷体, serif` |\n| 圆体 | `YouYuan, \"Yuanti SC\", \"Hiragino Sans GB\", …` |\n| 等线 | `DengXian, 等线, \"Microsoft YaHei UI\", …` |\n\n切到楷体后，正文元素的 computed 值确实变成 `\"Kaiti SC\", KaiTi, …`。\n\n> **截图 02 看起来五条差不多，是因为我这台机器（Linux）没装楷体/宋体/等线字库**，\n> 全部 fallback 到同一个中文字体。教室那台 Windows 上五种差异是肉眼可见的。\n> 判断有没有真生效，可以点「字体」换成楷体，再看作业正文 —— 楷体带顿笔，一眼能认出来。\n\n---\n\n## 三、第 1 条：班干部现在还抽不到人（要做一步）\n\n线上 65 人里，身份分布是：**学生 63 / user 1 / 空 1 —— 没有一个人的身份写着「班干部」**。\n\n所以现在勾「班干部」，可抽人数是 **0**。这是数据问题，不是功能问题。\n\n**要让它能用，去后台把班干部的身份改一下：**\n\n1. 进后台 → 成员管理 → 找到这个人 → 编辑\n2. 「身份」那一栏现在是「学生」，改成 **`班干部`**\n3. 保存（大屏刷新一下即可）\n\n身份是自由文本，写「班长」「团支书」也能抽，但**只有写「班干部」这三个字**才会被那个按钮匹配到。\n等我们都填好之后，勾「班干部」就能只从这几个人里抽。\n\n---\n\n## 四、第 3 条：时钟返回\n\n| 你从哪点的时钟 | 点返回会去哪 |\n|---|---|\n| 作业看板右侧的时钟 | 回到作业看板（`?big=1#/hw`，还是满屏作业） |\n| 首页「全屏时钟」图标 | 回到首页 |\n\n原来返回写死 `./index.html`，从作业页进去再回来就掉到图标墙了。\n\n---\n\n## 五、第 4 条：抽取历史\n\n每次抽完**自动**记一条，不用手动保存：\n\n```\n11月5日 00:44   3 人\n条件：学生\n卢垚明  刘竹琳  梁咏佳\n[备注：语文课抽查背诵，明天课上默写]\n```\n\n- **时间**：精确到分钟\n- **条件**：当时用的筛选（身份 / 性别 / 学号 / 成绩）\n- **人数 + 名单**\n- **备注**：结果页下方直接写，历史面板里也能补；边打边存本机，松手 0.8 秒后推云端\n- **上云**：管理员登录时整包推到云端，换台设备（手机、家里电脑）也看得到\n- **重抽同步**：单个人点「重抽」，那条历史会跟着改，不会出现「屏幕和记录对不上」\n- 最多留 300 条，历史面板右上角可以单条删\n\n入口：点名面板底部「抽取历史（N）」。\n\n---\n\n## 六、第 6 条：个人画像看别人\n\n顶部多了一个「查看画像」下拉，三种情况：\n\n| 谁在登录 | 默认看谁 | 能不能切 |\n|---|---|---|\n| 学生本人 | 自己 | 不能（看不到这个下拉） |\n| 学生 + 管理员 | **自己**（按你的要求，优先本人） | 能 |\n| 纯管理号（比如班级电脑那个） | 自动选成绩表第一个学生 | 能 |\n\n切到别人时，下拉右边会出现「正在看别人的画像」提示，防止看错人。\n\n截图 06 是默认（余子轩 561 分、班排 1/60），07 是切到吴俊驰（536 分、班排 4/60）——数据整页跟着换。\n\n---\n\n## 七、第 5 条：Classworks 退场\n\n- 「作业查看」卡片不再跳外站，删掉了「🌐 前往 Classworks」按钮\n- 图标从人家的 logo 换成橙色方块 + **「作业」**两个字\n- 副标题不再写 Classworks\n- 两条老公告改写，访问提示里那一行也删了\n\n手机、微信打开首页同样生效（都是同一份数据）。\n\n---\n\n## 八、验证数据\n\n| 项目 | 结果 |\n|---|---|\n| 后端端到端 | 3231 项通过 / 0 失败（3849 次 SQL） |\n| UI 自动化 | 32 项通过 / 0 失败 |\n| 线上真实登录验收 | 无页面报错 |\n| 画像下拉 | 60 个选项，切换后数据全变 |\n| 抽取历史 | 2 条真实记录，备注写入成功 |\n| 部署门禁 | 全绿，已备份 372KB |\n\n---\n\n## 九、顺手修的一个线上 bug\n\n第一版 4.4.0 上线后，画像页打不开，显示「读取失败」。\n\n原因：成绩行的 `id` 是**数字**，而 `esc()` 内部直接 `.replace`，只吃字符串 ——\n本地测试用的是字符串 id，所以没暴露出来。线上真机一跑就炸。\n\n已修（`String()` 包一层），4.4.1 就是这一版。\n"},{"p":"v4.4.1_2026-11-04_画像下拉的线上修正/v4.4.1_2026-11-04_作业数据备份-20261104.json","n":"v4.4.1_2026-11-04_作业数据备份-20261104.json","d":"2026-11-04","sz":5214,"t":"{\n  \"app\": \"class-site\",\n  \"kind\": \"homeworks-backup\",\n  \"ver\": 1,\n  \"siteVersion\": \"4.3.0\",\n  \"exportedAt\": \"2026-11-04T06:54:30.037Z\",\n  \"homeworks\": [\n    {\n      \"_t\": \"🎉 国庆假期作业（10.1–10.7）\",\n      \"id\": \"hw-2026-guocing\",\n      \"end\": \"2026-10-07\",\n      \"items\": [\n        {\n          \"tasks\": [\n            \"语文小练（A4 纸）：共 5 张\",\n            \"作文训练 ×2（一张 A4）\",\n            \"答题卡练字：写一面（不是一页）\",\n            \"同步练习 p9–19\"\n          ],\n          \"subject\": \"语文\"\n        },\n        {\n          \"tasks\": [\n            \"同步练习 p45–54\",\n            \"试卷 2 张\"\n          ],\n          \"subject\": \"数学\"\n        },\n        {\n          \"tasks\": [\n            {\n              \"text\": \"试卷 1 张（要写小作文）\",\n              \"audio\": \"https://videotourl.com/audio/1790831516084-d409a7b4-57c4-4e84-a092-9c994b703b27.mp3\",\n              \"audioLabel\": \"播放听力音频\"\n            },\n            \"自购英语阅读：写到老师折的那一处\",\n            \"每天英语打卡\"\n          ],\n          \"subject\": \"英语\"\n        },\n        {\n          \"tasks\": [\n            \"同步练习 p36–42\",\n            \"第三周练习试卷\",\n            \"第五周练习试卷\",\n            \"第十章专题提升试卷（背面为电场）\",\n            \"国庆试 .1_2026-11-04_抽取历史与备注.png","d":"2026-11-04","sz":280692,"u":"a/2861a6ba11058e04.jpg"},{"p":"v4.4.1_2026-11-04_画像下拉的线上修正/v4.4.1_2026-11-04_点名-班干部身份.png","n":"v4.4.1_2026-11-04_点名-班干部身份.png","d":"2026-11-04","sz":291162,"u":"a/97937b8fa5e31935.jpg"},{"p":"v4.4.1_2026-11-04_画像下拉的线上修正/v4.4.1_2026-11-04_班级电脑操作指南.md","n":"v4.4.1_2026-11-04_班级电脑操作指南.md","d":"2026-11-04","sz":7786,"t":"# 班级电脑操作指南（一次性，约 15 分钟）\n\n> 适用：教室希沃一体机 / Windows 10 / 已开启冰点还原\n> 做完之后：每次开机双击桌面图标 → 直接是最新版的作业大屏，不用登录，断网也能用\n> **手机、微信、家里电脑完全不用动，还是照旧**\n\n---\n\n## 先理解一句话\n\n我们**不删 Edge、不重装 Edge、不下载网站文件**。\n\n只做一件事：告诉 Edge —— 你记东西别记在 C 盘（会被擦掉），记到 D 盘。\n\n技术上是一个启动参数，操作上就是一个快捷方式。\n\n---\n\n## 第 0 步：确认 Edge 装在哪（30 秒）\n\n打开资源管理器，看这两个位置哪个有 `msedge.exe`：\n\n```\nC:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe\nC:\\Program Files\\Microsoft\\Edge\\Application\\msedge.exe\n```\n\n> 更快的办法：右键桌面上的 Edge 图标 → 属性 → 看「目标」那一栏，把引号里的路径记下来。\n\n记下这个路径，下面要用。下面示例用的是第一个（`(x86)` 那个，最常见）。\n\n---\n\n## 第 1 步：找老师临时解冻（这一步必须做）\n\n跟老师这么说就行：\n\n> 「老师，我想在我们班电脑的桌面上放一个上课用的快捷方式，需要临时关一下冰点还原，五分钟就好，弄完我马上开回来。」\n\n老师会通过希沃管家把 C 盘解冻，然后重启。\n\n**重启后先别急着做**，先看一眼右下角冰点图标是不是变成\"解冻\"状态了。\n\n---\n\n## 第 2 步：在 D 盘建文件夹\n\n打开 D 盘 → 新建文件夹 → 命名：\n\n```\nClassSite\n```\n\n进去再建一个子文件夹：\n\n```\nEdgeProfile\n```\n\n最终结构：\n\n```\nD:\\ClassSite\\\n    └─ EdgeProfile\\        ← 空文件夹就行，Edge 自己往里写\n```\n\n⚠️ `EdgeProfile` 这个名字**不要改**，下面命令里写死了。\n\n---\n\n## 第 3 步：建快捷方式\n\n1. 在 `D:\\ClassSite\\` 里 → 右键空白处 → **新建 → 快捷方式**\n2. 弹出「请键入对象的位置」，把下面**整行**粘进去（一次性粘完，不要分行）：\n\n```\n\"C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe\" --app=\"https://yuzikaaang.github.io/class-site/?big=1\" --user-data-dir=\"D:\\ClassSite\\EdgeProfile\" --no-first-run --no-default-browser-check\n```\n\n> 如果你的 Edge 在 `Program Files`（不带 x86），把第一段路径里的 `(x86)\\` 删掉。\n\n3. 点「下一步」→ 名称填 `班级站` → 完成\n\n> 粘贴不进去的话：先在记事本里粘好、检查一遍，再从记事本复制到那个框里。\n\n### 3.5 换成班级站自己的图标（可选，2 分钟）\n\n默认会显示 Edge 的图标，可以换成网站那个。\n\n1. 把 `班级站图标.ico` 复制到 **`D:\\ClassSite\\`**（和快捷方式放同一个文件夹，**不要放桌面**）\n2. 右键 `D:\\ClassSite\\班级站` → **属性** → **快捷方式** 标签页 → **更改图标...**\n3. 点 **浏览**，选中 `D:\\ClassSite\\班级站图标.ico` → 确定 → 确定\n4. 桌面上那个副本会自动跟着变（它指向同一个本体）\n\n> ⚠️ ico 文件必须留在 D 盘。放桌面或 C 盘，重启被还原后图标就变成白板了。\n> 想同时改任务栏的图标：先固定到任务栏，再按上面第 2–3 步改。若任务栏没跟着变，取消固定再重新固定一次。\n\n### 这行命令在干什么（不用懂，但知道一下有底）\n\n| 这一段 | 作用 |\n|---|---|\n| `--app=\"https://...\"` | 开一个没有地址栏、没有标签页的独立窗口，和 App 一样 |\n| `?big=1` | 直接进大屏作业模式 |\n| `--user-data-dir=\"D:\\ClassSite\\EdgeProfile\"` | **关键**：所有记忆存 D 盘，重启不被擦 |\n| `--no-first-run` | 跳过 Edge 首次使用的那些引导页 |\n\n---\n\n## 第 4 步：双击试一次（必须在解冻状态下做）\n\n双击 `D:\\ClassSite\\班级站`。\n\n**正常情况**：会开一个干净的大屏窗口，直接显示作业页。\n\n第一次会慢一点，因为要从网上把整个网站拉下来存进 D 盘 —— **这一步必须联网**。\n\n然后：\n\n1. 如果有「设为默认浏览器」之类的提示，选**否**（不要设，会影响老师用电脑）\n2. 在页面里**登录一次管理员账号**\n3. 点窗口右上角的**最大化**按钮（⬜），把画面铺满\n\n> 第 3 点很重要：Edge 会把这个窗口的大小记进 D 盘的 Profile，以后每次打开都是满屏，不用再点。\n\n### 这一步要确认三件事\n\n- [ ] 画面铺满，没有地址栏\n- [ ] 登录后能看到作业页，能翻到历史作业\n- [ ] 断网试一下（拔网线或在别处拔掉 WiFi）：还能打开、还能看作业\n\n---\n\n## 第 5 步：把图标放到桌面和任务栏\n\n1. 右键 `D:\\ClassSite\\班级站` → **复制**\n2. 回到桌面 → 右键空白处 → **粘贴快捷方式**\n3. 右键桌面上这个 `班级站` → **固定到任务栏**（可选，但强烈建议：开机任务栏一点就开）\n\n> ⚠️ 桌面放的是**副本**，本体必须留在 D 盘。因为桌面在 C 盘，重新冻结后副本会保留在\"基线\"里，但如果本体放在 C 盘，重启后目标文件就没了、点了报错。\n\n---\n\n## 第 6 步：重新开启冰点还原\n\n跟老师说：弄好了，麻烦把 C 盘重新冻结。\n\n老师操作完会重启一次。\n\n---\n\n## 第 7 步：重启后验收（5 项，2 分钟）\n\n重启完，**不要做任何设置**，直接双击桌面上的「班级站」：\n\n| # | 检查项 | 期望结果 |\n|---|---|---|\n| 1 | 双击能不能开 | 能开，直接是作业页 |\n| 2 | 还是不是登录状态 | **是**（不用重新登录）← 这条最关键 |\n| 3 | 画面是不是满屏 | 是 |\n| 4 | 字号 / 字体 / 主题 | 还是你上次设的 |\n| 5 | 版本号 | 是 4.3.3 或更新（点页面底部版本号能看） |\n\n**5 项全过 = 成功，以后什么都不用管了。**\n\n再重启一次确认一遍更稳妥（有些人第一次是\"运气好\"）。\n\n---\n\n## 做完之后，日常怎么用\n\n- 开机 → 双击桌面「班级站」→ 直接用\n- **版本永远自动最新**，你不用再去任何地方更新\n- 断网照样能打开、能看已缓存的作业、能用时钟\n- 有网时改动会自动传云端\n\n---\n\n## 出问题了怎么办\n\n| 现象 | 原因 | 怎么办 |\n|---|---|---|\n| 双击没反应 | Edge 路径写错了 | 回第 0 步确认路径，重做第 3 步 |\n| 打开是普通浏览器窗口，有地址栏 | 快捷方式里少了 `--app=` | 检查命令是否粘完整 |\n| **还是要重新登录** | 桌面那个图标指错地方了，或 `--user-data-dir` 路径错了 | 右键 → 属性 → 看「目标」，`D:\\ClassSite\\EdgeProfile` 必须在 |\n| 打开是旧版本 | 那次打开时没网 | 有网后关掉窗口重开一次；还不行就重启电脑 |\n| 页面一片空白 | 首次打开时无网，缓存没建起来 | 连上网，双击重开一次 |\n| 整个乱了想重来 | — | 删掉 `D:\\ClassSite\\EdgeProfile` 整个文件夹，重新走第 4 步 |\n\n---\n\n## 三个不要做\n\n1. **不要删 `D:\\ClassSite\\EdgeProfile`** —— 那是登录态和缓存，删了要重新登录一次\n2. **不要在这个窗口里登录别的网站** —— 这个浏览器是专用的，越干净越安全\n3. **不要把这个快捷方式拷给别人** —— 里面的路径是这台电脑专用的\n\n---\n\n## 顺便说清楚：其他设备完全不变\n\n| 设备 | 怎么用 |\n|---|---|\n| 手机 | 照旧，还是 PWA / 微信打开 |\n| 家里电脑 | 照旧，正常浏览器访问 |\n| 教室一体机 | **只有这一台**改成快捷方式启动 |\n\n网站代码这边的改动也做了隔离：只有带 `?big=1` 的入口走\"必须最新\"策略，其它所有入口（手机、微信、普通浏览器）的加载速度和以前一模一样（实测 43ms 首屏）。\n"},{"p":"v4.4.1_2026-11-04_画像下拉的线上修正/v4.4.1_2026-11-04_班级站-冰点还原环境运行方案-v1.md","n":"v4.4.1_2026-11-04_班级站-冰点还原环境运行方案-v1.md","d":"2026-11-04","sz":17407,"t":"# 冰点还原环境下的班级站运行方案\n\n> 目标机器：希沃一体机 / Windows 10 / Edge / 已开启冰点还原（每次重启回滚）\n> 方案版本：v1.1（讨论稿，未实施）\n> 日期：2026-11-04\n\n---\n\n## 〇、一页看懂（说人话版）\n\n### 打个比方\n\nEdge 就像个记事本，程序装在 C 盘。但它把自己记的东西（书签、登录状态、网页缓存）**藏在 C 盘的一个抽屉里**。\n\n冰点还原每次重启，就把这个抽屉**清成装系统那天的样子**。\n\n所以你今天在抽屉里放了 4.2 版，明天重启打开一看，抽屉里还是 4.0 那份 —— 不是网站没更新，是抽屉被清回去了。\n\n### 我们要做的事\n\n**不是换记事本，也不是把记事本搬到 D 盘。**\n\n而是告诉 Edge 一句话：**\"你的笔记别放 C 盘那个抽屉了，放 D 盘这个抽屉。\"**\n\n一句话就够，因为 D 盘不会被清。\n\n### 四个问题，一次回答\n\n| 你可能在想 | 答案 |\n|---|---|\n| 要删掉 Edge 吗？ | **不要删，一个字都别动。** Edge 程序就留在 C 盘，装在哪都无所谓 |\n| 要把 Edge 重装到 D 盘吗？ | **不用。** 装到 D 盘也没用，因为它的数据照样默认写 C 盘 |\n| 还继续用 PWA 吗？ | **不用了。** 见下面「PWA 那件事」 |\n| 那用什么打开？ | **一个快捷方式。** 双击它，出来一个没有地址栏的窗口，**和 PWA 长得一模一样**，你根本感觉不到区别 |\n\n### PWA 那件事，到底是什么意思\n\n\"不用 PWA\" 不是要你卸载什么，`Edge` 里也别去动。\n\n它的意思只是：**以后不要再点右上角那个「安装此应用」了。**\n\n原因：PWA 的\"我装过了\"这条记录，也写在 C 盘那个抽屉里。抽屉一清，桌面图标就变成点了没反应、或者要重新装一遍 —— 这就是你现在的处境。\n\n换个做法：**用快捷方式启动**。快捷方式是一行字，写在哪儿都存在（我们放 D 盘），不依赖任何\"安装记录\"，永远不会失效。\n\n而且外观完全一样：\n\n- 没有地址栏、没有标签页，就是一个独立窗口 ✅\n- 图标可以换成班级站自己的 logo ✅\n- 大屏全屏、manifest 里配的窗口尺寸照样生效 ✅\n\n**唯一的区别是：它不需要\"装\"，所以也不会\"装失败\"或\"被还原掉\"。**\n\n### 所以整套事情只有三步\n\n1. D 盘建一个文件夹，叫 `班级站数据`\n2. D 盘建一个快捷方式，里面填一行字（第三节有现成的，复制粘贴就行）\n3. 双击它，登录一次管理员账号。**以后永远不用再登**\n\n完事。不卸载、不重装、不动 C 盘。\n\n---\n\n## 一、先把病因说准\n\n你现在看到的现象（重启后回到 4.0、登录态丢失、缓存清空、断网啥都没有）看起来是四件事，其实是**同一件事的四个症状**：\n\n**Edge 的用户数据目录（Profile）在 C 盘，被冰点一起回滚了。**\n\nEdge 的 Profile 目录一般在：\n\n```\nC:\\Users\\<用户名>\\AppData\\Local\\Microsoft\\Edge\\User Data\\Default\\\n```\n\n这个目录里装着：\n\n| 内容 | 具体文件 | 丢了会怎样 |\n|---|---|---|\n| Service Worker 缓存 | `Service Worker\\CacheStorage\\` | 网站文件退回安装那一刻的版本（你看到的 4.0） |\n| localStorage | `Local Storage\\leveldb\\` | 字号、字体、主题、作业本地副本、登录 token 全没 |\n| Cookie | `Network\\Cookies` | 登录态丢失，每次要重登 |\n| PWA 安装注册 | `Web Applications\\` | 「已安装应用」消失，桌面图标失效 |\n| IndexedDB | `IndexedDB\\` | 大屏部分缓存数据 |\n\n所以这不是「版本号放在 C 盘」的问题，也不是「缓存没做好」的问题 —— 我们的 SW 其实已经写得挺完整了（缓存桶跟着版本走、页面能主动 update、带 `?v=` 指纹）。**问题在于整套东西被冻在了一个快照里。**\n\n这一点定了，方案的方向就只有一个：**把 Profile 挪到不会被冻结的地方**，而不是「把网站文件挪到 D 盘」。\n\n---\n\n## 二、你的两个想法，哪个行得通\n\n### 想法一：继续用 PWA，每分钟把数据自动同步到 D 盘，从 D 盘读\n\n**❌ 不成立。** 两个硬伤：\n\n1. **网页读不了 D 盘。** 浏览器沙箱不允许 JS 直接访问任意本地路径。唯一能让网页写本地文件的是 File System Access API（`showSaveFilePicker`），但它**必须由用户手动点选目录**授权，而且授权记录本身也存在 C 盘 Profile 里 —— 重启后授权失效，又得手动点一次。所以「每分钟自动下载覆盖到 D 盘」在纯网页里做不到，除非装一个本地程序。\n\n2. **就算数据搬过去了，版本还是回不来。** 版本卡在 4.0 的原因是 SW 的 CacheStorage 在 C 盘被回滚，跟你把数据文件放哪儿没关系。数据搬走、Profile 不搬 = 登录态照样丢。\n\n### 想法二：不用 PWA，整个站点的壳放 D 盘，数据走云端，缓存放 D 盘目录\n\n**⚠️ 半对。** 方向对了一半，但代价最大、坑最多：\n\n| 能解决 | 解决不了 |\n|---|---|\n| 壳文件不会被还原（D 盘不冻的话） | 登录态仍在 C 盘 Profile → 重启照样重登 |\n| 断网一定能打开（本地文件） | 壳自己怎么更新？还是得人去教室覆盖，或者再写一套更新脚本 |\n| | `file://` 下 SW 不可用、相对路径 fetch 受限、API 跨域要额外放开 Origin: null |\n| | 改造成本最高，后期调试最麻烦（你自己也判断到了） |\n\n而且它有个隐藏死结：**壳是新的，但 localStorage 是空的** —— 打开一片空白，等于\"第一次进站\"，这跟你现在最烦的问题一模一样。\n\n### 结论\n\n两个都不是最优解。真正更简单、改动更小的办法，是**想法一的\"放 D 盘\"思路 + 想法二的\"绕开 PWA 注册\"思路**，具体是下一节。\n\n---\n\n## 三、推荐方案：Profile 搬家 + `--app` 快捷方式\n\n### 3.1 原理\n\nChromium 系浏览器（Edge/Chrome）有一个官方启动参数：\n\n```\n--user-data-dir=\"D:\\ClassSite\\EdgeProfile\"\n```\n\n它的作用是**把整套用户数据目录（含 SW 缓存、localStorage、Cookie、PWA 注册）整体改到指定路径**。这是 Chromium 十几年的老功能，稳定可靠，也是自动化测试、多账号隔离的标准做法。\n\n一旦 Profile 落在 D 盘，冰点还原 C 盘就跟我们无关了 —— 重启后 C 盘干干净净，D 盘的那套东西一个字节都不少。\n\n### 3.2 为什么顺手不再用 PWA\n\n「安装为应用」产生的 PWA 注册信息也写在 Profile 里。既然 Profile 要搬，PWA 那套「安装 → 注册 → 桌面图标」的链路反而多了一层依赖，还原后图标和注册一起消失，看着像没装。\n\n改用 `--app=` 参数启动，效果和 PWA 外观完全一致（无地址栏、无标签栏的独立窗口，还认 manifest 里的图标和窗口尺寸），但**没有任何安装状态需要保存**，只是一个命令行参数。\n\n顺带解决一个已知坑：Edge 单实例复用会把 `--app` 吞掉变成普通标签页 —— 而我们给了独立 `--user-data-dir`，天然就是新进程，不会撞。\n\n### 3.3 落地配置（一次性，约 10 分钟）\n\n**第一步：地基验证（最重要，先做这个）**\n\n在 D 盘根目录新建一个 `测试.txt`，随便写点东西，然后**正常关机重启**，看它还在不在。\n\n- 还在 → D 盘未被冻结，方案可行，继续\n- 没了 → D 盘也被冻结，跳到第五节备选方案\n\n> 补充依据：希沃官方帮助文档明确写「由于 Windows 全球更新，导致希沃管家无法全盘冰冻，因此需至少保留一个非系统盘不冰冻」。所以 D 盘大概率是 Thawed 状态。但学校如果有运维改过配置，仍要实测确认。\n\n**第二步：建目录**\n\n```\nD:\\ClassSite\\\n    ├─ EdgeProfile\\        ← 浏览器数据，不要手动动它\n    └─ 班级站.lnk          ← 启动快捷方式\n```\n\n**第三步：建快捷方式**\n\n右键 → 新建 → 快捷方式，目标填（一整行，注意引号）：\n\n```\n\"C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe\" --app=\"https://yuzikaaang.github.io/class-site/?big=1\" --user-data-dir=\"D:\\ClassSite\\EdgeProfile\" --window-size=1920,1080 --no-first-run\n```\n\n若你的 Edge 装在 `Program Files`（64 位），把路径里的 `(x86)` 去掉。\n\n参数说明：\n\n| 参数 | 作用 |\n|---|---|\n| `--app=...` | 无地址栏独立窗口，等价 PWA 外观 |\n| `--user-data-dir=...` | **关键**：Profile 放 D 盘，重启不丢 |\n| `--window-size` | 直接全屏尺寸，省得每次拉窗口 |\n| `--no-first-run` | 跳过新 Profile 的首次引导页 |\n\n**第四步：首次启动并登录一次**\n\n双击快捷方式 → 会像一个全新浏览器（没有书签、没有历史，正常）→ 页面里登录一次管理员账号。\n\n这次登录的 token 就写进 `D:\\ClassSite\\EdgeProfile` 了，**以后重启都不用再登**。\n\n**第五步：重启验证**\n\n关机重启 → C 盘还原 → 双击 `D:\\ClassSite\\班级站.lnk`：\n\n- 应该直接进大屏作业页\n- 应该还是登录状态\n- 应该还是你上次用的字号/字体/主题\n\n### 3.4 桌面图标怎么办（你说的\"让老师解冻一次\"完全可行）\n\n不加处理的话，冰点会还原桌面，桌面上的快捷方式重启就没了。\n\n但你提的办法是对的，而且比\"每次从 D 盘双击\"好用得多 —— 原理是：\n\n> **冰点重新开启冻结的那一刻，会把 C 盘\"当前的样子\"当作新的保护基线。**\n> 也就是说，在解冻状态下建好的桌面快捷方式，重新冻结后会被**固化进基线**，以后重启照样在。\n\n所以正确顺序是这样（照着做就行）：\n\n1. 找老师临时解冻，重启进解冻状态\n2. 在 D 盘建好 `D:\\ClassSite\\EdgeProfile\\` 和 `D:\\ClassSite\\班级站.lnk`\n3. 双击试一次，登录一次管理员账号（确认能用）\n4. **把 `D:\\ClassSite\\班级站.lnk` 复制一份到桌面**\n5. 右键这个桌面图标 → **固定到任务栏**（可选，但很值得，开机一点就开）\n6. 确认没有别的东西要装、要改，然后**重新开启冻结**（重启）\n7. 重启后检查：桌面上图标在不在、任务栏在不在、双击能不能开\n\n第 7 步过了，以后就再也不用碰这些设置。\n\n⚠️ 三个提醒：\n\n- **快捷方式本身必须放 D 盘**，桌面只放它的\"副本\"。因为桌面那个 lnk 一旦指向 C 盘上的东西，重新冻结算然保留了这个图标，但目标文件会被清掉，点了报错。\n- **解冻期间的所有改动都会被固化成新基线** —— 好处是快捷方式留下了，坏处是那期间装了什么乱七八糟的推广软件、改了浏览器主页，也会一起被固化。所以解冻那十几分钟，别装任何别的东西。\n- 重新冻结前，把临时文件、测试文件清掉再冻，保持基线干净。\n\n如果老师不方便解冻，退化方案（按省事程度排）：\n\n1. 在 D 盘根目录放一个快捷方式，开机多点两层\n2. 希沃一体机桌面有「常用软件 / 教学应用」自定义区，可以把外部程序加进去（视型号和管家版本而定，不确定能不能加）\n3. 开机后本来就要开大屏，多点一下 D 盘也能忍\n\n### 3.5 这个方案带来的连带收益\n\n| 问题 | 是否解决 |\n|---|---|\n| 重启后版本退回旧版 | ✅ Profile 不还原，SW 缓存保持在上次最新 |\n| 每次要重新登录 | ✅ Cookie 在 D 盘 |\n| 断网啥都用不了 | ✅ SW 缓存 + localStorage 都在 D 盘，断网照常打开 |\n| 字号/字体/主题偏好每次重置 | ✅ localStorage 保留 |\n| 要重新「安装 PWA」 | ✅ 不再需要安装，`--app` 无状态 |\n| 桌面图标会消失 | ✅ 解冻一次、建好图标后重新冻结，会固化进新基线（见 3.4） |\n\n---\n\n## 四、网站侧要补的 3 处（工作量小，建议下一轮一起做）\n\nProfile 搬过去之后，版本更新链路就正常了。但为了让\"打开就是最新版\"这件事**确定**成立，而不是\"大概率成立\"，建议再补三处：\n\n### 4.1 导航请求改成 network-first（大屏模式下）\n\n现在 SW 的导航策略是「**缓存先给、后台再刷**」—— 这是当初为了弱网站点秒开做的优化。但对班级电脑来说，「新」比「快」重要得多。\n\n改法：当页面处于大屏模式（`?big=1` 或本地记录了大屏偏好）时，导航请求走 **network-first**：先等网络最多 2.5 秒，拿到就用最新的并写回缓存；超时或失败才回退缓存。\n\n效果：有网 = 必定最新；断网 = 2.5 秒后照常打开缓存版本。\n\n### 4.2 启动自检版本，落后就自动刷新\n\n现在页面有 `update()` 和 `SITE_VER` 对比，但需要用户点「检查更新」才提示。你抱怨的正是\"还要我自己去更新\"。\n\n改法：大屏启动时静默对比一次 `sw.js` 里的 `SITE_VER` 与本页 `SITE_VERSION`，发现落后就**自动带时间戳强制刷新一次**（只刷一次，用 sessionStorage 记标记避免刷新死循环）。用户感知不到过程，只会看到\"打开就是新的\"。\n\n### 4.3 作业页允许只读免登录\n\n作业内容本来就是要给全班看的，没有保密性。目前未登录时会弹出登录引导，这是**不必要的摩擦**。\n\n改法：大屏作业页在未登录时按只读模式渲染（能看、能翻历史、能用时钟、能点名抽取），只有「新建/编辑/删除」要求管理员身份。\n\n这条在极端情况下（比如 Profile 又出问题）也能让你至少看到作业内容，而不是一片\"请登录\"。\n\n> 是否需要这条请你定。如果担心别人看到不该看的东西（比如点名成绩的完整榜单），可以只放开作业正文，成绩榜仍然要登录。\n\n---\n\n## 五、备选方案（如果 D 盘也被冻结）\n\n### 方案 E1：U 盘 Profile（最稳，成本最低）\n\n把 `EdgeProfile` 放 U 盘，参数改成 `--user-data-dir=\"E:\\ClassSite\\EdgeProfile\"`。插上 U 盘就能用，拔掉就啥也没有。\n\n- 优点：完全绕开任何还原，换机器也能带着走\n- 缺点：依赖 U 盘，得记得插；U 盘读写慢一点（Profile 约 100–300MB，首次启动会慢些）\n\n### 方案 E2：找电教老师把 D 盘设为 Thawed\n\n这是最\"正统\"的做法 —— 冰点本来就支持分盘设置，机房和教室的标准做法都是\"冻 C 盘、放 D 盘\"。希沃官方文档也是这么建议的。如果学校运维愿意配合，一次配置永久受益。\n\n- 优点：零额外硬件、零改造成本\n- 缺点：要管理员密码，得沟通\n\n### 方案 E3：本地壳 + 本地静态服务（真正彻底，但最重）\n\nD 盘放全量站点文件 + 一个单文件 web server（Caddy，约 15MB，免安装），`start.bat` 启动后监听 `127.0.0.1:8080`，用 `--app=http://127.0.0.1:8080/?big=1` 打开。\n\n- 优点：断网 100% 可用，连 SW 都不依赖；版本可由一个 `curl` 脚本从云端拉 zip 覆盖\n- 缺点：多一个常驻进程、端口占用、CORS 要配、换版本要跑脚本\n- **建议**：只有在 Profile 方案实测失败时才上，不作为首选\n\n---\n\n## 六、安全说明（你提到的\"信息不能泄露\"）\n\nProfile 里确实存着登录 token 和 Cookie，需要说清风险边界：\n\n1. **拷走能用吗？** Chromium 的 Cookie 用 Windows DPAPI 加密，密钥绑定「当前用户 + 这台机器」。把整个 Profile 目录拷到另一台电脑，**解不开**，token 用不了。\n2. **同一台机器上别人能用吗？** 能 —— 同机同账户可以直接读。也就是说，谁坐在那台电脑前、以同一个 Windows 用户登录，就能以你的管理员身份操作班级站。\n3. **缓解措施**：\n   - 这个独立 Profile **只用来开班级站**，不要在里面登任何其他网站，暴露面最小\n   - 管理员密码不要贴在教室显眼处\n   - 后台操作日志本来就有记录，出问题能追\n4. **绝对不要做的事**：把 token 拼进 URL 当\"免登录链接\"（比如 `?token=xxx`）。URL 会进历史记录、进截图、被别人看到，这是真正会泄露的做法。\n\n---\n\n## 七、开工前需要确认的事\n\n| # | 要确认的 | 状态 |\n|---|---|---|\n| 1 | D 盘是否未被冻结 | ✅ 已确认：不冻结，可长期写 |\n| 2 | D 盘剩余空间 | ✅ 已确认：够用（Profile 约 100–300MB） |\n| 3 | 桌面图标 | ✅ 已解决：找老师临时解冻一次建好，重新冻结后保留（见 3.4） |\n| 4 | Edge 安装路径是 `Program Files (x86)` 还是 `Program Files` | 建快捷方式时看一眼，路径复制对就行 |\n\n---\n\n## 八、下一轮实施清单（等你拍板）\n\n- [ ] 你确认第 1、2、3 条的前提\n- [ ] 我在网站侧做 4.1（导航 network-first）+ 4.2（启动自检自动刷新）\n- [ ] 视你的意见做 4.3（作业页只读免登录）\n- [ ] 发一个 v4.3.2 小版本，你带到教室按第三节配置\n- [ ] 配置完重启验证，把结果告诉我，有问题再调\n\n---\n\n## 附：为什么不是\"把 Edge 整个搬到 D 盘\"\n\n你自己也判断对了 —— 普通安装版 Edge 的程序目录可以在 C 盘，但**缓存和数据默认永远在 C 盘**，除非用 `--user-data-dir`。所以\"搬程序\"没用，\"搬数据目录\"才有用。这正是本方案做的事，只是不需要搬程序、不需要便携版。\n"},{"p":"v4.4.1_2026-11-04_画像下拉的线上修正/v4.4.1_2026-11-04_班级站图标.ico","n":"v4.4.1_2026-11-04_班级站图标.ico","d":"2026-11-04","sz":33840,"x":1},{"p":"v4.4.1_2026-11-04_画像下拉的线上修正/v4.4.1_2026-11-04_画像-看别人.png","n":"v4.4.1_2026-11-04_画像-看别人.png","d":"2026-11-04","sz":250828,"u":"a/fc930a170391b8e1.jpg"},{"p":"v4.4.1_2026-11-04_画像下拉的线上修正/v4.4.1_2026-11-04_画像可选人.png","n":"v4.4.1_2026-11-04_画像可选人.png","d":"2026-11-04","sz":252639,"u":"a/32da5d9f757b3c2c.jpg"},{"p":"v4.4.1_2026-11-04_画像下拉的线上修正/v4.4.1_2026-11-04_首页作业图标.png","n":"v4.4.1_2026-11-04_首页作业图标.png","d":"2026-11-04","sz":584199,"u":"a/b359d5dae41ec769.jpg"}]},{"dir":"v4.3.3_2026-11-04_冰点还原环境适配教室一体机专用","ver":"v4.3.3","date":"2026-11-04","title":"冰点还原环境适配教室一体机专用","theme":false,"count":5,"files":[{"p":"v4.3.3_2026-11-04_冰点还原环境适配教室一体机专用/v4.3.3_2026-11-04_交付说明.md","n":"v4.3.3_2026-11-04_交付说明.md","d":"2026-11-04","sz":4247,"t":"# v4.3.3 交付说明 —— 冰点还原环境适配\n\n> 上线时间：2026-11-04 23:20\n> 线上版本：`4.3.3`（前端 / 后端 / SW 三处一致）\n\n---\n\n## 一句话\n\n**网站侧改完了，剩下的是在教室电脑上配一次（约 15 分钟），配完就永久生效。**\n\n---\n\n## 一、这次改了什么（只改了 3 处，都很小）\n\n| 文件 | 改了什么 | 为什么 |\n|---|---|---|\n| `sw.js` | 带 `?big=1` 的导航请求改「网络优先，最多等 2.5 秒」；其它入口一行没动 | 教室电脑要的是「打开必定最新」，不是「最快」 |\n| `sw.js` | 任何一次导航成功都顺手沉一份 `./index.html`；SW 激活后延时 3 秒补一次 | 修一个真空档：全新设备首次打开后立刻断网，原来会白屏 |\n| `big.js` | 新增 `selfHeal()`：大屏打开 4 秒后读 `sw.js` 比对版本，落后就静默强刷一次 | 你抱怨的「还要我自己去更新」——以后不用了 |\n\n---\n\n## 二、验证结果（都是实测，不是推断）\n\n### 1. 数据目录搬家到底管不管用\n\n同一个环境跑两轮，第二轮模拟「关机重启、C 盘被清空」：\n\n| 方式 | 登录 token | 字号 | 字体 |\n|---|---|---|---|\n| 默认（数据在 C 盘） | **丢了** | **丢了** | **丢了** |\n| `--user-data-dir` 指向 D 盘 | 在 | 在（1.35） | 在（楷体） |\n\n而且 SW 的缓存目录确实生成在了 D 盘那份 Profile 里（`Service Worker/CacheStorage` 有内容）。\n\n### 2. 线上真实站点（截图 01）\n\n```\n地址：/class-site/?big=1#/hw\n页面版本：4.3.3   线上版本：4.3.3\n作业页可见：是\n本次导航来自网络：是（transferSize 120087，不是缓存）\n```\n\n### 3. 重启后断网（截图 02）\n\n模拟「关机 → 重启 → 不联网 → 双击图标」：\n\n- 打开耗时 **43ms**\n- 六科作业完整显示\n- 右侧栏：时钟、倒计时（寒假 86 天 / 元旦 58 天）、随机点名、随机一言全在\n- 顶部显示「离线 · 存本机」\n- **登录态还在，字号字体还是设过的值**\n\n### 4. 别的地方没变慢\n\n| 场景 | 结果 |\n|---|---|\n| 手机 / 微信打开首页（有缓存） | 43ms，走的还是缓存优先 |\n| 大屏入口 | 走网络优先，拿最新 |\n| 页面报错 | 0 |\n\n### 5. 自动升级不会死循环\n\n把线上版本伪造成 9.9.9 高于本地，观察 11 秒：\n\n```\n真实文档加载次数：2（1 次原始 + 1 次升级）✅\n自检触发次数：1\n```\n\n同一次打开最多救 2 次、10 分钟内不重复。\n\n### 6. 回归\n\n后端端到端 **3231 项全过 / 0 失败**，部署门禁全绿，备份 367KB。\n\n---\n\n## 三、教室电脑要做什么\n\n完整步骤见 **《班级电脑操作指南.md》**，这里只列骨架：\n\n1. **找老师临时解冻**（必须，大约十几分钟）\n2. D 盘建 `ClassSite\\EdgeProfile`\n3. 在 `D:\\ClassSite` 建快捷方式，目标填那一整行命令（见指南第 3 步）\n4. 联网状态下双击 → 登录一次管理员 → 点最大化\n5. 把快捷方式复制一份到桌面 + 固定到任务栏\n6. 请老师重新开冰点\n7. 重启验收 5 项\n\n### 最关键的验收标准\n\n> **重启后双击图标，还是登录状态、还是最新版、画面满屏。**\n\n这一条过了，就再也不用管了。\n\n---\n\n## 四、不影响谁\n\n| 设备 / 入口 | 有没有变化 |\n|---|---|\n| 手机 | 无 |\n| 微信内置浏览器 | 无 |\n| 家里 / 其他电脑 | 无 |\n| 教室电脑里非 `?big=1` 的入口 | 无 |\n\n只有带 `?big=1` 的地址走新策略，那是快捷方式专用地址。\n\n---\n\n## 五、两个提醒\n\n1. **第一次必须联网**。全新 Profile 第一次打开要把网站存进 D 盘，这之后再断网才有效。\n2. **`D:\\ClassSite\\EdgeProfile` 别删**，那是登录态和缓存。删了要重新登录一次，然后重新走一次第 4 步。\n\n---\n\n## 六、截图\n\n| 文件 | 内容 |\n|---|---|\n| `01-线上大屏入口-直接进作业页.png` | 线上 `?big=1` 打开的效果，和教室快捷方式一模一样 |\n| `02-重启后断网也能打开.png` | 断网状态下重开：六科作业 + 登录态 + 偏好全在 |\n| `03-配置三步.png` | 教室电脑要做的三步，可直接给老师看 |\n| `04-重启前后对比.png` | 改之前 / 改之后的差别 |\n"},{"p":"v4.3.3_2026-11-04_冰点还原环境适配教室一体机专用/v4.3.3_2026-11-04_线上大屏入口-直接进作业页.png","n":"v4.3.3_2026-11-04_线上大屏入口-直接进作业页.png","d":"2026-11-04","sz":422099,"u":"a/b7779e3868a49e19.jpg"},{"p":"v4.3.3_2026-11-04_冰点还原环境适配教室一体机专用/v4.3.3_2026-11-04_配置三步.png","n":"v4.3.3_2026-11-04_配置三步.png","d":"2026-11-04","sz":318708,"u":"a/d7cfa4b7c5cbdc33.jpg"},{"p":"v4.3.3_2026-11-04_冰点还原环境适配教室一体机专用/v4.3.3_2026-11-04_重启前后对比.png","n":"v4.3.3_2026-11-04_重启前后对比.png","d":"2026-11-04","sz":241353,"u":"a/dbe3765086b20b3e.jpg"},{"p":"v4.3.3_2026-11-04_冰点还原环境适配教室一体机专用/v4.3.3_2026-11-04_重启后断网也能打开.png","n":"v4.3.3_2026-11-04_重启后断网也能打开.png","d":"2026-11-04","sz":446618,"u":"a/6d247d23c9d756a0.jpg"}]},{"dir":"v4.3.2_2026-11-04_432","ver":"v4.3.2","date":"2026-11-04","title":"（该版本更新摘要未收录，截图按原始留存归档）","theme":false,"count":3,"files":[{"p":"v4.3.2_2026-11-04_432/v4.3.2_2026-11-04_断网后照常打开.png","n":"v4.3.2_2026-11-04_断网后照常打开.png","d":"2026-11-04","sz":23506,"u":"a/fc150fff7c83a616.jpg"},{"p":"v4.3.2_2026-11-04_432/v4.3.2_2026-11-04_线上大屏入口-直接进作业页.png","n":"v4.3.2_2026-11-04_线上大屏入口-直接进作业页.png","d":"2026-11-04","sz":479472,"u":"a/ded1c4406d5f0e4a.jpg"},{"p":"v4.3.2_2026-11-04_432/v4.3.2_2026-11-04_线上渲染正常.png","n":"v4.3.2_2026-11-04_线上渲染正常.png","d":"2026-11-04","sz":422142,"u":"a/32e71497e5ddbcb8.jpg"}]},{"dir":"v4.3.1_2026-11-04_大屏默认进作业页-锁定不模糊-作业页可切昼夜","ver":"v4.3.1","date":"2026-11-04","title":"大屏默认进作业页-锁定不模糊-作业页可切昼夜","theme":false,"count":6,"files":[{"p":"v4.3.1_2026-11-04_大屏默认进作业页-锁定不模糊-作业页可切昼夜/v4.3.1_2026-11-04_交付说明.md","n":"v4.3.1_2026-11-04_交付说明.md","d":"2026-11-04","sz":2165,"t":"# v4.3.1 交付说明（2026-11-04）\n\n`SITE_VERSION = 4.3.1`，接口 `x-api-ver: 4.3.1`，已上线。\n本次只改三处交互，不动数据结构、不加字段。\n\n## 三条要求\n\n| # | 你的要求 | 现在的行为 | 截图 |\n|---|---|---|---|\n| 1 | 大屏模式打开网站默认直接进作业查看 | 开启大屏模式后打开站点（不带任何后缀）直接落到作业页，hash 自动变 `#/hw`；从作业页「返回大屏服务」后刷新仍回作业页。**其它深链不会被抢**：`#/board/3` 这类还去原来的板块页 | 01 |\n| 2 | 锁定后不要模糊 | 锁定遮罩从「半透明底 + blur(1px)」改成**完全透明**。点击、滑动、滚动、方向键照样全被拦住，但文字和图片一点不受影响，后排照样看得清 | 04 |\n| 3 | 作业面板里能切暗色/明亮，按钮别藏 | 底栏新增主题按钮（现在明亮就显示「🌙 暗色」，点了变暗；暗色时显示「☀ 明亮」）。走的是全站同一套 `toggleTheme`（有扩散动画、会记住本机选择） | 02、03、05 |\n\n## 为什么之前那个按钮不见了\n\n作业页是「专用页」，为了干净把整个侧边栏 `.sidebar` 隐藏了，全站的主题按钮 `#themeToggle` 正好在里面，所以跟着消失。这次不是把它挪出来，而是在底栏另放了一个，逻辑复用同一套，两边状态永远一致。\n\n## 顺带\n\n- 主题按钮的图标/文案会跟着实际主题走，日出日落或跟随系统自动切换时也会同步变，不会出现「显示暗色其实已经是明亮」。\n- 锁定遮罩虽然透明了，`z-index` 仍是 1300，覆盖整页，误触照样拦得住；解锁按钮和顶部提示保留。\n\n## 验证\n\n- 本地 Playwright：默认进作业页、深链不抢、主题切换与文案同步、锁定无 blur（`backdropFilter: none`、`backgroundColor: rgba(0,0,0,0)`）、返回后刷新回作业页，全部通过，无页面报错\n- 线上 Playwright：同一套断言在真实环境复跑通过，截图见本目录\n- 后端端到端 3231 项通过 / 0 失败；部署门禁全绿（版本四处一致、v4.3 公告追加 2 条共 7 条、备份完成）\n"},{"p":"v4.3.1_2026-11-04_大屏默认进作业页-锁定不模糊-作业页可切昼夜/v4.3.1_2026-11-04_大屏打开直接进作业页.png","n":"v4.3.1_2026-11-04_大屏打开直接进作业页.png","d":"2026-11-04","sz":467210,"u":"a/0fc37fa2ecf050e0.jpg"},{"p":"v4.3.1_2026-11-04_大屏默认进作业页-锁定不模糊-作业页可切昼夜/v4.3.1_2026-11-04_底栏-字体与昼夜切换.png","n":"v4.3.1_2026-11-04_底栏-字体与昼夜切换.png","d":"2026-11-04","sz":6544,"u":"a/f90629a5298e244f.jpg"},{"p":"v4.3.1_2026-11-04_大屏默认进作业页-锁定不模糊-作业页可切昼夜/v4.3.1_2026-11-04_明亮模式.png","n":"v4.3.1_2026-11-04_明亮模式.png","d":"2026-11-04","sz":503084,"u":"a/e33b7963906cd142.jpg"},{"p":"v4.3.1_2026-11-04_大屏默认进作业页-锁定不模糊-作业页可切昼夜/v4.3.1_2026-11-04_暗色模式.png","n":"v4.3.1_2026-11-04_暗色模式.png","d":"2026-11-04","sz":329126,"u":"a/ef13f648f2129636.jpg"},{"p":"v4.3.1_2026-11-04_大屏默认进作业页-锁定不模糊-作业页可切昼夜/v4.3.1_2026-11-04_锁定后画面依然清晰.png","n":"v4.3.1_2026-11-04_锁定后画面依然清晰.png","d":"2026-11-04","sz":352345,"u":"a/b4a2dcba85aaf1ed.jpg"}]},{"dir":"v4.3.0_2026-11-04_预设六科-随机一言可换可轮换-侧栏倒计时-换字体","ver":"v4.3.0","date":"2026-11-04","title":"预设六科-随机一言可换可轮换-侧栏倒计时-换字体","theme":false,"count":11,"files":[{"p":"v4.3.0_2026-11-04_预设六科-随机一言可换可轮换-侧栏倒计时-换字体/v4.3.0_2026-11-04_交付说明.md","n":"v4.3.0_2026-11-04_交付说明.md","d":"2026-11-04","sz":3497,"t":"# v4.3.0 交付说明（2026-11-04）\n\n版本已上线：`SITE_VERSION = 4.3.0`，接口 `x-api-ver: 4.3.0`。\n本次为小版本迭代，七条要求逐条落实，没有新增数据库字段、没有改数据结构。\n\n## 逐条对照\n\n| # | 你的要求 | 实现 | 截图 |\n|---|---|---|---|\n| 1 | 新建作业默认带六科预设 | 新建时自动生成语文/数学/英语/物理/化学/生物六科，每科一个空项；表单里可点掉这期不需要的科目 | 06、07 |\n| 2 | 「今日一句」点击没反应，想能设置每隔几分钟自动换 | 整张卡片可点（不是只有小字）；默认 5 分钟自动换，齿轮里可改 1/3/5/10/30 分钟或关闭 | 02、03 |\n| 3 | 每日一言那块太空、出处颜色太淡，想加重要日期/倒计时/节假日 | 出处小一号、颜色调淡、右对齐；新增倒计时卡片：重要日期取最近一条、节假日只显示最近一个，都没有就整块隐藏 | 01 |\n| 4 | 当前作业按时间检索，没有就说「当前没有作业」 | 只认「今天落在起止日期内」的那一期；不在任何一期就居中显示「当前没有作业」，不再拿上一次冒充 | 08 |\n| 5 | 倒计时放在点名上面，每日一言放最底下 | 侧栏顺序：时钟 → 今日事项 → 倒计时 → 随机点名 → 随机一言 | 01 |\n| 6 | 新增换字体 | 底栏「字体」：黑体（默认）/ 宋体 / 楷体 / 圆体 / 等线，带预览，存本机，只用系统字体 | 04、05 |\n\n## 顺带修的两处\n\n- **空态位置**：原来「当前没有作业」挂在页面最底部，一屏看下去只有一条在最下沿；现在横跨作业区居中。\n- **外文一言过滤**：联网接口（动画分类）会返回日文台词、韩文歌词，大屏上看着莫名其妙；现在非中文直接丢弃，保留本地中文语录。\n\n## 行为变化（要知道）\n\n- 进入作业页默认显示的是**日期范围内**的那一期，不再是「最后一期」。想看旧作业，从右上角下拉里选。\n- 字号、字体、一言轮换间隔都是**只存本机**（`cls_bhw_fs` / `cls_bhw_font` / `cls_bhw_quote_min`），换电脑不跟着走，这和之前字号的做法一致。\n- 网络语录失败时保留本地那句，不会白屏；断网时点「换一句」仍然是从站内语录库里换。\n\n## 验证\n\n- 后端端到端：3231 项通过 / 0 失败（3849 条 SQL）\n- 本地 Playwright：侧栏顺序、点击换句、离线换句、六科预设、空态文案、字体生效、间隔保存，全部通过，无页面报错\n- 部署门禁：版本四处一致、REL_BUILTIN、云端 release_notes、v4.3 公告 5 条、资源清单、体积、备份 365KB，全绿\n\n## 文件\n\n`big.js`、`index.html`、`admin-3.js`、`admin.html`、`sw.js`、`api/worker.mjs`、`README.md`\n\n## 收尾：清理调试数据\n\n云端原有一期标题为「1」的作业（2026-11-04 单日、只有语文 1 科 1 个空项），是之前调试时误建的；今天正好落在它的日期里，所以班级电脑打开大屏显示的就是它。已按确认删除：\n\n- 删除前已把全部作业导出到 `/workspace/作业数据备份-20261104.json`（4 期、48 项），要恢复随时可以导入\n- 删除后云端剩 3 期：国庆假期、2026 暑假、中秋假期\n- 线上复验：下拉显示「当前作业」，页面居中显示「当前没有作业」——正好是第 4 条要求的真实表现\n\n截图 09 是删除前（显示「1」那期），10 是删除后。\n"},{"p":"v4.3.0_2026-11-04_预设六科-随机一言可换可轮换-侧栏倒计时-换字体/v4.3.0_2026-11-04_侧栏倒计时与随机一言.png","n":"v4.3.0_2026-11-04_侧栏倒计时与随机一言.png","d":"2026-11-04","sz":515481,"u":"a/0dad8c19b3b35be7.jpg"},{"p":"v4.3.0_2026-11-04_预设六科-随机一言可换可轮换-侧栏倒计时-换字体/v4.
