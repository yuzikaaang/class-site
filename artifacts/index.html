ign-items:center;gap:12px;flex-wrap:wrap;padding:6px 2px 14px}\n  header h1{font-size:22px;margin:0;font-weight:850;letter-spacing:.5px}\n  header .priv{font-size:11px;color:#8b83ff;border:1px solid rgba(139,131,255,.35);background:rgba(108,99,255,.12);padding:5px 11px;border-radius:20px}\n  header .proto{margin-left:auto;font-size:11px;color:#5f6675;line-height:1.6;text-align:right}\n  .seg{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px;margin-bottom:14px;max-width:540px}\n  .seg button{flex:1;border:0;background:transparent;color:var(--txt2);padding:10px 0;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:.25s}\n  .seg button.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 6px 16px rgba(108,99,255,.4)}\n  .page{display:none;animation:fade .35s ease}\n  .page.on{display:block}\n  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}\n  .span2{grid-column:1/-1}\n  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}\n  .card-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:8px}\n  .card-h b{font-size:15px;font-weight:800}\n  .card-h span{font-size:11px;color:var(--txt3);white-space:nowrap}\n  .goal-num{font-size:52px;font-weight:850;line-height:1;letter-spacing:-2px}\n  .goal-num small{font-size:16px;color:var(--txt3);font-weight:600;margin-left:8px;letter-spacing:0}\n  .bar{height:10px;background:var(--card2);border-radius:10px;margin:16px 0 12px;position:relative}\n  .bar i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0;transition:width 1.1s cubic-bezier(.16,1,.3,1)}\n  .bar em{position:absolute;top:-5px;right:0;width:3px;height:20px;background:var(--warn);border-radius:2px}\n  .goal-meta{font-size:12px;color:var(--txt2);display:flex;gap:14px;flex-wrap:wrap}\n  .goal-meta .gap{color:var(--down);font-weight:700}\n  .pills{display:flex;flex-wrap:wrap;gap:9px}\n  .pill{font-size:13px;font-weight:700;padding:9px 14px;border-radius:22px;border:1px solid}\n  .pill.ok{color:#7ee2a8;border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.1)}\n  .pill.no{color:#ff8fa3;border-color:rgba(255,92,124,.4);background:rgba(255,92,124,.1)}\n  .pill .d{font-size:10px;opacity:.85;margin-left:4px}\n  .pill .raw{font-size:9px;opacity:.7;margin-left:4px;border:1px solid rgba(255,255,255,.25);padding:0 4px;border-radius:6px}\n  .mini-sc{display:flex;justify-content:space-between;font-size:12px;padding:8px 0;border-bottom:1px dashed var(--line)}\n  .mini-sc b{font-weight:800}\n  /* 折线连续滑动：一条长折线，按住跟手拖动，想停哪停哪 */\n  .chart-scroll{position:relative;overflow:hidden;border-radius:10px;background:linear-gradient(180deg,rgba(108,99,255,.04),transparent);touch-action:pan-y;cursor:grab}\n  .chart-scroll.dragging{cursor:grabbing}\n  .chart-track{will-change:transform}\n  .chart-track svg{display:block;flex:none}\n  .chart-scroll::before,.chart-scroll::after{content:'';position:absolute;top:0;bottom:0;width:22px;pointer-events:none;z-index:2}\n  .chart-scroll::before{left:0;background:linear-gradient(90deg,var(--card),transparent)}\n  .chart-scroll::after{right:0;background:linear-gradient(270deg,var(--card),transparent)}\n  .pt{cursor:pointer}\n  .pt.sel{filter:drop-shadow(0 0 6px rgba(255,255,255,.95))}\n  .chart-nav{display:flex;align-items:center;gap:12px;margin-top:8px}\n  .chart-nav .mini-toggle{border:1px solid rgba(251,191,36,.45);background:rgba(251,191,36,.1);color:var(--warn);border-radius:8px;padding:5px 10px;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}\n  .chart-tip{font-size:10px;color:var(--txt3);text-align:center;margin-top:7px}\n  .pt-detail{background:var(--card2);border:1px solid rgba(139,131,255,.3);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:12px;line-height:1.9}\n  .pt-detail .dt-h{font-weight:800;color:#c4bfff;font-size:12px;margin-bottom:4px}\n  .pt-detail .kv{display:flex;gap:8px;flex-wrap:wrap}\n  .pt-detail .kv span{background:rgba(255,255,255,.05);border-radius:7px;padding:2px 8px}\n  .pt-detail .rf{color:var(--txt2);margin-top:5px}\n  /* 科目板块可折叠：默认收起，手机端首屏只有 6 个标题条 */\n  .board .bhead{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;user-select:none}\n  .board .bhead .arw{color:var(--txt3);font-size:13px;transition:transform .28s;display:inline-block;margin-left:2px}\n  .board.collapsed .bhead .arw{transform:rotate(-90deg)}\n  .board .bmini{font-size:11px;color:var(--txt3);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}\n  .board .bmini .v{color:var(--txt);font-weight:800;font-size:14px}\n  .board .bmini .sep{opacity:.5}\n  .board .bbody{display:block;animation:fade .3s}\n  .board.collapsed .bbody{display:none}\n  .board .bdelta{font-size:12px;font-weight:800}\n  .fold-all{border:1px solid rgba(139,131,255,.4);background:rgba(108,99,255,.1);color:#c4bfff;border-radius:9px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}\n  .board{min-width:0} /* 防止长折线把 grid 项撑破 */\n  .board .bbody{min-width:0}\n  .board .delta-line{font-size:12px;color:var(--txt2);margin:12px 0 4px}\n  .board .delta-line b{color:var(--up)} .board .delta-line b.dn{color:var(--down)}\n  .sub-recs{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}\n  .sr{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12px}\n  .sr.more{display:none}\n  .sub-recs.expanded .sr.more{display:flex}\n  .sr:last-child{border-bottom:0}\n  .rec-more{width:100%;border:1px dashed rgba(139,131,255,.4);background:rgba(108,99,255,.05);color:#c4bfff;border-radius:9px;padding:8px;font-size:11px;font-weight:700;cursor:pointer;margin-top:7px}\n  .sr .sd{color:var(--txt3);width:52px;flex-shrink:0}\n  .sr .sv{font-weight:800;width:46px;flex-shrink:0}\n  .sr .sv small{color:var(--txt3);font-weight:500}\n  .sr .sdlt{width:52px;flex-shrink:0;font-weight:700}\n  .sr .srf{color:var(--txt2);flex:1;line-height:1.5}\n  .sr .srf::before{content:'📝 ';color:var(--brand2)}\n  .sr .sn{font-size:10px;color:var(--txt3);flex-basis:100%;margin-top:-2px}\n  .sub-ai{margin-top:10px;background:rgba(108,99,255,.08);border:1px solid rgba(139,131,255,.22);border-radius:12px;padding:11px 13px;font-size:12px;color:var(--txt2);line-height:1.7}\n  .sub-ai b{color:#c4bfff}\n  .edit-btn{border:1px solid rgba(139,131,255,.4);background:rgba(108,99,255,.1);color:#c4bfff;border-radius:9px;padding:7px 13px;font-size:11px;font-weight:700;cursor:pointer;transition:.2s}\n  .edit-btn:hover{background:rgba(108,99,255,.22)}\n  .ai-card{background:linear-gradient(150deg,rgba(108,99,255,.16),rgba(108,99,255,.04));border:1px solid rgba(139,131,255,.3)}\n  .ai-card .badge{display:inline-block;font-size:10px;color:#b9b3ff;background:rgba(108,99,255,.2);padding:3px 9px;border-radius:8px;margin-bottom:10px}\n  .ai-card p{font-size:13px;line-height:1.85;color:var(--txt2);margin:0 0 8px}\n  .ai-card .hl{color:#c4bfff;font-weight:700} .ai-card .up{color:var(--up);font-weight:700} .ai-card .dn{color:var(--down);font-weight:700}\n  .goal-set{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}\n  .g-input{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px}\n  .g-input label{font-size:12px;color:var(--txt2);display:block;margin-bottom:7px}\n  .g-input input{width:100%;background:transparent;border:0;color:var(--txt);font-size:20px;font-weight:800;outline:none}\n  .g-input .full{font-size:10px;color:var(--txt3)}\n  .g-input .rawtag{font-size:9px;color:var(--warn);border:1px solid rgba(251,191,36,.4);border-radius:6px;padding:1px 5px;margin-left:4px}\n  .bigbtn{border:0;border-radius:14px;padding:15px 22px;font-size:15px;font-weight:800;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--brand),#7c5cff);box-shadow:0 10px 24px rgba(108,99,255,.4);transition:.2s}\n  .bigbtn:active{transform:scale(.98)}\n  .bigbtn.wide{display:block;width:100%;margin-top:14px}\n  .bigbtn.ghost{background:var(--card2);color:#c4bfff;border:1px solid rgba(139,131,255,.4);box-shadow:none}\n  .quick-card{display:flex;align-items:center;justify-content:space-between;gap:16px}\n  .quick-card .bigbtn{margin-top:0;flex-shrink:0}\n  .rec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}\n  .rec-h{display:flex;justify-content:space-between;padding:14px 16px;cursor:pointer}\n  .rec-h .t{font-size:14px;font-weight:800}\n  .rec-h .d{font-size:11px;color:var(--txt3);margin-top:4px}\n  .rec-h .cnt{font-size:12px;color:var(--brand2);font-weight:700;align-self:center}\n  .rec-body{display:none;padding:0 16px 14px}\n  .rec.open .rec-body{display:block;animation:fade .3s}\n  .mask{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}\n  .mask.on{display:flex}\n  .sheet{width:100%;max-width:760px;background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:22px;max-height:92vh;overflow:auto;animation:up .35s cubic-bezier(.16,1,.3,1)}\n  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}\n  .sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}\n  .sheet-h b{font-size:18px} .sheet-h button{border:0;background:var(--card2);color:var(--txt2);width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer}\n  .fld{margin-bottom:14px} .fld label{font-size:12px;color:var(--txt2);display:block;margin-bottom:7px;font-weight:700}\n  .fld input,.fld select,.fld textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;color:var(--txt);padding:11px;font-size:13px;font-family:inherit;outline:none}\n  .fld input:focus,.fld textarea:focus,.srow-card input:focus,.srow-card textarea:focus,.eitem input:focus,.eitem textarea:focus{border-color:var(--brand)}\n  .type-pick{display:flex;gap:8px} .type-pick button{flex:1;border:1px solid var(--line);background:var(--card2);color:var(--txt2);padding:10px;border-radius:11px;font-size:12px;font-weight:700;cursor:pointer;transition:.2s}\n  .type-pick button.on{border-color:var(--brand);background:rgba(108,99,255,.18);color:#c4bfff}\n  .srow-card{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px}\n  .srow-top{display:flex;gap:8px;align-items:center}\n  .srow-top select{flex:1.2;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:10px;font-size:13px;font-family:inherit;outline:none}\n  .srow-top input{background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:10px;font-size:14px;font-weight:800;text-align:center;outline:none}\n  .srow-top .sc{width:88px} .srow-top .fl{width:70px}\n  .srow-top .del{border:0;background:rgba(255,92,124,.15);color:#ff8fa3;width:34px;height:34px;border-radius:9px;font-size:18px;cursor:pointer;flex-shrink:0}\n  .srow-card textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 10px;font-size:12px;font-f","tt":1},{"p":"资料_平时成绩/平时成绩分析_方案文档.md","n":"平时成绩分析_方案文档.md","d":"","sz":17761,"t":"# 平时成绩分析 · 完整方案（v0.1）\n\n> ✅ **已上线**：v4.18.0（2026-11-22）已正式加入班级服务站，入口为「成绩分析 → 平时成绩」标签（位于「我的画像」旁），代码现已在线上运行。本文件记录方案与设计决策，效果原型见同目录 `平时成绩_效果原型.html`。\n\n> 目标：在班级服务站**新增一个独立板块「平时成绩」**，放在「成绩分析 / 个人画像」旁边。\n> 每个同学**自己手动录入**平时考试分数，数据**只自己可见**，云同步。核心看**各科趋势 + 进退步 + AI 分析 + 目标提醒**。\n> 先出方案 + 可点击效果原型，确认后已在 v4.18.0 落地为线上代码。\n\n---\n\n## 0. 先看效果：抖音视频拆解 + 原型\n\n### 0.1 抖音《高中成绩记录 app》逐块拆解\n视频本体受抖音登录风控限制拿不到（已试 yt-dlp / 浏览器嗅探 / 内部接口，均需登录 cookie），但拿到了官方封面图——它把 app 主界面完整摊开了，逐块拆解如下：\n\n| 模块 | 呈现方式 | 可借鉴点 |\n|---|---|---|\n| 目标进度卡 | 大号数字「578 / 满分750」+ 进度条 + 得分率 + **「距目标22分」红色突出** | 一进板块先看目标和差距，做**醒目提醒**；数字一眼可读 |\n| 最新成绩·对照目标 | 每科一个胶囊「语文115✓ / 英语98差22」，**绿=达标、红=差距** | 达标与否用颜色区分，不用读数字就知道哪科拖后腿 |\n| 最新排名 | 班级20/45 前44%、年级578/1200 前48%，附「↑较上次进步17名」 | 排名 + 百分位 + 进退步箭头三合一 |\n| 近5次总分 | 折线图 + 目标虚线(600) + 渐变填充 + 当前值标注 +「查看完整分析→」 | **折线趋势是核心**，目标线作为参数线很实用 |\n| ＋记一次成绩 | 底部一个醒目大按钮（蓝紫渐变） | 录入入口要显眼、固定 |\n| 底部 Tab | 总览 / 记录 / 分析 / 设置 | 四段式信息架构，清晰 |\n\n**配色**：深色底 + 蓝紫主色（约 #6C63FF）+ 绿/红状态色。你们站点已有暗色模式（近黑底 + 暖橙主色），可沿用站点暗色底，主色是否用蓝紫见 §9 决策点 D5。\n\n### 0.2 其他调研（B站/行业）\n- B站专栏与行业方案普遍采用：**时间序列折线图看趋势、雷达图看单科均衡、柱状图看单科对比、AI/数据挖掘做个性化建议**——与你的设想一致。\n- 一位高三 UP 的方法论很贴你的场景：**跟自己上次比（而非跟别人）、用班级均分判断试卷难易、设目标名次同学做差距参照**——这套思路正好支撑「进退步分析」和「目标对照」。\n\n### 0.3 可点击原型（v0.6，折线图改为连续跟手滑动）\n`平时成绩_效果原型.html`（单文件，浏览器直接打开）：\n- **全宽响应式**：宽屏两列铺满、不留白，手机单列。\n- **按「日期 × 单科」组织数据**：一条记录 = 某天某科一次成绩；录入时选日期 + 填考试名称 + 动态加当天考的科目行，每科单独写反思。\n- **六科各占一个大板块，且默认收起**（手机端优化）：每科先显示一行紧凑标题条（科目 / 最近分 / 满分 / 目标 / 较上次涨跌 / 展开箭头），点标题才展开大图；顶部有「展开全部 / 收起全部」一键开关。手机分析页高度从约 4759px 降到 999px（约 4.8 倍），首屏即可看全六科。\n- **折线图两种模式**（v0.6 重做）：① **连续滑动模式**——所有点画在一条长折线上，初始停在最右（最新），按住可**逐帧跟手左右拖动**、想停哪停哪（不按「页」跳、无翻页按钮和页码），一屏约见 5 个点、每点标分数、点圆点看那次详情；②「缩小看总趋势」——一键把全部 N 次压缩进一屏看整体走向，此时不标单点分数。橙色目标虚线标签放左端避开数据点。\n- 展开后另含：该科记录明细（**默认只显示最近 3 次**，点「展开全部」看全部）+ 该科 AI 点评 + 编辑入口。已去掉顶部科目跳转按钮。\n- **去掉总览「最近一次排名」卡**（每次非完整六科，排名无意义；排名改在点选详情里显示）。\n- **生化标注「原始分」**（平常考试不赋分）。\n- **按科目编辑历史**：选科目后逐条改日期/名称/分数/满分/类型/排名/反思或删除。\n- 另含：目标进度、科目胶囊、按日期分组的记录、总 AI 分析、目标设置。数据为演示样本、交互为前端模拟，**仅示意效果**。\n\n---\n\n## 1. 需求确认（按你的原话整理）\n\n| # | 需求 | 我的理解 |\n|---|---|---|\n| 1 | 新增独立板块「平时成绩」，放个人画像旁边 | 顶层新入口，不并入现有「我的画像」tab |\n| 2 | 数据可上传云端 | 走**按用户隔离**的云端存储（见 §3） |\n| 3 | 只能自己手动上传，不搞管理员一键导入 | 录入入口仅本人操作；管理员不代录 |\n| 4 | 分科：语数英物化生六科 | 固定六科，满分默认语数英150 / 物化生100，可改 |\n| 5 | 前台直接添加：考试时间、科目、备注(段考/单元/周考)、总分、班排/年排 | 一次录入=一场考试，填六科分数 + 排名 + 类型 |\n| 6 | 考试类型：班级性测试 / 校级周考 | 两种类型，做单选 |\n| 7 | 大考由管理员放「成绩分析」，平时成绩独立 | 两套数据互不干扰（现有 scores 表不动） |\n| 8 | 只能看自己的，别人看不到 | 服务端按登录用户隔离 + 前端只请求本人数据 |\n| 9 | 各科趋势图(重点)、进退步、AI分析 | 核心三件套，趋势优先 |\n| 10 | 每次考试每小科可写反思备注 | 每科一个「本次反思」文本框 |\n| 11 | 目标分数写在最顶上、醒目提醒 | 目标卡置顶，含总分目标 + 分科目标 |\n\n---\n\n## 2. 信息架构（放哪里、怎么进）\n\n```\n班级服务站\n├─ 成绩分析（现有，管理员导入的大考）\n│   ├─ 全班成绩单\n│   ├─ 我的画像        ← 保持不动\n│   └─ 成绩对比\n└─ 平时成绩（★新增，与成绩分析并列的顶层板块）\n    ├─ 总览   目标进度 / 对照目标 / 最近录入(含考试名称) / ＋记一次（★不放排名卡）\n    ├─ 记录   按日期分组 + 顶部「按科目编辑历史」入口\n    ├─ 分析   六科各占一个大板块：可横滑大折线图(每点标分数/点选看详情) + 每次记录 + 该科 AI + 该科编辑入口；下方总 AI\n    └─ 目标   总分目标 + 六科目标分数（生化标注「原始分」）\n```\n- 入口：侧边栏/首页图标区加一个「平时成绩」入口（与「成绩分析」相邻），未登录时提示「登录后记录自己的成绩」。\n- 与现有「我的画像」**完全隔离**：不共用 `SC.rows/SC.exam`，不接管理员 `SC.viewAs`，避免看串数据。\n\n---\n\n## 3. 数据存储与权限隔离（最关键，先定这个）\n\n### 3.1 为什么不能放进现有 content\n现有 `api/content.js` 是**全局共享一份**（存在系统账号名下），所有人看到同一份——只适合公告、作业这类公共内容，**不能放个人私有成绩**。\n\n### 3.2 现成的正确做法：按用户隔离存储\n项目已有 `api/data.js`：`GET / PUT / DELETE api/data?key=...`，服务端用 `where user_id = 当前登录用户` 隔离，白名单支持前缀键。个人成绩正好走这条路：\n\n- 存储键：`cls_grade_log_v1`（一个人的所有平时成绩记录，一个 JSON 数组）。\n- 读：`GET api/data?key=cls_grade_log_v1` → 只返回当前用户自己写的。\n- 写：`PUT api/data?key=cls_grade_log_v1` → 只覆盖当前用户自己的。\n- 隐私保证：**别人即使知道键名，服务端也只按他自己的 user_id 查，拿不到你的数据**；前端不做「看别人」的入口。\n- 目标分数另存一个键 `cls_grade_goals_v1`（同样按用户隔离）。\n\n### 3.3 数据结构（★按「日期 × 单科」逐条记，不是整场考试六科）\n**核心变化（本轮按你的反馈定稿）：一条记录 = 某天某一科的一次成绩。** 因为实际不会每次都考齐六科——可能 11-22 只考了语文和数学，那就只记这两条；「总览/分析」里的总分、排名、趋势都从这些单科记录**按日期聚合**算出来。\n\n```jsonc\n{\n  \"id\": \"g_20261122_yw\",\n  \"date\": \"2026-11-22\",     // 考试日期（分组主维度）\n  \"subj\": \"语文\",            // 单科：语/数/英/物/化/生 之一\n  \"name\": \"第13周周末心理训练\", // ★这次考试自己起的名字（单元/周考/训练…）\n  \"got\": 115,                // 这一科这次得分\n  \"full\": 150,               // 满分，默认语数英150 / 物化生100，可改\n  \"type\": \"班级性测试\",      // 或 \"校级周考\"（这次考试属于哪类）\n  \"reflect\": \"作文审题进步明显，继续保持\",  // ★这一科这一次的反思，每科独立\n  \"rankClass\": 20,           // 班级排名，选填（有才填，没排名就空着）\n  \"rankGrade\": 578           // 年级排名，选填\n}\n```\n- 一次录入：**选一个日期 + 填考试名称 → 添加当天实际考的科目**（可一科也可多科），每行单独填分数/满分/反思；排名是顶层选填。\n- 保存后：不存\"总分\"字段。总览的\"578/目标640\"= 六科**各自最近一次**得分求和；单科趋势 = 该科按日期排序的所有记录。\n- 目标结构：`{ total: 640, 语文:120, 数学:130, 英语:120, 物理:90, 化学:90, 生物:90 }`（total 为六科目标之和，自动算）。\n- **排名只在点上详情里显示，总览不放\"最近一次排名\"卡**：因为每次录的不是完整六科，凑不出一场完整考试的总排名，硬聚合一个\"年级名次\"没有意义（按你的反馈去掉）。\n\n> 说明：这套结构天然支持「某天只考一科」「同一天考多科」「同一科一天考两次（如单元测+周考）」各种情况，比整场考试六科灵活；某科留空就不产生记录、不进趋势。\n\n> **化学、生物是赋分科目**：平常考试不赋分，你录入和对照的都是**原始分**，所以这两科的目标也是\"原始分目标\"，界面在胶囊/图表/目标设置处都标注「原始分」，避免和高考赋分混淆。\n\n---\n\n## 4. 录入交互（前台自己加）\n\n参考抖音的「＋记一次成绩」大按钮，点开弹层（宽屏居中卡片 / 手机底部抽屉）：\n1. **日期**（日期选择，默认今天）—— 这是分组主维度\n2. **考试类型**（二选一：班级性测试 / 校级周考）\n3. **考试名称**（文本，自己起，如「第13周周末心理训练」「第2单元测试」）—— ★本轮新增\n4. **当天科目行**（核心）：默认给出两行，每行 = 一个科目\n   - 科目下拉（语数英物化生，生化标注\"原始分\"）+ 得分 + 满分（默认150/100，可改）+ **这一科这一次的反思**\n   - `＋ 添加一科` 继续加行、行尾 `×` 删除；留空分数的行不保存、不计入趋势\n5. **班级排名 / 年级排名**（顶层选填，有排名才填，没有就空着）\n6. 保存 → 按日期写入这条/这几条单科记录 → 云端同步 → 左下角绿字提示（复用现有 `syncNotice`）\n\n- **编辑/删除（★按科目，不按时间）**：因为要改的常是\"某科某次分数录错/排名录错/备注想改\"，按时间翻找很麻烦。提供独立的「按科目编辑历史」入口（记录页按钮 + 每个分析板块底部按钮）：选科目 → 列出该科全部历史记录 → 每条可改日期、名称、分数、满分、类型、排名、反思，或删除（二次确认）；保存后趋势图/总览/详情一起更新。\n- 离线可写：沿用项目现有的「本地先写 + 待上传标记 + 联网补推」机制（作业同步已有，可复用思路）。\n\n---\n\n## 5. 图表与分析（核心）\n\n全部**手写 SVG**，和项目现有趋势图/雷达图一致，不引入外部库（离线可用、零额度）。\n\n### 5.1 各科趋势图（你最看重的）\n- **一个科目 = 一个大板块、一张大折线图**（不再把六科挤成迷你小图）：分析页直接往下翻就是六科，去掉顶部科目跳转按钮（往下翻即可）。板块默认收起（见 §0.3），点标题展开。\n- **连续滑动查看（重点澄清）**：每科可能有十几二十次记录，全部画在**一条长折线**上，初始停在最右（最新）。手指按住图表**左右拖动**，可逐帧跟手平滑移动、**想停在哪个位置就停哪个位置**——不按「页」跳、没有翻页箭头和页码；一屏约见 5 个点、横轴标日期、每个点都标分数。\n- **缩小看总趋势**：图表下方有「缩小看总趋势」按钮，点一下把**全部 N 次**压缩进一屏看整体走向（此时不标单点分数、只看趋势），再点「看每次明细」切回连续滑动。\n- **点选看详情**：每次明细模式下点图上任意一点，下方详情框显示那一次的**日期、考试名称、类型、分数、班级/年级排名、这一科的反思**（不点的默认显示当前选中/最近一次）。\n- **目标虚线**：该科目标分数画橙色横向虚线（标签放左端，避开数据点），超线绿、未达红；生化标注\"原始分\"。\n- 大图下方列该科**记录明细**：**默认只显示最近 3 次**，点「展开全部 N 次记录」看全部；每条含日期 / 分数 / 较上次涨跌（红绿箭头）/ 反思 / 考试名称。\n- 每个板块自带一段**该科 AI 点评** + 一个「✎编辑该科历史」按钮。\n\n### 5.2 进退步分析\n- 相邻两次对比：每科 Δ 分（红绿箭头）+ 名次变化（班级/年级）。\n- 总分走势：连续进步/退步、波动幅度、最近一次相对近 N 次均值的偏离。\n- 用抖音那套「↑较上次进步17名」的呈现，强化正反馈。\n\n### 5.3 AI 学情分析\n项目**已有 AI 能力**（`aiRequest` / `aiRun`，浏览器直连 OpenAI 兼容接口，配置在 `cls_ai_cfg_v1`），可直接复用：\n- 把你录入的数据（日期、各科逐次分数、目标、每科反思、排名）整理成一段 prompt，让模型输出：整体趋势判断 + 薄弱科定位 + 具体到分数的下次目标建议 + 学习习惯提醒。\n- 输出渲染成原型里那种高亮卡片（绿/红标注进步/退步科）。\n- **隐私**：数据从你本机发给 AI 接口；如介意，可提供「不开启 AI」开关，或只发脱敏的分数（不含姓名）。见 §9 D4。\n\n---\n\n## 6. 与现有模块的边界\n- **不动** `成绩分析`（scores 表、管理员导入、我的画像、成绩对比）——大考数据保持原样。\n- **不动** 作业、公告、点歌等任何现有功能。\n- 新板块只新增：一个顶层入口 + 一组前端视图 + `api/data.js` 白名单加 2 个键（不需新建表）。\n- 复用现有：账号体系、暗色模式、`syncNotice` 绿/红提示、AI 接口、SVG 图表写法、底部弹层样式。\n\n---\n\n## 7. 分阶段落地计划\n\n| 阶段 | 内容 | 产出 |\n|---|---|---|\n| P1 存储骨架 | data.js 白名单加 `cls_grade_log_v1`/`cls_grade_goals_v1`；前端读写封装 | 能存能取，按用户隔离 |\n| P2 录入与记录 | 总览/记录页 + 录入弹层 + 编辑删除 + 云同步 + 目标设置 | 自己能录、能看、能改 |\n| P3 图表分析 | 六科各一个大趋势图（横轴日期+目标虚线+末点）+ 每科记录明细 + 进退步 | 核心看板成型 |\n| P4 AI 分析 | 复用 aiRequest，生成学情分析卡 + 开关 | AI 卡上线 |\n| P5 打磨 | 动画（进度条/折线入场）、空状态、移动端适配、门禁测试、上线 | 完整板块 |\n\n建议一次做完 P1–P4 再统一上线；P5 视验收反馈微调。\n\n---\n\n## 8. 测试与验收要点（落地时）\n- e2e 加断言：两个 data 键进白名单、私有读写按 user_id、单科记录按日期聚合出总分、每科大图+目标虚线渲染、反思按科独立保存、AI 卡存在、无「看别人」入口。\n- 真实浏览器：A 账号录入 → B 账号登录**看不到** A 的数据（隐私核心）。\n- 门禁文案避开口禁词（后台/管理员/缓存/数据库/不用/不再/你）。\n\n---\n\n## 9. 决策点（★前两项已按你的反馈定稿）\n\n| # | 问题 | 选项 | 状态 / 建议 |\n|---|---|---|---|\n| ~~D1~~ | ~~一场考试六科 / 一次一科~~ | — | **已定稿：都不用——按「日期×单科」逐条记**，当天考几科就记几科，每科独立分数+反思（§3.3） |\n| ~~D2~~ | ~~留空科目怎么处理~~ | — | **已定稿：留空不产生记录、不进趋势**（§3.3） |\n| D3 | 历史数据从哪来？ | A 从零开始录；B 也支持从现有大考成绩导入到平时成绩 | **A 先做**，B 可作后续增强 |\n| D4 | AI 分析隐私 | A 数据发 AI 接口；B 可一键关闭；C 只发脱敏分数 | **B+C**：默认只发分数不发姓名，且给关闭开关 |\n| D5 | 主色调 | A 沿用站点暖橙；B 用抖音那种蓝紫 | **A**，和全站统一；暗色底照用（原型暂用蓝紫示意） |\n| D6 | 板块名字 | 平时成绩 / 我的成绩 / 成绩记录 | **平时成绩**（你原话，且区别于管理员的「成绩分析」） |\n\n> 剩下需要你拍板的只有 D3 / D4 / D5 / D6 四项，其余已按前两轮反馈写死。回「按建议来」即按上表建议执行。\n\n> 这 6 点你回一句「按建议来」或逐条改即可。确认后下一轮就能直接开工，不用再问。\n\n---\n\n*方案版本 v0.1 · 2026-11-21 · 2026-11-22 已在 v4.18.0 上线*\n"}]},{"dir":"资料_后台改版","ver":"","date":"","title":"后台改版","theme":true,"count":5,"files":[{"p":"资料_后台改版/后台改版_2026-10-06_作业列表-手机端.png","n":"后台改版_2026-10-06_作业列表-手机端.png","d":"","sz":91247,"u":"a/01e154397e59927f.jpg"},{"p":"资料_后台改版/后台改版_2026-10-06_作业详情弹窗-手机端.png","n":"后台改版_2026-10-06_作业详情弹窗-手机端.png","d":"","sz":60721,"u":"a/d1534f6002a84954.jpg"},{"p":"资料_后台改版/后台改版_2026-10-06_查看详情弹窗-手机端.png","n":"后台改版_2026-10-06_查看详情弹窗-手机端.png","d":"" /* ---- 图片懒加载：进入视口才把 data-src 赋给 src ----
   这是 v4.16.10 的关键修复：旧版 669 张图一次性解码，手机直接 OOM 卡死。 */
let io = null;
function initIO(){
  if(!('IntersectionObserver' in window)) return;
  io = new IntersectionObserver(function(es){
    for(var i=0;i<es.length;i++){
      var e=es[i]; if(!e.isIntersecting) continue;
      var im=e.target;
      if(im.dataset.src){ im.src=im.dataset.src; im.removeAttribute('data-src'); }
      io.unobserve(im);
    }
  }, {rootMargin:'500px 0px'});
}
function observeImgs(root){
  var imgs=root.querySelectorAll('img[data-src]');
  for(var i=0;i<imgs.length;i++){
    if(io) io.observe(imgs[i]);
    else { imgs[i].src=imgs[i].dataset.src; imgs[i].removeAttribute('data-src'); }
  }
}

function titleOf(r){ return r.title || ''; }

/* 当前筛选/搜索下，某个分组要展示哪些文件 */
function filesFor(ri){
  const r=DATA[ri];
  let files=r.files;
  if(filter==='img') files=files.filter(isImg);
  else if(filter==='doc') files=files.filter(f=>!isImg(f));
  const ql=q.trim().toLowerCase();
  if(ql){
    const dirHit=(r.dir+' '+r.title+' '+r.ver+' '+r.date).toLowerCase().includes(ql);
    if(!dirHit) files=files.filter(f=>(f.n+' '+f.p).toLowerCase().includes(ql));
  }
  return files;
}

/* 某个分组的图片/文件网格（展开时才调用，避免一上来铺 700 多个节点） */
function gridHtml(ri){
  const r=DATA[ri];
  const files=filesFor(ri);
  let html='<div class="grid">';
  files.forEach(function(f){
    const realIdx=r.files.indexOf(f);
    const caption=f.n.replace(/^v?[\d.]+_\d{4}-\d{2}-\d{2}_/,'').replace(/\.[^.]+$/,'');
    if(isImg(f)){
      html+='<div class="item" onclick="openLb('+ri+','+realIdx+')"><div class="thumb">'+
        '<img alt="" data-src="'+src(f)+'"><span class="zoom">🔍</span></div>'+
        '<div class="cap">'+esc(caption)+'<span class="fn">'+esc(f.n)+'</span></div></div>';
    }else{
      html+='<div class="item" onclick="openDoc('+ri+','+realIdx+')"><div class="thumb"><span class="ext">'+
        esc((f.n.split('.').pop()||'FILE').toUpperCase().slice(0,5))+'</span></div>'+
        '<div class="cap">'+esc(caption)+'<span class="fn">'+esc(f.n)+'</span></div></div>';
    }
  });
  return html+'</div>';
}

function mountVer(card, ri){
  const body=card.querySelector('.vbody');
  if(!body || body.dataset.mounted==='1') return;
  body.innerHTML=gridHtml(ri);
  body.dataset.mounted='1';
  mounted.add(ri);
  observeImgs(body);
}

function toggleVer(head, ri){
  const card=head.parentNode;
  const open=card.classList.toggle('open');
  if(open){ openSet.add(ri); mountVer(card, ri); }
  else openSet.delete(ri);
}

function render(){
  const list=document.getElementById('list');
  let shown=0, shownFiles=0, html='';
  const ql=q.trim().toLowerCase();
  DATA.forEach(function(r,ri){
    if(filter==='recent'){
      const vm=(r.ver.match(/\d+/g)||[]).map(Number);
      if(!(vm[0]>=4 && vm[1]>=15)) return;
    }
    const files=filesFor(ri);
    if(ql && !files.length) return;
    shown++; shownFiles+=files.length;
    const theme=r.theme;
    html+='<div class="version'+(openSet.has(ri)?' open':'')+'" data-ri="'+ri+'">';
    html+='<div class="vhead" onclick="toggleVer(this,'+ri+')">';
    html+='<span class="vbadge'+(theme?' theme':'')+'">'+(theme?'资料':esc(r.ver||r.title))+'</span>';
    if(r.date) html+='<span class="vdate">'+esc(r.date)+'</span>';
    html+='<span class="vtitle">'+esc(titleOf(r))+'</span>';
    html+='<span class="vcount">'+files.length+' 项</span>';
    html+='<span class="varrow">▶</span></div>';
    html+='<div class="vbody"></div></div>';
  });
  if(!shown) html='<div class="empty">没有匹配的产物，换个关键词试试。</div>';
  list.innerHTML=html;
  mounted.clear();
  /* 把之前展开过的分组重新挂上（DOM 是新建的，图片仍走懒加载） */
  const cards=list.querySelectorAll('.version[data-ri]');
  for(let i=0;i<cards.length;i++){
    const c=cards[i], ri=+c.dataset.ri;
    if(c.classList.contains('open')) mountVer(c, ri);
  }
  document.getElementById('stat').innerHTML=
    '<span>版本分组 <b>'+shown+'</b></span><span>文件 <b>'+shownFiles+'</b></span>'+
    '<span>图片 <b>733</b></span><span>文档/源码 <b>101</b></span>'+
    '<span>总计 <b>834</b> 项，一个不删</span>';
}
/* ---- 放大查看：点击放大 → 支持双击/双指/滚轮缩放 + 拖动看细节 ---- */
var lbScale=1, lbTX=0, lbTY=0, lbDrag=null, lbPinch=null;
function lbApply(){
  const im=document.getElementById('lbimg');
  im.style.transform='translate('+lbTX+'px,'+lbTY+'px) scale('+lbScale+')';
  im.classList.toggle('zoomed', lbScale>1.001);
}
function lbReset(){lbScale=1;lbTX=0;lbTY=0;lbApply();}
function openLb(ri,fi){
  const r=DATA[ri];
  const imgs=r.files.filter(isImg);
  const f=r.files[fi];
  lbList=imgs.map(function(x){ return src(x); });
  lbIdx=Math.max(0, imgs.indexOf(f));
  showLb();
}
function showLb(){const im=document.getElementById('lbimg'); im.src=lbList[lbIdx];
  document.getElementById('lbname').textContent=(lbIdx+1)+' / '+lbList.length;
  lbReset();
  document.getElementById('lb').classList.add('show');}
function lbClose(){document.getElementById('lb').classList.remove('show');lbReset();}
function lbNext(){if(lbIdx<lbList.length-1){lbIdx++;showLb();}}
function lbPrev(){if(lbIdx>0){lbIdx--;showLb();}}
function lbZoomToggle(){
  if(lbScale>1.001){lbReset();}
  else{lbScale=2.2;lbTX=0;lbTY=0;lbApply();}
}
(function(){
  const im=document.getElementById('lbimg'), wrap=document.getElementById('lbimgwrap');
  if(!im||!wrap) return;
  /* 单击图片：放大/还原（让手机端「点图放大」直观可见） */
  im.addEventListener('click',function(e){ if(lbDrag&&lbDrag.moved)return; lbZoomToggle(); });
  /* 双击放大 */
  var lastTap=0;
  im.addEventListener('dblclick',function(e){e.preventDefault();lbZoomToggle();});
  im.addEventListener('touchend',function(e){
    var now=Date.now();
    if(now-lastTap<300){e.preventDefault();lbZoomToggle();lastTap=0;}else{lastTap=now;}
  },{passive:false});
  /* 鼠标拖动 */
  im.addEventListener('mousedown',function(e){ if(lbScale<=1.001)return; lbDrag={x:e.clientX-lbTX,y:e.clientY-lbTY,moved:false}; e.preventDefault(); });
  window.addEventListener('mousemove',function(e){ if(!lbDrag)return; lbTX=e.clientX-lbDrag.x; lbTY=e.clientY-lbDrag.y; lbDrag.moved=true; lbApply(); });
  window.addEventListener('mouseup',function(){ lbDrag=null; });
  /* 触控单指拖动 + 双指缩放 */
  im.addEventListener('touchstart',function(e){
    if(e.touches.length===1){ lbDrag={x:e.touches[0].clientX-lbTX,y:e.touches[0].clientY-lbTY,moved:false}; }
    else if(e.touches.length===2){
      lbDrag=null;
      var dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
      lbPinch={dist:Math.sqrt(dx*dx+dy*dy),scale:lbScale};
    }
  },{passive:true});
  im.addEventListener('touchmove',function(e){
    if(e.touches.length===1&&lbDrag&&lbScale>1.001){
      lbTX=e.touches[0].clientX-lbDrag.x; lbTY=e.touches[0].clientY-lbDrag.y; lbDrag.moved=true; lbApply();
    }else if(e.touches.length===2&&lbPinch){
      var dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
      var dist=Math.sqrt(dx*dx+dy*dy);
      lbScale=Math.min(6,Math.max(1,lbPinch.scale*dist/lbPinch.dist)); lbApply();
    }
  },{passive:true});
  im.addEventListener('touchend',function(){ lbDrag=null; lbPinch=null; });
  /* 滚轮缩放 */
  wrap.addEventListener('wheel',function(e){
    if(lbScale<=1.001&&e.deltaY>0)return;
    e.preventDefault();
    lbScale=Math.min(6,Math.max(1,lbScale+(e.deltaY<0?0.25:-0.25)));
    if(lbScale<=1.001){lbTX=0;lbTY=0;}
    lbApply();
  },{passive:false});
})();

function openDoc(ri,fi){
  const f=DATA[ri].files[fi]; dvFile=f;
  document.getElementById('dvname').textContent=f.n;
  const dl=document.getElementById('dvdl');
  const txt=f.t;
  if(typeof txt==='string'){
    document.getElementById('dvtext').textContent=txt + (f.tt ? '\n\n……（内容较长，这里只显示前一部分；完整原文在原产物目录）' : '');
    document.getElementById('dvhint').textContent=f.err?('读取提示：'+f.err):'文本内容，可直接查看/复制';
    if(dl) dl.style.display='';
  }else if(f.b){
    document.getElementById('dvtext').textContent='（二进制文件：'+f.n.split('.').pop().toUpperCase()+'）\n点右上角「下载原文件」保存。';
    document.getElementById('dvhint').textContent=f.err?('读取提示：'+f.err):'已内嵌原始数据，可离线下载';
    if(dl) dl.style.display='';
  }else{
    /* 站点版：xlsx / zip / pdf 不内嵌，避免首屏被几 MB 的二进制拖死 */
    document.getElementById('dvtext').textContent='（二进制文件：'+f.n.split('.').pop().toUpperCase()+'）\n本页不内嵌原始数据，请在产物目录中打开：\n'+f.p;
    document.getElementById('dvhint').textContent='站点版只内嵌文本与图片，二进制原文件仍在产物归档目录里';
    if(dl) dl.style.display='none';
  }
  document.getElementById('dv').classList.add('show');
}
function dvDownload(){
  if(!dvFile)return;
  const href=dvFile.b || ('data:text/plain;charset=utf-8,'+encodeURIComponent(dvFile.t||''));
  const a=document.createElement('a'); a.href=href; a.download=dvFile.n;
  document.body.appendChild(a); a.click(); a.remove();
}
function dvClose(){document.getElementById('dv').classList.remove('show');}
document.getElementById('lb').addEventListener('click',e=>{if(e.target.id==='lb')lbClose();});
document.getElementById('dv').addEventListener('click',e=>{if(e.target.id==='dv')dvClose();});
document.addEventListener('keydown',e=>{
  if(document.getElementById('lb').classList.contains('show')){
    if(e.key==='Escape')lbClose();
    if(e.key==='ArrowRight')lbNext();
    if(e.key==='ArrowLeft')lbPrev();
  }else if(document.getElementById('dv').classList.contains('show')&&e.key==='Escape')dvClose();
});
/* 搜索：输入即筛（分组标题命中时整组保留），命中的分组自动展开 */
let qTimer=null;
document.getElementById('q').addEventListener('input',function(e){
  q=e.target.value;
  clearTimeout(qTimer);
  qTimer=setTimeout(function(){
    if(q.trim()){ DATA.forEach(function(r,ri){ if(filesFor(ri).length) openSet.add(ri); }); }
    render();
  },180);
});
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
  c.classList.add('on');filter=c.dataset.f;
  if(filter!=='all' && filter!=='recent'){ openSet.add(0); }
  render();
});
initIO();
/* 首屏只展开最新一个版本：既能看到最新截图，又不会一上来挂满 DOM */
if(DATA.length){ openSet.add(0); }
render();
</script>
</body>
</html>
