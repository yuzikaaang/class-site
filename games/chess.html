<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>中国象棋 · 25级05班</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:linear-gradient(170deg,#0d1024,#1a1440);color:#e9ecff;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:12px;gap:8px;min-height:100vh}
  a.back{color:#e9ecff;opacity:.7;text-decoration:none;font-size:14px;align-self:flex-start}
  h1{font-size:18px;margin:0}
  .hud{display:flex;gap:16px;font-size:15px;align-items:center;flex-wrap:wrap;justify-content:center}
  .hud b{color:#ffcf7a}
  .hud .turn{font-size:13px;padding:4px 12px;border-radius:999px;background:#232f55;color:#9db1ff}
  #wrap{position:relative;width:min(96vw,440px)}
  canvas{width:100%;height:auto;background:#1a2440;border-radius:14px;display:block;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:rgba(10,12,30,.76);border-radius:14px;text-align:center;padding:20px;z-index:3}
  .ov.hidden{display:none}
  .ov h2{margin:0;font-size:24px;color:#ffcf7a}
  .ov p{margin:2px 0;font-size:13px;color:#9db1ff;line-height:1.7}
  .ov button{border:none;border-radius:14px;padding:12px 24px;font-size:15px;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,#ff9f6b,#ff6b8b);color:#fff;box-shadow:0 8px 20px rgba(255,107,139,.3)}
  .ov button:active{transform:scale(.95)}
  .bar{display:flex;gap:8px;margin-top:2px;flex-wrap:wrap;justify-content:center;align-items:center}
  .bar button{border:none;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;
    background:#232f55;color:#9db1ff;outline:none}
  .bar button:active{background:#33405f}
  .tip{font-size:12px;opacity:.55}
</style>


<style>.licon{display:inline-block;flex:none;vertical-align:-2px}</style>
<script>
/* =====================================================
   图标系统：Lucide（lucide-static v1.48.0）—— 本页按需内联用到的图标
   全站统一只用 Lucide 一套，不混库、不使用 emoji 作为功能图标。
   ===================================================== */
var LUCIDE_ICONS={"arrow-left":"<path d=\"m12 19-7-7 7-7\"/><path d=\"M19 12H5\"/>","circle":"<circle cx=\"12\" cy=\"12\" r=\"10\"/>","crown":"<path d=\"M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z\"/><path d=\"M5 21h14\"/>","party-popper":"<path d=\"M5.8 11.3 2 22l10.7-3.79\"/><path d=\"M4 3h.01\"/><path d=\"M22 8h.01\"/><path d=\"M15 2h.01\"/><path d=\"M22 20h.01\"/><path d=\"m22 2-2.24.75a2.9 2.9 0 0 0-1.96 3.12c.1.86-.57 1.63-1.45 1.63h-.38c-.86 0-1.6.6-1.76 1.44L14 10\"/><path d=\"m22 13-.82-.33c-.86-.34-1.82.2-1.98 1.11c-.11.7-.72 1.22-1.43 1.22H17\"/><path d=\"m11 2 .33.82c.34.86-.2 1.82-1.11 1.98C9.52 4.9 9 5.52 9 6.23V7\"/><path d=\"M11 13c1.93 1.93 2.83 4.17 2 5-.83.83-3.07-.07-5-2-1.93-1.93-2.83-4.17-2-5 .83-.83 3.07.07 5 2Z\"/>","rotate-ccw":"<path d=\"M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8\"/><path d=\"M3 3v5h5\"/>"};
var EMOJI_ICON_MAP={"←":"arrow-left","♟":"crown","🔴":"circle","🎉":"party-popper","↩":"rotate-ccw","⚫":"circle"};
function iconSvg(name, size, extra){
  var s=size||16, e=extra||'';
  var inner=LUCIDE_ICONS[name];
  if(!inner) return '';
  return '<svg class="licon" xmlns="http://www.w3.org/2000/svg" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" '
    + 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" '
    + 'style="width:'+s+'px;height:'+s+'px;vertical-align:-2px;flex:none;'+e+'" aria-hidden="true">' + inner + '</svg>';
}
var EMOJI_RE=new RegExp('('+Object.keys(EMOJI_ICON_MAP).sort(function(a,b){return b.length-a.length;})
  .map(function(c){return c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).join('|')+')\\uFE0F?','g');
function emojiIconName(ch){ var k=ch.replace(/\uFE0F/g,''); return EMOJI_ICON_MAP[k]||EMOJI_ICON_MAP[ch]||''; }
function emojiSvgNode(ch,size){ var b=document.createElement('div'); b.innerHTML=iconSvg(emojiIconName(ch),size||16); return b.firstChild; }
function emojiifyText(node,size){
  var t=node.nodeValue; if(!t) return false;
  EMOJI_RE.lastIndex=0; if(!EMOJI_RE.test(t)) return false; EMOJI_RE.lastIndex=0;
  var frag=document.createDocumentFragment(),last=0,m,ok=false;
  while((m=EMOJI_RE.exec(t))){
    if(!emojiIconName(m[0])) continue;
    if(m.index>last) frag.appendChild(document.createTextNode(t.slice(last,m.index)));
    var sv=emojiSvgNode(m[0],size); if(sv) frag.appendChild(sv);
    last=m.index+m[0].length; ok=true;
    if(m[0].length===0) EMOJI_RE.lastIndex++;
  }
  if(!ok) return false;
  if(last<t.length) frag.appendChild(document.createTextNode(t.slice(last)));
  if(node.parentNode) node.parentNode.replaceChild(frag,node);
  return true;
}
var EMOJI_SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1,NOSCRIPT:1,TITLE:1,SVG:1,IFRAME:1,OPTION:1,SELECT:1};
function emojiify(root){
  root=root||document.body; if(!root) return 0;
  var changed=0,sizeCache={};
  try{
    var tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false),list=[],n;
    while((n=tw.nextNode())){ var p=n.parentNode; if(!p||EMOJI_SKIP[p.nodeName]||!n.nodeValue) continue; list.push(n); }
    for(var i=0;i<list.length;i++){
      var pe=list[i].parentElement,sz=16;
      if(pe){ if(sizeCache[pe.nodeName]===undefined){ try{ var fs=parseFloat(getComputedStyle(pe).fontSize)||15;
          sizeCache[pe.nodeName]=Math.max(12,Math.min(22,Math.round(fs*1.05)));}catch(e){sizeCache[pe.nodeName]=16;} }
        sz=sizeCache[pe.nodeName]; }
      if(emojiifyText(list[i],sz)) changed++;
    }
    changed+=emojiifyPlaceholders(root); changed+=emojiifyOptions(root);
  }catch(e){}
  return changed;
}
/* placeholder 只能放纯文本 → 换成行内 SVG 背景图标 */
function emojiifyPlaceholders(root){
  var ins=[],hit=0; try{ ins=root.querySelectorAll('input[placeholder],textarea[placeholder]'); }catch(e){ return 0; }
  for(var i=0;i<ins.length;i++){
    var el=ins[i]; if(el.getAttribute('data-emo-ico')) continue;
    var ph=el.getAttribute('placeholder')||''; EMOJI_RE.lastIndex=0;
    var m=EMOJI_RE.exec(ph); if(!m||!emojiIconName(m[0])) continue;
    el.setAttribute('data-emo-ico','1');
    el.setAttribute('placeholder', ph.replace(m[0],'').replace(/^\s+/,''));
    try{ var svg=iconSvg(emojiIconName(m[0]),16,'color:#9aa3b2');
      el.style.backgroundImage='url("data:image/svg+xml;utf8,'+encodeURIComponent(svg)+'")';
      el.style.backgroundRepeat='no-repeat'; el.style.backgroundPosition='10px center'; el.style.backgroundSize='16px 16px';
      var pl=parseFloat(getComputedStyle(el).paddingLeft)||10; if(pl<34) el.style.paddingLeft='34px'; }catch(e){}
    hit++;
  }
  return hit;
}
/* <option> 内无法内嵌 SVG（HTML 规范限制）→ 去掉图形保留文字 */
function emojiifyOptions(root){
  var opts=[],hit=0; try{ opts=root.querySelectorAll('option'); }catch(e){ return 0; }
  for(var i=0;i<opts.length;i++){ var el=opts[i],t=el.textContent||''; EMOJI_RE.lastIndex=0;
    if(!EMOJI_RE.test(t)) continue; el.textContent=t.replace(EMOJI_RE,'').replace(/^\s+/,''); hit++; }
  return hit;
}
var _emoBusy=false,_emoTimer=null,_emoAgain=false;
function emojiifySoon(){
  if(_emoBusy){ _emoAgain=true; return; }
  if(_emoTimer) return;
  _emoTimer=setTimeout(function(){ _emoTimer=null; if(_emoBusy) return; _emoBusy=true;
    try{ emojiify(document.body); }catch(e){} _emoBusy=false;
    if(_emoAgain){ _emoAgain=false; emojiifySoon(); } },60);
}
function emojiStart(){
  try{ emojiify(document.body); }catch(e){}
  if(window.MutationObserver){ try{ (new MutationObserver(emojiifySoon)).observe(document.body,{childList:true,subtree:true,characterData:true}); }catch(e){} }
  [400,1200,3000].forEach(function(d){ setTimeout(function(){ try{ emojiify(document.body); }catch(e){} },d); });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',emojiStart); else setTimeout(emojiStart,0);
</script>
</head>
<body>
<a class="back" href="../">← 返回班级站</a>
<h1>♟ 中国象棋 <span style="font-size:12px;opacity:.6">本地双人</span></h1>
<div class="hud"><span class="turn" id="turn">🔴 红方先行</span></div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div class="ov hidden" id="endOv">
    <h2 id="endTitle">🎉 红方胜！</h2>
    <p id="endInfo"></p>
    <button id="reBtn">再来一局</button>
  </div>
</div>
<div class="bar">
  <button id="undoBtn">↩ 悔棋</button>
  <button id="restartBtn">⟳ 重新开始</button>
</div>
<div class="tip">红方先手 · 点击选中棋子，再点高亮交点落子 · 吃光对方将帅即胜</div>
<script>
var AC=null;
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f,d,t,v,delay){var c=ac();if(!c)return;var o=c.createOscillator(),g=c.createGain();o.type=t||'square';o.frequency.value=f;var t0=c.currentTime+(delay||0);g.gain.setValueAtTime(v||0.05,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+(d||0.08));o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+(d||0.08)+0.02);}
var snd={pick:function(){tone(480,0.05,'triangle',0.04);},move:function(){tone(340,0.06,'square',0.04);},capture:function(){tone(220,0.12,'sawtooth',0.05);setTimeout(function(){tone(140,0.12,'sawtooth',0.04);},60);},win:function(){tone(660,0.09,'sine',0.06);setTimeout(function(){tone(880,0.09,'sine',0.06);},90);setTimeout(function(){tone(1100,0.12,'sine',0.06);},180);}};

/* ===== 棋盘：9 列 x 10 行交叉点，board[y][x]；红=正数，黑=负数 ===== */
var K=1,A=2,B=3,N=4,R=5,C=6,P=7;
var NAME={1:'帅',2:'仕',3:'相',4:'马',5:'车',6:'炮',7:'兵'};
var NAME_B={1:'将',2:'士',3:'象',4:'马',5:'车',6:'炮',7:'卒'};
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var CELL=44,OX=22,OY=22;
var W=8*CELL+OX*2,H=9*CELL+OY*2;
cv.width=W;cv.height=H;
var board,sel,cur,playing,lastMove,moves_history;

function initBoard(){
  board=[];
  for(var y=0;y<10;y++)board.push([0,0,0,0,0,0,0,0,0]);
  var back=[R,N,B,A,K,A,B,N,R];
  for(var x=0;x<9;x++){board[0][x]=-back[x];board[9][x]=back[x];}
  /* 中国象棋兵/卒只有 5 个，隔一格摆放（x=0,2,4,6,8），不是一排 9 个 */
  for(var x=0;x<9;x+=2){board[3][x]=-P;board[6][x]=P;}
  board[2][1]=-C;board[2][7]=-C;board[7][1]=C;board[7][7]=C;
}
function reset(){
  initBoard();sel=null;cur=1;playing=true;lastMove=null;moves_history=[];
  document.getElementById('endOv').classList.add('hidden');
  refreshTurn();draw();
}
function refreshTurn(){
  var el=document.getElementById('turn');
  if(!playing){el.textContent='对局结束';return;}
  el.textContent=(cur===1?'🔴 红方':'⚫ 黑方')+'落子';
  el.className='turn';
}
function inB(x,y){return x>=0&&x<9&&y>=0&&y<10;}
function nameOf(p){return p>0?NAME[p]:NAME_B[-p];}
function targetsFor(x,y,p){
  var list=[],s=p>0?1:-1,a=Math.abs(p);
  var push=function(tx,ty){
    if(!inB(tx,ty))return;
    var tp=board[ty][tx];
    if(tp!==0&&(tp>0?1:-1)===s)return;
    list.push([tx,ty]);
  };
  if(a===K){
    var kx0=3,kx1=5,ky0=s>0?7:0,ky1=s>0?9:2;
    if(x>=kx0&&x<=kx1&&y>=ky0&&y<=ky1){
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
        var nx=x+d[0],ny=y+d[1];
        if(nx>=kx0&&nx<=kx1&&ny>=ky0&&ny<=ky1)push(nx,ny);
      });
    }
  }else if(a===A){
    var kx0=3,kx1=5,ky0=s>0?7:0,ky1=s>0?9:2;
    [[1,1],[1,-1],[-1,1],[-1,-1]].forEach(function(d){
      var nx=x+d[0],ny=y+d[1];
      if(nx>=kx0&&nx<=kx1&&ny>=ky0&&ny<=ky1)push(nx,ny);
    });
  }else if(a===B){
    [[2,2],[2,-2],[-2,2],[-2,-2]].forEach(function(d){
      var nx=x+d[0],ny=y+d[1];
      if(s>0&&ny<5)return;
      if(s<0&&ny>4)return;
      var mx=x+d[0]/2,my=y+d[1]/2;
      if(inB(mx,my)&&board[my][mx]===0)push(nx,ny);
    });
  }else if(a===N){
    [[1,2],[1,-2],[-1,2],[-1,-2],[2,1],[2,-1],[-2,1],[-2,-1]].forEach(function(d){
      var lx=Math.abs(d[0])===2?x+d[0]/2:x, ly=Math.abs(d[0])===2?y:y+d[1]/2;
      if(inB(lx,ly)&&board[ly][lx]===0)push(x+d[0],y+d[1]);
    });
  }else if(a===R){
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
      var tx=x+d[0],ty=y+d[1];
      while(inB(tx,ty)){
        if(board[ty][tx]===0)push(tx,ty);
        else{if((board[ty][tx]>0?1:-1)!==s)push(tx,ty);break;}
        tx+=d[0];ty+=d[1];
      }
    });
  }else if(a===C){
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
      var tx=x+d[0],ty=y+d[1],jumped=false;
      while(inB(tx,ty)){
        if(!jumped){
          if(board[ty][tx]===0)push(tx,ty);
          else jumped=true;
        }else{
          if(board[ty][tx]!==0){if((board[ty][tx]>0?1:-1)!==s)push(tx,ty);break;}
        }
        tx+=d[0];ty+=d[1];
      }
    });
  }else if(a===P){
    var fy=s>0?y-1:y+1;
    push(x,fy);
    var crossed=s>0?(y<=4):(y>=5);
    if(crossed){push(x-1,y);push(x+1,y);}
  }
  return list;
}
function doMove(m){
  var cap=board[m.y1][m.x1];
  board[m.y1][m.x1]=board[m.y0][m.x0];
  board[m.y0][m.x0]=0;
  moves_history.push({x0:m.x0,y0:m.y0,x1:m.x1,y1:m.y1,cap:cap});
  lastMove=m;
  if(cap!==0)snd.capture();else snd.move();
  if(Math.abs(cap)===K){
    playing=false;
    var redWon=(cap<0);
    snd.win();
    document.getElementById('endTitle').textContent=redWon?'🎉 红方胜！':'⚫ 黑方胜！';
    document.getElementById('endInfo').textContent='将军！';
    document.getElementById('turn').textContent='对局结束';
    document.getElementById('endOv').classList.remove('hidden');
    draw();return true;
  }
  draw();return false;
}
/* 把点击坐标（像素）转换为交叉点 (col,row) */
function pointAt(clientX,clientY){
  var r=cv.getBoundingClientRect();
  var px=(clientX-r.left)*(W/r.width)-OX;
  var py=(clientY-r.top)*(H/r.height)-OY;
  return {x:Math.round(px/CELL),y:Math.round(py/CELL)};
}
cv.addEventListener('pointerdown',function(e){
  if(!playing)return;
  var p=pointAt(e.clientX,e.clientY);
  if(!inB(p.x,p.y))return;
  if(sel){
    var hit=false;
    for(var i=0;i<sel.ts.length;i++){
      if(sel.ts[i][0]===p.x&&sel.ts[i][1]===p.y){hit=true;break;}
    }
    if(hit){
      doMove({x0:sel.x,y0:sel.y,x1:p.x,y1:p.y});
      sel=null;
      if(playing){cur=cur===1?-1:1;refreshTurn();}
      return;
    }
    var q=board[p.y][p.x];
    if(q!==0&&(q>0?1:-1)===cur){sel={x:p.x,y:p.y,ts:targetsFor(p.x,p.y,q)};snd.pick();draw();return;}
    sel=null;draw();return;
  }
  var q=board[p.y][p.x];
  if(q!==0&&(q>0?1:-1)===cur){
    sel={x:p.x,y:p.y,ts:targetsFor(p.x,p.y,q)};
    snd.pick();draw();
  }
});
document.getElementById('undoBtn').addEventListener('click',function(){
  if(moves_history.length===0)return;
  var m=moves_history.pop();
  board[m.y0][m.x0]=board[m.y1][m.x1];
  board[m.y1][m.x1]=m.cap;
  cur=cur===1?-1:1;
  sel=null;lastMove=moves_history.length?moves_history[moves_history.length-1]:null;
  refreshTurn();draw();
});
document.getElementById('restartBtn').addEventListener('click',function(){reset();});
document.getElementById('reBtn').addEventListener('click',function(){reset();});
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#1a2440';ctx.fillRect(0,0,W,H);
  // 棋盘格线
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;
  for(var x=0;x<9;x++){
    ctx.beginPath();ctx.moveTo(OX+x*CELL,OY);ctx.lineTo(OX+x*CELL,OY+4*CELL);ctx.stroke();
    ctx.beginPath();ctx.moveTo(OX+x*CELL,OY+5*CELL);ctx.lineTo(OX+x*CELL,OY+9*CELL);ctx.stroke();
  }
  for(var y=0;y<10;y++){
    ctx.beginPath();ctx.moveTo(OX,OY+y*CELL);ctx.lineTo(OX+8*CELL,OY+y*CELL);ctx.stroke();
  }
  // 九宫斜线
  ctx.beginPath();ctx.moveTo(OX+3*CELL,OY);ctx.lineTo(OX+5*CELL,OY+2*CELL);ctx.stroke();
  ctx.beginPath();ctx.moveTo(OX+5*CELL,OY);ctx.lineTo(OX+3*CELL,OY+2*CELL);ctx.stroke();
  ctx.beginPath();ctx.moveTo(OX+3*CELL,OY+7*CELL);ctx.lineTo(OX+5*CELL,OY+9*CELL);ctx.stroke();
  ctx.beginPath();ctx.moveTo(OX+5*CELL,OY+7*CELL);ctx.lineTo(OX+3*CELL,OY+9*CELL);ctx.stroke();
  // 楚河汉界
  ctx.fillStyle='rgba(255,255,255,.2)';ctx.font='17px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('楚  河',OX+2*CELL,OY+4.5*CELL);
  ctx.fillText('汉  界',OX+6*CELL,OY+4.5*CELL);
  // 炮位与兵位的"小角标"（中国传统象棋标记）
  var marks=[[2,1],[2,7],[3,0],[3,2],[3,4],[3,6],[3,8],[6,0],[6,2],[6,4],[6,6],[6,8],[7,1],[7,7]];
  ctx.strokeStyle='rgba(255,255,255,.2)';
  for(var i=0;i<marks.length;i++){
    var mx=marks[i][0],my=marks[i][1];
    if(board[my][mx]!==0)continue;  // 有子时不画
    var cx=OX+mx*CELL,cy=OY+my*CELL;
    var s=6;
    if(mx>0){ctx.beginPath();ctx.moveTo(cx-s,cy);ctx.lineTo(cx-s,cy-s);ctx.moveTo(cx-s,cy);ctx.lineTo(cx-s,cy+s);ctx.stroke();}
    if(mx<8){ctx.beginPath();ctx.moveTo(cx+s,cy);ctx.lineTo(cx+s,cy-s);ctx.moveTo(cx+s,cy);ctx.lineTo(cx+s,cy+s);ctx.stroke();}
    if(my>0&&(my<5||my>4)){ctx.beginPath();ctx.moveTo(cx,cy-s);ctx.lineTo(cx-s,cy-s);ctx.moveTo(cx,cy-s);ctx.lineTo(cx+s,cy-s);ctx.stroke();}
    if(my<9&&(my<4||my>5)){ctx.beginPath();ctx.moveTo(cx,cy+s);ctx.lineTo(cx-s,cy+s);ctx.moveTo(cx,cy+s);ctx.lineTo(cx+s,cy+s);ctx.stroke();}
  }
  // 上一步标记
  if(lastMove){
    ctx.strokeStyle='rgba(255,207,122,.7)';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(OX+lastMove.x0*CELL,OY+lastMove.y0*CELL,CELL/2-3,0,7);ctx.stroke();
    ctx.beginPath();ctx.arc(OX+lastMove.x1*CELL,OY+lastMove.y1*CELL,CELL/2-3,0,7);ctx.stroke();
  }
  // 棋子（画在格线交叉点）
  for(var y=0;y<10;y++)for(var x=0;x<9;x++){
    var p=board[y][x];
    if(p===0)continue;
    var px=OX+x*CELL,py=OY+y*CELL;
    if(sel&&sel.x===x&&sel.y===y){
      ctx.fillStyle='rgba(124,131,255,.45)';
      ctx.beginPath();ctx.arc(px,py,CELL/2-3,0,7);ctx.fill();
    }
    ctx.fillStyle=p>0?'#ff6b6b':'#dfe6ff';
    ctx.beginPath();ctx.arc(px,py,CELL/2-5,0,7);ctx.fill();
    ctx.strokeStyle=p>0?'#a83a3a':'#8a93b8';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle=p>0?'#fff':'#232f55';
    ctx.font='bold 19px "KaiTi","STKaiti",serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(nameOf(p),px,py+1);
  }
  // 可选落点（交叉点）
  if(sel){
    for(var i=0;i<sel.ts.length;i++){
      var tx=sel.ts[i][0],ty=sel.ts[i][1];
      var px=OX+tx*CELL,py=OY+ty*CELL;
      if(board[ty][tx]!==0){
        ctx.strokeStyle='rgba(70,224,200,.8)';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(px,py,CELL/2-3,0,7);ctx.stroke();
      }else{
        ctx.fillStyle='rgba(70,224,200,.5)';
        ctx.beginPath();ctx.arc(px,py,5,0,7);ctx.fill();
      }
    }
  }
}
reset();
</script>
