<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>像素飞鸟 · 25级05班</title>
<style>
  :root{--bg:#0f1226;--fg:#e9ecff;--accent:#ffcf7a;--good:#46e0c8}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:linear-gradient(170deg,#0d1024,#1a1440 60%,#2a1a4a);color:var(--fg);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:12px;gap:8px;min-height:100vh;overflow:hidden}
  a.back{color:var(--fg);opacity:.7;text-decoration:none;font-size:14px;align-self:flex-start;z-index:5}
  h1{font-size:18px;margin:0;z-index:5}
  .hud{display:flex;gap:18px;font-size:15px;z-index:5}
  .hud b{color:var(--accent)}
  #wrap{position:relative;width:min(92vw,420px);z-index:2}
  canvas{width:100%;height:auto;background:linear-gradient(180deg,#141a3a,#1d2b5e 55%,#2b1f55);border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.5);display:block;touch-action:none;cursor:pointer}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:rgba(10,12,30,.72);border-radius:18px;text-align:center;padding:20px;z-index:3}
  .ov.hidden{display:none}
  .ov h2{font-size:26px;margin:0;color:var(--accent)}
  .ov p{margin:2px 0;font-size:13px;color:#9db1ff;line-height:1.7}
  .ov button{border:none;border-radius:14px;padding:13px 30px;font-size:16px;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,#7c83ff,#4a6cf7);color:#fff;box-shadow:0 8px 20px rgba(74,108,247,.35)}
  .ov button:active{transform:scale(.95)}
  .tip{font-size:12px;opacity:.55;z-index:5;text-align:center}
  /* 达标发券弹窗 */
  .reward-mask{display:none;position:fixed;inset:0;background:rgba(10,12,30,.78);z-index:999;
    align-items:center;justify-content:center;padding:20px}
  .reward-mask.show{display:flex}
  .reward-box{background:linear-gradient(160deg,#1a2040,#141936);border:1px solid #2a3550;
    border-radius:22px;padding:26px 22px;max-width:340px;width:100%;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .25s ease}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .reward-emoji{font-size:46px;line-height:1}
  .reward-title{font-size:19px;font-weight:800;color:#ffcf7a;margin:10px 0 4px}
  .reward-sub{font-size:13px;color:#9db1ff;margin-bottom:14px}
  .coupon-code{font-size:22px;font-weight:800;letter-spacing:2px;color:#46e0c8;
    background:#0b0f1f;border:1px dashed #2f5f5a;border-radius:12px;padding:12px 8px;margin:6px 0;
    user-select:all;-webkit-user-select:all;word-break:break-all}
  .reward-tip{font-size:12px;color:#7a869a;line-height:1.6;text-align:left;margin:10px 0 4px}
  .reward-btns{display:flex;gap:10px;margin-top:12px}
  .reward-btns button{flex:1;border:none;border-radius:12px;padding:11px 0;font-size:14px;
    font-weight:700;cursor:pointer}
  .btn-copy{background:#7c83ff;color:#fff}
  .btn-goto{background:#46e0c8;color:#0b0f1f;text-decoration:none;display:flex;align-items:center;justify-content:center;font-weight:800}
  .btn-close{background:#242b4a;color:#9db1ff}
  .reward-tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;
    background:rgba(124,131,255,.15);color:#a8afff;margin-top:8px}
  .reward-tag.err{background:rgba(255,107,139,.15);color:#ff9db4}
</style>
</head>
<body>
<a class="back" href="../">← 返回班级站</a>
<h1>🐦 像素飞鸟</h1>
<div class="hud"><span>得分 <b id="sc">0</b></span><span>最高 <b id="hi">0</b></span><span>目标 <b style="color:var(--good)">40</b> 管得点歌券</span></div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div class="ov" id="startOv">
    <h2>像素飞鸟</h2>
    <p>点击 / 空格 / 触摸 让小鸟扇翅膀<br>穿过水管得分，撞到就结束</p>
    <button id="startBtn">开始游戏</button>
  </div>
  <div class="ov hidden" id="overOv">
    <h2>💥 撞到啦</h2>
    <p id="overInfo"></p>
    <button id="reBtn">再来一局</button>
  </div>
  <!-- 达标发券弹窗 -->
  <div class="reward-mask" id="rewardMask">
    <div class="reward-box">
      <div class="reward-emoji" id="rwEmoji">🎉</div>
      <div class="reward-title" id="rwTitle">跨过 40 个水管！</div>
      <div class="reward-sub" id="rwSub">获得一张点歌券</div>
      <div class="coupon-code" id="rwCode">加载中…</div>
      <div class="reward-tip" id="rwTip"></div>
      <div class="reward-tag" id="rwTag"></div>
      <div class="reward-btns">
        <button class="btn-copy" id="rwCopy" onclick="copyCoupon()">复制券码</button>
        <a class="btn-goto" id="rwGoto" href="https://xsyzc2505.dpdns.org/" target="_blank" rel="noopener">去点歌 →</a>
        <button class="btn-close" onclick="closeReward()">继续游戏</button>
      </div>
    </div>
  </div>
  <!-- 本周已领过提示 -->
  <div class="reward-mask" id="claimedMask">
    <div class="reward-box">
      <div class="reward-emoji">🎫</div>
      <div class="reward-title">本周这张券已领过啦</div>
      <div class="reward-sub">像素飞鸟每周限领一张点歌券<br>下周一 0 点刷新后再来挑战！</div>
      <div class="reward-btns" style="margin-top:16px">
        <button class="btn-copy" onclick="claimContinue()">▶ 继续游戏</button>
        <button class="btn-close" onclick="claimExit()">🚪 退出游戏</button>
      </div>
    </div>
  </div>
  <!-- 领券人填写（每周首张券需填名字，备注留痕：谁·时间·任务） -->
  <div class="reward-mask" id="nameMask">
    <div class="reward-box">
      <div class="reward-emoji">✍️</div>
      <div class="reward-title">填写领券人</div>
      <div class="reward-sub" id="nmTask">领取：像素飞鸟过 40 管奖励（每周一张）</div>
      <input type="text" id="nmInput" placeholder="请输入你的名字" maxlength="10" style="width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid #3a4668;background:#0b0f1f;color:#e9ecff;font-size:15px;text-align:center;margin:8px 0 2px">
      <div class="reward-tip" style="text-align:center">名字会记录在这张券的备注里（谁 · 时间 · 任务）</div>
      <div class="reward-btns" style="margin-top:14px">
        <button class="btn-copy" onclick="doClaim()">✅ 确认领券</button>
        <button class="btn-close" onclick="closeName()">取消</button>
      </div>
    </div>
  </div>
</div>
<div class="tip">每次点击扇一次翅膀 · 下落速度会越来越快</div>
<script>
/* ===== 音效（Web Audio 合成） ===== */
var AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f,d,t,v,delay){
  var c=ac(); if(!c)return;
  var o=c.createOscillator(),g=c.createGain();
  o.type=t||'square';o.frequency.value=f;
  var t0=c.currentTime+(delay||0);
  g.gain.setValueAtTime(v||0.05,t0);
  g.gain.exponentialRampToValueAtTime(0.001,t0+(d||0.08));
  o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+(d||0.08)+0.02);
}
var snd={flap:function(){tone(320,0.06,'triangle',0.06);},score:function(){tone(880,0.07,'sine',0.06);setTimeout(function(){tone(1320,0.09,'sine',0.05);},70);},hit:function(){tone(220,0.2,'sawtooth',0.07);setTimeout(function(){tone(110,0.3,'sawtooth',0.06);},90);}};

/* ===== 游戏 ===== */
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=420,H=640;
cv.width=W;cv.height=H;
var G=0.5,FLAP=-9.5,BIRD=22,GAP=150,PIPE_W=64,SPEED=3.2;
var bird,y,vel,sc,hi,pipes,timer,playing,over,rewardHandled,invince;
hi=+(localStorage.getItem('bird_hi')||0);document.getElementById('hi').textContent=hi;

function reset(){bird=W*0.32;y=H*0.42;vel=0;sc=0;pipes=[];playing=true;over=false;rewardHandled=false;
  invince=Date.now()+2000;   /* 开局 2 秒无敌：前 2 秒不判碰撞，避免开局快速连排的水管直接撞死 */
  document.getElementById('sc').textContent=0;hideOv();tick();}
function flap(){ if(!playing)return; vel=FLAP; snd.flap(); }
function hideOv(){document.getElementById('startOv').classList.add('hidden');document.getElementById('overOv').classList.add('hidden');}
function gameOver(){
  playing=false;over=true;
  snd.hit();
  if(sc>hi){hi=sc;try{localStorage.setItem('bird_hi',hi);}catch(e){} document.getElementById('hi').textContent=hi;}
  document.getElementById('overInfo').innerHTML='得分 '+sc+'　'+(sc>=hi&&sc>0?'🏆 新纪录！':'最高 '+hi);
  document.getElementById('overOv').classList.remove('hidden');
}
function tick(){
  if(!playing){ if(over) draw(); return; }
  vel+=G;y+=vel;
  // 生成水管
  if(pipes.length===0||pipes[pipes.length-1].x<W-220){
    var top=60+Math.random()*(H-GAP-140);
    pipes.push({x:W,top:top});
  }
  for(var i=pipes.length-1;i>=0;i--){
    var p=pipes[i];p.x-=SPEED;
    if(!p.passed&&p.x+PIPE_W<bird){p.passed=true;sc++;snd.score();document.getElementById('sc').textContent=sc;
      if(sc>=REWARD.threshold&&!rewardHandled){rewardHandled=true;
        if(!alreadyClaimed()){showNameAsk();}
        else{pauseForClaimed();}}}
    if(p.x+PIPE_W<-10)pipes.splice(i,1);
  }
  var now=Date.now();
  if(now<invince){
    /* 无敌期：只夹紧上下边界，不判死 */
    if(y<0)y=0; else if(y>H-BIRD)y=H-BIRD;
  }else{
    if(y<0||y>H-BIRD){gameOver();draw();return;}
  }
  var bx=bird,bw=BIRD,bh=BIRD;
  if(now>=invince){
    for(var i=0;i<pipes.length;i++){
      var p=pipes[i];
      if(bx+bw>p.x&&bx<p.x+PIPE_W){
        if(y<p.top||y+bh>p.top+GAP){gameOver();draw();return;}
      }
    }
  }
  draw();requestAnimationFrame(tick);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  // 星空背景
  ctx.fillStyle='rgba(255,255,255,.14)';
  for(var i=0;i<22;i++){
    var sx=(i*97+13)%W, sy=(i*61+29)%(H-60);
    ctx.fillRect(sx,sy,2,2);
  }
  // 水管
  for(var i=0;i<pipes.length;i++){
    var p=pipes[i];
    ctx.fillStyle='#2fd6a8';ctx.fillRect(p.x,0,PIPE_W,p.top);
    ctx.fillStyle='#23b389';ctx.fillRect(p.x+4,p.top-16,PIPE_W-8,16);
    ctx.fillStyle='#2fd6a8';ctx.fillRect(p.x,p.top+GAP,PIPE_W,H-p.top-GAP);
    ctx.fillStyle='#23b389';ctx.fillRect(p.x+4,p.top+GAP,PIPE_W-8,16);
  }
  // 鸟（像素风；无敌期半透明闪烁）
  if(Date.now()<invince) ctx.globalAlpha=.5;
  ctx.save();ctx.translate(bird+11,y+11);
  ctx.fillStyle='#ffd93d';ctx.fillRect(-11,-9,22,18);
  ctx.fillStyle='#fff';ctx.fillRect(2,-5,6,5);
  ctx.fillStyle='#222';ctx.fillRect(5,-3,2,2);
  ctx.fillStyle='#ff7b3d';ctx.fillRect(-11,2,6,8);
  ctx.fillStyle='#46e0c8';ctx.fillRect(-9,-9,6,6);
  ctx.restore();
  ctx.globalAlpha=1;
}
document.getElementById('startBtn').addEventListener('click',function(){ac();reset();});
document.getElementById('reBtn').addEventListener('click',function(){reset();});
cv.addEventListener('pointerdown',function(){flap();});
document.addEventListener('keydown',function(e){ if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); flap(); } });

/* ===== 周常点歌券奖励（每周一刷新，每款游戏每周一张） ===== */
var REWARD = { game:'bird', title:'跨过 40 个水管！', sub:'获得一张点歌券（去点歌平台点歌时使用）', note:'像素飞鸟过40管奖励', threshold:40 };
var _CPN_MASK='vgate25coupon0801';
var _CPN_ENC='000f14163a0251055b41155e5f56010605415653165d5406055b47155b57060a5552415f57';
function _cpnDec(){ var s=''; for(var i=0;i<_CPN_ENC.length;i+=2){ s+=String.fromCharCode(parseInt(_CPN_ENC.substr(i,2),16)^_CPN_MASK.charCodeAt((i/2)%_CPN_MASK.length)); } return s; }
var VOICEHUB_COUPON={ enabled:true, url:'https://xsyzc2505.dpdns.org/api/open/card-codes', method:'POST', token:_cpnDec(), tokenField:'x-api-key', tokenPrefix:'', respCodeKey:'data.cardCodes.0.code' };
function weekKey(){ var d=new Date(), day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function alreadyClaimed(){ try{ return localStorage.getItem('song_coupon_w_'+REWARD.game)===weekKey(); }catch(e){ return false; } }
function markClaimed(){ try{ localStorage.setItem('song_coupon_w_'+REWARD.game, weekKey()); }catch(e){} }
function pickPath(obj,path){ var ks=String(path||'code').split('.'); for(var i=0;i<ks.length;i++){ if(obj==null)return ''; obj=obj[ks[i]]; } return (typeof obj==='string'||typeof obj==='number')?String(obj):''; }
/* 领券人填写（每周首张券需填名字，备注留痕：谁·时间·任务） */
var _claimName='';
function nowStamp(){
  var d=new Date(),p=function(n){return (n<10?'0':'')+n;};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function showNameAsk(){
  var m=document.getElementById('nameMask'); if(!m) return;
  var sub=document.getElementById('nmTask'); if(sub) sub.textContent='领取：'+REWARD.title+'（每周一张）';
  var inp=document.getElementById('nmInput');
  if(inp){ try{ inp.value=localStorage.getItem('cls_coupon_name')||''; }catch(e){} }
  m.classList.add('show');
}
function doClaim(){
  var inp=document.getElementById('nmInput');
  var name=(inp?inp.value.trim():'');
  if(!name){ if(inp){ inp.style.borderColor='#ff6b8b'; inp.focus(); } return; }
  if(inp) inp.style.borderColor='#3a4668';
  try{ localStorage.setItem('cls_coupon_name', name); }catch(e){}
  _claimName=name;
  closeName();
  markClaimed();
  showReward();
}
function closeName(){ var m=document.getElementById('nameMask'); if(m) m.classList.remove('show'); }
function claimCoupon(name,cb){
  var cfg=VOICEHUB_COUPON;
  if(window.VOICEHUB_COUPON_OVERRIDE) cfg=window.VOICEHUB_COUPON_OVERRIDE;
  if(cfg.enabled && cfg.url){
    var headers={};
    if(cfg.tokenField==='Authorization'){ headers['Authorization']=(cfg.tokenPrefix||'')+cfg.token; }
    else{ headers[cfg.tokenField]=cfg.token; }
    headers['Content-Type']='application/json';
    var body=JSON.stringify({count:1,prefix:'SONG',length:8,note:(name||'匿名')+' · '+nowStamp()+' · '+REWARD.note});
    fetch(cfg.url,{method:cfg.method||'POST',headers:headers,body:body})
      .then(function(r){ return r.json().catch(function(){ return {code:''}; }); })
      .then(function(j){
        var code=pickPath(j,cfg.respCodeKey);
        if(code){ cb({ok:true,code:code,remote:true}); }
        else{ cb({ok:false,err:'接口返回了但没有识别到券码',remote:true}); }
      })
      .catch(function(e){ cb({ok:false,err:'点歌券服务暂不可用（'+e.message+'）',remote:true}); });
  }else{
    var code='SONG-'+Math.random().toString(36).slice(2,6).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
    setTimeout(function(){ cb({ok:false,err:'发券服务暂未开放，此券码仅作预览（未生效）',code:code,remote:false}); },400);
  }
}
function showReward(){
  var mask=document.getElementById('rewardMask');
  document.getElementById('rwTitle').textContent=REWARD.title;
  document.getElementById('rwSub').textContent=REWARD.sub;
  document.getElementById('rwCode').textContent='请稍候…';
  document.getElementById('rwTip').textContent='';
  var tag=document.getElementById('rwTag'); tag.className='reward-tag'; tag.textContent='正在为你生成券码…';
  mask.classList.add('show');
  claimCoupon(_claimName,function(res){
    document.getElementById('rwCode').textContent=res.code||'生成失败';
    if(res.ok && res.remote){
      tag.className='reward-tag'; tag.textContent='✅ 已在点歌平台登记，复制券码去点歌吧';
      document.getElementById('rwTip').textContent='1. 复制上面的券码\n2. 打开「点歌平台」\n3. 点歌时把券码粘贴进去';
      window.__lastCoupon=res.code;
    }else{
      tag.className='reward-tag err';
      tag.textContent=res.remote ? ('⚠️ '+res.err) : '⚠️ 发券服务暂未开放（演示券码，未生效）';
      document.getElementById('rwTip').textContent='等站主接入点歌平台后，这张券就能真正使用啦';
      window.__lastCoupon=res.code||'';
    }
  });
}
function closeReward(){ document.getElementById('rewardMask').classList.remove('show'); }
/* 本周已领过：暂停游戏 + 选择继续/退出 */
function showClaimed(){ var m=document.getElementById('claimedMask'); if(m) m.classList.add('show'); }
function closeClaimed(){ var m=document.getElementById('claimedMask'); if(m) m.classList.remove('show'); }
function pauseForClaimed(){ playing=false; showClaimed(); }
function claimContinue(){ closeClaimed(); playing=true; tick(); }
function claimExit(){ closeClaimed(); playing=false; over=false; document.getElementById('startOv').classList.remove('hidden'); }
function copyCoupon(){
  var c=window.__lastCoupon||document.getElementById('rwCode').textContent;
  var done=function(){ document.getElementById('rwCopy').textContent='已复制 ✓'; setTimeout(function(){document.getElementById('rwCopy').textContent='复制券码';},1500); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(c).then(done).catch(function(){ fallbackCopy(c);done(); }); }
  else{ fallbackCopy(c);done(); }
}
function fallbackCopy(t){ var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
document.getElementById('rewardMask').addEventListener('click',function(e){ if(e.target.id==='rewardMask') closeReward(); });
</script>
</body>
</html>
