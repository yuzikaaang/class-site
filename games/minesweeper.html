<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>扫雷 · 25级05班</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:linear-gradient(170deg,#0d1024,#12203f);color:#e9ecff;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:12px;gap:8px;min-height:100vh}
  a.back{color:#e9ecff;opacity:.7;text-decoration:none;font-size:14px;align-self:flex-start}
  h1{font-size:18px;margin:0}
  .hud{display:flex;gap:16px;font-size:15px}
  .hud b{color:#ffcf7a}
  #wrap{position:relative;width:min(94vw,430px)}
  canvas{width:100%;height:auto;background:#0b0f22;border-radius:14px;display:block;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:rgba(10,12,30,.76);border-radius:14px;text-align:center;padding:20px;z-index:3}
  .ov.hidden{display:none}
  .ov h2{margin:0;font-size:24px;color:#ffcf7a}
  .ov p{margin:2px 0;font-size:13px;color:#9db1ff;line-height:1.7}
  .diff-row{display:flex;gap:10px;margin-top:6px}
  .diff-row button{border:none;border-radius:12px;padding:12px 18px;font-size:14px;font-weight:800;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,#7c83ff,#4a6cf7)}
  .diff-row button:nth-child(2){background:linear-gradient(135deg,#ff9f6b,#ff7b3d)}
  .diff-row button:nth-child(3){background:linear-gradient(135deg,#ff6b8b,#e14b6b)}
  .diff-row button:nth-child(2),.diff-row button:nth-child(3){color:#3a1206}
  .diff-row button:active{transform:scale(.95)}
  .custom{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13px;color:#9db1ff}
  .custom input{width:70px;padding:8px;border-radius:10px;border:1px solid #3a4a6b;background:#131a26;color:#e9ecff;text-align:center;font-size:14px}
  .custom button{border:none;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:800;cursor:pointer;
    background:#46e0c8;color:#0b0f22}
  .tip{font-size:12px;opacity:.55}
</style>


<style>.licon{display:inline-block;flex:none;vertical-align:-2px}</style>
<script>
/* =====================================================
   图标系统：Lucide（lucide-static v1.48.0）—— 本页按需内联用到的图标
   全站统一只用 Lucide 一套，不混库、不使用 emoji 作为功能图标。
   ===================================================== */
var LUCIDE_ICONS={"arrow-left":"<path d=\"m12 19-7-7 7-7\"/><path d=\"M19 12H5\"/>","bomb":"<circle cx=\"11\" cy=\"13\" r=\"9\"/><path d=\"M14.35 4.65 16.3 2.7a2.41 2.41 0 0 1 3.4 0l1.6 1.6a2.4 2.4 0 0 1 0 3.4l-1.95 1.95\"/><path d=\"m22 2-1.5 1.5\"/>","flag":"<path d=\"M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.333 2q2 0 3.067-.8A1 1 0 0 1 20 4v10a1 1 0 0 1-.4.8A6 6 0 0 1 16 16c-3 0-5-2-8-2a6 6 0 0 0-4 1.528\"/>","party-popper":"<path d=\"M5.8 11.3 2 22l10.7-3.79\"/><path d=\"M4 3h.01\"/><path d=\"M22 8h.01\"/><path d=\"M15 2h.01\"/><path d=\"M22 20h.01\"/><path d=\"m22 2-2.24.75a2.9 2.9 0 0 0-1.96 3.12c.1.86-.57 1.63-1.45 1.63h-.38c-.86 0-1.6.6-1.76 1.44L14 10\"/><path d=\"m22 13-.82-.33c-.86-.34-1.82.2-1.98 1.11c-.11.7-.72 1.22-1.43 1.22H17\"/><path d=\"m11 2 .33.82c.34.86-.2 1.82-1.11 1.98C9.52 4.9 9 5.52 9 6.23V7\"/><path d=\"M11 13c1.93 1.93 2.83 4.17 2 5-.83.83-3.07-.07-5-2-1.93-1.93-2.83-4.17-2-5 .83-.83 3.07.07 5 2Z\"/>","signal-high":"<path d=\"M2 20h.01\"/><path d=\"M7 20v-4\"/><path d=\"M12 20v-8\"/><path d=\"M17 20V8\"/>","signal-low":"<path d=\"M2 20h.01\"/><path d=\"M7 20v-4\"/>","signal-medium":"<path d=\"M2 20h.01\"/><path d=\"M7 20v-4\"/><path d=\"M12 20v-8\"/>","trophy":"<path d=\"M10 14.66V17a1 1 0 0 1-1 1 2 2 0 0 0-2 2v2\"/><path d=\"M14 14.66V17a1 1 0 0 0 1 1 2 2 0 0 1 2 2v2\"/><path d=\"M17.916 10H19.5A2.5 2.5 0 0 0 22 7.5V5a1 1 0 0 0-1-1h-3\"/><path d=\"M4 22h16\"/><path d=\"M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z\"/><path d=\"M6.084 10H4.5A2.5 2.5 0 0 1 2 7.5V5a1 1 0 0 1 1-1h3\"/>","zap":"<path d=\"M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z\"/>"};
var EMOJI_ICON_MAP={"←":"arrow-left","💣":"bomb","😌":"signal-low","🙂":"signal-medium","😈":"signal-high","💥":"zap","🏆":"trophy","🎉":"party-popper","🚩":"flag"};
function iconSvg(name, size, extra){
  var s=size||16, e=extra||'';
  var inner=LUCIDE_ICONS[name];
  if(!inner) return '';
  return '<svg class="licon" xmlns="http://www.w3.org/2000/svg" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" '
    + 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" '
    + 'style="width:'+s+'px;height:'+s+'px;vertical-align:-2px;flex:none;'+e+'" aria-hidden="true">' + inner + '</svg>';
}
var EMOJI_RE=new RegExp('('+Object.keys(EMOJI_ICON_MAP).sort(function(a,b){return b.length-a.length;})
  .map(function(c){return c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).join('|')+')\\uFE0F?','g');
function emojiIconName(ch){ var k=ch.replace(/\uFE0F/g,''); return EMOJI_ICON_MAP[k]||EMOJI_ICON_MAP[ch]||''; }
function emojiSvgNode(ch,size){ var b=document.createElement('div'); b.innerHTML=iconSvg(emojiIconName(ch),size||16); return b.firstChild; }
function emojiifyText(node,size){
  var t=node.nodeValue; if(!t) return false;
  EMOJI_RE.lastIndex=0; if(!EMOJI_RE.test(t)) return false; EMOJI_RE.lastIndex=0;
  var frag=document.createDocumentFragment(),last=0,m,ok=false;
  while((m=EMOJI_RE.exec(t))){
    if(!emojiIconName(m[0])) continue;
    if(m.index>last) frag.appendChild(document.createTextNode(t.slice(last,m.index)));
    var sv=emojiSvgNode(m[0],size); if(sv) frag.appendChild(sv);
    last=m.index+m[0].length; ok=true;
    if(m[0].length===0) EMOJI_RE.lastIndex++;
  }
  if(!ok) return false;
  if(last<t.length) frag.appendChild(document.createTextNode(t.slice(last)));
  if(node.parentNode) node.parentNode.replaceChild(frag,node);
  return true;
}
var EMOJI_SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1,NOSCRIPT:1,TITLE:1,SVG:1,IFRAME:1,OPTION:1,SELECT:1};
function emojiify(root){
  root=root||document.body; if(!root) return 0;
  var changed=0,sizeCache={};
  try{
    var tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false),list=[],n;
    while((n=tw.nextNode())){ var p=n.parentNode; if(!p||EMOJI_SKIP[p.nodeName]||!n.nodeValue) continue; list.push(n); }
    for(var i=0;i<list.length;i++){
      var pe=list[i].parentElement,sz=16;
      if(pe){ if(sizeCache[pe.nodeName]===undefined){ try{ var fs=parseFloat(getComputedStyle(pe).fontSize)||15;
          sizeCache[pe.nodeName]=Math.max(12,Math.min(22,Math.round(fs*1.05)));}catch(e){sizeCache[pe.nodeName]=16;} }
        sz=sizeCache[pe.nodeName]; }
      if(emojiifyText(list[i],sz)) changed++;
    }
    changed+=emojiifyPlaceholders(root); changed+=emojiifyOptions(root);
  }catch(e){}
  return changed;
}
/* placeholder 只能放纯文本 → 换成行内 SVG 背景图标 */
function emojiifyPlaceholders(root){
  var ins=[],hit=0; try{ ins=root.querySelectorAll('input[placeholder],textarea[placeholder]'); }catch(e){ return 0; }
  for(var i=0;i<ins.length;i++){
    var el=ins[i]; if(el.getAttribute('data-emo-ico')) continue;
    var ph=el.getAttribute('placeholder')||''; EMOJI_RE.lastIndex=0;
    var m=EMOJI_RE.exec(ph); if(!m||!emojiIconName(m[0])) continue;
    el.setAttribute('data-emo-ico','1');
    el.setAttribute('placeholder', ph.replace(m[0],'').replace(/^\s+/,''));
    try{ var svg=iconSvg(emojiIconName(m[0]),16,'color:#9aa3b2');
      el.style.backgroundImage='url("data:image/svg+xml;utf8,'+encodeURIComponent(svg)+'")';
      el.style.backgroundRepeat='no-repeat'; el.style.backgroundPosition='10px center'; el.style.backgroundSize='16px 16px';
      var pl=parseFloat(getComputedStyle(el).paddingLeft)||10; if(pl<34) el.style.paddingLeft='34px'; }catch(e){}
    hit++;
  }
  return hit;
}
/* <option> 内无法内嵌 SVG（HTML 规范限制）→ 去掉图形保留文字 */
function emojiifyOptions(root){
  var opts=[],hit=0; try{ opts=root.querySelectorAll('option'); }catch(e){ return 0; }
  for(var i=0;i<opts.length;i++){ var el=opts[i],t=el.textContent||''; EMOJI_RE.lastIndex=0;
    if(!EMOJI_RE.test(t)) continue; el.textContent=t.replace(EMOJI_RE,'').replace(/^\s+/,''); hit++; }
  return hit;
}
var _emoBusy=false,_emoTimer=null,_emoAgain=false;
function emojiifySoon(){
  if(_emoBusy){ _emoAgain=true; return; }
  if(_emoTimer) return;
  _emoTimer=setTimeout(function(){ _emoTimer=null; if(_emoBusy) return; _emoBusy=true;
    try{ emojiify(document.body); }catch(e){} _emoBusy=false;
    if(_emoAgain){ _emoAgain=false; emojiifySoon(); } },60);
}
function emojiStart(){
  try{ emojiify(document.body); }catch(e){}
  if(window.MutationObserver){ try{ (new MutationObserver(emojiifySoon)).observe(document.body,{childList:true,subtree:true,characterData:true}); }catch(e){} }
  [400,1200,3000].forEach(function(d){ setTimeout(function(){ try{ emojiify(document.body); }catch(e){} },d); });
}
/* canvas 里画 Lucide 图标（游戏每帧重绘，图标异步解码不影响最终显示） */
var _liCache={};
function lucideImg(name,size,color,sw){
  var k=name+'|'+size+'|'+color+'|'+(sw||2);
  if(_liCache[k]) return _liCache[k];
  var inner=LUCIDE_ICONS[name]||'';
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="'+(sw||2)+'" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>';
  var im=new Image(); im.src='data:image/svg+xml;utf8,'+encodeURIComponent(svg);
  _liCache[k]=im; return im;
}
/* align: center=以(x,y)为中心 | left=从x起 | right=到x止 */
function drawIcon(ctx,name,x,y,size,color,align){
  var im=lucideImg(name,size,color||'#fff');
  var ox = align==='center' ? x-size/2 : (align==='right' ? x-size : x);
  try{ ctx.drawImage(im,ox,y-size/2,size,size); }catch(e){}
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',emojiStart); else setTimeout(emojiStart,0);
</script>
</head>
<body>
<a class="back" href="../">← 返回班级站</a>
<h1>💣 扫雷</h1>
<div class="hud"><span>雷 <b id="mines">10</b></span><span>时间 <b id="tm">0</b></span><span>最快 <b id="best">--</b></span></div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div class="ov" id="startOv">
    <h2>扫雷</h2>
    <p>选择难度开始 · 电脑右键 / 手机长按 标旗</p>
    <div class="diff-row">
      <button onclick="startGame(9,9,10)">😌 简单</button>
      <button onclick="startGame(12,12,24)">🙂 中等</button>
      <button onclick="startGame(16,16,60)">😈 困难</button>
    </div>
    <div class="custom">自定义雷数
      <input id="mineCount" type="number" min="1" max="200" value="30">
      <button onclick="customStart()">开始</button>
    </div>
  </div>
  <div class="ov hidden" id="overOv">
    <h2 id="ovTitle">💥 踩雷啦</h2>
    <p id="ovInfo"></p>
    <button id="reBtn">再来一局</button>
  </div>
</div>
<div class="tip">移动端长按格子标旗 · 数字表示周围雷数</div>
<script>
var AC=null;
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f,d,t,v,delay){var c=ac();if(!c)return;var o=c.createOscillator(),g=c.createGain();o.type=t||'square';o.frequency.value=f;var t0=c.currentTime+(delay||0);g.gain.setValueAtTime(v||0.05,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+(d||0.08));o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+(d||0.08)+0.02);}
var snd={open:function(){tone(520,0.04,'triangle',0.04);},flag:function(){tone(340,0.05,'square',0.04);},boom:function(){tone(150,0.35,'sawtooth',0.08);setTimeout(function(){tone(90,0.4,'sawtooth',0.06);},110);},win:function(){tone(660,0.09,'sine',0.06);setTimeout(function(){tone(880,0.09,'sine',0.06);},90);setTimeout(function(){tone(1100,0.12,'sine',0.06);},180);}};

var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var R=9,C=9,MINES=10,CELL=44,W=396,H=396;
cv.width=W;cv.height=H;
var grid,flags,revealed,playing,started,t0,timerId,best;
best=+(localStorage.getItem('mine_best')||0);
document.getElementById('best').textContent=best?best+'s':'--';

function startGame(rows,cols,mines){
  R=rows;C=cols;MINES=mines;
  CELL=Math.max(18,Math.min(44,Math.floor(430/C)));
  W=C*CELL;H=R*CELL;
  cv.width=W;cv.height=H;
  document.getElementById('startOv').classList.add('hidden');
  reset();
}
function customStart(){
  var v=parseInt(document.getElementById('mineCount').value,10)||30;
  v=Math.max(1,Math.min(200,v));
  if(v>=144)v=140; // 12x12 留出安全格
  startGame(12,12,v);
}
function reset(){
  grid=[];flags=0;revealed=0;playing=true;started=false;t0=0;
  if(timerId)clearInterval(timerId);
  document.getElementById('tm').textContent='0';
  document.getElementById('mines').textContent=MINES;
  document.getElementById('overOv').classList.add('hidden');
  for(var r=0;r<R;r++){grid[r]=[];for(var c=0;c<C;c++)grid[r][c]={mine:false,open:false,flag:false,n:0};}
  draw();
}
function plant(avoidR,avoidC){
  var placed=0,maxMine=Math.min(MINES,R*C-9);
  while(placed<maxMine){
    var r=(Math.random()*R)|0,c=(Math.random()*C)|0;
    if(grid[r][c].mine)continue;
    if(Math.abs(r-avoidR)<=1&&Math.abs(c-avoidC)<=1)continue;
    grid[r][c].mine=true;placed++;
  }
  for(var r=0;r<R;r++)for(var c=0;c<C;c++){
    if(grid[r][c].mine){grid[r][c].n=-1;continue;}
    var n=0;
    for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){
      var nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<R&&nc>=0&&nc<C&&grid[nr][nc].mine)n++;
    }
    grid[r][c].n=n;
  }
  document.getElementById('mines').textContent=MINES;
}
function flood(r,c){
  if(r<0||r>=R||c<0||c>=C)return;
  var g=grid[r][c];
  if(g.open||g.flag)return;
  g.open=true;revealed++;
  if(g.n===0)for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++)if(dr||dc)flood(r+dr,c+dc);
}
function open(r,c){
  if(!playing)return;
  if(!started){plant(r,c);started=true;t0=Date.now();timerId=setInterval(function(){document.getElementById('tm').textContent=Math.round((Date.now()-t0)/1000);},500);}
  var g=grid[r][c];
  if(g.flag||g.open)return;
  if(g.mine){boom();return;}
  flood(r,c);snd.open();
  if(revealed>=R*C-MINES)win();
  draw();
}
function flag(r,c){
  if(!playing)return;
  var g=grid[r][c];
  if(g.open)return;
  g.flag=!g.flag;
  flags+=g.flag?1:-1;
  document.getElementById('mines').textContent=Math.max(0,MINES-flags);
  snd.flag();draw();
}
function boom(){
  playing=false;snd.boom();
  if(timerId)clearInterval(timerId);
  for(var r=0;r<R;r++)for(var c=0;c<C;c++)if(grid[r][c].mine)grid[r][c].open=true;
  document.getElementById('ovTitle').textContent='💥 踩雷啦';
  document.getElementById('ovInfo').textContent='坚持了 '+document.getElementById('tm').textContent+' 秒';
  document.getElementById('overOv').classList.remove('hidden');
  draw();
}
function win(){
  playing=false;snd.win();
  if(timerId)clearInterval(timerId);
  var sec=Math.round((Date.now()-t0)/1000);
  if(!best||sec<best){best=sec;try{localStorage.setItem('mine_best',best);}catch(e){} document.getElementById('best').textContent=best+'s 🏆';}
  document.getElementById('ovTitle').textContent='🎉 扫完啦！';
  document.getElementById('ovInfo').textContent='用时 '+sec+' 秒'+(best===sec?'　🏆 新纪录！':'　最快 '+best+'s');
  document.getElementById('overOv').classList.remove('hidden');
}
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
/* 统一用 pointer 事件处理输入：
   电脑：左键翻开 / 右键标旗
   手机：轻点翻开 / 长按约 450ms 标旗（轻点与长按用计时器区分，避免冲突） */
function cellFromEvent(e){
  var r=cv.getBoundingClientRect();
  var c=((e.clientX-r.left)*(W/r.width)/CELL)|0;
  var rr=((e.clientY-r.top)*(H/r.height)/CELL)|0;
  if(c<0||c>=C||rr<0||rr>=R)return null;
  return {r:rr,c:c};
}
var pressTimer=null,pressCell=null,longFired=false;
cv.addEventListener('pointerdown',function(e){
  if(!playing)return;
  var pos=cellFromEvent(e); if(!pos)return;
  if(e.pointerType==='mouse'){
    if(e.button===2){flag(pos.r,pos.c);draw();}
    else{open(pos.r,pos.c);draw();}
    return;
  }
  pressCell=pos;longFired=false;
  pressTimer=setTimeout(function(){ longFired=true; flag(pos.r,pos.c); draw(); },450);
});
cv.addEventListener('pointerup',function(e){
  if(e.pointerType!=='touch')return;
  clearTimeout(pressTimer);
  if(!longFired&&pressCell){open(pressCell.r,pressCell.c);draw();}
  pressCell=null;
});
cv.addEventListener('pointercancel',function(){ clearTimeout(pressTimer); pressCell=null; });
document.getElementById('reBtn').addEventListener('click',function(){startGame(R,C,MINES);});
function draw(){
  ctx.clearRect(0,0,W,H);
  var numC=['','#4a6cf7','#2fd6a8','#ff6b8b','#9b59d0','#e67e22','#1abc9c','#f1c40f','#95a5a6'];
  var fs=Math.max(12,CELL-24);
  for(var r=0;r<R;r++)for(var c=0;c<C;c++){
    var g=grid[r][c],x=c*CELL,y=r*CELL;
    ctx.fillStyle=g.open?'#1a2440':'#232f55';
    ctx.fillRect(x+1,y+1,CELL-2,CELL-2);
    ctx.strokeStyle='rgba(255,255,255,.06)';ctx.strokeRect(x+1,y+1,CELL-2,CELL-2);
    if(g.open&&g.n>0){
      ctx.fillStyle=numC[g.n];ctx.font='bold '+fs+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(g.n,x+CELL/2,y+CELL/2+1);
    }else if(g.open&&g.mine){
      drawIcon(ctx,'bomb',x+CELL/2,y+CELL/2+1,Math.max(12,fs),'#ff6b8b','center');
    }else if(g.flag){
      drawIcon(ctx,'flag',x+CELL/2,y+CELL/2+1,Math.max(12,fs),'#ffd166','center');
    }
  }
}
</script>
</body>
</html>
