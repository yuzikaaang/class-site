<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>涂鸦跳跃 · 25级05班</title>
<style>
  *{box-sizing:border-box}
  /* 移动端：锁定视口不滚动（原布局总高超过手机视口，触摸时页面被拖动/数字宽度抖动 → “鬼畜”） */
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
  body{background:linear-gradient(170deg,#0d1024,#161a3a);color:#e9ecff;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:calc(6px + env(safe-area-inset-top)) 8px calc(6px + env(safe-area-inset-bottom));
    gap:6px;height:100dvh;min-height:100vh;touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  .topbar{display:flex;align-items:center;gap:8px;width:100%;max-width:420px;font-size:13px}
  a.back{color:#e9ecff;opacity:.7;text-decoration:none;font-size:13px;padding:8px 10px;margin:-8px -10px -8px -10px}
  .brand{font-weight:800;font-size:14px}
  .badge{margin-left:auto;font-size:11px;padding:4px 9px;border-radius:999px;
    background:rgba(70,224,200,.14);color:#46e0c8;white-space:nowrap}
  #wrap{position:relative}
  canvas{width:100%;height:100%;background:linear-gradient(180deg,#141a3a,#1d2b5e 60%,#2b1f55);border-radius:16px;display:block;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:rgba(10,12,30,.74);border-radius:16px;text-align:center;padding:20px;z-index:3}
  .ov.hidden{display:none}
  .ov h2{margin:0;font-size:24px;color:#ffcf7a}
  .ov p{margin:2px 0;font-size:13px;color:#9db1ff;line-height:1.7}
  .ov button{border:none;border-radius:14px;padding:13px 30px;font-size:16px;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,#46e0c8,#2fd6a8);color:#0b0f22;box-shadow:0 8px 20px rgba(70,224,200,.3)}
  .ov button:active{transform:scale(.95)}
  .tip{font-size:11px;opacity:.5;text-align:center;line-height:1.5}
  .ctrl{display:flex;gap:12px;width:100%;max-width:420px;justify-content:center}
  .ctrl button{flex:1;max-width:180px;border:none;border-radius:16px;padding:15px 0;font-size:20px;font-weight:900;cursor:pointer;
    color:#0b0f22;background:linear-gradient(135deg,#7c83ff,#4a6cf7);box-shadow:0 8px 22px rgba(74,108,247,.35);user-select:none;-webkit-user-select:none;touch-action:none}
  .ctrl button:active{transform:scale(.94)}
  .ctrl button.right{background:linear-gradient(135deg,#46e0c8,#2fd6a8);box-shadow:0 8px 22px rgba(47,214,168,.35)}
  @media (max-height:680px){ .tip{display:none} .ctrl button{padding:12px 0;font-size:18px} }
  /* 达标发券弹窗 */
  .reward-mask{display:none;position:fixed;inset:0;background:rgba(10,12,30,.78);z-index:999;
    align-items:center;justify-content:center;padding:20px}
  .reward-mask.show{display:flex}
  .reward-box{background:linear-gradient(160deg,#1a2040,#141936);border:1px solid #2a3550;
    border-radius:22px;padding:26px 22px;max-width:340px;width:100%;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .25s ease}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .reward-emoji{font-size:46px;line-height:1}
  .reward-title{font-size:19px;font-weight:800;color:#ffcf7a;margin:10px 0 4px}
  .reward-sub{font-size:13px;color:#9db1ff;margin-bottom:14px}
  .coupon-code{font-size:22px;font-weight:800;letter-spacing:2px;color:#46e0c8;
    background:#0b0f1f;border:1px dashed #2f5f5a;border-radius:12px;padding:12px 8px;margin:6px 0;
    user-select:all;-webkit-user-select:all;word-break:break-all}
  .reward-tip{font-size:12px;color:#7a869a;line-height:1.6;text-align:left;margin:10px 0 4px}
  .reward-btns{display:flex;gap:10px;margin-top:12px}
  .reward-btns button{flex:1;border:none;border-radius:12px;padding:11px 0;font-size:14px;
    font-weight:700;cursor:pointer}
  .btn-copy{background:#7c83ff;color:#fff}
  .btn-goto{background:#46e0c8;color:#0b0f1f;text-decoration:none;display:flex;align-items:center;justify-content:center;font-weight:800}
  .btn-close{background:#242b4a;color:#9db1ff}
  .reward-tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;
    background:rgba(124,131,255,.15);color:#a8afff;margin-top:8px}
  .reward-tag.err{background:rgba(255,107,139,.15);color:#ff9db4}
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="../">← 返回</a>
  <span class="brand">🦘 涂鸦跳跃</span>
  <span class="badge">🎟 10000 高得券</span>
</div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div class="ov" id="startOv">
    <h2>涂鸦跳跃</h2>
    <p>左右移动让角色不断往上跳<br>踩平台借力 · 弹簧可以弹超高<br>掉下去就结束<br>⏱ 限时 2:00 内跳到 10000 高才能领点歌券</p>
    <button id="startBtn">开始游戏</button>
  </div>

    <h2>😵 掉下去啦</h2>

</div>
<!-- 达标发券弹窗 -->
<div class="reward-mask" id="rewardMask">
  <div class="reward-box">
    <div class="reward-emoji" id="rwEmoji">🎉</div>
    <div class="reward-title" id="rwTitle">跳到 10000 高度！</div>

      <button class="btn-copy" id="rwCopy" onclick="copyCoupon()">复制券码</button>

    </div>

</div>
<!-- 本周已领过提示 -->
<div class="reward-mask" id="claimedMask">
  <div class="reward-box">
    <div class="reward-emoji">🎫</div>
    <div class="reward-title" id="claimedTitle">本周这张券已领过啦</div>
    <div class="reward-sub" id="claimedSub">涂鸦跳跃每周限领一张点歌券<br>下周一 0 点刷新后再来挑战！</div>
    <div class="reward-btns" style="margin-top:16px">
      <button class="btn-copy" onclick="claimContinue()">▶ 继续游戏</button>
      <button class="btn-close" onclick="claimExit()">🚪 退出游戏</button>
    </div>
  </div>
</div>
<!-- 领券人填写（每周首张券需填名字，备注留痕：谁·时间·任务） -->
<div class="reward-mask" id="nameMask">
  <div class="reward-box">
    <div class="reward-emoji">✍️</div>
    <div class="reward-title">填写领券人</div>
    <div class="reward-sub" id="nmTask">领取：涂鸦跳跃 10000 高奖励（每周一张）</div>
    <input type="text" id="nmInput" placeholder="🔍 搜索选择你的名字" maxlength="10" autocomplete="off" onfocus="nmFilter()" oninput="nmFilter()" style="width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid #3a4668;background:#0b0f1f;color:#e9ecff;font-size:15px;text-align:center;margin:8px 0 2px">
    <div id="nmList" style="display:none;margin-top:6px;background:#0b0f1f;border:1px solid #3a4668;border-radius:10px;max-height:170px;overflow-y:auto;text-align:left"></div>
    <div class="reward-tip" id="nmTip" style="text-align:center">从名单里选择你的名字（用于核对本周是否已领过券）</div>
    <div class="reward-btns" style="margin-top:14px">
      <button class="btn-copy" onclick="doClaim()">✅ 确认领券</button>
      <button class="btn-close" onclick="closeName()">取消</button>
    </div>
  </div>
</div>
<div class="ctrl">
  <button id="leftBtn" aria-label="左移">◀ 左</button>
  <button id="rightBtn" class="right" aria-label="右移">右 ▶</button>
</div>
<div class="tip">键盘 ← → 或下方按键移动 · 限时 2:00 内达标才发券（超时仍可继续玩）</div>
<script>
var AC=null;
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f,d,t,v,delay){var c=ac();if(!c)return;var o=c.createOscillator(),g=c.createGain();o.type=t||'square';o.frequency.value=f;var t0=c.currentTime+(delay||0);g.gain.setValueAtTime(v||0.05,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+(d||0.08));o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+(d||0.08)+0.02);}
var snd={hop:function(){tone(600,0.05,'triangle',0.05);},spring:function(){tone(900,0.08,'sine',0.07);setTimeout(function(){tone(1200,0.1,'sine',0.05);},60);},fall:function(){tone(300,0.15,'sawtooth',0.06);setTimeout(function(){tone(140,0.3,'sawtooth',0.06);},120);}};

var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=420,H=640;
cv.width=W;cv.height=H;
var PX=30,PY=46,PW=70;   // 平台尺寸
var plats,px,py,vy,sc,hi,playing,camY,dirL,dirR,rewardHandled;
var playMs=0,lastAt=0,overtime=false,leftSec=0;   // 限时领券计时（仅游戏中累加，弹窗/结束暂停时冻结）
rewardHandled=false;
hi=+(localStorage.getItem('doodle_hi')||0);

function reset(){
  playMs=0;lastAt=0;overtime=false;leftSec=REWARD.timeLimit;
  plats=[];
  sc=0; camY=0;   // 必须在生成平台前初始化，否则 diffLvl() 读到 undefined 让平台 x 变 NaN、角色落不上台阶
  var x0=W/2-PW/2;
  for(var i=0;i<14;i++){
    var spring=(Math.random()<springChance());
    plats.push({x:x0,y:H-PY-(H/14)*i,spring:spring,broke:false});
    x0=djNextPlatX(x0);
  }
  px=W/2-PX/2;py=H-PY-PY;vy=-9;playing=true;rewardHandled=false;
  hideOv();requestAnimationFrame(tick);
}
function hideOv(){document.getElementById('startOv').classList.add('hidden');document.getElementById('overOv').classList.add('hidden');}
function tick(){
  if(!playing){draw();return;}
  /* 限时计时：按真实游戏时长累加（tick 只在游戏中运行，弹窗暂停/掉落结束自动冻结） */
  var now=Date.now();
  if(lastAt) playMs+=(now-lastAt);
  lastAt=now;
  if(!overtime){
    var left=REWARD.timeLimit-playMs/1000;
    if(left<=0){ left=0; overtime=true; }
    leftSec=left;
  }
  var mv=(dirR?1:0)-(dirL?1:0);
  px+=mv*5.6;
  if(px<0)px=0;if(px>W-PX)px=W-PX;
  vy+=gravity();
  py+=vy;
  // 平台碰撞（仅在向下时）
  if(vy>0){
    for(var i=0;i<plats.length;i++){
      var p=plats[i];
      if(!p.broke&&px+PX>p.x&&px<p.x+PW&&py+PY>p.y&&py+PY<p.y+16){
        if(p.spring){vy=-springVel();snd.spring();}
        else{vy=-jumpVel();snd.hop();}
        py=p.y-1;
        break;
      }
    }
  }
  // 最高平台上方生成新平台（x 限制在上一个平台左右 60~160px，保证跳得过去）
  var topY=plats[plats.length-1].y;
  if(py<topY+PY){
    var y=topY-platGapY();
    plats.push({x:djNextPlatX(plats[plats.length-1].x),y:y,spring:(Math.random()<springChance()),broke:false});
  }
  // 移除下方平台
  while(plats.length>0&&plats[0].y>camY+H+80)plats.splice(0,1);
  // 高度与镜头
  if(py<camY+PY){
    sc+=Math.round((camY+PY-py)/10)*10;
    camY=py-PY;
    /* 达标发券：限时内达标才弹窗领券；超时后达标静默跳过（不弹窗、不打扰，可继续玩） */
    if(sc>=REWARD.threshold&&!rewardHandled){rewardHandled=true;
      if(!overtime) showNameAsk();}
    if(sc>hi){hi=sc;try{localStorage.setItem('doodle_hi',hi);}catch(e){}}
  }
  // 掉落
  if(py>camY+H+60){
    playing=false;snd.fall();
    document.getElementById('ovInfo').textContent='高度 '+sc+(sc>=hi&&sc>0?'　🏆 新纪录！':'　最高 '+hi);
    document.getElementById('overOv').classList.remove('hidden');
  }
  draw();requestAnimationFrame(tick);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  // 星星背景
  ctx.fillStyle='rgba(255,255,255,.12)';
  for(var i=0;i<26;i++){
    var sx=(i*89+17)%W,sy=(camY+i*73+29)%(H+200)-100;
    ctx.fillRect(sx,sy,2,2);
  }
  // 平台
  for(var i=0;i<plats.length;i++){
    var p=plats[i];
    if(p.y<camY-30||p.y>camY+H+30)continue;
    var sy=p.y-camY;
    if(p.spring){
      ctx.fillStyle='#ff6b8b';ctx.fillRect(p.x,sy,PW,10);
      ctx.fillStyle='#ffcf7a';ctx.fillRect(p.x+2,sy-6,PW-4,6);
    }else{
      ctx.fillStyle='#2fd6a8';ctx.fillRect(p.x,sy,PW,12);
      ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(p.x+4,sy,PW-8,3);
    }
  }
  // 角色
  var bx=px+15,by=py-camY;
  ctx.fillStyle='#ffd93d';ctx.fillRect(bx-13,by,26,30);
  ctx.fillStyle='#e9ecff';ctx.fillRect(bx+2,by+4,7,6);
  ctx.fillStyle='#222';ctx.fillRect(bx+5,by+6,2,2);
  ctx.fillStyle='#ff7b3d';ctx.fillRect(bx-13,by+20,26,10);
  ctx.fillStyle='#7c83ff';ctx.fillRect(bx-15,by+30,8,8);
  ctx.fillStyle='#7c83ff';ctx.fillRect(bx+7,by+30,8,8);
  drawHUD();
}
/* HUD 画在 canvas 内（不再每帧改 DOM 文本，避免移动端重排抖动） */
function fmtTime(s){ var t=Math.max(0,Math.ceil(s)); var m=Math.floor(t/60),ss=t%60; return m+':'+(ss<10?'0':'')+ss; }  /* 向上取整：开局显示满值 2:00 而不是 1:59 */
function drawHUD(){
  ctx.save();
  ctx.fillStyle='rgba(8,11,26,.5)';
  if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(8,8,W-16,36,12); ctx.fill(); }
  else{ ctx.fillRect(8,8,W-16,36); }
  ctx.textBaseline='middle';
  /* 高度（等宽数字，位数变化不抖动） */
  ctx.font='bold 19px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
  ctx.textAlign='left'; ctx.fillStyle='#ffcf7a';
  ctx.fillText('↑'+sc,20,27);
  /* 最高纪录 */
  ctx.font='12px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='center'; ctx.fillStyle='rgba(157,177,255,.85)';
  ctx.fillText('最高 '+hi,W/2+8,27);
  /* 限时倒计时 */
  ctx.font='bold 16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
  ctx.textAlign='right';
  ctx.fillStyle= overtime?'#ff9db4' : (leftSec<=30?'#ffcf7a':'#8fe9ff');
  ctx.fillText((overtime?'⏱ 超时':'⏱ '+fmtTime(leftSec)),W-18,27);
  /* 超时说明（仅文字提示，不弹窗打断游戏） */
  if(overtime){
    ctx.font='11px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign='center'; ctx.fillStyle='rgba(255,157,180,.9)';
    ctx.fillText('本局已超时，达标不再发券 · 重开一局可再挑战',W/2,58);
  }
  ctx.restore();
}
/* 画布自适应：按可用空间缩放，保证整页不超出视口（不滚动） */
function fit(){
  var wrap=document.getElementById('wrap');
  var topbar=document.querySelector('.topbar'), ctrl=document.querySelector('.ctrl'), tip=document.querySelector('.tip');
  var used=(topbar?topbar.offsetHeight:32)+(ctrl?ctrl.offsetHeight:56)+(tip&&tip.offsetHeight?tip.offsetHeight:0)+34;
  var h=window.innerHeight-used, w=window.innerWidth-16;
  var cw=Math.min(420,w,h*W/H);
  cw=Math.max(200,cw);
  wrap.style.width=Math.round(cw)+'px';
  wrap.style.height=Math.round(cw*H/W)+'px';
}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',function(){ setTimeout(fit,150); });
if(window.visualViewport) window.visualViewport.addEventListener('resize',fit);
fit();
document.addEventListener('keydown',function(e){ if(e.code==='ArrowLeft')dirL=true; if(e.code==='ArrowRight')dirR=true; });
document.addEventListener('keyup',function(e){ if(e.code==='ArrowLeft')dirL=false; if(e.code==='ArrowRight')dirR=false; });
/* 虚拟按键：按住左/右移动，松开停止（替代原来的“按住屏幕半边滑动”） */
function hold(id,on){
  var el=document.getElementById(id);
  el.addEventListener('pointerdown',function(e){e.preventDefault();on();});
  el.addEventListener('pointerup',function(e){e.preventDefault();dirL=dirR=false;});
  el.addEventListener('pointerleave',function(e){dirL=dirR=false;});
  el.addEventListener('pointercancel',function(e){dirL=dirR=false;});
}
hold('leftBtn',function(){dirL=true;});
hold('rightBtn',function(){dirR=true;});
document.getElementById('startBtn').addEventListener('click',function(){ac();reset();});
document.getElementById('reBtn').addEventListener('click',function(){reset();});

/* 难度曲线：每 500 分升一档
   重力平缓上升并设上限；跳跃初速度随档位同步增强，确保每档“完美垂直跳”都能越过上方平台（留≥12px余量）。
   难度主要通过水平间距增大、弹簧变少来体现，而非靠重力把人压死导致跳不上台阶。 */
function diffLvl(){ return Math.floor(sc/500); }
function gravity(){ return 0.42 + Math.min(diffLvl()*0.010, 0.12); }
function jumpVel(){ return 10.5 + Math.min(diffLvl()*0.16, 3.0); }
function springVel(){ return 17 + Math.min(diffLvl()*0.12, 2.0); }
function platGapY(){ return 60 + Math.min(diffLvl()*1.5, 16); }
function springChance(){ return Math.max(0.14 - diffLvl()*0.008, 0.06); }
function platGapX(){ return (60 + Math.min(diffLvl()*6, 60)) + Math.random()*100; }

/* 平台水平位置：限制在上一个平台左右 60~160px（跳远极限约 200px，留足余量，避免左右两极端跳不过去） */
function djNextPlatX(prevX){
  var gap=platGapX();
  var x=prevX+(Math.random()<0.5?-1:1)*gap;
  if(x<0)x=0;
  if(x>W-PW)x=W-PW;
  return x;
}

/* ===== 周常点歌券奖励（每周一刷新，每款游戏每周一张） ===== */
var REWARD = { game:'doodle', title:'跳到 10000 高度！', sub:'获得一张点歌券（去点歌平台点歌时使用）', note:'涂鸦跳跃10000高奖励', threshold:10000, timeLimit:120 };  /* timeLimit：120 秒 = 2:00，超时后达标不发券（仍可继续玩，不弹窗） */
var _CPN_MASK='vgate25coupon0801';
var _CPN_ENC='000f14163a0251055b41155e5f56010605415653165d5406055b47155b57060a5552415f57';
function _cpnDec(){ var s=''; for(var i=0;i<_CPN_ENC.length;i+=2){ s+=String.fromCharCode(parseInt(_CPN_ENC.substr(i,2),16)^_CPN_MASK.charCodeAt((i/2)%_CPN_MASK.length)); } return s; }
var VOICEHUB_COUPON={ enabled:true, url:'https://xsyzc2505.dpdns.org/api/open/card-codes', method:'POST', token:_cpnDec(), tokenField:'x-api-key', tokenPrefix:'', respCodeKey:'data.cardCodes.0.code' };
function weekKey(){ var d=new Date(), day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
/* 全班名单：优先读站点写入的 cls_class_list，缺失时用内置名单 */
var CLASS_LIST=["樊张凯","余子轩","余倩","韩文韬","雷其桐","胡一博","邹亦汐","吴俊驰","刘子豪","刘佳欣","张炜","刘竹琳","李宇迦","梁宇翔","车宇辰","陈旭辉","孙卢茹","余子康","吴婷婷","范名扬","周雄辉","杨梓俊","卢垚明","包铠恺","车正楠","王馨妍","梁子君","刘浚轩","武圣钦","卢拓琳","卢伟琪","兰静怡","吴伟","戴云聪","石可妍","朱书妍","刘宇焕","梁康煜","樊筱雅","李博涛","桂祺","杜语熙","刘名强","吴欣瑶","郑琪琪","冷宇航","卢煜","樊宇涵","徐海军","朱俊雅","程晶晶","韩魏斌","冷紫涵","祝智勇","孙妍妍","胡婉怡","石芸熙","刘雨馨","梁咏佳","冷伟明","冷思敏"];
function classList(){ try{ var l=JSON.parse(localStorage.getItem('cls_class_list')||'null'); if(Array.isArray(l)&&l.length) return l; }catch(e){} return CLASS_LIST; }
var _claimName='';
/* 领券台账：按 名字+本周+游戏 核对（防清缓存/换名字重复领，后台为准） */
function ledgerLoad(){ try{ return JSON.parse(localStorage.getItem('cls_coupon_ledger')||'{}'); }catch(e){ return {}; } }
function ledgerHas(name){ var w=weekKey(),L=ledgerLoad(); return !!(L[w]&&L[w][REWARD.game]&&L[w][REWARD.game][name]); }
function ledgerRec(name){ var w=weekKey(),L=ledgerLoad(); return (L[w]&&L[w][REWARD.game]&&L[w][REWARD.game][name])||''; }
function ledgerAdd(name){ var w=weekKey(),L=ledgerLoad(); L[w]=L[w]||{}; L[w][REWARD.game]=L[w][REWARD.game]||{}; L[w][REWARD.game][name]=nowStamp()+' · 自动'; try{ localStorage.setItem('cls_coupon_ledger',JSON.stringify(L)); }catch(e){} }
function escName(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function alreadyClaimed(){ try{ return localStorage.getItem('song_coupon_w_'+REWARD.game)===weekKey(); }catch(e){ return false; } }
/* 本地记录与后台不一致时（站主在后台删了券）：清掉本地记录，允许本周重新领 */
function ledgerDel(name){ var w=weekKey(),L=ledgerLoad(); if(L[w]&&L[w][REWARD.game]&&L[w][REWARD.game][name]){ delete L[w][REWARD.game][name]; try{ localStorage.setItem('cls_coupon_ledger',JSON.stringify(L)); }catch(e){} } }
function clearClaimed(){ try{ localStorage.removeItem('song_coupon_w_'+REWARD.game); }catch(e){} }
function markClaimed(){ try{ localStorage.setItem('song_coupon_w_'+REWARD.game, weekKey()); }catch(e){} }
function pickPath(obj,path){ var ks=String(path||'code').split('.'); for(var i=0;i<ks.length;i++){ if(obj==null)return ''; obj=obj[ks[i]]; } return (typeof obj==='string'||typeof obj==='number')?String(obj):''; }
/* 领券人填写（每周首张券需填名字，备注留痕：谁·时间·任务） */
var _claimName='';
function nowStamp(){
  var d=new Date(),p=function(n){return (n<10?'0':'')+n;};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function showNameAsk(){
  var m=document.getElementById('nameMask'); if(!m) return;
  var sub=document.getElementById('nmTask'); if(sub) sub.textContent='领取：'+REWARD.title+'（每周一张）';
  var inp=document.getElementById('nmInput');
  if(inp){ try{ inp.value=localStorage.getItem('cls_coupon_name')||''; }catch(e){} }
  _claimName=inp?inp.value.trim():'';
  var tip=document.getElementById('nmTip'); if(tip) tip.textContent='从名单里选择你的名字（用于核对本周是否已领过券）';
  var list=document.getElementById('nmList'); if(list) list.style.display='none';
  m.classList.add('show');
}
/* 名字搜索选择（全班名单） */
function nmFilter(){
  var inp=document.getElementById('nmInput'); if(!inp) return;
  var box=document.getElementById('nmList'); if(!box) return;
  var q=(inp.value||'').trim();
  if(q && _claimName && q!==_claimName) _claimName='';
  var list=classList().filter(function(n){ return !q || n.indexOf(q)>=0; });
  if(list.length){ box.style.display='block'; box.innerHTML=list.map(function(n){ return '<div style="padding:8px 12px;cursor:pointer;font-size:14px;color:#e9ecff" onclick="nmPick(this)" data-n="'+escName(n)+'">'+escName(n)+'</div>'; }).join(''); }
  else{ box.style.display='none'; }
}
function nmPick(el){
  _claimName=el.getAttribute('data-n');
  var inp=document.getElementById('nmInput'); if(inp) inp.value=_claimName;
  var box=document.getElementById('nmList'); if(box) box.style.display='none';
  var tip=document.getElementById('nmTip'); if(tip) tip.textContent='✅ 已选择：'+_claimName;
}
function doClaim(){
  var name=_claimName;
  var inp=document.getElementById('nmInput');
  if(!name || classList().indexOf(name)<0){
    if(inp){ inp.style.borderColor='#ff6b8b'; inp.focus(); }
    var tip=document.getElementById('nmTip'); if(tip) tip.textContent='⚠️ 请先从名单里选择你的名字再确认';
    return;
  }
  if(inp) inp.style.borderColor='#3a4668';
  try{ localStorage.setItem('cls_coupon_name', name); }catch(e){}
  closeName();
  /* 本地台账/设备标记说本周领过 → 不直接拒绝，先跟后台核实：
       后台确实有这张券（含已使用）→ 展示原券码并拦住；
       后台查不到（被站主删除）→ 清掉本地记录，允许重新领；
       网络不通查不了 → 保守拦住，提示截图联系管理员。 */
  if(ledgerHas(name)||alreadyClaimed()){
    platformFind(name).then(function(f){
      if(f.found){ showClaimedName(name,f.code,f.status); return; }
      if(f.err){ showClaimedName(name); return; }
      ledgerDel(name); clearClaimed();
      _claimName=name; showReward();
    });
    return;
  }
  _claimName=name;
  showReward();
}
function closeName(){ var m=document.getElementById('nameMask'); if(m) m.classList.remove('show'); }
function claimCoupon(name,cb){
  var cfg=VOICEHUB_COUPON;
  if(window.VOICEHUB_COUPON_OVERRIDE) cfg=window.VOICEHUB_COUPON_OVERRIDE;
  if(cfg.enabled && cfg.url){
    var headers={};
    if(cfg.tokenField==='Authorization'){ headers['Authorization']=(cfg.tokenPrefix||'')+cfg.token; }
    else{ headers[cfg.tokenField]=cfg.token; }
    headers['Content-Type']='application/json';
    var body=JSON.stringify({count:1,prefix:'SONG',length:8,note:(name||"匿名")+" · "+nowStamp()+" · "+REWARD.note});
    fetch(cfg.url,{method:cfg.method||'POST',headers:headers,body:body})
      .then(function(r){ return r.json().catch(function(){ return {code:''}; }); })
      .then(function(j){
        var code=pickPath(j,cfg.respCodeKey);
        if(code){ cb({ok:true,code:code,remote:true}); }
        else{ cb({ok:false,err:'接口返回了但没有识别到券码',remote:true}); }
      })
      .catch(function(e){ cb({ok:false,err:'点歌券服务暂不可用（'+e.message+'）',remote:true}); });
  }else{
    var code='SONG-'+Math.random().toString(36).slice(2,6).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
    setTimeout(function(){ cb({ok:false,err:'发券服务暂未开放，此券码仅作预览（未生效）',code:code,remote:false}); },400);
  }
}
/* 平台查重：本周该名字该游戏是否已有可用券（先查后台，有则直接展示券码，不再生成新券） */
function weekStartMs(){ var d=new Date(); var day=(d.getDay()+6)%7; d.setHours(0,0,0,0); d.setDate(d.getDate()-day); return d.getTime(); }
function platformFind(name){
  return new Promise(function(resolve){
    var cfg=VOICEHUB_COUPON;
    if(window.VOICEHUB_COUPON_OVERRIDE) cfg=window.VOICEHUB_COUPON_OVERRIDE;
    if(!(cfg.enabled&&cfg.url)){ resolve({found:false}); return; }
    var headers={};
    if(cfg.tokenField==='Authorization'){ headers['Authorization']=(cfg.tokenPrefix||'')+cfg.token; }
    else{ headers[cfg.tokenField]=cfg.token; }
    fetch(cfg.url.split('?')[0]+'?page=1&limit=100',{headers:headers})
      .then(function(r){ return r.json().catch(function(){ return {}; }); })
      .then(function(j){
        var list=(j&&j.data&&j.data.cardCodes)||[];
        var w0=weekStartMs();
        for(var i=0;i<list.length;i++){
          var c=list[i];
          if(!c) continue;   /* 不再限定 status==='AVAILABLE'：券被核销(已使用)同样算本周已领过，避免用掉后再领一张 */
          var t=new Date(c.createdAt); if(isNaN(t.getTime())) continue;
          if(t.getTime()<w0) continue;
          var note=String(c.note||'');
          if(note.split(' · ')[0].trim()===name && note.indexOf(REWARD.note)>=0){ resolve({found:true,code:c.code,status:c.status}); return; }
        }
        resolve({found:false});
      })
      .catch(function(){ resolve({found:false,err:'net'}); });
  });
}
function showReward(){
  var mask=document.getElementById('rewardMask');
  document.getElementById('rwTitle').textContent=REWARD.title;
  document.getElementById('rwSub').textContent=REWARD.sub;
  document.getElementById('rwCode').textContent='请稍候…';
  document.getElementById('rwTip').textContent='';
  var tag=document.getElementById('rwTag'); tag.className='reward-tag'; tag.textContent='正在核对本周领券记录…';
  mask.classList.add('show');
  platformFind(_claimName).then(function(f){
    if(f.found){
      document.getElementById('rwCode').textContent=f.code;
      ledgerAdd(_claimName); markClaimed();
      tag.className='reward-tag'; var _stx=(f.status==='REDEEMED')?'已核销':((f.status&&f.status!=='AVAILABLE')?'已使用':''); tag.textContent=_stx?('✅ 本周这张券你已领过（'+_stx+'），下周一 0 点刷新'):'✅ 本周已在平台领过，券码已找回（无需重新生成）';
      document.getElementById('rwTip').textContent='1. 复制上面的券码\n2. 打开「点歌平台」\n3. 点歌时把券码粘贴进去';
      window.__lastCoupon=f.code;
      return;
    }
    claimCoupon(_claimName,function(res){
      document.getElementById('rwCode').textContent=res.code||'生成失败';
      if(res.ok && res.remote){
        ledgerAdd(_claimName); markClaimed();
        tag.className='reward-tag'; tag.textContent='✅ 已在点歌平台登记，复制券码去点歌吧';
        document.getElementById('rwTip').textContent='1. 复制上面的券码\n2. 打开「点歌平台」\n3. 点歌时把券码粘贴进去';
        window.__lastCoupon=res.code;
      }else{
        tag.className='reward-tag err';
        tag.textContent=res.remote ? ('⚠️ '+res.err) : '⚠️ 发券服务暂未开放（演示券码，未生效）';
        document.getElementById('rwTip').textContent='发券失败：请截图本局通关画面发给管理员（站主），管理员核对后会手动补发点歌券';
        window.__lastCoupon=res.code||'';
      }
    });
  });
}
function closeReward(){ document.getElementById('rewardMask').classList.remove('show'); }
/* 已领过：暂停游戏 + 选择继续/退出（按名字核对后显示动态文案） */
function showClaimedName(name,code,status){
  var t=document.getElementById('claimedTitle'); if(t) t.textContent='本周已领过啦';
  var s=document.getElementById('claimedSub');
  if(s){
    /* 平台实测：核销后 status='REDEEMED'（不是 USED）；其余非 AVAILABLE 状态（如 LOCKED）按已使用处理 */
    var usedTxt=(status==='REDEEMED')?'已核销':((status&&status!=='AVAILABLE')?'已使用':'');
    var used=!!usedTxt;
    var html='<b style="color:#46e0c8">'+escName(name)+'</b> 本周已在「'+escName(REWARD.title)+'」领过点歌券<br>';
    if(code) html+='你的券码：<b style="color:#ffcf7a">'+escName(code)+'</b>'+(usedTxt?('（'+usedTxt+'）'):'（仍可用）')+'<br>';
    html+='领券时间：'+(ledgerRec(name)||'—')+'<br>下周一 0 点刷新后再来挑战！';
    s.innerHTML=html;
  }
  var m=document.getElementById('claimedMask'); if(m) m.classList.add('show');
  playing=false;
}
function showClaimedDevice(){
  var t=document.getElementById('claimedTitle'); if(t) t.textContent='本机本周已领过';
  var s=document.getElementById('claimedSub'); if(s){ s.innerHTML='这台设备本周已在「'+escName(REWARD.title)+'」领过点歌券<br>如果没收到券码，请截图本局通关记录发给管理员（站主）手动补发'; }
  var m=document.getElementById('claimedMask'); if(m) m.classList.add('show');
  playing=false;
}
function showClaimed(){ var m=document.getElementById('claimedMask'); if(m) m.classList.add('show'); }
function closeClaimed(){ var m=document.getElementById('claimedMask'); if(m) m.classList.remove('show'); }
function pauseForClaimed(){ playing=false; showClaimed(); }
function claimContinue(){ closeClaimed(); playing=true; lastAt=0; tick(); }  /* 恢复时丢弃暂停时长，避免误判超时 */
function claimExit(){ closeClaimed(); playing=false; document.getElementById('startOv').classList.remove('hidden'); }
function copyCoupon(){
  var c=window.__lastCoupon||document.getElementById('rwCode').textContent;
  var done=function(){ document.getElementById('rwCopy').textContent='已复制 ✓'; setTimeout(function(){document.getElementById('rwCopy').textContent='复制券码';},1500); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(c).then(done).catch(function(){ fallbackCopy(c);done(); }); }
  else{ fallbackCopy(c);done(); }
}
function fallbackCopy(t){ var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
document.getElementById('rewardMask').addEventListener('click',function(e){ if(e.target.id==='rewardMask') closeReward(); });
leftSec=REWARD.timeLimit;   /* 首屏（未开局）倒计时显示满值 */
</script>
