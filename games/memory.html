<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>记忆翻牌 · 25级05班</title>
<style>
  :root{--bg:#0f1226;--fg:#e9ecff;--accent:#7c83ff}
  *{box-sizing:border-box}html,body{margin:0}
  body{background:linear-gradient(160deg,#0f1226,#161a3a);color:var(--fg);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:14px;gap:10px;min-height:100vh}
  a.back{color:var(--fg);opacity:.7;text-decoration:none;font-size:14px;align-self:flex-start}
  h1{font-size:18px;margin:2px 0}
  .score{font-size:15px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(86vw,320px)}
  .card{aspect-ratio:1;border-radius:12px;background:#1b2432;display:flex;align-items:center;justify-content:center;
    font-size:30px;cursor:pointer;transform-style:preserve-3d;transition:transform .25s;user-select:none}
  .card.flip{background:#2a3550;transform:rotateY(180deg)}
  .card .face{position:absolute;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;width:100%;height:100%}
  .card .back{font-size:24px;color:var(--accent);transform:rotateY(180deg)}
  .hint{font-size:12px;opacity:.6}
</style>


<style>.licon{display:inline-block;flex:none;vertical-align:-2px}</style>
<script>
/* =====================================================
   图标系统：Lucide（lucide-static v1.48.0）—— 本页按需内联用到的图标
   全站统一只用 Lucide 一套，不混库、不使用 emoji 作为功能图标。
   ===================================================== */
var LUCIDE_ICONS={"arrow-left":"<path d=\"m12 19-7-7 7-7\"/><path d=\"M19 12H5\"/>","circle":"<circle cx=\"12\" cy=\"12\" r=\"10\"/>","diamond":"<path d=\"M2.7 10.3a2.41 2.41 0 0 0 0 3.41l7.59 7.59a2.41 2.41 0 0 0 3.41 0l7.59-7.59a2.41 2.41 0 0 0 0-3.41l-7.59-7.59a2.41 2.41 0 0 0-3.41 0Z\"/>","heart":"<path d=\"M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5\"/>","hexagon":"<path d=\"M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z\"/>","layers":"<path d=\"M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z\"/><path d=\"M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12\"/><path d=\"M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17\"/>","octagon":"<path d=\"M2.586 16.726A2 2 0 0 1 2 15.312V8.688a2 2 0 0 1 .586-1.414l4.688-4.688A2 2 0 0 1 8.688 2h6.624a2 2 0 0 1 1.414.586l4.688 4.688A2 2 0 0 1 22 8.688v6.624a2 2 0 0 1-.586 1.414l-4.688 4.688a2 2 0 0 1-1.414.586H8.688a2 2 0 0 1-1.414-.586z\"/>","party-popper":"<path d=\"M5.8 11.3 2 22l10.7-3.79\"/><path d=\"M4 3h.01\"/><path d=\"M22 8h.01\"/><path d=\"M15 2h.01\"/><path d=\"M22 20h.01\"/><path d=\"m22 2-2.24.75a2.9 2.9 0 0 0-1.96 3.12c.1.86-.57 1.63-1.45 1.63h-.38c-.86 0-1.6.6-1.76 1.44L14 10\"/><path d=\"m22 13-.82-.33c-.86-.34-1.82.2-1.98 1.11c-.11.7-.72 1.22-1.43 1.22H17\"/><path d=\"m11 2 .33.82c.34.86-.2 1.82-1.11 1.98C9.52 4.9 9 5.52 9 6.23V7\"/><path d=\"M11 13c1.93 1.93 2.83 4.17 2 5-.83.83-3.07-.07-5-2-1.93-1.93-2.83-4.17-2-5 .83-.83 3.07.07 5 2Z\"/>","square":"<rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\"/>","star":"<path d=\"M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z\"/>","triangle":"<path d=\"M13.73 4a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z\"/>"};
var EMOJI_ICON_MAP={"🃏":"layers","🍎":"circle","🍌":"square","🍇":"triangle","🍓":"star","🍑":"heart","🍒":"hexagon","🥝":"octagon","🍉":"diamond","🎉":"party-popper","←":"arrow-left"};
function iconSvg(name, size, extra){
  var s=size||16, e=extra||'';
  var inner=LUCIDE_ICONS[name];
  if(!inner) return '';
  return '<svg class="licon" xmlns="http://www.w3.org/2000/svg" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" '
    + 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" '
    + 'style="width:'+s+'px;height:'+s+'px;vertical-align:-2px;flex:none;'+e+'" aria-hidden="true">' + inner + '</svg>';
}
var EMOJI_RE=new RegExp('('+Object.keys(EMOJI_ICON_MAP).sort(function(a,b){return b.length-a.length;})
  .map(function(c){return c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).join('|')+')\\uFE0F?','g');
function emojiIconName(ch){ var k=ch.replace(/\uFE0F/g,''); return EMOJI_ICON_MAP[k]||EMOJI_ICON_MAP[ch]||''; }
function emojiSvgNode(ch,size){ var b=document.createElement('div'); b.innerHTML=iconSvg(emojiIconName(ch),size||16); return b.firstChild; }
function emojiifyText(node,size){
  var t=node.nodeValue; if(!t) return false;
  EMOJI_RE.lastIndex=0; if(!EMOJI_RE.test(t)) return false; EMOJI_RE.lastIndex=0;
  var frag=document.createDocumentFragment(),last=0,m,ok=false;
  while((m=EMOJI_RE.exec(t))){
    if(!emojiIconName(m[0])) continue;
    if(m.index>last) frag.appendChild(document.createTextNode(t.slice(last,m.index)));
    var sv=emojiSvgNode(m[0],size); if(sv) frag.appendChild(sv);
    last=m.index+m[0].length; ok=true;
    if(m[0].length===0) EMOJI_RE.lastIndex++;
  }
  if(!ok) return false;
  if(last<t.length) frag.appendChild(document.createTextNode(t.slice(last)));
  if(node.parentNode) node.parentNode.replaceChild(frag,node);
  return true;
}
var EMOJI_SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1,NOSCRIPT:1,TITLE:1,SVG:1,IFRAME:1,OPTION:1,SELECT:1};
function emojiify(root){
  root=root||document.body; if(!root) return 0;
  var changed=0,sizeCache={};
  try{
    var tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false),list=[],n;
    while((n=tw.nextNode())){ var p=n.parentNode; if(!p||EMOJI_SKIP[p.nodeName]||!n.nodeValue) continue; list.push(n); }
    for(var i=0;i<list.length;i++){
      var pe=list[i].parentElement,sz=16;
      if(pe){ if(sizeCache[pe.nodeName]===undefined){ try{ var fs=parseFloat(getComputedStyle(pe).fontSize)||15;
          sizeCache[pe.nodeName]=Math.max(12,Math.min(22,Math.round(fs*1.05)));}catch(e){sizeCache[pe.nodeName]=16;} }
        sz=sizeCache[pe.nodeName]; }
      if(emojiifyText(list[i],sz)) changed++;
    }
    changed+=emojiifyPlaceholders(root); changed+=emojiifyOptions(root);
  }catch(e){}
  return changed;
}
/* placeholder 只能放纯文本 → 换成行内 SVG 背景图标 */
function emojiifyPlaceholders(root){
  var ins=[],hit=0; try{ ins=root.querySelectorAll('input[placeholder],textarea[placeholder]'); }catch(e){ return 0; }
  for(var i=0;i<ins.length;i++){
    var el=ins[i]; if(el.getAttribute('data-emo-ico')) continue;
    var ph=el.getAttribute('placeholder')||''; EMOJI_RE.lastIndex=0;
    var m=EMOJI_RE.exec(ph); if(!m||!emojiIconName(m[0])) continue;
    el.setAttribute('data-emo-ico','1');
    el.setAttribute('placeholder', ph.replace(m[0],'').replace(/^\s+/,''));
    try{ var svg=iconSvg(emojiIconName(m[0]),16,'color:#9aa3b2');
      el.style.backgroundImage='url("data:image/svg+xml;utf8,'+encodeURIComponent(svg)+'")';
      el.style.backgroundRepeat='no-repeat'; el.style.backgroundPosition='10px center'; el.style.backgroundSize='16px 16px';
      var pl=parseFloat(getComputedStyle(el).paddingLeft)||10; if(pl<34) el.style.paddingLeft='34px'; }catch(e){}
    hit++;
  }
  return hit;
}
/* <option> 内无法内嵌 SVG（HTML 规范限制）→ 去掉图形保留文字 */
function emojiifyOptions(root){
  var opts=[],hit=0; try{ opts=root.querySelectorAll('option'); }catch(e){ return 0; }
  for(var i=0;i<opts.length;i++){ var el=opts[i],t=el.textContent||''; EMOJI_RE.lastIndex=0;
    if(!EMOJI_RE.test(t)) continue; el.textContent=t.replace(EMOJI_RE,'').replace(/^\s+/,''); hit++; }
  return hit;
}
var _emoBusy=false,_emoTimer=null,_emoAgain=false;
function emojiifySoon(){
  if(_emoBusy){ _emoAgain=true; return; }
  if(_emoTimer) return;
  _emoTimer=setTimeout(function(){ _emoTimer=null; if(_emoBusy) return; _emoBusy=true;
    try{ emojiify(document.body); }catch(e){} _emoBusy=false;
    if(_emoAgain){ _emoAgain=false; emojiifySoon(); } },60);
}
function emojiStart(){
  try{ emojiify(document.body); }catch(e){}
  if(window.MutationObserver){ try{ (new MutationObserver(emojiifySoon)).observe(document.body,{childList:true,subtree:true,characterData:true}); }catch(e){} }
  [400,1200,3000].forEach(function(d){ setTimeout(function(){ try{ emojiify(document.body); }catch(e){} },d); });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',emojiStart); else setTimeout(emojiStart,0);
</script>
</head>
<body>
<a class="back" href="../">← 返回班级站</a>
<h1>🃏 记忆翻牌</h1>
<div class="score">步数：<b id="mv">0</b> · 配对：<b id="pairs">0</b>/8</div>
<div class="grid" id="grid"></div>
<div class="hint">翻开两张相同的即可消除，全部配对就赢</div>
<script>
const EMO=['🍎','🍌','🍇','🍓','🍑','🍒','🥝','🍉'];
const grid=document.getElementById('grid');
let deck,first,lock,moves,pairs;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function build(){deck=shuffle(EMO.concat(EMO));grid.innerHTML='';first=null;lock=false;moves=0;pairs=0;
  document.getElementById('mv').textContent=0;document.getElementById('pairs').textContent=0;
  deck.forEach(e=>{const c=document.createElement('div');c.className='card';c.dataset.v=e;
    c.innerHTML='<div class="face back">？</div><div class="face" style="transform:rotateY(180deg)">'+e+'</div>';
    c.onclick=()=>flip(c);grid.appendChild(c);});}
function flip(c){if(lock||c.classList.contains('flip')||c===first)return;c.classList.add('flip');
  if(!first){first=c;return;}
  moves++;document.getElementById('mv').textContent=moves;
  if(first.dataset.v===c.dataset.v){pairs++;document.getElementById('pairs').textContent=pairs;first=null;
    if(pairs===8)setTimeout(()=>alert('全部配对完成！用了 '+moves+' 步 🎉'),200);}
  else{lock=true;setTimeout(()=>{first.classList.remove('flip');c.classList.remove('flip');first=null;lock=false;},650);}}
build();
</script>
</body>
</html>
