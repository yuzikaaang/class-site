<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>记忆翻牌 · 25级05班</title>
<style>
  :root{--bg:#0f1226;--fg:#e9ecff;--accent:#7c83ff}
  *{box-sizing:border-box}html,body{margin:0}
  body{background:linear-gradient(160deg,#0f1226,#161a3a);color:var(--fg);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:14px;gap:10px;min-height:100vh}
  a.back{color:var(--fg);opacity:.7;text-decoration:none;font-size:14px;align-self:flex-start}
  h1{font-size:18px;margin:2px 0}
  .score{font-size:15px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(86vw,320px)}
  .card{aspect-ratio:1;border-radius:12px;background:#1b2432;display:flex;align-items:center;justify-content:center;
    font-size:30px;cursor:pointer;transform-style:preserve-3d;transition:transform .25s;user-select:none}
  .card.flip{background:#2a3550;transform:rotateY(180deg)}
  .card .face{position:absolute;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;width:100%;height:100%}
  .card .back{font-size:24px;color:var(--accent);transform:rotateY(180deg)}
  .hint{font-size:12px;opacity:.6}
</style>
</head>
<body>
<a class="back" href="../">← 返回班级站</a>
<h1>🃏 记忆翻牌</h1>
<div class="score">步数：<b id="mv">0</b> · 配对：<b id="pairs">0</b>/8</div>
<div class="grid" id="grid"></div>
<div class="hint">翻开两张相同的即可消除，全部配对就赢</div>
<script>
const EMO=['🍎','🍌','🍇','🍓','🍑','🍒','🥝','🍉'];
const grid=document.getElementById('grid');
let deck,first,lock,moves,pairs;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function build(){deck=shuffle(EMO.concat(EMO));grid.innerHTML='';first=null;lock=false;moves=0;pairs=0;
  document.getElementById('mv').textContent=0;document.getElementById('pairs').textContent=0;
  deck.forEach(e=>{const c=document.createElement('div');c.className='card';c.dataset.v=e;
    c.innerHTML='<div class="face back">？</div><div class="face" style="transform:rotateY(180deg)">'+e+'</div>';
    c.onclick=()=>flip(c);grid.appendChild(c);});}
function flip(c){if(lock||c.classList.contains('flip')||c===first)return;c.classList.add('flip');
  if(!first){first=c;return;}
  moves++;document.getElementById('mv').textContent=moves;
  if(first.dataset.v===c.dataset.v){pairs++;document.getElementById('pairs').textContent=pairs;first=null;
    if(pairs===8)setTimeout(()=>alert('全部配对完成！用了 '+moves+' 步 🎉'),200);}
  else{lock=true;setTimeout(()=>{first.classList.remove('flip');c.classList.remove('flip');first=null;lock=false;},650);}}
build();
</script>
</body>
</html>
