<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>贪吃蛇 · 25级05班</title>
<style>
  :root{--bg:#0f1226;--fg:#e9ecff;--accent:#7c83ff;--food:#46e0c8}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:linear-gradient(160deg,#0f1226,#161a3a);color:var(--fg);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:14px;gap:8px;min-height:100vh}
  a.back{color:var(--fg);opacity:.7;text-decoration:none;font-size:14px;align-self:flex-start}
  h1{font-size:18px;margin:2px 0}
  .score{font-size:15px}
  canvas{background:#0b0f1f;border-radius:14px;box-shadow:0 8px 25px rgba(0,0,0,.4);max-width:92vw;touch-action:none}
  .hint{font-size:12px;opacity:.6}
</style>
</head>
<body>
<a class="back" href="../">← 返回班级站</a>
<h1>🐍 贪吃蛇</h1>
<div class="score">得分：<b id="sc">0</b> · 最高：<b id="hi">0</b></div>
<canvas id="cv" width="320" height="320"></canvas>
<div class="hint">方向键 / 在屏幕上滑动控制方向</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const N=20,CELL=cv.width/N;
let snake,dir,food,sc,hi,timer,over;
hi=+(localStorage.getItem('snake_hi')||0);document.getElementById('hi').textContent=hi;
function place(){food={x:(Math.random()*N)|0,y:(Math.random()*N)|0};}
function draw(){
  ctx.fillStyle='#0b0f1f';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#46e0c8';ctx.fillRect(food.x*CELL+2,food.y*CELL+2,CELL-4,CELL-4);
  ctx.fillStyle=over?'#ff6b8b':'#7c83ff';
  snake.forEach(s=>ctx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2));
  if(over){ctx.fillStyle='#fff';ctx.font='22px sans-serif';ctx.textAlign='center';ctx.fillText('游戏结束 · 点屏重来',cv.width/2,cv.height/2);}
}
function loop(){
  if(over)return;
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){over=true;draw();return;}
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){sc++;document.getElementById('sc').textContent=sc;
    if(sc>hi){hi=sc;localStorage.setItem('snake_hi',hi);document.getElementById('hi').textContent=hi;}place();}
  else snake.pop();
  draw();timer=setTimeout(loop,110);
}
function reset(){clearTimeout(timer);snake=[{x:10,y:10},{x:9,y:10}];dir={x:1,y:0};place();sc=0;over=false;
  document.getElementById('sc').textContent=0;loop();}
document.addEventListener('keydown',e=>{const k=e.key;
  if(k==='ArrowUp'&&dir.y===0)dir={x:0,y:-1};
  else if(k==='ArrowDown'&&dir.y===0)dir={x:0,y:1};
  else if(k==='ArrowLeft'&&dir.x===0)dir={x:-1,y:0};
  else if(k==='ArrowRight'&&dir.x===0)dir={x:1,y:0};});
let ts=null;
cv.addEventListener('touchstart',e=>{if(over){reset();return;}ts={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
cv.addEventListener('touchmove',e=>{if(!ts)return;const t=e.touches[0];const dx=t.clientX-ts.x,dy=t.clientY-ts.y;
  if(Math.abs(dx)>Math.abs(dy)){if(dx>0&&dir.x===0)dir={x:1,y:0};else if(dx<0&&dir.x===0)dir={x:-1,y:0};}
  else{if(dy>0&&dir.y===0)dir={x:0,y:1};else if(dy<0&&dir.y===0)dir={x:0,y:-1};}
  ts={x:t.clientX,y:t.clientY};},{passive:true});
reset();
</script>
</body>
</html>
