<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>贪吃蛇 · 25级05班</title>
<style>
  :root{--bg:#0f1226;--fg:#e9ecff;--accent:#7c83ff;--food:#46e0c8}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:linear-gradient(160deg,#0f1226,#161a3a);color:var(--fg);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:14px;gap:8px;min-height:100vh}
  a.back{color:var(--fg);opacity:.7;text-decoration:none;font-size:14px;align-self:flex-start}
  h1{font-size:18px;margin:2px 0}
  .score{font-size:15px}
  canvas{background:#0b0f1f;border-radius:14px;box-shadow:0 8px 25px rgba(0,0,0,.4);max-width:92vw;touch-action:none}
  .hint{font-size:12px;opacity:.6}
  /* 虚拟方向键（替代滑动） */
  .dpad{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:8px;
    user-select:none;-webkit-user-select:none;touch-action:none}
  .dpad-row{display:flex;gap:12px}
  .dpad-btn{width:62px;height:62px;border-radius:18px;border:none;cursor:pointer;
    background:linear-gradient(160deg,#2a3550,#20294a);color:#9db1ff;font-size:20px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
    touch-action:none;-webkit-tap-highlight-color:transparent;outline:none}
  .dpad-btn:active{background:#4a6cf7;color:#fff;transform:scale(.93)}
  @media(max-width:480px){.dpad-btn{width:72px;height:72px;font-size:24px}}
  /* 达标发券弹窗 */
  .reward-mask{display:none;position:fixed;inset:0;background:rgba(10,12,30,.78);z-index:999;
    align-items:center;justify-content:center;padding:20px}
  .reward-mask.show{display:flex}
  .reward-box{background:linear-gradient(160deg,#1a2040,#141936);border:1px solid #2a3550;
    border-radius:22px;padding:26px 22px;max-width:340px;width:100%;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .25s ease}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .reward-emoji{font-size:46px;line-height:1}
  .reward-title{font-size:19px;font-weight:800;color:#ffcf7a;margin:10px 0 4px}
  .reward-sub{font-size:13px;color:#9db1ff;margin-bottom:14px}
  .coupon-code{font-size:22px;font-weight:800;letter-spacing:2px;color:#46e0c8;
    background:#0b0f1f;border:1px dashed #2f5f5a;border-radius:12px;padding:12px 8px;margin:6px 0;
    user-select:all;-webkit-user-select:all;word-break:break-all}
  .reward-tip{font-size:12px;color:#7a869a;line-height:1.6;text-align:left;margin:10px 0 4px}
  .reward-btns{display:flex;gap:10px;margin-top:12px}
  .reward-btns button{flex:1;border:none;border-radius:12px;padding:11px 0;font-size:14px;
    font-weight:700;cursor:pointer}
  .btn-copy{background:#7c83ff;color:#fff}
  .btn-goto{background:#46e0c8;color:#0b0f1f;text-decoration:none;display:flex;align-items:center;justify-content:center;font-weight:800}
  .btn-close{background:#242b4a;color:#9db1ff}
  .reward-tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;
    background:rgba(124,131,255,.15);color:#a8afff;margin-top:8px}
  .reward-tag.err{background:rgba(255,107,139,.15);color:#ff9db4}
</style>
</head>
<body>
<a class="back" href="../">← 返回班级站</a>
<h1>🐍 贪吃蛇</h1>
<div class="score">得分：<b id="sc">0</b> · 最高：<b id="hi">0</b> · <span id="goal">目标 60 豆得点歌券</span></div>
<canvas id="cv" width="320" height="320"></canvas>
<div class="hint">方向键 / 屏幕虚拟按键控制</div>
<!-- 虚拟方向键（替代滑动） -->
<div class="dpad" id="dpad">
  <div class="dpad-row"><button class="dpad-btn" data-dir="up" aria-label="上">▲</button></div>
  <div class="dpad-row">
    <button class="dpad-btn" data-dir="left" aria-label="左">◀</button>
    <button class="dpad-btn" data-dir="down" aria-label="下">▼</button>
    <button class="dpad-btn" data-dir="right" aria-label="右">▶</button>
  </div>
</div>

<!-- 达标发券弹窗 -->
<div class="reward-mask" id="rewardMask">
  <div class="reward-box">
    <div class="reward-emoji" id="rwEmoji">🎉</div>
    <div class="reward-title" id="rwTitle">达成 30 分！</div>
    <div class="reward-sub" id="rwSub">获得一张点歌券</div>
    <div class="coupon-code" id="rwCode">加载中…</div>
    <div class="reward-tip" id="rwTip"></div>
    <div class="reward-tag" id="rwTag"></div>
    <div class="reward-btns">
      <button class="btn-copy" id="rwCopy" onclick="copyCoupon()">复制券码</button>
      <a class="btn-goto" id="rwGoto" href="https://xsyzc2505.dpdns.org/" target="_blank" rel="noopener">去点歌 →</a>
      <button class="btn-close" onclick="closeReward()">继续游戏</button>
    </div>
  </div>
</div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const N=20,CELL=cv.width/N;
/* ===== 速度与难度 =====
 * SPEED_BASE 初始每步间隔（ms，数值越大越慢）
 * 每吃 SPEED_STEP 个豆提速 SPEED_STEP_MS 毫秒，最快到 SPEED_MIN */
const SPEED_BASE=175;
const SPEED_MIN=80;
const SPEED_STEP=10;
const SPEED_STEP_MS=10;
function curSpeed(sc){ return Math.max(SPEED_MIN, SPEED_BASE - Math.floor(sc/SPEED_STEP)*SPEED_STEP_MS); }

/* ========== 点歌券配置 ==========
 * 达标后调用 VoiceHub 开放 API 创建点歌券。
 * 协议（从 VoiceHub 源码确认）：
 *   POST https://xsyzc2505.dpdns.org/api/open/card-codes
 *   Headers: x-api-key: vhub_xxx
 *   Body: { "count": 1, "prefix": "SONG", "length": 8, "note": "..." }
 *   响应: { success, data: { cardCodes: [{ id, code, status }] } }
 * 前提：VoiceHub 已部署 server/middleware/api-0-open-cors.ts（开放跨域）
 * ⚠️ 令牌不明文存储：完整 key 见 secrets.json.enc（密码见 secrets-hint.txt），
 *    前端仅存混淆密文（_CPN_ENC）运行时解密。纯前端无法防专业逆向，仅防明码泄露。
 *    重新加密方法见 TUTORIAL 5.4 */
const REWARD_DOTS=60;                 // 发券门槛=吃豆数（吃到第 60 个豆发一张点歌券）
/* VoiceHub API Key 混淆密文（xor+hex）。更换 key 时重新生成密文并替换下面两行 */
var _CPN_MASK='vgate25coupon0801';
var _CPN_ENC='000f14163a0251055b41155e5f56010605415653165d5406055b47155b57060a5552415f57';
function _cpnDec(){ var s=''; for(var i=0;i<_CPN_ENC.length;i+=2){ s+=String.fromCharCode(parseInt(_CPN_ENC.substr(i,2),16)^_CPN_MASK.charCodeAt((i/2)%_CPN_MASK.length)); } return s; }
var VOICEHUB_COUPON = {
  enabled: true,                     // 已联通 VoiceHub 开放 API
  url: 'https://xsyzc2505.dpdns.org/api/open/card-codes',
  method: 'POST',
  token: _cpnDec(),                  // 从混淆密文解密（见上方 _CPN_*）
  tokenField: 'x-api-key',           // VoiceHub 用 x-api-key 请求头，不是 Authorization
  tokenPrefix: '',                   // 无前缀，直接放 key
  respCodeKey: 'data.cardCodes.0.code' // 响应里第一个券码的字段路径
};

/* 设备唯一标识（本地生成，用于周常限领） */
function deviceId(){
  var k='cls_device_id';
  try{
    var d=localStorage.getItem(k);
    if(d) return d;
    d='dev_'+(Math.random().toString(36).slice(2,10))+(Date.now().toString(36).slice(-4));
    localStorage.setItem(k,d);
    return d;
  }catch(e){ return 'dev_'+Date.now(); }
}
/* 周常限领：每款游戏每周一张点歌券，每周一刷新（周一为一周起点） */
function weekKey(){
  var d=new Date(), day=(d.getDay()+6)%7;   // 周一=0
  d.setDate(d.getDate()-day);
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}
function alreadyClaimed(){
  try{ return localStorage.getItem('song_coupon_w_snake')===weekKey(); }catch(e){ return false; }
}
function markClaimed(){ try{ localStorage.setItem('song_coupon_w_snake', weekKey()); }catch(e){} }

/* 解析响应中的券码：支持 'code' / 'data.code' 路径 */
function pickPath(obj,path){
  var ks=String(path||'code').split('.');
  for(var i=0;i<ks.length;i++){ if(obj==null) return ''; obj=obj[ks[i]]; }
  return (typeof obj==='string'||typeof obj==='number') ? String(obj) : '';
}

/* 领券：调用 VoiceHub 开放 API 创建一张券 */
function claimCoupon(score,dur,cb){
  var cfg=VOICEHUB_COUPON;
  if(window.VOICEHUB_COUPON_OVERRIDE) cfg=window.VOICEHUB_COUPON_OVERRIDE;
  if(cfg.enabled && cfg.url){
    var headers={};
    if(cfg.tokenField==='Authorization'){
      headers['Authorization']=(cfg.tokenPrefix||'')+cfg.token;
    }else{
      headers[cfg.tokenField]=cfg.token;
    }
    headers['Content-Type']='application/json';
    /* VoiceHub 接口参数：count 生成数量 / prefix 前缀 / length 随机部分长度 / note 备注 */
    var body=JSON.stringify({count:1,prefix:'SONG',length:8,note:'贪吃蛇吃豆'+score+'奖励'});
    fetch(cfg.url,{method:cfg.method||'POST',headers:headers,body:body})
      .then(function(r){ return r.json().catch(function(){ return {code:''}; }); })
      .then(function(j){
        var code=pickPath(j,cfg.respCodeKey);
        if(code){ cb({ok:true,code:code,remote:true}); }
        else{ cb({ok:false,err:'接口返回了但没有识别到券码：'+JSON.stringify(j).slice(0,120),remote:true}); }
      })
      .catch(function(e){ cb({ok:false,err:'点歌券服务暂不可用（'+e.message+'）',remote:true}); });
  }else{
    // 本地占位：仅演示交互，券不在 VoiceHub 注册
    var code='SONG-'+Math.random().toString(36).slice(2,6).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
    setTimeout(function(){ cb({ok:false,err:'发券服务暂未开放，此券码仅作预览（未生效）',code:code,remote:false}); }, 400);
  }
}

function showReward(dots){
  var mask=document.getElementById('rewardMask');
  document.getElementById('rwTitle').textContent='吃到 '+dots+' 个豆！';
  document.getElementById('rwSub').textContent='获得一张点歌券（去点歌平台点歌时使用）';
  document.getElementById('rwCode').textContent='请稍候…';
  document.getElementById('rwTip').textContent='';
  var tag=document.getElementById('rwTag'); tag.className='reward-tag'; tag.textContent='正在为你生成券码…';
  mask.classList.add('show');
  var dur=Math.max(1,Math.round((Date.now()-window.__snakeStart)/1000));
  claimCoupon(score,dur,function(res){
    document.getElementById('rwCode').textContent=res.code||'生成失败';
    if(res.ok && res.remote){
      tag.className='reward-tag'; tag.textContent='✅ 已在点歌平台登记，复制券码去点歌吧';
      document.getElementById('rwTip').textContent='1. 复制上面的券码\n2. 打开「点歌平台」\n3. 点歌时把券码粘贴进去';
      window.__lastCoupon=res.code;
    }else{
      tag.className='reward-tag err';
      tag.textContent=res.remote ? ('⚠️ '+res.err) : '⚠️ 发券服务暂未开放（演示券码，未生效）';
      document.getElementById('rwTip').textContent='等站主接入点歌平台后，这张券就能真正使用啦';
      window.__lastCoupon=res.code||'';
    }
  });
}
function closeReward(){ document.getElementById('rewardMask').classList.remove('show'); }
function copyCoupon(){
  var c=window.__lastCoupon||document.getElementById('rwCode').textContent;
  var done=function(){ document.getElementById('rwCopy').textContent='已复制 ✓'; setTimeout(function(){document.getElementById('rwCopy').textContent='复制券码';},1500); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(c).then(done).catch(function(){ fallbackCopy(c);done(); });
  }else{ fallbackCopy(c);done(); }
}
function fallbackCopy(t){
  var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta);
}
document.getElementById('rewardMask').addEventListener('click',function(e){ if(e.target.id==='rewardMask') closeReward(); });

let snake,dir,food,sc,hi,timer,over;
hi=+(localStorage.getItem('snake_hi')||0);document.getElementById('hi').textContent=hi;
function place(){food={x:(Math.random()*N)|0,y:(Math.random()*N)|0};}
function draw(){
  ctx.fillStyle='#0b0f1f';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#46e0c8';ctx.fillRect(food.x*CELL+2,food.y*CELL+2,CELL-4,CELL-4);
  ctx.fillStyle=over?'#ff6b8b':'#7c83ff';
  snake.forEach(s=>ctx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2));
  if(over){ctx.fillStyle='#fff';ctx.font='22px sans-serif';ctx.textAlign='center';ctx.fillText('游戏结束 · 点屏重来',cv.width/2,cv.height/2);}
}
function loop(){
  if(over)return;
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){over=true;draw();return;}
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){sc++;document.getElementById('sc').textContent=sc;
    if(sc>hi){hi=sc;localStorage.setItem('snake_hi',hi);document.getElementById('hi').textContent=hi;}place();
    /* 达标发券：吃豆数达到门槛且今天没领过（=== 保证只触发一次） */
    if(sc===REWARD_DOTS && !alreadyClaimed()){ markClaimed(); showReward(sc); }
  }
  else snake.pop();
  draw();timer=setTimeout(loop,curSpeed(sc));
}
function reset(){clearTimeout(timer);snake=[{x:10,y:10},{x:9,y:10}];dir={x:1,y:0};place();sc=0;over=false;
  window.__snakeStart=Date.now();
  var g=document.getElementById('goal'); if(g) g.textContent='目标 '+REWARD_DOTS+' 豆得点歌券';
  document.getElementById('sc').textContent=0;loop();}
document.addEventListener('keydown',e=>{const k=e.key;
  if(k==='ArrowUp'&&dir.y===0)dir={x:0,y:-1};
  else if(k==='ArrowDown'&&dir.y===0)dir={x:0,y:1};
  else if(k==='ArrowLeft'&&dir.x===0)dir={x:-1,y:0};
  else if(k==='ArrowRight'&&dir.x===0)dir={x:1,y:0};});
/* 虚拟方向键（替代滑动；点击/触摸均生效） */
function dpadDir(k){
  if(k==='up'&&dir.y===0)dir={x:0,y:-1};
  else if(k==='down'&&dir.y===0)dir={x:0,y:1};
  else if(k==='left'&&dir.x===0)dir={x:-1,y:0};
  else if(k==='right'&&dir.x===0)dir={x:1,y:0};
}
document.querySelectorAll('.dpad-btn').forEach(function(b){
  var act=function(e){ e.preventDefault(); dpadDir(b.getAttribute('data-dir')); };
  b.addEventListener('touchstart', act, {passive:false});
  b.addEventListener('mousedown', act);
});
/* 点击画布：仅用于游戏结束后重开 */
cv.addEventListener('touchstart',e=>{ if(over) reset(); },{passive:true});
cv.addEventListener('click', ()=>{ if(over) reset(); });
reset();
</script>
</body>
</html>
