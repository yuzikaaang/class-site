<!DOCTYPE html>
<html lang="zh-CN" data-theme="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>管理后台 · 25级05班班级服务站</title>
<link rel="icon" href="favicon.svg">
<style>
/* ============================================================
 * 25级05班班级服务站 · 管理后台
 * ------------------------------------------------------------
 * 【设计 token】全部沿用主站 index.html 的「暖阳橙双轨配色」：
 *     --grad-*  鲜艳渐变 → 只做装饰（图标底、光晕、顶部条）
 *     --btn-*   深色版   → 承载白字（鲜艳橙配白字对比度不达标）
 *     --accent-ink 强调文字
 *   换主题只需改本区块，其余样式不用动。
 *
 * 【布局参照】VoiceHub 后台：
 *     固定侧栏 w-256 + 毛玻璃顶栏 h-64 + 内容区滚动
 *     SP版侧栏移出屏幕，汉堡按钮 + 遮罩唤出
 *   但配色、圆角、阴影全部走本班站的暖调语言，不套用它的黑白。
 * ============================================================ */

/* ---------------- 设计 token（与主站 index.html 一致） ---------------- */
:root{
  /* 签名渐变（装饰用，不放白字） */
  --grad-a:#f97316; --grad-b:#fb923c;
  /* 按钮/承载白字的深色版（白字实测 9.37:1 / 7.31:1） */
  --btn-a:#7c2d12; --btn-b:#9a3412;
  /* 强调文字（四种底色实测全部 ≥4.5:1） */
  --accent-ink:#af410f;
  /* 暖调中性底 */
  --bg-1:#fffbf7; --bg-2:#fff7f0; --bg-3:#fdede0;
  --tint:#fff1e7; --tint-2:#fee2d5;
  /* 文本 */
  --fg:#292524; --fg-2:#57534e; --fg-3:#6e635a; --fg-muted:#6e635a;
  /* 阴影：分层，带色调而非纯黑 */
  --sh-sm:0 1px 3px rgba(120,53,15,.06);
  --sh-md:0 4px 6px rgba(120,53,15,.07);
  --sh-lg:0 10px 15px rgba(120,53,15,.08);
  --sh-xl:0 20px 25px rgba(120,53,15,.10);
  --sh-accent:0 4px 14px rgba(194,65,12,.25);
  --sh-accent-lg:0 8px 24px rgba(194,65,12,.35);
  /* 语义色 */
  --ok:#0a7d42; --ok-bg:#e6f9f0;
  --warn:#b45309; --warn-bg:#ffedd5;
  --danger:#c0392b; --danger-bg:#fdeaea;
  --info:#1d4ed8; --info-bg:#e8effd;
  /* 面板/边框 */
  --panel:#ffffff;
  --border:rgba(120,53,15,.09);
  --border-2:rgba(120,53,15,.16);
  /* 侧栏宽 + 顶栏高 */
  --side-w:256px; --head-h:64px;
  /* 动效 */
  --ease-out:cubic-bezier(.16,1,.3,1);
  --t-fast:.15s; --t-base:.2s; --t-slow:.3s;
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:22px;
}
/* 暗色模式：近黑中性底（亮暗两套都保持暖调倾向） */
html[data-theme="dark"]{
  --grad-a:#fb923c; --grad-b:#fdba74;
  --btn-a:#7c2d12; --btn-b:#9a3412;
  --accent-ink:#fb923c;
  --bg-1:#1c1a18; --bg-2:#1f1d1e; --bg-3:#252324;
  --tint:rgba(251,146,60,.12); --tint-2:rgba(251,146,60,.2);
  --fg:#f5f5f4; --fg-2:#d6d3d1; --fg-3:#a8a29e; --fg-muted:#a8a29e;
  --panel:#232120;
  --border:rgba(251,146,60,.14);
  --border-2:rgba(251,146,60,.24);
  --ok:#4ade80; --ok-bg:rgba(74,222,128,.14);
  --warn:#fbbf24; --warn-bg:rgba(251,191,36,.14);
  --danger:#f87171; --danger-bg:rgba(248,113,113,.14);
  --info:#93b4fd; --info-bg:rgba(147,180,253,.14);
  --sh-sm:0 1px 3px rgba(0,0,0,.3);
  --sh-md:0 4px 6px rgba(0,0,0,.35);
  --sh-lg:0 10px 15px rgba(0,0,0,.4);
  --sh-xl:0 20px 25px rgba(0,0,0,.45);
  --sh-accent:0 4px 14px rgba(251,146,60,.28);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--fg);font-size:15px;line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  background:linear-gradient(135deg,var(--bg-1) 0%,var(--bg-2) 50%,var(--bg-3) 100%);
  -webkit-font-smoothing:antialiased;
}
/* 顶部径向辉光（沿用主站的氛围做法） */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(80% 50% at 50% -12%,rgba(249,115,22,.10),rgba(255,255,255,0) 70%);
}
a{color:var(--accent-ink);text-decoration:none}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(120,53,15,.18);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(120,53,15,.3)}

/* ============================================================
 * ① 登录门（未登录时全屏拦截）
 * ============================================================ */
#gate{
  position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;
  padding:20px;background:linear-gradient(135deg,var(--bg-1),var(--bg-3));
}
#gate.hide{display:none}
.gate-card{
  width:100%;max-width:400px;background:var(--panel);border-radius:var(--radius-xl);
  padding:36px 30px;box-shadow:var(--sh-xl);border:1px solid var(--border);
  border-top:4px solid var(--grad-a);position:relative;z-index:1;
  animation:rise-in .5s var(--ease-out) both;
}
.gate-logo{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.gate-logo .mark{
  width:48px;height:48px;border-radius:14px;flex:0 0 48px;
  background:linear-gradient(135deg,var(--grad-a),var(--grad-b));
  box-shadow:var(--sh-accent);color:#fff;font-size:1.3rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;
}
.gate-logo h1{font-size:1.15rem;margin:0;color:var(--accent-ink);letter-spacing:-.01em}
.gate-logo p{margin:2px 0 0;font-size:.75rem;color:var(--fg-3);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.field{margin-bottom:14px}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--fg-2);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;height:46px;padding:0 14px;border:1px solid var(--border-2);border-radius:var(--radius-md);
  background:var(--bg-1);color:var(--fg);outline:none;transition:border-color var(--t-base),box-shadow var(--t-base);
}
.field textarea{height:auto;padding:12px 14px;resize:vertical;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--btn-b);box-shadow:0 0 0 3px var(--tint);
}
.field .hint{font-size:.72rem;color:var(--fg-3);margin-top:5px}
/* 独立输入框（不放在 .field 直接子级时用，如联系方式三宫格） */
.inp{
  width:100%;height:42px;padding:0 13px;border:1px solid var(--border-2);
  border-radius:var(--radius-md);background:var(--panel);color:var(--fg);
  outline:none;transition:all var(--t-base);
}
.inp:focus{border-color:var(--btn-b);box-shadow:0 0 0 3px var(--tint)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:linear-gradient(135deg,var(--btn-a),var(--btn-b));color:#fff;
  padding:0 20px;height:42px;border-radius:var(--radius-md);font-size:.9rem;font-weight:600;
  border:none;cursor:pointer;white-space:nowrap;
  transition:transform var(--t-base) var(--ease-out),box-shadow var(--t-base) var(--ease-out),filter var(--t-base);
  box-shadow:var(--sh-sm);
}
.btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:var(--sh-accent);filter:brightness(1.08)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none!important;box-shadow:var(--sh-sm)!important;filter:none!important}
.btn-block{width:100%;height:48px;font-size:.95rem}
.btn-sm{height:34px;padding:0 13px;font-size:.8rem;border-radius:var(--radius-sm)}
.btn-secondary{background:var(--tint);color:var(--accent-ink);box-shadow:none;border:1px solid var(--border-2)}
.btn-secondary:hover{background:var(--tint-2);box-shadow:var(--sh-sm)}
.btn-ghost{background:transparent;color:var(--fg-2);box-shadow:none;border:1px solid var(--border-2)}
.btn-ghost:hover{background:var(--tint);color:var(--accent-ink);box-shadow:none}
.btn-danger{background:linear-gradient(135deg,#9b2c1f,#c0392b)}
.btn-danger:hover{box-shadow:0 4px 14px rgba(192,57,43,.3)}
.btn-ok{background:linear-gradient(135deg,#0a7d42,#12995a)}
.btn-ok:hover{box-shadow:0 4px 14px rgba(10,125,66,.28)}
.msg{margin-top:14px;padding:11px 14px;border-radius:var(--radius-md);font-size:.83rem;display:none;line-height:1.55;white-space:pre-line}
.msg.show{display:block}
.msg.err{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(192,57,43,.2)}
.msg.ok{background:var(--ok-bg);color:var(--ok);border:1px solid rgba(10,125,66,.2)}
.msg.warn{background:var(--warn-bg);color:var(--warn);border:1px solid rgba(180,83,9,.2)}

@keyframes rise-in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}

/* ============================================================
 * ② 应用骨架：固定侧栏 + 顶栏 + 内容区
 * ============================================================ */
#app{display:none}
#app.show{display:block}
.side{
  position:fixed;top:0;left:0;bottom:0;width:var(--side-w);z-index:60;
  background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:18px 14px;
  transition:transform var(--t-slow) var(--ease-out);
  box-shadow:2px 0 16px rgba(120,53,15,.04);
}
.side-brand{display:flex;align-items:center;gap:11px;padding:6px 10px 0;margin-bottom:22px}
.side-brand .mark{
  width:38px;height:38px;border-radius:12px;flex:0 0 38px;
  background:linear-gradient(135deg,var(--grad-a),var(--grad-b));
  box-shadow:var(--sh-accent);color:#fff;font-size:1rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;transition:transform var(--t-slow) var(--ease-out);
}
.side-brand:hover .mark{transform:scale(1.1) rotate(-4deg)}
.side-brand h1{margin:0;font-size:1rem;font-weight:800;color:var(--fg);letter-spacing:-.01em;line-height:1.1}
.side-brand p{margin:3px 0 0;font-size:.62rem;color:var(--fg-3);letter-spacing:.14em;text-transform:uppercase;font-weight:800}

.side-nav{flex:1;overflow-y:auto;padding-right:4px;margin:0 -4px}
.nav-group{margin-bottom:18px}
.nav-group>h3{
  margin:0 0 7px;padding:0 10px;font-size:.63rem;font-weight:800;
  color:var(--fg-3);letter-spacing:.16em;text-transform:uppercase;
}
.nav-item{
  width:100%;display:flex;align-items:center;gap:10px;padding:9px 11px;
  border-radius:var(--radius-md);font-size:.85rem;font-weight:600;
  color:var(--fg-2);background:none;border:1px solid transparent;cursor:pointer;
  transition:all var(--t-base) var(--ease-out);text-align:left;margin-bottom:2px;
}
.nav-item .ico{flex:0 0 17px;width:17px;height:17px;display:flex;align-items:center;justify-content:center;opacity:.75}
.nav-item .ico svg{width:17px;height:17px;display:block}
.nav-item span{flex:1;truncate:ellipsis;overflow:hidden;text-overflow:ellipsis}
.nav-item:hover{background:var(--tint);color:var(--accent-ink)}
.nav-item.on{background:var(--tint);color:var(--accent-ink);border-color:var(--border-2);font-weight:700}
.nav-item.on .ico{opacity:1}
.nav-item.on .dot{width:5px;height:5px;border-radius:50%;background:var(--grad-a);box-shadow:0 0 8px var(--grad-a);flex:0 0 5px}

.side-user{
  margin-top:14px;padding-top:14px;border-top:1px solid var(--border);
}
.side-user .row{
  display:flex;align-items:center;gap:11px;padding:10px;border-radius:var(--radius-md);
  background:var(--bg-2);border:1px solid var(--border);
}
.side-user .av{
  width:38px;height:38px;border-radius:11px;flex:0 0 38px;
  background:linear-gradient(135deg,var(--grad-a),var(--grad-b));
  color:#fff;font-weight:800;font-size:1rem;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-accent);
}
.side-user .who{flex:1;min-width:0}
.side-user .who b{display:block;font-size:.82rem;font-weight:800;color:var(--fg);truncate;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-user .who i{display:block;font-size:.63rem;color:var(--fg-3);letter-spacing:.1em;text-transform:uppercase;font-weight:700;font-style:normal;margin-top:2px}
.icon-btn{
  display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex:0 0 32px;
  border-radius:var(--radius-sm);border:none;background:transparent;color:var(--fg-3);cursor:pointer;
  transition:all var(--t-base);
}
.icon-btn:hover{background:var(--danger-bg);color:var(--danger)}
.icon-btn svg{width:16px;height:16px}

.head{
  position:sticky;top:0;z-index:50;height:var(--head-h);
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:0 26px;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--bg-1) 78%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.head h2{margin:0;font-size:1.2rem;font-weight:800;letter-spacing:-.01em}
.head .head-actions{display:flex;align-items:center;gap:9px}
#burger{display:none}
.main{margin-left:var(--side-w);min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}
.content{flex:1;padding:24px 26px 90px;max-width:1440px;width:100%}
.scrim{display:none}

/* ============================================================
 * ③ 通用组件
 * ============================================================ */
.panel{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--sh-md);overflow:hidden;
}
.panel-head{
  padding:15px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.panel-head h3{margin:0;font-size:.95rem;font-weight:800;display:flex;align-items:center;gap:8px}
.panel-head h3 svg{width:17px;height:17px;color:var(--accent-ink)}
.panel-head .sub{margin:3px 0 0;font-size:.72rem;color:var(--fg-3)}
.panel-body{padding:18px}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-bottom:22px}
.stat{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:18px;box-shadow:var(--sh-md);position:relative;overflow:hidden;
  transition:transform var(--t-slow) var(--ease-out),box-shadow var(--t-slow) var(--ease-out),border-color var(--t-base);
}
.stat:hover{transform:translateY(-4px);box-shadow:var(--sh-lg);border-color:var(--border-2)}
.stat .top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.stat .si{
  width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--grad-a),var(--grad-b));box-shadow:var(--sh-accent);color:#fff;
}
.stat .si svg{width:21px;height:21px}
.stat .si.green{background:linear-gradient(135deg,#0a7d42,#12995a);box-shadow:0 4px 14px rgba(10,125,66,.28)}
.stat .si.blue{background:linear-gradient(135deg,#1d4ed8,#3b82f6);box-shadow:0 4px 14px rgba(29,78,216,.28)}
.stat .si.amber{background:linear-gradient(135deg,#b45309,#d97706);box-shadow:0 4px 14px rgba(180,83,9,.28)}
.stat .trend{font-size:.7rem;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--ok-bg);color:var(--ok)}
.stat .label{margin:0;font-size:.78rem;color:var(--fg-3);font-weight:600}
.stat .value{margin:5px 0 0;font-size:1.85rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat .foot{margin:6px 0 0;font-size:.72rem;color:var(--fg-3)}

.grid-2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
.grid-main{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}

.toolbar{
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  padding:13px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:16px;
}
.search{position:relative;flex:1;min-width:180px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--fg-3);pointer-events:none}
.search input{
  width:100%;height:40px;padding:0 13px 0 37px;border:1px solid var(--border-2);
  border-radius:var(--radius-md);background:var(--panel);color:var(--fg);outline:none;transition:all var(--t-base);
}
.search input:focus{border-color:var(--btn-b);box-shadow:0 0 0 3px var(--tint)}
.toolbar select{
  height:40px;padding:0 30px 0 12px;border:1px solid var(--border-2);border-radius:var(--radius-md);
  background:var(--panel) url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236e635a' stroke-width='2.5' stroke-linecap='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E") no-repeat right 9px center/13px;
  color:var(--fg);outline:none;cursor:pointer;appearance:none;-webkit-appearance:none;
}
.toolbar select:focus{border-color:var(--btn-b);box-shadow:0 0 0 3px var(--tint)}

.table-wrap{overflow-x:auto;border-radius:var(--radius-md);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:.84rem}
thead th{
  padding:11px 13px;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--fg-3);background:var(--bg-2);
  border-bottom:1px solid var(--border);white-space:nowrap;
}
tbody td{padding:11px 13px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background var(--t-fast)}
tbody tr:hover{background:var(--tint)}
tbody tr.sel{background:var(--tint-2)}
.cell-user{display:flex;align-items:center;gap:10px}
.cell-user .av{
  width:32px;height:32px;border-radius:9px;flex:0 0 32px;
  background:linear-gradient(135deg,var(--grad-a),var(--grad-b));color:#fff;
  font-weight:800;font-size:.8rem;display:flex;align-items:center;justify-content:center;
}
.cell-user b{font-weight:700;display:block;font-size:.85rem}
.cell-user i{font-style:normal;font-size:.72rem;color:var(--fg-3)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem}
.muted{color:var(--fg-3)}
.nowrap{white-space:nowrap}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:.71rem;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge-gray{background:var(--bg-3);color:var(--fg-2)}
.badge-orange{background:var(--tint-2);color:var(--accent-ink)}
.badge-green{background:var(--ok-bg);color:var(--ok)}
.badge-red{background:var(--danger-bg);color:var(--danger)}
.badge-blue{background:var(--info-bg);color:var(--info)}
.badge-amber{background:var(--warn-bg);color:var(--warn)}

.row-actions{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}
.row-actions button{
  height:29px;padding:0 9px;font-size:.73rem;font-weight:700;border-radius:var(--radius-sm);
  border:1px solid var(--border-2);background:var(--panel);color:var(--fg-2);cursor:pointer;
  transition:all var(--t-fast);white-space:nowrap;
}
.row-actions button:hover{background:var(--tint);color:var(--accent-ink);border-color:var(--btn-b)}
.row-actions button.danger:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}
.row-actions button.ok:hover{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}

.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px 2px;flex-wrap:wrap}
.pager .info{font-size:.78rem;color:var(--fg-3)}
.pager .pages{display:flex;gap:6px;align-items:center}

.chip{

.rank-row:nth-child(1) .n{background:linear-gradient(135deg,var(--grad-a),var(--grad-b));color:#fff}

.alert{padding:12px 15px;border-radius:var(--radius-md);font-size:.83rem;line-height:1.6;margin-bottom:16px;border:1px solid}

.alert.info{background:var(--info-bg);color:var(--info);border-color:rgba(29,78,216,.2)}

/* 活动流 */
.feed{max-height:520px;overflow-y:auto;padding:8px}

}

.modal{

.modal-box{
  width:100%;max-width:560px;max-height:88vh;overflow-y:auto;

.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;background:var(--panel);z-index:2;border-radius:var(--radius-xl) var(--radius-xl) 0 0}

/* 字段勾选 */
.field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}

  display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:var(--radius-sm);

.field-grid input{width:15px;height:15px;accent-color:var(--btn-b);cursor:pointer}

/* 复选框列 */
.chk{width:15px;height:15px;accent-color:var(--btn-b);cursor:pointer;display:block}

/* 用户选择器（定向公告） */
.picker{max-height:230px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-md);padding:8px}
.picker-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:background var(--t-fast)}
.picker-row:hover{background:var(--tint)}
.picker-row input{width:15px;height:15px;accent-color:var(--btn-b);cursor:pointer}

.picker-row i{font-style:normal;font-size:.72rem;color:var(--fg-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

}
.chip b{cursor:pointer;font-weight:900;opacity:.65}
.chip b:hover{opacity:1}

/* 详情键值 */
.kv{display:grid;grid-template-columns:110px 1fr;gap:9px 14px;font-size:.83rem}
.kv dt{color:var(--fg-3);font-weight:700;font-size:.78rem}
.kv dd{margin:0;word-break:break-all}

/* toast */
#toasts{position:fixed;right:20px;bottom:20px;z-index:9500;display:flex;flex-direction:column;gap:9px;pointer-events:none}
.toast{
  padding:12px 17px;border-radius:var(--radius-md);background:var(--panel);
  border:1px solid var(--border);border-left:4px solid var(--grad-a);
  box-shadow:var(--sh-xl);font-size:.84rem;font-weight:600;max-width:340px;
  animation:rise-in .3s var(--ease-out) both;pointer-events:auto;
}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warn)}

.tab-strip{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab-strip button{
  height:36px;padding:0 15px;font-size:.83rem;font-weight:700;border-radius:var(--radius-md);
  border:1px solid var(--border-2);background:var(--panel);color:var(--fg-2);cursor:pointer;transition:all var(--t-fast);
}
.tab-strip button:hover{background:var(--tint);color:var(--accent-ink)}
.tab-strip button.on{background:linear-gradient(135deg,var(--btn-a),var(--btn-b));color:#fff;border-color:transparent;box-shadow:var(--sh-accent)}

/* ============================================================
 * ⑤ 响应式
 * ============================================================ */
@media(max-width:1080px){
  .grid-2{grid-template-columns:1fr}
  .grid-main{grid-template-columns:1fr}

  .scrim.show{opacity:1;pointer-events:auto}
  .content{padding:16px 14px 80px}

  .modal-box{border-radius:var(--radius-lg);max-height:92vh}
  .field-grid{grid-template-columns:1fr 1fr}
  #toasts{right:12px;bottom:12px;left:12px}
  .toast{max-width:none}
}
</style>

<script>
/* ============================================================================
 * 25级05班班级服务站 · 管理后台
 * ----------------------------------------------------------------------------
 * 单文件、零框架、零构建。直接双击 HTML 也能跑（请求后端需联网）。
 *
 * 模块划分：
 *   ① CONFIG / 工具函数
 *   ② API 层（统一鉴权、401 自动踢出）
 *   ③ 图标库（内联 SVG，不引外部 CDN）
 *   ④ 通用 UI：toast / modal / 确认框
 *   ⑤ 面板 11 个：
 *        概览   overview      用户   users         班级资料 profiles
 *        审核   reviews       查看记录 viewlogs    公告   announcements
 *        内容   content       登录记录 logins      操作日志 logs
 *        设置   settings      账户   account
 *   ⑥ Excel 导入导出（SheetJS 三源 CDN 回退）
 *
 * 隐私约定（2026-10-05 改造，别破坏它）：
 *   · 班级通讯录（姓名/学号/政治面貌）只存在后端，前端不留任何明文密文
 *   · 同学的微信 / QQ / 手机号提交后一律 pending，必须管理员在「联系方式审核」通过
 *     才会出现在别人的查询结果里（后端 api/profile.js 的 shapeProfile 控制）
 *   · 每次查询都写 profile_view_log，在「查看记录」里可溯
 *   · 本文件的联系方式展示是**管理端明文视图**，非管理员拿不到这些接口
 * ========================================================================= */
(function(){
'use strict';

/* ============================================================================
 * ① CONFIG 与工具
 * ========================================================================= */

/* 后端地址：与主站 index.html 保持一致。
   留空则走同域（本地开发时起个服务即可）。 */
var API_BASE = 'https://api.classsite.dpdns.org';

var LS_TOKEN = 'cls_admin_token';
var LS_USER  = 'cls_admin_user';
var LS_THEME = 'cls_admin_theme';
var LS_UI    = 'cls_admin_ui';

/* ---- 运行时状态 ---- */
var STATE = {
  token: '',
  me: null,
  page: 'overview',
  /* 各面板的临时状态 */
  users: { list: [], total: 0, page: 1, size: 50, q: '', role: '', status: '', selected: {} },
  logs:  { list: [], total: 0, page: 1, size: 30 },
  logins:{ list: [], total: 0, page: 1, size: 30, userId: 0 },
  profiles: { list: [], total: 0, counts: {}, page: 1, size: 30, q: '', status: '' },
  reviews:  { list: [], total: 0, page: 1, size: 30 },
  viewlogs: { list: [], total: 0, page: 1, size: 30, top: [], q: '' },
  /* 公告与内容存后端 user_data 的特殊键（见下方 SITE_KEYS） */
  announcements: [],
  content: [],
};
window.__ADMIN_STATE = STATE;   /* 调试用 */

/* ---- 小工具 ---- */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function attr(s){ return esc(s); }

/**
 * 把数据库返回的时间格式化成可读文本。
 *
 * ⚠️ 复制自主站的经验（2026-10-05 踩过的坑）：
 * Neon HTTP 驱动返回 timestamptz 是**字符串**（形如 "2026-10-05 05:52:28"），
 * 带空格的格式在 Safari / 微信 WebView 里 `new Date()` 会得到 Invalid Date。
 * 所以要手动换 T 补 Z 按 UTC 解析，再转本地时区显示。
 */
function parseTime(v){
  if(!v) return null;
  if(v instanceof Date) return isNaN(v.getTime()) ? null : v;
  var s = String(v).trim();
  if(/^\d+$/.test(s)){ var n = Number(s); return new Date(n > 1e12 ? n : n*1000); }
  var iso = s.replace(' ','T');
  if(!/[zZ]|[+-]\d{2}:?\d{2}$/.test(iso)) iso += 'Z';
  var t = Date.parse(iso);
  return isNaN(t) ? null : new Date(t);
}
function fmt(v, mode){
  var d = parseTime(v);
  if(!d) return '—';
  var p = function(n){ return String(n).padStart(2,'0'); };
  var Y = d.getFullYear(), M = p(d.getMonth()+1), D = p(d.getDate());
  var h = p(d.getHours()), m = p(d.getMinutes()), sec = p(d.getSeconds());
  if(mode === 'date') return Y + '-' + M + '-' + D;
  if(mode === 'time') return h + ':' + m;
  return Y + '-' + M + '-' + D + ' ' + h + ':' + m + ':' + sec;
}
/** 相对时间："3 分钟前" */
function ago(v){
  var d = parseTime(v);
  if(!d) return '—';
  var ms = Date.now() - d.getTime();
  if(ms < 0) return fmt(v);
  var s = Math.floor(ms/1000);
  if(s < 60) return '刚刚';
  var m = Math.floor(s/60);
  if(m < 60) return m + ' 分钟前';
  var h = Math.floor(m/60);
  if(h < 24) return h + ' 小时前';
  var dd = Math.floor(h/24);
  if(dd < 30) return dd + ' 天前';
  return fmt(v, 'date');
}
function bytes(n){
  n = Number(n) || 0;
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1024/1024).toFixed(2) + ' MB';
}
/** 一次下载（导出用） */
function download(blob, filename){
  var a = document.createElement('a');
  var url = URL.createObjectURL(blob);
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 200);
}
/** 防抖 */
function debounce(fn, ms){
  var t; return function(){ var a = arguments, c = this; clearTimeout(t); t = setTimeout(function(){ fn.apply(c, a); }, ms); };
}

/* ============================================================================
 * ② API 层
 * ========================================================================= */

function apiUrl(path){
  return (API_BASE || '') + '/api' + path;
}

/**
 * 统一请求封装。
 * - 自动带 Bearer token
 * - 401 自动清登录态并回到登录门
 * - 403 + mustChangePassword 自动弹强制改密
 */
function api(path, opts){
  opts = opts || {};
  var headers = { 'Content-Type':'application/json' };
  if(STATE.token) headers['Authorization'] = 'Bearer ' + STATE.token;

  var init = { method: opts.method || 'GET', headers: headers };
  if(opts.body !== undefined) init.body = JSON.stringify(opts.body);

  return fetch(apiUrl(path), init).then(function(r){
    return r.json().catch(function(){
      return { ok:false, error:'接口返回了非 JSON 内容（HTTP ' + r.status + '）' };
    }).then(function(j){
      if(r.status === 401){
        doLogout(true);
        throw new Error(j.error || '登录已过期，请重新登录');
      }
      /* 未改初始密码 → 后端拦截，这里把强制改密弹窗拉起来 */
      if(r.status === 403 && j.mustChangePassword){
        openForceChangePwd();
        throw new Error(j.error || '请先修改初始密码');
      }
      if(!r.ok || j.ok === false){
        var e = new Error(j.error || ('请求失败（HTTP ' + r.status + '）'));
        e.status = r.status; e.data = j;
        throw e;
      }
      return j;
    });
  });
}

function toast(msg, kind, ms){
  var box = $('toasts');
  if(!box) return;
  var el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(function(){
    el.style.transition = 'opacity .25s, transform .25s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    setTimeout(function(){ el.remove(); }, 260);
  }, ms || 2600);
}

/**
 * 打开弹窗。
 * @param {object} o { title, sub, body(html), foot(html), wide, onMount(box), locked(不可关闭) }
 */
function openModal(o){
  o = o || {};
  var m = $('modal'), box = $('modalBox');
  var cls = 'modal-box' + (o.wide ? ' wide' : '');
  box.className = cls;
  box.innerHTML =
    '<div class="modal-head">'
    +   '<div><h3>' + esc(o.title || '') + '</h3>'
    +   (o.sub ? '<p class="sub">' + esc(o.sub) + '</p>' : '')
    +   '</div>'
    +   (o.locked ? '' : '<button class="close-x" data-close>' + svg('x') + '</button>')
    + '</div>'
    + '<div class="modal-body" id="modalBody">' + (o.body || '') + '</div>'
    + (o.foot ? '<div class="modal-foot">' + o.foot + '</div>' : '');

  m.className = 'modal show' + (o.locked ? ' locked' : '');
  /* 点遮罩关闭（locked 除外） */
  m.onclick = function(e){ if(e.target === m && !o.locked) closeModal(); };
  var x = box.querySelector('[data-close]');
  if(x) x.onclick = closeModal;
  if(typeof o.onMount === 'function') o.onMount(box);
  return box;
}
function closeModal(){
  var m = $('modal');
  m.className = 'modal';
  $('modalBox').innerHTML = '';
}

/**
 * 确认框（Promise 化）
 * @param {object} o
 *   html  主文案（允许 HTML，调用方自己保证安全）
 *   text  主文案（纯文本，会被转义）—— 与 html 二选一
 *   detail 补充说明（纯文本，小字显示在主文案下面）
 *   warn  危险提示（红框）
 * @returns {Promise<boolean>}
 */
function confirmBox(o){
  o = o || {};
  return new Promise(function(resolve){
    var done = function(v){ closeModal(); resolve(v); };
    openModal({
      title: o.title || '确认操作',
      body: '<p style="margin:0;font-size:.9rem;line-height:1.7">' + (o.html || esc(o.text || '确定要继续吗？')) + '</p>'
            + (o.detail ? '<p style="margin:10px 0 0;font-size:.82rem;line-height:1.7;color:var(--fg-3)">' + esc(o.detail) + '</p>' : '')
            + (o.warn ? '<div class="alert danger" style="margin:16px 0 0">' + esc(o.warn) + '</div>' : ''),
      foot: '<button class="btn btn-ghost" data-no>取消</button>'
            + '<button class="btn ' + (o.danger ? 'btn-danger' : '') + '" data-yes>' + esc(o.okText || '确定') + '</button>',
      onMount: function(box){
        box.querySelector('[data-yes]').onclick = function(){ done(true); };
        box.querySelector('[data-no]').onclick  = function(){ done(false); };
      }
    });
  });
}

/** 输入框对话框（Promise 化，返回输入值或 null） */
function promptBox(o){
  o = o || {};
  return new Promise(function(resolve){
    var done = function(v){ closeModal(); resolve(v); };
    openModal({
      title: o.title || '输入',
      sub: o.sub || '',
      body:
        '<div class="field"><label for="pmVal">' + esc(o.label || '内容') + '</label>'
        + '<input id="pmVal" type="' + (o.type || 'text') + '" value="' + attr(o.value || '') + '" '
        + 'placeholder="' + attr(o.placeholder || '') + '" '
        + (o.maxlength ? 'maxlength="' + o.maxlength + '"' : '') + '>'
        + (o.hint ? '<p class="hint">' + esc(o.hint) + '</p>' : '')
        + '</div>'
        + '<div class="msg" id="pmMsg"></div>',
      foot: '<button class="btn btn-ghost" data-no>取消</button><button class="btn" data-yes>' + esc(o.okText || '确定') + '</button>',
      onMount: function(box){
        var input = box.querySelector('#pmVal');
        var msg = box.querySelector('#pmMsg');
        setTimeout(function(){ input.focus(); input.select(); }, 80);
        var submit = function(){
          var v = input.value.trim();
          if(o.required && !v){
            msg.className = 'msg err show'; msg.textContent = '不能为空';
            return;
          }
          if(o.validate){
            var err = o.validate(v);
            if(err){ msg.className = 'msg err show'; msg.textContent = err; return; }
          }
          done(v);
        };
        box.querySelector('[data-yes]').onclick = submit;
        box.querySelector('[data-no]').onclick  = function(){ done(null); };
        input.onkeydown = function(e){ if(e.key === 'Enter'){ e.preventDefault(); submit(); } };
      }
    });
  });
}

      $('ovKeys').innerHTML = keys.map(function(k){

        return '<div style="margin-bottom:13px">'
          + '<div style="display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:5px">'
          + '<span class="mono" style="color:var(--fg-2)">' + esc(k.key) + '</span>'
          + '<b style="color:var(--accent-ink)">' + esc(k.count) + '</b></div>'
          + '<div class="progress-bar" style="margin:0"><i style="width:' + w + '%"></i></div>'
          + '</div>';
      }).join('');
    }

    var goto = $('view').querySelector('[data-goto]');
    if(goto) goto.onclick = function(){ go(goto.dataset.goto); };
  }).catch(function(e){
    /* 只在概览页还开着的时候才报错。
       否则用户已经切到别的面板，这个迟到的失败会把人家正在看的内容冲掉
       （2026-10-05 实测踩到：stats 慢了一步，把资料管理页整页替换成错误提示）。 */
    if(STATE.page !== 'overview') return;
    $('view').innerHTML = '<div class="alert danger">加载失败：' + esc(e.message) + '</div>';
  });
}

/* ============================================================================
 * ⑦ 面板：用户管理（核心，深度对标 VoiceHub）
 * ========================================================================= */
function renderUsers(){

  var S = STATE.users;

  view.innerHTML =
    '<div class="toolbar">'
    +   '<div class="search">' + svg('search', 15) + '<input id="uSearch" placeholder="搜索用户名或姓名…" value="' + attr(S.q) + '"></div>'
    +   '<select id="uRole">'
    +     '<option value="">全部角色</option>'
    +     '<option value="user"' + (S.role === 'user' ? ' selected' : '') + '>普通用户</option>'
    +     '<option value="admin"' + (S.role === 'admin' ? ' selected' : '') + '>管理员</option>'
    +   '</select>'
    +   '<select id="uStatus">'
    +     '<option value="">全部状态</option>'
    +     '<option value="active"' + (S.status === 'active' ? ' selected' : '') + '>正常</option>'
    +     '<option value="banned"' + (S.status === 'banned' ? ' selected' : '') + '>已禁用</option>'
    +   '</select>'
    +   '<button class="btn btn-sm btn-secondary" id="uRefresh">' + svg('refresh', 14) + '刷新</button>'
    + '</div>'

    + '<div class="toolbar" style="background:var(--panel)">'
    +   '<button class="btn btn-sm" id="uAdd">' + svg('plus', 14) + '添加用户</button>'
    +   '<button class="btn btn-sm btn-secondary" id="uImport">' + svg('upload', 14) + 'Excel 导入</button>'
    +   '<button class="btn btn-sm btn-secondary" id="uExport">' + svg('download', 14) + '导出</button>'
    +   '<span style="flex:1"></span>'
    +   '<span data-bulk class="muted" style="font-size:.8rem"></span>'
    + '</div>'

    + '<section class="panel"><div id="uBody"><div class="loading"><div class="spinner"></div>加载中…</div></div></section>';

  $('uSearch').oninput = debounce(function(e){ S.q = e.target.value.trim(); S.page = 1; loadUsers(); }, 320);
  $('uRole').onchange   = function(e){ S.role = e.target.value; S.page = 1; loadUsers(); };
  $('uStatus').onchange = function(e){ S.status = e.target.value; S.page = 1; loadUsers(); };
  $('uRefresh').onclick = function(){ loadUsers(); };
  $('uAdd').onclick     = addUserDialog;
  $('uImport').onclick  = importDialog;

function loadUsers(){
  var S = STATE.users;
  var qs = '/admin?action=users&limit=' + S.size + '&offset=' + ((S.page - 1) * S.size)
         + '&q=' + encodeURIComponent(S.q || '');

  api(qs).then(function(j){
    S.list = j.users || [];
    S.total = j.total || 0;
    /* 保持已选中项（翻页后仍在） */
    paintUsers();
  }).catch(function(e){
    $('uBody').innerHTML = '<div class="alert danger" style="margin:18px">加载失败：' + esc(e.message) + '</div>';
  });
}

function paintUsers(){
  var S = STATE.users;
  var body = $('uBody');
  if(!body) return;

  if(!S.list.length){
    body.innerHTML = '<div class="empty">' + svg('inbox', 38) + '<p>没有匹配的用户</p></div>';
    return;
  }

  /* 前端筛选（角色/状态）：后端 users 接口目前只支持 q，
     角色与状态在本地过滤，保证筛选即时生效、不额外压后端。 */
  var list = S.list.filter(function(u){
    if(S.role && u.role !== S.role) return false;
    if(S.status && u.status !== S.status) return false;
    return true;
  });

  var allChecked = list.length > 0 && list.every(function(u){ return S.selected[u.id]; });

  var rows = list.map(function(u){
    var initial = String(u.displayName || u.username || '?').charAt(0).toUpperCase();
    var badges = '';
    if(u.role === 'admin') badges += '<span class="badge badge-orange">管理员</span> ';
    if(u.status === 'banned') badges += '<span class="badge badge-red">已禁用</span>';
    else badges += '<span class="badge badge-green">正常</span>';
    if(u.mustChangePassword) badges += ' <span class="badge badge-amber">待改密</span>';

    return '<tr' + (S.selected[u.id] ? ' class="sel"' : '') + '>'
      + '<td><input type="checkbox" class="chk" data-pick="' + u.id + '"' + (S.selected[u.id] ? ' checked' : '') + '></td>'
      + '<td><div class="cell-user"><div class="av">' + esc(initial) + '</div>'
      +   '<div><b>' + esc(u.displayName || u.username) + '</b>'
      +   '<i class="mono">' + esc(u.username) + '</i></div></div></td>'
      + '<td class="nowrap">' + badges + '</td>'
      + '<td class="nowrap muted">' + esc(u.lastLoginAt ? ago(u.lastLoginAt) : '从未登录') + '</td>'
      + '<td class="nowrap muted">' + esc(fmt(u.createdAt, 'date')) + '</td>'
      + '<td class="nowrap" style="text-align:right"><div class="row-actions">'
      +   '<button data-act="detail" data-id="' + u.id + '">详情</button>'
      +   '<button data-act="pwd" data-id="' + u.id + '">重置密码</button>'
      +   (u.status === 'banned'
            ? '<button class="ok" data-act="unban" data-id="' + u.id + '">解禁</button>'
            : '<button class="danger" data-act="ban" data-id="' + u.id + '">禁用</button>')
      + '</div></td>'
      + '</tr>';
  }).join('');

  var size = S.size;
  var shownTo = Math.min(S.page * size, S.total);

  body.innerHTML =
    '<div class="table-wrap"><table><thead><tr>'
    + '<th style="width:38px"><input type="checkbox" class="chk" data-pick-all' + (allChecked ? ' checked' : '') + '></th>'
    + '<th>用户</th><th class="nowrap">角色 / 状态</th><th class="nowrap">最后登录</th><th class="nowrap">创建时间</th>'
    + '<th style="text-align:right">操作</th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
    + '<div class="pager">'
    +   '<span class="info">共 ' + S.total + ' 人，当前显示第 ' + ((S.page - 1) * size + 1) + '–' + shownTo + ' 条</span>'
    +   '<span class="pages">'
    +     '<button data-pg="prev"' + (S.page <= 1 ? ' disabled' : '') + '>上一页</button>'
    +     '<button class="on">' + S.page + '</button>'
    +     '<button data-pg="next"' + (shownTo >= S.total ? ' disabled' : '') + '>下一页</button>'
    +   '</span>'
    + '</div>';

  /* --- 事件绑定 --- */
  Array.prototype.forEach.call(body.querySelectorAll('[data-pick]'), function(cb){
    cb.onchange = function(){ S.selected[cb.dataset.pick] = cb.checked; paintPick(); paintUsers(); };
  });
  var allCb = body.querySelector('[data-pick-all]');
  if(allCb){
    allCb.onchange = function(){
      list.forEach(function(u){ S.selected[u.id] = allCb.checked; });
      paintUsers();
    };
  }
  Array.prototype.forEach.call(body.querySelectorAll('[data-act]'), function(b){
    b.onclick = function(){ userAction(b.dataset.act, Number(b.dataset.id)); };
  });
  Array.prototype.forEach.call(body.querySelectorAll('[data-pg]'), function(b){
    b.onclick = function(){
      if(b.disabled) return;
      S.page += (b.dataset.pg === 'next' ? 1 : -1);
      loadUsers();
    };
  });

  paintPick();
}

/** 绘制批量操作提示条 */
function paintPick(){
  var S = STATE.users;
  var ids = Object.keys(S.selected).filter(function(k){ return S.selected[k]; });
  var el = document.querySelector('[data-bulk]');
  if(!el) return;
  if(!ids.length){
    el.textContent = '';
    el.className = 'muted';
    el.innerHTML = '';
    return;
  }
  el.className = '';
  el.innerHTML = '已选 <b style="color:var(--accent-ink)">' + ids.length + '</b> 人 '
    + '<button class="btn btn-sm btn-ghost" data-bulk-pwd style="margin-left:6px">批量重置密码</button> '
    + '<button class="btn btn-sm btn-ghost" data-bulk-ban style="margin-left:4px">批量禁用</button> '
    + '<button class="btn btn-sm btn-ghost" data-bulk-clear style="margin-left:4px">取消选择</button>';

  el.querySelector('[data-bulk-pwd]').onclick = function(){ bulkResetPwd(ids); };
  el.querySelector('[data-bulk-ban]').onclick = function(){ bulkBan(ids); };
  el.querySelector('[data-bulk-clear]').onclick = function(){
    STATE.users.selected = {}; paintUsers();
  };
}

/* ---------------- 用户操作分发 ---------------- */
function userAction(act, id){
  var u = STATE.users.list.find(function(x){ return x.id === id; });
  if(act === 'detail') return userDetailDialog(id);
  if(act === 'pwd')    return resetPwdDialog(id, u);
  if(act === 'ban')    return setStatus(id, u, 'banned');
  if(act === 'unban')  return setStatus(id, u, 'active');
}

function setStatus(id, u, status){
  var isBan = status === 'banned';
  confirmBox({
    title: isBan ? '禁用账号' : '解除禁用',
    text: isBan
      ? '确定禁用「' + (u && (u.displayName || u.username)) + '」吗？该账号将立即在所有设备退出登录，无法再登录。'
      : '确定解除「' + (u && (u.displayName || u.username)) + '」的禁用吗？',
    danger: isBan,
    okText: isBan ? '确认禁用' : '确认解禁'
  }).then(function(yes){
    if(!yes) return;
    api('/admin?action=set-status', { method:'POST', body:{ id:id, status:status } })
      .then(function(j){ toast(j.message || '操作成功', 'ok'); loadUsers(); })
      .catch(function(e){ toast(e.message, 'err', 4000); });
  });
}

function resetPwdDialog(id, u){
  var name = u ? (u.displayName || u.username) : ('#' + id);
  promptBox({
    title: '重置密码',
    sub: '为「' + name + '」设置一个新的初始密码',
    label: '新密码（6–64 位）',
    type: 'text',
    placeholder: '例如 Class2025',
    hint: '重置后该用户必须用新密码重新登录，且下次登录需自行修改密码。管理后台不保存、也无法查看明文密码。',
    okText: '确认重置',
    validate: function(v){ return (v.length < 6 || v.length > 64) ? '密码长度需 6–64 位' : ''; }
  }).then(function(v){
    if(v === null) return;
    api('/admin?action=reset-password', { method:'POST', body:{ id:id, newPassword:v } })
      .then(function(j){ toast(j.message || '已重置', 'ok', 4000); loadUsers(); })
      .catch(function(e){ toast(e.message, 'err', 4000); });
  });
}

/* ---------------- 批量操作 ---------------- */
function bulkResetPwd(ids){
  promptBox({
    title: '批量重置密码',
    sub: '已选择 ' + ids.length + ' 个账号',
    label: '统一的新初始密码（6–64 位）',
    placeholder: '例如 Class2025',
    hint: '这 ' + ids.length + ' 个账号都会被设为该密码，并强制下次登录时改密。',
    okText: '批量重置',
    validate: function(v){ return (v.length < 6 || v.length > 64) ? '密码长度需 6–64 位' : ''; }
  }).then(function(v){
    if(v === null) return;
    var ok = 0, bad = 0;
    var seq = Promise.resolve();
    ids.forEach(function(id){
      seq = seq.then(function(){
        return api('/admin?action=reset-password', { method:'POST', body:{ id:Number(id), newPassword:v } })
          .then(function(){ ok++; }).catch(function(){ bad++; });
      });
    });
    seq.then(function(){
      toast('批量重置完成：成功 ' + ok + ' 个' + (bad ? '，失败 ' + bad + ' 个' : ''), bad ? 'warn' : 'ok', 4200);
      STATE.users.selected = {};
      loadUsers();
    });
  });
}

function bulkBan(ids){
  confirmBox({
    title: '批量禁用',
    text: '确定为所选的 ' + ids.length + ' 个账号全部禁用吗？他们会被立刻踢下线且无法再登录。',
    danger: true, okText: '全部禁用'
  }).then(function(yes){
    if(!yes) return;
    var ok = 0, bad = 0;
    var seq = Promise.resolve();
    ids.forEach(function(id){
      seq = seq.then(function(){
        return api('/admin?action=set-status', { method:'POST', body:{ id:Number(id), status:'banned' } })
          .then(function(){ ok++; }).catch(function(){ bad++; });
      });
    });
    seq.then(function(){
      toast('批量禁用完成：成功 ' + ok + ' 个' + (bad ? '，失败 ' + bad + ' 个' : ''), bad ? 'warn' : 'ok', 4200);
      STATE.users.selected = {};
      loadUsers();
    });
  });
}

/* ---------------- 添加单个用户 ---------------- */

      + '<input id="auPwd" placeholder="6–64 位" autocomplete="new-password">'
      + '<p class="hint">同学首次登录后会被要求自行修改密码。后台不保存明文，只存哈希。</p></div>'

      + '<select id="auRole" style="height:46px;padding:0 12px;border:1px solid var(--border-2);border-radius:var(--radius-md);background:var(--bg-1);color:var(--fg);width:100%">'

    foot: '<button class="btn btn-ghost" data-close2>取消</button><button class="btn" id="auGo">创建账号</button>',
    onMount: function(box){
      box.querySelector('[data-close2]').onclick = closeModal;
      var go = function(){
        var msg = box.querySelector('#auMsg');
        var body = {
          username: box.querySelector('#auName').value.trim(),
          displayName: box.querySelector('#auDisp').value.trim(),
          password: box.querySelector('#auPwd').value,

        };

          toast(j.message || '已创建', 'ok', 3600);

          loadUsers();
        }).catch(function(e){
          msg.className = 'msg err show';
          msg.textContent = e.message;
          box.querySelector('#auGo').disabled = false;

      };
      box.querySelector('#auGo').onclick = go;
      setTimeout(function(){ box.querySelector('#auName').focus(); }, 80);

/* ---------------- 用户详情（含登录记录） ---------------- */
function userDetailDialog(id){
  openModal({
    title: '用户详情',
    wide: true,
    body: '<div class="loading"><div class="spinner"></div>加载中…</div>',
    onMount: function(box){
      api('/admin?action=user&id=' + id).then(function(j){
        var u = j.user || {};
        var data = j.data || [];
        var sess = j.sessions || [];

        var head =
          '<div class="stat-grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:20px">'
          + statMini('账号', u.username)
          + statMini('角色', u.role === 'admin' ? '管理员' : '普通用户')
          + statMini('状态', u.status === 'banned' ? '已禁用' : '正常')
          + statMini('云端数据', data.length + ' 条')
          + '</div>';

        var meta =
          '<div class="panel" style="margin-bottom:18px"><div class="panel-head"><h3>' + svg('user') + '基本信息</h3></div>'
          + '<div class="panel-body"><dl class="kv">'
          + '<dt>显示名</dt><dd>' + esc(u.displayName || '—') + '</dd>'
          + '<dt>创建时间</dt><dd>' + esc(fmt(u.createdAt)) + '</dd>'
          + '<dt>最后登录</dt><dd>' + esc(u.lastLoginAt ? fmt(u.lastLoginAt) + '（' + ago(u.lastLoginAt) + '）' : '从未登录') + '</dd>'
          + '<dt>在线会话</dt><dd>' + sess.length + ' 个' + (sess.length ? '（最近：' + esc(fmt(sess[0].createdAt)) + '）' : '') + '</dd>'
          + '</dl></div></div>';

        var loginBox = '<div class="panel" style="margin-bottom:18px">'
          + '<div class="panel-head"><div><h3>' + svg('clock') + '登录记录</h3>'
          + '<p class="sub">该用户的最近登录历史</p></div></div>'
          + '<div id="udLogins"><div class="loading" style="padding:26px"><div class="spinner"></div></div></div></div>';

        var dataBox = '<div class="panel"><div class="panel-head"><h3>' + svg('database') + '云端数据</h3></div>'
          + '<div class="panel-body">' + (data.length
              ? '<div class="table-wrap"><table><thead><tr><th>键</th><th>更新时间</th><th style="text-align:right">操作</th></tr></thead><tbody>'
                + data.map(function(d){
                    return '<tr><td class="mono">' + esc(d.key) + '</td>'
                      + '<td class="nowrap muted">' + esc(fmt(d.updatedAt)) + '</td>'
                      + '<td style="text-align:right"><div class="row-actions">'
                      + '<button data-view-key="' + attr(d.key) + '">查看</button>'
                      + '<button class="danger" data-del-key="' + attr(d.key) + '">删除</button>'
                      + '</div></td></tr>';
                  }).join('')
                + '</tbody></table></div>'
              : '<p class="muted" style="margin:0;font-size:.85rem">该用户还没有云端数据</p>')
          + '</div></div>';

        box.querySelector('.modal-body').innerHTML = head + meta + loginBox + dataBox;

        /* 加载登录记录 */
        api('/admin?action=login-logs&id=' + id + '&limit=20').then(function(lj){
          var logs = lj.logs || [];
          var el = box.querySelector('#udLogins');
          if(!el) return;
          el.innerHTML = logs.length
            ? '<div class="table-wrap"><table><thead><tr><th>时间</th><th>IP</th><th>设备</th></tr></thead><tbody>'
              + logs.map(function(l){
                  return '<tr><td class="nowrap">' + esc(fmt(l.createdAt)) + '</td>'
                    + '<td class="nowrap mono">' + esc(l.ip || '—') + '</td>'
                    + '<td class="muted" style="font-size:.75rem;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + attr(l.userAgent || '') + '">'
                    + esc(shortUA(l.userAgent)) + '</td></tr>';
                }).join('')
              + '</tbody></table></div>'
              + (lj.total > 20 ? '<p class="muted" style="padding:11px 14px 0;font-size:.76rem">共 ' + lj.total + ' 条，仅显示最近 20 条</p>' : '')
            : '<div class="empty" style="padding:30px"><p class="muted">暂无登录记录</p></div>';
        }).catch(function(){
          var el2 = box.querySelector('#udLogins');
          if(el2) el2.innerHTML = '<div class="alert danger" style="margin:16px">登录记录加载失败（可能未建 login_log 表）</div>';
        });

        /* 数据键操作 */
        Array.prototype.forEach.call(box.querySelectorAll('[data-view-key]'), function(b){
          b.onclick = function(){
            var k = b.dataset.viewKey;
            var item = data.find(function(d){ return d.key === k; });
            openModal({
              title: '数据详情',
              sub: k,
              wide: true,
              body: '<pre style="margin:0;padding:14px;background:var(--bg-2);border-radius:var(--radius-md);'
                  + 'font-size:.76rem;max-height:420px;overflow:auto;white-space:pre-wrap;word-break:break-all">'

              foot: '<button class="btn btn-ghost" data-close3>关闭</button>',
              onMount: function(b2){ b2.querySelector('[data-close3]').onclick = closeModal; }
            });
          };
        });
        Array.prototype.forEach.call(box.querySelectorAll('[data-del-key]'), function(b){
          b.onclick = function(){
            var k = b.dataset.delKey;
            confirmBox({ title:'删除数据', text:'确定删除键「' + k + '」吗？此操作不可恢复。', danger:true, okText:'删除' })
              .then(function(yes){
                if(!yes) return;
                api('/admin?action=delete-data', { method:'POST', body:{ userId:id, key:k } })
                  .then(function(){ toast('已删除', 'ok'); userDetailDialog(id); })
                  .catch(function(e){ toast(e.message, 'err'); });
              });
          };
        });
      }).catch(function(e){
        box.querySelector('.modal-body').innerHTML = '<div class="alert danger">加载失败：' + esc(e.message) + '</div>';
      });
    }
  });
}

function statMini(label, value){
  return '<div class="stat" style="padding:14px;box-shadow:none">'
    + '<p class="label" style="font-size:.72rem">' + esc(label) + '</p>'

/** UA 精简显示："Chrome · Windows" 这种 */
function shortUA(ua){
  if(!ua) return '—';
  var s = String(ua), out = [];
  if(/MicroMessenger/i.test(s)) out.push('微信');
  else if(/Edg\//.test(s)) out.push('Edge');
  else if(/Chrome\//.test(s) && !/Chromium/.test(s)) out.push('Chrome');
  else if(/Firefox\//.test(s)) out.push('Firefox');
  else if(/Safari\//.test(s)) out.push('Safari');
  if(/Windows NT/.test(s)) out.push('Windows');
  else if(/Macintosh/.test(s)) out.push('macOS');
  else if(/Android/.test(s)) out.push('Android');
  else if(/iPhone|iPad/.test(s)) out.push('iOS');
  else if(/Linux/.test(s)) out.push('Linux');
  return out.length ? out.join(' · ') : s.slice(0, 40);
}

/* ============================================================================
 * ⑧ Excel 导入（对标 VoiceHub：三源 CDN + 标题行检测 + 预览 + 分批进度）
 * ========================================================================= */
var _xlsxLoading = null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(_xlsxLoading) return _xlsxLoading;

  /* 三个 CDN 依次回退：jsdelivr 国内有时不稳，unpkg / cdnjs 兜底 */
  var urls = [
    'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
    'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
  ];

  _xlsxLoading = new Promise(function(resolve){
    var i = 0;
    (function next(){
      if(i >= urls.length){ resolve(null); return; }
      var url = urls[i++];
      var s = document.createElement('script');
      s.src = url;
      s.async = true;
      s.onload = function(){ resolve(window.XLSX || null); };
      s.onerror = function(){ s.remove(); next(); };
      document.head.appendChild(s);
    })();
  });
  return _xlsxLoading;
}

/** 导出时把某个字段格式化成可读文本（角色/状态转中文，时间转本地） */
function cellText(key, u){
  switch(key){
    case 'role':        return u.role === 'admin' ? '管理员' : '普通用户';
    case 'status':      return u.status === 'banned' ? '已禁用' : '正常';
    case 'mustChangePassword': return u.mustChangePassword ? '是' : '否';
    case 'createdAt':   return fmt(u.createdAt);
    case 'lastLoginAt': return u.lastLoginAt ? fmt(u.lastLoginAt) : '从未登录';
    case 'loginCount':  return u.loginCount || 0;
    case 'dataCount':   return u.dataCount || 0;
    case 'displayName': return u.displayName || '';
    default:            return u[key] === null || u[key] === undefined ? '' : u[key];
  }
}

      + '<div class="search" style="margin-bottom:10px">' + svg('search', 15) + '<input id="anSearch" placeholder="搜索用户名，点击添加…"></div>'
      + '<div class="picker" id="anPicker"><div class="loading" style="padding:20px"><div class="spinner"></div></div></div>'
      + '<div class="chips" id="anChips"></div>'
      + '</div>'
      + '<div class="msg" id="anMsg"></div>',
    foot: '<button class="btn btn-ghost" data-close6>取消</button>'
          + '<button class="btn" id="anGo">' + (editing ? '保存修改' : '发布公告') + '</button>',
    onMount: function(box){
      box.querySelector('[data-close6]').onclick = closeModal;
      var picker = box.querySelector('#anPicker');
      var chips  = box.querySelector('#anChips');
      var scope  = box.querySelector('#anScope');
      var msg    = box.querySelector('#anMsg');
      var allUsers = [];

      function paintChips(){
        chips.innerHTML = targets.map(function(t, i){
          return '<span class="chip">' + esc(t) + '<b data-rm="' + i + '">×</b></span>';
        }).join('');
        Array.prototype.forEach.call(chips.querySelectorAll('[data-rm]'), function(b){
          b.onclick = function(){ targets.splice(Number(b.dataset.rm), 1); paintChips(); };
        });
        scope.textContent = targets.length ? '已选 ' + targets.length + ' 人' : '当前：全体同学';
      }

      function paintPicker(kw){
        var list = allUsers.filter(function(u){
          if(!kw) return true;
          return (u.username + ' ' + (u.displayName || '')).toLowerCase().indexOf(kw.toLowerCase()) >= 0;
        }).slice(0, 60);
        if(!list.length){
          picker.innerHTML = '<p class="muted" style="padding:14px;font-size:.82rem;margin:0">没有匹配的用户</p>';
          return;
        }
        picker.innerHTML = list.map(function(u){
          var on = targets.indexOf(u.username) >= 0;
          return '<label class="picker-row">'
            + '<input type="checkbox" data-u="' + attr(u.username) + '"' + (on ? ' checked' : '') + '>'
            + '<b>' + esc(u.displayName || u.username) + '</b>'
            + '<i class="mono">' + esc(u.username) + '</i>'
            + '</label>';
        }).join('');
        Array.prototype.forEach.call(picker.querySelectorAll('[data-u]'), function(cb){
          cb.onchange = function(){
            var name = cb.dataset.u;
            var at = targets.indexOf(name);
            if(cb.checked){ if(at < 0) targets.push(name); }
            else if(at >= 0) targets.splice(at, 1);
            paintChips();
          };
        });
      }

      /* 拉用户列表填选择器 */
      api('/admin?action=users&limit=500').then(function(j){
        allUsers = j.users || [];
        paintPicker('');
      }).catch(function(){
        picker.innerHTML = '<p class="muted" style="padding:14px;font-size:.82rem;margin:0">用户列表加载失败</p>';
      });

      box.querySelector('#anSearch').oninput = debounce(function(e){
        paintPicker(e.target.value.trim());
      }, 260);
      box.querySelector('#anAll').onclick = function(){
        targets.length = 0;
        paintChips();
        paintPicker(box.querySelector('#anSearch').value.trim());
      };

      paintChips();

      box.querySelector('#anGo').onclick = function(){
        var title = box.querySelector('#anTitle').value.trim();
        var bodyV = box.querySelector('#anBody').value;
        if(!title){ msg.className = 'msg err show'; msg.textContent = '请填写标题'; return; }

        var rec = {
          id: item ? item.id : ('a' + Date.now()),
          title: title,
          body: bodyV,
          targets: targets.slice(),
          createdAt: item ? item.createdAt : new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };

        var list = STATE.announcements.slice();
        if(editing) list[idx] = rec; else list.unshift(rec);

        box.querySelector('#anGo').disabled = true;
        saveSiteData(SITE_KEY_ANNOUNCE, list).then(function(){
          STATE.announcements = list;
          toast(editing ? '已保存修改' : '公告已发布', 'ok');
          closeModal();
          paintAnnouncements();
        }).catch(function(e){
          msg.className = 'msg err show';
          msg.textContent = e.message;
          box.querySelector('#anGo').disabled = false;
        });
      };
    }
  });
}

/* ============================================================================

/* 预设的内容类型，覆盖班级站常见区块 */
var CONTENT_KINDS = ['通知', '作业', '活动', '课程表', '值日安排', '其他'];

function paintContent(){
  var list = STATE.content;
  $('view').innerHTML =
    '<div class="alert info">这里管理班级站首页的各个内容区块。修改后同学刷新页面即可看到最新内容。</div>'
    + '<div class="toolbar" style="background:var(--panel)">'
    +   '<button class="btn btn-sm" id="ctAdd">' + svg('plus', 14) + '新增内容</button>'
    +   '<span style="flex:1"></span>'
    +   '<span class="muted" style="font-size:.8rem">共 ' + list.length + ' 项</span>'
    + '</div>'
    + '<section class="panel">' + (list.length
        ? '<div class="table-wrap"><table><thead><tr>'
          + '<th>类型</th><th>标题</th><th>内容</th><th class="nowrap">更新时间</th><th style="text-align:right">操作</th>'
          + '</tr></thead><tbody>'
          + list.map(function(c, i){
              return '<tr>'
                + '<td class="nowrap"><span class="badge badge-orange">' + esc(c.kind || '其他') + '</span></td>'
                + '<td><b>' + esc(c.title || '') + '</b></td>'
                + '<td class="muted" style="font-size:.78rem;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(c.body || '') + '</td>'
                + '<td class="nowrap muted">' + esc(c.updatedAt ? ago(c.updatedAt) : '—') + '</td>'
                + '<td style="text-align:right"><div class="row-actions">'
                + '<button data-ct-edit="' + i + '">编辑</button>'
                + '<button class="danger" data-ct-del="' + i + '">删除</button>'
                + '</div></td></tr>';
            }).join('')
          + '</tbody></table></div>'
        : '<div class="empty">' + svg('layers', 38) + '<p>还没有内容项</p></div>')
    + '</section>';

  $('ctAdd').onclick = function(){ contentDialog(null); };
  Array.prototype.forEach.call($('view').querySelectorAll('[data-ct-edit]'), function(b){
    b.onclick = function(){ contentDialog(Number(b.dataset.ctEdit)); };
  });
  Array.prototype.forEach.call($('view').querySelectorAll('[data-ct-del]'), function(b){
    b.onclick = function(){
      var i = Number(b.dataset.ctDel);
      confirmBox({ title:'删除内容', text:'确定删除「' + (list[i].title || '') + '」吗？', danger:true, okText:'删除' })
        .then(function(yes){
          if(!yes) return;
          list.splice(i, 1);
          saveSiteData(SITE_KEY_CONTENT, list).then(function(){
            toast('已删除', 'ok'); paintContent();
          }).catch(function(e){ toast(e.message, 'err'); });
        });
    };
  });
}

function contentDialog(idx){

  var item = editing ? STATE.content[idx] : null;

    body:

      + CONTENT_KINDS.map(function(k){
          return '<option value="' + attr(k) + '"' + (item && item.kind === k ? ' selected' : '') + '>' + esc(k) + '</option>';

      + '</select></div>'
      + '<div class="field"><label for="ctTitle">标题 <span style="color:var(--danger)">*</span></label>'

      + '<div class="field"><label for="ctBody">内容</label>'
      + '<textarea id="ctBody" rows="6" placeholder="支持多行文本">' + esc(item ? item.body : '') + '</textarea></div>'
      + '<div class="msg" id="ctMsg"></div>',
    foot: '<button class="btn btn-ghost" data-close7>取消</button>'
          + '<button class="btn" id="ctGo">' + (editing ? '保存修改' : '新增') + '</button>',
    onMount: function(box){

        if(!title){ msg.className = 'msg err show'; msg.textContent = '请填写标题'; return; }

          id: item ? item.id : ('c' + Date.now()),
          kind: box.querySelector('#ctKind').value,
          title: title,
          body: box.querySelector('#ctBody').value,

          msg.textContent = e.message;
          box.querySelector('#ctGo').disabled = false;
        });

  });

/* ============================================================================
 * ⑫ 面板：班级资料管理（通讯录）
 * ---------------------------------------------------------------------------
 * 后端 /admin?action=profiles 返回：
 *   { total, counts:{total,pending,approved,claimed}, profiles:[{ id, name,
 *     studentId, politics, examNo, role, wechat, qq, phone, contactStatus,
 *     rejectReason, userId, boundUsername, createdAt, updatedAt }] }
 *
 * 注意：这里的联系方式是**管理端明文视图**，只有管理员能看到。
 * 同学那边未审核通过时只会拿到打码号码（见 api/profile.js 的 shapeProfile）。
 * ========================================================================= */
var CONTACT_LABEL = {
  none:     { text:'未填写',  cls:'badge-gray'  },
  pending:  { text:'待审核',  cls:'badge-amber' },
  approved: { text:'已通过',  cls:'badge-green' },
  rejected: { text:'已驳回',  cls:'badge-red'   }
};

function renderProfiles(){
  var S = STATE.profiles;
  var c = S.counts || {};

  $('view').innerHTML =
    '<div class="toolbar" style="background:var(--panel)">'
    +   '<div class="search">' + svg('search')
    +     '<input id="pfSearch" placeholder="搜索姓名或学号…" value="' + attr(S.q) + '" maxlength="40">'
    +   '</div>'
    +   '<div class="chips" id="pfChips">'
    +     '<button class="chip' + (S.status === '' ? ' on' : '') + '" data-st="">全部 <b>' + (c.total || 0) + '</b></button>'
    +     '<button class="chip' + (S.status === 'pending' ? ' on' : '') + '" data-st="pending">待审核 <b>' + (c.pending || 0) + '</b></button>'
    +     '<button class="chip' + (S.status === 'approved' ? ' on' : '') + '" data-st="approved">已通过 <b>' + (c.approved || 0) + '</b></button>'
    +   '</div>'
    +   '<span style="flex:1"></span>'
    +   '<button class="btn btn-sm btn-secondary" id="pfRefresh">' + svg('refresh', 14) + '刷新</button>'
    + '</div>'

    + '<div class="toolbar" style="background:var(--panel)">'
    +   '<button class="btn btn-sm" id="pfAdd">' + svg('plus', 14) + '新增资料</button>'
    +   '<button class="btn btn-sm btn-secondary" id="pfImport">' + svg('upload', 14) + 'Excel 导入</button>'
    +   '<button class="btn btn-sm btn-secondary" id="pfExport">' + svg('download', 14) + '导出</button>'
    +   '<span style="flex:1"></span>'
    +   '<span class="muted" style="font-size:.78rem" id="pfClaim"></span>'
    + '</div>'

    + '<div class="alert info" style="margin-bottom:16px">'
    +   '这里存的是全班通讯录，<b>只有管理员能看到明文</b>。同学查询需要先登录，'
    +   '且只有审核通过的微信号 / QQ / 手机号才会展示给对方，未通过的只显示打码号码。'
    +   '每一次查询都会记进「查看记录」。'
    + '</div>'

    + '<section class="panel"><div id="pfBody"><div class="loading"><div class="spinner"></div>加载中…</div></div></section>';

  $('pfSearch').oninput = debounce(function(e){
    S.q = e.target.value.trim(); loadProfiles();
  }, 320);
  $('pfRefresh').onclick = function(){ loadProfiles(); };
  $('pfAdd').onclick     = function(){ profileDialog(null); };
  $('pfImport').onclick  = profileImportDialog;
  $('pfExport').onclick  = profileExport;

  Array.prototype.forEach.call($('pfChips').querySelectorAll('[data-st]'), function(b){
    b.onclick = function(){
      S.status = b.dataset.st;
      Array.prototype.forEach.call($('pfChips').querySelectorAll('.chip'), function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      loadProfiles();
    };
  });

  loadProfiles();
}

function loadProfiles(){
  var S = STATE.profiles;
  api('/admin?action=profiles&q=' + encodeURIComponent(S.q || '')
      + '&status=' + encodeURIComponent(S.status || '')).then(function(j){
    S.list   = j.profiles || [];
    S.total  = j.total || 0;
    S.counts = j.counts || {};
    paintProfiles();
  }).catch(function(e){
    var b = $('pfBody');
    if(b) b.innerHTML = '<div class="alert danger" style="margin:18px">加载失败：' + esc(e.message) + '</div>';
  });
}

function paintProfiles(){
  var S = STATE.profiles;
  var body = $('pfBody');
  if(!body) return;

  /* 顶部的已认领统计 */
  var c = S.counts || {};
  var claim = $('pfClaim');
  if(claim){
    claim.innerHTML = '已认领 <b style="color:var(--accent-ink)">' + (c.claimed || 0) + '</b> / ' + (c.total || 0) + ' 条';
  }

  /* 筛选胶囊上的数字要跟着最新统计刷新 */
  var chipAll = $('pfChips') && $('pfChips').querySelector('[data-st=""] b');
  var chipPen = $('pfChips') && $('pfChips').querySelector('[data-st="pending"] b');
  var chipApp = $('pfChips') && $('pfChips').querySelector('[data-st="approved"] b');
  if(chipAll) chipAll.textContent = c.total || 0;
  if(chipPen) chipPen.textContent = c.pending || 0;
  if(chipApp) chipApp.textContent = c.approved || 0;

  if(!S.list.length){
    body.innerHTML = '<div class="empty">' + svg('inbox', 38)
      + '<p>' + (S.q || S.status ? '没有匹配的资料' : '还没有任何班级资料') + '</p>'
      + (S.q || S.status ? '' : '<p style="font-size:.78rem;margin-top:8px">点上面「新增资料」或「Excel 导入」把通讯录搬进来</p>')
      + '</div>';
    return;
  }

  var rows = S.list.map(function(p){
    var st  = CONTACT_LABEL[p.contactStatus] || CONTACT_LABEL.none;
    var ini = String(p.name || p.studentId || '?').charAt(0);

    /* 联系方式：三个字段紧凑铺开，空的显示「—」 */
    var ct = function(label, v){
      return '<div class="ct"><i>' + label + '</i>'
        + (v ? '<span title="' + attr(v) + '">' + esc(v) + '</span>'
             : '<span class="none">—</span>')
        + '</div>';
    };
    var contacts = '<div class="ct-grid">'
      + ct('微信', p.wechat) + ct('QQ', p.qq) + ct('手机', p.phone)
      + '</div>';

    var owner = p.boundUsername
      ? '<span class="badge badge-blue">已认领 · ' + esc(p.boundUsername) + '</span>'
      : '<span class="badge badge-gray">未认领</span>';

    return '<tr>'
      + '<td><div class="cell-user"><div class="av">' + esc(ini) + '</div>'
      +   '<div><b>' + esc(p.name || '(未填姓名)') + '</b>'
      +   '<i class="mono">' + esc(p.studentId || '无学号') + '</i></div></div></td>'
      + '<td class="nowrap">' + esc(p.politics || '—') + '</td>'
      + '<td class="mono nowrap">' + (p.examNo ? esc(p.examNo) : '<span class="muted">—</span>') + '</td>'
      + '<td>' + contacts + '</td>'
      + '<td class="nowrap"><span class="badge ' + st.cls + '">' + st.text + '</span>'
      +   (p.contactStatus === 'rejected' && p.rejectReason
            ? '<div class="muted" style="font-size:.7rem;margin-top:4px;max-width:150px" title="' + attr(p.rejectReason) + '">' + esc(p.rejectReason) + '</div>'
            : '')
      + '</td>'
      + '<td class="nowrap">' + owner + '</td>'
      + '<td class="nowrap" style="text-align:right"><div class="row-actions">'
      +   '<button data-pf="edit" data-id="' + p.id + '">编辑</button>'
      +   '<button data-pf="views" data-id="' + p.id + '">查看记录</button>'
      +   '<button class="danger" data-pf="del" data-id="' + p.id + '">删除</button>'
      + '</div></td>'
      + '</tr>';
  }).join('');

  body.innerHTML =
    '<div class="table-wrap"><table><thead><tr>'
    + '<th>姓名 / 学号</th><th class="nowrap">政治面貌</th><th class="nowrap">准考证号</th><th>联系方式</th>'
    + '<th class="nowrap">审核状态</th><th class="nowrap">归属账号</th>'
    + '<th style="text-align:right">操作</th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
    + '<div class="pager"><span class="info">共 ' + S.list.length + ' 条'
    +   (S.list.length >= 1000 ? '（已达单次上限 1000，请用搜索缩小范围）' : '') + '</span></div>';

  Array.prototype.forEach.call(body.querySelectorAll('[data-pf]'), function(b){
    var id = Number(b.dataset.id);
    if(b.dataset.pf === 'edit')  b.onclick = function(){ profileDialog(S.list.find(function(x){ return x.id === id; })); };
    if(b.dataset.pf === 'del')   b.onclick = function(){ deleteProfileDialog(S.list.find(function(x){ return x.id === id; })); };
    if(b.dataset.pf === 'views') b.onclick = function(){ profileViewsDialog(id); };
  });
}

/**
 * 新增 / 编辑资料。
 * 传 null = 新增；传资料对象 = 编辑。
 */
function profileDialog(p){
  var isNew = !p;
  var POL = ['普通学生', '共青团员', '共青团员 · 团支书', '中共党员', '中共预备党员', '群众'];

  function opts(cur){
    var list = POL.slice();
    if(cur && list.indexOf(cur) < 0) list.unshift(cur);
    return list.map(function(x){
      return '<option value="' + attr(x) + '"' + (x === cur ? ' selected' : '') + '>' + esc(x) + '</option>';
    }).join('');
  }

  openModal({
    title: isNew ? '新增班级资料' : ('编辑 ' + (p.name || p.studentId || '资料')),

    body:
      '<div class="field"><label for="pfName">姓名</label>'

      + '<div class="field"><label for="pfSid">学号</label>'

      + '<div class="field"><label for="pfPol">政治面貌</label>'
      + '<select id="pfPol">' + opts(p ? p.politics : '群众') + '</select></div>'

      + '<div class="field"><label for="pfEx">智学网准考证号</label>'
      + '<input id="pfEx" class="inp" maxlength="24" value="' + attr(p ? p.examNo : '') + '" placeholder="如 11399395">'
      + '<p class="hint">不属于隐私字段，同学查询时就能直接看到，不需要审核。</p></div>'

      + '<div class="field"><label>联系方式</label>'
      +   '<div class="ct-grid" style="gap:10px">'
      +     '<input id="pfWx" class="inp" maxlength="64" placeholder="微信号" value="' + attr(p ? p.wechat : '') + '">'
      +     '<input id="pfQq" class="inp" maxlength="64" placeholder="QQ 号" value="' + attr(p ? p.qq : '') + '">'
      +     '<input id="pfPh" class="inp" maxlength="64" placeholder="手机号" value="' + attr(p ? p.phone : '') + '">'

      + '<select id="pfSt">'
      +   '<option value="none"' + (p && p.contactStatus === 'none' ? ' selected' : '') + '>未填写 — 不对外展示</option>'
      +   '<option value="approved"' + ((p && p.contactStatus === 'approved') || isNew ? ' selected' : '') + '>已通过 — 同学查询时可见</option>'
      +   '<option value="pending"' + (p && p.contactStatus === 'pending' ? ' selected' : '') + '>待审核 — 暂不展示</option>'

      + '</select></div>'

      + '<div class="msg" id="pfMsg"></div>',

    foot: '<button class="btn btn-ghost" data-no>取消</button>'
        + '<button class="btn" data-yes>' + (isNew ? '新增' : '保存') + '</button>',

    onMount: function(box){
      var msg = box.querySelector('#pfMsg');
      box.querySelector('[data-no]').onclick = closeModal;
      box.querySelector('[data-yes]').onclick = function(){
        var btn = this;
        var payload = {
          name:      box.querySelector('#pfName').value.trim(),
          studentId: box.querySelector('#pfSid').value.trim(),
          politics:  box.querySelector('#pfPol').value,

/**
 * Excel 批量导入资料。
 * 表头：姓名 / 学号 / 政治面貌 / 准考证号 / 微信 / QQ / 手机号
 * 按学号优先匹配（没有学号则按姓名），命中就更新、没命中就新增。
 * 后端单批上限 60 条，所以这里分片串行提交。
 */
function profileImportDialog(){
  openModal({
    title: 'Excel 批量导入资料',
    sub: '表头需包含：姓名 / 学号 / 政治面貌 / 准考证号 / 微信 / QQ / 手机号',
    wide: true,
    body:
      '<div class="alert info" style="margin-bottom:16px">'
      +   '按 <b>学号</b> 匹配已有资料（没有学号则按姓名），命中就更新、没命中就新增。'
      +   '导入的数据会连带把联系方式记为「已通过」。单次请控制在 900 条以内。'
      + '</div>'
      + '<div class="field"><label for="pfFile">选择 Excel 文件（.xlsx / .xls）</label>'
      + '<input id="pfFile" type="file" accept=".xlsx,.xls" style="height:auto;padding:10px 12px">'
      + '<p class="hint">可以从上一行的「导出」拿到模板，填好再导回来。</p></div>'
      + '<div class="msg" id="pfImpMsg"></div>',
    foot: '<button class="btn btn-ghost" data-no>取消</button>'
        + '<button class="btn" data-yes disabled>开始导入</button>',
    onMount: function(box){
      var file = box.querySelector('#pfFile');
      var msg  = box.querySelector('#pfImpMsg');
      var yes  = box.querySelector('[data-yes]');
      box.querySelector('[data-no]').onclick = closeModal;

      file.onchange = function(){
        var f = file.files[0];
        yes.disabled = !f;
        if(f){
          msg.className = 'msg show';
          msg.style.background = 'var(--info-bg)';
          msg.style.color = 'var(--info)';
          msg.textContent = '已选择：' + f.name + '（' + bytes(f.size) + '）';
        }
      };

      yes.onclick = function(){
        var f = file.files[0];
        if(!f) return;
        var btn = yes;
        btn.disabled = true;
        msg.className = 'msg show';
        msg.style.background = 'var(--info-bg)';
        msg.style.color = 'var(--info)';
        msg.textContent = '正在解析文件…';

        var reader = new FileReader();
        reader.onload = function(ev){
          var rows;
          try{
            var wb = XLSX.read(new Uint8Array(ev.target.result), { type:'array' });
            var ws = wb.Sheets[wb.SheetNames[0]];
            rows = XLSX.utils.sheet_to_json(ws, { defval:'' });
          }catch(err){
            msg.className = 'msg err show';
            msg.textContent = '解析失败：' + err.message;
            btn.disabled = false;
            return;
          }
          if(!rows.length){
            msg.className = 'msg err show';
            msg.textContent = '文件里没有读到数据行';
            btn.disabled = false;
            return;
          }

          /* 表头别名兼容：有人写「学号」，有人写「学籍号」 */
          var pick = function(o, keys){
            for(var i = 0; i < keys.length; i++){
              var k = Object.keys(o).find(function(x){ return String(x).trim() === keys[i]; });
              if(k && String(o[k]).trim() !== '') return String(o[k]).trim();
            }
            return '';
          };
          var list = rows.map(function(r){
            return {
              name:      pick(r, ['姓名','名字','学生姓名']),
              studentId: pick(r, ['学号','学籍号']),
              politics:  pick(r, ['政治面貌','面貌']),
              examNo:    pick(r, ['准考证号','智学网准考证号','智学网号']),
              wechat:    pick(r, ['微信','微信号']),
              qq:        pick(r, ['QQ','QQ号']),
              phone:     pick(r, ['手机号','手机','电话','手机号码'])
            };
          }).filter(function(x){ return x.name || x.studentId; });

          if(!list.length){
            msg.className = 'msg err show';
            msg.textContent = '没有一行同时含「姓名」或「学号」，请检查表头';
            btn.disabled = false;
            return;
          }

          /* 分片串行提交，避免一次性压垮 Worker */
          var CHUNK = 60;
          var chunks = [];
          for(var i = 0; i < list.length; i += CHUNK) chunks.push(list.slice(i, i + CHUNK));

          var created = 0, updated = 0, failed = 0, firstErr = '';
          var idx = 0;

          var step = function(){
            if(idx >= chunks.length) return finish();
            var n = idx + 1;
            msg.textContent = '正在导入… 第 ' + n + '/' + chunks.length + ' 批（' + (idx * CHUNK) + ' / ' + list.length + ' 条）';
            return api('/admin?action=batch-profiles', { method:'POST', body: { rows: chunks[idx] } })
              .then(function(j){
                created += j.created || 0;
                updated += j.updated || 0;
                failed  += j.failed  || 0;
                if(!firstErr && j.errors && j.errors.length){
                  firstErr = '第 ' + (idx * CHUNK + j.errors[0].index + 1) + ' 行：' + j.errors[0].reason;
                }
                idx++;
                return step();
              });
          };

          var finish = function(){
            var parts = ['新增 ' + created + ' 条', '更新 ' + updated + ' 条'];
            if(failed) parts.push('失败 ' + failed + ' 条');
            msg.className = 'msg ' + (failed ? 'warn' : 'ok') + ' show';
            msg.textContent = '导入完成：' + parts.join('，') + (firstErr ? ('\n首个错误 ' + firstErr) : '');
            toast('导入完成，新增 ' + created + ' 更新 ' + updated, 'ok', 4000);
            loadProfiles();
            btn.textContent = '再导一次';
            btn.disabled = false;
          };

          step().catch(function(e){
            msg.className = 'msg err show';
            msg.textContent = '导入中断：' + e.message + '\n（已成功的批次已入库，可以修完数据再导一次，重复的会走更新）';
            btn.disabled = false;
            loadProfiles();
          });
        };
        reader.onerror = function(){
          msg.className = 'msg err show';
          msg.textContent = '读取文件失败';
          btn.disabled = false;
        };
        reader.readAsArrayBuffer(f);
      };
    }
  });
}

          + '</div>'

  Array.prototype.forEach.call(body.querySelectorAll('[data-rv-ok]'), function(b){
    b.onclick = function(){
      b.disabled = true;
      reviewContact(Number(b.dataset.rvOk), true);
    };
  });
  Array.prototype.forEach.call(body.querySelectorAll('[data-rv-no]'), function(b){
    b.onclick = function(){ reviewContact(Number(b.dataset.rvNo), false); };
  });

function reviewContact(id, approve){
  var r = STATE.reviews.list.find(function(x){ return x.id === id; });
  var who = r ? (r.name || r.studentId || ('#' + id)) : ('#' + id);

  var go = function(reason){
    api('/admin?action=review-contact', {
      method: 'POST',
      body: { id: id, approve: approve, reason: reason || '' }
    }).then(function(j){
      toast(j.message || '已处理', approve ? 'ok' : '');
      loadReviews();
    }).catch(function(e){
      toast(e.message, 'err', 4000);
      loadReviews();
    });
  };

  if(approve){
    return confirmBox({
      title: '通过联系方式',
      html: '确定通过 <b>' + esc(who) + '</b> 的联系方式吗？',
      detail: '通过后，全班同学登录查询时就能看到他的微信号 / QQ / 手机号。',
      okText: '通过'
    }).then(function(yes){ if(yes) go(''); });
  }

  promptBox({
    title: '驳回联系方式',
    sub: '驳回了 ' + who,
    label: '驳回原因（本人可见）',
    value: '号码有误，请核对后重新提交',
    maxlength: 200,
    placeholder: '如：号码有误 / 非本人账号',
    hint: '留空也可以，默认记为「管理员驳回」。',
    okText: '确认驳回'
  }).then(function(reason){
    if(reason === null) return;
    go(reason);
  });
}

  S.page = page || 1;

    paintViewLogs();
  }).catch(function(e){
