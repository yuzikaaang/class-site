<!DOCTYPE html>
<html lang="zh-CN" data-theme="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>管理后台 · 25级05班班级服务站</title>
<link rel="icon" href="favicon.svg">
<style>
/* ============================================================
 * 25级05班班级服务站 · 管理后台
 * ------------------------------------------------------------
 * 【设计 token】全部沿用主站 index.html 的「暖阳橙双轨配色」：
 *     --grad-*  鲜艳渐变 → 只做装饰（图标底、光晕、顶部条）
 *     --btn-*   深色版   → 承载白字（鲜艳橙配白字对比度不达标）
 *     --accent-ink 强调文字
 *   换主题只需改本区块，其余样式不用动。
 *
 * 【布局参照】VoiceHub 后台：
 *     固定侧栏 w-256 + 毛玻璃顶栏 h-64 + 内容区滚动
 *     SP版侧栏移出屏幕，汉堡按钮 + 遮罩唤出
 *   但配色、圆角、阴影全部走本班站的暖调语言，不套用它的黑白。
 * ============================================================ */

/* ---------------- 设计 token（与主站 index.html 一致） ---------------- */
:root{
  /* 签名渐变（装饰用，不放白字） */
  --grad-a:#f97316; --grad-b:#fb923c;
  /* 按钮/承载白字的深色版（白字实测 9.37:1 / 7.31:1） */
  --btn-a:#7c2d12; --btn-b:#9a3412;
  /* 强调文字（四种底色实测全部 ≥4.5:1） */
  --accent-ink:#af410f;
  /* 暖调中性底 */
  --bg-1:#fffbf7; --bg-2:#fff7f0; --bg-3:#fdede0;
  --tint:#fff1e7; --tint-2:#fee2d5;
  /* 文本 */
  --fg:#292524; --fg-2:#57534e; --fg-3:#6e635a; --fg-muted:#6e635a;
  /* 阴影：分层，带色调而非纯黑 */
  --sh-sm:0 1px 3px rgba(120,53,15,.06);
  --sh-md:0 4px 6px rgba(120,53,15,.07);
  --sh-lg:0 10px 15px rgba(120,53,15,.08);
  --sh-xl:0 20px 25px rgba(120,53,15,.10);
  --sh-accent:0 4px 14px rgba(194,65,12,.25);
  --sh-accent-lg:0 8px 24px rgba(194,65,12,.35);
  /* 语义色 */
  --ok:#0a7d42; --ok-bg:#e6f9f0;
  --warn:#b45309; --warn-bg:#ffedd5;
  --danger:#c0392b; --danger-bg:#fdeaea;
  --info:#1d4ed8; --info-bg:#e8effd;
  /* 面板/边框 */
  --panel:#ffffff;
  --border:rgba(120,53,15,.09);
  --border-2:rgba(120,53,15,.16);
  /* 侧栏宽 + 顶栏高 */
  --side-w:256px; --head-h:64px;
  /* 动效 */
  --ease-out:cubic-bezier(.16,1,.3,1);
  --t-fast:.15s; --t-base:.2s; --t-slow:.3s;
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:22px;
}
/* 暗色模式：近黑中性底（亮暗两套都保持暖调倾向） */
html[data-theme="dark"]{
  --grad-a:#fb923c; --grad-b:#fdba74;
  --btn-a:#7c2d12; --btn-b:#9a3412;
  --accent-ink:#fb923c;
  --bg-1:#1c1a18; --bg-2:#1f1d1e; --bg-3:#252324;
  --tint:rgba(251,146,60,.12); --tint-2:rgba(251,146,60,.2);
  --fg:#f5f5f4; --fg-2:#d6d3d1; --fg-3:#a8a29e; --fg-muted:#a8a29e;
  --panel:#232120;
  --border:rgba(251,146,60,.14);
  --border-2:rgba(251,146,60,.24);
  --ok:#4ade80; --ok-bg:rgba(74,222,128,.14);
  --warn:#fbbf24; --warn-bg:rgba(251,191,36,.14);
  --danger:#f87171; --danger-bg:rgba(248,113,113,.14);
  --info:#93b4fd; --info-bg:rgba(147,180,253,.14);
  --sh-sm:0 1px 3px rgba(0,0,0,.3);
  --sh-md:0 4px 6px rgba(0,0,0,.35);
  --sh-lg:0 10px 15px rgba(0,0,0,.4);
  --sh-xl:0 20px 25px rgba(0,0,0,.45);
  --sh-accent:0 4px 14px rgba(251,146,60,.28);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--fg);font-size:15px;line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  background:linear-gradient(135deg,var(--bg-1) 0%,var(--bg-2) 50%,var(--bg-3) 100%);
  -webkit-font-smoothing:antialiased;
}
/* 顶部径向辉光（沿用主站的氛围做法） */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(80% 50% at 50% -12%,rgba(249,115,22,.10),rgba(255,255,255,0) 70%);
}
a{color:var(--accent-ink);text-decoration:none}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(120,53,15,.18);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(120,53,15,.3)}

/* ============================================================
 * ① 登录门（未登录时全屏拦截）
 * ============================================================ */
#gate{
  position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;
  padding:20px;background:linear-gradient(135deg,var(--bg-1),var(--bg-3));
}
#gate.hide{display:none}
.gate-card{
  width:100%;max-width:400px;background:var(--panel);border-radius:var(--radius-xl);
  padding:36px 30px;box-shadow:var(--sh-xl);border:1px solid var(--border);
  border-top:4px solid var(--grad-a);position:relative;z-index:1;
  animation:rise-in .5s var(--ease-out) both;
}
.gate-logo{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.gate-logo .mark{
  width:48px;height:48px;border-radius:14px;flex:0 0 48px;
  background:linear-gradient(135deg,var(--grad-a),var(--grad-b));
  box-shadow:var(--sh-accent);color:#fff;font-size:1.3rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;
}
.gate-logo h1{font-size:1.15rem;margin:0;color:var(--accent-ink);letter-spacing:-.01em}
.gate-logo p{margin:2px 0 0;font-size:.75rem;color:var(--fg-3);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.field{margin-bottom:14px}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--fg-2);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;height:46px;padding:0 14px;border:1px solid var(--border-2);border-radius:var(--radius-md);
  background:var(--bg-1);color:var(--fg);outline:none;transition:border-color var(--t-base),box-shadow var(--t-base);
}
.field textarea{height:auto;padding:12px 14px;resize:vertical;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--btn-b);box-shadow:0 0 0 3px var(--tint);
}
.field .hint{font-size:.72rem;color:var(--fg-3);margin-top:5px}
/* 独立输入框（不放在 .field 直接子级时用，如联系方式三宫格） */
.inp{
  width:100%;height:42px;padding:0 13px;border:1px solid var(--border-2);
  border-radius:var(--radius-md);background:var(--panel);color:var(--fg);
  outline:none;transition:all var(--t-base);
}
.inp:focus{border-color:var(--btn-b);box-shadow:0 0 0 3px var(--tint)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:linear-gradient(135deg,var(--btn-a),var(--btn-b));color:#fff;
  padding:0 20px;height:42px;border-radius:var(--radius-md);font-size:.9rem;font-weight:600;
  border:none;cursor:pointer;white-space:nowrap;
  transition:transform var(--t-base) var(--ease-out),box-shadow var(--t-base) var(--ease-out),filter var(--t-base);
  box-shadow:var(--sh-sm);
}
.btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:var(--sh-accent);filter:brightness(1.08)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none!important;box-shadow:var(--sh-sm)!important;filter:none!important}
.btn-block{width:100%;height:48px;font-size:.95rem}
.btn-sm{height:34px;padding:0 13px;font-size:.8rem;border-radius:var(--radius-sm)}
.btn-secondary{background:var(--tint);color:var(--accent-ink);box-shadow:none;border:1px solid var(--border-2)}
.btn-secondary:hover{background:var(--tint-2);box-shadow:var(--sh-sm)}
.btn-ghost{background:transparent;color:var(--fg-2);box-shadow:none;border:1px solid var(--border-2)}
.btn-ghost:hover{background:var(--tint);color:var(--accent-ink);box-shadow:none}
.btn-danger{background:linear-gradient(135deg,#9b2c1f,#c0392b)}
.btn-danger:hover{box-shadow:0 4px 14px rgba(192,57,43,.3)}
.btn-ok{background:linear-gradient(135deg,#0a7d42,#12995a)}
.btn-ok:hover{box-shadow:0 4px 14px rgba(10,125,66,.28)}
.msg{margin-top:14px;padding:11px 14px;border-radius:var(--radius-md);font-size:.83rem;display:none;line-height:1.55;white-space:pre-line}
.msg.show{display:block}
.msg.err{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(192,57,43,.2)}
.msg.ok{background:var(--ok-bg);color:var(--ok);border:1px solid rgba(10,125,66,.2)}
.msg.warn{background:var(--warn-bg);color:var(--warn);border:1px solid rgba(180,83,9,.2)}

@keyframes rise-in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}

/* ============================================================
 * ② 应用骨架：固定侧栏 + 顶栏 + 内容区
 * ============================================================ */
#app{display:none}
#app.show{display:block}
.side{
  position:fixed;top:0;left:0;bottom:0;width:var(--side-w);z-index:60;
  background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:18px 14px;
  transition:transform var(--t-slow) var(--ease-out);
  box-shadow:2px 0 16px rgba(120,53,15,.04);
}
.side-brand{display:flex;align-items:center;gap:11px;padding:6px 10px 0;margin-bottom:22px}
.side-brand .mark{
  width:38px;height:38px;border-radius:12px;flex:0 0 38px;
  background:linear-gradient(135deg,var(--grad-a),var(--grad-b));
  box-shadow:var(--sh-accent);color:#fff;font-size:1rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;transition:transform var(--t-slow) var(--ease-out);
}
.side-brand:hover .mark{transform:scale(1.1) rotate(-4deg)}
.side-brand h1{margin:0;font-size:1rem;font-weight:800;color:var(--fg);letter-spacing:-.01em;line-height:1.1}
.side-brand p{margin:3px 0 0;font-size:.62rem;color:var(--fg-3);letter-spacing:.14em;text-transform:uppercase;font-weight:800}

.side-nav{flex:1;overflow-y:auto;padding-right:4px;margin:0 -4px}
.nav-group{margin-bottom:18px}
.nav-group>h3{
  margin:0 0 7px;padding:0 10px;font-size:.63rem;font-weight:800;
  color:var(--fg-3);letter-spacing:.16em;text-transform:uppercase;
}
.nav-item{
  width:100%;display:flex;align-items:center;gap:10px;padding:9px 11px;
  border-radius:var(--radius-md);font-size:.85rem;font-weight:600;
  color:var(--fg-2);background:none;border:1px solid transparent;cursor:pointer;
  transition:all var(--t-base) var(--ease-out);text-align:left;margin-bottom:2px;
}
.nav-item .ico{flex:0 0 17px;width:17px;height:17px;display:flex;align-items:center;justify-content:center;opacity:.75}
.nav-item .ico svg{width:17px;height:17px;display:block}
.nav-item span{flex:1;truncate:ellipsis;overflow:hidden;text-overflow:ellipsis}
.nav-item:hover{background:var(--tint);color:var(--accent-ink)}
.nav-item.on{background:var(--tint);color:var(--accent-ink);border-color:var(--border-2);font-weight:700}
.nav-item.on .ico{opacity:1}
.nav-item.on .dot{width:5px;height:5px;border-radius:50%;background:var(--grad-a);box-shadow:0 0 8px var(--grad-a);flex:0 0 5px}

.side-user{
  margin-top:14px;padding-top:14px;border-top:1px solid var(--border);
}
.side-user .row{
  display:flex;align-items:center;gap:11px;padding:10px;border-radius:var(--radius-md);
  background:var(--bg-2);border:1px solid var(--border);
}
.side-user .av{
  width:38px;height:38px;border-radius:11px;flex:0 0 38px;
  background:linear-gradient(135deg,var(--grad-a),var(--grad-b));
  color:#fff;font-weight:800;font-size:1rem;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-accent);
}
.side-user .who{flex:1;min-width:0}
.side-user .who b{display:block;font-size:.82rem;font-weight:800;color:var(--fg);truncate;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-user .who i{display:block;font-size:.63rem;color:var(--fg-3);letter-spacing:.1em;text-transform:uppercase;font-weight:700;font-style:normal;margin-top:2px}
.icon-btn{
  display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex:0 0 32px;
  border-radius:var(--radius-sm);border:none;background:transparent;color:var(--fg-3);cursor:pointer;
  transition:all var(--t-base);
}
.icon-btn:hover{background:var(--danger-bg);color:var(--danger)}
.icon-btn svg{width:16px;height:16px}

.head{
  position:sticky;top:0;z-index:50;height:var(--head-h);
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:0 26px;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--bg-1) 78%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.head h2{margin:0;font-size:1.2rem;font-weight:800;letter-spacing:-.01em}
.head .head-actions{display:flex;align-items:center;gap:9px}
#burger{display:none}
.main{margin-left:var(--side-w);min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}
.content{flex:1;padding:24px 26px 90px;max-width:1440px;width:100%}
.scrim{display:none}

/* ============================================================
 * ③ 通用组件
 * ============================================================ */
.panel{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--sh-md);overflow:hidden;
}
.panel-head{
  padding:15px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.panel-head h3{margin:0;font-size:.95rem;font-weight:800;display:flex;align-items:center;gap:8px}
.panel-head h3 svg{width:17px;height:17px;color:var(--accent-ink)}
.panel-head .sub{margin:3px 0 0;font-size:.72rem;color:var(--fg-3)}
.panel-body{padding:18px}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-bottom:22px}
.stat{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:18px;box-shadow:var(--sh-md);position:relative;overflow:hidden;
  transition:transform var(--t-slow) var(--ease-out),box-shadow var(--t-slow) var(--ease-out),border-color var(--t-base);
}
.stat:hover{transform:translateY(-4px);box-shadow:var(--sh-lg);border-color:var(--border-2)}
.stat .top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.stat .si{
  width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--grad-a),var(--grad-b));box-shadow:var(--sh-accent);color:#fff;
}
.stat .si svg{width:21px;height:21px}
.stat .si.green{background:linear-gradient(135deg,#0a7d42,#12995a);box-shadow:0 4px 14px rgba(10,125,66,.28)}
.stat .si.blue{background:linear-gradient(135deg,#1d4ed8,#3b82f6);box-shadow:0 4px 14px rgba(29,78,216,.28)}
.stat .si.amber{background:linear-gradient(135deg,#b45309,#d97706);box-shadow:0 4px 14px rgba(180,83,9,.28)}
.stat .trend{font-size:.7rem;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--ok-bg);color:var(--ok)}
.stat .label{margin:0;font-size:.78rem;color:var(--fg-3);font-weight:600}
.stat .value{margin:5px 0 0;font-size:1.85rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat .foot{margin:6px 0 0;font-size:.72rem;color:var(--fg-3)}

.grid-2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
.grid-main{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}

.toolbar{
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  padding:13px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:16px;
}
.search{position:relative;flex:1;min-width:180px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--fg-3);pointer-events:none}
.search input{
  width:100%;height:40px;padding:0 13px 0 37px;border:1px solid var(--border-2);
  border-radius:var(--radius-md);background:var(--panel);color:var(--fg);outline:none;transition:all var(--t-base);
}
.search input:focus{border-color:var(--btn-b);box-shadow:0 0 0 3px var(--tint)}
.toolbar select{
  height:40px;padding:0 30px 0 12px;border:1px solid var(--border-2);border-radius:var(--radius-md);
  background:var(--panel) url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236e635a' stroke-width='2.5' stroke-linecap='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E") no-repeat right 9px center/13px;
  color:var(--fg);outline:none;cursor:pointer;appearance:none;-webkit-appearance:none;
}
.toolbar select:focus{border-color:var(--btn-b);box-shadow:0 0 0 3px var(--tint)}

.table-wrap{overflow-x:auto;border-radius:var(--radius-md);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:.84rem}
thead th{
  padding:11px 13px;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--fg-3);background:var(--bg-2);
  border-bottom:1px solid var(--border);white-space:nowrap;
}
tbody td{padding:11px 13px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background var(--t-fast)}
tbody tr:hover{background:var(--tint)}
tbody tr.sel{background:var(--tint-2)}
.cell-user{display:flex;align-items:center;gap:10px}
.cell-user .av{
  width:32px;height:32px;border-radius:9px;flex:0 0 32px;
  background:linear-gradient(135deg,var(--grad-a),var(--grad-b));color:#fff;
  font-weight:800;font-size:.8rem;display:flex;align-items:center;justify-content:center;
}
.cell-user b{font-weight:700;display:block;font-size:.85rem}
.cell-user i{font-style:normal;font-size:.72rem;color:var(--fg-3)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem}
.muted{color:var(--fg-3)}
.nowrap{white-space:nowrap}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:.71rem;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge-gray{background:var(--bg-3);color:var(--fg-2)}
.badge-orange{background:var(--tint-2);color:var(--accent-ink)}
.badge-green{background:var(--ok-bg);color:var(--ok)}
.badge-red{background:var(--danger-bg);color:var(--danger)}
/* 「当前在线」小绿点（配合最后上线时间显示） */
.dot-on{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-right:5px;vertical-align:middle;box-shadow:0 0 0 3px rgba(34,197,94,.16)}
.badge-blue{background:var(--info-bg);color:var(--info)}
/* 头衔任命弹窗的选项网格（2026-10-05 加） */
.tt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.tt-item{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:.8rem;user-select:none;transition:.15s}
.tt-item:hover{border-color:var(--accent)}
.tt-item.on{background:var(--tint-2);border-color:var(--accent);font-weight:700}
.tt-item input{cursor:pointer;margin:0}
.badge-amber{background:var(--warn-bg);color:var(--warn)}

.row-actions{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}
.row-actions button{
  height:29px;padding:0 9px;font-size:.73rem;font-weight:700;border-radius:var(--radius-sm);
  border:1px solid var(--border-2);background:var(--panel);color:var(--fg-2);cursor:pointer;
  transition:all var(--t-fast);white-space:nowrap;
}
.row-actions button:hover{background:var(--tint);color:var(--accent-ink);border-color:var(--btn-b)}
.row-actions button.danger:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}
.row-actions button.ok:hover{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.row-actions button.view{color:var(--info);border-color:var(--border-2)}
.row-actions button.view:hover{background:var(--info-bg);color:var(--info);border-color:var(--info)}
.row-actions button.icon{display:inline-flex;align-items:center;gap:4px}
.row-actions button.icon svg{width:13px;height:13px}

/* ============================================================
 * ④-B 记录列表（列表只放「类型 / 标题 / 时间 / 操作」，
 *      正文一律收进「查看」弹窗）
 * ------------------------------------------------------------
 * 为什么不用表格：正文要塞进表格列 → 只能 nowrap + 省略号，
 * 电脑端挤成一坨、移动端横向滚动条拉不到头。用户的原话是
 * 「移动端肯定塞不下，电脑端也不好看」，说的就是这个。
 * 所以这里改成记录行：宽屏两栏（左标题右操作），窄屏自动
 * 堆叠成卡片，任何宽度都不需要横向滚动。
 * ============================================================ */
.rec-list{display:flex;flex-direction:column}
/* ---- 作业编辑器（2026-10-07 重写：按主站 items 形态编辑，每条任务可挂图片/音频）---- */
.hwed-subj{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;background:var(--bg-2)}
.hwed-subj-head{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.hwed-subj-head .hwed-name{flex:1;font-weight:800;font-size:.88rem}
.hwed-task{display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:8px;align-items:center}
.hwed-task .hwed-text{grid-column:1}
.hwed-task .hwed-x{grid-column:2;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--danger);cursor:pointer;font-size:1rem;line-height:1}
.hwed-task .hwed-media{grid-column:1 / -1;font-size:.76rem;padding:6px 9px}
.field-row{display:flex;gap:12px;flex-wrap:wrap}
.field-row .field{flex:1;min-width:150px}
@media(max-width:520px){
  .hwed-task{grid-template-columns:1fr auto}
}
.rec{
  display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;
  padding:13px 15px;border-bottom:1px solid var(--border);
  transition:background var(--t-fast);
}
.rec:last-child{border-bottom:none}
.rec:hover{background:var(--tint)}
.rec-main{flex:1;min-width:0}
.rec-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rec-top b{font-size:.9rem;font-weight:800;word-break:break-word}
.rec-meta{margin-top:5px;font-size:.75rem;color:var(--fg-3);display:flex;gap:10px;flex-wrap:wrap}
.rec-meta span{display:inline-flex;align-items:center;gap:4px}
.rec-act{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0}
.rec-act button{
  height:32px;padding:0 12px;font-size:.76rem;font-weight:700;border-radius:var(--radius-sm);
  border:1px solid var(--border-2);background:var(--panel);color:var(--fg-2);cursor:pointer;
  transition:all var(--t-fast);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;
}
.rec-act button:hover{background:var(--tint);color:var(--accent-ink);border-color:var(--btn-b)}
.rec-act button.danger:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}
.rec-act button.view{color:var(--info)}
.rec-act button.view:hover{background:var(--info-bg);color:var(--info);border-color:var(--info)}
.rec-act button svg{width:14px;height:14px}

/* 只读详情弹窗里的正文块 */
.view-body{
  font-size:.87rem;line-height:1.75;white-space:pre-wrap;word-break:break-word;
  color:var(--fg);background:var(--bg-2);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:14px 16px;max-height:52vh;overflow:auto;
}
.view-kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:.8rem;margin-bottom:14px}
.view-kv dt{color:var(--fg-3);font-weight:700;white-space:nowrap}
.view-kv dd{margin:0;color:var(--fg-2);word-break:break-word}

/* 作业详情里的科目分组 */
.hwv-subj{margin-bottom:14px}
.hwv-subj:last-child{margin-bottom:0}
.hwv-subj h4{
  margin:0 0 7px;font-size:.78rem;font-weight:800;letter-spacing:.05em;
  color:var(--accent-ink);display:flex;align-items:center;gap:7px;
}
.hwv-subj h4::before{content:'';width:3px;height:13px;border-radius:2px;background:linear-gradient(180deg,var(--grad-a),var(--grad-b))}
.hwv-subj ul{margin:0;padding-left:20px;font-size:.84rem;line-height:1.72}
.hwv-subj li{word-break:break-word}

.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px 2px;flex-wrap:wrap}
.pager .info{font-size:.78rem;color:var(--fg-3)}
.pager .pages{display:flex;gap:6px;align-items:center}
.pager button{
  height:32px;min-width:32px;padding:0 9px;font-size:.8rem;font-weight:700;border-radius:var(--radius-sm);
  border:1px solid var(--border-2);background:var(--panel);color:var(--fg-2);cursor:pointer;transition:all var(--t-fast);
}
.pager button:hover:not(:disabled){background:var(--tint);color:var(--accent-ink);border-color:var(--btn-b)}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager button.on{background:linear-gradient(135deg,var(--btn-a),var(--btn-b));color:#fff;border-color:transparent}

/* 状态筛选胶囊（资料管理 / 审核 / 查看记录 共用） */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  height:36px;padding:0 14px;display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--border-2);background:var(--panel);color:var(--fg-2);
  border-radius:999px;font-size:.79rem;font-weight:700;cursor:pointer;transition:all var(--t-fast);
}
.chip:hover{background:var(--tint);color:var(--accent-ink);border-color:var(--btn-b)}
.chip.on{background:linear-gradient(135deg,var(--btn-a),var(--btn-b));color:#fff;border-color:transparent}
.chip b{
  font-size:.7rem;padding:1px 7px;border-radius:999px;
  background:var(--bg-3);color:var(--fg-2);font-weight:800;
}
.chip.on b{background:rgba(255,255,255,.22);color:#fff}

/* 联系方式三宫格（表格内紧凑展示） */
.ct-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:4px 12px;min-width:210px}
.ct{display:flex;align-items:baseline;gap:5px;font-size:.79rem;line-height:1.5}
.ct i{font-style:normal;color:var(--fg-3);font-size:.69rem;font-weight:800;flex:0 0 auto;min-width:26px}
.ct span{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;
}
.ct span.none{color:var(--fg-3);font-family:inherit}

/* 审核卡片列表 */
.rev-list{display:flex;flex-direction:column;gap:12px;padding:16px}
.rev{
  display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;
  padding:15px 17px;border:1px solid var(--border);border-radius:var(--radius-md);
  background:var(--panel);transition:all var(--t-fast);
}
.rev:hover{border-color:var(--border-2);box-shadow:var(--sh-sm)}
.rev .who{flex:1;min-width:200px}
.rev .who b{font-size:.94rem;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rev .who .sid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.77rem;color:var(--fg-3);font-weight:600}
.rev .who .meta{margin:6px 0 0;font-size:.74rem;color:var(--fg-3)}
.rev .fields{
  flex:1 1 100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px;
  padding:12px 14px;background:var(--bg-2);border-radius:var(--radius-sm);border:1px solid var(--border);
}
.rev .fields .k{font-size:.68rem;font-weight:800;letter-spacing:.06em;color:var(--fg-3);text-transform:uppercase}
.rev .fields .v{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85rem;font-weight:700;
  word-break:break-all;margin-top:3px;
}
.rev .act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.rev .old{font-size:.76rem;color:var(--fg-3)}
.rev .old s{color:var(--danger);opacity:.75}

/* 排行榜 */
.rank{display:flex;flex-direction:column;gap:2px;padding:8px}
.rank-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);transition:background var(--t-fast)}
.rank-row:hover{background:var(--tint)}
.rank-row .n{
  width:26px;height:26px;flex:0 0 26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:.75rem;font-weight:800;background:var(--bg-3);color:var(--fg-2);
}
.rank-row:nth-child(1) .n{background:linear-gradient(135deg,var(--grad-a),var(--grad-b));color:#fff}
.rank-row:nth-child(2) .n{background:var(--tint-2);color:var(--accent-ink)}
.rank-row:nth-child(3) .n{background:var(--tint-2);color:var(--accent-ink)}
.rank-row .nm{flex:1;font-size:.85rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-row .bar{width:110px;height:7px;border-radius:999px;background:var(--bg-3);overflow:hidden;flex:0 0 110px}
.rank-row .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--btn-a),var(--btn-b))}
.rank-row .c{font-size:.8rem;font-weight:800;color:var(--accent-ink);min-width:34px;text-align:right}

.empty{padding:52px 20px;text-align:center;color:var(--fg-3)}
.empty svg{width:38px;height:38px;opacity:.35;margin-bottom:12px}
.empty p{margin:0;font-size:.87rem}
.loading{padding:46px;text-align:center;color:var(--fg-3);font-size:.87rem}
.spinner{
  width:24px;height:24px;border:2.5px solid var(--tint-2);border-top-color:var(--grad-a);
  border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;
}
@keyframes spin{to{transform:rotate(360deg)}}

.alert{padding:12px 15px;border-radius:var(--radius-md);font-size:.83rem;line-height:1.6;margin-bottom:16px;border:1px solid}
.alert.warn{background:var(--warn-bg);color:var(--warn);border-color:rgba(180,83,9,.24)}
.alert.info{background:var(--info-bg);color:var(--info);border-color:rgba(29,78,216,.2)}
.alert.danger{background:var(--danger-bg);color:var(--danger);border-color:rgba(192,57,43,.2)}

/* 活动流 */
.feed{max-height:520px;overflow-y:auto;padding:8px}
.feed-item{display:flex;gap:12px;padding:12px;border-radius:var(--radius-md);transition:background var(--t-fast)}
.feed-item:hover{background:var(--tint)}
.feed-item .fi{
  width:36px;height:36px;border-radius:11px;flex:0 0 36px;
  display:flex;align-items:center;justify-content:center;background:var(--tint-2);color:var(--accent-ink);
}
.feed-item .fi svg{width:16px;height:16px}
.feed-item .fb{flex:1;min-width:0}
.feed-item .fb b{display:block;font-size:.84rem;font-weight:700}
.feed-item .fb p{margin:2px 0 0;font-size:.76rem;color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed-item .fb time{font-size:.68rem;color:var(--fg-3);letter-spacing:.04em;font-weight:600}

/* ============================================================
 * ④ 弹窗
 * ============================================================ */
.modal{
  position:fixed;inset:0;z-index:8000;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(41,37,36,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.modal.show{display:flex;animation:fade-in var(--t-base)}
.modal-box{
  width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  background:var(--panel);border-radius:var(--radius-xl);box-shadow:var(--sh-xl);
  border:1px solid var(--border);border-top:4px solid var(--grad-a);
  animation:rise-in .35s var(--ease-out) both;
}
.modal-box.wide{max-width:840px}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;background:var(--panel);z-index:2;border-radius:var(--radius-xl) var(--radius-xl) 0 0}
.modal-head h3{margin:0;font-size:1.02rem;font-weight:800}
.modal-head .sub{margin:3px 0 0;font-size:.75rem;color:var(--fg-3)}
.modal-body{padding:22px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--panel)}
.close-x{width:32px;height:32px;flex:0 0 32px;border:none;background:transparent;color:var(--fg-3);cursor:pointer;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;transition:all var(--t-fast)}
.close-x:hover{background:var(--danger-bg);color:var(--danger)}
.close-x svg{width:18px;height:18px}

/* 强制改密弹窗：不可关闭 */
.modal.locked .close-x{display:none}
.modal.locked{background:rgba(41,37,36,.82)}

/* 导入预览表 */
.preview-table{max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-md);font-size:.78rem}
.preview-table table{font-size:.78rem}
.preview-table thead th{position:sticky;top:0;z-index:1;font-size:.64rem;padding:8px 10px}
.preview-table tbody td{padding:7px 10px}
.progress-bar{height:8px;background:var(--tint-2);border-radius:999px;overflow:hidden;margin:10px 0 6px}
.progress-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--grad-a),var(--grad-b));border-radius:999px;transition:width var(--t-slow) var(--ease-out);width:0}
.err-list{max-height:180px;overflow-y:auto;background:var(--danger-bg);border:1px solid rgba(192,57,43,.2);border-radius:var(--radius-md);padding:11px 13px;font-size:.76rem;color:var(--danger);line-height:1.7;white-space:pre-line}

/* 字段勾选 */
.field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.field-grid label{
  display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--bg-1);cursor:pointer;font-size:.82rem;font-weight:600;
  transition:all var(--t-fast);
}
.field-grid label:hover{border-color:var(--border-2);background:var(--tint)}
.field-grid input{width:15px;height:15px;accent-color:var(--btn-b);cursor:pointer}
.field-grid label.on{background:var(--tint);border-color:var(--btn-b);color:var(--accent-ink)}

/* 复选框列 */
.chk{width:15px;height:15px;accent-color:var(--btn-b);cursor:pointer;display:block}

/* 用户选择器（定向公告） */
.picker{max-height:230px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-md);padding:8px}
.picker-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:background var(--t-fast)}
.picker-row:hover{background:var(--tint)}
.picker-row input{width:15px;height:15px;accent-color:var(--btn-b);cursor:pointer}
.picker-row b{font-size:.82rem;font-weight:700}
.picker-row i{font-style:normal;font-size:.72rem;color:var(--fg-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  background:var(--tint-2);color:var(--accent-ink);font-size:.76rem;font-weight:700;
}
.chip b{cursor:pointer;font-weight:900;opacity:.65}
.chip b:hover{opacity:1}

/* 详情键值 */
.kv{display:grid;grid-template-columns:110px 1fr;gap:9px 14px;font-size:.83rem}
.kv dt{color:var(--fg-3);font-weight:700;font-size:.78rem}
.kv dd{margin:0;word-break:break-all}

/* toast */
#toasts{position:fixed;right:20px;bottom:20px;z-index:9500;display:flex;flex-direction:column;gap:9px;pointer-events:none}
.toast{
  padding:12px 17px;border-radius:var(--radius-md);background:var(--panel);
  border:1px solid var(--border);border-left:4px solid var(--grad-a);
  box-shadow:var(--sh-xl);font-size:.84rem;font-weight:600;max-width:340px;
  animation:rise-in .3s var(--ease-out) both;pointer-events:auto;
}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warn)}

.tab-strip{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab-strip button{
  height:36px;padding:0 15px;font-size:.83rem;font-weight:700;border-radius:var(--radius-md);
  border:1px solid var(--border-2);background:var(--panel);color:var(--fg-2);cursor:pointer;transition:all var(--t-fast);
}
.tab-strip button:hover{background:var(--tint);color:var(--accent-ink)}
.tab-strip button.on{background:linear-gradient(135deg,var(--btn-a),var(--btn-b));color:#fff;border-color:transparent;box-shadow:var(--sh-accent)}

/* ============================================================
 * ⑤ 响应式
 * ============================================================ */
@media(max-width:1080px){
  .grid-2{grid-template-columns:1fr}
  .grid-main{grid-template-columns:1fr}
}
@media(max-width:820px){
  :root{--head-h:58px}
  .side{transform:translateX(-100%)}
  .side.open{transform:none;box-shadow:var(--sh-xl)}
  .main{margin-left:0}
  #burger{display:flex}
  .scrim{display:block;position:fixed;inset:0;background:rgba(41,37,36,.5);z-index:55;opacity:0;pointer-events:none;transition:opacity var(--t-slow)}
  .scrim.show{opacity:1;pointer-events:auto}
  .content{padding:16px 14px 80px}
  .head{padding:0 14px}
  .head h2{font-size:1.02rem}
  .stat-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .stat .value{font-size:1.5rem}
  .toolbar{padding:11px}
  .search{min-width:100%}
  .grid-2{gap:14px}
  .modal-box{border-radius:var(--radius-lg);max-height:92vh}
  .field-grid{grid-template-columns:1fr 1fr}
  #toasts{right:12px;bottom:12px;left:12px}
  .toast{max-width:none}

  /* --- 记录列表：窄屏堆叠成卡片，按钮铺满一行 --- */
  .rec{padding:13px 12px;gap:10px}
  .rec-main{flex:1 1 100%}
  .rec-top b{font-size:.87rem}
  .rec-act{flex:1 1 100%;width:100%}
  .rec-act button{flex:1;justify-content:center;height:36px;min-width:0}
  .view-body{max-height:46vh;padding:12px 13px}
  .view-kv{grid-template-columns:1fr;gap:2px}
  .view-kv dt{margin-top:8px;font-size:.72rem}
  .view-kv dt:first-child{margin-top:0}
  /* 弹窗按钮也放大一点，手指点得准 */
  .modal-foot button{height:42px;font-size:.84rem}
}
@media(max-width:480px){
  /* 极窄屏（手机竖屏）：工具栏按钮铺满、图标区可换行 */
  .toolbar{flex-wrap:wrap;gap:8px}
  .toolbar .btn-sm{height:38px}
  .view-body{font-size:.85rem;line-height:1.7}
}
/* ---- 2026-10-07：游戏数据面板 ---- */
.seg{display:inline-flex;background:var(--fill);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:0 14px;height:34px;font-size:.82rem;color:var(--muted);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
.mini-card{display:flex;flex-direction:column;gap:2px;padding:10px 16px;border:1px solid var(--line);border-radius:12px;background:var(--fill);min-width:110px}
.mini-card .mc-label{font-size:.72rem;color:var(--muted)}
.mini-card b{font-size:1.15rem;line-height:1.2}
#gmWeek{height:30px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:inherit;font-family:inherit;font-size:.8rem}
</style>
</head>
<body>

<!-- ============================================================
     登录门
     ============================================================ -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-logo">

}
function attr(s){ return esc(s); }

/**
 * 把数据库返回的时间格式化成可读文本。
 *
 * ⚠️ 复制自主站的经验（2026-10-05 踩过的坑）：
 * Neon HTTP 驱动返回 timestamptz 是**字符串**（形如 "2026-10-05 05:52:28"），
 * 带空格的格式在 Safari / 微信 WebView 里 `new Date()` 会得到 Invalid Date。
 * 所以要手动换 T 补 Z 按 UTC 解析，再转本地时区显示。
 */
function parseTime(v){
  if(!v) return null;
  if(v instanceof Date) return isNaN(v.getTime()) ? null : v;
  var s = String(v).trim();
  if(/^\d+$/.test(s)){ var n = Number(s); return new Date(n > 1e12 ? n : n*1000); }
  var iso = s.replace(' ','T');
  if(!/[zZ]|[+-]\d{2}:?\d{2}$/.test(iso)) iso += 'Z';
  var t = Date.parse(iso);
  return isNaN(t) ? null : new Date(t);
}
function fmt(v, mode){
  var d = parseTime(v);
  if(!d) return '—';
  var p = function(n){ return String(n).padStart(2,'0'); };
  var Y = d.getFullYear(), M = p(d.getMonth()+1), D = p(d.getDate());
  var h = p(d.getHours()), m = p(d.getMinutes()), sec = p(d.getSeconds());
  if(mode === 'date') return Y + '-' + M + '-' + D;
  if(mode === 'time') return h + ':' + m;
  return Y + '-' + M + '-' + D + ' ' + h + ':' + m + ':' + sec;
}
/** 相对时间："3 分钟前" */
function ago(v){
  var d = parseTime(v);
  if(!d) return '—';
  var ms = Date.now() - d.getTime();
  if(ms < 0) return fmt(v);
  var s = Math.floor(ms/1000);
  if(s < 60) return '刚刚';
  var m = Math.floor(s/60);
  if(m < 60) return m + ' 分钟前';
  var h = Math.floor(m/60);
  if(h < 24) return h + ' 小时前';
  var dd = Math.floor(h/24);
  if(dd < 30) return dd + ' 天前';
  return fmt(v, 'date');
}
function bytes(n){
  n = Number(n) || 0;
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1024/1024).toFixed(2) + ' MB';
}
/** 一次下载（导出用） */
function download(blob, filename){

  var url = URL.createObjectURL(blob);
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 200);
}
/** 防抖 */
function debounce(fn, ms){
  var t; return function(){ var a = arguments, c = this; clearTimeout(t); t = setTimeout(function(){ fn.apply(c, a); }, ms); };
}

function apiUrl(path){
  return (API_BASE || '') + '/api' + path;

/**
 * 统一请求封装。
 * - 自动带 Bearer token
 * - 401 自动清登录态并回到登录门
 * - 403 + mustChangePassword 自动弹强制改密
 */
function api(path, opts){
  opts = opts || {};
  var headers = { 'Content-Type':'application/json' };
  if(STATE.token) headers['Authorization'] = 'Bearer ' + STATE.token;

  var init = { method: opts.method || 'GET', headers: headers };
  if(opts.body !== undefined) init.body = JSON.stringify(opts.body);

  return fetch(apiUrl(path), init).then(function(r){
    return r.json().catch(function(){
      return { ok:false, error:'接口返回了非 JSON 内容（HTTP ' + r.status + '）' };
    }).then(function(j){
      if(r.status === 401){
        doLogout(true);
        throw new Error(j.error || '登录已过期，请重新登录');
      }
      /* 未改初始密码 → 后端拦截，这里把强制改密弹窗拉起来 */
      if(r.status === 403 && j.mustChangePassword){
        openForceChangePwd();
        throw new Error(j.error || '请先修改初始密码');
      }
      if(!r.ok || j.ok === false){
        var e = new Error(j.error || ('请求失败（HTTP ' + r.status + '）'));
        e.status = r.status; e.data = j;
        throw e;
      }
      return j;
    });
  });
}

function toast(msg, kind, ms){
  var box = $('toasts');
  if(!box) return;
  var el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(function(){
    el.style.transition = 'opacity .25s, transform .25s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    setTimeout(function(){ el.remove(); }, 260);
  }, ms || 2600);
}

/**
 * 打开弹窗。
 * @param {object} o { title, sub, body(html), foot(html), wide, onMount(box), locked(不可关闭) }
 */
function openModal(o){
  o = o || {};
  var m = $('modal'), box = $('modalBox');
  var cls = 'modal-box' + (o.wide ? ' wide' : '');
  box.className = cls;
  box.innerHTML =
    '<div class="modal-head">'
    +   '<div><h3>' + esc(o.title || '') + '</h3>'
    +   (o.sub ? '<p class="sub">' + esc(o.sub) + '</p>' : '')
    +   '</div>'
    +   (o.locked ? '' : '<button class="close-x" data-close>' + svg('x') + '</button>')
    + '</div>'
    + '<div class="modal-body" id="modalBody">' + (o.body || '') + '</div>'
    + (o.foot ? '<div class="modal-foot">' + o.foot + '</div>' : '');

  m.className = 'modal show' + (o.locked ? ' locked' : '');
  /* 点遮罩关闭（locked 除外） */
  m.onclick = function(e){ if(e.target === m && !o.locked) closeModal(); };
  var x = box.querySelector('[data-close]');
  if(x) x.onclick = closeModal;
  if(typeof o.onMount === 'function') o.onMount(box);
  return box;
}
function closeModal(){
  var m = $('modal');
  m.className = 'modal';
  $('modalBox').innerHTML = '';

 * @param {object} o
 *   html  主文案（允许 HTML，调用方自己保证安全）
 *   text  主文案（纯文本，会被转义）—— 与 html 二选一
 *   detail 补充说明（纯文本，小字显示在主文案下面）
 *   warn  危险提示（红框）
 * @returns {Promise<boolean>}
 */
function confirmBox(o){
  o = o || {};
  return new Promise(function(resolve){
    var done = function(v){ closeModal(); resolve(v); };
    openModal({
      title: o.title || '确认操作',
      body: '<p style="margin:0;font-size:.9rem;line-height:1.7">' + (o.html || esc(o.text || '确定要继续吗？')) + '</p>'
            + (o.detail ? '<p style="margin:10px 0 0;font-size:.82rem;line-height:1.7;color:var(--fg-3)">' + esc(o.detail) + '</p>' : '')
            + (o.warn ? '<div class="alert danger" style="margin:16px 0 0">' + esc(o.warn) + '</div>' : ''),
      foot: '<button class="btn btn-ghost" data-no>取消</button>'
            + '<button class="btn ' + (o.danger ? 'btn-danger' : '') + '" data-yes>' + esc(o.okText || '确定') + '</button>',
      onMount: function(box){
        box.querySelector('[data-yes]').onclick = function(){ done(true); };
        box.querySelector('[data-no]').onclick  = function(){ done(false); };
      }
    });
  });
}

/** 输入框对话框（Promise 化，返回输入值或 null） */
function promptBox(o){
  o = o || {};
  return new Promise(function(resolve){
    var done = function(v){ closeModal(); resolve(v); };
    openModal({
      title: o.title || '输入',
      sub: o.sub || '',
      body:
        '<div class="field"><label for="pmVal">' + esc(o.label || '内容') + '</label>'
        + '<input id="pmVal" type="' + (o.type || 'text') + '" value="' + attr(o.value || '') + '" '
        + 'placeholder="' + attr(o.placeholder || '') + '" '
        + (o.maxlength ? 'maxlength="' + o.maxlength + '"' : '') + '>'
        + (o.hint ? '<p class="hint">' + esc(o.hint) + '</p>' : '')
        + '</div>'
        + '<div class="msg" id="pmMsg"></div>',
      foot: '<button class="btn btn-ghost" data-no>取消</button><button class="btn" data-yes>' + esc(o.okText || '确定') + '</button>',
      onMount: function(box){
        var input = box.querySelector('#pmVal');
        var msg = box.querySelector('#pmMsg');
        setTimeout(function(){ input.focus(); input.select(); }, 80);
        var submit = function(){
          var v = input.value.trim();
          if(o.required && !v){
            msg.className = 'msg err show'; msg.textContent = '不能为空';
            return;
          }
          if(o.validate){
            var err = o.validate(v);
            if(err){ msg.className = 'msg err show'; msg.textContent = err; return; }
          }
          done(v);
        };
        box.querySelector('[data-yes]').onclick = submit;
        box.querySelector('[data-no]').onclick  = function(){ done(null); };
        input.onkeydown = function(e){ if(e.key === 'Enter'){ e.preventDefault(); submit(); } };
      }
    });
  });
}

function renderNav(){
  var groups = [];
  PAGES.forEach(function(p){
    var g = groups.find(function(x){ return x.name === p.group; });
    if(!g){ g = { name:p.group, items:[] }; groups.push(g); }
    g.items.push(p);
  });
  var html = groups.map(function(g){
    return '<div class="nav-group"><h3>' + esc(g.name) + '</h3>'
      + g.items.map(function(p){
          return '<button class="nav-item' + (STATE.page === p.id ? ' on' : '') + '" data-page="' + p.id + '">'
            + '<span class="ico">' + svg(p.icon, 17) + '</span>'
            + '<span>' + esc(p.label) + '</span>'
            + (STATE.page === p.id ? '<i class="dot"></i>' : '')
            + '</button>';
        }).join('')
      + '</div>';
  }).join('');
  $('nav').innerHTML = html;
  Array.prototype.forEach.call($('nav').querySelectorAll('[data-page]'), function(b){
    b.onclick = function(){ go(b.dataset.page); closeSide(); };
  });
}

function go(page){
  STATE.page = page;
  var p = PAGES.find(function(x){ return x.id === page; });
  $('pageTitle').textContent = p ? p.title : '';
  renderNav();
  var view = $('view');
  view.innerHTML = '<div class="loading"><div class="spinner"></div>加载中…</div>';
  view.style.animation = 'none';
  void view.offsetWidth;
  view.style.animation = 'rise-in .45s cubic-bezier(.16,1,.3,1) both';

  var fn = ({
    overview:      renderOverview,
    users:         renderUsers,
    titles:        renderTitles,

    reviews:       renderReviews,
    viewlogs:      renderViewLogs,

    logins:        renderLogins,
    logs:          renderLogs,
    secrets:       renderSecrets,
    settings:      renderSettings,
    account:       renderAccount
  })[page];
  if(fn) fn();
}

/* 「现在就在站上吗」：5 分钟内有心跳即算在线（2026-10-07） */
function isOnlineNow(u){
  var t = u && (u.lastSeenAt || u.lastLoginAt);
  if(!t) return false;
  var ms = Date.now() - new Date(t).getTime();
  return ms >= 0 && ms < 5 * 60 * 1000;
}

function loadUsers(){
  var S = STATE.users;
  var qs = '/admin?action=users&limit=' + S.size + '&offset=' + ((S.page - 1) * S.size)
         + '&q=' + encodeURIComponent(S.q || '');

  api(qs).then(function(j){
    S.list = j.users || [];
    S.total = j.total || 0;
    /* 保持已选中项（翻页后仍在） */
    paintUsers();
  }).catch(function(e){
    $('uBody').innerHTML = '<div class="alert danger" style="margin:18px">加载失败：' + esc(e.message) + '</div>';
  });
}

function paintUsers(){
  var S = STATE.users;
  var body = $('uBody');
  if(!body) return;

  if(!S.list.length){
    body.innerHTML = '<div class="empty">' + svg('inbox', 38) + '<p>没有匹配的用户</p></div>';
    return;
  }

  /* 前端筛选（角色/状态）：后端 users 接口目前只支持 q，
     角色与状态在本地过滤，保证筛选即时生效、不额外压后端。 */
  var list = S.list.filter(function(u){
    if(S.role && u.role !== S.role) return false;
    if(S.status && u.status !== S.status) return false;
    return true;
  });

  var allChecked = list.length > 0 && list.every(function(u){ return S.selected[u.id]; });

  var rows = list.map(function(u){
    var initial = String(u.displayName || u.username || '?').charAt(0).toUpperCase();
    var badges = '';
    if(u.role === 'admin') badges += '<span class="badge badge-orange">管理员</span> ';
    if(u.status === 'banned') badges += '<span class="badge badge-red">已禁用</span>';
    else badges += '<span class="badge badge-green">正常</span>';
    if(u.mustChangePassword) badges += ' <span class="badge badge-amber">待改密</span>';

    return '<tr' + (S.selected[u.id] ? ' class="sel"' : '') + '>'
      + '<td><input type="checkbox" class="chk" data-pick="' + u.id + '"' + (S.selected[u.id] ? ' checked' : '') + '></td>'
      + '<td><div class="cell-user"><div class="av">' + esc(initial) + '</div>'
      +   '<div><b>' + esc(u.displayName || u.username) + '</b>'
      +   '<i class="mono">' + esc(u.username) + '</i></div></div></td>'
      + '<td class="nowrap">' + badges + '</td>'
      /* 「最后上线」：优先用心跳时间 lastSeenAt，没有才退回登录时间。
         5 分钟内有心跳 = 现在就在站上，给个绿点（2026-10-07 站主要求：要看的是什么时候上过线，不是什么时候输过密码） */
      + '<td class="nowrap muted" title="' + attr(fmt(u.lastSeenAt || u.lastLoginAt)) + '">'
      +   (isOnlineNow(u) ? '<span class="dot-on" title="当前在线"></span>' : '')
      +   esc(u.lastSeenAt ? ago(u.lastSeenAt) : (u.lastLoginAt ? ago(u.lastLoginAt) : '从未上线'))
      + '</td>'
      + '<td class="nowrap muted">' + esc(fmt(u.createdAt, 'date')) + '</td>'
      + '<td class="nowrap" style="text-align:right"><div class="row-actions">'
      +   '<button data-act="detail" data-id="' + u.id + '">详情</button>'
      +   '<button data-act="pwd" data-id="' + u.id + '">重置密码</button>'
      +   (u.status === 'banned'
            ? '<button class="ok" data-act="unban" data-id="' + u.id + '">解禁</button>'
            : '<button class="danger" data-act="ban" data-id="' + u.id + '">禁用</button>')
      +   '<button class="danger" data-act="del" data-id="' + u.id + '"'
      +     (STATE.me && u.id === STATE.me.id ? ' disabled title="不能删除自己"' : '') + '>删除</button>'
      + '</div></td>'
      + '</tr>';
  }).join('');

  var size = S.size;
  var shownTo = Math.min(S.page * size, S.total);

  body.innerHTML =
    '<div class="table-wrap"><table><thead><tr>'
    + '<th style="width:38px"><input type="checkbox" class="chk" data-pick-all' + (allChecked ? ' checked' : '') + '></th>'
    + '<th>用户</th><th class="nowrap">角色 / 状态</th><th class="nowrap">最后上线</th><th class="nowrap">创建时间</th>'
    + '<th style="text-align:right">操作</th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
    + '<div class="pager">'
    +   '<span class="info">共 ' + S.total + ' 人，当前显示第 ' + ((S.page - 1) * size + 1) + '–' + shownTo + ' 条</span>'
    +   '<span class="pages">'
    +     '<button data-pg="prev"' + (S.page <= 1 ? ' disabled' : '') + '>上一页</button>'
    +     '<button class="on">' + S.page + '</button>'
    +     '<button data-pg="next"' + (shownTo >= S.total ? ' disabled' : '') + '>下一页</button>'
    +   '</span>'
    + '</div>';

  /* --- 事件绑定 --- */
  Array.prototype.forEach.call(body.querySelectorAll('[data-pick]'), function(cb){
    cb.onchange = function(){ S.selected[cb.dataset.pick] = cb.checked; paintPick(); paintUsers(); };
  });
  var allCb = body.querySelector('[data-pick-all]');
  if(allCb){
    allCb.onchange = function(){
      list.forEach(function(u){ S.selected[u.id] = allCb.checked; });
      paintUsers();
    };
  }
  Array.prototype.forEach.call(body.querySelectorAll('[data-act]'), function(b){
    b.onclick = function(){ userAction(b.dataset.act, Number(b.dataset.id)); };
  });
  Array.prototype.forEach.call(body.querySelectorAll('[data-pg]'), function(b){
    b.onclick = function(){
      if(b.disabled) return;
      S.page += (b.dataset.pg === 'next' ? 1 : -1);
      loadUsers();
    };
  });

  paintPick();
}

  var el = document.querySelector('[data-bulk]');
  if(!el) return;
  if(!ids.length){
    el.textContent = '';
    el.className = 'muted';
    el.innerHTML = '';
    return;
  }
  el.className = '';
  el.innerHTML = '已选 <b style="color:var(--accent-ink)">' + ids.length + '</b> 人 '
    + '<button class="btn btn-sm btn-ghost" data-bulk-pwd style="margin-left:6px">批量重置密码</button> '
    + '<button class="btn btn-sm btn-ghost" data-bulk-ban style="margin-left:4px">批量禁用</button> '

/** 批量删除用户：先把「选到自己」剔除，再逐个串行删（后端只支持单个删除） */
function bulkDelUsers(ids){
  var mineId = STATE.me ? STATE.me.id : 0;
  var target = ids.filter(function(k){ return Number(k) !== Number(mineId); });
  if(!target.length){ toast('选中的只有你自己的账号，不能删除', 'err', 3800); return; }

  var skipped = ids.length - target.length;

  confirmBox({
    title: '批量删除用户',
    html: '确定要删除选中的 <b>' + target.length + '</b> 个用户吗？',
    detail: '他们的云端数据会一并清除。'
          + (skipped ? '\n已自动跳过你自己的账号。' : ''),
    warn: '不可撤销。如果只是想暂时阻止登录，请改用「批量禁用」。',
    danger: true,
    okText: '确认删除',
  }).then(function(ok){
    if(!ok) return;

    var doneN = 0, failN = 0, firstErr = '';
    var idx = 0;

    /* 串行删：并发删除容易撞外键级联，也让审计日志顺序乱掉 */
    var step = function(){
      if(idx >= target.length) return finish();
      var id = Number(target[idx]);
      return api('/admin?action=delete-user', { method:'POST', body: { id: id } })
        .then(function(){ doneN++; })
        .catch(function(e){ failN++; if(!firstErr) firstErr = e.message; })
        .then(function(){ idx++; return step(); });
    };

    var finish = function(){
      STATE.users.selected = {};
      loadUsers();
      var msg = '已删除 ' + doneN + ' 个账号';
      if(failN) msg += '，失败 ' + failN + ' 个（' + firstErr + '）';
      toast(msg, failN ? 'err' : 'ok', 4200);
    };

    step();
  });
}

/** UA 精简显示："Chrome · Windows" 这种 */
function shortUA(ua){
  if(!ua) return '—';
  var s = String(ua), out = [];
  if(/MicroMessenger/i.test(s)) out.push('微信');
  else if(/Edg\//.test(s)) out.push('Edge');
  else if(/Chrome\//.test(s) && !/Chromium/.test(s)) out.push('Chrome');
  else if(/Firefox\//.test(s)) out.push('Firefox');
  else if(/Safari\//.test(s)) out.push('Safari');
  if(/Windows NT/.test(s)) out.push('Windows');
  else if(/Macintosh/.test(s)) out.push('macOS');
  else if(/Android/.test(s)) out.push('Android');
  else if(/iPhone|iPad/.test(s)) out.push('iOS');
  else if(/Linux/.test(s)) out.push('Linux');
  return out.length ? out.join(' · ') : s.slice(0, 40);
}

/* ============================================================================
 * ⑧ Excel 导入（对标 VoiceHub：三源 CDN + 标题行检测 + 预览 + 分批进度）
 * ========================================================================= */
var _xlsxLoading = null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(_xlsxLoading) return _xlsxLoading;

  /* 三个 CDN 依次回退：jsdelivr 国内有时不稳，unpkg / cdnjs 兜底 */
  var urls = [
    'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
    'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
  ];

  _xlsxLoading = new Promise(function(resolve){
    var i = 0;
    (function next(){
      if(i >= urls.length){ resolve(null); return; }
      var url = urls[i++];
      var s = document.createElement('script');
      s.src = url;
      s.async = true;
      s.onload = function(){ resolve(window.XLSX || null); };
      s.onerror = function(){ s.remove(); next(); };
      document.head.appendChild(s);
    })();
  });
  return _xlsxLoading;
}

          reader.onload = function(e){
            try{
              var wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
              var sheet = wb.Sheets[wb.SheetNames[0]];
              var aoa = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'' });

              /* 智能检测标题行 */
              var start = 0;
              if(aoa.length && aoa[0] && aoa[0].length){
                var kw = ['用户名','密码','姓名','角色','username','password','name','role','账号','用户'];
                var hit = aoa[0].some(function(cell){
                  if(cell === null || cell === undefined || cell === '') return false;
                  var t = String(cell).toLowerCase();
                  return kw.some(function(k){ return t.indexOf(k.toLowerCase()) >= 0; });
                });
                if(hit) start = 1;
              }
              headerSkipped = start === 1;

              var out = [];
              var skippedEmpty = 0;
              for(var i = start; i < aoa.length; i++){
                var row = aoa[i] || [];
                var username = String(row[0] === null || row[0] === undefined ? '' : row[0]).trim();
                /* 整行为空则跳过 */
                if(!username && !String(row[1] || '').trim()){ skippedEmpty++; continue; }
                out.push({
                  username: username,
                  password: String(row[1] === null || row[1] === undefined ? '' : row[1]),
                  displayName: String(row[2] === null || row[2] === undefined ? '' : row[2]).trim(),
                  role: String(row[3] || '').trim().toLowerCase() === 'admin' ? 'admin' : 'user'
                });
              }

              parsed = out;
              if(!out.length){
                body.innerHTML = '<div class="alert warn">没有解析到有效数据。请确认第 1 列是用户名、第 2 列是密码。</div>';
                goBtn.disabled = true;
                return;
              }

              /* 预览前 8 行 */
              var prev = out.slice(0, 8);
              body.innerHTML =
                '<div class="alert info" style="margin-bottom:12px">'
                + '共解析出 <b>' + out.length + '</b> 条记录'
                + (headerSkipped ? '，已自动跳过标题行' : '（未检测到标题行，从第一行开始）')
                + (skippedEmpty ? '，忽略 ' + skippedEmpty + ' 个空行' : '')
                + '</div>'
                + '<div class="preview-table"><table><thead><tr>'
                + '<th style="width:44px">#</th><th>用户名</th><th>密码</th><th>姓名</th><th>角色</th>'
                + '</tr></thead><tbody>'
                + prev.map(function(r, i){
                    return '<tr><td class="muted">' + (i + 1) + '</td>'
                      + '<td class="mono"><b>' + esc(r.username) + '</b></td>'
                      + '<td class="mono muted">' + esc(r.password ? '•'.repeat(Math.min(r.password.length, 10)) : '（空）') + '</td>'
                      + '<td>' + esc(r.displayName || '—') + '</td>'
                      + '<td>' + (r.role === 'admin' ? '<span class="badge badge-orange">管理员</span>' : '<span class="badge badge-gray">普通</span>') + '</td>'
                      + '</tr>';
                  }).join('')
                + '</tbody></table></div>'
                + (out.length > 8
                    ? '<p class="muted" style="font-size:.78rem;margin:9px 0 0">…… 还有 ' + (out.length - 8) + ' 条记录，导入时会一并处理</p>'
                    : '');
              goBtn.disabled = false;
            }catch(err){
              console.error(err);
              body.innerHTML = '<div class="alert danger">解析失败：' + esc(err.message || '文件格式不正确') + '</div>';
              goBtn.disabled = true;
            }
          };
          reader.onerror = function(){ body.innerHTML = '<div class="alert danger">读取文件失败</div>'; };
          reader.readAsArrayBuffer(f);
        });
      };

      /* 开始导入：分批 50 条，逐批显示进度 */
      goBtn.onclick = function(){
        if(!parsed.length) return;
        goBtn.disabled = true;
        msg.className = 'msg';

        var BATCH = 50;
        var total = parsed.length;
        var batches = [];
        for(var i = 0; i < total; i += BATCH) batches.push(parsed.slice(i, i + BATCH));

        var progWrap = box.querySelector('#imProgWrap');
        var prog = box.querySelector('#imProg');
        var progTxt = box.querySelector('#imProgTxt');
        var errBox = box.querySelector('#imErr');
        progWrap.style.display = 'block';
        errBox.innerHTML = '';

        var created = 0, failed = 0, allErrors = [], bi = 0;
        body.innerHTML = '<div class="alert info">正在导入，请不要关闭本窗口…</div>';

        (function nextBatch(){
          if(bi >= batches.length){
            /* 完成 */
            prog.style.width = '100%';
            progTxt.textContent = '导入完成：成功 ' + created + ' 个' + (failed ? '，失败 ' + failed + ' 个' : '');
            goBtn.disabled = true;
            goBtn.textContent = '已完成';
            toast('导入完成：成功 ' + created + ' 个' + (failed ? '，失败 ' + failed + ' 个' : ''), failed ? 'warn' : 'ok', 4500);
            if(allErrors.length){
              errBox.innerHTML = '<p style="font-size:.8rem;font-weight:700;color:var(--danger);margin:0 0 7px">失败明细</p>'
                + '<div class="err-list">' + allErrors.map(esc).join('\n') + '</div>';
            }
            loadUsers();
            return;
          }
          var batch = batches[bi];
          var offset = bi * BATCH;
          progTxt.textContent = '正在处理第 ' + (bi + 1) + ' / ' + batches.length + ' 批（' + Math.min(offset + BATCH, total) + ' / ' + total + '）…';

          api('/admin?action=batch-create', { method:'POST', body:{ users: batch } })
            .then(function(j){
              created += j.created || 0;
              failed  += j.failed  || 0;
              (j.errors || []).forEach(function(e){
                /* 换算回 Excel 真实行号：批内下标 + 批偏移 + 标题行偏移 + 1（表格从 1 开始） */
                var excelRow = offset + (e.index || 0) + (headerSkipped ? 1 : 0) + 1;
                allErrors.push('第 ' + excelRow + ' 行' + (e.username ? '（' + e.username + '）' : '') + '：' + e.reason);
              });
            })
            .catch(function(e){
              failed += batch.length;
              allErrors.push('第 ' + (bi + 1) + ' 批整体失败：' + e.message);
            })
            .then(function(){
              bi++;
              prog.style.width = Math.round(bi / batches.length * 100) + '%';
              setTimeout(nextBatch, 60);
            });
        })();
      };
    }
  });
}

var EXPORT_FIELDS = [
  { key:'id',           label:'ID',           on:false },

  { key:'displayName',  label:'姓名 / 昵称',   on:true  },

function exportDialog(){
  var S = STATE.users;
  openModal({
    title: '导出用户数据',
    sub: '导出为 .xlsx，可直接用 Excel 打开',
    body:
      '<div class="alert info">导出范围会<b>跟随当前筛选条件</b>（搜索词 / 角色 / 状态），做到「所见即所得」。'
      + (S.q || S.role || S.status
          ? '<br>当前筛选：' + [S.q ? '搜索「' + esc(S.q) + '」' : '', S.role ? '角色 ' + esc(S.role) : '', S.status ? '状态 ' + esc(S.status) : ''].filter(Boolean).join(' · ')
          : '<br>当前无筛选，将导出全部用户。')
      + '</div>'
      + '<p style="font-size:.85rem;font-weight:800;margin:0 0 10px">选择要导出的字段</p>'
      + '<div class="field-grid" id="exFields">'
      + EXPORT_FIELDS.map(function(f){
          return '<label' + (f.on ? ' class="on"' : '') + '><input type="checkbox" data-f="' + f.key + '"' + (f.on ? ' checked' : '') + '>'
            + esc(f.label) + '</label>';
        }).join('')
      + '</div>'
      + '<div class="msg" id="exMsg"></div>',
    foot: '<button class="btn btn-ghost" data-close5>取消</button><button class="btn" id="exGo">' + svg('download', 14) + '导出 Excel</button>',
    onMount: function(box){
      box.querySelector('[data-close5]').onclick = closeModal;
      var fieldsBox = box.querySelector('#exFields');
      Array.prototype.forEach.call(fieldsBox.querySelectorAll('input'), function(cb){
        cb.onchange = function(){
          cb.parentElement.classList.toggle('on', cb.checked);
        };
      });

      box.querySelector('#exGo').onclick = function(){
        var btn = box.querySelector('#exGo');
        var msg = box.querySelector('#exMsg');
        var picked = Array.prototype.filter.call(fieldsBox.querySelectorAll('input'), function(c){ return c.checked; })
          .map(function(c){ return c.dataset.f; });
        if(!picked.length){
          msg.className = 'msg err show'; msg.textContent = '请至少选择一个字段';
          return;
        }

        btn.disabled = true;
        msg.className = 'msg'; msg.textContent = '';

        loadXLSX().then(function(XLSX){
          if(!XLSX){
            msg.className = 'msg err show';
            msg.textContent = '表格组件加载失败（三个 CDN 都不可达），请检查网络后重试。';
            btn.disabled = false;
            return;
          }
          var qs = '/admin?action=export&q=' + encodeURIComponent(S.q || '')
                 + '&role=' + encodeURIComponent(S.role || '')
                 + '&status=' + encodeURIComponent(S.status || '');

          return api(qs).then(function(j){
            var rows = j.users || [];
            if(!rows.length){
              msg.className = 'msg warn show'; msg.textContent = '当前筛选条件下没有用户可导出';
              btn.disabled = false;
              return;
            }
            var labels = {};
            EXPORT_FIELDS.forEach(function(f){ labels[f.key] = f.label; });
            var head = picked.map(function(k){ return labels[k] || k; });

            var data = [head].concat(rows.map(function(u){
              return picked.map(function(k){ return cellText(k, u); });
            }));

            var ws = XLSX.utils.aoa_to_sheet(data);
            ws['!cols'] = picked.map(function(k){ return { wch: k === 'createdAt' || k === 'lastLoginAt' ? 20 : Math.max(10, (labels[k] || '').length * 2 + 4) }; });
            var wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '用户数据');
            XLSX.writeFile(wb, '班级站用户_' + fmt(new Date(), 'date').replace(/-/g, '') + '.xlsx');

            toast('已导出 ' + rows.length + ' 条记录', 'ok');
            closeModal();
          });
        }).catch(function(e){
          msg.className = 'msg err show';
          msg.textContent = e.message || '导出失败';
          btn.disabled = false;
        });
      };
    }
  });
}

/** 导出时把某个字段格式化成可读文本（角色/状态转中文，时间转本地） */
function cellText(key, u){
  switch(key){
    case 'role':        return u.role === 'admin' ? '管理员' : '普通用户';
    case 'status':      return u.status === 'banned' ? '已禁用' : '正常';
    case 'mustChangePassword': return u.mustChangePassword ? '是' : '否';
    case 'createdAt':   return fmt(u.createdAt);
    case 'lastSeenAt':  return u.lastSeenAt ? fmt(u.lastSeenAt) : '未记录';
    case 'lastLoginAt': return u.lastLoginAt ? fmt(u.lastLoginAt) : '从未登录';
    case 'loginCount':  return u.loginCount || 0;
    case 'dataCount':   return u.dataCount || 0;
    case 'displayName': return u.displayName || '';
    default:            return u[key] === null || u[key] === undefined ? '' : u[key];
  }
}

/* ============================================================================
 * ⑩ 云端内容的读写底座（公告 + 内容共用）

/* 公告/内容在云端的存储方式：存在「系统账号」（优先 AI 助手，其次最早的管理员）
   的 user_data 里，后端接口是 /api/content。

   ⚠️ 2026-10-05 重要修正：
   旧版这里走的是 /api/admin?action=set-data，把内容写进**当前登录管理员自己**的
   user_data；而主站 index.html 读的是 /api/content —— 那个接口当时根本不存在（404），
   前端 .catch 静默吞掉，于是公告一直显示硬编码内容。
   也就是说「管理员改公告 → 同学能看到」从来没生效过。
   现在改为统一走 /api/content，两端终于接上了。

   ⚠️ 2026-10-06：原先的 loadSiteData / saveSiteData 双入口已删除——
   公告与内容合并成「班级内容」面板后，读写统一走
   loadClassContent() / saveClassContent()（见下方 ⑩-A）。 */

/* 已下架的内容类型：旧的「通知」条目不再显示（公告才是正式通知渠道）。
   注意只是不显示，云端数据没删——万一哪天要恢复还能捞回来。 */
var CONTENT_RETIRED_KINDS = ['通知'];

/* 内容面板的条目 ↔ 云端 items 字段名 的双向映射。
   面板里每条是 {kind, title, body}，云端按 kind 归到不同字段。

   ⚠️ 2026-10-06 修正：'活动' 原先是映到 activities 字段，但后端
   api/content.js 的 ALLOW_CONTENT_KEYS 白名单里**没有** activities
   （注释写明：主站 index.html 根本不消费它，加了会造成「后台存进去、
   首页没反应」）。结果是管理员只要选了「活动」，保存就会被 400 拒掉。
   现在统一落到 site_config —— 主站确实读这个键，测试能兜住。 */
var CONTENT_FIELD = {

  '其他':     'site_config'
};

/* items 里「属于内容区」的字段 —— 公告不在其中。
   ⚠️ 2026-10-06 修 bug：以前 contentItemsToArray 遍历 items 的**全部**数组字段，
   而 announcements 也是数组，于是公告会被摊平两次：
   一次作为「公告」、一次被 fieldToKind() 兜底成「其他」。
   表现为列表里每条公告都出现两遍，而且那个「其他」副本一编辑保存
   就会被写进 site_config，等于凭空多出一条永远删不掉的幽灵记录。
   现在只认下面这些真正属于「内容区」的字段。

   ⚠️⚠️ 极其重要：daily_quote（每日一言）和 important_dates（重要日期）

   本面板保存时是全量提交，一旦把 daily_quote 也铺成空数组写上去，
   管理员在「班级内容」里改一条值日安排，就会顺手把 20 句每日一言
   和所有考试日期全部清空 —— 隔壁面板背锅，还极难定位。 */
var CONTENT_ARRAY_FIELDS = [
  'holiday_homeworks',
  'site_config',
  'activities',      /* 后端已拒收，但历史数据里可能有，读出来让管理员能迁走 */
];

/* 本面板有「写权限」的字段子集 —— 上面那些里，activities 只读不写。 */
var CONTENT_WRITABLE_FIELDS = ['holiday_homeworks', 'site_config'];

/* 其它面板拥有的字段：本面板读都不读、写更不写。
   列在这里是为了让「为什么不算进来」这件事有据可查。 */
var CONTENT_OWNED_BY_OTHER_PANELS = ['daily_quote', 'important_dates', 'homework_notice'];
void CONTENT_OWNED_BY_OTHER_PANELS;

function contentItemsToArray(items){
  var out = [];
  CONTENT_ARRAY_FIELDS.forEach(function(f){
    var v = (items || {})[f];
    if(!Array.isArray(v)) return;
    v.forEach(function(x){
      if(!x || typeof x !== 'object') return;
      /* 这条是从哪个云端字段来的 —— 保存时靠它归位，不再靠 kind 猜。
         以前靠 kind→CONTENT_FIELD 反查，遇到 kind 认不出来（比如旧的
         '通知'）就会掉进 site_config，把数据搬错地方。 */
      out.push({
        kind: x.kind || fieldToKind(f),
        cat: x.category || '',
        title: x.title || '',
        body: x.body || '',
        updatedAt: x.updatedAt || null,
        _field: f,
        _src: x                    /* 原始对象，保存时原样写回（形态保真） */
      });
    });
  });
  return out;
}

function fieldToKind(f){
  var m = {
    holiday_homeworks: '作业',
    activities: '活动'
  };
  return m[f] || '其他';
}

/**
 * 拉云端数据并摊平成统一记录数组。
 * 每条记录带 _store 字段标明来源，保存时靠它决定往哪儿写回去。
 */
/** 公告首行（同上，列表/弹窗标题用） */
function annFirstLine(text){
  var line = String(text || '').split('\n')[0].trim();
  if(!line) return '';
  return line.length > 42 ? line.slice(0, 42) + '…' : line;
}

/* ============================================================================
 * 公告置顶（2026-10-07 新增）
 * ------------------------------------------------------------------------
 * 站主要求：公告可以设置「显示置顶」或「永久置顶」。
 * 数据层就两个字段（主站 index.html 的 isImportant() 早就认这两个）：
 *     important: true                  → 永久置顶
 *     important: true + importantUntil → 限时置顶，到点自动失效
 *     important 缺失 / false           → 普通公告
 * 这次要补的是**后台没有地方设置它们**——之前只能靠我手改数据。
 *
 * ⚠️ importantUntil 用 ISO 字符串存；表单用 datetime-local（本地时区，无时区后缀），
 *    两边靠下面两个函数换算。别把 datetime-local 的值直接塞进 importantUntil，
 *    那会被当成 UTC 解析，北京时间会差 8 小时。
 * ========================================================================= */
function annPinState(a){
  a = a || {};
  if(!a.important) return 'none';
  if(a.importantUntil){
    if(new Date(a.importantUntil).getTime() <= Date.now()) return 'expired';
    return 'until';
  }
  return 'forever';
}
function annPinLabel(st){
  return st === 'forever' ? '📌 永久置顶'
       : st === 'until'   ? '⏳ 限时置顶'
       : st === 'expired' ? '⌛ 置顶已过期'
       : '';
}
/** ISO → datetime-local 输入框的值（本地时区） */
function isoToLocalInput(iso){
  var d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  var p = function(n){ return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
       + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/** 新公告的发布时间，格式与线上数据一致（YYYY-MM-DD HH:MM，本地时间）。 */
function annNowStr(){
  var d = new Date();
  var p = function(n){ return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
       + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function loadClassContent(){
  var S = STATE.classcontent;
  api('/content').then(function(j){
    var items = (j && j.items) || {};
    var out = [];

    /* ① 公告：兼容两种形态——
          线上真实形态 { date, text, category }（2026-10-06 实测 70 条全是这个形态），
          旧后台设计形态 { id, title, body, targets, createdAt, updatedAt }。
       正文统一读 text（旧形态兜底 body），标题给列表展示用：没有 title 就取正文首行，
       时间读 date（旧形态兜底 createdAt/updatedAt）。 */
    var ann = Array.isArray(items.announcements) ? items.announcements : [];
    ann.forEach(function(a){
      var text = a.text || a.body || '';
      out.push({
        _store: 'announcement',
        _ref: a,                     /* 原始对象，保存时原样写回（形态保真） */
        kind: '公告',
        cat: a.category || '',       /* 站内板块分类（site/activity/class/misc），面板筛选用 */
        title: a.title || annFirstLine(text),
        body: text,
        targets: a.targets || [],
        time: a.createdAt || a.updatedAt || a.date || null
      });
    });

    /* ② 其它内容：平铺字段里带 kind 的对象数组。
       作业的条目时间兜底用 start~end（线上作业没有 updatedAt）。 */
    contentItemsToArray(items).forEach(function(c){
      if(CONTENT_RETIRED_KINDS.indexOf(c.kind) !== -1) return;   /* 已下架的旧类型 */
      var t = c.updatedAt || null;
      if(!t && c.kind === '作业'){
        var r0 = c._src || {};
        if(r0.start || r0.end) t = (r0.start || '?') + ' ~ ' + (r0.end || '?');
      }
      out.push({
        _store: 'content',
        _ref: c._src,
        _field: c._field,          /* 来自哪个云端字段，保存时归位用 */
        kind: c.kind || '其他',
        title: c.title || (c.kind === '作业' && c._src
          ? ((c._src.start || '?') + ' ~ ' + (c._src.end || '?')) : ''),
        body: c.body || '',
        targets: [],
        time: t
      });
    });

    /* ③ 主站形态的假期作业：holiday_homeworks 里是
          { id, start, end, title, items:[{subject, tasks:[]}] }，
          没有 body 字段。只看 body 会显示成「无正文」，
          所以这里把科目写进 body，让「查看」弹窗（走 hwItemsOf）能正常渲染。 */
    out.forEach(function(r){
      if(r.kind !== '作业' || r.body) return;
      var items0 = hwItemsOf(r._ref);
      if(!items0.length) return;
      r.body = items0.map(function(it){
        var tasks = (it.tasks || []).map(function(t){
          if(t && typeof t === 'object') return (t.text || '(附件)');
          return String(t);
        }).join('；');
        return it.subject + '：' + tasks;
      }).join('\n');
    });

    /* 按时间倒序，新的在前；没有时间的沉底 */
    out.sort(function(a, b){
      var ta = a.time ? Date.parse(a.time) : 0;
      var tb = b.time ? Date.parse(b.time) : 0;
      if(isNaN(ta)) ta = 0;
      if(isNaN(tb)) tb = 0;
      return tb - ta;
    });

    S.list = out;
    paintClassContent();
  }).catch(function(e){
    var p = $('ccPanel');
    if(p) p.innerHTML = '<div class="empty">' + svg('alert', 34) + '<p>加载失败：' + esc(e.message) + '</p></div>';
    var c = $('ccCount');
    if(c) c.textContent = '加载失败';
  });
}

/* 类型 → 徽章配色。公告用红（最抓眼），作业蓝，活动绿，其余灰。 */
function kindBadgeClass(kind){
  var m = { '公告':'badge-red', '作业':'badge-blue', '活动':'badge-green', '课程表':'badge-orange', '值日安排':'badge-orange' };
  return m[kind] || 'badge-gray';
}

function paintClassContent(){
  var S = STATE.classcontent;
  var panel = $('ccPanel');
  if(!panel) return;
  var cnt = $('ccCount');
  if(cnt) cnt.textContent = '共 ' + S.list.length + ' 条';

  if(!S.list.length){
    panel.innerHTML = '<div class="empty">' + svg('layers', 38) + '<p>还没有任何内容</p>'
      + '<p class="muted" style="font-size:.78rem">点左上角「新增内容」发布第一条</p></div>';
    return;
  }

  /* ③ 过滤 + 排序 + 搜索（2026-10-06：站主要求按前端四板块 + 作业分开找，能搜能排）
        分类下拉的值同时匹配公告的板块分类（cat）与「📝 作业」这类 kind。 */
  var rows = S.list;
  if(S.cat && S.cat !== '全部'){
    var catKey = S.cat;
    if(catKey === '__hw__'){
      rows = rows.filter(function(c){ return c.kind === '作业'; });
    } else {
      rows = rows.filter(function(c){ return c.kind === '公告' && (c.cat || '') === catKey; });
    }
  }
  if(S.q){
    var q = S.q.trim().toLowerCase();
    if(q){
      rows = rows.filter(function(c){
        return String(c.title || '').toLowerCase().indexOf(q) >= 0
            || String(c.body || '').toLowerCase().indexOf(q) >= 0;
      });
    }
  }
  rows = rows.slice().sort(function(a, b){
    var ta = Date.parse(String(a.time || '').replace(' ', 'T')) || 0;
    var tb = Date.parse(String(b.time || '').replace(' ', 'T')) || 0;
    return S.sort === 'new' ? (tb - ta) : (ta - tb);
  });

  if(!rows.length){
    panel.innerHTML = '<div class="empty">' + svg('layers', 38) + '<p>当前筛选下没有内容</p>'
      + '<p class="muted" style="font-size:.78rem">换个分类或清空搜索关键词试试</p></div>';
    return;
  }

  panel.innerHTML = '<div class="rec-list">' + rows.map(function(c){
    var i = S.list.indexOf(c);
    var timeTxt = c.time ? fmt(c.time) : '—';
    var scope = (c.kind === '公告')
      ? (c.targets && c.targets.length ? '定向 ' + c.targets.length + ' 人' : '全体同学')
      : '';
    /* 作业不再在后台编辑（2026-10-06）：课代表在前端改，管理员前端改全部 */
    var editBtn = (c.kind === '作业')
      ? ''
      : '<button data-cc-edit="' + i + '">' + svg('edit', 14) + '编辑</button>';
    var pinSt = (c.kind === '公告') ? annPinState(c._ref) : 'none';
    return '<div class="rec">'
      + '<div class="rec-main">'
      +   '<div class="rec-top">'
      +     '<span class="badge ' + kindBadgeClass(c.kind) + '">' + esc(c.kind) + '</span>'
      +     (pinSt !== 'none' ? '<span class="badge badge-orange">' + esc(annPinLabel(pinSt)) + '</span>' : '')
      +     '<b>' + esc(c.title || '(无标题)') + '</b>'
      +   '</div>'
      +   '<div class="rec-meta">'
      +     '<span>' + svg('clock', 12) + esc(timeTxt) + '</span>'
      +     (scope ? '<span>' + svg('users', 12) + esc(scope) + '</span>' : '')
      +     (c.body ? '<span>' + svg('file', 12) + '正文 ' + c.body.length + ' 字</span>' : '<span class="muted">无正文</span>')
      +   '</div>'
      + '</div>'
      + '<div class="rec-act">'
      +   '<button class="view" data-cc-view="' + i + '">' + svg('eye', 14) + '查看</button>'
      +   editBtn
      +   '<button class="danger" data-cc-del="' + i + '">' + svg('trash', 14) + '删除</button>'
      + '</div></div>';
  }).join('') + '</div>';

  bindAll(panel, '[data-cc-view]', 'ccView', function(i){ classContentViewDialog(S.list[i]); });
  bindAll(panel, '[data-cc-edit]', 'ccEdit', function(i){ classContentDialog(i); });
  bindAll(panel, '[data-cc-del]', 'ccDel', function(i){ classContentDelete(i); });
}

/* 小工具：批量绑定 data-xxx 属性上的点击事件（属性名去掉连字符） */
function bindAll(root, sel, dataKey, fn){
  Array.prototype.forEach.call(root.querySelectorAll(sel), function(b){
    b.onclick = function(){ fn(Number(b.dataset[dataKey])); };
  });
}

/**
 * 把统一记录数组写回云端。
 * 按 _store 分派：公告 → announcements 数组；其它 → 按 _field 归位到内容字段。
 * 两者在同一次 PUT 里提交，避免「删了公告但内容没更新」的半截状态。
 *
 * ⚠️ 形态保真（2026-10-06 重写）：写回的是每条记录的 **_ref 原始对象**——
 *    编辑弹窗负责把用户改动直接写进 _ref（公告写 text/date/category，
 *    作业写 items/start/end），这里绝不再重建对象。
 *    旧版在这里按「title/body」重建，把线上公告的 text/date/category
 *    和作业的 items 结构整个丢掉——保存一次等于清空主站数据。
 *
 * ⚠️ 必须**全量**提交。后端 /api/content 的 PUT 是「读旧文档 → 合并 → 写回」，
 *    传什么就覆盖什么。少传一个字段它原样保留，但传了空数组就是「真的要清空」——
 *    这两种语义必须能区分开，所以这里每个内容字段都显式写出来（哪怕是空数组）。
 *    只写「有数据的字段」是不行的：那样删掉最后一条记录时，空数组传不出去，
 *    云端那条记录就永远删不掉了。
 *    ⚠️ 只铺 CONTENT_WRITABLE_FIELDS —— 绝不能碰 daily_quote /
 *    important_dates，那是隔壁专属面板的地盘。
 */
function saveClassContent(list){
  var ann = [];
  var items = {};
  CONTENT_WRITABLE_FIELDS.forEach(function(f){ items[f] = []; });

  (list || []).forEach(function(c){
    var ref = c._ref || {};
    if(c._store === 'announcement'){
      ann.push(ref);
      return;
    }
    /* 归位：优先用记录自带的 _field（历史数据靠它不搬错地方），
       没有就按 kind 现算。再兜一层 —— 算出来的字段必须在可写白名单内，
       否则（比如历史上从 activities 读出来的）一律归到 site_config。 */
    var f = c._field || CONTENT_FIELD[c.kind] || 'site_config';
    if(CONTENT_WRITABLE_FIELDS.indexOf(f) === -1) f = 'site_config';
    items[f].push(ref);
  });

  items.announcements = ann;

  return api('/content', { method:'PUT', body:{ items: items } })
    .then(function(j){
      if(j && j.ok === false) throw new Error(j.error || '保存失败');
      return j;
    });
}
