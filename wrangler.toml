# ============================================================
# Cloudflare Workers 配置
# ------------------------------------------------------------
# 部署：npx wrangler deploy
# 本地调试：npx wrangler dev
#
# 环境变量（如 DATABASE_URL）不要写在这里，用 secret 方式配置：
#   npx wrangler secret put DATABASE_URL
#   npx wrangler secret put ADMIN_USERS
#   npx wrangler secret put ALLOW_ORIGINS
#   npx wrangler secret put SESSION_DAYS
# ============================================================

name = "class-site-api"
main = "api/worker.mjs"
compatibility_date = "2026-10-01"

# ⚠️ 自动部署需要它：CI 不知道你的账号是哪个。
#    填法：Cloudflare 后台 → 右侧栏复制「账户 ID」，或 npx wrangler whoami 里看。
#    这不是敏感信息（不像 API Token），可以放心写进仓库。
#    本地手动 npx wrangler deploy 时不填也能跑（wrangler 会用你登录的账号）。
# account_id = "在这里填你的账户 ID"

# bcryptjs 依赖 Node 的 crypto/stream，开启 nodejs_compat 才能跑
compatibility_flags = ["nodejs_compat"]

# 观察日志（开发期建议开，方便排查）
[observability]
enabled = true

# 非敏感变量可以放这里；敏感信息用 wrangler secret 配置
[vars]
# ⚠️ 必填：允许跨域的前端来源（多个用英文逗号分隔）
# 前端在 GitHub Pages，API 在 Workers，属于跨站，必须列白名单
ALLOW_ORIGINS = "https://yuzikaaang.github.io"

# 管理员用户名
ADMIN_USERS = "yuzikang"

# 会话有效期（天）
SESSION_DAYS = "30"

# 是否允许自助注册（1 开 / 0 关）
# 2026-10-06 关闭：账号改由管理员批量导入（姓名+出生日期初始密码+首登强制改密），
# 不再开放自助注册，防止非本班同学注册看到隐私数据。
ALLOW_REGISTER = "0"

# 构建标记：由 GitHub Actions 在部署时临时追加（不回写仓库）。
# 作用见 api/worker.mjs 里 X-Build-Sha 响应头的注释 —— 用来核对线上跑的是哪份代码。
# 本地部署时是默认值，不影响使用。
BUILD_SHA = "local"

# ============================================================
# 作业附件上传（音频 / 视频 / 图片）—— 2026-10-07 第二十五轮
# ------------------------------------------------------------
# 背景：站主要求「作业的音频和视频不一定要直链，点击上传到服务器也可以」。
#       Workers 自身没有持久存储，必须挂对象存储。这里用 Cloudflare R2。
#
# 【启用步骤（站主操作，约 2 分钟，免费不用绑卡）】
#   1. Cloudflare 后台 → 左侧「R2 对象存储」→「创建存储桶」
#      名称随便起，比如  class-site-uploads
#   2. 把下面的 [[r2_buckets]] 前的 # 去掉，bucket_name 改成你起的名字
#   3. 提交推送（或手动跑一次部署 workflow）
#
# 【不配会怎样】
#   不会出错，只是「上传附件」按钮变灰并提示「改用填直链」。
#   后端会明确回 503 + needSetup（不假装成功），见 api/upload.js。
#
# 【要不要配公开访问域？（可选）】
#   不配也能用：附件通过 /api/upload?action=file&key=... 代理转发，
#   音频/视频照常播放、进度条也能拖。代价是流量走 Worker 额度。
#   想省 Worker 流量就再配一个公开访问：
#     R2 → 你的桶 → 设置 → 公开访问 → 连接自定义域（或开 r2.dev 开发域）
#   然后把地址填到 [vars] 的 UPLOAD_PUBLIC_BASE（例：https://files.classsite.dpdns.org）
# ============================================================

# [[r2_buckets]]
# binding     = "UPLOADS"          # 代码里通过 env.UPLOADS 访问，别改这个值
# bucket_name = "class-site-uploads"   # ← 改成你在 R2 里创建的桶名

# [vars] 里可以加（配了公开域才需要）：
# UPLOAD_PUBLIC_BASE = "https://你的公开域"
